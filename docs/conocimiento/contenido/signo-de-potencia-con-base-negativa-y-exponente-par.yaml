semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.SIGNO_BASE_NEGATIVA_EXPONENTE_PAR
resumen_inicial: Una potencia de base negativa agrupada con paréntesis y exponente par da
  SIEMPRE como resultado un número POSITIVO ($(-a)^{2k} > 0$).
explicacion_simple: 'Cuando multiplicas una cantidad par de signos menos, los signos se cancelan
  de a pares ($- \cdot - = +$):

  - $(-2)^2 = (-2) \cdot (-2) = +4$

  - $(-2)^4 = (-2) \cdot (-2) \cdot (-2) \cdot (-2) = +16$

  Por lo tanto, **base negativa entre paréntesis elevada a exponente par da resultado positivo**.'
explicacion_formal: Sea $-a < 0$ y $n = 2k$ con $k \in \mathbb{N}$ (exponente par). Entonces
  $(-a)^{2k} = [(-a)^2]^k = (a^2)^k = a^{2k} > 0$. Los signos negativos se agrupan en $k$
  parejas de producto positivo.
definiciones_clave: '- **Regla del exponente par**: $(-a)^{\text{par}} = +a^{\text{par}}$.'
propiedades_relaciones: '- **Positividad garantizada**: Toda potencia $(-a)^n$ con $n$ par
  es estrictamente positiva (si $a \neq 0$).'
ejemplo_guiado:
  enunciado: Determina el signo y calcula el valor de $(-3)^4$.
  pasos:
  - Observar que la base es $-3$ (negativa entre paréntesis) y el exponente es $4$ (par).
  - Por la regla de exponente par, el signo final será positivo ($+$).
  - Calcular $3^4 = 81$. Por lo tanto, $(-3)^4 = +81$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el signo del resultado de $(-7)^{50}$?
  choices:
  - text: Positivo (+)
    is_correct: true
  - text: Negativo (-)
    is_correct: false
  - text: Cero
    is_correct: false
  - text: Depende del valor de 7
    is_correct: false
  explanation: 'La correcta es: Positivo (+). Como la base es negativa entre paréntesis y
    50 es un exponente par, el resultado es positivo.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $(-1)^{100}$?
  choices:
  - text: '1'
    is_correct: true
  - text: '-1'
    is_correct: false
  - text: '100'
    is_correct: false
  - text: '-100'
    is_correct: false
  explanation: 'La correcta es: 1. Base -1 con exponente par (100) resulta +1.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base negativa esté entre paréntesis.'
- 'Paso 2: Comprobar si el exponente es par ($2, 4, 6, 8, \dots$).'
- 'Paso 3: Asignar signo positivo ($+$) al resultado final y calcular la potencia del valor
  absoluto.'
errores_correccion: 'No olvides que si no hay paréntesis, el resultado sigue siendo negativo:
  $-3^4 = -81$, pero $(-3)^4 = +81$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $(-6)^2$.
  alternativas:
  - '36'
  - '-36'
  - '-12'
  respuesta: '36'
  solucion_pasos:
  - 'Exponente 2 es par: $(-6)^2 = +36$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el signo del resultado de (-9)^6?
  alternativas:
  - Positivo
  - Negativo
  - Depende de 9
  respuesta: Positivo
  solucion_pasos:
  - El exponente 6 es par, por lo que el resultado es positivo.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (-2)^6?
  alternativas:
  - '64'
  - '-64'
  - '12'
  respuesta: '64'
  solucion_pasos:
  - 'Exponente par: el resultado es positivo, 2^6 = 64.'
- titulo: ¿Es (-5)^4 un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - El exponente 4 es par, por lo que el resultado es positivo (625).
errores_frecuentes:
- Confundir $(-a)^{\text{par}}$ con $-a^{\text{par}}$.
- Pensar que el signo del resultado depende del valor de la base y no solo de la paridad del
  exponente.
- Olvidar verificar que la base negativa esté efectivamente entre paréntesis antes de aplicar
  esta regla.
- Creer que un exponente par siempre indica un resultado mayor, sin considerar el signo.
- Confundir exponente par con exponente positivo.
afirmaciones_verdaderas:
- Base negativa con exponente par da resultado positivo si está entre paréntesis.
- Cuando el exponente par se aplica a una base negativa entre paréntesis, los signos negativos
  se cancelan completamente en pares.
al_terminar_debes_poder: Determinar el signo positivo de potencias de base negativa con exponente
  par.
fuente: Texto escolar MINEDUC.
estado: publicado
