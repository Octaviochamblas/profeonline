semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.SIGNO_BASE_NEGATIVA_EXPONENTE_PAR
resumen_inicial: 'Toda potencia de base negativa escrita entre paréntesis y elevada
  a un exponente entero par resulta siempre en un número estrictamente positivo: $(-a)^{2k}
  > 0$.'
explicacion_simple: Cuando elevamos un número negativo entre paréntesis a un exponente
  par (como 2, 4, 6, 8...), los signos negativos se agrupan de a pares. Como menos
  por menos da más ($(-) \cdot (-) = +$), todos los signos se anulan y el resultado
  final es siempre positivo.
explicacion_formal: 'Para todo $a > 0$ y exponente par $n = 2k$ con $k \in \mathbb{N}_{\ge
  1}$, el **Regla del Signo Par** establece:


  $$(-a)^{2k} = + (a^{2k}) > 0$$


  **Demostración por cancelación de pares de signos:**

  $$(-a)^{2k} = \underbrace{[(-a) \cdot (-a)] \cdot [(-a) \cdot (-a)] \dots [(-a)
  \cdot (-a)]}_{k \text{ parejas de } (+a^2)} = a^{2k}$$


  > **Complemento didáctico:** Ejemplo: $(-2)^4 = (-2) \cdot (-2) \cdot (-2) \cdot
  (-2) = +16$.'
definiciones_clave: '- **Regla de base negativa y exponente par**: Propiedad donde
  $(-a)^{2k} = a^{2k}$ genera un resultado positivo.'
propiedades_relaciones: '- **Positividad par**: $(-a)^{2k} > 0$ para todo $a \neq
  0$.'
ejemplo_guiado:
  enunciado: Determine el signo y el valor numérico de $(-3)^4$.
  pasos:
  - 'Paso 1: Identificar la base $(-3)$ y el exponente $4$ (que es un número par).'
  - 'Paso 2: Agrupar los signos negativos de a pares: $[(-3) \cdot (-3)] \cdot [(-3)
    \cdot (-3)] = (+9) \cdot (+9)$.'
  - 'Paso 3: Calcular el producto final: $9 \cdot 9 = 81$.'
  - 'Conclusión: Como el exponente es par, $(-3)^4 = +81$ (positivo).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo tiene el resultado de (-a)^{2k} cuando una base negativa entre
    paréntesis se eleva a un exponente par?
  choices:
  - text: Siempre positivo (+)
    is_correct: true
  - text: Siempre negativo (-)
    is_correct: false
  - text: Cero siempre
    is_correct: false
  - text: Depende del valor de la base
    is_correct: false
  explanation: La alternativa correcta es 'Siempre positivo (+)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (-3)^4, ¿cuál fue el resultado numérico con
    su signo?
  choices:
  - text: +81 (positivo)
    is_correct: true
  - text: -81 (negativo)
    is_correct: false
  - text: '-12'
    is_correct: false
  - text: '12'
    is_correct: false
  explanation: La alternativa correcta es '+81 (positivo)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base negativa esté encerrada en paréntesis.'
- 'Paso 2: Comprobar que el exponente sea un número par ($2, 4, 6, 8, \dots$).'
- 'Paso 3: Asignar signo POSITIVO ($+$) al resultado final y calcular $a^n$.'
errores_correccion: '- **Error 1: Asignar signo negativo a $(-2)^6$ por tener base
  negativa.** **Cómo corregirlo:** Si el exponente es PAR ($6$), el resultado es OBLIGATORIAMENTE
  POSITIVO ($+64$).


  - **Error 2: Confundir $(-2)^4$ con $-2^4$.** **Cómo corregirlo:** $(-2)^4 = +16$,
  pero $-2^4 = -16$ por falta de paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(-1)^6$.
  alternativas:
  - '1'
  - '-1'
  - '6'
  respuesta: '1'
  solucion_pasos:
  - Exponente par $\implies (-1)^6 = +1$.
- titulo: Ejemplo 2
  enunciado: Calcule $(-10)^2$.
  alternativas:
  - '100'
  - '-100'
  - '20'
  respuesta: '100'
  solucion_pasos:
  - $(-10) \cdot (-10) = 100$.
- titulo: ¿Es (-4)^2 igual a +16?
  respuesta: Sí
  solucion_pasos:
  - Sí, la base es negativa y el exponente 2 es par.
- titulo: ¿Da (-2)^8 un resultado positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, 8 es un número par.
errores_frecuentes:
- Elevar una base negativa entre paréntesis a un exponente par da como resultado un
  número negativo.
- El signo del resultado en $(-a)^{2k}$ depende exclusivamente del tamaño de la base.
- Un exponente par anula el valor numérico de la potencia convirtiéndola en cero.
- Las potencias $(-3)^2$ y $-3^2$ entregan ambas un resultado positivo igual a 9.
- Multiplicar cuatro números negativos entre sí produce un número negativo.
afirmaciones_verdaderas:
- Toda base negativa entre paréntesis elevada a un exponente par resulta en un número
  positivo ($(-a)^{2k} > 0$).
- La anulación de signos se debe a que el número de factores negativos es par y se
  agrupan en parejas de producto positivo.
al_terminar_debes_poder: Al terminar serás capaz de determinar inmediatamente el signo
  positivo de cualquier potencia $(-a)^{2k}$ con base negativa entre paréntesis y
  exponente par.
