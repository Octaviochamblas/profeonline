semantic_id: MAT.ALG.SUMA_DIFERENCIA.ERROR_SIGNO
resumen_inicial: La detección de error de signo en suma por diferencia consiste en auditar el producto de binomios conjugados
  identificando la falsa colocación de un signo más ($+$) en lugar del signo menos ($-$) en la diferencia de cuadrados.
explicacion_simple: "En el producto de binomios conjugados $(a + b)(a - b)$, un error conceptual frecuente es el **error de\
  \ signo en la respuesta**:\n- **En qué consiste el error**: El estudiante calcula los cuadrados $a^2$ y $b^2$, pero escribe\
  \ un **signo más ($+$)** entre ellos, concluyendo erróneamente **$a^2 + b^2$**.\n- **Por qué es un error**:\n  - Al multiplicar\
  \ los segundos términos: $(+b) \\cdot (-b) = \\mathbf{-b^2}$ (¡un positivo por un negativo da NEGATIVO por la ley de signos!).\n\
  \  - La fórmula correcta es **$a^2 - b^2$** (Diferencia de Cuadrados).\n- **Ejemplo**: $(x + 5)(x - 5)$:\n  - Respuesta\
  \ ERRÓNEA: $x^2 + 25$.\n  - Respuesta CORRECTA: **$x^2 - 25$**.\n\n![Detección de error de signo en suma por diferencia](/static/img/nodos/deteccion-de-error-de-signo-en-suma-por-diferencia-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la multiplicación de binomios conjugados $(a + b)(a - b)$ en $\mathbb{R}[x,y]$. Se define la **falla de signo por adición
  ilegítima** como la transformación defectuosa $\mathcal{S}_{\text{falso}}$ que reemplaza el operador de resta por una adición:


  $$\mathcal{S}_{\text{falso}}((a+b)(a-b)) = a^2 + b^2 \quad \neq \quad (a+b)(a-b)$$


  ### Cuantificación de la Discrepancia por Signatura

  La diferencia cuantitativa de auditoría provocada por la inversión del signo del segundo término es igual al doble del cuadrado
  del término substraído:


  $$\Delta = \mathcal{S}_{\text{falso}} - ((a+b)(a-b)) = (a^2 + b^2) - (a^2 - b^2) = 2b^2 \neq 0$$


  Para todo $b \neq 0$, la discrepancia $\Delta = 2b^2$ demuestra la falla estructural de la adición.


  ### Síntesis didáctica

  Exigir la aplicación rigurosa de la ley de signos en el producto de las constantes $(+b)(-b) = -b^2$ elimina la colocación
  errónea de signos positivos en la diferencia de cuadrados.

  '
definiciones_clave: '- **Error de signo en suma por diferencia**: Falla algebraica por la cual se escribe $a^2 + b^2$ en lugar
  de $a^2 - b^2$.

  - **Discrepancia de auditoría por signatura ($\Delta = 2b^2$)**: Error cuantitativo generado al cambiar la resta por una
  suma en el resultado.

  - **Ley de signos en términos opuestos**: Regla por la cual el producto de dos constantes de signos contrarios es estrictamente
  negativo.

  '
propiedades_relaciones: '- **Invarianza de la resta en $\mathbb{R}$**: No existe ningún par de números reales no nulos $a,
  b$ para los cuales $(a+b)(a-b)$ sea igual a $a^2 + b^2$.

  - **Diferencia con la suma de cuadrados en $\mathbb{C}$**: La suma de cuadrados $a^2 + b^2$ sólo se factoriza sobre los
  números complejos $\mathbb{C}$ como $(a + bi)(a - bi)$.

  '
ejemplo_guiado:
  enunciado: 'Audita la siguiente solución e identifica la falla de signo cometida: Problema: Desarrollar $(3x + 2)(3x - 2)$.
    Respuesta del estudiante: $9x^2 + 4$.'
  pasos:
  - 'Paso 1: Examinamos los términos del estudiante: Elevó $(3x)^2 = 9x^2$ y $2^2 = 4$.'
  - 'Paso 2: Observamos el signo intermedio de su respuesta: Colocó un signo **más ($+$)** obteniendo $9x^2 + 4$.'
  - 'Paso 3: Diagnosticamos la falla: El estudiante incurrió en un **error de signo** al no aplicar la ley de signos entre
    $+2$ y $-2$.'
  - 'Paso 4: Multiplicamos los términos constantes: $(+2) \cdot (-2) = \mathbf{-4}$.'
  - 'Paso 5: Escribimos la diferencia de cuadrados correcta: $9x^2 - 4$.'
  - 'Conclusión: La solución del estudiante era errónea. El resultado correcto es **$9x^2 - 4$**.'
  imagen: /static/img/nodos/deteccion-de-error-de-signo-en-suma-por-diferencia-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la respuesta $(x+6)(x-6) = x^2 + 36$ contiene un error de signo?
  choices:
  - text: Porque al multiplicar los términos constantes $(+6) \cdot (-6)$ se obtiene un resultado negativo $-36$, siendo la
      respuesta correcta $x^2 - 36$
    is_correct: true
  - text: Porque $6 \cdot 6$ es 12 y no 36
    is_correct: false
  - text: Porque debió dar un trinomio de tres términos
    is_correct: false
  - text: Porque el término $x^2$ debió ser negativo
    is_correct: false
  explanation: La alternativa correcta es 'Porque al multiplicar los términos constantes $(+6) \cdot (-6)$ se obtiene un resultado
    negativo $-36$, siendo la respuesta correcta $x^2 - 36$'. Ley de signos $(+6)(-6) = -36$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar en $x=0$, ¿qué discrepancia demuestra que $(x+5)(x-5) \neq x^2 + 25$?
  choices:
  - text: Para $x=0$, el lado izquierdo vale $(5)(-5) = -25$ mientras que el lado derecho vale $25$, evidenciando que el signo
      debe ser negativo
    is_correct: true
  - text: Para $x=0$ ambos lados valen 25
    is_correct: false
  - text: El lado izquierdo vale 0 y el derecho vale 25
    is_correct: false
  - text: Demuestra que no hay ningún error
    is_correct: false
  explanation: La alternativa correcta es 'Para $x=0$, el lado izquierdo vale $(5)(-5) = -25$ mientras que el lado derecho
    vale $25$, evidenciando que el signo debe ser negativo'. Discrepancia por sustitución numérica.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Revisar el signo ubicado entre los dos cuadrados del desarrollo.'
- 'Paso 2: Verificar si se colocó un signo positivo ($+$) de adición por equivocación.'
- 'Paso 3: Recordar la ley de signos $(+b) \cdot (-b) = -b^2$ para confirmar la presencia obligatoria del signo menos.'
- 'Paso 4: Corregir la expresión cambiando el signo más por el signo menos para obtener $a^2 - b^2$.'
errores_correccion: '- **Error 1:** Colocar un signo más entre los cuadrados resultantes de binomios conjugados (escribir
  $(a+b)(a-b) = a^2 + b^2$). **Cómo corregirlo:** El producto de un positivo por un negativo **ES SIEMPRE NEGATIVO ($a^2 -
  b^2$)**.

  - **Error 2:** Multiplicar los signos de forma aislada sin relacionarlos con las magnitudes de los términos. **Cómo corregirlo:**
  Se debe **APLICAR LA LEY DE SIGNOS SOBRE CADA PRODUCTO PARCIAL Monómico**.

  '
ejemplos:
- titulo: Detección en binomio simple
  enunciado: ¿Es erróneo afirmar que $(x + 1)(x - 1) = x^2 + 1$?
  alternativas:
  - 'Sí, el signo intermedio debe ser menos: $x^2 - 1$'
  - No, es correcto
  - El error está en el exponente
  respuesta: 'Sí, el signo intermedio debe ser menos: $x^2 - 1$'
  solucion_pasos:
  - 1. $(+1)(-1) = -1$.
  - '2. Desarrollo correcto: $x^2 - 1$.'
- titulo: Prueba de sustitución
  enunciado: Para $x=0$, ¿demuestra $(0+3)(0-3) = -9 \neq +9$ que la resta es obligatoria?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-9 \neq 9$ evidencia la falla de signo.
- titulo: Ley de signos
  enunciado: En la multiplicación de $+b$ por $-b$, ¿es el resultado de los coeficientes estrictamente $-b^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(+)(-) = -$.
- titulo: Diferencia con cuadrado de binomio
  enunciado: ¿Posee el producto de suma por diferencia un signo negativo final a diferencia del cuadrado de binomio cuya constante
    es positiva?
  respuesta: Sí
  solucion_pasos:
  - Sí, en $(a+b)(a-b)$ el término constante es $-b^2$.
errores_frecuentes:
- Escribir un signo de suma (+) entre los dos cuadrados del resultado de binomios conjugados.
- La ley de signos al multiplicar constantes de signos contrarios no es aplicada.
- Intercambiar el signo de la diferencia de cuadrados con el signo positivo final del cuadrado de binomio.
- Cambiar el signo del primer término en lugar del segundo.
- Creer que la expresión $a^2 + b^2$ proviene de multiplicar números reales.
afirmaciones_verdaderas:
- El resultado de multiplicar binomios conjugados lleva obligatoriamente un signo menos entre los dos cuadrados.
- La colocación de un signo más en $a^2 + b^2$ constituye un error de signo al ignorar que $(+b)(-b) = -b^2$.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/deteccion-de-error-de-signo-en-suma-por-diferencia-resumen.svg)


  QUÉ: Detectar, diagnosticar y corregir errores de signo en la expansión de productos de suma por diferencia.

  CÓMO: Verificar la presencia obligatoria del signo menos entre los cuadrados ($a^2 - b^2$) y comprobar por sustitución numérica
  demostrando la discrepancia $\Delta = 2b^2$.

  '
