resumen_inicial: La detección de error de signo en el producto de suma por diferencia
  es la revisión crítica que evita confundir $(a + b)(a - b)$ con el cuadrado de binomio
  o alterar los signos de la diferencia.
explicacion_simple: Un error muy frecuente en exámenes es escribir $(x + 3)(x - 3)
  = x^2 + 9$ poniendo un signo más al final, o poner un término central como $x^2
  - 6x - 9$. El único resultado correcto es $x^2 - 9$. Aprender a detectar estos signos
  mal colocados te asegurará responder bien las preguntas de análisis de errores.
explicacion_formal: 'Sea la confusión estructural entre el producto de binomios conjugados
  y los desarrollos cuadráticos de binomio:


  $$\text{Correcto: } (a + b)(a - b) = a^2 - b^2$$

  $$\text{Error de signo 1: } (a + b)(a - b) \neq a^2 + b^2$$

  $$\text{Error de signo 2: } (a + b)(a - b) \neq a^2 - 2ab - b^2$$


  **Análisis algebraico del error:**

  En $(a + b)(a - b)$, la multiplicación del último término da $(+b) \cdot (-b) =
  -b^2$. Por las leyes de los signos en la multiplicación de reales ($+ \cdot - =
  -$), el segundo término de la diferencia de cuadrados DEBE llevar signo negativo.


  > **Complemento didáctico:** Probar con valores $a=5, b=2$ muestra que $(5+2)(5-2)
  = (7)(3) = 21$, mientras que $5^2 + 2^2 = 29$, demostrando numéricamente la falsedad
  del signo positivo.'
definiciones_clave: '- **Regla de signos de producto**: $+ \cdot - = -$, que determina
  la resta del término $b^2$.

  - **Discriminación de productos notables**: Capacidad de distinguir entre trinomios
  cuadrados y diferencias de cuadrados.'
propiedades_relaciones: '- **Detección de trampas en PAES**: Análisis de alternativas
  con signos erróneos en preguntas de desarrollo algebraico.'
ejemplo_guiado:
  enunciado: Un estudiante resolvió el ejercicio $(2x + 5)(2x - 5)$ obteniendo $4x^2
    + 25$. Señale el error de signo cometido, explique por qué ocurre y escriba el
    resultado correcto.
  pasos:
  - 'Paso 1: Analizar el signo del segundo término: El estudiante escribió $+25$ al
    final.'
  - 'Paso 2: Multiplicar los segundos términos aplicando leyes de signos: $(+5) \cdot
    (-5) = -25$.'
  - 'Paso 3: Identificar que el producto de binomios conjugados genera siempre una
    RESTA de cuadrados.'
  - 'Paso 4: Corregir la expresión al resultado verdadero: $(2x)^2 - 5^2 = 4x^2 -
    25$.'
  - 'Conclusión: El error consistió en poner signo $+25$. El desarrollo correcto es
    $4x^2 - 25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el término $b^2$ en la diferencia de cuadrados $(a + b)(a - b)
    = a^2 - b^2$ lleva SIEMPRE signo negativo?
  choices:
  - text: Por la ley de signos al multiplicar $(+b) \cdot (-b) = -b^2$
    is_correct: true
  - text: Por convención arbitraria
    is_correct: false
  - text: Porque el primer término es siempre negativo
    is_correct: false
  - text: Porque se cancelaron los términos al cuadrado
    is_correct: false
  explanation: La alternativa correcta es 'Por la ley de signos al multiplicar $(+b)
    \cdot (-b) = -b^2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la corrección de $(2x + 5)(2x - 5)$, ¿cuál es la causa de que $+25$
    fuera un error?
  choices:
  - text: Se ignoró que la multiplicación de $+5$ por $-5$ da $-25$
    is_correct: true
  - text: Faltó multiplicar por $2x$
    is_correct: false
  - text: El coeficiente $4$ estaba mal calculated
    is_correct: false
  - text: El exponente debía ser $3$
    is_correct: false
  explanation: La alternativa correcta es 'Se ignoró que la multiplicación de $+5$
    por $-5$ da $-25$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar si el producto de la forma $(a + b)(a - b)$ presenta signo positivo
  en el segundo término.'
- 'Paso 2: Multiplicar los últimos términos $(+b) \cdot (-b) = -b^2$.'
- 'Paso 3: Cambiar el signo del término secundario a negativo para obtener la diferencia
  de cuadrados $a^2 - b^2$.'
errores_correccion: '- **Error 1: Escribir signo positivo en la diferencia de cuadrados
  resultando $a^2 + b^2$.** **Cómo corregirlo:** Recordar que $(+b) \cdot (-b) = -b^2$,
  por lo que la suma por diferencia produce una RESTA.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al revisar la resolución $(x + 6)(x - 6) = x^2 - 12x - 36$, ¿cuáles son
    los DOS errores presentes?
  alternativas:
  - Incluir un término central $-12x$ inexistente y asignar signo incorrecto si fuera
    un cuadrado
  - Elevar al cuadrado el $x$
  - Multiplicar $6 \cdot 6$
  respuesta: Incluir un término central $-12x$ inexistente y asignar signo incorrecto
    si fuera un cuadrado
  solucion_pasos:
  - 1. Los términos cruzados se anulan ($+6x - 6x = 0$).
  - 2. La expresión correcta es $x^2 - 36$.
- titulo: Ejemplo 2
  enunciado: ¿Es numéricamente verdadera la igualdad $(4 + 1)(4 - 1) = 4^2 + 1^2$?
  alternativas:
  - Falsa, porque $(5)(3) = 15$ y $16 + 1 = 17$
  - Verdadera, porque $15 = 15$
  - Falsa, porque $15 = 16$
  respuesta: Falsa, porque $(5)(3) = 15$ y $16 + 1 = 17$
  solucion_pasos:
  - '1. Izquierda: $(5)(3) = 15$.'
  - '2. Derecha: $16 + 1 = 17$. El signo $+$ produce un error de 2 unidades.'
- titulo: ¿Es el desarrollo $(3a + 1)(3a - 1) = 9a^2 - 1$ la única forma correcta
    de signo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3a)^2 - 1^2 = 9a^2 - 1$.
- titulo: ¿La expresión $(x + y)(x - y)$ puede dar como resultado $x^2 + y^2$ en los
    números reales para $y \neq 0$?
  respuesta: 'No'
  solucion_pasos:
  - No, al ser $y \neq 0$, $-y^2$ es strictly distinto de $+y^2$.
errores_frecuentes:
- Declarar que el producto de binomios conjugados resulta en la suma de cuadrados
  $a^2 + b^2$.
- Agregar un término central negativo $-2ab$ al desarrollar el producto de suma por
  diferencia.
- Declarar que la ley de signos $+ \cdot - = -$ no aplica a los términos constantes
  del binomio.
- Asignar signo negativo al primer término obteniendo $-a^2 - b^2$.
- Declarar que $(x + 2)(x - 2)$ es idéntico al trinomio $(x - 2)^2$.
afirmaciones_verdaderas:
- El producto de binomios conjugados genera siempre un signo negativo antecediendo
  al segundo cuadrado.
- La presencia de un término central en el desarrollo de $(a + b)(a - b)$ constituye
  un error de estructura.
al_terminar_debes_poder: Al terminar serás capaz de detectar e identificar inmediatamente
  errores de signo y términos sobrantes en el producto de suma por diferencia.
