semantic_id: MAT.ALG.RESOLUCION_LINEAL.INCOGNITA_AMBOS_MIEMBROS
resumen_inicial: Para resolver ecuaciones con incógnita en ambos lados, se agrupan
  los términos con $x$ en un miembro y las constantes en el otro.
explicacion_simple: 'Cuando la variable $x$ aparece tanto a la izquierda como a la
  derecha del signo igual, el primer objetivo es reunirlas en un solo lado.

  Elegimos el miembro que más nos convenga (normalmente donde quede el coeficiente
  positivo de $x$), traspasamos todas las $x$ a ese miembro cambiando su signo, y
  movemos todos los números sueltos al miembro opuesto.'
explicacion_formal: 'Dada una ecuación con incógnita en ambos miembros $a x + b =
  c x + d$, el **agrupamiento bilateral** trasforma la ecuación en:


  $$a x - c x = d - b \implies (a - c) x = d - b$$


  $$x = \frac{d - b}{a - c} \quad (a \neq c)$$


  **Desglose de la fórmula:**

  - $a x - c x$: Reagrupamiento de los términos con la variable en el primer miembro.

  - $d - b$: Reagrupamiento de las constantes independientes en el segundo miembro.'
definiciones_clave: '- **Ecuación bilateral**: Ecuación que posee términos algebraicos
  con la incógnita en ambos lados de la igualdad.

  - **Reagrupamiento de incógnita**: Concentración de todos los términos con variable
  en un único miembro.'
propiedades_relaciones: '- **Consistencia de la solución**: Mover las variables al
  primer o al segundo miembro produce exactamente el mismo resultado final.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación bilateral $7x - 5 = 3x + 19$ agrupando la incógnita
    en el primer miembro y evalúa la solución.
  pasos:
  - 'Paso 1: Trasponer el término $3x$ del segundo miembro al primer miembro restando:
    $7x - 3x - 5 = 19$.Paso 2: Trasponer la constante $-5$ del primer miembro al segundo
    miembro sumando: $7x - 3x = 19 + 5$.Paso 3: Reducir ambos miembros: $4x = 24$.Paso
    4: Trasponer $4$ dividiendo: $x = \frac{24}{4} = 6$.Paso 5: Comprobar en la ecuación
    original: $7(6) - 5 = 42 - 5 = 37$ y $3(6) + 19 = 18 + 19 = 37$ ($37 = 37$).'
checkpoints:
- placement: after_explicacion_formal
  question: Al trasponer la incógnita y las constantes en $7x - 5 = 3x + 19$, ¿cuál
    es la ecuación reducida equivalente?
  choices:
  - text: $4x = 24$
    is_correct: true
  - text: $10x = 24$
    is_correct: false
  - text: $4x = 14$
    is_correct: false
  - text: $10x = 14$
    is_correct: false
  explanation: La alternativa correcta es '$4x = 24$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $7x - 5 = 3x + 19$, ¿cuál es la solución de $x$?
  choices:
  - text: $x = 6$
    is_correct: true
  - text: $x = 4$
    is_correct: false
  - text: $x = 3$
    is_correct: false
  - text: $x = 8$
    is_correct: false
  explanation: La alternativa correcta es '$x = 6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los términos que contienen la incógnita en ambos lados del
  signo igual.'
- 'Paso 2: Decidir a qué miembro (izquierdo o derecho) conviene trasponer todas las
  incógnitas.'
- 'Paso 3: Trasponer las incógnitas a un miembro cambiando sus signos.'
- 'Paso 4: Trasponer las constantes independientes al miembro opuesto cambiando sus
  signos.'
- 'Paso 5: Reducir términos semejantes y dividir entre el coeficiente resultante.'
errores_correccion: '- **Error común:** Trasponer $3x$ como si estuviera dividiendo
  o trasponerlo manteniendo el signo positivo $+3x$.

  - **Cómo corregirlo:** El término $3x$ es un sumando positivo. Pasa al otro lado
  RESTANDO como $-3x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
