semantic_id: MAT.ALG.RESOLUCION_LINEAL.INCOGNITA_AMBOS_MIEMBROS
resumen_inicial: Para resolver ecuaciones con la incógnita en ambos miembros, se agrupan los términos literales en un miembro y las constantes independientes en el otro.
explicacion_simple: |
  Cuando la variable $x$ aparece tanto a la izquierda como a la derecha del signo igual, el primer objetivo consiste en concentrarlas en un solo lado de la ecuación.

  Traspasamos todos los términos que contienen la incógnita al primer miembro invirtiendo su signo, y trasladamos todos los números independientes al segundo miembro invirtiendo también su signo.

  Una vez reunidos los términos semejantes, la ecuación adopta la forma estándar $Ax = B$, quedando lista para ser despejada por división.
explicacion_formal: |
  ### Definición formal
  Dada una ecuación con términos con variable en ambos miembros $a x + b = c x + d$, el **agrupamiento bilateral** transforma la igualdad según la cadena de equivalencias:

  $$a x - c x = d - b \implies (a - c) x = d - b$$

  $$x = \frac{d - b}{a - c} \quad \text{con } a \neq c$$

  ### Desglose de la fórmula
  - $a x - c x$: Reagrupamiento de los términos literales en el primer miembro mediante el opuesto aditivo de $c x$.
  - $d - b$: Reagrupamiento de las constantes numéricas independientes en el segundo miembro mediante el opuesto aditivo de $b$.

  ### Síntesis didáctica
  Reunir la incógnita en el primer o en el segundo miembro conduce exactamente al mismo resultado numérico gracias a la propiedad simétrica de la igualdad.
definiciones_clave: |
  - **Ecuación bilateral**: Ecuación que posee términos que contienen a la variable en ambos miembros de la igualdad.
  - **Agrupamiento de términos literales**: Reorganización formal para reunir todas las variables en un solo lado antes de reducir.
propiedades_relaciones: |
  - **Consistencia algebraica**: La elección del miembro de reagrupación no altera en absoluto la solución única $x \in \mathbb{R}$.
  - **Condición no trivial**: Si $a = c$, los términos literales se anulan produciendo una identidad ($b = d$) o una contradicción ($b \neq d$).
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación bilateral $7x - 5 = 3x + 19$ agrupando la incógnita en el primer miembro y evalúa la solución.'
  pasos:
    - 'Paso 1: Trasponer el término $3x$ del segundo miembro al primer miembro restando: $7x - 3x - 5 = 19$.'
    - 'Paso 2: Trasponer la constante $-5$ del primer miembro al segundo miembro sumando: $7x - 3x = 19 + 5$.'
    - 'Paso 3: Reducir los términos semejantes en ambos miembros: $4x = 24$.'
    - 'Paso 4: Trasponer $4$ dividiendo al segundo miembro: $x = \frac{24}{4} = 6$.'
    - 'Paso 5: Comprobar sustituyendo $x = 6$ en la ecuación original: $7(6) - 5 = 37$ y $3(6) + 19 = 37$ ($37 = 37$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al trasponer los términos literales e independientes en $7x - 5 = 3x + 19$, ¿cuál es la ecuación reducida equivalente?'
    choices:
      - {text: '$4x = 24$', is_correct: true}
      - {text: '$10x = 24$', is_correct: false}
      - {text: '$4x = 14$', is_correct: false}
      - {text: '$10x = 14$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4x = 24$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver la ecuación bilateral $7x - 5 = 3x + 19$, ¿cuál es el valor de $x$ obtenido?'
    choices:
      - {text: '$x = 6$', is_correct: true}
      - {text: '$x = 4$', is_correct: false}
      - {text: '$x = 3$', is_correct: false}
      - {text: '$x = 8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 6$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los términos que contienen la incógnita $x$ en ambos miembros.'
  - 'Paso 2: Seleccionar el miembro de destino para las incógnitas (usualmente el primer miembro).'
  - 'Paso 3: Trasponer las incógnitas al miembro de destino sumando o restando su opuesto aditivo.'
  - 'Paso 4: Trasponer todas las constantes independientes al miembro opuesto invirtiendo sus signos.'
  - 'Paso 5: Reducir los términos semejantes y dividir entre el coeficiente resultante.'
errores_correccion: |
  - **Error 1:** Trasponer $+3x$ manteniendo su signo positivo al pasar al otro miembro (escribir $7x + 3x$). **Cómo corregirlo:** Al cruzar la igualdad, **TODO TÉRMINO SUMANDO PASA RESTANDO AL MIEMBRO OPUESTO ($7x - 3x$)**.
  - **Error 2:** Intentar dividir entre el término con variable en lugar de trasponerlo restando (escribir $\frac{7x}{3x}$). **Cómo corregirlo:** La variable en el segundo miembro es un sumando, **POR LO QUE DEBE TRANSPOSEERSE POR RESTA Y NO POR DIVISIÓN**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Al resolver $6x + 2 = 2x + 14$, ¿cuál es la ecuación reducida tras agrupar la incógnita?'
    alternativas:
      - '$4x = 12$'
      - '$8x = 16$'
      - '$4x = 16$'
    respuesta: '$4x = 12$'
    solucion_pasos:
      - '1. Restar $2x$: $6x - 2x = 4x$.'
      - '2. Restar $2$: $14 - 2 = 12$.'
      - '3. Ecuación: $4x = 12 \implies x = 3$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la ecuación $2x - 10 = 5x + 5$ reuniendo la incógnita.'
    alternativas:
      - '$x = -5$'
      - '$x = 5$'
      - '$x = -3$'
    respuesta: '$x = -5$'
    solucion_pasos:
      - '1. $2x - 5x = 5 + 10 \implies -3x = 15$.'
      - '2. Despejar $x$: $x = \frac{15}{-3} = -5$.'
  - titulo: 'Agrupación en el segundo miembro'
    enunciado: '¿Agrupar las incógnitas en el segundo miembro $5 = 4x - x$ produce la misma solución que en el primero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la propiedad simétrica garantiza que $3x = 5 \iff 5 = 3x$.'
  - titulo: 'Cancelación de incógnita'
    enunciado: '¿En la ecuación $3x + 4 = 3x + 9$ se cancela la incógnita en ambos lados?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $3x - 3x = 0$, obteniendo la contradicción $4 = 9$.'
errores_frecuentes:
  - 'Trasponer sumando un término literal que estaba sumando en el otro miembro.'
  - 'Dividir ambos lados por la variable para eliminarla en lugar de transponer por resta.'
  - 'Cambiar el signo de constantes que no cambiaron de miembro.'
  - 'Olvidar el signo negativo al despejar cuando el coeficiente de la variable resulta negativo.'
  - 'Sumar coeficientes de miembros opuestos sin trasponer formalmente los términos.'
afirmaciones_verdaderas:
  - 'Resolver ecuaciones bilaterales exige reunir los términos con la variable en un miembro y las constantes en el otro.'
  - 'La transposición de un término literal a otro miembro invierte su signo aditivo.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones de primer grado con la incógnita en ambos miembros.
  CÓMO: Trasponer los términos con la variable al primer miembro y las constantes al segundo miembro mediante sus opuestos aditivos, reducir y despejar la incógnita.
