semantic_id: MAT.ALG.RESOLUCION_LINEAL.INCOGNITA_AMBOS_MIEMBROS
resumen_inicial: 'Resolución de ecuaciones con incógnita en ambos miembros: propiedades,
  resolución y modelamiento en Resolución de ecuaciones lineales.'
explicacion_simple: A veces, las manzanas están repartidas en ambos platillos de la
  balanza. Para saber cuánto pesa una, primero debemos juntarlas todas en un solo
  platillo.
explicacion_formal: '### Definición formal


  Cuando la incógnita aparece en ambos miembros, se suma o resta el mismo término
  algebraico en los dos lados hasta reunir todos los términos con incógnita en un
  solo miembro.


  ### Desarrollo didáctico


  Observa: $5x - 4 = 2x + 11$


  Hay ''x'' a la izquierda y a la derecha. ¿Qué hacemos? Organizar.

  1. Decidimos un lado para las ''x''. Generalmente se elige el izquierdo.

  2. Traemos el $2x$ del lado derecho hacia el izquierdo. Como el $2x$ es positivo,
  se resta $2x$ en ambos miembros.

  3. Llevamos el $-4$ del lado izquierdo hacia el derecho de los números. Cruzará
  sumando ($+4$).


  Nuestra ecuación se convierte en:

  $5x - 2x = 11 + 4$


  Ahora, el problema es súper fácil. Reducimos:

  $3x = 15$

  $x = \frac{15}{3} = 5$.


  *Tip pro:* Siempre conviene pasar la incógnita menor hacia el lado donde está la
  incógnita mayor. Así evitas trabajar con números negativos, y menos signos negativos
  significan menos probabilidad de error.'
