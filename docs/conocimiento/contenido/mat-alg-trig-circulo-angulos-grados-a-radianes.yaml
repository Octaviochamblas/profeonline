  question: ¿Cómo se definen analíticamente el seno y el coseno en el círculo unitario
    para conversión de grados sexagesimales a radianes?
  choices:
  - text: Identificar las coordenadas (cos x, sen x) en el círculo unitario para definir
      círculo unitario y sistemas de medida
    is_correct: true
  - text: Como la suma de los catetos en cualquier triángulo rectángulo no unitario
    is_correct: false
  - text: Igualando la variable del ángulo a cero siempre
    is_correct: false
  - text: Multiplicando el radio por pi elevado a x
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar las coordenadas (cos x, sen
    x) en el círculo unitario para definir círculo unitario y sistemas de medida.
    Definición canónica de las funciones trigonométricas en el círculo unitario.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determinan el período T y la amplitud A de una función de la
    forma f(x) = A sen(Bx + C) + D en conversión de grados sexagesimales a radianes?
  choices:
  - text: Calcular el período como T = 2pi / |B| y la amplitud como |A|
    is_correct: true
  - text: Sumando A + B + C + D independientemente
    is_correct: false
  - text: Igualando la amplitud a 2pi y el período a 1
    is_correct: false
  - text: Dividiendo A entre 2pi sin considerar B
    is_correct: false
  explanation: 'La alternativa correcta es: Calcular el período como T = 2pi / |B|
    y la amplitud como |A|. Fórmulas estándar para amplitud y período en funciones
    sinusoidales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la medida del ángulo en grados.'
- 'Paso 2: Multiplica por $\dfrac{\pi}{180}$.'
- 'Paso 3: Simplifica la fracción resultante si es posible.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en conversión de grados
  sexagesimales a radianes.
ejemplos:
- titulo: Conversión de un ángulo notable
  enunciado: Convierte $45°$ a radianes.
  solucion_pasos:
  - 'Se multiplica: $45\cdot\dfrac{\pi}{180}$.'
  - 'Se simplifica: $\dfrac{\pi}{4}$.'
- titulo: Conversión de un ángulo mayor a $180°$
  enunciado: Convierte $270°$ a radianes.
  solucion_pasos:
  - 'Se multiplica: $270\cdot\dfrac{\pi}{180}$.'
  - 'Se simplifica: $\dfrac{3\pi}{2}$.'
- titulo: ¿$180°$ equivale a $\pi$ radianes?
  enunciado: ¿La conversión de $180°$ a radianes da como resultado $\pi$?
  respuesta: Sí
  solucion_pasos:
  - $180\cdot\dfrac{\pi}{180}=\pi$.
- titulo: ¿Se puede convertir cualquier ángulo en grados a radianes con esta fórmula?
  enunciado: ¿La fórmula $g\cdot\dfrac{\pi}{180}$ sirve para convertir cualquier ángulo,
    incluidos los negativos?
  respuesta: Sí
  solucion_pasos:
  - La fórmula es válida para cualquier valor real de grados, positivo o negativo.
errores_frecuentes:
- Multiplicar por $180/\pi$ en vez de $\pi/180$, invirtiendo la fórmula.
- No simplificar la fracción resultante al final de la conversión.
- Confundir esta conversión con la de radianes a grados.
- Olvidar el símbolo $\pi$ en el resultado, dejando solo el coeficiente numérico.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  conversión de grados sexagesimales a radianes.
