semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.GRADOS_A_RADIANES
resumen_inicial: 'Conversión de medidas angulares de grados sexagesimales a radianes mediante el factor de conversión $\frac{\pi \text{ rad}}{180^\circ}$.'
explicacion_simple: |
  Cuando tienes un ángulo medido en los grados comunes del transportador ($0^\circ$ a $360^\circ$) y necesitas pasarlo al lenguaje matemático de radianes, debes recordar que media vuelta completa ($180^\circ$) equivale exactamente a $\pi \text{ radianes}$. Por lo tanto, para convertir cualquier ángulo en grados a radianes, basta con multiplicar la cantidad de grados por la fracción $\frac{\pi}{180^\circ}$ y luego simplificar la fracción resultante.
explicacion_formal: |
  ### Definición formal
  La **transformación de grados sexagesimales a radianes** es un cambio de escala lineal fundamentado en la proporcionalidad entre la circunferencia completa ($360^\circ$) y su perímetro en radianes ($2\pi \text{ rad}$):
  $$\theta_{\text{rad}} = \theta_{\text{deg}} \cdot \left(\frac{\pi \text{ rad}}{180^\circ}\right)$$

  ### Desglose simbólico
  - $\theta_{\text{deg}}$: Medida del ángulo en grados sexagesimales ($^\circ$).
  - $\theta_{\text{rad}}$: Medida del ángulo expresada en radianes ($\text{rad}$).
  - $\frac{\pi}{180^\circ}$: Factor unitario de conversión donde el numerador y el denominador representan la misma magnitud angular.

  ### Síntesis didáctica
  Multiplicar por el factor $\frac{\pi}{180^\circ}$ cancela la unidad de grados ($^\circ$) en el denominador e introduce la constante adimensional $\pi$ en el numerador. Permite transformar ángulos notables como $30^\circ, 45^\circ, 60^\circ, 90^\circ$ en fracciones exactas de $\pi$.
definiciones_clave: |
  - **Factor de conversión**: Fracción unitaria $\frac{\pi \text{ rad}}{180^\circ}$ usada para transformar la unidad de medida.
  - **Grados sexagesimales**: Sistema de división del círculo en $360$ partes iguales llamadas grados ($^\circ$).
  - **Fracción simplificada de $\pi$**: Representación exacta de radianes en términos del irracional $\pi$ (ej. $\frac{\pi}{6}, \frac{\pi}{4}, \frac{\pi}{3}$).
propiedades_relaciones: |
  - **Conversiones de ángulos notables**:
    - $30^\circ \to 30 \cdot \frac{\pi}{180} = \frac{\pi}{6} \text{ rad}$
    - $45^\circ \to 45 \cdot \frac{\pi}{180} = \frac{\pi}{4} \text{ rad}$
    - $60^\circ \to 60 \cdot \frac{\pi}{180} = \frac{\pi}{3} \text{ rad}$
    - $90^\circ \to 90 \cdot \frac{\pi}{180} = \frac{\pi}{2} \text{ rad}$
ejemplo_guiado:
  enunciado: 'Convierte el ángulo de $135^\circ$ sexagesimales a su valor exacto en radianes.'
  pasos:
    - 'Paso 1: Escribir la fórmula de conversión: $\theta_{\text{rad}} = 135^\circ \cdot \frac{\pi \text{ rad}}{180^\circ}$.'
    - 'Paso 2: Expresar como una única fracción: $\theta_{\text{rad}} = \frac{135 \cdot \pi}{180} \text{ rad}$.'
    - 'Paso 3: Simplificar dividiendo numerador y denominador por su m.c.d. ($45$): $\frac{135 \div 45}{180 \div 45} = \frac{3}{4}$.'
    - 'Paso 4: Escribir el resultado simplificado: $135^\circ = \frac{3\pi}{4} \text{ rad}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el factor de conversión correcto para transformar un ángulo de grados sexagesimales a radianes?'
    choices:
      - {text: '$\frac{\pi}{180^\circ}$', is_correct: true}
      - {text: '$\frac{180^\circ}{\pi}$', is_correct: false}
      - {text: '$\frac{360^\circ}{\pi}$', is_correct: false}
      - {text: '$\frac{\pi}{360^\circ}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{\pi}{180^\circ}$''. Este factor cancela los grados del numerador y deja el resultado en términos de $\pi \text{ rad}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A cuántos radianes equivale un ángulo de $60^\circ$?'
    choices:
      - {text: '$\frac{\pi}{3} \text{ rad}$', is_correct: true}
      - {text: '$\frac{\pi}{6} \text{ rad}$', is_correct: false}
      - {text: '$\frac{\pi}{2} \text{ rad}$', is_correct: false}
      - {text: '$\frac{2\pi}{3} \text{ rad}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{\pi}{3} \text{ rad}$''. Calculando: $60 \cdot \frac{\pi}{180} = \frac{60\pi}{180} = \frac{\pi}{3}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar la cantidad de grados sexagesimales $\theta_{\text{deg}}$.'
  - 'Paso 2: Multiplicar el valor por la fracción $\frac{\pi}{180^\circ}$.'
  - 'Paso 3: Simplificar el número entero $\frac{\theta_{\text{deg}}}{180}$ a su fracción irreducible.'
  - 'Paso 4: Añadir la constante $\pi$ al numerador de la fracción resultante.'
errores_correccion: |
  - **Error 1:** Multiplicar por el factor invertido $\frac{180^\circ}{\pi}$. **Cómo corregirlo:** Si multiplicas por $\frac{180^\circ}{\pi}$, obtendrás grados al cuadrado dividido por $\pi$. Para cancelar los grados del numerador, el $180^\circ$ debe ir obligatoriamente en el denominador.
  - **Error 2:** Olvidar simplificar la fracción numérica resultante. **Cómo corregirlo:** Expresar resultados como $\frac{90\pi}{180}$ es incompleto; siempre se debe simplificar a la forma irreducible como $\frac{\pi}{2}$.
ejemplos:
  - titulo: 'Conversión de 45 grados'
    enunciado: '¿Cuál es la medida en radianes del ángulo de $45^\circ$?'
    alternativas:
      - '$\frac{\pi}{4} \text{ rad}$'
      - '$\frac{\pi}{2} \text{ rad}$'
      - '$\frac{\pi}{8} \text{ rad}$'
    respuesta: '$\frac{\pi}{4} \text{ rad}$'
    solucion_pasos:
      - '1. Multiplicamos: $45 \cdot \frac{\pi}{180}$.'
      - '2. Simplificamos dividiendo entre 45: $\frac{45}{180} = \frac{1}{4}$.'
      - '3. Resultado: $\frac{\pi}{4} \text{ rad}$.'
  - titulo: 'Conversión de un ángulo obtuso'
    enunciado: '¿A cuántos radianes equivale el ángulo de $210^\circ$?'
    alternativas:
      - '$\frac{7\pi}{6} \text{ rad}$'
      - '$\frac{5\pi}{6} \text{ rad}$'
      - '$\frac{7\pi}{4} \text{ rad}$'
    respuesta: '$\frac{7\pi}{6} \text{ rad}$'
    solucion_pasos:
      - '1. Formamos la fracción: $\frac{210\pi}{180}$.'
      - '2. Dividimos entre 30: $\frac{210 \div 30}{180 \div 30} = \frac{7}{6}$.'
      - '3. Resultado: $\frac{7\pi}{6} \text{ rad}$.'
  - titulo: 'Conversión de un ángulo llano'
    enunciado: '¿La conversión de $180^\circ$ a radianes resulta exactamente $\pi \text{ rad}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $180 \cdot \frac{\pi}{180} = \pi \text{ rad}$.'
  - titulo: 'Conversión de giro completo'
    enunciado: '¿Un ángulo de $360^\circ$ convertido a radianes equivale a $2\pi \text{ rad}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $360 \cdot \frac{\pi}{180} = 2\pi \text{ rad}$.'
errores_frecuentes:
  - 'La afirmación de que la conversión de grados a radianes se realiza aplicando el factor $\frac{180^\circ}{\pi}$.'
  - 'La afirmación de que el ángulo de $90^\circ$ convertido a radianes equivale a $\pi \text{ rad}$.'
  - 'La afirmación de que la conversión de un ángulo negativo en grados resulta en un número positivo en radianes.'
  - 'La afirmación de que la constante $\pi$ debe eliminarse o reemplazarse por $3.14$ obligatoriamente en la respuesta final.'
  - 'La afirmación de que los radianes sólo pueden representar ángulos agudos menores a $90^\circ$.'
afirmaciones_verdaderas:
  - 'Para convertir un ángulo de grados sexagesimales a radianes se multiplica la medida por el factor $\frac{\pi}{180^\circ}$.'
  - 'La conversión exacta de los ángulos notables $30^\circ$, $45^\circ$ y $60^\circ$ genera las fracciones $\frac{\pi}{6}$, $\frac{\pi}{4}$ y $\frac{\pi}{3}$ radianes respectivamente.'
al_terminar_debes_poder: |
  QUÉ: Convertir medidas de ángulos desde grados sexagesimales a radianes.
  CÓMO: Multiplicar por el factor de conversión $\frac{\pi}{180^\circ}$ y simplificar la fracción numérica resultante.
