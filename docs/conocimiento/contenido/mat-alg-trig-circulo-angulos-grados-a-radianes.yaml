semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.GRADOS_A_RADIANES
resumen_inicial: 'Conversión de grados sexagesimales a radianes: círculo unitario,
  amplitud, período y transformaciones de Círculo unitario y sistemas de medida.'
explicacion_simple: Como un giro completo equivale a $360°$ y también a $2\pi$ radianes,
  se puede establecer una regla de conversión directa entre ambas unidades.
explicacion_formal: '### Definición formal


  Dado que $360°=2\pi$ radianes, se cumple $1°=\dfrac{2\pi}{360}=\dfrac{\pi}{180}$
  radianes. Por lo tanto, para convertir un ángulo de $g$ grados a radianes, se calcula
  $g\cdot\dfrac{\pi}{180}$.


  ### Desarrollo didáctico


  Para convertir $60°$ a radianes: $60\cdot\dfrac{\pi}{180}=\dfrac{60\pi}{180}=\dfrac{\pi}{3}$.
  Para convertir $150°$: $150\cdot\dfrac{\pi}{180}=\dfrac{150\pi}{180}=\dfrac{5\pi}{6}$.'
definiciones_clave: '- **Conversión de grados sexagesimales a radianes**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a conversión de grados sexagesimales a radianes.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    conversión de grados sexagesimales a radianes.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de conversión de grados sexagesimales a radianes.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
checkpoints:
