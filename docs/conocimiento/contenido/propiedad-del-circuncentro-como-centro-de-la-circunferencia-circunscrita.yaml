semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNFERENCIA_CIRCUNSCRITA_CENTRO
resumen_inicial: La circunferencia circunscrita (o circuncírculo) de un triángulo
  es la única circunferencia que pasa por sus tres vértices, cuyo centro es el circuncentro
  ($O$) y su radio es el circunradio ($R$).
explicacion_simple: '![Circunferencia Circunscrita](/static/img/nodos/propiedad-del-circuncentro-como-centro-de-la-circunferencia-circunscrita-intro.svg)


  Imagina trazar un aro que encierre al triángulo tocando exactamente sus tres esquinas:


  - **Pasa por las tres esquinas**: Los vértices $A, B$ y $C$ están justo sobre la
  línea del círculo.

  - **Centro en el circuncentro**: El centro del círculo es el **circuncentro** ($O$).

  - **Diámetro $2R$**: El diámetro de este círculo se relaciona con los ángulos mediante
  la regla $\frac{a}{\sin \alpha} = 2R$.

  '
explicacion_formal: '### Teorema formal

  El circuncentro $O$ es el centro de la **circunferencia circunscrita** (o circuncírculo)
  $\mathcal{C}(O, R)$, la cual contiene a los tres vértices del triángulo en su periferia:


  $$\{A, B, C\} \subset \mathcal{C}(O, R) \quad \text{con} \quad R = \frac{abc}{4
  \operatorname{Área}(\Delta ABC)} = \frac{a}{2\sin \alpha}$$


  ### Desglose simbólico y geométrico

  - $\mathcal{C}(O, R)$: Circunferencia circunscrita.

  - Ley de Senos extendida: $2R = \frac{a}{\sin \alpha} = \frac{b}{\sin \beta} = \frac{c}{\sin
  \gamma}$.

  - $R = \frac{abc}{4A}$: Relación del circunradio con los tres lados y el área total.


  ### Síntesis didáctica

  La circunferencia circunscrita es la frontera circular exterior mínima que encierra
  al triángulo, conteniendo sus tres vértices.'
definiciones_clave: '- **Circunferencia circunscrita (Circuncírculo)**: Circunferencia
  que contiene a los tres vértices de un polígono.

  - **Teorema del Seno**: Teorema trigonométrico que establece que $\frac{a}{\sin
  \alpha} = 2R$.

  - **Fórmula $A = \frac{abc}{4R}$**: Relación geométrica entre el área, el producto
  de los lados y el circunradio.

  '
propiedades_relaciones: '- **Pertenencia de vértices**: $A, B, C \in \mathcal{C}(O,
  R)$.

  - **Teorema del Seno**: $\frac{a}{\sin \alpha} = \frac{b}{\sin \beta} = \frac{c}{\sin
  \gamma} = 2R$.

  - **Cálculo de circunradio**: $R = \frac{abc}{4\text{Área}}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Circunferencia Circunscrita](/static/img/nodos/propiedad-del-circuncentro-como-centro-de-la-circunferencia-circunscrita-ejemplos.svg)


    En un triángulo, un lado mide $a = 12\text{ cm}$ y su ángulo opuesto mide $\alpha
    = 30^\circ$. Calcula la longitud del circunradio $R$ de la circunferencia circunscrita.

    '
  pasos:
  - 'Paso 1: Aplicar el Teorema del Seno: $\frac{a}{\sin \alpha} = 2R$.'
  - 'Paso 2: Sustituir los valores dados: $\frac{12}{\sin(30^\circ)} = 2R$.'
  - 'Paso 3: Recordar que $\sin(30^\circ) = 0.5 = \frac{1}{2}$: $\frac{12}{0.5} =
    24 = 2R$.'
  - 'Paso 4: Despejar $R$: $R = \frac{24}{2} = 12\text{ cm}$.'
  - 'Paso 5: Concluir que el circunradio mide $12\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué elementos pasa exactamente la circunferencia circunscrita de
    un triángulo?
  choices:
  - text: Por los tres vértices del triángulo
    is_correct: true
  - text: Por los tres puntos medios de los lados
    is_correct: false
  - text: Por los tres pies de las alturas
    is_correct: false
  - text: Es tangente a los tres lados
    is_correct: false
  explanation: La circunferencia circunscrita pasa por los tres vértices del triángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo a / sin(α) = 16 cm, ¿cuánto mide el circunradio R?
  choices:
  - text: $8\text{ cm}$
    is_correct: true
  - text: $16\text{ cm}$
    is_correct: false
  - text: $32\text{ cm}$
    is_correct: false
  - text: $4\text{ cm}$
    is_correct: false
  explanation: El circunradio mide $8\text{ cm}$, ya que $\frac{a}{\sin \alpha} =
    2R \implies 2R = 16 \implies R = 8\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hallar el circuncentro $O$ mediante la intersección de las simetrales.'
- 'Paso 2: Medir la distancia desde $O$ a cualquiera de los vértices para fijar el
  circunradio $R$.'
- 'Paso 3: Trazar con compás la circunferencia con centro en $O$ y radio $R$ verificando
  que pase por $A, B, C$.'
- 'Paso 4: Para cálculos métricos, aplicar $\frac{a}{\sin \alpha} = 2R$ o $R = \frac{abc}{4\text{Área}}$.'
errores_correccion: No confundas el circuncírculo (pasa por los vértices) con el incírculo
  (toca los lados).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Un triángulo tiene lados $a = 5\text{ cm}, b = 6\text{ cm}, c = 7\text{
    cm}$ y área $6\sqrt{6}\text{ cm}^2$. ¿Cuál es la fórmula para calcular su circunradio
    $R$?
  alternativas:
  - $R = \frac{abc}{4\text{Área}}$
  - $R = \frac{\text{Área}}{s}$
  - $R = \frac{a+b-c}{2}$
  respuesta: $R = \frac{abc}{4\text{Área}}$
  solucion_pasos:
  - El circunradio se calcula mediante $R = \frac{abc}{4\text{Área}} = \frac{5 \times
    6 \times 7}{4 \times 6\sqrt{6}} = \frac{210}{24\sqrt{6}} = \frac{35}{4\sqrt{6}}\text{
    cm}$.
- titulo: Ejemplo 2
  enunciado: Si el diámetro de la circunferencia circunscrita es $20\text{ cm}$, ¿cuánto
    vale el cociente $\frac{b}{\sin \beta}$?
  alternativas:
  - $20\text{ cm}$
  - $10\text{ cm}$
  - $40\text{ cm}$
  respuesta: $20\text{ cm}$
  solucion_pasos:
  - 'Por el Teorema del Seno: $\frac{b}{\sin \beta} = 2R = \text{diámetro} = 20\text{
    cm}$.'
- titulo: ¿La circunferencia circunscrita pasa siempre por los tres vértices del triángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición geométrica estricta de circunferencia circunscrita.
- titulo: ¿La circunferencia circunscrita es tangente a los tres lados del triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, la tangente a los tres lados es la circunferencia inscrita.
errores_frecuentes:
- Confundir circunferencia circunscrita con circunferencia inscrita.
- Olvidar que $\frac{a}{\sin \alpha} = 2R$ (diámetro) y no $R$.
- Invertir la fórmula de área y escribir $R = \frac{4\text{Área}}{abc}$.
- Creer que el circuncentro siempre queda dentro de la circunferencia circunscrita
  (el centro siempre es interior al círculo, pero puede ser exterior al triángulo).
- Confundir el circunradio $R$ con el inradio $r$.
afirmaciones_verdaderas:
- La circunferencia circunscrita contiene exactamente a los tres vértices del triángulo.
- El diámetro de la circunferencia circunscrita satisface $2R = \frac{a}{\sin \alpha}$.
al_terminar_debes_poder: '**QUÉ:** Definir, calcular y aplicar las propiedades de
  la circunferencia circunscrita (circuncírculo).


  **CÓMO:** Ubicando el circuncentro como centro, aplicando el Teorema del Seno ($\frac{a}{\sin
  \alpha} = 2R$) y la fórmula del circunradio $R = \frac{abc}{4\text{Área}}$.


  ![Resumen de Circunferencia Circunscrita](/static/img/nodos/propiedad-del-circuncentro-como-centro-de-la-circunferencia-circunscrita-resumen.svg)

  '
