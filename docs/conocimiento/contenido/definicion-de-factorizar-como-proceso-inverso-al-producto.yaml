semantic_id: MAT.ALG.FACTOR_COMUN.CONCEPTO_FACTORIZAR
resumen_inicial: 'Definición de factorizar como proceso inverso al producto: concepto,
  método de descomposición y reglas en Factor común.'
explicacion_simple: Desarrollar transforma un producto en una suma; factorizar recorre
  el camino inverso. Reconocer esta relación permite expresar un polinomio mediante
  factores más simples.
explicacion_formal: '### Definición formal


  Factorizar un polinomio $P$ consiste en expresarlo como un producto de dos o más
  factores $P = F_1 \cdot F_2 \cdots F_k$ que, al distribuirse nuevamente, reconstruyen
  exactamente $P$; es la operación inversa de la multiplicación/distribución de expresiones
  algebraicas.


  ### Desarrollo didáctico


  Es la única que es un producto completo entre $3$ y el binomio $(x+2)$.


  Así como $15 = 3 \cdot 5$, el polinomio se descompone en bloques multiplicativos.


  El lado que consta de multiplicaciones es la forma factorizada.'
definiciones_clave: '- **Definición de factorizar como proceso inverso al producto**:
  Técnica de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en definición de factorizar como proceso inverso
  al producto.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de definición
    de factorizar como proceso inverso al producto.
  pasos:
  - Identificar la estructura o los factores comunes en los términos del polinomio.
  - Aplicar la regla o método correspondiente a definición de factorizar como proceso
    inverso al producto.
  - Expresar el polinomio como un producto de dos o más factores.
  - Verificar multiplicando los factores resultantes.
