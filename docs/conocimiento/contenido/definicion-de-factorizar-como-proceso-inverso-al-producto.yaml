procedimiento:
- Es la única que es un producto completo entre $3$ y el binomio $(x+2)$.
- Así como $15 = 3 \cdot 5$, el polinomio se descompone en bloques multiplicativos.
- El lado que consta de multiplicaciones es la forma factorizada.
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en definición de factorizar como proceso inverso al producto.
ejemplos:
- titulo: La operación inversa de factorizar es distribuir (multiplicar)
  enunciado: ¿La operación inversa de factorizar es distribuir (multiplicar)?
  solucion_pasos:
  - Efectivamente, expandir/distribuir es lo opuesto a factorizar.
  - 'Respuesta: Verdadero'
- titulo: La expresión $2(x+3) + y(x+3)$ se considera un polinomio completamente factorizado
  enunciado: ¿La expresión $2(x+3) + y(x+3)$ se considera un polinomio completamente
    factorizado?
  solucion_pasos:
  - Es una suma de dos grandes términos, aún se debe factorizar el factor común $(x+3)$.
  - 'Respuesta: Falso'
- titulo: 'Respecto de «Definición de factorizar como proceso inverso al producto»:
    ¿Se ajusta a la def'
  enunciado: 'Respecto de «Definición de factorizar como proceso inverso al producto»:
    ¿Se ajusta a la definición esta afirmación? «Factorizar es el proceso inverso
    a multiplicar, transformando sumas en productos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Factorizar es el proceso inverso
    a multiplicar, transformando sumas en productos.'
- titulo: 'Respecto de «Definición de factorizar como proceso inverso al producto»:
    ¿Es compatible con'
  enunciado: 'Respecto de «Definición de factorizar como proceso inverso al producto»:
    ¿Es compatible con el procedimiento esta afirmación? «Multiplicar todos sus términos»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Factorizar es el proceso inverso
    a multiplicar, transformando sumas en productos.'
errores_frecuentes:
- Multiplicar todos sus términos.
- Encontrar el valor numérico de la variable.
- Sumar sus términos semejantes.
- $3x + 6$.
- $x^2 + 2x + 1$.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando definición de factorizar como proceso inverso al producto.
