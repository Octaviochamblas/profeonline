resumen_inicial: Factorizar una expresión algebraica es el proceso inverso a la multiplicación
  polinomial, que consiste en transformar una suma o resta de términos en un producto
  equivalente de factores primos.
explicacion_simple: 'Mientras que multiplicar transforma factores como $a(b + c)$
  en una suma $ab + ac$, factorizar hace lo contrario: toma una suma $ab + ac$ y encuentra
  la multiplicación original $a(b + c)$ de la que proviene.'
explicacion_formal: 'Para todo polinomio $P(x) \in \mathbb{R}[x]$, **Factorizar**
  consiste en descomponer $P(x)$ como el producto de dos o más factores irreducibles
  $F_1(x) \cdot F_2(x) \cdots F_k(x)$:


  $$P(x) = \prod_{i=1}^k F_i(x)$$


  **Desglose simbólico:**

  - $ab + ac$: Expresión en forma de suma algebraica (polinomio expandido).

  - $a(b + c)$: Expresión en forma factorizada (producto de factores).

  - $a$: Factor común extraído mediante la propiedad distributiva $a(b+c) = ab + ac$.


  > **Complemento didáctico:** Expresa la equivalencia lógica $P(x) = Q(x) \cdot R(x)$
  garantizada por el axioma de distributividad del anillo de los polinomios.'
definiciones_clave: '- **Factorización**: Transformación de una suma o diferencia
  en producto de factores.

  - **Factor irreducible**: Polinomio no constante que no puede descomponerse en producto
  de polinomios de menor grado.'
propiedades_relaciones: '- **Inversión de distributividad**: Si la multiplicación
  aplica $a(b+c) \to ab+ac$, la factorización aplica $ab+ac \to a(b+c)$.'
ejemplo_guiado:
  enunciado: Verifique que la suma $6x + 9$ se puede expresar en forma factorizada
    como $3(2x + 3)$.
  pasos:
  - 'Paso 1: Identificar la suma inicial: $6x + 9$.'
  - 'Paso 2: Expresar cada término en sus factores primos: $6x = 3 \cdot 2x$ y $9
    = 3 \cdot 3$.'
  - 'Paso 3: Identificar el factor numérico repetido: $3$.'
  - 'Paso 4: Aplicar la propiedad distributiva invertida: $3(2x + 3)$.'
  - 'Paso 5: Comprobar multiplicando: $3 \cdot 2x + 3 \cdot 3 = 6x + 9$.'
  - 'Conclusión: La forma factorizada equivalente es $3(2x + 3)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste fundamentalmente el proceso de factorizar una expresión
    algebraica?
  choices:
  - text: En transformar una suma o resta en un producto equivalente de factores
    is_correct: true
  - text: En evaluar el valor numérico de las variables
    is_correct: false
  - text: En sumar todos los coeficientes numéricos
    is_correct: false
  - text: En simplificar fracciones algebraicas restando exponentes
    is_correct: false
  explanation: La alternativa correcta es 'En transformar una suma o resta en un producto
    equivalente de factores'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál propiedad algebraica fundamenta la operación inversa entre multiplicar
    y factorizar?
  choices:
  - text: La propiedad distributiva de la multiplicación respecto a la adición
    is_correct: true
  - text: La propiedad asociativa
    is_correct: false
  - text: El axioma del elemento neutro
    is_correct: false
  - text: La propiedad conmutativa
    is_correct: false
  explanation: La alternativa correcta es 'La propiedad distributiva de la multiplicación
    respecto a la adición'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los sumandos de la expresión inicial.'
- 'Paso 2: Encontrar el factor común que multiplica a cada sumando.'
- 'Paso 3: Escribir la expresión como el producto del factor común por la suma de
  los residuos.'
errores_correccion: '- **Error 1: Expresar el resultado final como una suma en lugar
  de un producto de factores.** **Cómo corregirlo:** La factorización DEBE dar como
  resultado un producto ($A \cdot B$), nunca una suma aislada.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la forma factorizada de $4x + 8$?
  alternativas:
  - $4(x + 2)$
  - $4(x + 8)$
  - $2(2x + 8)$
  respuesta: $4(x + 2)$
  solucion_pasos:
  - 1. $4x = 4(x)$ y $8 = 4(2)$.
  - '2. Factorizando 4: $4(x + 2)$.'
- titulo: Ejemplo 2
  enunciado: Al multiplicar $5(a + 3)$ se obtiene $5a + 15$. ¿Cuál es la factorización
    de $5a + 15$?
  alternativas:
  - $5(a + 3)$
  - $15(a + 1)$
  - $5a(1 + 3)$
  respuesta: $5(a + 3)$
  solucion_pasos:
  - 1. Como factorizar es el proceso inverso a multiplicar, la factorización de $5a
    + 15$ es $5(a + 3)$.
- titulo: ¿Es la factorización $2x(y + 3)$ equivalente a la suma $2xy + 6x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, al distribuir $2x \cdot y + 2x \cdot 3 = 2xy + 6x$.
- titulo: ¿Factorizar una expresión altera su valor cuantitativo?
  respuesta: 'No'
  solucion_pasos:
  - No, únicamente cambia su representación formal de suma a producto.
errores_frecuentes:
- Declarar que factorizar una expresión es equivalente a evaluar su valor numérico.
- Declarar que la factorización modifica el resultado cuantitativo del polinomio.
- Sumar los términos en lugar de expresar el polinomio como un producto de factores.
- Declarar que solo los monomios de grado 1 admiten factorización.
- Declarar que la propiedad distributiva solo aplica en el sentido de la multiplicación.
afirmaciones_verdaderas:
- La factorización y la multiplicación polinomial son procesos algebraicos inversos.
- La propiedad distributiva $a(b + c) = ab + ac$ es el sustento algebraico de la extracción
  de factor común.
al_terminar_debes_poder: Al terminar serás capaz de comprender la factorización como
  el proceso inverso del producto polinomial.
