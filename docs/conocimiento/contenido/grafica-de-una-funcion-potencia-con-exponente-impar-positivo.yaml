semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.GRAFICA_IMPAR
resumen_inicial: La gráfica de una función potencia con exponente impar positivo $f(x) = a \cdot x^{2k+1}$ ($k \in \mathbb{Z}^+, a \neq 0$) tiene forma de silla en S (cúbica generalizada), atraviesa el origen $(0, 0)$ como punto de inflexión y presenta simetría central respecto a dicho punto con recorrido $\mathbb{R}$.
explicacion_simple: "![La gráfica de una función potencia con exponente impar positivo $f(x) = a \\cdot x^{2k+1}$ ($k \\in \\mathbb{Z}^+, a \\neq 0$) tiene forma de silla en S (cúbica generalizada), atraviesa el origen $(0, 0)$ como punto de inflexión y presenta simetría central respecto a dicho punto con recorrido $\\mathbb{R}$](/static/img/nodos/grafica-de-una-funcion-potencia-con-exponente-impar-positivo-intro.svg)\n\n\nCuando el exponente es un número **impar positivo ($3, 5, 7...$)**, la gráfica tiene **forma de silla en S**:\n\n- **¿Cómo se mueve la curva?**\n  - No se devuelve como la parábola; **cruza directamente a través del origen $(0, 0)$**.\n  - Si $a > 0$: Viene desde abajo a la izquierda (cuadrante III), cruza por $(0, 0)$ y sube hacia arriba a la derecha (cuadrante I). **¡Es siempre creciente!**\n  - Si $a < 0$: Viene desde arriba a la izquierda (cuadrante II), cruza por $(0, 0)$ y baja hacia la derecha (cuadrante IV). **¡Es siempre decreciente!**\n- **En el centro:** En\
  \ $(0, 0)$ la curva se aplana horizontalmente en un **punto de inflexión**, cambiando de concavidad."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}$ definida por $f(x) = a \\cdot x^{2k+1}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^*$.\n\n**Análisis diferencial y punto de inflexión**:\n1. **Monotonía estricta**:\n   $$f'(x) = (2k+1)a \\cdot x^{2k} \\ge 0 \\quad (\\text{si } a > 0)$$\n   Dado que $f'(x) > 0$ para todo $x \\neq 0$ y $f'(0) = 0$, $f$ es una biyección estrictamente creciente (o decreciente si $a < 0$) en todo $\\mathbb{R}$.\n2. **Punto de inflexión en el origen**:\n   $$f''(x) = (2k+1)(2k)a \\cdot x^{2k-1}$$\n   Como $2k-1$ es impar, $f''(x)$ cambia de signo estrictamente al cruzar $x = 0$, demostrando que $(0, 0)$ es un punto de inflexión topológico donde la tangente es horizontal ($y = 0$)."
definiciones_clave: '- **Cúbica generalizada**: Familia de curvas impares $x^{2k+1}$ caracterizadas por cruce de cuadrantes opuestos.

  - **Punto de inflexión**: Punto $(0, 0)$ donde la curvatura cambia de cóncava a convexa.'
propiedades_relaciones: '- **Invarianza por rotación**: Girar la gráfica 180° sobre $(0, 0)$ reproduce la misma curva.

  - **Biyectividad universal**: Posee inversa continua definida en todo $\mathbb{R}$: $f^{-1}(x) = \sqrt[2k+1]{x/a}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La gráfica de una función potencia con exponente impar positivo $f(x) = a \cdot x^{2k+1}$ ($k \in \mathbb{Z}^+, a \neq 0$) tiene forma de silla en S (cúbica generalizada), atraviesa el origen $(0, 0)$ como punto de inflexión y presenta simetría central respecto a dicho punto con recorrido $\mathbb{R}$](/static/img/nodos/grafica-de-una-funcion-potencia-con-exponente-impar-positivo-ejemplos.svg)



    Analiza y grafica la función cúbica $f(x) = -x^3$:

    1) Halla los puntos para $x = -2, -1, 0, 1, 2$.

    2) Describe el sentido de crecimiento y los cuadrantes por los que transita.

    3) Justifica por qué $(0, 0)$ es un punto de inflexión.'
  pasos:
  - 'Paso 1: Puntos evaluados:

    - $f(-2) = -(-8) = \mathbf{8} \implies (-2, 8)$ (Cuadrante II).

    - $f(-1) = -(-1) = \mathbf{1} \implies (-1, 1)$.

    - $f(0) = \mathbf{0} \implies (0, 0)$ (Punto de inflexión).

    - $f(1) = -(1) = \mathbf{-1} \implies (1, -1)$.

    - $f(2) = -(8) = \mathbf{-8} \implies (2, -8)$ (Cuadrante IV).'
  - 'Paso 2: Como $a = -1 < 0$, la curva es **estrictamente decreciente**, transitando del cuadrante II al IV con recorrido $\mathbb{R}$.'
  - 'Paso 3: Para $x < 0$, $f''''(x) = -6x > 0$ (convexa hacia arriba); para $x > 0$, $f''''(x) = -6x < 0$ (cóncava hacia abajo). Al cambiar de signo en $x = 0$, **$(0, 0)$ es un punto de inflexión**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con la concavidad de la función $f(x) = x^5$ en el origen $(0, 0)$?
  choices:
  - text: Cambia de sentido, haciendo que (0, 0) sea un punto de inflexión
    is_correct: true
  - text: Alcanza un mínimo absoluto
    is_correct: false
  - text: Alcanza un máximo absoluto
    is_correct: false
  - text: Se produce una discontinuidad
    is_correct: false
  explanation: La alternativa correcta es 'Cambia de sentido, haciendo que (0, 0) sea un punto de inflexión'. En funciones con exponente impar $n \ge 3$, la segunda derivada cambia de signo en cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué cuadrantes se sitúa la gráfica de $g(x) = 4x^3$?
  choices:
  - text: Cuadrantes I y III
    is_correct: true
  - text: Cuadrantes I y II
    is_correct: false
  - text: Cuadrantes II y IV
    is_correct: false
  - text: Cuadrantes III y IV
    is_correct: false
  explanation: La alternativa correcta es 'Cuadrantes I y III'. Como $a = 4 > 0$ y el exponente es impar, para $x > 0 \implies y > 0$ (C I) y para $x < 0 \implies y < 0$ (C III).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el exponente $n$ sea un entero impar positivo mayor o igual a 3 ($3, 5, 7...$).'
- 'Paso 2: Marcar el punto de inflexión en el origen $(0, 0)$.'
- 'Paso 3: Evaluar los cuadrantes de tránsito según el signo de $a$ ($a > 0 \implies$ III $\to$ I; $a < 0 \implies$ II $\to$ IV).'
- 'Paso 4: Trazar la curva en forma de S con tangente horizontal en $(0, 0)$.'
errores_correccion: '- **Error común:** Graficar una función impar positiva devolviéndose hacia arriba en los números negativos como si fuera una parábola.

  - **Cómo corregirlo:** Las potencias impares **conservan el signo de la base**: un número negativo elevado a impar **DA RESULTADO NEGATIVO**, por lo que la rama **desciende al cuadrante III** (si $a > 0$).'
ejemplos:
- titulo: 'Ejemplo 1: Tránsito en cuadrantes'
  enunciado: 'La función $f(x) = -2x^5$ pasa por los cuadrantes:'
  alternativas:
  - II y IV
  - I y III
  - I y II
  - III y IV
  respuesta: II y IV
  solucion_pasos:
  - 'Paso 1: Impar con $a = -2 < 0 \implies$ cuadrantes II y IV.'
- titulo: 'Ejemplo 2: Puntos de paso simétricos'
  enunciado: 'Si $(2, 16)$ pertenece a $f(x) = 2x^3$, su punto simétrico es:'
  alternativas:
  - (-2, -16)
  - (-2, 16)
  - (2, -16)
  - (16, 2)
  respuesta: (-2, -16)
  solucion_pasos:
  - 'Paso 1: Simetría impar $(x, y) \leftrightarrow (-x, -y) \implies (-2, -16)$.'
- titulo: 'Ejemplo 3: Monotonía de impar positiva'
  enunciado: ¿Cuál es la monotonía de $g(x) = 0{,}5x^7$ en todo $\mathbb{R}$?
  alternativas:
  - Estrictamente creciente
  - Estrictamente decreciente
  - Crece en los positivos y decrece en los negativos
  - No es monótona
  respuesta: Estrictamente creciente
  solucion_pasos:
  - 'Paso 1: $a = 0{,}5 > 0$ e impar $\implies$ estrictamente creciente en $\mathbb{R}$.'
- titulo: 'Ejemplo 4: Comportamiento en x = 0'
  enunciado: 'En $f(x) = x^3$, el punto $(0, 0)$ es:'
  alternativas:
  - Un punto de inflexión con tangente horizontal
  - Un mínimo local
  - Un máximo local
  - Un vértice parabólico
  respuesta: Un punto de inflexión con tangente horizontal
  solucion_pasos:
  - 'Paso 1: $f''(0) = 0$ y $f''''(x)$ cambia de signo $\implies$ punto de inflexión.'
errores_frecuentes:
- Creer que las funciones impares tienen vértice extremo como las parábolas.
- Olvidar que el recorrido de toda potencia impar positiva es R.
- Confundir la curva de x³ con una recta.
afirmaciones_verdaderas:
- Toda función potencia con exponente impar positivo es una función monótona en forma de S simétrica respecto a (0, 0).
- El origen (0, 0) actúa como punto de inflexión donde la curva cambia de concavidad.
al_terminar_debes_poder: '**QUÉ:** Graficar y caracterizar funciones potencia con exponente impar positivo.


  **CÓMO:** Identificando la forma de silla en S, el punto de inflexión (0, 0), la simetría central y la monotonía en ℝ.


