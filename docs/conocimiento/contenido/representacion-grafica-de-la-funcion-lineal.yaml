semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_GRAFICO
resumen_inicial: La gráfica de una función lineal $f(x) = m x$ es una recta inclinada
  que cruza exactamente por el origen $(0, 0)$.
explicacion_simple: 'Para graficar la función lineal $f(x) = m x$ solo necesitas dos
  puntos:

  1. El primer punto es SIEMPRE el origen $(0, 0)$.

  2. El segundo punto lo obtienes evaluando $x = 1$, dando $(1, m)$.

  3. Unes el origen $(0,0)$ con el punto $(1, m)$ mediante una línea recta inclinada.'
explicacion_formal: 'La **gráfica cartesiana de la función lineal** es la recta inclinada
  no vertical:


  $$G(f) = \{(x, m x) \in \mathbb{R}^2 \mid x \in \mathbb{R}\}\subset \mathbb{R}^2$$


  **Desglose de la fórmula:**

  - Recta que pasa por el origen $(0, 0)$ cuya inclinación con respecto al eje positivo
  $X$ satisface $\tan(\theta) = m$.'
definiciones_clave: '- **Gráfica de función lineal**: Recta inclinada continua que
  intersecta a ambos ejes en el origen cartesiano $(0, 0)$.'
propiedades_relaciones: '- **Simetría impar**: Como $f(-x) = -f(x)$, la gráfica de
  una función lineal es simétrica con respecto al origen de coordenadas.'
ejemplo_guiado:
  enunciado: Grafica la función lineal $f(x) = 4x$ ubicando el origen y un punto de
    apoyo.
  pasos:
  - 'Paso 1: Marcar el punto obligatorio de paso: el origen $(0, 0)$.Paso 2: Evaluar
    $x = 1$: $f(1) = 4(1) = 4 \implies$ marcar el punto $(1, 4)$.Paso 3: Trazar una
    recta inclinada continua que pase por $(0, 0)$ y $(1, 4)$.Paso 4: Concluir la
    construcción de la gráfica de $f(x) = 4x$.'
checkpoints:
- placement: after_explicacion_formal
  question: Para graficar la función lineal $f(x) = 4x$, ¿qué dos puntos son suficientes
    para trazar la recta?
  choices:
  - text: El origen $(0, 0)$ y el punto $(1, 4)$.
    is_correct: true
  - text: El punto $(0, 4)$ y el punto $(4, 0)$.
    is_correct: false
  - text: El punto $(1, 1)$ y el punto $(2, 2)$.
    is_correct: false
  - text: Dos puntos cualesquiera sobre el eje Y.
    is_correct: false
  explanation: La alternativa correcta es 'El origen $(0, 0)$ y el punto $(1, 4)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué cuadrantes se ubica la gráfica de la función lineal $f(x) = 4x$
    de pendiente positiva?
  choices:
  - text: En el I y III cuadrante.
    is_correct: true
  - text: En el II y IV cuadrante.
    is_correct: false
  - text: Únicamente en el I cuadrante.
    is_correct: false
  - text: En todos los cuadrantes simultáneamente.
    is_correct: false
  explanation: La alternativa correcta es 'En el I y III cuadrante.'. (Al ser de pendiente
    positiva y pasar por el origen).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Marcar el origen $(0, 0)$ en el plano cartesiano.'
- 'Paso 2: Calcular el punto $(1, m)$ evaluando $x = 1$.'
- 'Paso 3: Marcar $(1, m)$ en el plano.'
- 'Paso 4: Trazar la recta extendida pasando por ambos puntos.'
errores_correccion: '- **Error común:** Dibujar la recta de una función lineal desfasada
  sin pasar por el origen $(0,0)$.

  - **Cómo corregirlo:** La definición de función lineal exige de forma estricta que
  la recta cruce el punto $(0,0)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
