semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_GRAFICO
resumen_inicial: La gráfica de una función lineal $y = mx$ es una recta que pasa por el origen $(0, 0)$ y queda determinada por un segundo punto $(1, m)$.
explicacion_simple: '![La gráfica de una función lineal $y = mx$ es una recta que pasa por el origen $(0, 0)$ y queda determinada por un segundo punto $(1, m)$](/static/img/nodos/representacion-grafica-de-la-funcion-lineal-intro.svg)



  Para graficar una función lineal $y = mx$ de manera ultra rápida:

  1. Marcas el **origen $(0, 0)$**, que siempre es parte de la gráfica.

  2. Buscas un segundo punto evaluando en $x = 1$, obteniendo el punto $(1, m)$.

  3. Unes ambos puntos con una regla y extiendes la línea recta en ambas direcciones.'
explicacion_formal: "La gráfica de $f(x) = mx$ es el subconjunto de $\\mathbb{R}^2$:\n$$\\text{Graf}(f) = \\{(x, mx) \\in \\mathbb{R}^2 \\mid x \\in \\mathbb{R}\\}$$\n\n**Elementos geométricos:**\n- **Punto fijo**: Origen $O(0, 0)$.\n- **Vector director**: $\\vec{v} = (1, m)$.\n- **Comportamiento por cuadrantes**:\n  - Si $m > 0$: La recta atraviesa el **primer y tercer cuadrante** (creciente).\n  - Si $m < 0$: La recta atraviesa el **segundo y cuarto cuadrante** (decreciente)."
definiciones_clave: '- **Punto de anclaje**: Origen $(0, 0)$ por donde pasan todas las rectas de funciones lineales.

  - **Punto unitario $(1, m)$**: Punto de control que define la inclinación exacta de la recta.'
propiedades_relaciones: '- **Determinación euclidiana**: Dos puntos distintos $((0,0)$ y $(1,m))$ determinan una única recta en el plano.

  - **Simetría impar**: La gráfica de $y = mx$ es invariante bajo una rotación de $180^\circ$ respecto al origen.'
ejemplo_guiado:
  enunciado: '![Ejemplo La gráfica de una función lineal $y = mx$ es una recta que pasa por el origen $(0, 0)$ y queda determinada por un segundo punto $(1, m)$](/static/img/nodos/representacion-grafica-de-la-funcion-lineal-ejemplos.svg)



    Grafica la función lineal $f(x) = -2x$ indicando los cuadrantes por los que pasa y dos puntos principales.'
  pasos:
  - 'Paso 1: Fijar el primer punto en el origen: $(0, 0)$.'
  - 'Paso 2: Calcular el punto en $x = 1$: $f(1) = -2(1) = -2 \implies (1, -2)$.'
  - 'Paso 3: Calcular un punto simétrico en $x = -1$: $f(-1) = -2(-1) = 2 \implies (-1, 2)$.'
  - 'Paso 4: Trazar la recta continua que une $(-1, 2)$, $(0, 0)$ y $(1, -2)$.'
  - 'Paso 5: Observar que atraviesa el segundo y cuarto cuadrante (pendiente negativa).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por cuáles cuadrantes pasa la gráfica de una función lineal con pendiente positiva $m > 0$?
  choices:
  - text: Cuadrantes I y III
    is_correct: true
  - text: Cuadrantes II y IV
    is_correct: false
  - text: Cuadrantes I y II
    is_correct: false
  - text: Cuadrantes III y IV
    is_correct: false
  explanation: La alternativa correcta es 'Cuadrantes I y III'. Al ser creciente y pasar por (0,0), ocupa el primer y tercer cuadrante.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al graficar $y = 3x$, si partes del origen y avanzas 2 unidades a la derecha en el eje X, ¿cuántas unidades debes subir en el eje Y?
  choices:
  - text: 6 unidades
    is_correct: true
  - text: 3 unidades
    is_correct: false
  - text: 5 unidades
    is_correct: false
  - text: 2 unidades
    is_correct: false
  explanation: La alternativa correcta es '6 unidades'. $\Delta y = m \cdot \Delta x = 3(2) = 6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Marcar el punto $(0, 0)$ en el plano cartesiano.'
- 'Paso 2: Evaluar la función en un valor conveniente de $x$ (ej: $x = 1$ o el denominador de $m$).'
- 'Paso 3: Marcar el segundo punto $(x_1, y_1)$ en el plano.'
- 'Paso 4: Trazar la recta continua infinita que une ambos puntos con una regla.'
errores_correccion: '- **Error común:** Desplazar la recta hacia arriba o hacia abajo en el eje Y haciéndola pasar por $(0, n)$ con $n \neq 0$.

  - **Cómo corregirlo:** Recuerda que la función lineal **no tiene corte fuera del origen**; su eje de rotación es siempre $(0, 0)$.'
ejemplos:
- titulo: 'Ejemplo 1: Pendiente con fracción'
  enunciado: Para graficar $y = \frac{3}{4}x$, ¿qué punto de coordenadas enteras es el más cómodo además de $(0,0)$?
  alternativas:
  - (4, 3)
  - (3, 4)
  - (1, 3/4)
  - (4, 12)
  respuesta: (4, 3)
  solucion_pasos:
  - 'Paso 1: Elegir $x = 4$ para cancelar el denominador.'
  - 'Paso 2: $y = \frac{3}{4}(4) = 3 \implies (4, 3)$.'
- titulo: 'Ejemplo 2: Cuadrantes ocupados'
  enunciado: ¿Por cuáles cuadrantes pasa la recta $y = -5x$?
  alternativas:
  - Cuadrantes II y IV
  - Cuadrantes I y III
  - Solo cuadrante II
  - Cuadrantes I y IV
  respuesta: Cuadrantes II y IV
  solucion_pasos:
  - 'Paso 1: La pendiente es negativa ($m = -5 < 0$).'
  - 'Paso 2: Las rectas lineales decrecientes pasan por los cuadrantes II y IV.'
- titulo: 'Ejemplo 3: Pendiente desde gráfica'
  enunciado: Una recta lineal pasa por $(0,0)$ y por $(-3, -9)$. ¿Cuál es su fórmula?
  alternativas:
  - f(x) = 3x
  - f(x) = -3x
  - f(x) = 9x
  - f(x) = x/3
  respuesta: f(x) = 3x
  solucion_pasos:
  - 'Paso 1: $m = \frac{-9}{-3} = 3$.'
  - 'Paso 2: $f(x) = 3x$.'
- titulo: 'Ejemplo 4: Comparación de inclinaciones'
  enunciado: Entre $y = 2x$ e $y = 6x$, ¿cuál recta está más empinada (más pegada al eje Y)?
  alternativas:
  - y = 6x, porque tiene mayor pendiente
  - y = 2x, porque es más suave
  - Ambas tienen la misma inclinación
  - Depende del cuadrante
  respuesta: y = 6x, porque tiene mayor pendiente
  solucion_pasos:
  - 'Paso 1: A mayor pendiente absoluta $|m|$, mayor inclinación vertical.'
errores_frecuentes:
- Trazar la recta sin pasar por el origen (0, 0).
- Invertir la dirección de avance subiendo en X en vez de Y.
- Confundir cuadrantes en pendientes negativas.
afirmaciones_verdaderas:
- La gráfica de una función lineal es una recta oblicua que pasa necesariamente por el origen.
- Una función lineal con m > 0 se sitúa en los cuadrantes I y III, mientras que con m < 0 se sitúa en los cuadrantes II y IV.
al_terminar_debes_poder: '**QUÉ:** Trazar e interpretar gráficas de funciones lineales en el plano cartesiano.


  **CÓMO:** Utilizando el punto pivote en el origen (0, 0) y un punto de control (1, m) según el signo de la pendiente.


  ![Resumen La gráfica de una función lineal $y = mx$ es una recta que pasa por el origen $(0, 0)$ y queda determinada por un segundo punto $(1, m)$](/static/img/nodos/representacion-grafica-de-la-funcion-lineal-resumen.svg)'
