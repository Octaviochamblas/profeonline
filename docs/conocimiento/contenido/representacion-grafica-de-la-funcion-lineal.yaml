semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_GRAFICO
resumen_inicial: La representación gráfica de una función lineal $f(x) = mx$ es una recta oblicua que cruza obligatoriamente por el origen $(0, 0)$.
explicacion_simple: |
  Para graficar una **función lineal** $f(x) = mx$:

  1. Marca siempre el origen $(0, 0)$ en el centro del gráfico.
  2. Evalúa un segundo punto ingresando $x = 1$, lo que da el punto $(1, m)$.
  3. Coloca una regla uniendo $(0, 0)$ con $(1, m)$ y traza la línea recta.
explicacion_formal: |
  Dada la función lineal $f(x) = mx$ ($m \neq 0$), su gráfica en $\mathbb{R}^2$ es el conjunto continuo:

  $$\text{Graf}(f) = \{(x, mx) \mid x \in \mathbb{R}\}$$

  **Propiedades gráficas fundamentales:**
  - Pasa por el origen de coordenadas $(0, 0)$.
  - Pasa por el punto de pendiente $(1, m)$.
  - Si $m > 0$, ocupa el 1.er y 3.er cuadrante.
  - Si $m < 0$, ocupa el 2.º y 4.º cuadrante.
definiciones_clave: |
  - **Gráfica de función lineal**: Recta oblicua que atraviesa el origen cartesiano y cuya inclinación depende de la constante $m$.
propiedades_relaciones: |
  - **Constante $b = 0$**: La ausencia de término independiente desplaza el intercepto $Y$ al valor cero exacto.
ejemplo_guiado:
  enunciado: "Grafica la función lineal $f(x) = -3x$ identificando el origen y un segundo punto auxiliar."
  pasos:
    - 'Paso 1: Identificar el punto de origen obligatorio: $(0, 0)$.'
    - 'Paso 2: Evaluar un segundo punto en $x = 1$: $f(1) = -3(1) = -3 \implies$ punto $(1, -3)$.'
    - 'Paso 3: Marcar los puntos $(0, 0)$ y $(1, -3)$ en el plano cartesiano.'
    - 'Paso 4: Trazar la recta continua que une ambos puntos observando su descenso (decreciente).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por cuáles cuadrantes del plano cartesiano pasa la gráfica de la función lineal $f(x) = -3x$?"
    choices:
      - {text: "Por el segundo y cuarto cuadrante.", is_correct: true}
      - {text: "Por el primer y tercer cuadrante.", is_correct: false}
      - {text: "Únicamente por el primer cuadrante.", is_correct: false}
      - {text: "Por todos los cuatro cuadrantes simultáneamente.", is_correct: false}
    explanation: "La alternativa correcta es 'Por el segundo y cuarto cuadrante.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Cuántos puntos se necesitan como mínimo para trazar la gráfica de una función lineal?"
    choices:
      - {text: "Dos puntos (el origen $(0,0)$ y un segundo punto $(1, m)$)", is_correct: true}
      - {text: "Un solo punto es suficiente", is_correct: false}
      - {text: "Al menos cinco puntos", is_correct: false}
      - {text: "Diez puntos para asegurar la curvatura", is_correct: false}
    explanation: "La alternativa correcta es 'Dos puntos (el origen $(0,0)$ y un segundo punto $(1, m)$)'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la pendiente $m$ en la expresión $f(x) = mx$.'
  - 'Paso 2: Marcar el punto fijo $(0, 0)$ en el origen.'
  - 'Paso 3: Calcular las coordenadas de un segundo punto de prueba $(1, m)$.'
  - 'Paso 4: Trazar la recta continua que une ambos puntos con una regla.'
errores_correccion: |
  - **Error común:** Desplazar la gráfica hacia arriba o abajo cortando al eje $Y$ en un valor distinto de cero.
  - **Cómo corregirlo:** La función LINEAL **SIEMPRE pasa por el origen $(0,0)$**. Si la recta corta al eje $Y$ en otro punto, se trata de una función AFÍN.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Para graficar la función lineal $f(x) = mx$, es obligatorio calcular al menos cinco puntos distintos.'
  - 'La gráfica de la función lineal $f(x) = -3x$ pasa por el punto $(0, -3)$ en el eje vertical.'
  - 'El gráfico de una función lineal es una curva parabólica que pasa por el origen $(0, 0)$.'
  - 'Trazar la gráfica de $f(x) = mx$ exige incluir una constante de desplazamiento vertical $b \neq 0$.'
  - 'La recta de una función lineal no puede atravesar el segundo ni el cuarto cuadrante.'
afirmaciones_verdaderas:
  - 'La gráfica de una función lineal $f(x) = mx$ es una recta que pasa siempre por el origen de coordenadas $(0, 0)$.'
  - 'Para trazar su gráfica basta con determinar el origen $(0, 0)$ y un segundo punto $(1, m)$ obtenido de la pendiente.'
al_terminar_debes_poder: |
  QUÉ: Representar gráficamente funciones lineales en el plano cartesiano.
  CÓMO: Ubicar el origen $(0, 0)$, evaluar un segundo punto $(1, m)$ usando la pendiente y trazar la recta que une ambos puntos.
