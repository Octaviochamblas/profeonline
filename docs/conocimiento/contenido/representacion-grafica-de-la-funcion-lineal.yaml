semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_GRAFICO
resumen_inicial: 'Representación gráfica de la función lineal: conceptos, representación
  y propiedades en Función constante y función lineal.'
explicacion_simple: Toda función lineal comparte un punto de partida obligatorio en
  su gráfica, el origen, y desde ahí se despliega en línea recta según su pendiente.
explicacion_formal: '### Definición formal


  La gráfica de $f(x) = mx$ es el conjunto $\{(x, mx) : x \in \mathbb{R}\}$, una recta
  que satisface $f(0)=0$, por lo que necesariamente pasa por el origen del sistema
  de coordenadas. La inclinación de la recta queda determinada por el signo y magnitud
  de $m$.


  ### Desarrollo didáctico


  Para graficar, basta con el origen $(0,0)$ y un segundo punto obtenido evaluando
  la función en cualquier otro valor de $x$; con esos dos puntos, se traza la recta
  completa.


  Si $f(x) = 2x$: el origen $(0,0)$ y el punto $(1,2)$ determinan la recta completa,
  que se extiende infinitamente en ambas direcciones.'
definiciones_clave: '- **Representación gráfica de la función lineal**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a representación gráfica de la función lineal.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a representación gráfica
    de la función lineal.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a representación gráfica de la función
    lineal.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    representación gráfica de la función lineal?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en función constante y función lineal
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en función constante y función lineal. Es la condición
    de existencia y unicidad en representación gráfica de la función lineal.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en representación gráfica
    de la función lineal, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Marca el origen $(0,0)$, que siempre pertenece a la gráfica.'
- 'Paso 2: Evalúa la función en un valor de $x$ distinto de cero para obtener un segundo
  punto.'
- 'Paso 3: Traza la recta que une ambos puntos, extendiéndola en ambas direcciones.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar representación gráfica de la función lineal.
ejemplos:
- titulo: Gráfica con pendiente positiva
  enunciado: Grafica $f(x) = 3x$ usando el origen y un segundo punto.
  solucion_pasos:
  - El origen $(0,0)$ pertenece a la gráfica.
  - $f(1) = 3$, dando el punto $(1,3)$.
  - Se traza la recta que une $(0,0)$ y $(1,3)$.
- titulo: Gráfica con pendiente negativa
  enunciado: Grafica $f(x) = -x$ usando el origen y un segundo punto.
  solucion_pasos:
  - El origen $(0,0)$ pertenece a la gráfica.
  - $f(2) = -2$, dando el punto $(2,-2)$.
  - Se traza la recta que une $(0,0)$ y $(2,-2)$.
- titulo: ¿Toda recta que pasa por el origen representa una función lineal?
  enunciado: ¿Toda recta que pasa por el origen representa una función lineal?
  respuesta: 'No'
  solucion_pasos:
  - La recta vertical $x=0$ pasa por el origen pero no representa una función (viola
    el criterio de la línea vertical).
- titulo: ¿El punto $(0,0)$ siempre pertenece a la gráfica de una función lineal?
  enunciado: ¿El punto $(0,0)$ siempre pertenece a la gráfica de una función lineal?
  respuesta: Sí
  solucion_pasos:
  - Toda función lineal cumple $f(0)=0$, así que el origen siempre está en su gráfica.
errores_frecuentes:
- Olvidar que el origen siempre debe estar marcado como punto de la recta.
- Confundir la gráfica de una función lineal con una que no pasa por el origen (afín).
- Calcular mal el segundo punto por errores de evaluación.
- Trazar la recta solo en el primer cuadrante, ignorando que se extiende en ambas
  direcciones.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando representación
  gráfica de la función lineal.
