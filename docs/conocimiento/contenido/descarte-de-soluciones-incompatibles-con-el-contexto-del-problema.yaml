procedimiento:
- 'Paso 1: Obtén el conjunto solución algebraico del modelo.'
- 'Paso 2: Revisa qué condiciones adicionales impone el contexto: no negatividad,
  enteros, capacidad máxima, etcétera.'
- 'Paso 3: Compara cada tipo de valor permitido por el álgebra con esas condiciones
  contextuales.'
- 'Paso 4: Descarta los valores que violen el significado real de la variable.'
- 'Paso 5: Formula la respuesta final usando solo soluciones compatibles con el problema.'
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en descarte de soluciones incompatibles
  con el contexto del problema.
ejemplos:
- titulo: Cantidad discreta de productos
  enunciado: La desigualdad de un problema entrega $x \leq 6.25$, donde $x$ representa
    la cantidad de cajas que pueden comprarse. Explica qué valores deben descartarse.
  solucion_pasos:
  - Algebraicamente, cualquier número real menor o igual que $6.25$ cumple la desigualdad.
  - Como $x$ representa cajas, solo tienen sentido valores enteros no negativos.
  - Deben descartarse los valores fraccionarios y la interpretación contextual útil
    llega hasta $x=6$.
- titulo: Tiempo no negativo
  enunciado: En un modelo de duración se obtiene $t > -2$. Explica por qué el contexto
    modifica la interpretación.
  solucion_pasos:
  - Algebraicamente, la solución incluye todos los reales mayores que $-2$.
  - Si $t$ representa tiempo transcurrido, los valores negativos no son admisibles
    en ese contexto.
  - La interpretación contextual habitual pasa a ser $t \geq 0$.
- titulo: ¿Una solución fraccionaria puede descartarse si la variable representa personas?
  respuesta: Sí
  solucion_pasos:
  - Las personas se cuentan en números enteros.
  - Aunque el modelo algebraico admita fracciones, el contexto impone una restricción
    de integralidad.
- titulo: ¿Si un valor satisface la desigualdad, siempre debe aceptarse como respuesta
    final?
  respuesta: 'No'
  solucion_pasos:
  - Además de satisfacer la desigualdad, la solución debe respetar el significado
    de la variable y las condiciones del problema.
  - Por eso algunas soluciones algebraicamente válidas se descartan en la interpretación
    final.
errores_frecuentes:
- Aceptar cantidades negativas cuando el contexto representa objetos o personas.
- Dar como respuesta final un valor fraccionario para una variable discreta sin justificarlo.
- Creer que interpretar el contexto modifica la resolución algebraica original.
- Descartar valores válidos solo por intuición, sin revisar las restricciones del
  problema.
- Omitir en la respuesta final la condición contextual que justifica el descarte.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  descarte de soluciones incompatibles con el contexto del problema.
