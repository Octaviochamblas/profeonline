semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.DESCARTE_SOLUCION_CONTEXTUAL
resumen_inicial: El descarte de soluciones consiste en eliminar aquellos valores del
  conjunto solución matemático que son físicamente imposibles en el mundo real.
explicacion_simple: 'La matemática pura no sabe de física o economía.

  Si la solución de una inecuación de tiempo o personas da $x \ge -5$, matemáticamente
  el número $-2$ es una solución válida.

  Sin embargo, **EN EL MUNDO REAL NO EXISTEN TIEMPOS NI PERSONAS NEGATIVAS**.

  Por ello, aplicamos el dominio físico ($x \ge 0$) y descartamos los números negativos,
  ajustando el conjunto solución a $x \ge 0$.'
explicacion_formal: 'Dada la solución matemática $S_{\text{math}} \subset \mathbb{R}$
  y el dominio físico o contextual $D_{\text{real}} \subset \mathbb{R}$ (donde frecuentemente
  $D_{\text{real}} = \mathbb{R}^+$ o $\mathbb{Z}^+$), el **conjunto solución físicamente
  válido** $S_{\text{real}}$ se formaliza como:


  $$S_{\text{real}} = S_{\text{math}} \cap D_{\text{real}}$$


  **Desglose de la fórmula:**

  - Filtra y elimina elementos de $S_{\text{math}}$ incompatibles con las leyes físicas
  o del dominio del problema.'
definiciones_clave: '- **Dominio de realidad ($D_{\text{real}}$)**: Conjunto de restricciones
  de existencia física (no negatividad, cantidades enteras discretas).

  - **Descarte contextual**: Eliminación de valores numéricos que satisfacen la inecuación
  matemática pero violan la lógica del contexto.'
propiedades_relaciones: '- **Restricción implícita de no negatividad**: Distancias,
  tiempos, masas, personas y precios deben ser no negativos ($x \ge 0$).'
ejemplo_guiado:
  enunciado: La resolución de una inecuación que modela la cantidad de personas $x$
    que asisten a un evento da como solución matemática el intervalo $S_{\text{math}}
    = ]-10, 15]$. Determina el conjunto solución físicamente válido $S_{\text{real}}$.
  pasos:
  - 'Paso 1: Identificar la solución matemática: $-10 < x \le 15$.Paso 2: Identificar
    la restricción contextual: las personas son cantidades discretas no negativas
    ($x \in \mathbb{Z}_0^+$).Paso 3: Descartar los números negativos del intervalo:
    eliminar los valores entre $-10$ y $-1$.Paso 4: Intersecar con la realidad: $S_{\text{real}}
    = \{0, 1, 2, \dots, 15\}$.Paso 5: Concluir que la asistencia válida es de $0$
    a $15$ personas.'
checkpoints:
- placement: after_explicacion_formal
  question: Dada la solución matemática de personas $S_{\text{math}} = ]-10, 15]$,
    ¿cuál es el rango de valores físicamente válidos en el contexto real?
  choices:
  - text: Desde $0$ hasta $15$ personas enteras.
    is_correct: true
  - text: Desde $-10$ hasta $15$ personas.
    is_correct: false
  - text: Solo el número $-10$.
    is_correct: false
  - text: Todos los números reales infinitos.
    is_correct: false
  explanation: La alternativa correcta es 'Desde $0$ hasta $15$ personas enteras.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué es obligatorio descartar los valores negativos entre $-10$ y
    $-1$ en este problema?
  choices:
  - text: Porque no pueden existir cantidades negativas de personas en la realidad.
    is_correct: true
  - text: Porque los números negativos no se pueden sumar.
    is_correct: false
  - text: Because 15 es un número impar.
    is_correct: false
  - text: Es una regla optativa.
    is_correct: false
  explanation: La alternativa correcta es 'Porque no pueden existir cantidades negativas
    de personas en la realidad.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener la solución matemática de la inecuación $S_{\text{math}}$.'
- 'Paso 2: Identificar las restricciones de existencia del contexto (ejemplo: $x \ge
  0$).'
- 'Paso 3: Intersecar el intervalo con $x \ge 0$ descartando zonas negativas.'
- 'Paso 4: Declarar la solución $S_{\text{real}}$ final.'
errores_correccion: '- **Error común:** Aceptar valores negativos como respuestas
  de problemas de distancia, tiempo o cantidad de personas.

  - **Cómo corregirlo:** Recuerda SIEMPRE filtrar la solución matemática con la realidad
  física ($x \ge 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento con desigualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Frases como 'como máximo' se traducen con la desigualdad no estricta \\le?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'como máximo' fija un límite superior inclusivo ($\\le$).
- titulo: ¿Es necesario descartar soluciones negativas al modelar magnitudes físicas
    reales como masa o personas?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el dominio físico impone restricciones de no negatividad ($x \\ge 0$).
errores_frecuentes:
- Usar el signo igual (=) en lugar de una desigualdad al modelar restricciones contextuales
  de límites máximos o mínimos.
- Sumar directamente porcentajes de concentración o aleación en lugar de calcular
  las masas de componente puro.
- Olvidar que la masa o volumen agregado afecta tanto al numerador (fino) como al
  denominador (total) de la mezcla.
- Redondear soluciones discretas en la dirección contraria a la exigida por la inecuación
  de restricción.
- Aceptar soluciones matemáticas negativas en problemas que involucran variables físicas
  reales como tiempo, masa o personas.
afirmaciones_verdaderas:
- Al modelar restricciones de presupuesto o capacidad máxima se deben emplear desigualdades
  del tipo $M(x) \le K$.
- El conjunto solución matemáticamente obtenido debe filtrarse con el dominio físico
  real descartando valores negativos o incompatibles.
al_terminar_debes_poder: Al finalizar este recurso podrás modelar problemas contextuales
  mediante inecuaciones, interpretando y descartando soluciones según la realidad
  física.
