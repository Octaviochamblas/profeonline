semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.DESCARTE_SOLUCION_CONTEXTUAL
resumen_inicial: 'Descarte de soluciones incompatibles con el contexto del problema:
  relaciones de orden, intervalos y resolución en Modelamiento con desigualdades.'
explicacion_simple: A veces la cuenta algebraica entrega un valor correcto desde el
  punto de vista simbólico, pero absurdo desde el punto de vista real. No toda solución
  matemática sirve como respuesta contextual.
explicacion_formal: '### Definición formal


  Sea $S$ el conjunto solución algebraico de un modelo y sea $D$ el conjunto de valores
  permitidos por el contexto (por ejemplo, $x \geq 0$, $x \in \mathbb{Z}$ o cotas
  materiales del problema). El conjunto de respuestas válidas es

  $$S_{\text{válido}} = S \cap D.$$

  Una solución se descarta cuando pertenece a $S$ pero no pertenece a $D$. El descarte
  no corrige el desarrollo algebraico: solo reconoce que el modelo debe interpretarse
  dentro de condiciones semánticas adicionales.


  ### Desarrollo didáctico


  Si una desigualdad dice que "puedes comprar a lo más $6.25$ cuadernos", el álgebra
  está bien, pero el contexto obliga a pensar en cantidades enteras. Entonces la respuesta
  útil no es "6.25 cuadernos", sino la mayor cantidad entera que aún cumple la restricción.

  Este análisis es clave para no responder con valores imposibles, negativos o incompatibles
  con el mundo real.'
definiciones_clave: '- **Descarte de soluciones incompatibles con el contexto del
  problema**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a descarte de soluciones incompatibles
  con el contexto del problema.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de descarte de soluciones
    incompatibles con el contexto del problema.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de descarte de soluciones incompatibles con
    el contexto del problema, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
