semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.DESCARTE_SOLUCION_CONTEXTUAL
resumen_inicial: El descarte de soluciones consiste en eliminar aquellos valores del conjunto solución matemático que son físicamente imposibles en el mundo real.
explicacion_simple: '![Descarte de soluciones incompatibles con el contexto del problema](/static/img/nodos/descarte-de-soluciones-incompatibles-con-el-contexto-del-problema-intro.svg)


  La matemática pura no sabe de física o economía.


  Si la solución de una inecuación de tiempo o personas da $x \ge -5$, matemáticamente el número $-2$ es una solución válida.


  Sin embargo, **EN EL MUNDO REAL NO EXISTEN TIEMPOS NI PERSONAS NEGATIVAS**.


  Por ello, aplicamos el dominio físico ($x \ge 0$) y descartamos los números negativos, ajustando el conjunto solución a $x \ge 0$.'
explicacion_formal: 'Dada la solución matemática $S_{\text{math}} \subset \mathbb{R}$ y el dominio físico o contextual $D_{\text{real}} \subset \mathbb{R}$ (donde frecuentemente $D_{\text{real}} = \mathbb{R}^+$ o $\mathbb{Z}^+$), el **conjunto solución físicamente válido** $S_{\text{real}}$ se formaliza como:


  $$S_{\text{real}} = S_{\text{math}} \cap D_{\text{real}}$$


  **Desglose de la fórmula:**

  - Filtra y elimina elementos de $S_{\text{math}}$ incompatibles con las leyes físicas o del dominio del problema.

  '
definiciones_clave: '- **Dominio de realidad ($D_{\text{real}}$)**: Conjunto de restricciones de existencia física (no negatividad, cantidades enteras discretas).

  - **Descarte contextual**: Eliminación de valores numéricos que satisfacen la inecuación matemática pero violan la lógica del contexto.

  '
propiedades_relaciones: '- **Restricción implícita de no negatividad**: Distancias, tiempos, masas, personas y precios deben ser no negativos ($x \ge 0$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Descarte de soluciones incompatibles con el contexto del problema](/static/img/nodos/descarte-de-soluciones-incompatibles-con-el-contexto-del-problema-ejemplos.svg)


    La resolución de una inecuación que modela la cantidad de personas $x$ que asisten a un evento da como solución matemática el intervalo $S_{\text{math}} = ]-10, 15]$. Determina el conjunto solución físicamente válido $S_{\text{real}}$.'
  pasos:
  - 'Paso 1: Identificar la solución matemática: $-10 < x \le 15$.'
  - 'Paso 2: Identificar la restricción contextual: las personas son cantidades discretas no negativas ($x \in \mathbb{Z}_0^+$).'
  - 'Paso 3: Descartar los números negativos del intervalo: eliminar los valores entre $-10$ y $-1$.'
  - 'Paso 4: Intersecar con la realidad: $S_{\text{real}} = \{0, 1, 2, \dots, 15\}$.'
  - 'Paso 5: Concluir que la asistencia válida es de $0$ a $15$ personas.'
checkpoints:
- placement: after_explicacion_formal
  question: Dada la solución matemática de personas $S_{\text{math}} = ]-10, 15]$, ¿cuál es el rango de valores físicamente válidos en el contexto real?
  choices:
  - text: Desde $0$ hasta $15$ personas enteras.
    is_correct: true
  - text: Desde $-10$ hasta $15$ personas.
    is_correct: false
  - text: Solo el número $-10$.
    is_correct: false
  - text: Todos los números reales infinitos.
    is_correct: false
  explanation: La alternativa correcta es 'Desde $0$ hasta $15$ personas enteras.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué es obligatorio descartar los valores negativos entre $-10$ y $-1$ en este problema?
  choices:
  - text: Porque no pueden existir cantidades negativas de personas en la realidad.
    is_correct: true
  - text: Porque los números negativos no se pueden sumar.
    is_correct: false
  - text: Porque 15 es un número impar.
    is_correct: false
  - text: Es una regla optativa.
    is_correct: false
  explanation: La alternativa correcta es 'Porque no pueden existir cantidades negativas de personas en la realidad.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener la solución matemática de la inecuación $S_{\text{math}}$.'
- 'Paso 2: Identificar las restricciones de existencia del contexto (ejemplo: $x \ge 0$).'
- 'Paso 3: Intersecar el intervalo con $x \ge 0$ descartando zonas negativas.'
- 'Paso 4: Declarar la solución $S_{\text{real}}$ final.'
errores_correccion: '- **Error común:** Aceptar valores negativos como respuestas de problemas de distancia, tiempo o cantidad de personas.

  - **Cómo corregirlo:** Recuerda SIEMPRE filtrar la solución matemática con la realidad física ($x \ge 0$).

  '
ejemplos:
- titulo: 'Ejemplo 1: No negatividad en conteo'
  enunciado: Al resolver un problema de producción de mesas se obtiene la inecuación matemática $x \leq 10$. ¿Cuál es el conjunto de soluciones reales contextualmente válidas?
  alternativas:
  - $\{0, 1, 2, \dots, 10\}$
  - $]-\infty, 10]$
  - $[0, 10]$
  - $[1, 10]$
  respuesta: $\{0, 1, 2, \dots, 10\}$
  solucion_pasos:
  - 'Paso 1: Las mesas no pueden ser negativas ni decimales.'
  - 'Paso 2: Se descartan los negativos e infinitos, quedando los enteros $\{0, 1, \dots, 10\}$.'
- titulo: 'Ejemplo 2: Longitudes geométricas'
  enunciado: El lado de un cuadrado mide $x - 5\text{ cm}$. Si el área debe ser menor que $100\text{ cm}^2$, ¿cuál es el rango real para $x$?
  alternativas:
  - $5 < x < 15$
  - $x < 15$
  - $0 < x < 15$
  - $-15 < x < 15$
  respuesta: $5 < x < 15$
  solucion_pasos:
  - 'Paso 1: Por geometría, el lado debe ser positivo: $x - 5 > 0 \implies x > 5$.'
  - 'Paso 2: Del área: $(x - 5)^2 < 100 \implies x - 5 < 10 \implies x < 15$.'
  - 'Paso 3: Intersección: $5 < x < 15$.'
- titulo: 'Ejemplo 3: Tiempos de viaje'
  enunciado: Un modelo de tiempo de traslado da como solución matemática $t \in ]-3, 4]\text{ h}$. ¿Cuál es el tiempo admisible en la realidad?
  alternativas:
  - $]0, 4]\text{ h}$
  - $[-3, 4]\text{ h}$
  - $4\text{ h}$
  - $[0, 4]\text{ h}$
  respuesta: $]0, 4]\text{ h}$
  solucion_pasos:
  - 'Paso 1: El tiempo transcurrido debe ser estrictamente positivo ($t > 0$).'
  - 'Paso 2: Descartando los negativos resulta $]0, 4]\text{ h}$.'
- titulo: 'Ejemplo 4: Descarte de soluciones vacías'
  enunciado: Si la solución matemática de una cantidad física de artículos da $x \leq -2$, ¿cuál es la conclusión contextual?
  alternativas:
  - El problema no tiene solución viable en la realidad ($S = \emptyset$)
  - Se deben producir $2$ artículos
  - Se pierden $2$ artículos
  - La solución es $0$
  respuesta: El problema no tiene solución viable en la realidad ($S = \emptyset$)
  solucion_pasos:
  - 'Paso 1: No se pueden fabricar cantidades negativas de artículos ($x \ge 0$).'
  - 'Paso 2: Como $]-\infty, -2] \cap [0, +\infty[ = \emptyset$, no existe solución viable.'
errores_frecuentes:
- En un problema sobre cantidad de personas $n \in \mathbb{N}$, el conjunto solución $n > -3{,}5$ admite valores negativos como soluciones reales válidas.
- Al resolver un problema de producción de unidades $x$, el intervalo $]-\infty, 10]$ representa soluciones físicamente aplicables en la realidad.
- Cualquier número real obtenido del despeje matemático de una inecuación es automáticamente válido en el contexto real del enunciado.
- En un problema sobre edades o masas, la solución $x \le 0$ no requiere descarte por ser un valor entero.
- El descarte contextual altera la corrección del algoritmo matemático del despeje analítico.
afirmaciones_verdaderas:
- El contexto real de un problema impone restricciones del dominio (como no negatividad o intringulis enteros $x \in \mathbb{N}_0$) que obligan a descartar soluciones algebraicas incompatibles.
- La solución contextual válida resulta de intersecionar el conjunto solución algebraico con las restricciones reales del problema.
al_terminar_debes_poder: '**QUÉ:** Descartar soluciones matemáticas que resulten inviables en el contexto físico.


  **CÓMO:** Intersectando el intervalo algebraico con las restricciones de no negatividad ($x \ge 0$) y dominios físicos válidos de longitud, tiempo y masa.


  ![Resumen Descarte de soluciones incompatibles con el contexto del problema](/static/img/nodos/descarte-de-soluciones-incompatibles-con-el-contexto-del-problema-resumen.svg)'
