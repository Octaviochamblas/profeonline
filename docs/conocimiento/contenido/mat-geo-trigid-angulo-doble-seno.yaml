    se considera un triángulo rectángulo con cateto $a = 1389\text{ cm}$ e hipotenusa
    $c = 4168\text{ cm}$. Calcula el valor de la función trigonométrica.
  pasos:
  - Aplicar la definición trigonométrica de identidad del seno del ángulo doble.
  - Sustituir los lados $a = 1389$ y $c = 4168$.
  - Calcular el valor exacto o aproximado de la razón.
