semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.ANGULO_DOBLE_SENO
resumen_inicial: 'Identidad del seno del ángulo doble: conceptos, teoremas, propiedades
  geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Esta identidad es un caso particular de la fórmula del seno de
  una suma, cuando ambos ángulos que se suman son iguales (α=β=x).
explicacion_formal: '![Seno del ángulo doble](/static/img/geometria/trigonometria/trigid-angulo-doble-seno.svg)


  ### Definición formal


  Haciendo $\alpha=\beta=x$ en la identidad $\sin(\alpha+\beta)=\sin\alpha\cos\beta+\cos\alpha\sin\beta$,
  se obtiene $\sin(2x)=\sin x\cos x+\cos x\sin x=2\sin x\cos x$.


  ### Desarrollo didáctico


  En la figura, θ=35° y 2θ=70°. Se puede verificar que sin70°=2·sin35°·cos35°, en
  vez de calcular sin70° de forma independiente.'
definiciones_clave: '- **Identidad del seno del ángulo doble**: Elemento o propiedad
  fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identidad del seno del ángulo doble.'
ejemplo_guiado:
