procedimiento:
- 'Paso 1: Verifica si la situación descrita presenta un patrón que se repite regularmente.'
- 'Paso 2: Confirma que la variación entre valores extremos sea suave, no abrupta.'
- 'Paso 3: Si se cumplen ambas condiciones, considera un modelo trigonométrico (seno
  o coseno).'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en reconocimiento de fenómenos
  periódicos modelables mediante funciones trigonométricas.
ejemplos:
- titulo: Reconocimiento de un fenómeno periódico
  enunciado: ¿Es periódica la variación de la temperatura promedio mensual a lo largo
    de varios años?
  solucion_pasos:
  - Se repite un patrón anual: temperaturas altas en verano, bajas en invierno, año
      tras año.
  - Sí, es un fenómeno periódico, modelable con una función trigonométrica.
- titulo: Distinción respecto a un fenómeno no periódico
  enunciado: ¿Es periódico el crecimiento de una población que aumenta indefinidamente
    cada año?
  solucion_pasos:
  - No hay repetición de valores; la población sigue creciendo sin volver a valores
    anteriores.
  - No es periódico; correspondería más bien a un modelo exponencial o polinomial.
- titulo: ¿Todo fenómeno que varía con el tiempo es periódico?
  enunciado: ¿Cualquier fenómeno que cambia con el tiempo se puede modelar como periódico?
  respuesta: 'No'
  solucion_pasos:
  - Solo los fenómenos que repiten su patrón después de un intervalo fijo son periódicos.
- titulo: ¿El movimiento de un péndulo simple es un fenómeno periódico?
  enunciado: ¿El movimiento oscilante de un péndulo simple es un ejemplo de fenómeno
    periódico?
  respuesta: Sí
  solucion_pasos:
  - Repite su posición y velocidad después de cada oscilación completa, en un intervalo
    de tiempo fijo.
errores_frecuentes:
- Declarar un fenómeno que crece de forma constante con uno periódico.
- No verificar que la variación sea suave, aplicando el modelo a fenómenos con saltos
  bruscos.
- Suponer que todo fenómeno cíclico se ajusta exactamente a una función seno o coseno
  pura.
- Ignorar la necesidad de datos suficientes para confirmar la periodicidad observada.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  reconocimiento de fenómenos periódicos modelables mediante funciones trigonométricas.
