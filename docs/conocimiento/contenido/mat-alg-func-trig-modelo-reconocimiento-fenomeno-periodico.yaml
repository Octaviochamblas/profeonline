semantic_id: MAT.ALG.FUNC_TRIG_MODELO.RECONOCIMIENTO_FENOMENO_PERIODICO
resumen_inicial: 'Reconocimiento de fenómenos periódicos modelables mediante funciones
  trigonométricas: círculo unitario, amplitud, período y transformaciones de Modelamiento
  trigonométrico y extensiones.'
explicacion_simple: Muchos fenómenos de la vida cotidiana, como las mareas, la temperatura
  diaria o el movimiento de un péndulo, se repiten siguiendo un patrón regular a lo
  largo del tiempo.
explicacion_formal: '### Definición formal


  Una situación se modela con una función trigonométrica cuando existe un intervalo
  fijo $T$ (el periodo) tal que el estado del fenómeno en el instante $t$ es idéntico
  al estado en $t+T$, y la variación entre valores máximos y mínimos es suave, no
  abrupta.


  ### Desarrollo didáctico


  La altura de la marea sube y baja repitiendo su patrón cada aproximadamente $12$
  horas; la temperatura diaria sube durante el día y baja durante la noche, repitiendo
  el ciclo cada $24$ horas. Ambos son ejemplos de fenómenos periódicos modelables
  con funciones trigonométricas.'
definiciones_clave: '- **Reconocimiento de fenómenos periódicos modelables mediante
  funciones trigonométricas**: Función periódica fundamentada en las coordenadas del
  círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a reconocimiento de fenómenos periódicos modelables mediante funciones
  trigonométricas.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    reconocimiento de fenómenos periódicos modelables mediante funciones trigonométricas.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de reconocimiento de fenómenos periódicos modelables mediante
    funciones trigonométricas.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
