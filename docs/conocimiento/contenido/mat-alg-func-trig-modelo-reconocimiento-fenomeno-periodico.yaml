semantic_id: MAT.ALG.FUNC_TRIG_MODELO.RECONOCIMIENTO_FENOMENO_PERIODICO
resumen_inicial: 'Reconocimiento de fenómenos naturales y cotidianos periódicos modelables mediante funciones trigonométricas armónicas.'
explicacion_simple: |
  En el mundo real existen procesos que se repiten una y otra vez exactamente del mismo modo a intervalos de tiempo regulares. Ejemplos de esto son las mareas del océano, el nivel de luz solar en el día, la altura en una rueda de la fortuna, la respiración o los latidos del corazón. Cuando un fenómeno oscila entre un valor máximo y un valor mínimo a un ritmo constante, decimos que es un **fenómeno periódico** y puede ser representado analíticamente usando funciones trigonométricas como el seno o el coseno.
explicacion_formal: |
  ### Definición formal
  Un fenómeno o variable física $y = f(t)$ es **modelable trigonométricamente** si existe una constante de tiempo $T > 0$ (período de oscilación) tal que:
  $$f(t + T) = f(t) \quad \forall t \in \mathbb{R}$$
  y sus valores se encuentran acotados de forma continua y simétrica entre una cota superior $y_{\max}$ y una cota inferior $y_{\min}$, permitiendo su representación mediante la ecuación armónica general:
  $$y(t) = A\sin(Bt + C) + D \quad \text{o} \quad y(t) = A\cos(Bt + C) + D$$

  ### Desglose simbólico
  - Criterio de periodicidad: Repetición exacta del patrón cada intervalo de tiempo $T$.
  - Criterio de acotación: Oscilación fluida entre un techo $y_{\max}$ y un piso $y_{\min}$.
  - Variable independiente $t$: Tiempo transcurrido (en segundos, horas, meses, etc.).

  ### Síntesis didáctica
  Identificar un fenómeno periódico exige verificar dos condiciones clave: 1) que el proceso sea repetitivo en un período $T$ constante, y 2) que el cambio sea suave y continuo (sin saltos bruscos).
definiciones_clave: |
  - **Fenómeno periódico**: Proceso cuyos valores se repiten idénticamente cada intervalo fijo de tiempo o espacio.
  - **Modelamiento armónico**: Ajuste de un fenómeno cíclico a las funciones seno o coseno.
  - **Período del fenómeno ($T$)**: Duración o tiempo necesario para completar un ciclo u oscilación entera.
propiedades_relaciones: |
  - **Aplicaciones multidisciplinarias**: Se aplica en física (ondas de sonido, corriente alterna), biología (ritmos cardíacos), astronomía (órbitas) y meteorología (temperaturas estacionales).
  - **No modelabilidad de procesos lineales**: Fenómenos con crecimiento o decrecimiento indefinido no se pueden modelar directamente con senos o cosenos aislados.
ejemplo_guiado:
  enunciado: 'Un carrusel tarda $40$ segundos en dar una vuelta completa. La altura de un asiento oscila entre $1$ metro y $5$ metros sobre el suelo. Explica por qué este fenómeno es periódico y determina $T$, $y_{\max}$ e $y_{\min}$.'
  pasos:
    - 'Paso 1: Identificar la repetición del patrón: el asiento sube y baja regresando a la misma posición exactamente cada $40$ segundos. Por ende, es un fenómeno periódico.'
    - 'Paso 2: Determinar el período de oscilación: $T = 40$ segundos.'
    - 'Paso 3: Identificar la altura máxima alcanzada: $y_{\max} = 5$ metros.'
    - 'Paso 4: Identificar la altura mínima alcanzada: $y_{\min} = 1$ metro.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes situaciones del mundo real se clasifica como un fenómeno periódico modelable mediante funciones trigonométricas?'
    choices:
      - {text: 'La altura de las mareas en la costa a lo largo de las $24$ horas del día', is_correct: true}
      - {text: 'El valor de la inflación acumulada a lo largo de un siglo', is_correct: false}
      - {text: 'La distancia recorrida por un automóvil acelerando en línea recta', is_correct: false}
      - {text: 'La masa de una sustancia radiactiva que se desintegra con el tiempo', is_correct: false}
    explanation: 'La alternativa correcta es ''La altura de las mareas en la costa a lo largo de las $24$ horas del día''. Suben y bajan cíclicamente a ritmos periódicos constantes.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué condición indispensable debe cumplir un proceso físico para ser modelable por una función senoidal pura?'
    choices:
      - {text: 'Repetir su patrón idénticamente a intervalos constantes de tiempo y oscilar entre cotas fijas', is_correct: true}
      - {text: 'Crecer de forma exponencial indefinida sin límite', is_correct: false}
      - {text: 'Cambiar su período de duración en cada ciclo que transcurre', is_correct: false}
      - {text: 'Tener una gráfica rectilínea con pendiente constante', is_correct: false}
    explanation: 'La alternativa correcta es ''Repetir su patrón idénticamente a intervalos constantes de tiempo y oscilar entre cotas fijas''. Es la definición de periodicidad armónica.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar si la variable del problema repite su valor e inclinación de forma cíclica.'
  - 'Paso 2: Identificar la duración $T$ del ciclo completo (período).'
  - 'Paso 3: Extraer los valores límite máximo ($y_{\max}$) y mínimo ($y_{\min}$).'
  - 'Paso 4: Validar que el proceso se puede estructurar mediante una función $A\sin(Bt+C)+D$ o $A\cos(Bt+C)+D$.'
errores_correccion: |
  - **Error 1:** Clasificar como periódico un proceso que aumenta su valor en cada ciclo (como el interés compuesto). **Cómo corregirlo:** Para ser un fenómeno periódico trigonométrico puro, las cotas extremas $y_{\max}$ e $y_{\min}$ deben permanecer constantes a lo largo del tiempo.
  - **Error 2:** Confundir la duración de un ciclo $T$ con la frecuencia de repetición. **Cómo corregirlo:** El período $T$ es el tiempo que toma 1 ciclo (ej. 12 horas); la frecuencia es el número de ciclos por unidad de tiempo.
ejemplos:
  - titulo: 'Modelo de temperatura diaria'
    enunciado: '¿La variación de temperatura a lo largo del día entre $10^\circ\text{C}$ y $26^\circ\text{C}$ es un fenómeno periódico?'
    alternativas:
      - 'Sí, tiene un período de 24 horas'
      - 'No, las temperaturas cambian todos los días'
      - 'No, es un crecimiento lineal'
    respuesta: 'Sí, tiene un período de 24 horas'
    solucion_pasos:
      - '1. La temperatura se repite diariamente en un ciclo de 24 horas.'
      - '2. Es un fenómeno periódico ideal para modelamiento senoidal.'
  - titulo: 'Rueda de la fortuna'
    enunciado: '¿La altura de una cabina en una rueda de la fortuna que gira a velocidad constante es modelable con trigonometría?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la posición vertical sube y baja armónicamente en cada vuelta.'
  - titulo: 'Desintegración radiactiva'
    enunciado: '¿La desintegración de una sustancia química es un fenómeno periódico?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la desintegración es un proceso exponencial decreciente no repetitivo.'
  - titulo: 'Constancia del período'
    enunciado: '¿En un modelo periódico ideal, la duración de cada ciclo permanece invariable?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por definición de periodicidad matemática $f(t + T) = f(t)$.'
errores_frecuentes:
  - 'La afirmación de que cualquier proceso que cambia con el tiempo se clasifica como un fenómeno periódico.'
  - 'La afirmación de que un fenómeno periódico trigonométrico puede crecer hacia infinito sin acotación.'
  - 'La afirmación de que el período de un fenómeno cambia en cada ciclo que transcurre.'
  - 'La afirmación de que la función seno no puede utilizarse para modelar movimientos circulares.'
  - 'La afirmación de que la variable independiente $t$ en un modelo físico debe medirse obligatoriamente en radianes.'
afirmaciones_verdaderas:
  - 'Un fenómeno real es modelable mediante funciones trigonométricas si exhibe un comportamiento oscilatorio periódico acotado continuamente entre un valor máximo y un valor mínimo.'
  - 'En todo fenómeno periódico armónico, la duración de una oscilación completa se denomina período $T$ y permanece constante a lo largo del tiempo.'
al_terminar_debes_poder: |
  QUÉ: Reconocer y justificar si un fenómeno real se puede modelar mediante funciones trigonométricas periódicas.
  CÓMO: Verificar la repetición cíclica constante del patrón a intervalos regulares de tiempo $T$ y la presencia de cotas extremas $y_{\max}$ e $y_{\min}$.
