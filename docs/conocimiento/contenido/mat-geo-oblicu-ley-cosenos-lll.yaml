semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.LEY_COSENOS_LLL
resumen_inicial: 'Cálculo de un ángulo conocidos los tres lados del triángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Cuando se conocen los tres lados de un triángulo pero ninguno
  de sus ángulos, la ley de cosenos permite despejar el coseno de cualquiera de ellos,
  sin ambigüedad.
explicacion_formal: '![Ley de cosenos: caso LLL](/static/img/geometria/trigonometria/oblicu-ley-cosenos-lll.svg)


  ### Definición formal


  Despejando $\cos A$ de $a^2=b^2+c^2-2bc\cos A$, se obtiene $\cos A=\dfrac{b^2+c^2-a^2}{2bc}$.


  ### Desarrollo didáctico


  Si $a=7$, $b=8$ y $c=9$, entonces $\cos A=\dfrac{64+81-49}{2\times8\times9}=\dfrac{96}{144}\approx0{,}667$,
  por lo que $A\approx48{,}2°$.'
definiciones_clave: '- **Cálculo de un ángulo conocidos los tres lados del triángulo**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo de un ángulo conocidos los tres lados
  del triángulo.'
ejemplo_guiado:
  enunciado: Para analizar cálculo de un ángulo conocidos los tres lados del triángulo,
    considera un ángulo $\alpha = 47^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1148^\circ = 47^\circ$.
  pasos:
  - Identificar la propiedad de cálculo de un ángulo conocidos los tres lados del
    triángulo referida a $\alpha = 47^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1148 = 47 \implies x = 47 - 1148$.'
  - Concluir que la medida calculada para cálculo de un ángulo conocidos los tres
    lados del triángulo es $x = -1101^\circ$.
