- titulo: ¿Se cumple siempre la propiedad principal de cálculo de un ángulo conocidos
    los tres lados del triángulo en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede cálculo de un ángulo conocidos los tres lados del triángulo asumir
