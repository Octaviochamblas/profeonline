semantic_id: MAT.NUM.PROP_DIRECTA.CONSTANTE_PROPORCIONALIDAD
resumen_inicial: 'La constante de proporcionalidad directa $k$ es el cociente invariante obtenido al dividir cualquier valor de la variable dependiente $y$ entre su correspondiente valor independiente $x$: $k = \frac{y}{x}$.'
explicacion_simple: |
  La constante de proporcionalidad $k$ representa el "precio por unidad" o la "tasa unitaria" en un problema de proporción directa. Se calcula dividiendo la cantidad dependiente $y$ entre la cantidad independiente $x$ ($k = y \div x$). Por ejemplo, si pagas $\$6.000$ por 3 entradas al cine, la constante de proporcionalidad es $k = 6.000 \div 3 = 2.000$ pesos por entrada. Con este valor $k = 2.000$, puedes calcular rápidamente el costo de cualquier número de entradas.
explicacion_formal: |
  ### Definición formal
  La **constante de proporcionalidad directa** $k \in \mathbb{R}^+$ es el valor invariable de la razón entre dos magnitudes directamente proporcionales:
  $$k = \frac{y}{x} \quad (x \neq 0)$$

  ### Interpretación física y económica
  En aplicaciones del mundo real, la constante $k$ posee unidades compuestas ($\frac{\text{Unidad de } y}{\text{Unidad de } x}$) y recibe nombres específicos:
  - **Precio unitario**: $k = \frac{\text{Costo total (\$)}}{\text{Cantidad de artículos (unidades)}}$.
  - **Velocidad media**: $k = \frac{\text{Distancia recorida (km)}}{\text{Tiempo transcurrido (h)}}$.
  - **Densidad de masa**: $k = \frac{\text{Masa (g)}}{\text{Volumen (cm}^3\text{)}}$.

  ### Ecuación de predicción a partir de $k$
  Una vez determinada la constante $k$, la variable $y$ para cualquier valor de $x$ se calcula mediante:
  $$y = k \cdot x$$

  ### Síntesis didáctica
  - Operación: Dividir $y \div x$.
  - Unidades: Expresa el valor de $y$ correspondiente a 1 unidad de $x$.
definiciones_clave: |
  - **Constante de proporcionalidad $k$**: Cociente único $k = \frac{y}{x}$ que vincula a dos variables proporcionales.
  - **Tasa unitaria**: Valor escalar que representa la cantidad de la variable $y$ por cada unidad entera de la variable $x$.
  - **Pendiente de la recta**: Interpretación gráfica de la constante $k$ como la inclinación de la recta que pasa por el origen.
propiedades_relaciones: |
  - **Constante inversa**: Si se calcula la razón invertida $\frac{x}{y}$, se obtiene la constante recíproca $k' = \frac{1}{k}$.
  - **Invariancia temporal y espacial**: La constante $k$ permanece idéntica a lo largo de todas las mediciones de un mismo fenómeno proporcional.
ejemplo_guiado:
  enunciado: 'Un grifo llena un estanque vertiendo $45\text{ litros}$ de agua en $3\text{ minutos}$. Calcula la constante de proporcionalidad directa $k$ e indica su significado.'
  pasos:
    - 'Paso 1: Identificamos la variable independiente $x = 3\text{ minutos}$ y la dependiente $y = 45\text{ litros}$.'
    - 'Paso 2: Formulamos la división para hallar la constante $k = \frac{y}{x} = \frac{45}{3}$.'
    - 'Paso 3: Efectuamos el cociente: $k = 15$.'
    - 'Paso 4: Asignamos unidades e interpretamos: $k = 15\text{ litros/minuto}$. Significa que el grifo vierte exactamente **15 litros de agua por cada minuto**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula la constante de proporcionalidad directa $k$ a partir de un par de valores $(x, y)$?'
    choices:
      - {text: 'Dividiendo el valor de la variable dependiente $y$ entre el valor de la variable independiente $x$ ($k = \frac{y}{x}$)', is_correct: true}
      - {text: 'Multiplicando la variable $x$ por la variable $y$ ($k = x \cdot y$)', is_correct: false}
      - {text: 'Restando el valor de $x$ al valor de $y$ ($k = y - x$)', is_correct: false}
      - {text: 'Sumando ambos valores y dividiendo entre dos', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividiendo el valor de la variable dependiente $y$ entre el valor de la variable independiente $x$ ($k = \frac{y}{x}$)''. La constante $k$ es el cociente $y/x$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si un vehículo recorre $240\text{ km}$ en $3\text{ horas}$ a velocidad constante, ¿cuál es el valor y las unidades de la constante $k$?'
    choices:
      - {text: '$k = 80\text{ km/h}$, calculando $240 \div 3 = 80$', is_correct: true}
      - {text: '$k = 720\text{ km}\cdot\text{h}$, multiplicando $240 \cdot 3$', is_correct: false}
      - {text: '$k = 0.0125\text{ h/km}$, dividiendo al revés', is_correct: false}
      - {text: '$k = 237\text{ km}$, restando $240 - 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k = 80\text{ km/h}$, calculando $240 \div 3 = 80$''. $k = \frac{240\text{ km}}{3\text{ h}} = 80\text{ km/h}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable independiente $x$ y la variable dependiente $y$ en el enunciado.'
  - 'Paso 2: Escribir la fórmula de la constante $k = \frac{y}{x}$.'
  - 'Paso 3: Reemplazar los valores numéricos correspondientes y realizar la división.'
  - 'Paso 4: Expresar la constante $k$ acompañándola de sus unidades compuestas ($\text{unidad } y / \text{unidad } x$).'
errores_correccion: |
  - **Error 1:** Dividir $x$ entre $y$ en lugar de $y$ entre $x$ al buscar el valor dependiente. **Cómo corregirlo:** La convención matemática fija $y$ en el numerador para obtener la ecuación $y = kx$. La constante estándar es **$k = \frac{y}{x}$**.
  - **Error 2:** Omitir las unidades compuestas de la constante $k$ en problemas aplicados. **Cómo corregirlo:** Expresa siempre las unidades compuestas (ej: $\text{km/h}$, $\text{\$/kg}$, $\text{litros/min}$) para darle sentido físico al resultado.
ejemplos:
  - titulo: 'Cálculo de precio unitario'
    enunciado: 'Si $6$ cuadernos cuestan $\$12.000$, ¿la constante de proporcionalidad es $k = 2.000\text{ \$/cuaderno}$?'
    alternativas:
      - 'Sí, pues $12.000 / 6 = 2.000$'
      - 'No, es 72.000'
      - 'No, es 0.0005'
    respuesta: 'Sí, pues $12.000 / 6 = 2.000$'
    solucion_pasos:
      - '1. Formulamos $k = 12.000 / 6$.'
      - '2. Dividimos: $k = 2.000\text{ \$/cuaderno}$.'
  - titulo: 'Constante en consumo de combustible'
    enunciado: 'Un automóvil consume $8\text{ litros}$ de gasolina en $100\text{ km}$. ¿Su rendimiento es $k = 0.08\text{ L/km}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $k = 8 / 100 = 0.08\text{ L/km}$.'
  - titulo: 'Predicción usando la constante'
    enunciado: 'Si $k = 15\text{ m/s}$, ¿la distancia recorrida en $10\text{ segundos}$ es $y = 150\text{ metros}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $y = k \cdot x = 15 \cdot 10 = 150\text{ m}$.'
  - titulo: 'Constante recíproca'
    enunciado: 'Si $k = 4\text{ \$/g}$, ¿la constante recíproca $1/k$ es $0.25\text{ g/\$}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1 / 4 = 0.25\text{ g/\$}$.'
errores_frecuentes:
  - 'Dividir el valor independiente $x$ entre el dependiente $y$ al calcular la constante de la función $y = kx$.'
  - 'Multiplicar las variables $x \cdot y$ para determinar la constante de proporcionalidad directa.'
  - 'Considerar la constante $k$ como una cantidad variable que cambia en cada par de datos.'
  - 'La constante $k$ en problemas aplicados se expresa como un escalar adimensional sin unidades de medida.'
  - 'Restar las variables para hallar el factor de cambio unitario.'
afirmaciones_verdaderas:
  - 'La constante de proporcionalidad directa $k$ es el cociente único $k = \frac{y}{x}$ entre la variable dependiente e independiente.'
  - 'La constante $k$ representa la tasa de variación unitaria de $y$ por cada unidad de incremento en $x$.'
al_terminar_debes_poder: 'Calcular la constante de proporcionalidad directa $k = \frac{y}{x}$ e interpretar sus unidades en contextos reales.'
