semantic_id: MAT.NUM.PROP_DIRECTA.CONSTANTE_PROPORCIONALIDAD
resumen_inicial: 'La constante de proporcionalidad directa $k$ es el cociente invariante entre la variable dependiente $y$ y la variable independiente $x$: $k = \frac{y}{x}$ ($x \neq 0$), que representa la tasa unitaria o pendiente de la relación.'
explicacion_simple: "![Cálculo de constante directa](/static/img/nodos/calculo-de-la-constante-de-proporcionalidad-directa-intro.svg)\n\nLa **constante de proporcionalidad directa ($k$)** es el número que conecta a las dos variables:\n- Se calcula dividiendo cualquier valor de $y$ por su correspondiente valor de $x$:\n$$k = \\frac{y}{x}$$\n- **¿Qué significa?** Es el **valor unitario** (cuánto vale $y$ cuando $x = 1$).\n- **Ejemplo:** Si un automóvil recorre $240\\text{ km}$ en $3\\text{ horas}$ a rapidez constante:\n  - $k = \\frac{240}{3} = 80\\text{ km/h}$.\n  - Esto significa que por cada $1\\text{ hora}$ recorre $80\\text{ km}$.\n- Con $k$, podemos predecir $y$ para cualquier $x$: $y = k \\cdot x$."
explicacion_formal: 'Sea el par de variables directamente proporcionales $(x, y) \in \mathbb{R}^+ \times \mathbb{R}^+$. Se define la **constante de proporcionalidad directa** $k$ como el invariante:


  $$k = \frac{y}{x} \in \mathbb{R}^+ \quad (\forall (x, y) \text{ pertenecientes a la relación})$$


  **Propiedades Algebraicas:**

  1. **Ecuación Directa:** $y = k \cdot x$.

  2. **Ecuación Inversa para $x$:** $x = \frac{y}{k}$.

  3. **Interpretación como Pendiente:** En geometría analítica, $k = \frac{\Delta y}{\Delta x} = m$ coincide con la pendiente de la recta radial que pasa por el origen $(0,0)$.'
definiciones_clave: '- **Constante $k$**: Escalar $k = \frac{y}{x}$.

  - **Tasa unitaria**: Cantidad de magnitud $y$ asociada a una unidad de magnitud $x$.

  - **Pendiente ($m = k$)**: Grado de inclinación de la recta proporcional.'
propiedades_relaciones: '- **Invarianza**: $\frac{y_1}{x_1} = \frac{y_2}{x_2} = \dots = k$.

  - **Unicidad de escala**: Un único valor $k$ determina toda la dinámica del sistema.'
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo de constante directa](/static/img/nodos/calculo-de-la-constante-de-proporcionalidad-directa-ejemplos.svg)


    Calcule la constante de proporcionalidad directa $k$ si un auto recorre $240\text{ km}$ en $3\text{ horas}$, y halle $k$ en una relación donde $y = 15$ cuando $x = 20$.'
  pasos:
  - 'Paso 1: Para el auto: $y = 240\text{ km}$, $x = 3\text{ h} \implies k = \frac{240}{3} = 80\text{ km/h}$.'
  - 'Paso 2: Interpretación: La rapidez constante es $80\text{ km}$ por cada hora transcurrida.'
  - 'Paso 3: Para $y=15, x=20$: Dividir $y$ entre $x \implies k = \frac{15}{20} = \frac{3}{4} = 0,75$.'
  - 'Paso 4: Ecuación resultante: $y = 0,75 \cdot x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la constante de proporcionalidad directa $k$?
  choices:
  - text: $k = \frac{y}{x}$
    is_correct: true
  - text: $k = x \cdot y$
    is_correct: false
  - text: $k = y - x$
    is_correct: false
  - text: $k = \frac{x}{y^2}$
    is_correct: false
  explanation: La alternativa correcta es '$k = \frac{y}{x}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué representa físicamente el valor $k = 80\text{ km/h}$?
  choices:
  - text: La distancia recorrida en exactamente una hora (tasa unitaria)
    is_correct: true
  - text: El tiempo total del viaje
    is_correct: false
  - text: La distancia total del viaje
    is_correct: false
  - text: El combustible consumido
    is_correct: false
  explanation: La alternativa correcta es 'La distancia recorrida en exactamente una hora (tasa unitaria)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar un par de valores correspondientes $(x_0, y_0)$ con $x_0 \neq 0$.'
- 'Paso 2: Efectuar la división $k = \frac{y_0}{x_0}$ y simplificar la fracción o calcular su valor decimal.'
- 'Paso 3: Expresar la constante con sus unidades correspondientes (ej: $\text{km/h}$, $\text{\$/kg}$) y estructurar la ecuación $y = kx$.'
errores_correccion: "- **Error 1: Dividir al revés ($k = \frac{x}{y}$).** **Cómo corregirlo:** Aunque $\\frac{x}{y}$ es la constante inversa, por convenio estándar se define $k = \\frac{y}{x}$ (dependiente entre independiente).\n- **Error 2: Multiplicar $x \\cdot y$.** **Cómo corregirlo:** La constante directa es una DIVISIÓN; el producto constante corresponde a la proporcionalidad inversa."
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $y = 42$ cuando $x = 6$, ¿cuánto vale la constante de proporcionalidad directa $k$?
  alternativas:
  - $7$
  - $252$
  - $0,14$
  respuesta: $7$
  solucion_pasos:
  - $k = \frac{42}{6} = 7$.
- titulo: Ejemplo 2
  enunciado: Con $k = 2,5$, ¿cuál es el valor de $x$ cuando $y = 30$?
  alternativas:
  - $12$
  - $75$
  - $27,5$
  respuesta: $12$
  solucion_pasos:
  - $x = \frac{y}{k} = \frac{30}{2,5} = 12$.
- titulo: ¿Es k = 5 en la relación y = 5x?
  respuesta: Sí
  solucion_pasos:
  - Sí, el coeficiente que multiplica a $x$ es la constante de proporcionalidad.
  alternativas:
  - texto: Sí, el coeficiente de x en la función lineal homogénea es k
    es_correcta: true
    retroalimentacion: ¡Correcto! $y = kx \implies k = 5$.
  - texto: No, k es x / 5
    es_correcta: false
    retroalimentacion: Incorrecto, $y/x = 5$.
  - texto: No, k vale 1
    es_correcta: false
    retroalimentacion: Incorrecto, la constante es 5.
- titulo: ¿Puede la constante k ser un número fraccionario o decimal?
  respuesta: Sí
  solucion_pasos:
  - Sí, $k$ puede ser cualquier número real positivo como $0,75$ o $\frac{3}{4}$.
  alternativas:
  - texto: Sí, k puede ser cualquier valor real positivo
    es_correcta: true
    retroalimentacion: ¡Correcto! No requiere ser entero.
  - texto: No, debe ser un número natural entero
    es_correcta: false
    retroalimentacion: Incorrecto, admite decimales y fracciones.
  - texto: No, solo puede ser 1 o 2
    es_correcta: false
    retroalimentacion: Incorrecto, toma cualquier valor continuo.
errores_frecuentes:
- Dividir $x$ entre $y$ sin advertir que se calcula la constante recíproca.
- Multiplicar los valores en lugar de dividirlos.
- Omitir las unidades de medida asociadas a $k$.
- Cambiar de valor de $k$ para distintos pares de una misma relación directa.
afirmaciones_verdaderas:
- La constante de proporcionalidad directa es $k = \frac{y}{x}$.
- Representa la tasa unitaria de variación de $y$ por cada unidad de $x$.
- Permite calcular cualquier valor desconocido mediante $y = k \cdot x$ o $x = \frac{y}{k}$.
al_terminar_debes_poder: '![Síntesis de constante directa](/static/img/nodos/calculo-de-la-constante-de-proporcionalidad-directa-resumen.svg)


  QUÉ: Calcular e interpretar la constante de proporcionalidad directa $k$.


  CÓMO: Efectuando la división $k = \frac{y}{x}$ a partir de un par conocido de datos y utilizándola como factor multiplicativo en la ecuación $y = k \cdot x$.'
