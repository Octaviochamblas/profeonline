  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica un par de valores $(x, y)$ que correspondan entre sí.'
- 'Paso 2: Divide la magnitud dependiente ($y$) por la independiente ($x$).'
- 'Paso 3: El resultado de esa división es la constante $k$.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de la constante
  de proporcionalidad directa.
ejemplos:
- titulo: Hallando k
  enunciado: Si $3$ horas de trabajo producen $15$ juguetes, ¿cuál es la constante de proporcionalidad?
  solucion_pasos:
  - El par de valores es $x=3$ horas, $y=15$ juguetes.
  - Dividimos $y/x = 15/3 = 5$.
  - La constante es $k=5$. (Se producen 5 juguetes por hora).
- titulo: ¿Qué pasa si invierto el orden?
  respuesta: Cambia el significado
  solucion_pasos:
  - Si divides $3/15 = 1/5 = 0.2$. Esta es la constante inversa ($1/k$), que indica que se
    demora 0.2 horas en hacer un juguete. Matemáticamente es válido, pero suele estandarizarse
    $y/x$.
- titulo: Ejemplo 2
  enunciado: Si 6 entradas al cine cuestan 30.000 pesos, ¿cuál es la constante de proporcionalidad?
  alternativas:
  - '5.000'
  - '6.000'
  - '36.000'
  respuesta: '5.000'
  solucion_pasos:
  - 30.000 dividido entre 6 es igual a 5.000.
- titulo: ¿La constante de proporcionalidad puede cambiar según el par de valores usado, si
    la relación es directamente proporcional?
  respuesta: 'No'
  solucion_pasos:
  - En una proporción directa verdadera, la constante es la misma sin importar qué par de
    valores correspondientes se use.
errores_frecuentes:
- Restar los valores en lugar de dividirlos.
- Multiplicar $x \cdot y$ en vez de dividirlos (eso es constante de proporción inversa).
- Creer que la constante cambia si uso números más grandes.
- Dividir a veces $y/x$ y a veces $x/y$ en un mismo problema.
- Calcular la constante con pares de datos que no corresponden entre sí.
afirmaciones_verdaderas:
- La propiedad de cálculo de la constante de proporcionalidad directa preserva la consistencia
  lógica.
- La constante de proporcionalidad k representa cuánto vale una unidad de la magnitud dependiente
  por cada unidad de la magnitud independiente.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de la constante
  de proporcionalidad directa.
