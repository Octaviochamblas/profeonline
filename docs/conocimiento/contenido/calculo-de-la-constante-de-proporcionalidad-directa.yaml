resumen_inicial: 'La constante de proporcionalidad directa $k$ es el valor numérico
  fijo obtenido al dividir la variable dependiente entre la independiente: $k = \frac{y}{x}$.'
explicacion_simple: La constante de proporcionalidad $k$ es el valor de la tasa que
  se mantiene siempre igual al comparar dos variables proporcionales. Representa cuánto
  cambia una variable por cada unidad de la otra (como el precio por kilo).
explicacion_formal: 'Para una relación de proporcionalidad directa $y = k \cdot x$,
  la **Constante de Proporcionalidad Directa $k$** se determina mediante el cociente
  unívoco:


  $$k = \frac{y}{x} \in \mathbb{R}^+ \quad (x \neq 0)$$


  **Unidades de medida:**

  - La constante $k$ posee unidades compuestas $\frac{\text{Unidad de } y}{\text{Unidad
  de } x}$ (ej: $\text{km/h}$, $\text{\$/kg}$). '
definiciones_clave: '- **Constante de proporcionalidad $k$**: Cociente invariantivo
  $k = \frac{y}{x}$ característico del sistema.'
propiedades_relaciones: '- **Tasa de variación unitaria**: Expresa el valor de $y$
  cuando $x = 1$.'
ejemplo_guiado:
  enunciado: Si $3\text{ kg}$ de manzanas cuestan \$2.400, determine la constante
    de proporcionalidad $k$ e interprete su significado.
  pasos:
  - 'Paso 1: Asignar variable independiente $x = 3\text{ kg}$ y dependiente $y = 2.400$.'
  - 'Paso 2: Calcular el cociente $k = \frac{y}{x} = \frac{2.400}{3} = 800$.'
  - 'Conclusión: La constante es $k = 800\text{ \$/kg}$ (cada kilo cuesta \$800).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la constante de proporcionalidad directa k a partir de
    pares ordenados (x, y)?
  choices:
  - text: Dividiendo la variable dependiente entre la independiente (k = y / x)
    is_correct: true
  - text: Multiplicando k = x · y
    is_correct: false
  - text: Restando k = y - x
    is_correct: false
  - text: Sumando k = x + y
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo la variable dependiente entre
    la independiente (k = y / x)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3 kg de manzanas por $2.400, ¿cuál fue la constante
    de proporcionalidad k?
  choices:
  - text: 800 $/kg
    is_correct: true
  - text: 7.200 $/kg
    is_correct: false
  - text: 300 $/kg
    is_correct: false
  - text: 2.400 $/kg
    is_correct: false
  explanation: La alternativa correcta es '800 $/kg'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la constante de proporcionalidad
  directa $k = \frac{y}{x}$, interpretando su unidad y valor en contextos reales.
semantic_id: MAT.NUM.PROP_DIRECTA.CONSTANTE_PROPORCIONALIDAD
procedimiento:
- 'Paso 1: Verificar que el cociente $y / x = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = k \cdot x$ o el gráfico de recta que pasa por
  $(0,0)$.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Creer que una recta con desfase $y = kx + c$ ($c
  \neq 0$) representa proporcionalidad directa.** **Cómo corregirlo:** La proporcionalidad
  directa exige obligatoriamente pasar por el origen $(0,0)$, sin término independiente
  $c$.


  - **Error 2: Usar el producto $x \cdot y$ en lugar del cociente $y / x$ para hallar
  $k$.** **Cómo corregirlo:** El producto constante corresponde a proporcionalidad
  INVERSA; la directa usa el cociente $y/x = k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_DIRECTA.CONSTANTE_PROPORCIONALIDAD.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad directa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de cociente.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por cociente constante y/x.
- titulo: ¿Pasa la gráfica de una proporción directa por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $x=0 \implies y=0$.
- titulo: ¿Permite el modelo y = kx calcular valores desconocidos?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicando el valor de $x$ por la constante $k$.
errores_frecuentes:
- Clasificar como proporcionalidad directa una relación cuya gráfica es una recta
  que no pasa por el origen $(0,0)$.
- Multiplicar las variables entre sí ($x \cdot y$) pretendiendo obtener la constante
  de proporcionalidad directa.
- Sumar una cantidad fija a ambas variables pensando que se mantiene la relación de
  proporción.
- Declarar que si una variable aumenta y la otra también aumenta, existe proporcionalidad
  directa sin comprobar la constancia de $y/x$.
- Omitir incluir la unidad de medida compuesta en el valor de la constante de proporcionalidad
  $k$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son directamente proporcionales si su cociente es constante:
  $\frac{y}{x} = k$.'
- El gráfico de una relación de proporcionalidad directa es siempre una línea recta
  que pasa por el origen $(0,0)$.
