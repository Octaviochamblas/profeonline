semantic_id: MAT.NUM.PROP_DIRECTA.CONSTANTE_PROPORCIONALIDAD
resumen_inicial: 'Cálculo de la constante de proporcionalidad directa: concepto y
  propiedades fundamentales en Proporcionalidad directa.'
explicacion_simple: Si en un negocio cada alfajor cuesta $500, no importa cuántos
  compres, la relación 'precio dividido por alfajores' siempre dará 500. Ese número
  fijo es el corazón de la proporción directa.
explicacion_formal: 'En una **proporcionalidad directa**, aunque los valores de $x$
  e $y$ cambien constantemente, su cociente jamás lo hace. Si divides cualquier valor
  de $y$ por su correspondiente $x$, siempre obtendrás el mismo número.


  A este número inalterable lo llamamos **constante de proporcionalidad ($k$)**.

  $k = \frac{y}{x}$'
definiciones_clave: '- **Cálculo de la constante de proporcionalidad directa**: Elemento
  central dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo de la constante de proporcionalidad directa.'
ejemplo_guiado:
