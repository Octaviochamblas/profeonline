semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_ISOSCELES
resumen_inicial: 'Definición de trapecio isósceles: conceptos, teoremas, propiedades
  geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Así como existen triángulos isósceles, existe un caso particular
  de trapecio con una propiedad de simetría muy similar.
explicacion_formal: '![Trapecio isósceles: lados laterales congruentes](/static/img/geometria/poligonos-cuadrilateros/trapecios-isosceles.svg)


  ### Definición formal


  Un trapecio $ABCD$ con $AB\parallel CD$ es isósceles si $AD=BC$ (sus lados laterales
  son congruentes). Como consecuencia, los ángulos de cada base son congruentes entre
  sí, y las diagonales también son congruentes.


  ### Desarrollo didáctico


  Un trapecio isósceles tiene un eje de simetría vertical que pasa por los puntos
  medios de ambas bases, lo cual explica todas sus propiedades adicionales: ángulos
  de base iguales y diagonales iguales.'
definiciones_clave: '- **Definición de trapecio isósceles**: Elemento o propiedad
