semantic_id: MAT.GEO.CIRCULO_TEOREMAS.SECANTES_PRODUCTO
resumen_inicial: 'El Teorema de las Secantes afirma que para dos secantes trazadas desde un mismo punto exterior, el producto del segmento exterior por el segmento total es constante: PA · PB = PC · PD.'
explicacion_simple: 'Cuando trazas dos rectas secantes desde un mismo punto exterior $P$ hacia una circunferencia, se cumple una maravillosa ley métrica:


  **El segmento exterior multiplicado por el segmento total de la primera secante es EXACTAMENTE IGUAL al segmento exterior multiplicado por el segmento total de la segunda secante**.


  $$\mathbf{\text{Exterior}_1 \cdot \text{Total}_1 = \text{Exterior}_2 \cdot \text{Total}_2}$$

  $$\mathbf{PA \cdot PB = PC \cdot PD}$$


  Por ejemplo, si la primera secante tiene un trozo exterior de **$4\text{ cm}$** y un total de **$9\text{ cm}$**, su producto es $4 \cdot 9 = 36$. Si la segunda secante tiene un trozo exterior de **$3\text{ cm}$**, ¡su segmento total obligatoriamente tiene que ser **$12\text{ cm}$**, porque $3 \cdot 12 = 36$!


  ¡Cuidado con la trampa mortal de los exámenes: **NUNCA multipliques el exterior por la cuerda interior** ($PA \cdot AB \neq PC \cdot CD$)! Siempre es **Exterior por TOTAL**.


  ![Teorema de las secantes](/static/img/nodos/teorema-de-las-secantes-como-igualdad-de-productos-entre-segmento-exterior-y-segmento-total-intro.svg)

  '
explicacion_formal: '### Teorema de las rectas secantes concurrentes

  Sea $P$ un punto exterior a una circunferencia $\mathcal{C}$. Si desde $P$ se trazan dos rectas secantes que cortan a $\mathcal{C}$ en los pares de puntos $A, B$ y $C, D$ respectivamente (con $A$ entre $P$ y $B$, y $C$ entre $P$ y $D$), entonces:

  $$PA \cdot PB = PC \cdot PD \iff PA \cdot (PA + AB) = PC \cdot (PC + CD)$$


  ### Demostración geométrica por semejanza de triángulos

  1. Trácense los segmentos cruzados $\overline{BC}$ y $\overline{AD}$. Se forman los triángulos $\triangle PAD$ y $\triangle PCB$.

  2. Ambos triángulos comparten el ángulo común en el vértice exterior $P$:

  $$\angle APD \cong \angle CPB$$

  3. Los ángulos inscritos $\angle PDA$ y $\angle PBC$ subtienden el mismo arco $\overset{\frown}{AC}$, por lo que son congruentes:

  $$\angle PDA \cong \angle PBC$$

  4. Por el criterio Ángulo-Ángulo (AA), los triángulos son semejantes:

  $$\triangle PAD \sim \triangle PCB$$

  5. Estableciendo la proporción entre lados homólogos:

  $$\frac{PA}{PC} = \frac{PD}{PB} \iff PA \cdot PB = PC \cdot PD$$


  > **Complemento didáctico:** La frase que debes memorizar para este teorema es: ''Afuera por Todo = Afuera por Todo''. Si escribes esa frase arriba de tu ejercicio, evitarás automáticamente el error de usar solo la cuerda interna.

  '
definiciones_clave: '- **Teorema de las secantes**: Igualdad fundamental $\text{Ext}_1 \cdot \text{Tot}_1 = \text{Ext}_2 \cdot \text{Tot}_2$.

  - **Semejanza cíclica ($\triangle PAD \sim \triangle PCB$)**: Par de triángulos semejantes con base en cuerdas cruzadas.

  - **Potencia exterior**: Valor constante del producto respecto al punto $P$.

  '
propiedades_relaciones: '- **Forma expandida con cuerdas**: $PA(PA + AB) = PC(PC + CD)$.

  - **Ecuación de segundo grado**: Al desconocer la cuerda interior $x$, se produce una ecuación cuadrática $PA(PA + x) = K$.

  - **Invarianza angular**: El producto se mantiene idéntico para cualquier secante trazada desde $P$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo con teorema de secantes](/static/img/nodos/teorema-de-las-secantes-como-igualdad-de-productos-entre-segmento-exterior-y-segmento-total-ejemplos.svg)


    Desde un punto exterior $P$ se trazan dos secantes. En la primera secante, el segmento exterior es $PA = 4\text{ cm}$ y la cuerda interior es $AB = 5\text{ cm}$. En la segunda secante, el segmento exterior es $PC = 3\text{ cm}$. Determina el segmento total $PD$ y la longitud de la cuerda interior $CD$.'
  pasos:
  - 'Paso 1: Calcular el segmento total de la primera secante: $PB = PA + AB = 4 + 5 = 9\text{ cm}$.'
  - 'Paso 2: Calcular el producto exterior por total de la primera secante: $PA \cdot PB = 4 \cdot 9 = 36$.'
  - 'Paso 3: Plantear la ecuación con la segunda secante: $PC \cdot PD = 36 \implies 3 \cdot PD = 36$.'
  - 'Paso 4: Despejar el segmento total $PD$: $PD = \frac{36}{3} = 12\text{ cm}$.'
  - 'Paso 5: Calcular la cuerda interior $CD$: $CD = PD - PC = 12 - 3 = 9\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la formulación correcta del Teorema de las Secantes?
  choices:
  - text: PA · PB = PC · PD (Exterior · Total = Exterior · Total).
    is_correct: true
  - text: PA · AB = PC · CD (Exterior · Cuerda = Exterior · Cuerda).
    is_correct: false
  - text: PA + PB = PC + PD.
    is_correct: false
  - text: PA / AB = PC / CD.
    is_correct: false
  explanation: La alternativa correcta es 'PA · PB = PC · PD (Exterior · Total = Exterior · Total).' Siempre se multiplica el segmento exterior por el segmento total.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En dos secantes desde P se tiene PA = 2, AB = 6 y PC = 4. ¿Cuánto mide el segmento total PD?
  choices:
  - text: '4.'
    is_correct: true
  - text: '8.'
    is_correct: false
  - text: '16.'
    is_correct: false
  - text: '3.'
    is_correct: false
  explanation: 'La alternativa correcta es ''4.'' Primer total: $PB = 2 + 6 = 8$. Producto: $2 \cdot 8 = 16$. Luego: $4 \cdot PD = 16 \implies PD = 4$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Calcular el segmento total de la secante conocida sumando exterior más cuerda ($PB = PA + AB$).

  2. Multiplicar el segmento exterior por el total para obtener el valor del producto ($K = PA \cdot PB$).

  3. Igualar al producto de la otra secante: $PC \cdot PD = K$.

  4. Despejar el segmento total desconocido $PD$ dividiendo entre el exterior $PC$.

  5. Si se pide la cuerda interna, restar el exterior: $CD = PD - PC$.

  '
errores_correccion: '- **Error común 1:** Multiplicar exterior por cuerda interior ($PA \cdot AB$). **Corrección:** Debe multiplicarse siempre exterior por TOTAL ($PA \cdot PB$).

  - **Error común 2:** Olvidar que la cuerda se obtiene restando total menos exterior ($CD = PD - PC$). **Corrección:** Distinguir claramente $PD$ (total) de $CD$ (cuerda).

  '
ejemplos:
- tipo: A
  titulo: Cálculo con secantes
  enunciado: 'Desde un punto $P$ se trazan dos secantes: una tiene $PA = 3\text{ cm}$ y total $PB = 8\text{ cm}$. La otra tiene $PC = 4\text{ cm}$. ¿Cuánto mide el total $PD$?'
  alternativas:
  - text: $6\text{ cm}$.
    is_correct: true
  - text: $8\text{ cm}$.
    is_correct: false
  - text: $24\text{ cm}$.
    is_correct: false
  - text: $2\text{ cm}$.
    is_correct: false
  explicacion: $PA \cdot PB = PC \cdot PD \implies 3 \cdot 8 = 4 \cdot PD \implies 24 = 4 \cdot PD \implies PD = 6\text{ cm}$.
- tipo: B
  titulo: Exterior por total
  enunciado: ¿Es el producto del segmento exterior por el segmento total constante para cualquier secante trazada desde un mismo punto exterior?
  respuesta: Sí
  explicacion: Sí. Esta constante es la definición geométrica de la potencia del punto exterior respecto a la circunferencia.
errores_frecuentes:
- '''Multiplicar el segmento exterior por la cuerda interna en lugar de por el segmento total.'''
- '''Olvidar sumar la cuerda al segmento exterior para obtener el segmento total.'''
- '''Confundir el valor del segmento total con la longitud de la cuerda interior.'''
afirmaciones_verdaderas:
- '''El Teorema de las Secantes establece que $PA \cdot PB = PC \cdot PD$.'''
- '''El producto del segmento exterior por el total es invariante para toda secante trazada desde el mismo punto exterior $P$.'''
- '''La relación métrica surge de la semejanza de triángulos $\triangle PAD \sim \triangle PCB$.'''
al_terminar_debes_poder: '**QUÉ:** Resolver problemas geométricos aplicando el Teorema de las Secantes para determinar segmentos totales y cuerdas interiores.


  **CÓMO:** Planteando y despejando $PA \cdot PB = PC \cdot PD$ con $PB = PA + AB$.


