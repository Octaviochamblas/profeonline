procedimiento:
- 'Paso 1: Traza la altura h desde un vértice hasta el lado opuesto (o su prolongación),
  formando dos triángulos rectángulos.'
- 'Paso 2: Expresa h de dos formas distintas, usando el seno de cada uno de los dos
  ángulos adyacentes a esa altura.'
- 'Paso 3: Iguala ambas expresiones de h para obtener la proporcionalidad de la ley
  de senos.'
