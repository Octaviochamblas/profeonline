semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.DEMOSTRACION_LEY_SENOS
resumen_inicial: 'Demostración geométrica de la ley de senos mediante alturas: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Al trazar una altura dentro de un triángulo oblicuángulo, se forman
  dos triángulos rectángulos que comparten esa altura, lo que permite relacionar los
  ángulos y lados originales.
explicacion_formal: '![Demostración de la ley de senos](/static/img/geometria/trigonometria/oblicu-demostracion-ley-senos.svg)


  ### Definición formal


  Sea $H$ el pie de la altura trazada desde $C$ hasta $AB$. En el triángulo rectángulo
  $ACH$, $\sin A=\dfrac{h}{b}$, por lo que $h=b\sin A$. En el triángulo rectángulo
  $BCH$, $\sin B=\dfrac{h}{a}$, por lo que $h=a\sin B$. Igualando ambas expresiones
  de $h$: $b\sin A=a\sin B$, es decir, $\dfrac{a}{\sin A}=\dfrac{b}{\sin B}$.


  ### Desarrollo didáctico


  Esta demostración muestra que la ley de senos no es un resultado arbitrario, sino
  consecuencia directa de aplicar la definición de seno en los dos triángulos rectángulos
  que se forman al trazar una altura dentro del triángulo original.'
definiciones_clave: '- **Demostración geométrica de la ley de senos mediante alturas**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a demostración geométrica de la ley de senos
  mediante alturas.'
ejemplo_guiado:
  enunciado: Para analizar demostración geométrica de la ley de senos mediante alturas,
    considera un ángulo $\alpha = 19^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1144^\circ = 19^\circ$.
  pasos:
  - Identificar la propiedad de demostración geométrica de la ley de senos mediante
    alturas referida a $\alpha = 19^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1144 = 19 \implies x = 19 - 1144$.'
  - Concluir que la medida calculada para demostración geométrica de la ley de senos
    mediante alturas es $x = -1125^\circ$.
