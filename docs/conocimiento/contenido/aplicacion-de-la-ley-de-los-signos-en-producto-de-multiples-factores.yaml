procedimiento:
- 'Paso 1: Cuenta cuántos factores tienen signo negativo.'
- 'Paso 2: Si el conteo es par → signo positivo. Si es impar → signo negativo.'
- 'Paso 3: Multiplica los valores absolutos de todos los coeficientes.'
- 'Paso 4: Multiplica todas las partes literales.'
- 'Paso 5: Adjunta el signo del paso 2 al resultado.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en aplicación de la ley de los signos en producto de múltiples factores.
ejemplos:
- titulo: Los tres negativos
  enunciado: 'Calcula: (-a)(-2b)(-3c).'
  solucion_pasos:
  - 'Negativos: 3 (impar) → resultado negativo.'
  - 'Coeficientes: 1 × 2 × 3 = 6.'
  - 'Letras: a × b × c = abc.'
  - 'Resultado: -6abc.'
- titulo: El rendimiento de una inversión se modela como $R = (-r_1)(-r_2)(+r_3)(-r_4)$.
    Si todos los
  enunciado: 'El rendimiento de una inversión se modela como $R = (-r_1)(-r_2)(+r_3)(-r_4)$.
    Si todos los $r_i$ son positivos, ¿el rendimiento es positivo o negativo? (v1)


    Opciones: A) Negativo, porque hay 3 factores negativos (impar). · B) Positivo,
    porque hay variables positivas. · C) Depende del valor de $r_3$. · D) Positivo,
    porque hay 4 factores en total.'
  solucion_pasos:
  - 'Contamos los signos negativos en la fórmula: $-r_1$, $-r_2$, $-r_4$ = 3 negativos.
    Impar → negativo.'
  - 'Respuesta: Negativo, porque hay 3 factores negativos (impar).'
