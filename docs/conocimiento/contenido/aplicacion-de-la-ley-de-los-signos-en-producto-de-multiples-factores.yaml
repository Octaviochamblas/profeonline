resumen_inicial: El signo del producto de múltiples factores depende de la paridad
  de la cantidad de factores negativos involucrados.
explicacion_simple: 'Cuando multiplicamos varios números juntos, sólo contamos cuántos
  signos menos $(-)$ hay en la cuenta: si la cantidad de signos menos es PAR (2, 4,
  6...), el resultado final es POSITIVO (+). Si la cantidad de signos menos es IMPAR
  (1, 3, 5...), el resultado final es NEGATIVO (-).'
explicacion_formal: 'Sea $P = \prod_{k=1}^n a_k$ un producto de $n$ factores en $\mathbb{R}$.
  Sea $m = |\{k \in \{1,\dots,n\} \mid a_k < 0\}|$ el número de factores negativos:


  $$\text{sgn}(P) = (-1)^m$$


  $$\text{Si } m \text{ es par } \implies P > 0; \quad \text{Si } m \text{ es impar
  } \implies P < 0$$


  > **Complemento didáctico:** La paridad de los factores negativos determina la orientación
  final del producto en el grupo multiplicativo.'
definiciones_clave: '- **Paridad de factores negativos**: Criterio por el cual $m$
  par da signo $+$ y $m$ impar da signo $-$.'
propiedades_relaciones: '- **Invarianza por permutación**: Conmutar los factores no
  altera la cantidad de signos negativos ni el resultado final.'
ejemplo_guiado:
  enunciado: Determine el signo y el resultado de $(-2) \cdot (-3) \cdot (-4) \cdot
    x$.
  pasos:
  - 'Paso 1: Contar los factores negativos: $(-2), (-3), (-4) \implies m = 3$ factores
    negativos.'
  - 'Paso 2: Evaluar la paridad de $m=3$: es impar $\implies (-1)^3 = -1$ (resultado
    negativo).'
  - 'Paso 3: Multiplicar los valores absolutos: $2 \cdot 3 \cdot 4 = 24$.'
  - 'Conclusión: El producto es $-24x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el signo del producto de un número impar de factores negativos?
  choices:
  - text: Negativo (-)
    is_correct: true
  - text: Positivo (+)
    is_correct: false
  - text: Cero (0)
    is_correct: false
  - text: Fraccionario
    is_correct: false
  explanation: La alternativa correcta es 'Negativo (-)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (-2) · (-3) · (-4) · x, ¿cuál fue el resultado?
  choices:
  - text: -24x
    is_correct: true
  - text: 24x
    is_correct: false
  - text: -9x
    is_correct: false
  - text: 9x
    is_correct: false
  explanation: La alternativa correcta es '-24x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Contar la cantidad de signos negativos en el producto.'
- 'Paso 2: Asignar $+1$ si el total de signos es par o $-1$ si es impar.'
- 'Paso 3: Multiplicar los módulos numéricos y variables.'
errores_correccion: '- **Error 1: Asumir que una cadena de multiplicaciones con varios
  menos es siempre negativa.** **Cómo corregirlo:** Si hay 2 o 4 signos menos, el
  resultado es positivo por paridad ($(-a)(-b)(-c)(-d) = +abcd$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el producto (-a) · (-b) · (-c) · (-d).
  alternativas:
  - abcd
  - -abcd
  - 4abcd
  - -4abcd
  respuesta: abcd
  solucion_pasos:
  - 1. Hay 4 signos negativos (cantidad par).
  - 2. (-1)^4 = +1.
  - '3. Resultado: abcd.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de (-2x) · (3y) · (-5z)?
  alternativas:
  - 30xyz
  - -30xyz
  - 10xyz
  - -10xyz
  respuesta: 30xyz
  solucion_pasos:
  - 1. Hay 2 signos negativos (par) -> positivo (+).
  - 2. 2 · 3 · 5 = 30.
  - '3. Resultado: 30xyz.'
- titulo: ¿Es el producto de 5 factores negativos un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, 5 es un número impar de factores negativos, resultando negativo.
- titulo: ¿El producto (-1) · (-1) · (-1) · (-1) es igual a -1?
  respuesta: 'No'
  solucion_pasos:
  - No, al tener 4 factores negativos (par), da +1.
errores_frecuentes:
- Declarar que multiplicar muchos factores negativos siempre da resultado negativo.
- Omitir contar uno de los signos negativos en la cadena multiplicativa.
- Sumar las cantidades negativas en lugar de contar la paridad de sus multiplicadores.
- Declarar que la presencia de un solo término positivo cambia todo el producto a
  positivo.
- Declarar la paridad de los exponentes con la paridad del número de factores.
afirmaciones_verdaderas:
- Un número par de factores negativos en un producto da como resultado un valor positivo.
- Un número impar de factores negativos en un producto da como resultado un valor
  negativo.
al_terminar_debes_poder: Al terminar serás capaz de determinar el signo del producto
  de múltiples factores contando la paridad de sus términos negativos.
