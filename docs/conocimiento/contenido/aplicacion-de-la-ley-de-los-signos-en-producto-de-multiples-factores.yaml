procedimiento:
- 'Paso 1: Contar la cantidad de factores que poseen signo negativo ($-$) en la multiplicación.'
- 'Paso 2: Si el número de factores negativos es par ($2, 4, 6, \dots$), asignar el signo positivo ($+$) al resultado.'
- 'Paso 3: Si el número de factores negativos es impar ($1, 3, 5, \dots$), asignar el signo negativo ($-$) al resultado.'
- 'Paso 4: Multiplicar los valores absolutos de los coeficientes y agrupar los factores literales.'
errores_correccion: '- **Error 1:** Incluir a los factores positivos en la cuenta de paridad. **Cómo corregirlo:** Se **CUENTAN ÚNICAMENTE LOS FACTORES NEGATIVOS**; los positivos se ignoran para el signo final.

  - **Error 2:** Multiplicar de izquierda a derecha cambiando de signo en cada paso y perdiéndose en el camino. **Cómo corregirlo:** La estrategia más rápida y segura es **CONTAR TODOS LOS SIGNOS MENOS DE UNA SOLA VEZ**.

  '
ejemplos:
- titulo: Cuatro factores negativos
  enunciado: ¿Cuál es el producto de $(-1) \cdot (-2) \cdot (-3) \cdot (-4)$?
  alternativas:
  - $+24$
  - $-24$
  - $-10$
  respuesta: $+24$
  solucion_pasos:
  - '1. Cantidad de negativos: 4 (par) $\implies +$.'
  - '2. Producto: $1 \cdot 2 \cdot 3 \cdot 4 = 24 \implies +24$.'
- titulo: Tres factores negativos
  enunciado: ¿Cuál es el producto de $(-2a) \cdot (-2b) \cdot (-2c)$?
  alternativas:
  - $-8abc$
  - $+8abc$
  - $-6abc$
  respuesta: $-8abc$
  solucion_pasos:
  - '1. Cantidad de negativos: 3 (impar) $\implies -$.'
  - '2. Producto: $2 \cdot 2 \cdot 2 = 8 \implies -8abc$.'
- titulo: Invarianza por positivos
  enunciado: En el producto $(-3) \cdot (+5) \cdot (-2) \cdot (+4)$, ¿determinan los 2 factores negativos que el resultado es $+120$?
  respuesta: Sí
  solucion_pasos:
  - Sí, 2 negativos (par) $\implies +120$.
- titulo: Presencia de un factor cero
  enunciado: Para $(-5) \cdot (-3) \cdot (-2) \cdot 0 \cdot (-8)$, ¿es el resultado $0$ independientemente de la cantidad de negativos?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cero anula todo el producto.
errores_frecuentes:
- Incluir a los factores con signo positivo dentro de la cuenta para determinar la paridad de la signatura.
- Intercambiar la regla de paridad del producto multiplicativo con las reglas de adición de números enteros.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Perder el control del signo resultante al intentar hacer multiplicaciones por parejas paso a paso.
- Declarar que una cantidad impar de factores negativos produce un resultado positivo.
afirmaciones_verdaderas:
- El signo del producto de múltiples factores depende exclusivamente del número de factores negativos.
- Una cantidad par de factores negativos produce un resultado positivo, mientras que una cantidad impar produce un resultado negativo.
al_terminar_debes_poder: '![Resumen de ley de signos en múltiples factores](/static/img/nodos/aplicacion-de-la-ley-de-los-signos-en-producto-de-multiples-factores-resumen.svg)


  QUÉ: Determinar el signo global del producto continuado de más de dos factores algebraicos.


  CÓMO: Contar la cantidad total de factores negativos $N_{\text{neg}}$: si es un número par el resultado es positivo $(+)$, y si es impar es negativo $(-)$ según $(-1)^{N_{\text{neg}}}$.'
