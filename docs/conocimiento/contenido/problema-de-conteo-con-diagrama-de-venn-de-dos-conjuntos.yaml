semantic_id: MAT.FUND.CARDINALIDAD_CONJUNTOS.PROBLEMA_VENN_DOS_CONJUNTOS
resumen_inicial: Metodología sistemática de resolución de problemas verbales de conteo con dos conjuntos mediante diagramas de Venn y llenado desde la intersección.
explicacion_simple: 'Para resolver **problemas de conteo de la vida real con dos conjuntos** (por ejemplo: personas que toman té, café o ambos), el método más rápido y seguro es usar un **diagrama de Venn de dos círculos**:

  1. **Comenzar siempre por el centro**: colocar la cantidad de personas que hacen **ambas cosas a la vez** ($A \cap B$).

  2. **Calcular los exclusivos**: restar el centro a los totales de cada grupo para hallar **"solo $A$"** y **"solo $B$"**.

  3. **Calcular los que no hacen ninguno**: restar la suma de las tres regiones interiores al total del universo $\mathcal{U}$.


  ![problema-de-conteo-con-diagrama-de-venn-de-dos-conjuntos](/static/img/nodos/problema-de-conteo-con-diagrama-de-venn-de-dos-conjuntos-intro.svg)'
explicacion_formal: '### Definición formal

  En la resolución algorítmica de problemas de conteo, un **problema de 2 conjuntos sobre $\mathcal{U}$** consiste en determinar los valores de la cuádrupla de átomos booleanos $(a, b, c, d)$ sujetos al sistema de ecuaciones lineales de conservación:

  $$\begin{cases} a + b = |A| & \text{(Total de } A\text{)} \\ b + c = |B| & \text{(Total de } B\text{)} \\ b = |A \cap B| & \text{(Intersección central)} \\ a + b + c + d = |\mathcal{U}| & \text{(Universo total)} \end{cases}$$

  donde $a = |A \setminus B|$ (Solo $A$), $b = |A \cap B|$ (Ambos), $c = |B \setminus A|$ (Solo $B$) y $d = |(A \cup B)^c|$ (Ninguno).


  ### Desglose simbólico

  - Ecuación explícita para $a$: $a = |A| - b$.

  - Ecuación explícita para $c$: $c = |B| - b$.

  - Ecuación explícita para la unión: $|A \cup B| = a + b + c$.

  - Ecuación explícita para la región exterior: $d = |\mathcal{U}| - (a + b + c)$.


  > **Complemento didáctico:** Este sistema triangular desacoplado se resuelve de forma directa y secuencial sustituyendo de adentro ($b$) hacia afuera ($a, c, d$).

  '
definiciones_clave: '- **Problema de conteo de 2 conjuntos**: Situación donde se modelan poblaciones con dos características solapadas.

  - **Átomos booleanos de orden 2**: Las 4 regiones disjuntas $a, b, c, d$ que particionan a $\mathcal{U}$.

  - **Llenado centrípeto-centrífugo**: Estrategia que fija primero la intersección central para luego deducir los laterales y el exterior.

  '
propiedades_relaciones: '- **Invarianza de la suma**: $a + b + c + d = |\mathcal{U}|$ en toda asignación coherente de datos.

  - **Condición de no negatividad**: $a \geq 0, b \geq 0, c \geq 0, d \geq 0$, lo que impone $b \leq \min(|A|, |B|)$ y $|A \cup B| \leq |\mathcal{U}|$.

  '
ejemplo_guiado:
  enunciado: 'En una encuesta a $60$ personas sobre consumo de bebidas: $35$ toman café ($C$), $25$ toman té ($T$) y $12$ toman ambas bebidas ($C \cap T$). Resuelve mediante diagrama de Venn: (a) cuántos toman solo café, (b) cuántos toman solo té, y (c) cuántos no toman ninguna de las dos bebidas.


    ![Ejemplo problema-de-conteo-con-diagrama-de-venn-de-dos-conjuntos](/static/img/nodos/problema-de-conteo-con-diagrama-de-venn-de-dos-conjuntos-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el universo y los datos: $|\mathcal{U}| = 60, |C| = 35, |T| = 25, |C \cap T| = 12$.'
  - 'Paso 2: Colocar el dato central de intersección en el diagrama: - Región "Ambos": $b = 12$.'
  - 'Paso 3: Calcular la región exclusiva "Solo café" ($a$): - $a = |C| - |C \cap T| = 35 - 12 = 23$ personas.'
  - 'Paso 4: Calcular la región exclusiva "Solo té" ($c$): - $c = |T| - |C \cap T| = 25 - 12 = 13$ personas.'
  - 'Paso 5: Calcular la región exterior "Ninguna bebida" ($d$): - Total que toma alguna bebida: $a + b + c = 23 + 12 + 13 = 48$. - $d = |\mathcal{U}| - 48 = 60 - 48 = 12$ personas.'
