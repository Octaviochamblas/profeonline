errores_frecuentes:
- La afirmación de que la cantidad total de un conjunto puede colocarse en la medialuna sin la deducción de la intersección central.
- La afirmación de que la adición simple de los datos directos del enunciado resuelve el problema sin construir el diagrama.
- La afirmación de que la región exterior a los círculos siempre es nula en problemas de encuestas.
- La afirmación de que la intersección puede calcularse sumando el universo con los conjuntos individuales.
- La afirmación de que las cuatro regiones de un diagrama de Venn pueden tener cardinalidades negativas.
afirmaciones_verdaderas:
- En un problema de conteo con dos conjuntos, el llenado sistemático comienza por la intersección central y resta ese valor para calcular las regiones exclusivas.
- La suma de las cuatro regiones disjuntas del diagrama ($a + b + c + d$) es estrictamente igual a la cardinalidad del conjunto universal $|\mathcal{U}|$.
