procedimiento:
- 'Paso 1: Dibujar el rectángulo universal $\mathcal{U}$ y dos círculos secantes $A$ y $B$.'
- 'Paso 2: Registrar en el centro el dato de la intersección $|A \cap B|$.'
- 'Paso 3: Obtener "Solo $A$" restando $|A \cap B|$ del total $|A|$ y registrar en la medialuna izquierda.'
- 'Paso 4: Obtener "Solo $B$" restando $|A \cap B|$ del total $|B|$ y registrar en la medialuna derecha.'
- 'Paso 5: Sumar las tres regiones interiores y restar del total del universo para registrar la región exterior "Ninguno".'
errores_correccion: '- **Error 1:** Anotar el total del conjunto directamente en la medialuna exclusiva. **Cómo corregirlo:** La medialuna es exclusiva ("Solo $A$"); se debe restar previamente la cantidad que está en la intersección central.

  - **Error 2:** Olvidar restar la unión del universo para calcular los que no pertenecen a ningún conjunto. **Cómo corregirlo:** La región exterior $d$ es obligatoria y se calcula como $|\mathcal{U}| - (a + b + c)$.

  '
ejemplos:
- titulo: Lectores de periódicos
  enunciado: De 80 personas, 50 leen el diario A, 40 el B y 20 ambos. ¿Cuántos leen solo un diario?
  alternativas:
  - $50$ personas
  - $70$ personas
  - $30$ personas
  respuesta: $50$ personas
  solucion_pasos:
  - 1. Solo A $= 50 - 20 = 30$.
  - 2. Solo B $= 40 - 20 = 20$.
  - 3. Solo un diario $= 30 + 20 = 50$.
- titulo: Cálculo de la región ninguno
  enunciado: En el problema anterior, ¿cuántos no leen ningún diario?
  respuesta: $10$ personas
  solucion_pasos:
  - Unión $= 30 + 20 + 20 = 70$. Ninguno $= 80 - 70 = 10$.
  alternativas:
  - texto: $10$ personas
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Despeje de intersección en problema
  enunciado: Si $|\mathcal{U}| = 30$, $|A| = 18, |B| = 16$ y ninguno $= 4$, ¿cuántos están en ambos?
  respuesta: $8$
  solucion_pasos:
  - Unión $= 30 - 4 = 26$. Intersección $= 18 + 16 - 26 = 8$.
  alternativas:
  - texto: $8$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Exactamente una característica
  enunciado: ¿A qué equivale la suma de las medialunas laterales?
  respuesta: A la diferencia simétrica $A \bigtriangleup B$
  solucion_pasos:
  - Representa los elementos que poseen exactamente una sola de las dos características.
  alternativas:
  - texto: A la diferencia simétrica $A \bigtriangleup B$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
