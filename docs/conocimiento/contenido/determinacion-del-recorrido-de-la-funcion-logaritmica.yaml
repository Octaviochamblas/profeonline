semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.RECORRIDO
resumen_inicial: La determinación del recorrido de la función logarítmica establece que $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$ para cualquier función $f(x) = a \log_b(x - h) + k$ con $a \neq 0$, dado que la curva cubre todas las alturas posibles desde menos infinito hasta más infinito.
explicacion_simple: "![La determinación del recorrido de la función logarítmica establece que $\\operatorname{Rec}(f) = \\mathbb{R} = ]-\\infty, +\\infty[$ para cualquier función $f(x) = a \\log_b(x - h) + k$ con $a \neq 0$, dado que la curva cubre todas las alturas posibles desde menos infinito hasta más infinito](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-logaritmica-intro.svg)\n\n\nUna de las grandes ventajas de la función logarítmica es que **su recorrido es absolutamente TODO el conjunto de los números reales $\\mathbb{R}$**:\n\n$$\\operatorname{Rec}(f) = \\mathbb{R} = ]-\\infty, +\\infty[$$\n\n- **¿Por qué cubre todas las alturas?**\n  - Cuando te acercas a la asíntota vertical, la curva se va en picada hacia abajo a $-\\infty$ (o hacia arriba a $+\\infty$).\n  - Cuando avanzas hacia la derecha a números gigantes, la curva sigue creciendo sin parar hacia $+\\infty$.\n- **¡Incluso si la trasladas!** Sumar un número $k$ o multiplicar por $a$ no limita el recorrido:\
  \ $\\mathbb{R} + k = \\mathbb{R}$."
explicacion_formal: 'Sea $f: ]h, +\infty[ \to \mathbb{R}$ dada por $f(x) = a \log_b(x - h) + k$ con $a \neq 0, b \in \mathbb{R}^+ \setminus \{1\}$.

  Para demostrar que $\operatorname{Rec}(f) = \mathbb{R}$, se prueba la sobreyectividad:

  Para cualquier $y_0 \in \mathbb{R}$ arbitrario, resolvemos la ecuación $f(x) = y_0$:

  $$a \log_b(x - h) + k = y_0 \implies \log_b(x - h) = \frac{y_0 - k}{a} \implies x - h = b^{\frac{y_0 - k}{a}}$$

  $$x = h + b^{\frac{y_0 - k}{a}}$$

  Dado que $b^{\frac{y_0 - k}{a}} > 0$ para todo $y_0 \in \mathbb{R}$, se tiene que $x > h$, por lo que $x \in \operatorname{Dom}(f)$.

  Por tanto, todo valor real $y_0$ posee una preimagen en el dominio, concluyendo que $\operatorname{Rec}(f) = \mathbb{R}$.'
definiciones_clave: '- **Recorrido logarítmico**: Conjunto de imágenes de la función, idéntico a todo $\mathbb{R}$.

  - **Sobreyectividad universal**: Capacidad de la función logarítmica de alcanzar cualquier cota real mediante exponenciación.'
propiedades_relaciones: '- **Dualidad funcional**: $\operatorname{Dom}(\exp_b) = \operatorname{Rec}(\log_b) = \mathbb{R}$ y $\operatorname{Rec}(\exp_b) = \operatorname{Dom}(\log_b) = \mathbb{R}^+$.

  - **Invarianza ante traslaciones**: Las transformaciones afines no acotan el recorrido.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del recorrido de la función logarítmica establece que $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$ para cualquier función $f(x) = a \log_b(x - h) + k$ con $a \neq 0$, dado que la curva cubre todas las alturas posibles desde menos infinito hasta más infinito](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-logaritmica-ejemplos.svg)



    Demuestra algebraicamente que el recorrido de $f(x) = 3\log_2(x - 1) - 5$ es todo $\mathbb{R}$, hallando la preimagen de $y = 4$.'
  pasos:
  - 'Paso 1: Plantear la ecuación $f(x) = y$:

    $3\log_2(x - 1) - 5 = y$.'
  - 'Paso 2: Despejar el logaritmo:

    $3\log_2(x - 1) = y + 5 \implies \log_2(x - 1) = \frac{y + 5}{3}$.'
  - 'Paso 3: Pasar a forma exponencial:

    $x - 1 = 2^{\frac{y + 5}{3}} \implies x = 1 + 2^{\frac{y + 5}{3}}$.'
  - 'Paso 4: Como $2^{\frac{y + 5}{3}} > 0$ para todo $y \in \mathbb{R}$, $x > 1$ siempre existe en el dominio $\implies \operatorname{Rec}(f) = \mathbb{R}$.'
  - 'Paso 5: Para $y = 4$: $x = 1 + 2^{(4+5)/3} = 1 + 2^3 = 1 + 8 = \mathbf{9}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función $f(x) = -4\log_5(x - 3) + 8$?
  choices:
  - text: ℝ = ]-∞, +∞[ (todos los números reales)
    is_correct: true
  - text: ']3, +∞['
    is_correct: false
  - text: ']-∞, 8]'
    is_correct: false
  - text: '[8, +∞['
    is_correct: false
  explanation: La alternativa correcta es 'ℝ = ]-∞, +∞[ (todos los números reales)'. El recorrido de cualquier función logarítmica general sin truncar es siempre todo ℝ.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relaciona el recorrido de la función logarítmica con el dominio de la función exponencial?
  choices:
  - text: Son exactamente iguales (ambos son ℝ)
    is_correct: true
  - text: Son inversos aditivos
    is_correct: false
  - text: Uno es positivo y el otro negativo
    is_correct: false
  - text: No tienen ninguna relación
    is_correct: false
  explanation: La alternativa correcta es 'Son exactamente iguales (ambos son ℝ)'. Por ser funciones inversas, el dominio de una es el recorrido de la otra.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la estructura logarítmica $f(x) = a \log_b(x - h) + k$.'
- 'Paso 2: Comprobar que no existan restricciones externas de dominio impuestas en el problema.'
- 'Paso 3: Concluir que el recorrido es el conjunto total $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
- 'Paso 4: Justificar mediante la existencia de preimágenes $x = h + b^{\frac{y - k}{a}}$ para cualquier $y \in \mathbb{R}$.'
errores_correccion: '- **Error común:** Confundir el dominio con el recorrido y decir que el recorrido es $]0, +\infty[$.

  - **Cómo corregirlo:** El logaritmo puede dar **cualquier valor positivo, negativo o cero**: su **recorrido es SIEMPRE $\mathbb{R}$**.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido directo'
  enunciado: ¿Cuál es el recorrido de $f(x) = \log_2(x)$?
  alternativas:
  - R (todos los reales)
  - ']0, +inf['
  - '[0, +inf['
  - ']-2, +inf['
  respuesta: R (todos los reales)
  solucion_pasos:
  - 'Paso 1: $\operatorname{Rec}(f) = \mathbb{R}$.'
- titulo: 'Ejemplo 2: Recorrido tras traslación vertical'
  enunciado: 'El recorrido de $g(x) = \log_3(x) + 100$ es:'
  alternativas:
  - R
  - '[100, +inf['
  - ']100, +inf['
  - ']0, +inf['
  respuesta: R
  solucion_pasos:
  - 'Paso 1: Sumar constantes no restringe el conjunto infinito $\mathbb{R}$.'
- titulo: 'Ejemplo 3: Preimagen negativa'
  enunciado: En $f(x) = \log_2(x)$, ¿qué valor de $x$ produce $y = -5$?
  alternativas:
  - 1/32 (o 0,03125)
  - '-10'
  - '-32'
  - No existe
  respuesta: 1/32 (o 0,03125)
  solucion_pasos:
  - 'Paso 1: $x = 2^{-5} = 1/32$.'
- titulo: 'Ejemplo 4: Preimagen positiva'
  enunciado: En $f(x) = \ln(x)$, ¿qué $x$ produce $y = 0$?
  alternativas:
  - x = 1
  - x = 0
  - x = e
  - x = -1
  respuesta: x = 1
  solucion_pasos:
  - 'Paso 1: $x = e^0 = 1$.'
errores_frecuentes:
- Creer que las alturas están acotadas inferiormente por cero.
- Confundir la asíntota vertical x = 0 con una supuesta asíntota horizontal y = 0.
- Asumir que el recorrido cambia con el signo del coeficiente exterior.
afirmaciones_verdaderas:
- El recorrido de cualquier función logarítmica general sin truncar es todo el conjunto ℝ.
- Para cualquier altura real y existe una preimagen x en el dominio tal que f(x) = y.
al_terminar_debes_poder: '**QUÉ:** Determinar y justificar el recorrido de la función logarítmica.


  **CÓMO:** Demostrando la sobreyectividad en ℝ mediante el despeje algebraico de preimágenes.


  ![Resumen La determinación del recorrido de la función logarítmica establece que $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$ para cualquier función $f(x) = a \log_b(x - h) + k$ con $a \neq 0$, dado que la curva cubre todas las alturas posibles desde menos infinito hasta más infinito](/static/img/nodos/determinacion-del-recorrido-de-la-funcion-logaritmica-resumen.svg)'
