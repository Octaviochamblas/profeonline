resumen_inicial: La determinación de coeficientes en polinomios idénticos calcula
  valores incógnitos igualando término a término las constantes de igual grado.
explicacion_simple: 'Cuando nos dicen que dos polinomios son idénticos pero uno tiene
  letras desconocidas en sus números (como $Ax^2 + Bx + C \equiv 5x^2 - 3x + 8$),
  simplemente emparejamos las posiciones: el número que acompaña a $x^2$ debe ser
  igual ($A = 5$), el de $x$ igual ($B = -3$) y el número solo igual ($C = 8$).'
explicacion_formal: 'Dada la identidad $P(x) \equiv Q(x)$ con $P(x) = \sum a_k x^k$
  y $Q(x) = \sum b_k x^k$, el **Sistema de Igualdad de Coeficientes Homólogos** establece:


  $$\begin{cases} a_n = b_n \\ a_{n-1} = b_{n-1} \\ \dots \\ a_0 = b_0 \end{cases}$$


  > **Complemento didáctico:** El método de coeficientes indeterminados transforma
  una identidad funcional en un sistema directo de ecuaciones algebraicas escalares.'
definiciones_clave: '- **Coeficientes homólogos**: Coeficientes numéricos correspondientes
  a los términos de la misma variable y grado en ambos polinomios.'
propiedades_relaciones: '- **Unicidad de coeficientes**: Si $P(x) \equiv Q(x)$, el
  sistema de ecuaciones para los coeficientes posee solución única.'
ejemplo_guiado:
  enunciado: Halle $m$ y $n$ si $(m - 2)x^3 + (n + 4)x \equiv 5x^3 - 1x$.
  pasos:
  - 'Paso 1: Igualar coeficientes de $x^3$: $m - 2 = 5 \implies m = 7$.'
  - 'Paso 2: Igualar coeficientes de $x^1$: $n + 4 = -1 \implies n = -5$.'
  - 'Conclusión: $m = 7$ y $n = -5$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si Ax^2 + Bx + C es idéntico a 4x^2 - 7x + 2, ¿cuáles son los valores
    de A, B y C?
  choices:
  - text: A = 4, B = -7, C = 2
    is_correct: true
  - text: A = 4, B = 7, C = -2
    is_correct: false
  - text: A = -4, B = -7, C = -2
    is_correct: false
  - text: A = 2, B = 4, C = -7
    is_correct: false
  explanation: La alternativa correcta es 'A = 4, B = -7, C = 2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (m - 2)x^3 + (n + 4)x = 5x^3 - 1x, ¿cuál fue
    el valor de m?
  choices:
  - text: '7'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: '-5'
    is_correct: false
  explanation: La alternativa correcta es '7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Agrupar y ordenar ambos polinomios en términos de igual grado.'
- 'Paso 2: Formar ecuaciones igualando los coeficientes de las mismas potencias.'
- 'Paso 3: Resolver el sistema de ecuaciones para hallar los valores de las incógnitas.'
errores_correccion: '- **Error 1: Igualar el coeficiente de $x^2$ con el coeficiente
  de $x$ del otro polinomio.** **Cómo corregirlo:** La igualación se realiza ÚNICAMENTE
  entre términos del mismo grado (coeficientes homólogos).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si (a + 3)x^2 + (b - 1) es idéntico a 8x^2 + 5, ¿cuál es el valor de
    a + b?
  alternativas:
  - '11'
  - '5'
  - '6'
  - '13'
  respuesta: '11'
  solucion_pasos:
  - 1. a + 3 = 8 => a = 5.
  - 2. b - 1 = 5 => b = 6.
  - '3. Calcular a + b: 5 + 6 = 11.'
- titulo: Ejemplo 2
  enunciado: Si P(x) = kx^3 - 4 es idéntico a Q(x) = 6x^3 + c, ¿cuánto valen k y c?
  alternativas:
  - k = 6 y c = -4
  - k = -6 y c = 4
  - k = 4 y c = 6
  - k = 0 y c = 0
  respuesta: k = 6 y c = -4
  solucion_pasos:
  - '1. Igualar coeficientes de x^3: k = 6.'
  - '2. Igualar constantes: c = -4.'
- titulo: Si (2a)x + 3 es idéntico a 10x + 3, ¿es a igual a 5?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, igualando coeficientes de x: 2a = 10 => a = 5.'
- titulo: ¿Se pueden hallar coeficientes incógnitos igualando términos de distinto
    grado?
  respuesta: 'No'
  solucion_pasos:
  - No, la propiedad de identidad exige la igualdad de coeficientes estrictamente
    homólogos (mismo grado).
errores_frecuentes:
- Igualar coeficientes de términos que pertenecen a potencias o grados diferentes.
- Omitir el signo negativo al igualar los coeficientes homólogos.
- Declarar las variables de la identidad con las constantes incógnitas a calcular.
- Formar un producto de coeficientes en lugar de un sistema de ecuaciones lineales
  aditivas.
- Omitir considerar los coeficientes cero de los términos ausentes en uno de los polinomios.
afirmaciones_verdaderas:
- En dos polinomios idénticos, los coeficientes de los términos de igual grado son
  numéricamente iguales.
- La igualación de coeficientes homólogos genera un sistema de ecuaciones para determinar
  constantes incógnitas.
al_terminar_debes_poder: Al terminar serás capaz de determinar coeficientes incógnitos
  en polinomios idénticos planteando e igualando las ecuaciones de términos homólogos.
