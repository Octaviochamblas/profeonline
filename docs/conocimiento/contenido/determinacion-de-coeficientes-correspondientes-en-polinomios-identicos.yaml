semantic_id: MAT.ALG.POLINOMIOS.IGUALDAD_COEFICIENTES
resumen_inicial: 'La determinación de coeficientes en polinomios idénticos consiste en calcular parámetros desconocidos igualando término a término los coeficientes de igual grado o evaluando en valores estratégicos.'
explicacion_simple: |
  - Cuando sabemos que dos polinomios son idénticos ($P(x) \equiv Q(x)$), podemos hallar números desconocidos (como $A, B, C$) usando dos métodos muy sencillos:
    1. **Método de coeficientes:** Se igualan los coeficientes de las mismas potencias de $x$:
       - El número que acompaña a $x^2$ en la izquierda debe ser igual al que acompaña a $x^2$ en la derecha.
       - El que acompaña a $x$ se iguala con el de $x$.
       - El término independiente se iguala con el término independiente.
    2. **Método de evaluación:** Se sustituyen valores convenientes de $x$ (como $x = 0, x = 1, x = -2$) para anular paréntesis y despejar directamente las letras.

  ![Coeficientes en Polinomios Idénticos](/static/img/nodos/determinacion-de-coeficientes-correspondientes-en-polinomios-identicos-intro.svg)
explicacion_formal: |
  ### Fundamento formal del método
  Dado el principio de identidad de polinomios en $\mathbb{K}[x]$:

  $$\sum_{i=0}^n a_i x^i \equiv \sum_{i=0}^n b_i x^i \iff a_i = b_i, \quad \forall i \in \{0, 1, \dots, n\}$$

  ### Métodos de resolución
  1. **Método de igualación de coeficientes:**
     Genera un sistema lineal de $n + 1$ ecuaciones independientes:
     $$\begin{cases} a_n = b_n \\ a_{n-1} = b_{n-1} \\ \dots \\ a_0 = b_0 \end{cases}$$
  2. **Método de asignación de valores particulares (interpolación):**
     Se eligen $n+1$ valores reales $\{x_0, x_1, \dots, x_n\}$ que anulen factores del tipo $(x - r)$, simplificando el cálculo sin necesidad de desarrollar productos algebraicos extensos.
definiciones_clave: |
  - **Coeficientes correspondientes**: Factores constantes asociados a una misma potencia de la variable en ambos miembros.
  - **Método de coeficientes**: Técnica que iguala potencias idénticas para formar un sistema de ecuaciones.
  - **Método de valores numéricos**: Técnica que evalúa en raíces estratégicas para despejar incógnitas de forma directa.
propiedades_relaciones: |
  - **Fracciones parciales**: La determinación de coeficientes en identidades polinomiales es el pilar del método de descomposición en fracciones parciales en cálculo integral.
  - **Unicidad de solución**: Si los polinomios son de grado $n$, el sistema lineal de $n+1$ ecuaciones tiene solución única.
ejemplo_guiado:
  enunciado: 'Determina los valores de $A$ y $B$ para que se cumpla la identidad: $A(x - 2) + B(x + 3) \equiv 5x + 5$.'
  imagen: '/static/img/nodos/determinacion-de-coeficientes-correspondientes-en-polinomios-identicos-ejemplos.svg'
  pasos:
    - 'Paso 1 (Método de evaluación): Elegimos un valor que anule el primer paréntesis: sustituimos **$x = 2$**:'
    - '  - $A(2 - 2) + B(2 + 3) = 5(2) + 5$'
    - '  - $0 + 5B = 10 + 5 = 15 \implies **B = 3$**.'
    - 'Paso 2: Elegimos un valor que anule el segundo paréntesis: sustituimos **$x = -3$**:'
    - '  - $A(-3 - 2) + B(-3 + 3) = 5(-3) + 5$'
    - '  - $-5A + 0 = -15 + 5 = -10 \implies **A = 2$**.'
    - 'Paso 3: Verificamos por igualación de coeficientes: $2(x - 2) + 3(x + 3) = 2x - 4 + 3x + 9 = 5x + 5$ (Coincide).'
    - 'Paso 4: Conclusión: Los valores buscados son **$A = 2$** y **$B = 3$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si $(A - 1)x^2 + (B + 2)x + C \equiv 4x^2 - 5x + 8$, ¿cuáles son los valores de $A, B, C$?'
    choices:
      - text: '$A = 5, B = -7, C = 8$'
        is_correct: true
      - text: '$A = 3, B = -3, C = 8$'
        is_correct: false
      - text: '$A = 4, B = -5, C = 8$'
        is_correct: false
      - text: '$A = 5, B = 7, C = -8$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$A = 5, B = -7, C = 8$''. $A - 1 = 4 \implies A = 5$; $B + 2 = -5 \implies B = -7$; $C = 8$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la identidad $A(x + 1) + B(x - 1) \equiv 6x$, ¿cuál es el valor de $A$ evaluando convenientemente en $x = 1$?'
    choices:
      - text: '$A = 3$, porque $A(1 + 1) + 0 = 6(1) \implies 2A = 6 \implies A = 3$'
        is_correct: true
      - text: '$A = 6$'
        is_correct: false
      - text: '$A = 2$'
        is_correct: false
      - text: '$A = 1$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$A = 3$, porque $A(1 + 1) + 0 = 6(1) \implies 2A = 6 \implies A = 3$''. Sustituir $x=1$ anula el término con $B$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Desarrollar y agrupar los términos de cada potencia de $x$ en ambos miembros.'
  - 'Paso 2: Igualar los coeficientes de las mismas potencias de $x$ ($x^2$ con $x^2$, $x$ con $x$, constantes con constantes).'
  - 'Paso 3: Alternativamente, evaluar en valores de $x$ que anulen factores para despejar directamente.'
  - 'Paso 4: Resolver el sistema de ecuaciones y comprobar la solución en la identidad original.'
errores_correccion: |
  - **Error 1:** Igualar coeficientes de diferentes potencias de $x$. **Cómo corregirlo:** La correspondencia es **estrictamente de potencias iguales** ($x^k$ con $x^k$).
  - **Error 2:** Olvidar agrupar todos los términos de una misma potencia antes de igualar. **Cómo corregirlo:** Agrupar en la forma $(A + B)x$ antes de igualar con el coeficiente de $x$.
ejemplos:
  - titulo: 'Igualación de coeficientes lineales'
    enunciado: 'Si $(a + b)x + (a - b) \equiv 8x + 2$, ¿cuáles son los valores de $a$ y $b$?'
    alternativas:
      - '$a = 5$ y $b = 3$'
      - '$a = 8$ y $b = 2$'
      - '$a = 4$ y $b = 4$'
    respuesta: '$a = 5$ y $b = 3$'
    solucion_pasos:
      - '1. $a + b = 8$ y $a - b = 2$.'
      - '2. Sumando: $2a = 10 \implies a = 5$.'
      - '3. Restando: $2b = 6 \implies b = 3$.'
  - titulo: 'Método por evaluación de raíces'
    enunciado: 'En la identidad $M(x - 3) + N(x + 1) \equiv 4x$, ¿cuánto vale $N$ evaluando en $x = 3$?'
    alternativas:
      - '$N = 3$'
      - '$N = 4$'
      - '$N = 12$'
    respuesta: '$N = 3$'
    solucion_pasos:
      - '1. Para $x = 3$: $M(0) + N(3 + 1) = 4(3)$.'
      - '2. $4N = 12 \implies N = 3$.'
  - titulo: 'Unicidad del sistema'
    enunciado: '¿Garantiza la identidad entre dos polinomios de igual grado un sistema con solución única para sus coeficientes lineales?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Los monomios $\{1, x, x^2, \dots\}$ forman una base linealmente independiente.'
      - '2. La correspondencia de coeficientes es única.'
  - titulo: 'Igualación con grados distintos'
    enunciado: '¿Es correcto igualar el coeficiente de $x^2$ con el término independiente?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Solo se igualan coeficientes de términos semejantes de igual grado.'
      - '2. $x^2$ solo se iguala con $x^2$.'
errores_frecuentes:
  - 'Igualar coeficientes de potencias distintas de la variable.'
  - 'Olvidar agrupar términos semejantes en un miembro antes de proceder a la igualación.'
  - 'Cometer errores de signos al resolver el sistema de ecuaciones simultáneas.'
  - 'Elegir valores de evaluación que no simplifiquen la expresión en el método de sustitución.'
  - 'No verificar los valores obtenidos en la identidad completa original.'
afirmaciones_verdaderas:
  - 'En dos polinomios idénticos, los coeficientes de las mismas potencias de la variable son respectivamente iguales.'
  - 'El método de asignación de valores particulares permite despejar parámetros evaluando en las raíces de los factores.'
al_terminar_debes_poder: |
  ![Resumen de Coeficientes en Polinomios Idénticos](/static/img/nodos/determinacion-de-coeficientes-correspondientes-en-polinomios-identicos-resumen.svg)

  QUÉ: Calcular parámetros y coeficientes desconocidos en identidades polinomiales mediante igualación término a término o evaluación estratégica de valores numéricos.
  CÓMO: Formulando el sistema $a_k = b_k$ para cada potencia $x^k$ o evaluando en raíces particulares ($x = r_i$) en identidades como $A(x-2) + B(x+3) \equiv 5x + 5$.
