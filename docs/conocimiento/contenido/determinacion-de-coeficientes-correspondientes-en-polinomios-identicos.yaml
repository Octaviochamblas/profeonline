semantic_id: MAT.ALG.POLINOMIOS.IGUALDAD_COEFICIENTES
resumen_inicial: 'La determinación de coeficientes correspondientes en polinomios idénticos es la técnica algebraica que permite hallar parámetros desconocidos igualando término a término los coeficientes de las potencias de igual grado.'
explicacion_simple: |
  Cuando dos polinomios son idénticos y contienen **letras desconocidas en sus números (parámetros $A, B, C$)**, puedes descubrirlos usando el **Método de Igualación de Coeficientes**:
  - Si sabes que $Ax^2 + Bx + C \equiv 4x^2 - 9x + 2$:
    1. Comparas el número delante de $x^2 \implies A = 4$.
    2. Comparas el número delante de $x \implies B = -9$.
    3. Comparas el número suelto $\implies C = 2$.
  - Si la expresión está desordenada o agrupada (como en $A(x + 1) + B(x - 2) \equiv 5x - 1$), primero expandes y agrupas los términos con $x$ para armar un sistema de ecuaciones y despejar las letras.
explicacion_formal: |
  ### Definición formal
  Dada la relación de identidad entre dos polinomios $P(x) = \sum_{k=0}^n a_k(\lambda) x^k$ y $Q(x) = \sum_{k=0}^n b_k x^k \in \mathbb{R}[x]$ que contienen un vector de parámetros desconocidos $\mathbf{\lambda} = (\lambda_1, \dots, \lambda_m)$, el **Método de Coeficientes Indeterminados** establece el sistema determinista de ecuaciones algebraicas:

  $$P(x) \equiv Q(x) \iff \begin{cases} a_n(\mathbf{\lambda}) = b_n \\ a_{n-1}(\mathbf{\lambda}) = b_{n-1} \\ \vdots \\ a_0(\mathbf{\lambda}) = b_0 \end{cases}$$

  ### Algoritmo de Resolución
  1. **Expansión y Reducción**: Desarrollar todas las operaciones algebraicas en ambos miembros hasta obtener términos monómicos ordenados.
  2. **Factorización por Potencias**: Agrupar los parámetros según las potencias de la variable principal $x^k$.
  3. **Planteo del Sistema de Ecuaciones**: Igualar el coeficiente agrupado de $x^k$ en el lado izquierdo con el coeficiente numérico de $x^k$ en el lado derecho.
  4. **Resolución del Sistema**: Resolver el sistema lineal o no lineal resultante para hallar los valores numéricos de los parámetros.

  ### Síntesis didáctica
  Este principio permite descomponer fracciones racionales complejas en fracciones parciales y determinar constantes en modelos físicos de ajuste polinómico.
definiciones_clave: |
  - **Método de coeficientes indeterminados**: Algoritmo para calcular parámetros desconocidos igualando coeficientes de potencias homologas en polinomios idénticos.
  - **Coeficientes homologos / correspondientes**: Coeficientes numéricos asociados a la misma potencia de variable ($x^k$) en dos polinomios distintos.
  - **Sistema de ecuaciones de identidad**: Conjunto de ecuaciones lineales derivado de la igualdad término a término.
propiedades_relaciones: |
  - **Unicidad de solución**: Si el número de ecuaciones independientes iguala al número de parámetros desconocidos, existe una única combinación de coeficientes que satisface la identidad.
  - **Método alternativo de evaluación de puntos**: Dado que la identidad se cumple para todo $x$, se pueden asignar valores convenientes a la variable (como las raíces de los binomios) para calcular directamente los parámetros sin armar el sistema completo.
ejemplo_guiado:
  enunciado: 'Determina los valores de los parámetros $A$ y $B$ para que se cumpla la identidad polinómica $A(x - 3) + B(x + 1) \equiv 7x - 5$.'
  pasos:
    - 'Paso 1: Expandimos el lado izquierdo distribuyendo $A$ y $B$: $Ax - 3A + Bx + B \equiv 7x - 5$.'
    - 'Paso 2: Agrupamos los términos con $x$ y los términos constantes: $(A + B)x + (-3A + B) \equiv 7x - 5$.'
    - 'Paso 3: Igualamos coeficientes correspondientes:
       - Términos en $x$: $A + B = 7 \implies B = 7 - A$
       - Términos independientes: $-3A + B = -5$'
    - 'Paso 4: Sustituimos $B = 7 - A$ en la segunda ecuación: $-3A + (7 - A) = -5 \implies -4A + 7 = -5 \implies -4A = -12 \implies \mathbf{A = 3}$.'
    - 'Paso 5: Calculamos $B$: $B = 7 - 3 \implies \mathbf{B = 4}$.'
    - 'Conclusión: Los parámetros son **$A = 3$ y $B = 4$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el método de coeficientes indeterminados, ¿qué sistema de ecuaciones se plantea para hallar las constantes desconocidas de dos polinomios idénticos?'
    choices:
      - {text: 'Se iguala el coeficiente de cada potencia de la variable en el primer miembro con el coeficiente de la misma potencia en el segundo miembro', is_correct: true}
      - {text: 'Se suman todos los coeficientes del primer miembro y se igualan a cero', is_correct: false}
      - {text: 'Se multiplican las variables por el grado absoluto del polinomio', is_correct: false}
      - {text: 'Se igualan las variables principales cancelando los coeficientes numéricos', is_correct: false}
    explanation: 'La alternativa correcta es ''Se iguala el coeficiente de cada potencia de la variable en el primer miembro con el coeficiente de la misma potencia en el segundo miembro''. Igualación término a término.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la identidad $a x^2 + b x + c \equiv 3 x^2 - 8$, ¿cuáles son los valores de los parámetros $a, b$ y $c$?'
    choices:
      - {text: '$a = 3$, $b = 0$ y $c = -8$', is_correct: true}
      - {text: '$a = 3$, $b = -8$ y $c = 0$', is_correct: false}
      - {text: '$a = 0$, $b = 3$ y $c = 8$', is_correct: false}
      - {text: '$a = 3$, $b = 1$ y $c = -8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = 3$, $b = 0$ y $c = -8$''. Coeficiente de $x^2 \to 3$, término en $x$ ausente $\to 0$, constante $\to -8$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Desarrollar completamente los productos y potencias en ambos miembros de la identidad.'
  - 'Paso 2: Agrupar los términos de igual grado factorizando la variable común ($x^k$).'
  - 'Paso 3: Formular un sistema de ecuaciones igualando los coeficientes de las potencias homólogas.'
  - 'Paso 4: Resolver el sistema de ecuaciones para determinar el valor numérico exacto de cada parámetro.'
errores_correccion: |
  - **Error 1:** Asignar coeficientes de potencias distintas entre sí (ej: igualar el término con $x^2$ al término con $x$). **Cómo corregirlo:** Se debe igualar **ESTRICTAMENTE el coeficiente de $x^k$ con el coeficiente de $x^k$**.
  - **Error 2:** Asignar coeficiente 1 a las potencias ausentes en un polinomio (ej: en $3x^2 - 5$ decir que el coeficiente de $x$ es $1$ en vez de $0$). **Cómo corregirlo:** Si una potencia no aparece en un lado, **su coeficiente es $0$**.
ejemplos:
  - titulo: 'Igualación de coeficientes directa'
    enunciado: 'Si $(P + 1)x^2 + Q x \equiv 6x^2 - 4x$, ¿cuáles son los valores de $P$ y $Q$?'
    alternativas:
      - '$P = 5$ y $Q = -4$'
      - '$P = 6$ y $Q = 4$'
      - '$P = 1$ y $Q = -4$'
    respuesta: '$P = 5$ y $Q = -4$'
    solucion_pasos:
      - '1. Igualamos en $x^2$: $P + 1 = 6 \implies P = 5$.'
      - '2. Igualamos en $x$: $Q = -4$.'
      - '3. Valores: $P = 5, Q = -4$.'
  - titulo: 'Método de evaluación de puntos convenientes'
    enunciado: 'Para hallar $A$ en $A(x - 2) \equiv 3x - 6$, si evaluamos $x = 3$, ¿obtenemos $A(1) = 3(3) - 6 \implies A = 3$?'
    alternativas:
      - 'Sí, evaluar puntos convenientes es válido'
      - 'No, sólo se puede usar sistemas de ecuaciones'
      - 'No, $A=0$'
    respuesta: 'Sí, evaluar puntos convenientes es válido'
    solucion_pasos:
      - '1. Evaluamos $x=3 \implies A(1) = 9 - 6 = 3$.'
      - '2. $A = 3$.'
  - titulo: 'Coeficiente ausente'
    enunciado: 'En la identidad $m x^2 + n x + p \equiv x^2 - 9$, ¿el parámetro $n$ es igual a $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al no figurar término en $x$ en el lado derecho, $n = 0$.'
  - titulo: 'Identidad de términos independientes'
    enunciado: 'En la identidad $2x - k \equiv 2x + 7$, ¿el parámetro $k$ es igual a $-7$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-k = 7 \implies k = -7$.'
errores_frecuentes:
  - 'Igualar coeficientes asociados a potencias de diferentes exponentes durante el método.'
  - 'Asignar coeficiente 1 a los términos ausentes en lugar del coeficiente escalar cero.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Evaluar un solo punto particular en una identidad demuestra la validez de los parámetros sin resolver el sistema.'
  - 'Los signos negativos de los coeficientes se descartan al armar el sistema de ecuaciones.'
afirmaciones_verdaderas:
  - 'La determinación de coeficientes en polinomios idénticos exige igualar los coeficientes asociados a potencias de igual grado.'
  - 'Si una potencia de la variable no figura en uno de los polinomios idénticos, su coeficiente asociado es igual a cero.'
