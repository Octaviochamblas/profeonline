semantic_id: MAT.ALG.POLINOMIOS.IGUALDAD_COEFICIENTES
resumen_inicial: 'Determinación de coeficientes correspondientes en polinomios idénticos:
  concepto y propiedades en Grado, ordenamiento e igualdad de polinomios.'
explicacion_simple: El principio que usamos para encontrar a los gemelos idénticos
  tiene un nombre formal y un campo de aplicación inmenso en las ciencias exactas.
  Se llama el Principio de Igualdad de Coeficientes.
explicacion_formal: '### Definición formal


  Sin orden ni reducción, emparejarás peras con manzanas. El orden asegura que compares
  grado 2 con grado 2, grado 1 con grado 1, etc.


  ### Desarrollo didáctico


  Este principio te da una ''llave maestra'' para romper problemas que parecen imposibles.

  Imagina este problema de física, donde te dicen que una trayectoria $Ax^2 + Bx$
  siempre equivale, a todo momento, a $4x^2 - 7x$.

  Sin el principio, te quedarías atascado intentando darle valores a $x$.

  Con el principio, sabes de inmediato y por ley matemática que:

  $A = 4$

  $B = -7$

  Has descompuesto un problema enorme con infinitas $x$ posibles, en dos pequeñas
  certezas absolutas e independientes.'
definiciones_clave: '- **Determinación de coeficientes correspondientes en polinomios
  idénticos**: Elemento fundamental del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Determinación de coeficientes correspondientes
  en polinomios idénticos**: Reglas de notación y clasificación en grado, ordenamiento
  e igualdad de polinomios.'
