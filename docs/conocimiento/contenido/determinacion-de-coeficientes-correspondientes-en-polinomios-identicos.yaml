procedimiento:
- 'Paso 1: Organiza el polinomio de la izquierda agrupando los términos según el grado
  de su variable.'
- 'Paso 2: Organiza el de la derecha exactamente igual.'
- 'Paso 3: Si en un lado falta un término (por ejemplo, no hay x), asume que su coeficiente
  es cero (+ 0x).'
- 'Paso 4: Crea una lista de mini-ecuaciones igualando el coeficiente izquierdo con
  el derecho para cada grado.'
- 'Paso 5: Resuelve el sistema.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar determinación de coeficientes correspondientes en polinomios
  idénticos.
ejemplos:
- titulo: Rellenando los huecos
  enunciado: Si mx^2 + n = 5x^2 - 4x + 8, halla m y n.
  solucion_pasos:
  - 'Lado izquierdo falta la x. Lo reescribimos como: mx^2 + 0x + n'
  - 'Igualamos cuadráticos: m = 5'
  - 'Igualamos lineales: 0 = -4 (¡Cuidado! Esto genera una contradicción, significa
    que esos polinomios NO pueden ser idénticos jamás en la vida real).'
  - 'Nota teórica: un buen problema siempre tiene congruencia.'
- titulo: Una empresa descompone el modelo de pérdida de inventario en dos fracciones
    teóricas sumadas
  enunciado: 'Una empresa descompone el modelo de pérdida de inventario en dos fracciones
    teóricas sumadas. Tras realizar el álgebra, la consultora concluye que la identidad
    global del sistema se rige por: $(P+Q)x + (P-Q) \equiv 10x + 2$. Para descubrir
    los valores reales de pérdida ($P$) y merma ($Q$), aplican el principio de igualdad
    de coeficientes. ¿Qué sistema de ecuaciones lineales es el correcto a resolver?
    (v1)


    Opciones: A) $P+Q = 10$ y $P-Q = 2$ · B) $P+Q = 2$ y $P-Q = 10$ · C) $(P+Q)x =
    10$ y $P-Q = 2x$ · D) No se puede plantear un sistema sin conocer $x$.'
  solucion_pasos:
  - El coeficiente de x a la izquierda es $(P+Q)$, a la derecha es $10$. Se igualan.
    El término independiente es $(P-Q)$, a la derecha es $2$. Se igualan. Se forma
    un sistema clásico 2x2.
  - 'Respuesta: $P+Q = 10$ y $P-Q = 2$'
- titulo: 'Respecto de «Determinación de coeficientes correspondientes en polinomios
    idénticos»: ¿Es co'
  enunciado: 'Respecto de «Determinación de coeficientes correspondientes en polinomios
    idénticos»: ¿Es correcta esta caracterización? «El **Principio de Igualdad de
    Coeficientes** dicta que en una identidad polinomial (donde dos expresiones son
    siempre iguales sin importar el valor de las variables), **los coeficientes de
    los términos del mismo grado deben ser estrictamente iguales** entre ambos lados
    de la igualdad»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Principio de Igualdad de
    Coeficientes** dicta que en una identidad polinomial (donde dos expresiones son
    siempre iguales sin importar el valor de las variables), **los coeficientes de
    los términos del mismo grado deben ser estrictamente iguales** entre ambos lados
    de la igualdad.'
- titulo: 'Respecto de «Determinación de coeficientes correspondientes en polinomios
    idénticos»: ¿Es vá'
  enunciado: 'Respecto de «Determinación de coeficientes correspondientes en polinomios
    idénticos»: ¿Es válida esta afirmación? «Olvidar rellenar con coeficiente cero
    los términos faltantes antes de emparejar, lo que descalabra las ecuaciones»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Principio de Igualdad de
    Coeficientes** dicta que en una identidad polinomial (donde dos expresiones son
    siempre iguales sin importar el valor de las variables), **los coeficientes de
    los términos del mismo grado deben ser estrictamente iguales** entre ambos lados
    de la igualdad.'
errores_frecuentes:
- Olvidar rellenar con coeficiente cero los términos faltantes antes de emparejar,
  lo que descalabra las ecuaciones.
- Igualar el coeficiente cuadrático de la izquierda con el término independiente de
  la derecha por no haber ordenado primero.
- Despejar la variable 'x' pasándola toda a un solo lado del signo de identidad.
- Dividir todo el polinomio por su término independiente.
- Para «¿Qué paso previo es metodológicamente fundamental antes de aplicar el 'Principio
  de Igualdad de Coeficientes' entre dos polinomios extensos? (v1)», la respuesta
  correcta es Eliminar todos los signos negativos.
afirmaciones_verdaderas:
- La notación de determinación de coeficientes correspondientes en polinomios idénticos
  sigue las convenciones del lenguaje algebraico.
al_terminar_debes_poder: Identificar y operar con conceptos relativos a determinación
