semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.CENTRO_ORIGEN
resumen_inicial: 'Reconocimiento de la ecuación de circunferencia con centro en el
  origen: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: La circunferencia más simple de representar analíticamente es
  aquella centrada en el origen, ya que su ecuación no involucra desplazamientos en
  x ni en y.
explicacion_formal: '![Circunferencia con centro en el origen](/static/img/geometria/analitica/circanal-centro-origen.svg)


  ### Definición formal


  Un punto $(x,y)$ pertenece a la circunferencia de centro $(0,0)$ y radio $r$ si
  su distancia al origen es exactamente $r$: $\sqrt{x^2+y^2}=r$, es decir, $x^2+y^2=r^2$.


  ### Desarrollo didáctico


  La ecuación $x^2+y^2=9$ representa una circunferencia centrada en el origen con
  radio $r=3$, ya que $9=3^2$.'
definiciones_clave: '- **Reconocimiento de la ecuación de circunferencia con centro
  en el origen**: Elemento o propiedad fundamental en el estudio de geometría analítica
  ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a reconocimiento de la ecuación de circunferencia
  con centro en el origen.'
