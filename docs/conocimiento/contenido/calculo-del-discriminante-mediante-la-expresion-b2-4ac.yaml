procedimiento:
- 'Paso 1: Identifica $a$, $b$ y $c$ en la forma general de la ecuación.'
- 'Paso 2: Calcula $b^2$ por separado.'
- 'Paso 3: Calcula el producto $4ac$ por separado, respetando los signos.'
- 'Paso 4: Resta: $\Delta=b^2-(4ac)$.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en cálculo del discriminante mediante la expresión b² - 4ac.
ejemplos:
- titulo: Cálculo con coeficiente a negativo
  enunciado: Calcula el discriminante de $-x^2+6x-9=0$.
  solucion_pasos:
  - $a=-1$, $b=6$, $c=-9$.
  - $b^2=36$; $4ac=4(-1)(-9)=36$.
  - $\Delta=36-36=0$.
- titulo: Cálculo con término lineal negativo
  enunciado: Calcula el discriminante de $2x^2-7x+3=0$.
  solucion_pasos:
  - $a=2$, $b=-7$, $c=3$.
  - $b^2=49$; $4ac=4(2)(3)=24$.
  - $\Delta=49-24=25$.
- titulo: ¿Restar un producto $4ac$ negativo aumenta el valor del discriminante?
  enunciado: ¿Restar un producto $4ac$ negativo aumenta el valor del discriminante?
  respuesta: Sí
  solucion_pasos:
  - Restar un número negativo equivale a sumar su valor absoluto, por lo que el discriminante
    aumenta.
- titulo: ¿El signo de $b$ afecta el resultado de $b^2$?
  enunciado: ¿El signo de $b$ afecta el resultado de $b^2$?
  respuesta: 'No'
  solucion_pasos:
  - Al elevar al cuadrado, el resultado siempre es positivo o cero, sin importar el
    signo original de $b$.
errores_frecuentes:
- Calcular $4ac$ con un signo incorrecto cuando $a$ o $c$ son negativos.
- Olvidar que restar un número negativo equivale a sumar.
- Elevar incorrectamente $b^2$ cuando $b$ es negativo, obteniendo un resultado negativo
  por error.
- Sustituir los coeficientes sin haber llevado antes la ecuación a su forma general.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando cálculo
  del discriminante mediante la expresión b² - 4ac.
