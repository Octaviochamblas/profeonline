semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.CALCULO
resumen_inicial: El cálculo del discriminante mediante la expresión $\Delta = b^2 - 4ac$ requiere sustituir $a$, $b$ y $c$ con paréntesis para calcular con precisión la potencia $(b)^2$ y el producto algebraico $-4ac$.
explicacion_simple: "![El cálculo del discriminante mediante la expresión $\\Delta = b^2 - 4ac$ requiere sustituir $a$, $b$ y $c$ con paréntesis para calcular con precisión la potencia $(b)^2$ y el producto algebraico $-4ac$](/static/img/nodos/calculo-del-discriminante-mediante-la-expresion-b2-4ac-intro.svg)\n\n\nPara calcular el discriminante sin equivocarte en los signos:\n1. Escribe la plantilla: **$\\Delta = (b)^2 - 4(a)(c)$**.\n2. **Calcula el primer término:** $(b)^2$ siempre da un número **positivo o cero** (nunca negativo).\n3. **Calcula el segundo término:** $-4(a)(c)$.\n   - Si $a$ y $c$ tienen el mismo signo (ambos positivos o ambos negativos) $\\implies -4ac$ queda **restando** ($-$).\n   - Si $a$ y $c$ tienen signos contrarios (uno $+$ y el otro $-$) $\\implies -4ac$ queda **sumando** ($+$).\n4. Sumas o restas los dos resultados para obtener el valor final de $\\Delta$."
explicacion_formal: "Sea la aplicación cuadrática $P(x) = ax^2 + bx + c$. La función discriminante $\\Delta: \\mathbb{R}^3 \\setminus (\\{0\\} \\times \\mathbb{R}^2) \\to \\mathbb{R}$ viene dada por la forma bilineal cuadrática:\n$$\\Delta(a, b, c) = b^2 - 4ac$$\n\n**Análisis de componentes aritméticos**:\n- **Término cinético**: $T_1 = b^2 \\ge 0$.\n- **Término potencial de interacción**: $T_2 = -4ac$.\n- **Signo resultante**:\n  $$\\text{sgn}(\\Delta) = \\text{sgn}\\left(b^2 - 4ac\\right)$$\n  Si $ac < 0 \\implies -4ac > 0 \\implies \\Delta = b^2 + |4ac| > 0$ **estrictamente** (garantía de raíces reales)."
definiciones_clave: '- **Regla del producto ac**: Si el coeficiente principal $a$ y el término constante $c$ tienen signos opuestos ($ac < 0$), el discriminante es estrictamente positivo ($\Delta > 0$).'
propiedades_relaciones: '- **Cuadrados perfectos**: Si $\Delta \in \{0, 1, 4, 9, 16, 25, \dots\}$, las raíces de la ecuación son números racionales $\mathbb{Q}$.

  - **No cuadrados**: Si $\Delta > 0$ no es cuadrado perfecto, las raíces son números irracionales $\mathbb{R} \setminus \mathbb{Q}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo del discriminante mediante la expresión $\Delta = b^2 - 4ac$ requiere sustituir $a$, $b$ y $c$ con paréntesis para calcular con precisión la potencia $(b)^2$ y el producto algebraico $-4ac$](/static/img/nodos/calculo-del-discriminante-mediante-la-expresion-b2-4ac-ejemplos.svg)



    Calcula el discriminante para las siguientes tres ecuaciones cuadráticas:

    1) $x^2 - 4x - 5 = 0$

    2) $2x^2 + 4x + 2 = 0$

    3) $3x^2 - 2x + 4 = 0$'
  pasos:
  - 'Paso 1: Para $x^2 - 4x - 5 = 0$ ($a=1, b=-4, c=-5$):

    $\Delta = (-4)^2 - 4(1)(-5) = 16 + 20 = 36$ (cuadrado perfecto positivo).'
  - 'Paso 2: Para $2x^2 + 4x + 2 = 0$ ($a=2, b=4, c=2$):

    $\Delta = (4)^2 - 4(2)(2) = 16 - 16 = 0$ (nulo).'
  - 'Paso 3: Para $3x^2 - 2x + 4 = 0$ ($a=3, b=-2, c=4$):

    $\Delta = (-2)^2 - 4(3)(4) = 4 - 48 = -44$ (negativo).'
checkpoints:
- placement: after_explicacion_formal
  question: En la ecuación $4x^2 - 12x + 9 = 0$, ¿cuál es el valor exacto de Δ?
  choices:
  - text: '0'
    is_correct: true
  - text: '288'
    is_correct: false
  - text: '-144'
    is_correct: false
  - text: '144'
    is_correct: false
  explanation: La alternativa correcta es '0'. $\Delta = (-12)^2 - 4(4)(9) = 144 - 144 = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en una ecuación $a = 3$ y $c = -2$, ¿qué signo tiene con certeza el término $-4ac$?
  choices:
  - text: Positivo (+24)
    is_correct: true
  - text: Negativo (-24)
    is_correct: false
  - text: Cero
    is_correct: false
  - text: Depende del valor de b.
    is_correct: false
  explanation: La alternativa correcta es 'Positivo (+24)'. $-4(3)(-2) = +24$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar con total claridad los coeficientes con signo: $a, b, c$.'
- 'Paso 2: Calcular el cuadrado del coeficiente lineal $(b)^2$.'
- 'Paso 3: Calcular el producto $-4 \cdot a \cdot c$ determinando el signo resultante.'
- 'Paso 4: Realizar la suma algebraica de ambos términos para hallar el valor escalar de $\Delta$.'
errores_correccion: '- **Error común:** Calcular $(-3)^2$ como $-9$ al evaluar $\Delta = (-3)^2 - 4(1)(2)$.

  - **Cómo corregirlo:** Toda base negativa elevada al exponente par 2 es **positiva**: $(-3)^2 = +9$, luego $\Delta = 9 - 8 = 1$.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficientes enteros estándar'
  enunciado: Calcula Δ para $2x^2 + 7x + 3 = 0$.
  alternativas:
  - '25'
  - '73'
  - '-25'
  - '1'
  respuesta: '25'
  solucion_pasos:
  - 'Paso 1: $\Delta = 7^2 - 4(2)(3) = 49 - 24 = 25$.'
- titulo: 'Ejemplo 2: Término cuadrático unitario negativo'
  enunciado: Calcula Δ para $-x^2 + 4x - 4 = 0$.
  alternativas:
  - '0'
  - '32'
  - '-32'
  - '16'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $\Delta = 4^2 - 4(-1)(-4) = 16 - 16 = 0$.'
- titulo: 'Ejemplo 3: Discriminante grande'
  enunciado: Calcula Δ para $x^2 - 10x - 24 = 0$.
  alternativas:
  - '196'
  - '4'
  - '-196'
  - '100'
  respuesta: '196'
  solucion_pasos:
  - 'Paso 1: $\Delta = (-10)^2 - 4(1)(-24) = 100 + 96 = 196$ ($14^2$).'
- titulo: 'Ejemplo 4: Sin término lineal'
  enunciado: Calcula Δ para $3x^2 + 12 = 0$.
  alternativas:
  - '-144'
  - '144'
  - '0'
  - '36'
  respuesta: '-144'
  solucion_pasos:
  - 'Paso 1: $b = 0 \implies \Delta = 0 - 4(3)(12) = -144$.'
errores_frecuentes:
- Elevar al cuadrado b como número negativo.
- Equivocar la multiplicación de signos en -4ac.
- Olvidar multiplicar por el coeficiente cuadrático a.
afirmaciones_verdaderas:
- El cálculo del discriminante involucra la evaluación de b² y la resta del producto 4ac.
- Si ac < 0, el discriminante es garantizadamente positivo.
al_terminar_debes_poder: '**QUÉ:** Calcular con exactitud el discriminante de cualquier ecuación cuadrática mediante b² - 4ac.


  **CÓMO:** Sustituyendo con paréntesis los coeficientes a, b y c y resolviendo las operaciones de signos.


