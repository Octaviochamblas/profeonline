semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.CALCULO
resumen_inicial: El cálculo del discriminante aplica la fórmula $\Delta = b^2 - 4ac$ utilizando paréntesis numéricos para resolver correctamente la jerarquía de operaciones.
explicacion_simple: |
  Para calcular el **discriminante** de una ecuación cuadrática sin cometer errores de signo:

  - **Ecuación de ejemplo**: $2x^2 - 4x - 3 = 0$.
  - **Paso 1**: Identificas $a = 2$, $b = -4$, $c = -3$.
  - **Paso 2**: Reemplazas en $\Delta = b^2 - 4ac$ usando paréntesis:
    $$\Delta = (-4)^2 - 4(2)(-3)$$
  - **Paso 3**: Calculas en orden:
    - Primero la potencia: $(-4)^2 = +16$.
    - Luego la multiplicación triple: $-4 \cdot 2 \cdot (-3) = +24$.
    - Sumas los resultados: $\Delta = 16 + 24 = 40$.
  - **Resultado**: Como $\Delta = 40 > 0$, la ecuación tiene 2 soluciones reales distintas.
explicacion_formal: |
  Dada la ecuación cuadrática $ax^2 + bx + c = 0$, el cálculo formal de la función discriminante $\Delta(a, b, c): \mathbb{R}^* \times \mathbb{R} \times \mathbb{R} \to \mathbb{R}$ aplica la estructura de orden algebraico estricto:

  $$\Delta = (b)^2 - 4 \cdot (a) \cdot (c)$$

  **Prioridad de operaciones y ley de signos:**
  1. Evaluación del término cuadrático: $(b)^2 \ge 0 \quad \forall b \in \mathbb{R}$.
  2. Evaluación del producto discriminante: $-4ac \in \mathbb{R}$.
  3. Adición algebraica: $\Delta = (b)^2 + (-4ac)$.
definiciones_clave: |
  - **Cálculo del discriminante**: Operación combinada que evalúa la diferencia entre el cuadrado del coeficiente lineal $b^2$ y el cuádruple producto del coeficiente cuadrático por el constante $4ac$.
propiedades_relaciones: |
  - **Cero en coeficientes incompletos**:
    - Si $b = 0$ (ecuación pura $ax^2 + c = 0$), entonces $\Delta = -4ac$.
    - Si $c = 0$ (ecuación binomia $ax^2 + bx = 0$), entonces $\Delta = b^2 \ge 0$.
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico exacto del discriminante para la ecuación cuadrática $3x^2 - 5x + 2 = 0$.'
  pasos:
    - 'Paso 1: Extraer coeficientes: $a = 3$, $b = -5$, $c = 2$.'
    - 'Paso 2: Reemplazar en la fórmula: $\Delta = (-5)^2 - 4(3)(2)$.'
    - 'Paso 3: Resolver potencia y producto: $(-5)^2 = 25$ y $-4(3)(2) = -24$.'
    - 'Paso 4: Realizar la resta: $\Delta = 25 - 24 = 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del discriminante $\Delta$ de la ecuación cuadrática $x^2 - 4x + 4 = 0$?'
    choices:
      - {text: '$\Delta = 0$', is_correct: true}
      - {text: '$\Delta = 16$', is_correct: false}
      - {text: '$\Delta = -16$', is_correct: false}
      - {text: '$\Delta = 32$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\Delta = 0$''. Reemplazando $\Delta = (-4)^2 - 4(1)(4) = 16 - 16 = 0$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Al calcular el discriminante de la ecuación incompleta $2x^2 - 8 = 0$, ¿qué valor se obtiene?'
    choices:
      - {text: '$\Delta = 64$', is_correct: true}
      - {text: '$\Delta = -64$', is_correct: false}
      - {text: '$\Delta = 16$', is_correct: false}
      - {text: '$\Delta = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\Delta = 64$''. Como $b = 0$, $\Delta = 0^2 - 4(2)(-8) = 0 + 64 = 64$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar con claridad los valores numéricos de $a$, $b$ y $c$.'
  - 'Paso 2: Escribir la fórmula del discriminante $\Delta = b^2 - 4ac$ utilizando paréntesis en cada sustitución.'
  - 'Paso 3: Elevar $b$ al cuadrado asegurando un resultado siempre positivo o nulo ($b^2 \ge 0$).'
  - 'Paso 4: Multiplicar los números $-4 \cdot a \cdot c$ respetando las reglas de signos y sumar/restar el resultado final.'
errores_correccion: |
  - **Error común:** Escribir $(-3)^2 = -9$ al evaluar $b^2$ con coeficiente negativo.
  - **Cómo corregirlo:** El cuadrado de cualquier número real **SIEMPRE ES POSITIVO**; $(-3)^2 = +9$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Discriminante con producto positivo.
    alternativas:
      - '$\Delta = 49$'
      - '$\Delta = -31$'
      - '$\Delta = 1$'
    respuesta: '$\Delta = 49$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Discriminante con producto negativo.
    alternativas:
      - '$\Delta = -7$'
      - '$\Delta = 25$'
      - '$\Delta = 0$'
    respuesta: '$\Delta = -7$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Evaluar el cuadrado de un coeficiente negativo como un resultado negativo $-4^2 = -16$ en el cálculo de $\Delta$.'
  - 'La sustitución de signos hace que $-4(1)(-5)$ se evalúe como $-20$ en lugar de $+20$.'
  - 'La falta de inclusión de la constante 4 en el producto $4ac$ multiplicando únicamente $a \cdot c$.'
  - 'Calcular el discriminante de una ecuación cuadrática tomando el término independiente con signo cambiado antes de igualar a cero.'
  - 'La suposición errónea de que si la constante $c = 0$, el discriminante es de valor numérico cero.'
afirmaciones_verdaderas:
  - 'El término cuadrático $b^2$ en la fórmula del discriminante $\Delta = b^2 - 4ac$ produce un resultado siempre mayor o igual a cero.'
  - 'En una ecuación incompleta binomia $ax^2 + bx = 0$ ($c = 0$), el discriminante se reduce a $\Delta = b^2 \ge 0$.'
al_terminar_debes_poder: |
  QUÉ: Calcular con precisión matemática el valor del discriminante $\Delta = b^2 - 4ac$.
  CÓMO: Isolar $a, b, c$, evaluar $b^2$, efectuar el producto $-4ac$ con regla de signos y sumar/restar los términos.
