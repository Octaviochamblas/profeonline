semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.CALCULO
resumen_inicial: 'Cálculo del discriminante mediante la expresión b² - 4ac: concepto,
  discriminante, soluciones y modelamiento en El discriminante y la naturaleza de
  las raíces.'
explicacion_simple: Calcular el discriminante es un procedimiento mecánico de tres
  pasos, pero exige cuidado especial con los signos, sobre todo cuando $a$ o $c$ son
  negativos.
explicacion_formal: '### Definición formal


  El cálculo del discriminante $\Delta=b^2-4ac$ requiere elevar $b$ al cuadrado, calcular
  el producto $4ac$, y restar ambos resultados en ese orden. Cada operación debe respetar
  los signos de los coeficientes originales.


  ### Desarrollo didáctico


  Es recomendable calcular $b^2$ y $4ac$ por separado antes de restar, especialmente
  cuando $a$ o $c$ son negativos, ya que el producto $4ac$ puede resultar negativo,
  y restar un número negativo equivale a sumar.


  Para $3x^2+2x-5=0$: $b^2=2^2=4$; $4ac=4(3)(-5)=-60$; $\Delta=4-(-60)=4+60=64$.'
definiciones_clave: '- **Cálculo del discriminante mediante la expresión b² - 4ac**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en cálculo
  del discriminante mediante la expresión b² - 4ac.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando cálculo del discriminante
    mediante la expresión b² - 4ac.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a cálculo del discriminante
    mediante la expresión b² - 4ac.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
