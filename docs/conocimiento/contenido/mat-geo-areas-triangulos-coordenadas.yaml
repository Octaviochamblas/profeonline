semantic_id: MAT.GEO.AREAS_TRIANGULOS.AREA_COORDENADAS
resumen_inicial: 'Cálculo del área de un triángulo con vértices dados por coordenadas
  mediante determinante: conceptos, teoremas, propiedades geométricas y cálculo en
  Perímetros, Áreas y Teoremas.'
explicacion_simple: Cuando un triángulo se describe solo con las coordenadas de sus
  tres puntos, existe una fórmula directa (basada en un determinante) que entrega
  el área sin necesitar dibujar nada.
explicacion_formal: '![Área de un triángulo por coordenadas](/static/img/geometria/areas-pitagoras/areas-triangulos-coordenadas.svg)


  ### Definición formal


  Dado un triángulo con vértices $(x_1,y_1)$, $(x_2,y_2)$ y $(x_3,y_3)$, su área se
  calcula como

  $A=\frac{1}{2}\left|x_1(y_2-y_3)+x_2(y_3-y_1)+x_3(y_1-y_2)\right|$.


  ### Desarrollo didáctico


  El valor absoluto es indispensable en esta fórmula, ya que el resultado interno
  del determinante puede ser

  negativo dependiendo del orden en que se listen los vértices, pero el área siempre
  debe ser positiva.'
definiciones_clave: '- **Cálculo del área de un triángulo con vértices dados por coordenadas
  mediante determinante**: Elemento o propiedad fundamental en el estudio de perímetros,
  áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del área de un triángulo con vértices
  dados por coordenadas mediante determinante.'
ejemplo_guiado:
  enunciado: Para analizar cálculo del área de un triángulo con vértices dados por
    coordenadas mediante determinante, considera un ángulo $\alpha = 131^\circ$ ubicado
    en la posición dada. Determina el valor de la medida asociada sabiendo que $x
    + 1000^\circ = 131^\circ$.
  pasos:
  - Identificar la propiedad de cálculo del área de un triángulo con vértices dados
    por coordenadas mediante determinante referida a $\alpha = 131^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1000 = 131 \implies x = 131 - 1000$.'
  - Concluir que la medida calculada para cálculo del área de un triángulo con vértices
    dados por coordenadas mediante determinante es $x = -869^\circ$.
