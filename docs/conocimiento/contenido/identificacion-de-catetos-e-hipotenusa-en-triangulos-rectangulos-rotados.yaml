semantic_id: MAT.GEO.TRIANGULOS_RECTANGULOS.IDENTIFICACION_ROTADO
resumen_inicial: La identificación de catetos e hipotenusa en triángulos rectángulos
  rotados se realiza localizando invariablemente el ángulo recto de 90°, siendo el
  lado opuesto siempre la hipotenusa independientemente de la orientación espacial.
explicacion_simple: '![Triángulo Rectángulo Rotado](/static/img/nodos/identificacion-de-catetos-e-hipotenusa-en-triangulos-rectangulos-rotados-intro.svg)


  Muchas personas se acostumbran a ver el triángulo rectángulo siempre de la misma
  forma (con el ángulo recto abajo a la izquierda). Pero en pruebas y problemas reales,
  ¡el triángulo puede estar de cabeza, inclinado o de lado! Para no equivocarte nunca:
  **1) Busca el cuadradito de $90^\circ$**; **2) El lado que está al frente es SIEMPRE
  la hipotenusa**; **3) Los dos lados que tocan el cuadradito son los catetos**.'
explicacion_formal: '### Teorema de invariancia por isometría

  La condición de catetos e hipotenusa en un triángulo rectángulo es una propiedad
  intrínseca invariante bajo cualquier rotación, traslación o reflexión en el plano
  euclidiano:


  $$\forall R_\theta \in \operatorname{SO}(2), \quad \operatorname{Hipotenusa}(R_\theta(\Delta
  ABC)) = R_\theta(\overline{AB}) \iff \text{Lado opuesto al ángulo de } 90^\circ$$


  ### Desglose simbólico y geométrico

  - Identificación universal: La hipotenusa es siempre el lado opuesto al vértice
  que contiene el símbolo de ángulo recto $\llcorner$, sin importar si está horizontal,
  vertical o inclinado.

  - Catetos: Son siempre los dos lados perpendiculares entre sí que forman el vértice
  del ángulo recto.


  ### Síntesis didáctica

  Reconocer los elementos del triángulo rectángulo por su relación geométrica con
  el ángulo recto elimina errores causados por rotaciones de la figura.'
definiciones_clave: '- **Invarianza por rotación**: Propiedad geométrica de mantenerse
  inalterada bajo cualquier giro angular en el plano.

  - **Sesgo de prototipo estándar**: Error cognitivo de reconocer figuras geométricas
  solo en su orientación típica horizontal.

  - **Algoritmo de identificación universal**: 1) Detectar $90^\circ$, 2) Opuesto
  = Hipotenusa, 3) Incidentes = Catetos. '
propiedades_relaciones: '- **Triángulo apoyado en la hipotenusa**: En esta posición
  la altura trazada desde el ángulo recto divide la hipotenusa en dos proyecciones
  (Teorema de Euclides).

  - **Constancia del Teorema de Pitágoras**: La relación $a^2 + b^2 = c^2$ se mantiene
  exactamente idéntica sin importar el ángulo de inclinación del dibujo. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo Rotado](/static/img/nodos/identificacion-de-catetos-e-hipotenusa-en-triangulos-rectangulos-rotados-ejemplos.svg)


    Un triángulo rectángulo $\triangle MNP$ está dibujado con su ángulo recto en la
    parte superior, en el vértice $M$ ($\angle M = 90^\circ$). Sus lados miden $MN
    = 12\text{ cm}$, $MP = 16\text{ cm}$ y $NP = 20\text{ cm}$. Identifica cuál segmento
    es la hipotenusa y cuáles son los catetos.'
  pasos:
  - 'Paso 1: Localizar el ángulo de $90^\circ$: está en el vértice superior $M$.'
  - 'Paso 2: Mirar al lado que está directamente enfrente del vértice $M$: es el segmento
    $\overline{NP}$.'
  - 'Paso 3: Como $\overline{NP}$ está opuesto al ángulo recto (y mide $20\text{ cm}$,
    el mayor valor), **$\overline{NP}$ es la hipotenusa**.'
  - 'Paso 4: Los dos segmentos que concurren en $M$ son $\overline{MN}$ ($12\text{
    cm}$) y $\overline{MP}$ ($16\text{ cm}$), por lo que **$\overline{MN}$ y $\overline{MP}$
    son los catetos**.'
  - 'Paso 5: Comprobar con Pitágoras: $12^2 + 16^2 = 144 + 256 = 400 = 20^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la hipotenusa sigue siendo la misma si rotamos o giramos un triángulo
    rectángulo en el plano?
  choices:
  - text: Porque es una propiedad geométrica estructural (siempre es el lado opuesto
      al ángulo recto)
    is_correct: true
  - text: Porque al rotarlo se convierte en triángulo equilátero
    is_correct: false
  - text: Porque la hipotenusa siempre debe ser horizontal
    is_correct: false
  - text: Al rotarlo los catetos se convierten en hipotenusas
    is_correct: false
  explanation: Por invariancia euclidiana, la hipotenusa sigue siendo la misma porque
    es una propiedad geométrica estructural (siempre es el lado opuesto al ángulo
    recto).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo rectángulo tiene su ángulo recto arriba y su lado inferior
    horizontal mide 25 cm frente al ángulo recto, ¿qué representa ese lado inferior?
  choices:
  - text: La hipotenusa del triángulo (porque está enfrente del ángulo recto de 90°)
    is_correct: true
  - text: El cateto base
    is_correct: false
  - text: La altura de la figura
    is_correct: false
  - text: Una mediana
    is_correct: false
  explanation: Al estar situado enfrente del ángulo recto de 90°, es la hipotenusa
    del triángulo (porque está enfrente del ángulo recto de 90°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar visualmente el símbolo del ángulo recto ($90^\circ$).'
- 'Paso 2: Ignorar la posición horizontal o vertical de la hoja o pantalla.'
- 'Paso 3: Identificar el lado que está justo enfrente de los $90^\circ$ como la hipotenusa.'
- 'Paso 4: Identificar los dos lados que forman los $90^\circ$ como los catetos.'
errores_correccion: 'No te dejes engañar por la inclinación: busca siempre el cuadradito
  de 90° primero y apunta hacia el frente para hallar la hipotenusa.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo rectángulo está apoyado horizontalmente sobre su hipotenusa,
    ¿cuáles son los catetos?
  alternativas:
  - Los dos lados inclinados que suben hacia el vértice del ángulo recto superior
  - El lado horizontal inferior
  - No tiene catetos en esa posición
  respuesta: Los dos lados inclinados que suben hacia el vértice del ángulo recto
    superior
  solucion_pasos:
  - Los catetos son siempre los dos lados que concurren en el ángulo recto, sin importar
    su inclinación.
- titulo: Ejemplo 2
  enunciado: En la figura con vértices $X, Y, Z$, el ángulo recto está en $Z$. ¿Cuál
    es la hipotenusa?
  alternativas:
  - $\overline{XY}$
  - $\overline{XZ}$
  - $\overline{YZ}$
  respuesta: $\overline{XY}$
  solucion_pasos:
  - El lado opuesto al vértice recto $Z$ es el segmento $\overline{XY}$.
- titulo: ¿Al rotar un triángulo rectángulo la hipotenusa cambia de lado?
  respuesta: 'No'
  solucion_pasos:
  - No, la relación de oposición al ángulo recto se mantiene intacta bajo rotaciones.
- titulo: ¿La hipotenusa puede estar dibujada en posición vertical?
  respuesta: Sí
  solucion_pasos:
  - Sí, basta con que esté enfrente del ángulo recto lateral.
errores_frecuentes:
- Asumir que la hipotenusa siempre tiene que estar inclinada en diagonal.
- Llamar cateto al lado de abajo solo por estar en la base física del dibujo.
- Confundir los catetos cuando el ángulo recto apunta hacia la derecha o hacia arriba.
- Olvidar que el Teorema de Pitágoras aplica igual en cualquier orientación.
- Buscar la hipotenusa midiendo visualmente sin verificar la posición del ángulo de
  90°.
afirmaciones_verdaderas:
- La hipotenusa es siempre el lado opuesto al ángulo recto, sin importar cómo esté
  orientado el triángulo.
- Los catetos son siempre los dos lados que forman el ángulo de $90^\circ$.
al_terminar_debes_poder: '**QUÉ:** Identificar con total seguridad catetos e hipotenusa
  en triángulos rectángulos con cualquier orientación espacial.


  **CÓMO:** Localizando el ángulo de $90^\circ$ y reconociendo el lado opuesto como
  hipotenusa y los lados concurrentes como catetos.


  ![Resumen de Triángulos Rotados](/static/img/nodos/identificacion-de-catetos-e-hipotenusa-en-triangulos-rectangulos-rotados-resumen.svg)'
