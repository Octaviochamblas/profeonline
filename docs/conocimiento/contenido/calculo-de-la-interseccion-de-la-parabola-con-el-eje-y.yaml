semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.INTERSECCION_Y
resumen_inicial: El cálculo de la intersección con el eje Y determina el punto $(0, c)$ donde la curva cruza el eje vertical al evaluar $f(0)$.
explicacion_simple: |
  El **corte con el eje Y** es el punto exacto por donde la parábola atraviesa la línea vertical del plano:

  - Para encontrarlo, **reemplazas la $x$ por cero ($x = 0$)**:
    $$f(0) = a(0)^2 + b(0) + c = c$$
  - **Regla rápida**: ¡El corte con el eje Y es siempre el par ordenado **$(0, c)$**!
  - **Ejemplo**: En la función $f(x) = 3x^2 - 5x + 8$:
    - Como $c = 8$, el punto de corte con el eje Y es **$(0, 8)$**.
  - **Propiedad importante**: Toda función cuadrática corta al eje Y en **EXACTAMENTE UN PUNTO**.
explicacion_formal: |
  Sea la función cuadrática $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$. La intersección de la parábola con el eje de las ordenadas $Y$ (recta $x = 0$) se define mediante el conjunto singleton:

  $$\mathcal{P} \cap \{(x, y) \in \mathbb{R}^2 \mid x = 0\} = \{(0, f(0))\} = \{(0, c)\}$$

  **Teorema de intersección única en Y:**
  Dado que $\text{Dom}(f) = \mathbb{R}$ y $f$ cumple el criterio de función, existe **un y solo un punto** de intersección con el eje vertical $Y$, cuya coordenada es invariablemente $(0, c)$.
definiciones_clave: |
  - **Intersección con el eje Y**: Punto del plano cartesiano de coordenadas $(0, c)$ donde la curva de la parábola cruza el eje vertical.
propiedades_relaciones: |
  - **Simetría respecto al eje Y**: Si $b = 0$, el punto de intersección $(0, c)$ coincide exactamente con el vértice de la parábola.
ejemplo_guiado:
  enunciado: 'Halla las coordenadas del punto de corte de la gráfica de $f(x) = 2x - x^2 - 9$ con el eje Y.'
  pasos:
    - 'Paso 1: Evaluar la función en $x = 0$: $f(0) = 2(0) - (0)^2 - 9$.'
    - 'Paso 2: Calcular el resultado de la constante: $f(0) = -9$.'
    - 'Paso 3: Construir el par ordenado con abscisa 0: $(0, -9)$.'
    - 'Paso 4: Concluir que la parábola interseca al eje Y en $(0, -9)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué punto cruza al eje Y la parábola definida por $f(x) = -4x^2 + 15$?'
    choices:
      - {text: 'En el punto de coordenadas $(0, 15)$', is_correct: true}
      - {text: 'En el punto de coordenadas $(15, 0)$.', is_correct: false}
      - {text: 'En el punto de coordenadas $(0, -4)$.', is_correct: false}
      - {text: 'En el origen $(0,0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''En el punto de coordenadas $(0, 15)$''. Evaluando $f(0) = 15$, el corte es $(0, 15)$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuántos puntos de intersección con el eje Y puede tener como máximo una función cuadrática?'
    choices:
      - {text: 'Exactamente un único punto', is_correct: true}
      - {text: 'Dos puntos distintos.', is_correct: false}
      - {text: 'Ningún punto si el discriminante es negativo.', is_correct: false}
      - {text: 'Infinitos puntos si $c = 0$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente un único punto''. Por ser función, toda parábola vertical corta al eje Y en un único punto.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el término independiente $c$ de la expresión funcional cuadrática.'
  - 'Paso 2: Opcionalmente, evaluar $f(0)$ sustituyendo $x = 0$.'
  - 'Paso 3: Formar el par ordenado colocándole $0$ en la abscisa $x$ y $c$ en la ordenada $y$.'
  - 'Paso 4: Declarar las coordenadas finales $(0, c)$.'
errores_correccion: |
  - **Error común:** Escribir las coordenadas al revés como $(c, 0)$ en lugar de $(0, c)$.
  - **Cómo corregirlo:** El corte en Y exige **$x = 0$ COMO PRIMERA COMPONENTE**; la forma correcta es $(0, c)$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Corte con el eje Y.
    alternativas:
      - 'Punto (0, -6)'
      - 'Punto (-6, 0)'
      - 'Punto (0, 2)'
    respuesta: 'Punto (0, -6)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Paso por el origen.
    alternativas:
      - 'Punto (0, 0)'
      - 'Punto (0, 5)'
      - 'Sin intersección'
    respuesta: 'Punto (0, 0)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El intercambio de la posición de las coordenadas declarando que la intersección con el eje Y ocurre en $(c, 0)$.'
  - 'La creencia de que si la parábola no corta al eje X, tampoco interseca al eje Y.'
  - 'La equivalencia errónea entre el valor del punto de corte en Y y la ordenada del vértice en parábolas donde $b \neq 0$.'
  - 'La suposición de que una parábola muy estrecha no alcanza a cruzar al eje Y en valores lejanos del origen.'
  - 'Evaluar $f(1)$ en lugar de $f(0)$ para buscar la intersección vertical.'
afirmaciones_verdaderas:
  - 'Toda función cuadrática tiene una única intersección con el eje Y dada por el punto de coordenadas $(0, c)$.'
  - 'Evaluar $f(0)$ anula los términos cuadrático y lineal, dejando únicamente la constante del término independiente $c$.'
al_terminar_debes_poder: |
  QUÉ: Calcular y representar el punto de intersección de la parábola con el eje Y.
  CÓMO: Evaluar $f(0) = c$, aislar el término independiente y expresar las coordenadas únicas $(0, c)$.
