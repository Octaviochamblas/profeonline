semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.INTERSECCION_Y
resumen_inicial: 'Toda función cuadrática corta al eje vertical de las ordenadas en un único punto de coordenadas $(0, c)$, correspondiente al valor $f(0)$.'
explicacion_simple: |
  Para averiguar exactamente dónde cruza la parábola al eje vertical (eje $y$), reemplazamos la variable $x$ por cero en la regla de la función. Al evaluar $f(0)$, los términos con $x$ se anulan y solo sobrevive el término independiente $c$. Por lo tanto, el corte con el eje $y$ es siempre el punto con coordenadas $(0, c)$.
explicacion_formal: |
  ### Definición formal
  La **intersección con el eje de las ordenadas (eje $y$)** de la gráfica de $y = f(x)$ es el par ordenado $(0, y_0)$ obtenido al resolver:
  $$y_0 = f(0) = a(0)^2 + b(0) + c = c$$

  ### Desglose simbólico
  - $x = 0$: Condición algebraica del eje $y$.
  - $(0, c)$: Coordenadas cartesianas del punto de corte.
  - Unicidad: Dado que $\operatorname{Dom}(f) = \mathbb{R}$ y $f$ es una función bien definida, existe **exactamente un solo punto de intersección** con el eje $y$.

  ### Síntesis didáctica
  En la forma general $f(x) = ax^2 + bx + c$, la constante $c$ entrega la intersección sin realizar cálculos. En formas desarrolladas mediante paréntesis (canónica o factorizada), la intersección se obtiene evaluando $x = 0$ en la estructura dada.
definiciones_clave: |
  - **Intersección con el eje $y$**: Punto del plano cartesiano $(0, c)$ donde la gráfica atraviesa el eje vertical.
  - **Evaluación en el origen $f(0)$**: Valor de salida numérico resultante al asignar $x = 0$.
  - **Ordenada al origen**: Nombre de la coordenada $c$ del punto de intersección.
propiedades_relaciones: |
  - **Garantía de existencia**: A diferencia de las intersecciones con el eje $x$ (que pueden no existir en los reales), toda parábola cuadrática corta obligatoriamente al eje $y$ en un punto real.
  - **Paso por el origen**: La parábola pasa por $(0,0) \iff c = 0$.
ejemplo_guiado:
  enunciado: 'Calcula las coordenadas exactas del punto de intersección con el eje $y$ para las funciones $f(x) = 3x^2 - 7x + 4$ y $g(x) = -2(x + 3)^2 + 10$.'
  pasos:
    - 'Paso 1: Para $f(x)$, observamos la forma general $3x^2 - 7x + 4$, donde $c = 4$.'
    - 'Paso 2: Evaluamos $f(0) = 3(0)^2 - 7(0) + 4 = 4$, obteniendo el punto de corte en $(0, 4)$.'
    - 'Paso 3: Para $g(x)$, evaluamos $x = 0$ en su forma canónica: $g(0) = -2(0 + 3)^2 + 10 = -2(9) + 10 = -18 + 10 = -8$.'
    - 'Paso 4: Concluimos que la parábola $g(x)$ interseca al eje $y$ en el punto $(0, -8)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué punto del plano cartesiano interseca al eje $y$ la función cuadrática $h(x) = -6x^2 + 11x - 9$?'
    choices:
      - {text: '$(0, -9)$', is_correct: true}
      - {text: '$(-9, 0)$', is_correct: false}
      - {text: '$(0, 11)$', is_correct: false}
      - {text: '$(0, -6)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(0, -9)$''. El corte con el eje $y$ es $(0, c) = (0, f(0)) = (0, -9)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función en forma factorizada $p(x) = (x - 2)(x + 5)$, ¿cuál es el punto de intersección de su gráfica con el eje $y$?'
    choices:
      - {text: '$(0, -10)$', is_correct: true}
      - {text: '$(0, 10)$', is_correct: false}
      - {text: '$(2, 0)$', is_correct: false}
      - {text: '$(-5, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(0, -10)$''. Evaluamos $p(0) = (0 - 2)(0 + 5) = (-2)(5) = -10$, produciendo el punto $(0, -10)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sustituir la variable $x$ por cero en la regla de la función cuadrática.'
  - 'Paso 2: Efectuar las operaciones de potencia, multiplicación y suma para obtener $f(0)$.'
  - 'Paso 3: Escribir el resultado como el par ordenado $(0, f(0))$.'
errores_correccion: |
  - **Error 1:** Invertir las coordenadas del punto de corte escribiendo $(c, 0)$ en lugar de $(0, c)$. **Cómo corregirlo:** La condición del eje $y$ es $x = 0$, por lo que la primera coordenada (abscisa) debe ser cero: $(0, c)$. El par $(c, 0)$ yace sobre el eje $x$.
  - **Error 2:** Asumir que si una parábola abre hacia abajo, no puede cortar al eje $y$. **Cómo corregirlo:** Toda parábola cuadrática de dominio $\mathbb{R}$ se extiende horizontalmente y corta siempre al eje $y$ en $(0, c)$.
ejemplos:
  - titulo: 'Corte con el eje y en forma general'
    enunciado: '¿Cuál es la intersección con el eje $y$ de $f(x) = 2x^2 + 5x + 12$?'
    alternativas:
      - '$(0, 12)$'
      - '$(12, 0)$'
      - '$(0, 2)$'
    respuesta: '$(0, 12)$'
    solucion_pasos:
      - '1. Identificamos el término independiente $c = 12$.'
      - '2. El corte con el eje $y$ es $(0, c) = (0, 12)$.'
  - titulo: 'Corte con el eje y cuando c = 0'
    enunciado: '¿Dónde interseca al eje $y$ la función $g(x) = -x^2 + 9x$?'
    alternativas:
      - '$(0, 0)$'
      - '$(0, 9)$'
      - '$(9, 0)$'
    respuesta: '$(0, 0)$'
    solucion_pasos:
      - '1. Como $c = 0$, evaluamos $g(0) = -0^2 + 9(0) = 0$.'
      - '2. El punto de corte es el origen del plano cartesiano $(0, 0)$.'
  - titulo: 'Garantía de intersección'
    enunciado: '¿Existe alguna función cuadrática polinomial que no interseque al eje $y$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Puesto que $x = 0$ pertenece al dominio de toda función cuadrática real, siempre se obtiene la intersección en $(0, f(0))$.'
  - titulo: 'Unicidad de la intersección con el eje y'
    enunciado: '¿Una parábola cuadrática puede cortar al eje $y$ en dos puntos diferentes?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Por el criterio de la línea vertical de las funciones, a cada preimagen $x = 0$ le corresponde una única imagen $y = c$.'
errores_frecuentes:
  - 'El punto de corte de la función $f(x) = x^2 - 4x + 3$ con el eje $y$ tiene coordenadas $(3, 0)$.'
  - 'Una función cuadrática con $a < 0$ puede carecer de intersección con el eje $y$.'
  - 'En la forma canónica $f(x) = a(x - h)^2 + k$, el corte con el eje $y$ se ubica siempre en $(0, k)$.'
  - 'Una parábola puede cortar al eje $y$ en dos o más puntos si su coeficiente cuadrático $a$ es muy grande.'
  - 'La intersección con el eje $y$ se calcula igualando la función a cero ($f(x) = 0$).'
afirmaciones_verdaderas:
  - 'Toda función cuadrática definida en $\mathbb{R}$ interseca al eje de las ordenadas en exactamente un punto de coordenadas $(0, c)$.'
  - 'La intersección con el eje $y$ se calcula mediante la evaluación directa de la función en $x = 0$.'
al_terminar_debes_poder: 'Calcular y graficar con precisión la intersección única de cualquier parábola cuadrática con el eje $y$.'
