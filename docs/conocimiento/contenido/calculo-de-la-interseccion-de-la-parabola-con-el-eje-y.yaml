semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.INTERSECCION_Y
resumen_inicial: El cálculo de la intersección con el eje $Y$ se realiza evaluando la función cuadrática en $x = 0$, obteniendo de forma directa el punto cartesiano $(0, c)$, el cual existe y es único para toda función cuadrática.
explicacion_simple: "![El cálculo de la intersección con el eje $Y$ se realiza evaluando la función cuadrática en $x = 0$, obteniendo de forma directa el punto cartesiano $(0, c)$, el cual existe y es único para toda función cuadrática](/static/img/nodos/calculo-de-la-interseccion-de-la-parabola-con-el-eje-y-intro.svg)\n\n\nPara saber en qué número exacto la parábola choca con la línea vertical del eje $Y$:\n\n- Solo tienes que cambiar la $x$ por cero ($x = 0$):\n  $$f(0) = a(0)^2 + b(0) + c = c$$\n- Por lo tanto, el punto de corte con el eje $Y$ es **$(0, c)$**.\n- **¡Es instantáneo!** El término independiente $c$ te da la respuesta directamente.\n- *Ejemplo:* En $f(x) = 2x^2 + 5x - 7$, el corte con el eje $Y$ es el punto **$(0, -7)$**.\n- Toda parábola corta al eje $Y$ **exactamente una sola vez**."
explicacion_formal: 'Sea $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$ ($a \neq 0$). La **intersección con el eje de ordenadas** corresponde a la solución del sistema algebraico:

  $$\begin{cases} y = ax^2 + bx + c \\ x = 0 \end{cases} \Longrightarrow y = c \implies P_Y = (0, c)$$


  **Teorema de Existencia y Unicidad del Corte Vertical**:

  1. **Existencia universal**: Como $0 \in \text{Dom}(f) = \mathbb{R}$, $f(0)$ está siempre definida.

  2. **Unicidad funcional**: Por la propiedad fundamental de las funciones ($x = 0$ no puede tener dos imágenes distintas), la intersección con el eje $Y$ es estrictamente única.

  3. **Criterio del origen**: La gráfica contiene al origen si y solo si $c = 0$ ($P_Y = (0, 0)$).'
definiciones_clave: '- **Ordenada al origen**: Valor escalar $c = f(0)$ correspondiente a la cota vertical de corte con el eje $Y$.

  - **Punto de intersección vertical**: Par ordenado $(0, c)$ en el plano cartesiano.'
propiedades_relaciones: '- **Independencia del discriminante**: A diferencia de los cortes con el eje $X$, el corte con el eje $Y$ existe siempre, incluso si $\Delta < 0$.

  - **Traslación vertical**: Sumar una constante $k$ a la función ($f(x) + k$) traslada el punto de corte a $(0, c + k)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo de la intersección con el eje $Y$ se realiza evaluando la función cuadrática en $x = 0$, obteniendo de forma directa el punto cartesiano $(0, c)$, el cual existe y es único para toda función cuadrática](/static/img/nodos/calculo-de-la-interseccion-de-la-parabola-con-el-eje-y-ejemplos.svg)



    Calcula el punto de corte con el eje Y para las funciones:

    1) $f(x) = -3x^2 + 8x - 14$

    2) $g(x) = 2(x + 1)(x - 5)$'
  pasos:
  - 'Paso 1: Para $f(x) = -3x^2 + 8x - 14$:

    - Se lee directamente el término constante: $c = -14$.

    - Punto de corte con eje $Y$: $(0, -14)$.'
  - 'Paso 2: Para $g(x) = 2(x + 1)(x - 5)$:

    - Evaluar en $x = 0$:

    $g(0) = 2(0 + 1)(0 - 5) = 2(1)(-5) = -10$.

    - Punto de corte con eje $Y$: $(0, -10)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje Y la parábola $f(x) = 5x^2 - 3x + 8$?
  choices:
  - text: (0, 8)
    is_correct: true
  - text: (8, 0)
    is_correct: false
  - text: (0, -3)
    is_correct: false
  - text: (0, 5)
    is_correct: false
  explanation: La alternativa correcta es '(0, 8)'. Al evaluar $x = 0$, $f(0) = 8 \implies (0, 8)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántas veces puede una función cuadrática cortar al eje vertical Y?
  choices:
  - text: Exactamente una sola vez
    is_correct: true
  - text: Dos veces si Δ > 0
    is_correct: false
  - text: Ninguna vez si no tiene soluciones reales
    is_correct: false
  - text: Depende de la concavidad
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente una sola vez'. Toda función real tiene una única imagen para $x = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Si la función está en forma general, extraer la constante $c$.'
- 'Paso 2: Si está factorizada o en forma de vértice, evaluar $f(0)$.'
- 'Paso 3: Escribir el par ordenado con abscisa cero: $(0, c)$ o $(0, f(0))$.'
- 'Paso 4: Ubicar el punto sobre el eje vertical $Y$.'
errores_correccion: '- **Error común:** Escribir el corte como $(c, 0)$ en lugar de $(0, c)$.

  - **Cómo corregirlo:** En el eje $Y$, **la primera coordenada (abscisa) es siempre 0**: **$(0, c)$**.'
ejemplos:
- titulo: 'Ejemplo 1: Corte negativo'
  enunciado: ¿Cuál es la intersección con el eje Y de $f(x) = 4x^2 - 19$?
  alternativas:
  - (0, -19)
  - (-19, 0)
  - (0, 4)
  - (0, 0)
  respuesta: (0, -19)
  solucion_pasos:
  - 'Paso 1: $c = -19 \implies (0, -19)$.'
- titulo: 'Ejemplo 2: Intersección en el origen'
  enunciado: ¿Dónde corta al eje Y la función $g(x) = -6x^2 + 12x$?
  alternativas:
  - (0, 0)
  - (0, 12)
  - (0, -6)
  - En ningún punto
  respuesta: (0, 0)
  solucion_pasos:
  - 'Paso 1: $c = 0 \implies (0, 0)$.'
- titulo: 'Ejemplo 3: Evaluación en forma vértice'
  enunciado: Para $f(x) = 3(x - 2)^2 - 5$, ¿dónde corta al eje Y?
  alternativas:
  - (0, 7)
  - (0, -5)
  - (7, 0)
  - (0, 12)
  respuesta: (0, 7)
  solucion_pasos:
  - 'Paso 1: $f(0) = 3(0 - 2)^2 - 5 = 3(4) - 5 = 7 \implies (0, 7)$.'
- titulo: 'Ejemplo 4: Corte con parábola flotante'
  enunciado: Si una parábola tiene $\Delta < 0$ y $c = 6$, ¿corta al eje Y?
  alternativas:
  - Sí, en el punto (0, 6)
  - No, porque Δ < 0
  - Solo si a > 0
  - En dos puntos
  respuesta: Sí, en el punto (0, 6)
  solucion_pasos:
  - 'Paso 1: El discriminante solo restringe cortes con el eje X; el corte con el eje Y existe siempre en $(0, c)$.'
errores_frecuentes:
- Confundir cortes con el eje X con el corte con el eje Y.
- Invertir el orden del par ordenado escribiendo (c, 0).
- Creer que si Δ < 0 la parábola no corta al eje Y.
afirmaciones_verdaderas:
- Toda función cuadrática real interseca al eje vertical Y exactamente una vez en (0, c).
- La intersección con el eje Y se calcula inmediatamente evaluando f(0).
al_terminar_debes_poder: '**QUÉ:** Calcular e identificar el punto de intersección de una parábola con el eje Y.


  **CÓMO:** Extrayendo el término independiente c o evaluando f(0) para formular el punto cartesiano (0, c).


