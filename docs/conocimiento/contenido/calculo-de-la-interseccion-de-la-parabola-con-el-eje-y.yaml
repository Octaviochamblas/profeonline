semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.INTERSECCION_Y
resumen_inicial: 'Cálculo de la intersección de la parábola con el eje Y: parábola,
  vértice, concavidad y formas de Análisis gráfico: parábola, concavidad e intersecciones.'
explicacion_simple: 'Toda parábola cruza exactamente una vez el eje vertical, y ese
  punto se calcula de la manera más simple posible: evaluando la función en $x=0$.'
explicacion_formal: '### Definición formal


  La intersección de la gráfica de $f(x)=ax^2+bx+c$ con el eje $y$ ocurre en el punto
  donde $x=0$. Evaluando, $f(0)=a(0)^2+b(0)+c=c$. Por lo tanto, la intersección con
  el eje $y$ es siempre el punto $(0,c)$.


  ### Desarrollo didáctico


  Este cálculo es el más directo entre todos los relacionados con la gráfica: basta
  con identificar el término independiente $c$, sin necesidad de resolver ninguna
  ecuación.


  Para $f(x)=3x^2-5x+8$, la intersección con el eje $y$ es el punto $(0,8)$, leído
  directamente del término independiente.'
definiciones_clave: '- **Cálculo de la intersección de la parábola con el eje Y**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  cálculo de la intersección de la parábola con el eje y.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando cálculo de
    la intersección de la parábola con el eje y.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a cálculo
    de la intersección de la parábola con el eje y.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
