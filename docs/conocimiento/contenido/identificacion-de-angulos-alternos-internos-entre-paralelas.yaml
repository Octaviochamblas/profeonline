semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.ALTERNOS_INTERNOS_IDENTIFICACION
resumen_inicial: Los ángulos alternos internos se ubican entre dos rectas paralelas
  a lados opuestos de una transversal; por teorema son de igual medida.
explicacion_simple: 'Imagina las dos vías paralelas de un tren cruzadas en diagonal
  por una calle. Si miras el espacio que queda DENTRO de las dos vías, verás cuatro
  esquinas. Las esquinas que están en lados contrarios de la calle formando una ''Z''
  miden exactamente lo mismo. Esos son los ángulos alternos internos.

  '
explicacion_formal: 'Dado un par de rectas paralelas $L_1 \parallel L_2$ cortadas
  por una recta transversal $T$, se definen como **ángulos alternos internos** a aquellos
  pares de ángulos no adyacentes ubicados en la región comprendida entre las paralelas
  (región interior) y en lados opuestos respecto a la recta transversal.


  El **Teorema de los Ángulos Alternos Internos** demuestra que si $L_1 \parallel
  L_2$, entonces los ángulos alternos internos son congruentes:


  $$\alpha = \beta$$

  '
definiciones_clave: '- **Ángulos alternos internos**: Pares de ángulos ubicados en
  la franja interior entre paralelas y a lados opuestos de la transversal.

  - **Región interior**: Zona del plano comprendida entre las dos rectas paralelas
  $L_1$ y $L_2$.

  - **Transversal**: Recta secante que corta a dos o más rectas paralelas en puntos
  distintos.

  '
propiedades_relaciones: '- **Congruencia por paralelismo**: Los ángulos alternos internos
  son iguales si y solo si las dos rectas intersectadas son estrictamente paralelas.

  - **Patrón en ''Z''**: Los ángulos alternos internos forman visualmente los vértices
  interiores de una letra ''Z'' (o ''Z'' invertida).

  '
ejemplo_guiado:
  enunciado: Dos rectas paralelas $L_1 \parallel L_2$ son cortadas por una transversal
    $T$. Si uno de los ángulos alternos internos mide $3x + 15^\circ$ y el otro mide
    $75^\circ$, calcula el valor de $x$ y determina la medida de ambos ángulos.
  pasos:
  - 'Paso 1: Aplicar el Teorema de los Ángulos Alternos Internos entre paralelas,
    igualando sus expresiones por ser congruentes: $3x + 15^\circ = 75^\circ$.'
  - 'Paso 2: Restar $15^\circ$ a ambos miembros de la ecuación: $3x = 75^\circ - 15^\circ
    \implies 3x = 60^\circ$.'
  - 'Paso 3: Dividir por 3 para despejar $x$: $x = \frac{60^\circ}{3} = 20^\circ$.
    Concluir que ambos ángulos miden $75^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubican los ángulos alternos internos con respecto a las rectas
    paralelas y a la transversal?
  choices:
  - text: Entre las dos paralelas (zona interior) y en lados opuestos de la transversal
    is_correct: true
  - text: Por fuera de las paralelas (zona exterior) y al mismo lado de la transversal
    is_correct: false
  - text: En la misma esquina sobre ambas paralelas
    is_correct: false
  - text: Compartiendo el mismo vértice sobre la primera recta
    is_correct: false
  explanation: La alternativa correcta es 'Entre las dos paralelas (zona interior)
    y en lados opuestos de la transversal', definiendo la posición de los alternos
    internos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos rectas paralelas son cortadas por una transversal y un ángulo alterno
    interno mide 75°, ¿cuánto mide el otro alterno interno?
  choices:
  - text: 75°
    is_correct: true
  - text: 105°
    is_correct: false
  - text: 180°
    is_correct: false
  - text: 37.5°
    is_correct: false
  explanation: La alternativa correcta es '75°', por congruencia entre ángulos alternos
    internos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos rectas paralelas y la recta transversal que las corta.'
- 'Paso 2: Localizar los ángulos ubicados en la franja interior a lados opuestos de
  la transversal (patrón en ''Z'').'
- 'Paso 3: Igualar sus medidas para calcular el valor de las incógnitas involucradas.'
errores_correccion: Evita confundir los ángulos alternos internos (que son iguales)
  con los conjugados internos (que están al mismo lado de la transversal y suman 180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos alternos internos entre paralelas miden $2x + 10^\circ$
    y $50^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - $20^\circ$
  - $25^\circ$
  - $30^\circ$
  respuesta: $20^\circ$
  solucion_pasos:
  - 'Igualar los ángulos por ser alternos internos: $2x + 10 = 50$.'
  - 'Restar 10: $2x = 40 \implies x = 20^\circ$.'
- titulo: Ejemplo 2
  enunciado: Si un ángulo alterno interno mide $110^\circ$, ¿cuánto mide el ángulo
    alterno interno correspondiente?
  alternativas:
  - $110^\circ$
  - $70^\circ$
  - $180^\circ$
  respuesta: $110^\circ$
  solucion_pasos:
  - Por el teorema de paralelas, los ángulos alternos internos son congruentes, midiendo
    ambos $110^\circ$.
- titulo: ¿Los ángulos alternos internos entre paralelas son siempre de igual medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, siempre que las dos rectas sean paralelas, los ángulos alternos internos son
    iguales.
- titulo: ¿Los ángulos alternos internos se ubican por fuera de la franja comprendida
    entre las paralelas?
  respuesta: 'No'
  solucion_pasos:
  - No, los ángulos alternos internos se ubican exclusivamente en la región interior
    comprendida entre las dos paralelas.
errores_frecuentes:
- Declarar ángulos alternos internos (iguales) con conjugados internos (suman 180°).
- Afirmar que los ángulos alternos internos se ubican en el mismo lado de la recta
  transversal.
- Declarar que los ángulos alternos internos son iguales aun cuando las rectas no
  son paralelas.
- Declarar la región interior entre paralelas con la región exterior.
- Omitir igualar las ecuaciones al resolver problemas algebraicos con alternos internos.
afirmaciones_verdaderas:
- Si dos rectas son paralelas, sus ángulos alternos internos tienen exactamente la
  misma medida.
- Los ángulos alternos internos se sitúan en lados opuestos de la transversal dentro
  de la región entre paralelas.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar ángulos alternos
  internos en diagramas de paralelas y resolver ecuaciones basándote en la congruencia
  de sus medidas.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Rectas paralelas y transversales.
