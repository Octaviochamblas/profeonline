semantic_id: MAT.ALG.RELACION_EXP_LOG.SIMETRIA_RECTA_IDENTIDAD
resumen_inicial: 'Análisis de la simetría entre las gráficas exponencial y logarítmica
  respecto de la recta identidad: conceptos, asíntotas, propiedades e inversidad en
  Relación de funciones inversas.'
explicacion_simple: Una propiedad visual muy útil de las funciones inversas es que,
  al graficarlas juntas, una parece el reflejo de la otra respecto a la diagonal $y=x$.
explicacion_formal: '### Definición formal


  Si $f$ y $g$ son funciones inversas, entonces $(a,c)$ pertenece a la gráfica de
  $g$ si y solo si $(c,a)$ pertenece a la gráfica de $f$. Geométricamente, esto significa
  que ambas gráficas son reflejos una de la otra respecto a la recta $y=x$.


  ### Desarrollo didáctico


  Si $g(x)=2^x$ pasa por $(3,8)$, entonces $f(x)=\log_2(x)$ pasa por $(8,3)$. Al dibujar
  ambos puntos y la recta $y=x$, se observa que uno es exactamente el reflejo especular
  del otro respecto a esa diagonal.'
definiciones_clave: '- **Análisis de la simetría entre las gráficas exponencial y
  logarítmica respecto de la recta identidad**: Concepto fundamental en el estudio
  del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a análisis de la simetría entre las gráficas exponencial y logarítmica
  respecto de la recta identidad.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de análisis
    de la simetría entre las gráficas exponencial y logarítmica respecto de la recta
    identidad.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de análisis de la simetría entre
    las gráficas exponencial y logarítmica respecto de la recta identidad.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    análisis de la simetría entre las gráficas exponencial y logarítmica respecto
    de la recta identidad?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en relación de funciones
      inversas
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en relación de funciones inversas. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en análisis de la simetría entre las gráficas exponencial y logarítmica respecto
    de la recta identidad?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica un punto conocido de la gráfica de la función exponencial $g(x)=b^x$.'
- 'Paso 2: Intercambia las coordenadas $(a,c)\to(c,a)$ para obtener el punto correspondiente
  en $f(x)=\log_b(x)$.'
- 'Paso 3: Verifica que ambos puntos son simétricos respecto a la recta $y=x$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en análisis
  de la simetría entre las gráficas exponencial y logarítmica respecto de la recta
  identidad.
ejemplos:
- titulo: Obtención del punto simétrico
  enunciado: Si $g(x)=3^x$ pasa por $(2,9)$, ¿por qué punto pasa $f(x)=\log_3(x)$?
  solucion_pasos:
  - Se intercambian las coordenadas del punto conocido.
  - El punto correspondiente en $f$ es $(9,2)$.
- titulo: Verificación de la simetría con el punto fijo
  enunciado: ¿Cómo se relacionan los puntos fijos $(0,1)$ de la exponencial y $(1,0)$
    de la logarítmica con la recta $y=x$?
  solucion_pasos:
  - Se observa que las coordenadas de un punto son exactamente las del otro intercambiadas.
  - Ambos puntos son simétricos respecto a la recta $y=x$, consistente con la relación
    inversa.
- titulo: ¿Las gráficas de una función y su inversa siempre son simétricas respecto
    a $y=x$?
  enunciado: ¿Es una propiedad general que la gráfica de cualquier función y su inversa
    sean simétricas respecto a la recta $y=x$?
  respuesta: Sí
  solucion_pasos:
  - Es una propiedad geométrica válida para cualquier par de funciones inversas, no
    solo exponencial-logarítmica.
- titulo: ¿La asíntota horizontal de la exponencial se refleja en una asíntota horizontal
    de la logarítmica?
  enunciado: ¿Al reflejar la asíntota horizontal $y=0$ de la exponencial respecto
    a $y=x$, se obtiene otra asíntota horizontal?
  respuesta: 'No'
  solucion_pasos:
  - Se refleja en la asíntota vertical $x=0$ de la función logarítmica, no en otra
    horizontal.
errores_frecuentes:
- Confundir la simetría respecto a $y=x$ con la simetría respecto al eje $y$.
- Intercambiar mal las coordenadas al buscar el punto correspondiente.
- Suponer que la asíntota se refleja en otra del mismo tipo, en vez de cambiar de
  vertical a horizontal (o viceversa).
- Olvidar que esta simetría es consecuencia directa de ser funciones inversas.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando análisis de la simetría entre las gráficas exponencial y logarítmica respecto
  de la recta identidad.
