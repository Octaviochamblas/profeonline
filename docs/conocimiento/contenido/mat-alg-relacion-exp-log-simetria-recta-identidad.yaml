semantic_id: MAT.ALG.RELACION_EXP_LOG.SIMETRIA_RECTA_IDENTIDAD
resumen_inicial: 'Las gráficas de $y = b^x$ y de $y = \log_b(x)$ son reflexiones simétricas exactas a través de la recta diagonal de identidad $y = x$.'
explicacion_simple: |
  Si dibujamos la gráfica de la función exponencial $y = 2^x$ y la gráfica de la función logarítmica $y = \log_2(x)$ en el mismo plano cartesiano y trazamos una línea recta diagonal a $45^\circ$ (la recta $y = x$), notaremos que ambas curvas son el reflejo exacto en un espejo la una de la otra. Todo punto $(u, v)$ de la curva exponencial tiene su hermano reflejado $(v, u)$ en la curva logarítmica.
explicacion_formal: |
  ### Definición formal
  La **simetría axial de funciones inversas** entre la curva exponencial $C_{\text{exp}} = \{(x, b^x) \mid x \in \mathbb{R}\}$ y la curva logarítmica $C_{\text{log}} = \{(x, \log_b(x)) \mid x \in \mathbb{R}^+\}$ se define como una isometría de reflexión en el plano euclidiano $\mathbb{R}^2$ respecto a la recta bisectriz principal:
  $$L_{\text{identidad}}: y = x$$
  definida por el mapeo perpendicular equidistante $(u, v) \longleftrightarrow (v, u)$.

  ### Desglose simbólico
  - Transformación de Puntos Notables:
    - $(0, 1) \in C_{\text{exp}} \longleftrightarrow (1, 0) \in C_{\text{log}}$ (Interceptos con los ejes).
    - $(1, b) \in C_{\text{exp}} \longleftrightarrow (b, 1) \in C_{\text{log}}$ (Puntos de altura unitaria).
    - $(-1, 1/b) \in C_{\text{exp}} \longleftrightarrow (1/b, -1) \in C_{\text{log}}$ (Puntos recíprocos).
  - Transformación de Asíntotas:
    - Asíntota horizontal $y = 0$ de $C_{\text{exp}} \longleftrightarrow$ Asíntota vertical $x = 0$ de $C_{\text{log}}$.
  - Punto de Intersección Común (si existe): Ocurre en el punto $(x_0, y_0)$ sobre la recta $y = x$ donde $b^{x_0} = x_0 = \log_b(x_0)$.

  ### Síntesis didáctica
  Propiedad del segmento perpendicular a la diagonal: La recta que une cualquier punto $(u, v)$ con su reflejado $(v, u)$ es estrictamente perpendicular a la recta $y = x$ (pendiente $m = -1$) y su punto medio yace exactamente sobre la recta $y = x$.
definiciones_clave: |
  - **Simetría respecto a la recta identidad $y = x$**: Propiedad geométrica fundamental entre las gráficas de cualquier par de funciones inversas.
  - **Mapeo de reflejo $(u, v) \to (v, u)$**: Intercambio de abscisas por ordenadas entre puntos correspondientes.
  - **Transformación de asíntotas**: Conversión de la asíntota horizontal $y = 0$ en la asíntota vertical $x = 0$.
propiedades_relaciones: |
  - **Invariancia de la distancia al origen**: La distancia del punto $(u, v)$ al origen es exactamente igual a la distancia de su reflejado $(v, u)$ al origen.
  - **Simetría conservada para cualquier base $b$**: La propiedad de reflexión a través de $y = x$ se mantiene idéntica para bases crecientes ($b > 1$) y para bases decrecientes ($0 < b < 1$).
ejemplo_guiado:
  enunciado: 'Dado el punto $(3, 8)$ sobre la curva exponencial $f(x) = 2^x$, halla las coordenadas de su punto reflejado en la curva logarítmica $g(x) = \log_2(x)$, y calcula el punto medio del segmento que los une para verificar que yace sobre la recta $y = x$.'
  pasos:
    - 'Paso 1: El punto en $f(x) = 2^x$ es $(3, 8)$ pues $2^3 = 8$.'
    - 'Paso 2: Por simetría de funciones inversas, invertimos las coordenadas: $(3, 8) \to (8, 3)$.'
    - 'Paso 3: Verificamos en $g(x) = \log_2(x)$: $g(8) = \log_2(8) = 3$, confirmando el punto $(8, 3)$.'
    - 'Paso 4: Calculamos el punto medio $M = \left(\frac{3 + 8}{2}, \frac{8 + 3}{2}\right) = (5.5, 5.5)$.'
    - 'Paso 5: Como la abscisa $x = 5.5$ es igual a la ordenada $y = 5.5$, el punto medio yace exactamente sobre la recta $y = x$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Respecto a qué recta del plano cartesiano son simétricas entre sí las gráficas de la función exponencial $y = 10^x$ y de la función logarítmica $y = \log(x)$?'
    choices:
      - {text: 'Respecto a la recta de identidad de ecuación $y = x$', is_correct: true}
      - {text: 'Respecto al eje vertical $y$ (recta $x = 0$)', is_correct: false}
      - {text: 'Respecto al eje horizontal $x$ (recta $y = 0$)', is_correct: false}
      - {text: 'Respecto a la recta de pendiente negativa $y = -x$', is_correct: false}
    explanation: 'La alternativa correcta es ''Respecto a la recta de identidad de ecuación $y = x$''. Todas las funciones inversas poseen gráficas simétricas respecto a la recta bisectriz $y = x$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la asíntota de la función exponencial $f(x) = b^x$ es la recta horizontal $y = 0$, ¿cuál es la asíntota reflejada de su función inversa $g(x) = \log_b(x)$ por la simetría $y = x$?'
    choices:
      - {text: 'La recta vertical de ecuación $x = 0$', is_correct: true}
      - {text: 'La recta horizontal de ecuación $y = 1$', is_correct: false}
      - {text: 'La recta diagonal $y = x$', is_correct: false}
      - {text: 'La función logarítmica no posee asíntotas', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta vertical de ecuación $x = 0$''. La reflexión cartesiana a través de la diagonal $y = x$ convierte la recta horizontal $y = 0$ en la recta vertical $x = 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Dibujar la recta de identidad $y = x$ como eje de simetría diagonal a $45^\circ$.'
  - 'Paso 2: Tomar los puntos notables de la función exponencial $(0, 1)$ y $(1, b)$.'
  - 'Paso 3: Invertir las coordenadas para obtener los puntos de la función logarítmica $(1, 0)$ y $(b, 1)$.'
  - 'Paso 4: Trazar ambas curvas verificando que cada punto y su reflejo sean perpendiculares a la recta $y = x$ y estén a igual distancia de ella.'
errores_correccion: |
  - **Error 1:** Afirmar que la gráfica logarítmica se obtiene reflejando la exponencial respecto al eje $y$ o al eje $x$. **Cómo corregirlo:** Reflejar respecto al eje $y$ cambia $x$ por $-x$ ($b^{-x}$). Reflejar respecto al eje $x$ cambia $y$ por $-y$ ($-b^x$). La función inversa logarítmica requiere reflejar respecto a la diagonal $y = x$.
  - **Error 2:** Creer que la simetría $(u, v) \leftrightarrow (v, u)$ modifica la distancia entre los puntos. **Cómo corregirlo:** La reflexión respecto a $y = x$ es una **isometría** (transformación rígida) que conserva las distancias, ángulos y formas geométricas intactas.
ejemplos:
  - titulo: 'Punto reflejado del intercepto'
    enunciado: '¿El intercepto $(0, 1)$ de la exponencial se refleja como el intercepto $(1, 0)$ de la logarítmica?'
    alternativas:
      - 'Sí, por inversión de coordenadas $(0, 1) \to (1, 0)$'
      - 'No, el reflejo es $(0, -1)$'
      - 'No, el reflejo es $(-1, 0)$'
    respuesta: 'Sí, por inversión de coordenadas $(0, 1) \to (1, 0)$'
    solucion_pasos:
      - '1. Aplicamos el mapeo de simetría respecto a $y = x$: $(u, v) \to (v, u)$.'
      - '2. El punto $(0, 1)$ se transforma en $(1, 0)$.'
  - titulo: 'Perpendicularidad del segmento de reflejo'
    enunciado: '¿El segmento que une $(1, 3)$ con $(3, 1)$ tiene pendiente $m = -1$, siendo perpendicular a $y = x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Pendiente $m = \frac{1 - 3}{3 - 1} = \frac{-2}{2} = -1$. Como la recta $y = x$ tiene pendiente $1$, su producto es $(-1)(1) = -1$, confirmando la perpendicularidad.'
  - titulo: 'Simetría en logaritmo natural'
    enunciado: '¿Las curvas $y = e^x$ e $y = \ln(x)$ son simétricas respecto a la recta $y = x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser la base $e$ en ambas funciones inversas, son reflejos exactos a través de $y = x$.'
  - titulo: 'Transformación de asíntota'
    enunciado: '¿La asíntota horizontal $y = 0$ de la exponencial se refleja como la asíntota vertical $x = 0$ de la logarítmica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Invertir la ecuación $y = 0$ intercambiando variables entrega $x = 0$.'
errores_frecuentes:
  - 'Las gráficas de la función exponencial y logarítmica son simétricas respecto al eje vertical $y$.'
  - 'Reflejar un punto $(2, 5)$ respecto a la recta $y = x$ produce el punto $(-2, -5)$.'
  - 'La asíntota horizontal $y = 0$ de la función exponencial se refleja como una asíntota horizontal $y = 1$.'
  - 'Las gráficas de $y = b^x$ e $y = \log_b(x)$ se cortan en ángulos rectos sobre el eje $y$.'
  - 'La simetría respecto a la recta $y = x$ altera la velocidad de variación de ambas funciones.'
afirmaciones_verdaderas:
  - 'Las gráficas de las funciones inversas $y = b^x$ e $y = \log_b(x)$ son reflexiones simétricas respecto a la recta de identidad $y = x$.'
  - 'La simetría a través de $y = x$ convierte el punto $(u, v)$ de la curva exponencial en el punto $(v, u)$ de la curva logarítmica, y la asíntota $y = 0$ en $x = 0$.'
