semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.PLANTEAMIENTO_ECUACION
resumen_inicial: 'Planteamiento de una ecuación lineal desde un enunciado: propiedades,
  resolución y modelamiento en Modelamiento con ecuaciones lineales.'
explicacion_simple: 'Busca palabras clave que actúen como el signo igual ($=$): ''es'',
  ''da'', ''resulta'', ''suman'', ''equivalen a''.'
explicacion_formal: '### Definición formal


  Una vez expresadas las cantidades del problema como funciones de la incógnita $x$,
  plantear la ecuación consiste en identificar en el enunciado la relación de igualdad
  entre dos de esas expresiones y escribirla formalmente como $E_1(x) = E_2(x)$.


  ### Desarrollo didáctico


  Busca palabras clave que actúen como el signo igual ($=$): ''es'', ''da'', ''resulta'',
  ''suman'', ''equivalen a''.

  Ejemplo: ''La suma de las edades de Juan y Pedro es 30''.

  Traducción: (Juan) + (Pedro) = 30.

  Sustituyes tus cantidades involucradas: $x + 2x = 30$.


  Acabas de construir un puente entre el mundo de las palabras y el mundo del álgebra.'
definiciones_clave: '- **Planteamiento de una ecuación lineal desde un enunciado**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a planteamiento de una ecuación lineal desde
  un enunciado.'
ejemplo_guiado:
