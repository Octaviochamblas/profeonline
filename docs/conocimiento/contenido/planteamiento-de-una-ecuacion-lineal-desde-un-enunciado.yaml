semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.PLANTEAMIENTO_ECUACION
resumen_inicial: El planteamiento de una ecuación consiste en traducir las relaciones descritas en el lenguaje verbal a una
  igualdad algebraica en función de la incógnita.
explicacion_simple: 'Plantear una ecuación es el proceso de traducir un problema expresado en lenguaje natural al lenguaje
  algebraico.


  Identificamos los conectores y frases clave del texto y los reemplazamos por sus operadores matemáticos correspondientes:


  "el doble de" equivale a $2x$, "aumentado en" equivale a $+$, "disminuido en" equivale a $-$, y verbos como "es igual a",
  "equivale a" o "resulta ser" corresponden al signo de igualdad $=$.


  Con esta traducción estructuramos una igualdad algebraica que representa fielmente las condiciones del enunciado.


  ![Planteamiento de la ecuación lineal](/static/img/nodos/planteamiento-de-una-ecuacion-lineal-desde-un-enunciado-intro.svg)

  '
explicacion_formal: '### Definición formal

  El **planteamiento de la ecuación lineal** transforma la proposición verbal en la ecuación equivalente canónica:


  $$\text{Enunciado verbal} \implies A(x) = B(x) \implies a x + b = 0$$


  ### Diccionario de traducción algebraica fundamental

  - "Un número aumentado en $k$": $x + k$

  - "El triple de un número disminuido en $m$": $3x - m$

  - "El triple de, un número disminuido en $m$": $3(x - m)$

  - "Equivale a / resulta ser": $=$


  ### Síntesis didáctica

  La puntuación en el texto (como el uso de comas) determina la presencia obligatoria de paréntesis al agrupar operaciones
  sobre expresiones algebraicas.

  '
definiciones_clave: '- **Planteamiento de la ecuación**: Proceso de conversión sistemática de relaciones verbales en una igualdad
  algebraica estructurada.

  - **Traducción algebraica**: Sustitución directa de expresiones del lenguaje natural por variables, coeficientes y operadores
  matemáticos.

  '
propiedades_relaciones: '- **Función de los paréntesis**: Un multiplicador afectando a una expresión compuesta exige paréntesis
  obligatorios ($k(x + a)$ vs $k x + a$).

  - **Conservación de la igualdad**: El verbo principal del enunciado divide el problema en primer miembro (lado izquierdo)
  y segundo miembro (lado derecho).

  '
ejemplo_guiado:
  enunciado: El triple de la edad que tendrá María dentro de $4$ años equivale al doble de su edad actual aumentada en $20$
    años. Plantea la ecuación lineal que modela esta situación.
  pasos:
  - 'Paso 1: Declarar la incógnita principal: sea $x = \text{edad actual de María en años}$.'
  - 'Paso 2: Traducir "la edad dentro de 4 años": $(x + 4)$.'
  - 'Paso 3: Traducir "el triple de la edad que tendrá dentro de 4 años": $3(x + 4)$.'
  - 'Paso 4: Traducir "el doble de su edad actual aumentada en 20": $2x + 20$.'
  - 'Paso 5: Igualar ambas expresiones traducidas: $3(x + 4) = 2x + 20$.'
  imagen: /static/img/nodos/planteamiento-de-una-ecuacion-lineal-desde-un-enunciado-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación planteada para la frase "El triple de la edad que tendrá María dentro de 4 años equivale
    al doble de su edad actual aumentada en 20"?
  choices:
  - text: $3(x + 4) = 2x + 20$
    is_correct: true
  - text: $3x + 4 = 2x + 20$
    is_correct: false
  - text: $3x + 12 = 2(x + 20)$
    is_correct: false
  - text: $3(x - 4) = 2x - 20$
    is_correct: false
  explanation: La alternativa correcta es '$3(x + 4) = 2x + 20$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al expandir los paréntesis de la ecuación planteada $3(x + 4) = 2x + 20$, ¿cuál es la versión equivalente sin
    paréntesis?
  choices:
  - text: $3x + 12 = 2x + 20$
    is_correct: true
  - text: $3x + 4 = 2x + 20$
    is_correct: false
  - text: $3x + 12 = 2x + 40$
    is_correct: false
  - text: $3x + 7 = 2x + 20$
    is_correct: false
  explanation: La alternativa correcta es '$3x + 12 = 2x + 20$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Declarar explícitamente la variable $x$ y su significado en el problema.'
- 'Paso 2: Localizar el verbo de equivalencia ("es igual", "equivale", "se obtiene") para colocar el signo igual ($=$).'
- 'Paso 3: Traducir las condiciones verbales anteriores al verbo como el primer miembro de la ecuación.'
- 'Paso 4: Traducir las condiciones verbales posteriores al verbo como el segundo miembro de la ecuación.'
- 'Paso 5: Insertar paréntesis en las expresiones compuestas que estén afectadas por un multiplicador.'
errores_correccion: '- **Error 1:** Omitir paréntesis al traducir "el triple de un número aumentado en 4" (escribir $3x +
  4$ en vez de $3(x + 4)$). **Cómo corregirlo:** Si el multiplicador afecta a una suma completa, **LA SUMA DEBE ENCERRARSE
  OBLIGATORIAMENTE ENTRE PARÉNTESIS ($3(x + 4)$)**.

  - **Error 2:** Invertir los términos al traducir "un número disminuido en 5" (escribir $5 - x$ en lugar de $x - 5$). **Cómo
  corregirlo:** "Un número disminuido en $k$" **SIGNIFICA QUE AL NÚMERO $x$ SE LE RESTA LA CANTIDAD $k$ ($x - k$)**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la traducción algebraica de "el quíntuple de un número, disminuido en 8 equivale a 32"?
  alternativas:
  - $5x - 8 = 32$
  - $5(x - 8) = 32$
  - $8 - 5x = 32$
  respuesta: $5x - 8 = 32$
  solucion_pasos:
  - '1. El quíntuple de un número: $5x$.'
  - '2. Disminuido en 8: $5x - 8$.'
  - '3. Equivale a 32: $5x - 8 = 32$.'
- titulo: Ejemplo 2
  enunciado: Plantea la ecuación para "la suma de tres números consecutivos es 45".
  alternativas:
  - $x + (x + 1) + (x + 2) = 45$
  - $x + 2x + 3x = 45$
  - $3x + 1 = 45$
  respuesta: $x + (x + 1) + (x + 2) = 45$
  solucion_pasos:
  - '1. Número 1: $x$.'
  - '2. Número 2: $x + 1$, Número 3: $x + 2$.'
  - '3. Ecuación: $x + (x + 1) + (x + 2) = 45 \implies 3x + 3 = 45$.'
- titulo: Uso de paréntesis
  enunciado: ¿La frase "el cuádruple de, la suma de un número y 3" requiere utilizar paréntesis en $4(x + 3)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el factor 4 multiplica a toda la suma $(x + 3)$.
- titulo: Traducción de verbos
  enunciado: ¿Verbos como "equivale", "resulta" o "es igual" se traducen como el signo de igualdad ($=$)?
  respuesta: Sí
  solucion_pasos:
  - Sí, separan los dos miembros de la ecuación.
errores_frecuentes:
- Omitir los paréntesis al traducir multiplicadores que afectan a sumas compuestas (escribir $3x + 4$ en vez de $3(x + 4)$).
- Traducir «un número disminuido en 5» en orden invertido como $5 - x$ alterando el sentido de la resta.
- Colocar paréntesis innecesarios en expresiones monómicas simples con coma.
- Traducir números enteros consecutivos de forma multiplicativa ($x, 2x, 3x$) en vez de aditiva ($x, x+1, x+2$).
- Reemplazar verbos de equivalencia («resulta ser», «equivale») por operadores de suma en vez del signo igual.
afirmaciones_verdaderas:
- El planteamiento de una ecuación traduce fielmente la estructura y conectores del lenguaje verbal al lenguaje algebraico.
- Los verbos de equivalencia ("es", "equivale", "resulta") definen la posición del signo igual que separa ambos miembros.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/planteamiento-de-una-ecuacion-lineal-desde-un-enunciado-resumen.svg)


  QUÉ: Plantear una ecuación lineal de primer grado a partir de un enunciado verbal.

  CÓMO: Asignar la variable $x$, traducir los operadores matemáticos («aumentado», «disminuido», «el triple de»), colocar
  paréntesis en expresiones compuestas ($3(x + 4)$) y vincular ambos miembros mediante el signo de igualdad.

  '
