  - Aplicar el procedimiento de despeje o método de solución de planteamiento de una
    ecuación lineal desde un enunciado.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
