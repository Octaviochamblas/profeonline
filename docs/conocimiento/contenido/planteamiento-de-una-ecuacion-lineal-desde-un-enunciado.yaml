semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.PLANTEAMIENTO_ECUACION
resumen_inicial: El planteamiento de una ecuación consiste en traducir relaciones
  del lenguaje verbal a una igualdad algebraica con la incógnita.
explicacion_simple: 'Plantear una ecuación es traducir un texto del español al idioma
  matemático.

  Identificamos palabras clave del enunciado y las reemplazamos por operaciones algebraicas:

  ''el doble de'' es $2x$, ''aumentado en'' es $+$, ''disminuido en'' es $-$, ''es
  igual a'' es $=$.

  Con estas traducciones armamos la igualdad matemática que refleja el problema.'
explicacion_formal: 'El **planteamiento de la ecuación lineal** transforma las relaciones
  del lenguaje natural en la igualdad canónica:


  $$\text{Lenguaje verbal} \implies A(x) = B(x) \implies a x + b = 0$$


  **Diccionario de traducción algebraica fundamental:**

  - ''Un número aumentado en $k$'': $x + k$

  - ''El triple de un número disminuido en $m$'': $3x - m$

  - ''El triple de, un número disminuido en $m$'': $3(x - m)$

  - ''Equivale a / resulta ser'': $=$'
definiciones_clave: '- **Planteamiento de la ecuación**: Traducción sistemática de
  las condiciones verbales de un problema en una igualdad algebraica.

  - **Traducción algebraica**: Conversión de expresiones lingüísticas a símbolos y
  operadores matemáticos.'
propiedades_relaciones: '- **Importancia de la coma**: La presencia o ausencia de
  una coma en el enunciado altera la colocación de los paréntesis (ejemplo: ''el doble
  de $x$, más $5$'' es $2x + 5$, mientras que ''el doble de $x$ más $5$'' puede significar
  $2(x + 5)$).'
ejemplo_guiado:
  enunciado: El triple de la edad que tendrá Maria dentro de $4$ años equivale al
    doble de su edad actual aumentada en $20$ años. Plantea la ecuación lineal que
    modela esta situación.
  pasos:
  - 'Paso 1: Declarar la incógnita: sea $x = \text{edad actual de Maria en años}$.Paso
    2: Traducir ''edad dentro de 4 años'': $(x + 4)$.Paso 3: Traducir ''el triple
    de la edad dentro de 4 años'': $3(x + 4)$.Paso 4: Traducir ''el doble de su edad
    actual aumentada en 20'': $2x + 20$.Paso 5: Igualar ambas expresiones: $3(x +
    4) = 2x + 20$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación planteada para 'El triple de la edad que tendrá Maria
    dentro de 4 años equivale al doble de su edad actual aumentada en 20'?
  choices:
  - text: $3(x + 4) = 2x + 20$
    is_correct: true
  - text: $3x + 4 = 2x + 20$
    is_correct: false
  - text: $3x + 12 = 2(x + 20)$
    is_correct: false
  - text: $3(x - 4) = 2x - 20$
    is_correct: false
  explanation: La alternativa correcta es '$3(x + 4) = 2x + 20$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al expandir el primer miembro de la ecuación planteada $3(x + 4) = 2x
    + 20$, ¿cuál es la ecuación sin paréntesis?
  choices:
  - text: $3x + 12 = 2x + 20$
    is_correct: true
  - text: $3x + 4 = 2x + 20$
    is_correct: false
  - text: $3x + 12 = 2x + 40$
    is_correct: false
  - text: $3x + 7 = 2x + 20$
    is_correct: false
  explanation: La alternativa correcta es '$3x + 12 = 2x + 20$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Declarar la incógnita $x$.'
- 'Paso 2: Identificar los verbos de igualdad (''es'', ''equivale'', ''resulta'')
  para ubicar el signo $=$.'
- 'Paso 3: Traducir las frases del lado izquierdo del verbo al primer miembro.'
- 'Paso 4: Traducir las frases del lado derecho del verbo al segundo miembro.'
- 'Paso 5: Revisar que los paréntesis protejan correctamente las expresiones agrupadas.'
errores_correccion: '- **Error común:** Olvidar los paréntesis al traducir ''el triple
  de un número aumentado en 4'' (escribir $3x + 4$ en lugar de $3(x + 4)$).

  - **Cómo corregirlo:** Si el multiplicador afecta a una suma o resta completa, DEBES
  colocar la suma entre paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El primer paso para resolver un problema verbal es definir la incógnita?
  respuesta: Sí
  solucion_pasos:
  - Sí, declarar la variable $x$ es indispensable.
- titulo: ¿Pueden existir soluciones matemáticas que se descarten por ser incompatibles
    con el contexto real?
  respuesta: Sí
  solucion_pasos:
  - Sí, como edades o cantidades de objetos negativas.
errores_frecuentes:
- Operar números del enunciado al azar sin definir la incógnita $x$.
- Olvidar los paréntesis al traducir frases como 'el triple de un número aumentado
  en 5'.
- Dar por terminado el problema al despejar $x$ sin responder la pregunta específica
  del enunciado.
- Omitir las unidades de medida en la respuesta final del problema.
- Aceptar soluciones negativas o decimales incompatibles con la realidad física del
  contexto.
afirmaciones_verdaderas:
- El modelamiento lineal traduce relaciones del lenguaje verbal a una ecuación de
  primer grado.
- Las soluciones obtenidas al modelar deben ser verificadas frente a las restricciones
  físicas del contexto real.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar la incógnita,
  plantear, resolver e interpretar problemas contextualizados mediante ecuaciones
  lineales.
