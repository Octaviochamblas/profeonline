procedimiento:
- Identifica la relación principal (la condición que une a todos los elementos).
- Encuentra la palabra que representa el signo igual '='.
- Ensambla el lado izquierdo y el lado derecho usando tus expresiones en función de
  'x'.
- Revisa que tu ecuación tenga sentido lógico al leerla de vuelta en español.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en planteamiento de una ecuación lineal desde un enunciado.
ejemplos:
- titulo: $=$ y $x + 2x = 30$
  enunciado: Resuelve o interpreta $=$ y $x + 2x = 30$ usando las condiciones de este
    recurso.
  solucion_pasos:
  - 'Busca palabras clave que actúen como el signo igual ($=$): ''es'', ''da'', ''resulta'',
    ''suman'', ''equivalen a''.

    Ejemplo: ''La suma de las edades de Juan y Pedro es 30''.

    Traducción: (Juan) + (Pedro) = 30.

    Sustituyes tus cantidades involucradas: $x + 2x = 30$.'
  - Identifica la relación principal (la condición que une a todos los elementos).
- titulo: $x$
  enunciado: Justifica el procedimiento adecuado para el caso $x$.
  solucion_pasos:
  - Una vez que tienes a tus cantidades involucradas definidos en función de 'x' (Juan
    = $x$, Pedro = $2x$), necesitas encontrar el 'verbo' matemático del problema que
    los iguale.
  - Encuentra la palabra que representa el signo igual '='.
- titulo: 'Respecto de «Planteamiento de una ecuación lineal desde un enunciado»:
    ¿Describe adecuadamen'
  enunciado: 'Respecto de «Planteamiento de una ecuación lineal desde un enunciado»:
    ¿Describe adecuadamente el concepto esta frase? «Una vez que tienes a tus cantidades
    involucradas definidos en función de ''x'' (Juan = $x$, Pedro = $2x$), necesitas
    encontrar el ''verbo'' matemático del problema que los iguale»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una vez que tienes a tus cantidades
    involucradas definidos en función de ''x'' (Juan = $x$, Pedro = $2x$), necesitas
    encontrar el ''verbo'' matemático del problema que los iguale.'
- titulo: 'Respecto de «Planteamiento de una ecuación lineal desde un enunciado»:
    ¿Se puede aceptar est'
  enunciado: 'Respecto de «Planteamiento de una ecuación lineal desde un enunciado»:
    ¿Se puede aceptar esta afirmación? «Puede omitirse esta condición sin cambiar
    el resultado: «Identifica la relación principal (la condición que une a todos
    los elementos)»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una vez que tienes a tus cantidades
    involucradas definidos en función de ''x'' (Juan = $x$, Pedro = $2x$), necesitas
    encontrar el ''verbo'' matemático del problema que los iguale.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Identifica la relación
  principal (la condición que une a todos los elementos)».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Encuentra la palabra
  que representa el signo igual ''=''».'
- La definición sigue cumpliéndose aunque no se considere que una vez que tienes a
  tus cantidades involucradas definidos en función de 'x' (Juan = $x$, Pedro = $2x$),
  necesitas encontrar el 'verbo' matemático del problema que los iguale.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Revisa
  que tu ecuación tenga sentido lógico al leerla de vuelta en español».
- La comprobación del resultado vuelve innecesaria la condición «Identifica la relación
  principal (la condición que une a todos los elementos)».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
