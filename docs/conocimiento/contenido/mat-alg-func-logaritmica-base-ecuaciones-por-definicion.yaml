semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.ECUACIONES_POR_DEFINICION
resumen_inicial: 'La resolución de ecuaciones logarítmicas por definición aplica el principio $\log_b(P(x)) = c \iff b^c = P(x)$ para transformar el problema en una ecuación algebraica.'
explicacion_simple: |
  Cuando tenemos una ecuación con una incógnita $x$ atrapada dentro de un logaritmo, como $\log_2(3x + 1) = 4$, el método más directo consiste en aplicar la definición de logaritmo. Pasamos la base $2$ al otro lado elevando al resultado $4$, liberando el argumento: $3x + 1 = 2^4 = 16$. A partir de allí, resolvemos la ecuación sencilla resultante ($3x = 15 \implies x = 5$).
explicacion_formal: |
  ### Definición formal
  El método de **resolución de ecuaciones logarítmicas por definición** consiste en transformar la igualdad funcional $\log_b(P(x)) = c$ en su representación exponencial equivalente:
  $$\log_b(P(x)) = c \iff P(x) = b^c$$
  con $b > 0, b \neq 1$, $c \in \mathbb{R}$, convirtiendo la ecuación trascendente en una ecuación polinomial o racional libre en $x$.

  ### Desglose simbólico
  - Ecuaciones de un solo logaritmo:
    $$\log_b(Ax + B) = k \implies Ax + B = b^k \implies x = \frac{b^k - B}{A}$$
  - Ecuaciones con logaritmos en ambos miembros (Propiedad inyectiva):
    $$\log_b(P(x)) = \log_b(Q(x)) \iff P(x) = Q(x)$$
  - Ecuaciones cuadráticas disfrazadas:
    $$A(\log_b x)^2 + B(\log_b x) + C = 0 \xrightarrow{u = \log_b x} Au^2 + Bu + C = 0$$

  ### Síntesis didáctica
  Paso previo obligatorio antes de aplicar la definición: Aislar por completo el término logarítmico en un lado de la igualdad antes de convertir a la potencia $b^c$.
definiciones_clave: |
  - **Ecuación logarítmica**: Igualdad matemática donde la incógnita $x$ aparece formando parte del argumento o la base de un logaritmo.
  - **Conversión exponencial $P(x) = b^c$**: Transformación algebraica que elimina el operador logarítmico.
  - **Aislamiento del logaritmo**: Procedimiento para dejar el término $\log_b(P(x))$ solo en un miembro de la igualdad.
propiedades_relaciones: |
  - **Propiedad inyectiva $\log_b(u) = \log_b(v) \iff u = v$**: Permite igualar directamente argumentos cuando los logaritmos en ambos miembros comparten la misma base.
  - **Obligatoriedad de verificación**: Toda solución candidata obtenida debe ser verificada para comprobar que mantenga el argumento estrictamente positivo ($P(x) > 0$).
ejemplo_guiado:
  enunciado: 'Resuelve las siguientes ecuaciones logarítmicas aplicando la definición o la propiedad inyectiva: A) $\log_3(2x - 5) = 4$, B) $2 \ln(x) + 3 = 11$, C) $\log_5(x^2 - 11) = \log_5(5x + 3)$.'
  pasos:
    - 'Paso 1: Para $\log_3(2x - 5) = 4$, aplicamos la definición: $2x - 5 = 3^4 = 81$.'
    - 'Paso 2: Despejamos: $2x = 81 + 5 = 86 \implies x = 43$. Verificamos: $2(43) - 5 = 81 > 0$. Solución válida: $x = 43$.'
    - 'Paso 3: Para $2 \ln(x) + 3 = 11$, aislamos el logaritmo: $2 \ln(x) = 8 \implies \ln(x) = 4$. Aplicamos definición: $x = e^4$. Solución válida.'
    - 'Paso 4: Para $\log_5(x^2 - 11) = \log_5(5x + 3)$, igualamos argumentos por inyectividad: $x^2 - 11 = 5x + 3 \implies x^2 - 5x - 14 = 0$.'
    - 'Paso 5: Factorizamos: $(x - 7)(x + 2) = 0 \implies x_1 = 7, x_2 = -2$. Verificamos $x = 7$: $49-11=38>0$ (válido). Verificamos $x = -2$: $5(-2)+3 = -7 < 0$ (inválido). Solución única: $x = 7$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la solución de la ecuación logarítmica $\log_4(3x + 1) = 2$ obtenida al aplicar la definición formal?'
    choices:
      - {text: '$x = 5$, aplicando la conversión $3x + 1 = 4^2 = 16 \implies 3x = 15 \implies x = 5$', is_correct: true}
      - {text: '$x = 7$, calculando $3x + 1 = 2^4 = 16$', is_correct: false}
      - {text: '$x = 3$, calculando $3x + 1 = 4 \cdot 2 = 8$', is_correct: false}
      - {text: '$x = 1$, calculando $3x + 1 = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 5$, aplicando la conversión $3x + 1 = 4^2 = 16 \implies 3x = 15 \implies x = 5$''. La base 4 elevada al resultado 2 libera el argumento: $3x + 1 = 16$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver la ecuación $\log_2(x) + \log_2(x - 2) = 3$, ¿cuál es la solución real válida?'
    choices:
      - {text: '$x = 4$, pues comprimiendo $\log_2(x(x-2)) = 3 \implies x^2 - 2x = 8 \implies x = 4$', is_correct: true}
      - {text: '$x = -2$ y $x = 4$', is_correct: false}
      - {text: '$x = 5$', is_correct: false}
      - {text: '$x = 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 4$, pues comprimiendo $\log_2(x(x-2)) = 3 \implies x^2 - 2x = 8 \implies x = 4$''. La solución $x = -2$ se descarta porque genera logaritmos de números negativos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Aislar el término logarítmico en uno de los miembros de la ecuación.'
  - 'Paso 2: Si hay varios logaritmos, comprimirlos en un solo logaritmo usando las propiedades del producto o cociente.'
  - 'Paso 3: Convertir la ecuación a su equivalente exponencial: $\text{Argumento} = b^{\text{Resultado}}$.'
  - 'Paso 4: Despejar la variable $x$ en la ecuación algebraica resultante.'
  - 'Paso 5: Comprobar que los valores de $x$ obtenidos produzcan argumentos estrictamente positivos en la ecuación original.'
errores_correccion: |
  - **Error 1:** Aplicar la conversión a potencia sin haber aislado antes el logaritmo (ej: en $2\log(x) = 6$ escribir $x = 2^6$). **Cómo corregirlo:** Primero se debe dividir por 2 para aislar el logaritmo: $\log(x) = 3 \implies x = 10^3 = 1000$.
  - **Error 2:** Aceptar soluciones algebraicas negativas sin comprobar si anulan o vuelven negativo al argumento original. **Cómo corregirlo:** Toda solución debe sustituirse en la ecuación original para verificar que mantenga argumentos estrictamente mayores que cero.
ejemplos:
  - titulo: 'Ecuación logarítmica simple'
    enunciado: '¿Cuál es la solución de $\log_3(x + 2) = 3$?'
    alternativas:
      - '$x = 25$'
      - '$x = 7$'
      - '$x = 9$'
    respuesta: '$x = 25$'
    solucion_pasos:
      - '1. Aplicamos definición: $x + 2 = 3^3 = 27$.'
      - '2. Despejamos: $x = 27 - 2 = 25$.'
  - titulo: 'Ecuación con logaritmo natural'
    enunciado: '¿La solución de $\ln(2x) = 0$ es $x = 0.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2x = e^0 = 1 \implies x = \frac{1}{2} = 0.5$.'
  - titulo: 'Igualdad de dos logaritmos'
    enunciado: '¿La solución de $\log(4x - 1) = \log(x + 8)$ es $x = 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por inyectividad: $4x - 1 = x + 8 \implies 3x = 9 \implies x = 3$.'
  - titulo: 'Descarte de solución extraña'
    enunciado: 'En la ecuación $\log(x^2) = 2$, ¿las soluciones $x = 10$ y $x = -10$ son ambas válidas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En el argumento $x^2$, tanto $(10)^2 = 100 > 0$ como $(-10)^2 = 100 > 0$ son positivos, siendo ambas soluciones válidas.'
errores_frecuentes:
  - 'Para resolver $\log_2(x) = 5$, se multiplica la base por el resultado obteniendo $x = 10$.'
  - 'En la ecuación $3 \log(x) = 9$, se eleva inmediatamente $x = 3^9$.'
  - 'Todas las soluciones cuadráticas obtenidas al resolver una ecuación logarítmica son siempre válidas sin necesidad de verificación.'
  - 'Al resolver $\log_b(x) = \log_b(y)$, se deben restar los argumentos $x - y = 0$.'
  - 'Una ecuación logarítmica de la forma $\log_b(P(x)) = 0$ no tiene solución porque el resultado es cero.'
afirmaciones_verdaderas:
  - 'La resolución de ecuaciones logarítmicas mediante la definición $\log_b(P(x)) = c \iff P(x) = b^c$ elimina el operador logarítmico transformándolo en una ecuación exponencial o polinomial.'
  - 'Es un requisito indispensable verificar que las soluciones algebraicas encontradas mantengan todos los argumentos de la ecuación original estrictamente positivos.'
