semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.SEMEJANZA_TRIANGULOS_CONCEPTO
resumen_inicial: 'Concepto de semejanza de triángulos: conceptos, teoremas, propiedades
  geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Aplicando el concepto general de semejanza al caso particular
  de los triángulos, se obtiene una relación con condiciones muy precisas y fáciles
  de verificar.
explicacion_formal: '![Semejanza de triángulos](/static/img/geometria/congruencia-semejanza/semejanza-triangulos-concepto.svg)


  ### Definición formal


  Si $\triangle ABC$ y $\triangle A''B''C''$ cumplen $\angle A=\angle A''$, $\angle
  B=\angle B''$, $\angle C=\angle C'', y $\frac{AB}{A''''B''''$}$=\frac{BC}{B''C''}=\frac{CA}{C''A''}$,
  entonces $\triangle ABC\sim\triangle A''B''C''$.


  ### Desarrollo didáctico


  En triángulos, basta con verificar solo una parte de estas condiciones para garantizar
  la semejanza completa (como se verá con los criterios de semejanza más adelante):
  por ejemplo, si los tres ángulos son iguales, automáticamente los lados resultan
  proporcionales.'
definiciones_clave: '- **Concepto de semejanza de triángulos**: Elemento o propiedad
  fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de semejanza de triángulos.'
ejemplo_guiado:
  enunciado: Para analizar concepto de semejanza de triángulos, considera un ángulo
    $\alpha = 74^\circ$ ubicado en la posición dada. Determina el valor de la medida
    asociada sabiendo que $x + 1289^\circ = 74^\circ$.
  pasos:
  - Identificar la propiedad de concepto de semejanza de triángulos referida a $\alpha
    = 74^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1289 = 74 \implies x = 74 - 1289$.'
  - Concluir que la medida calculada para concepto de semejanza de triángulos es $x
    = -1215^\circ$.
