semantic_id: MAT.ALG.FUNCION_CONCEPTOS.RECORRIDO
resumen_inicial: El recorrido (o conjunto imagen) de una función es el conjunto formado por todos los valores que efectivamente adopta la variable dependiente $y$.
explicacion_simple: |
  El **recorrido** (rango) son todos los valores reales que la función **efectivamente alcanza** como salida.

  Por ejemplo, en $f(x) = x^2$:
  - Todo número elevado al cuadrado da como resultado un número positivo o cero.
  - La función jamás producirá números negativos.
  - Por ello, el recorrido es $[0, +\infty[$.
explicacion_formal: |
  Dada la función $f: A \to B$, el **recorrido** de $f$, denotado por $\text{Rec}(f)$ o $\text{Im}(f)$, se define formalmente como:

  $$\text{Rec}(f) = \{y \in B \mid \exists x \in A \ \mid \ f(x) = y\}$$

  **Desglose de la fórmula:**
  - $y$: Valor perteneciente al recorrido solo si proviene de al menos una preimagen $x$ válida del dominio.
definiciones_clave: |
  - **Recorrido / Rango ($\text{Rec}(f)$)**: Subconjunto del codominio integrado por las imágenes alcanzadas por la función.
propiedades_relaciones: |
  - **Cálculo analítico por despeje**: Para hallar el recorrido, se expresa $y = f(x)$, se despeja $x$ en términos de $y$ y se analiza el dominio de la función inversa o equivalente.
ejemplo_guiado:
  enunciado: Determina el recorrido de la función real $f(x) = \frac{2x + 1}{x - 3}$.
  pasos:
    - 'Paso 1: Escribir la ecuación de la función: $y = \frac{2x + 1}{x - 3}$.'
    - 'Paso 2: Despejar la variable $x$: $y(x - 3) = 2x + 1 \implies yx - 3y = 2x + 1$.'
    - 'Paso 3: Agrupar términos con $x$: $yx - 2x = 3y + 1 \implies x(y - 2) = 3y + 1 \implies x = \frac{3y + 1}{y - 2}$.'
    - 'Paso 4: Analizar la restricción sobre $y$: el denominador no puede ser cero $\implies y - 2 \neq 0 \implies y \neq 2$.'
    - 'Paso 5: Concluir que el recorrido es $\text{Rec}(f) = \mathbb{R} \setminus \{2\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Cuál es el recorrido de la función $f(x) = x^2 + 5$?
    choices:
      - {text: '$[5, +\infty[$', is_correct: true}
      - {text: '$\mathbb{R}$', is_correct: false}
      - {text: '$]-\infty, 5]$', is_correct: false}
      - {text: '$[0, +\infty[$', is_correct: false}
    explanation: La alternativa correcta es '$[5, +\infty[$'. Como $x^2 \ge 0$, se cumple que $x^2 + 5 \ge 5$.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: Al despejar $x$ en la función racional $y = \frac{2x + 1}{x - 3}$, ¿qué valor de $y$ se excluye del recorrido?
    choices:
      - {text: '$y = 2$', is_correct: true}
      - {text: '$y = 3$', is_correct: false}
      - {text: '$y = -1/2$', is_correct: false}
      - {text: '$y = 0$', is_correct: false}
    explanation: La alternativa correcta es '$y = 2$'. Al despejar $x = \frac{3y + 1}{y - 2}$, el denominador se anula en $y = 2$.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Plantear la ecuación $y = f(x)$.'
  - 'Paso 2: Despejar analíticamente la variable $x$ en función de $y$.'
  - 'Paso 3: Determinar las restricciones de existencia para $y$ en la expresión resultante.'
  - 'Paso 4: Declarar el conjunto $\text{Rec}(f)$.'
errores_correccion: |
  - **Error común:** Confundir la restricción del dominio original (eje $X$) con la restricción del recorrido (eje $Y$).
  - **Cómo corregirlo:** Para el dominio se excluyen los valores de $x$; para el recorrido se despeja $x$ y se excluyen los valores de $y$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El recorrido de la función $f(x) = x^2$ es todo el conjunto de los números reales $\mathbb{R}$.'
  - 'El recorrido es el conjunto de valores de entrada $x$ que se ingresan a la función.'
  - 'Determinar el recorrido de una función consiste en calcular el dominio de la variable independiente original.'
  - 'La función constante $f(x) = 5$ tiene como recorrido el intervalo abierto $]-\infty, +\infty[$.'
  - 'El recorrido de una función cuadrática $f(x) = x^2 + 1$ incluye al número real $0$.'
afirmaciones_verdaderas:
  - 'El recorrido (o rango) de una función $f$ es el conjunto formado por todos los valores de salida $y$ que son imagen de al menos una preimagen en el dominio.'
  - 'Para determinar el recorrido analíticamente, se despeja la variable $x$ en función de $y$ y se aplican las restricciones de existencia sobre $y$.'
al_terminar_debes_poder: |
  QUÉ: Determinar el recorrido (o conjunto imagen) de una función real.
  CÓMO: Despejar la variable $x$ en función de $y$, analizar las restricciones de existencia para $y$ en $\mathbb{R}$ y expresar el conjunto $\text{Rec}(f)$.
