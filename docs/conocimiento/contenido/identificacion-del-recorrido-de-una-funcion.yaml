semantic_id: MAT.ALG.FUNCION_CONCEPTOS.RECORRIDO
resumen_inicial: El recorrido de una función es el conjunto de todos los valores de salida reales que efectivamente toma la función.
explicacion_simple: '![El recorrido de una función es el conjunto de todos los valores de salida reales que efectivamente toma la función](/static/img/nodos/identificacion-del-recorrido-de-una-funcion-intro.svg)



  El **recorrido** (o rango/imagen) son todas las respuestas que la función realmente puede generar.


  Por ejemplo, si tienes $f(x) = x^2$, al elevar cualquier número real al cuadrado el resultado jamás será negativo.


  Por lo tanto, su recorrido empieza en $0$ y llega hasta el infinito: $[0, +\infty[$.


  Visualmente en una gráfica, el recorrido es la sombra o proyección de la curva sobre el **eje vertical $Y$**.'
explicacion_formal: 'El **recorrido** de una función $f: A \to B$, denotado por $\text{Rec}(f)$ o $\text{Im}(f)$, es el conjunto:

  $$\text{Rec}(f) = \{y \in B \mid \exists x \in \text{Dom}(f), \ y = f(x)\}$$


  **Método algebraico para determinar el recorrido:**

  1. Escribir la ecuación de la función como $y = f(x)$.

  2. Despejar algebraicamente la variable $x$ en términos de $y$ ($x = g(y)$).

  3. Analizar las restricciones que debe cumplir $y$ para que $x$ exista en los números reales $\mathbb{R}$ (denominadores no nulos, radicandos pares no negativos).'
definiciones_clave: "- **Recorrido ($\text{Rec}(f)$)**: Conjunto de todas las imágenes efectivas de la función.\n- **Despeje de $x$ en función de $y$**: Técnica analítica para hallar las condiciones de existencia sobre la variable dependiente."
propiedades_relaciones: '- **Proyección vertical**: En el plano cartesiano, el recorrido corresponde al intervalo ocupado por la gráfica sobre el eje $Y$.

  - **Valor mínimo/máximo**: En funciones cuadráticas, el vértice determina el extremo del recorrido.'
ejemplo_guiado:
  enunciado: '![Ejemplo El recorrido de una función es el conjunto de todos los valores de salida reales que efectivamente toma la función](/static/img/nodos/identificacion-del-recorrido-de-una-funcion-ejemplos.svg)



    Determina el recorrido de la función racional $f(x) = \frac{2x + 1}{x - 3}$.'
  pasos:
  - 'Paso 1: Escribir $y = \frac{2x + 1}{x - 3}$.'
  - 'Paso 2: Multiplicar por el denominador: $y(x - 3) = 2x + 1 \implies yx - 3y = 2x + 1$.'
  - 'Paso 3: Agrupar términos con $x$: $yx - 2x = 3y + 1 \implies x(y - 2) = 3y + 1$.'
  - 'Paso 4: Despejar $x$: $x = \frac{3y + 1}{y - 2}$.'
  - 'Paso 5: Identificar la restricción sobre $y$: el denominador $y - 2 \neq 0 \implies y \neq 2$.'
  - 'Paso 6: Concluir el recorrido: $\text{Rec}(f) = \mathbb{R} \setminus \{2\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función cuadrática $f(x) = x^2 + 5$?
  choices:
  - text: '[5, +inf['
    is_correct: true
  - text: '[0, +inf['
    is_correct: false
  - text: R
    is_correct: false
  - text: ']-inf, 5]'
    is_correct: false
  explanation: La alternativa correcta es '[5, +inf['. Como $x^2 \geq 0$, al sumar 5 tenemos $x^2 + 5 \geq 5$, luego el valor mínimo es 5.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el recorrido de la función afín $g(x) = 3x - 7$ definida en todo R?
  choices:
  - text: Todos los números reales R
    is_correct: true
  - text: '[0, +inf['
    is_correct: false
  - text: R \ {7/3}
    is_correct: false
  - text: R \ {0}
    is_correct: false
  explanation: La alternativa correcta es 'Todos los números reales R'. Las funciones afines no constantes con dominio $\mathbb{R}$ tienen como recorrido todo $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Igualar la función a la variable $y$: $y = f(x)$.'
- 'Paso 2: Despejar la variable $x$ en términos de $y$.'
- 'Paso 3: Analizar qué valores de $y$ hacen que $x$ exista en los números reales.'
- 'Paso 4: Expresar el conjunto de valores admisibles de $y$ como el recorrido $\text{Rec}(f)$.'
errores_correccion: '- **Error común:** Analizar las restricciones de $x$ en lugar de las restricciones de $y$.

  - **Cómo corregirlo:** Las restricciones de $x$ dan el **dominio**. Para obtener el **recorrido**, se debe despejar $x$ y analizar las restricciones que surgen para la variable $y$.'
ejemplos:
- titulo: 'Ejemplo 1: Función cuadrática con desplazamiento'
  enunciado: Calcula el recorrido de $f(x) = (x - 1)^2 - 4$.
  alternativas:
  - '[-4, +inf['
  - '[1, +inf['
  - '[0, +inf['
  - R
  respuesta: '[-4, +inf['
  solucion_pasos:
  - 'Paso 1: Como $(x - 1)^2 \geq 0$, el valor mínimo del cuadrado es $0$.'
  - 'Paso 2: Al restar $4$, el valor mínimo de $f(x)$ es $0 - 4 = -4$.'
  - 'Paso 3: $\text{Rec}(f) = [-4, +\infty[$.'
- titulo: 'Ejemplo 2: Función valor absoluto'
  enunciado: Halla el recorrido de $g(x) = |x + 3| + 2$.
  alternativas:
  - '[2, +inf['
  - '[3, +inf['
  - '[0, +inf['
  - R
  respuesta: '[2, +inf['
  solucion_pasos:
  - 'Paso 1: El valor absoluto cumple $|x + 3| \geq 0$.'
  - 'Paso 2: Sumando $2$, obtenemos $|x + 3| + 2 \geq 2$.'
  - 'Paso 3: $\text{Rec}(g) = [2, +\infty[$.'
- titulo: 'Ejemplo 3: Función constante'
  enunciado: ¿Cuál es el recorrido de la función constante $f(x) = -8$ definida en todo R?
  alternativas:
  - '{-8}'
  - R \ {-8}
  - ']-inf, -8]'
  - R
  respuesta: '{-8}'
  solucion_pasos:
  - 'Paso 1: La función siempre devuelve $-8$ para cualquier valor de entrada.'
  - 'Paso 2: El conjunto de imágenes efectivas consta de un único elemento: $\text{Rec}(f) = \{-8\}$.'
- titulo: 'Ejemplo 4: Lectura gráfica'
  enunciado: Una curva continua en el plano tiene su punto más bajo en $(2, -1)$ y su punto más alto en $(6, 5)$. ¿Cuál es su recorrido?
  alternativas:
  - '[-1, 5]'
  - '[2, 6]'
  - '[-1, 6]'
  - '[2, 5]'
  respuesta: '[-1, 5]'
  solucion_pasos:
  - 'Paso 1: El recorrido corresponde a los valores en el eje Y: desde el mínimo $y = -1$ hasta el máximo $y = 5$.'
  - 'Paso 2: $\text{Rec}(f) = [-1, 5]$.'
errores_frecuentes:
- Confundir las coordenadas del vértice (h, k) usando h para el recorrido en lugar de k.
- Asumir que toda función racional tiene como recorrido R sin excluir la asíntota horizontal.
- Olvidar que las funciones lineales no constantes abarcan todo R.
afirmaciones_verdaderas:
- El recorrido está formado por todos los valores de llegada que tienen al menos una preimagen en el dominio.
- En el plano cartesiano, el recorrido es la proyección vertical de la gráfica sobre el eje Y.
al_terminar_debes_poder: '**QUÉ:** Calcular y determinar el recorrido de diversas funciones algebraicas y gráficas.


  **CÓMO:** Despejando analíticamente la variable independiente $x$ en función de $y$ o identificando cotas mínimas y máximas en la gráfica.


  ![Resumen El recorrido de una función es el conjunto de todos los valores de salida reales que efectivamente toma la función](/static/img/nodos/identificacion-del-recorrido-de-una-funcion-resumen.svg)'
