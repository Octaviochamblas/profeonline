semantic_id: MAT.ALG.FUNCION_CONCEPTOS.RECORRIDO
resumen_inicial: El recorrido (o rango) de una función $\operatorname{Rec}(f)$ es
  el conjunto de todos los valores de salida eficientemente alcanzados.
explicacion_simple: 'El **recorrido** (o rango, denotado $\operatorname{Rec}(f)$)
  es el conjunto formado por **TODAS LAS IMÁGENES** reales que calcula la función.

  Por ejemplo, para la función cuadrática $f(x) = x^2$, al elevar cualquier número
  al cuadrado el resultado siempre da positivo o cero.

  Por lo tanto, su recorrido son todos los números reales mayores o iguales a cero:
  $\operatorname{Rec}(f) = [0, +\infty[$.'
explicacion_formal: 'El **recorrido o rango** de una función $f: A \to B$ se define
  como la imagen directa del dominio:


  $$\operatorname{Rec}(f) = \operatorname{Im}(f) = \{y \in B \mid \exists x \in A
  \text{ tal que } y = f(x)\}\subset B$$


  **Desglose de la fórmula:**

  - Para determinarlo algebraicamente, se despeja la variable $x$ en función de $y$
  y se buscan las restricciones sobre $y$.'
definiciones_clave: '- **Recorrido / Rango ($\operatorname{Rec}(f)$)**: Subconjunto
  del codominio formado exclusivamente por las imágenes efectivamente alcanzadas por
  la función.'
propiedades_relaciones: '- **Proyección vertical**: En el plano cartesiano, el recorrido
  corresponde a la proyección del gráfico sobre el eje $Y$.'
ejemplo_guiado:
  enunciado: Determina el recorrido de la función $f(x) = x^2 + 5$ despejando $x$
    en función de $y$.
  pasos:
  - 'Paso 1: Escribir la ecuación de la función: $y = x^2 + 5$.Paso 2: Despejar $x^2$:
    $x^2 = y - 5$.Paso 3: Extraer raíz cuadrada: $x = \pm \sqrt{y - 5}$.Paso 4: Imponer
    la condición de existencia en los reales para la raíz par: $y - 5 \ge 0 \implies
    y \ge 5$.Paso 5: Escribir el recorrido en notación de intervalo: $\operatorname{Rec}(f)
    = [5, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $x$ en la función $f(x) = x^2 + 5$, ¿cuál es el conjunto recorrido
    $\operatorname{Rec}(f)$?
  choices:
  - text: $\operatorname{Rec}(f) = [5, +\infty[$
    is_correct: true
  - text: $\operatorname{Rec}(f) = ]-\infty, 5]$
    is_correct: false
  - text: $\operatorname{Rec}(f) = \mathbb{R}$
    is_correct: false
  - text: $\operatorname{Rec}(f) = [0, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$\operatorname{Rec}(f) = [5, +\infty[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la gráfica cartesiana de una función, ¿sobre qué eje se observa visualmente
    su recorrido?
  choices:
  - text: Sobre el eje vertical $Y$ (ordenadas).
    is_correct: true
  - text: Sobre el eje horizontal $X$ (abscisas).
    is_correct: false
  - text: Sobre la diagonal principal.
    is_correct: false
  - text: En el centro del origen $(0,0)$.
    is_correct: false
  explanation: La alternativa correcta es 'Sobre el eje vertical $Y$ (ordenadas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la expresión como $y = f(x)$.'
- 'Paso 2: Despejar algebraicamente la variable $x$ dejando la $y$ en el lado derecho.'
- 'Paso 3: Analizar las restricciones sobre la variable $y$ (denominadores y raíces).'
- 'Paso 4: Escribir el intervalo o conjunto recorrido de $y$.'
errores_correccion: '- **Error común:** Buscar las restricciones sobre la $x$ para
  hallar el recorrido.

  - **Cómo corregirlo:** Las restricciones sobre $x$ dan el DOMINIO; para el RECORRIDO
  debes despejar $x$ y hallar las restricciones sobre $y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
