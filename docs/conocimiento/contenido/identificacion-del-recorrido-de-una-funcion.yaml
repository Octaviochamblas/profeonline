semantic_id: MAT.ALG.FUNCION_CONCEPTOS.RECORRIDO
resumen_inicial: 'Identificación del recorrido de una función: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: Si el codominio es "todo lo posible", el recorrido es "todo lo
  que realmente ocurre". Es el subconjunto del codominio formado únicamente por los
  valores que sí son imagen de algo.
explicacion_formal: '### Definición formal


  Dada $f\colon A \to B$, el recorrido se define como $\text{Rec}(f) = \{y \in B \colon
  \exists\, x \in A,\ f(x) = y\}$. Por definición, $\text{Rec}(f) \subseteq B$, y
  determinarlo requiere analizar qué valores puede tomar realmente la expresión $f(x)$
  al variar $x$ en el dominio.


  ### Desarrollo didáctico


  Para funciones simples, el recorrido suele obtenerse analizando el comportamiento
  algebraico o gráfico de la función. Una parábola $f(x)=x^2$ nunca entrega valores
  negativos, así que su recorrido es $[0,+\infty[$, sin importar que el codominio
  declarado sea $\mathbb{R}$.


  Gráficamente, el recorrido corresponde a la proyección de la gráfica de la función
  sobre el eje vertical (eje $y$): son todas las alturas que la curva realmente alcanza.'
definiciones_clave: '- **Identificación del recorrido de una función**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación del recorrido de una función.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a identificación del
    recorrido de una función.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a identificación del recorrido de
    una función.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    identificación del recorrido de una función?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en conceptos base de función
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en conceptos base de función. Es la condición
    de existencia y unicidad en identificación del recorrido de una función.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en identificación del recorrido
    de una función, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
