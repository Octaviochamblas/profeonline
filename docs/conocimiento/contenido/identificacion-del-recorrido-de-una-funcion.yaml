    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Analiza la expresión algebraica o el gráfico de la función.'
- 'Paso 2: Determina qué valores de $y$ pueden efectivamente obtenerse al variar $x$
  dentro del dominio.'
- 'Paso 3: Si trabajas con un gráfico, proyecta la curva sobre el eje $y$ para obtener
  el recorrido.'
- 'Paso 4: Expresa el recorrido como intervalo o conjunto de valores.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar identificación del recorrido de una función.
ejemplos:
- titulo: Recorrido de una función cuadrática básica
  enunciado: Determina el recorrido de $f(x) = x^2$.
  solucion_pasos:
  - Todo número real elevado al cuadrado es siempre mayor o igual a cero.
  - No existe ningún $x$ real para el cual $x^2$ sea negativo.
  - 'Recorrido: $[0, +\infty[$.'
- titulo: Recorrido desde un gráfico acotado
  enunciado: Si el gráfico de una función muestra que la curva nunca sube de $y=4$
    ni baja de $y=-1$, ¿cuál es su recorrido?
  solucion_pasos:
  - El recorrido corresponde a la proyección vertical completa de la curva.
  - 'Recorrido: $[-1, 4]$.'
- titulo: ¿El recorrido siempre es igual al codominio declarado?
  enunciado: ¿El recorrido siempre es igual al codominio declarado?
  respuesta: Falso
  solucion_pasos:
  - El recorrido es solo el subconjunto del codominio efectivamente alcanzado; puede
    ser un subconjunto propio.
- titulo: ¿Un valor que nunca es imagen de ningún $x$ del dominio pertenece al recorrido?
  enunciado: ¿Un valor que nunca es imagen de ningún $x$ del dominio pertenece al
    recorrido?
  respuesta: Falso
  solucion_pasos:
  - Por definición, el recorrido solo contiene valores que sí son imagen de al menos
    un elemento del dominio.
errores_frecuentes:
- Confundir el recorrido con el codominio, entregando el conjunto de llegada completo
  en vez del subconjunto alcanzado.
- Calcular el dominio en lugar del recorrido al leer un gráfico.
- Al proyectar un gráfico, proyectar sobre el eje horizontal en vez del vertical.
- Asumir que toda función cuadrática tiene recorrido $\mathbb{R}$ sin analizar su
  comportamiento.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando identificación
  del recorrido de una función.
