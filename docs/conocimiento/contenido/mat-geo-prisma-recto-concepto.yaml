semantic_id: MAT.GEO.POLIEDROS_PRISMAS.PRISMA_RECTO_CONCEPTO
resumen_inicial: 'Concepto de prisma recto: conceptos, teoremas, propiedades geométricas
  y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'Un prisma recto es como una ''columna'' geométrica: dos bases
  iguales y paralelas, conectadas por caras laterales que forman ángulos rectos con
  ellas.'
explicacion_formal: '![Concepto de prisma recto](/static/img/geometria/espacio-cuerpos/prisma-recto-concepto.svg)


  ### Definición formal


  Un prisma recto tiene dos bases poligonales congruentes y paralelas entre sí, unidas
  por aristas laterales perpendiculares a ambas bases. Como consecuencia, todas las
  caras laterales son rectángulos.


  ### Desarrollo didáctico


  En la figura, el prisma rectangular tiene sus dos bases (superior e inferior) paralelas
  y congruentes, y sus aristas laterales forman ángulos de 90° con las bases, generando
  caras laterales rectangulares. Si las aristas laterales no fueran perpendiculares
  a las bases, el prisma sería oblicuo, no recto.'
definiciones_clave: '- **Concepto de prisma recto**: Elemento o propiedad fundamental
