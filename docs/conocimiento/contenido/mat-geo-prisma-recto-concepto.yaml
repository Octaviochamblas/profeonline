procedimiento:
- 'Paso 1: Verifica que el poliedro tenga dos bases poligonales congruentes y paralelas.'
- 'Paso 2: Verifica que las aristas laterales sean perpendiculares a ambas bases.'
- 'Paso 3: Si se cumplen ambas condiciones, el prisma es recto (y sus caras laterales
  son rectángulos).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de prisma recto.
