semantic_id: MAT.ALG.FUNC_CUADR_MODELO.PLANTEO_FUNCION
resumen_inicial: 'Planteamiento de una función cuadrática a partir de un problema
  contextualizado: parábola, vértice, concavidad y formas de Modelamiento y aplicaciones.'
explicacion_simple: Una vez identificado que un problema se modela con una función
  cuadrática, el siguiente paso es traducir el enunciado completo en una regla algebraica
  precisa.
explicacion_formal: '### Definición formal


  Plantear una función cuadrática a partir de un problema consiste en asignar una
  variable $x$ a la cantidad desconocida, expresar las demás cantidades relevantes
  del problema en términos de $x$, y combinar esas expresiones (generalmente mediante
  un producto) en una única regla $f(x)=ax^2+bx+c$.


  ### Desarrollo didáctico


  Conviene identificar primero qué cantidad conviene llamar $x$ (usualmente la que
  tiene menos restricciones), y luego expresar el resto en función de ella antes de
  combinar todo en la regla final.


  "El ancho de un terreno rectangular es $x$ metros y el largo es $6$ metros más que
  el ancho. Plantea el área en función de $x$": el largo es $x+6$, por lo que $A(x)=x(x+6)=x^2+6x$.'
definiciones_clave: '- **Planteamiento de una función cuadrática a partir de un problema
  contextualizado**: Elemento o parámetro esencial en la representación de la función
  cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  planteamiento de una función cuadrática a partir de un problema contextualizado.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando planteamiento
    de una función cuadrática a partir de un problema contextualizado.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a planteamiento
    de una función cuadrática a partir de un problema contextualizado.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
