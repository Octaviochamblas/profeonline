semantic_id: MAT.ALG.FUNC_CUADR_MODELO.PLANTEO_FUNCION
resumen_inicial: El planteamiento de la función traduce un enunciado verbal o geométrico en una expresión algebraica cuadrática del tipo $f(x) = ax^2 + bx + c$.
explicacion_simple: |
  Para **plantear una función cuadrática** desde un problema escrito:

  1. **Define la variable independiente $x$**: ¿Qué es la cantidad que puedes cambiar o controlar? (ej. el ancho de un terreno, el aumento de precio).
  2. **Expresa las otras cantidades en términos de $x$**:
     - Si el largo de un terreno debe sumar $40 \text{ m}$ con el ancho $x$, el largo será $(40 - x)$.
  3. **Escribe la función multiplicando o combinando las expresiones**:
     - ÁREA $= \text{largo} \times \text{ancho} = (40 - x) \cdot x = 40x - x^2$.
  4. **Identifica los coeficientes cuadráticos**: En $A(x) = -x^2 + 40x$, $a = -1$, $b = 40$ y $c = 0$.
explicacion_formal: |
  Sea un problema verbal que involucra dos magnitudes interdependientes $x$ e $y$. El **algoritmo de planteamiento del modelo cuadrático** construye el mapa funcional $f: D_{ctx} \to \mathbb{R}$:

  $$f(x) = a x^2 + b x + c$$

  **Pasos de formalización matemática:**
  1. **Asignación de variables:** Declarar explícitamente $x \in \mathbb{R}$ (variable independiente) e $y = f(x)$ (variable dependiente de salida).
  2. **Traducción de restricciones:** Convertir ecuaciones de ligadura lineales en la forma $y_{lig} = p x + q$.
  3. **Sustitución en la función objetivo:** Multiplicar la expresión objetivo $O(x, y_{lig}) = x \cdot (p x + q) = p x^2 + q x$.
  4. **Delimitación del dominio:** Restringir $D_{ctx} = \{x \in \mathbb{R} \mid x > 0 \land y_{lig} > 0\}$.
definiciones_clave: |
  - **Ecuación de ligadura**: Restricción matemática inicial que relaciona las variables del problema permitiendo reducirlas a una sola variable $x$.
propiedades_relaciones: |
  - **Invariancia de los coeficientes del modelo**: Una vez planteada la función objetivo $f(x) = ax^2 + bx + c$, todos los métodos algebraicos (vértice, ceros, discriminante) aplican con total validez.
ejemplo_guiado:
  enunciado: 'Un agricultor tiene 100 metros de malla para cercar un terreno rectangular aprovechando un muro existente. Plantea la función del área $A(x)$ en términos del ancho $x$.'
  pasos:
    - 'Paso 1: Definir la variable: $x$ es el ancho de los dos lados perpendiculares al muro.'
    - 'Paso 2: Calcular el largo con la malla disponible: como el muro cubre un lado, $\text{largo} = 100 - 2x$.'
    - 'Paso 3: Plantear la función del área multiplicando ancho por largo: $A(x) = x(100 - 2x) = 100x - 2x^2$.'
    - 'Paso 4: Ordenar en forma estándar: $A(x) = -2x^2 + 100x$ con $a = -2, b = 100, c = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si se dispone de un perímetro constante de 60 metros para cercar un rectángulo de ancho $x$, ¿cuál es la función cuadrática del área $A(x)$?'
    choices:
      - {text: '$A(x) = -x^2 + 30x$', is_correct: true}
      - {text: '$A(x) = -x^2 + 60x$.', is_correct: false}
      - {text: '$A(x) = 60x - x$.', is_correct: false}
      - {text: '$A(x) = 30x^2$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$A(x) = -x^2 + 30x$''. El semiperímetro es 30, luego el largo es $30 - x$, y el área $x(30 - x) = -x^2 + 30x$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En un problema donde la ganancia se expresa como $G(x) = (x - 10)(200 - 5x)$, ¿cuál es el coeficiente cuadrático $a$ al expandir la función?'
    choices:
      - {text: '$a = -5$', is_correct: true}
      - {text: '$a = 5$.', is_correct: false}
      - {text: '$a = -10$.', is_correct: false}
      - {text: '$a = 200$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -5$''. Multiplicando $x \cdot (-5x) = -5x^2$, de donde el coeficiente cuadrático es $a = -5$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Leer el problema verbal e identificar claramente qué magnitud se desea maximizar o evaluar.'
  - 'Paso 2: Asignar la letra $x$ a la variable independiente desconocida.'
  - 'Paso 3: Utilizar la restricción del enunciado para escribir las demás dimensiones en función de $x$.'
  - 'Paso 4: Multiplicar las expresiones resultantes, desarrollar algebraicamente y ordenar en la forma $f(x) = ax^2 + bx + c$.'
errores_correccion: |
  - **Error común:** Confundir el perímetro con el semiperímetro al despejar las dimensiones de un rectángulo.
  - **Cómo corregirlo:** Si la suma de los 4 lados es $P$, la suma de solo 1 largo y 1 ancho es **EL SEMIPERÍMETRO ($P/2$)**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Planteamiento de área con 4 lados.
    alternativas:
      - 'A(x) = -x^2 + 40x'
      - 'A(x) = -2x^2 + 80x'
      - 'A(x) = 80x - x'
    respuesta: 'A(x) = -x^2 + 40x'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Planteamiento de ingreso de ventas.
    alternativas:
      - 'I(x) = -2x^2 + 80x + 1000'
      - 'I(x) = -2x^2 + 1000'
      - 'I(x) = 80x - 2'
    respuesta: 'I(x) = -2x^2 + 80x + 1000'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La adición errónea del perímetro total en lugar del semiperímetro al despejar la longitud de uno de los lados.'
  - 'La ausencia de distribución del producto al multiplicar expresiones compuestas como $x(50 - 2x)$.'
  - 'Cometer errores de signo al expandir binomios que contienen coeficientes negativos.'
  - 'La falta de definición explícita de las unidades de medida de la variable de entrada $x$.'
  - 'La suposición de que el término independiente $c$ siempre debe ser un número distinto de cero en funciones de área.'
afirmaciones_verdaderas:
  - 'Plantear una función cuadrática requiere expresar la variable de salida a través de relaciones algebraicas de segundo grado $f(x) = ax^2 + bx + c$.'
  - 'En problemas de áreas rectangulares con perímetro fijo $P$, la función de área resulta ser una cuadrática cóncava hacia abajo $A(x) = x(P/2 - x) = -x^2 + (P/2)x$.'
al_terminar_debes_poder: |
  QUÉ: Traducir enunciados verbales o problemas geométricos en funciones cuadráticas bien planteadas.
  CÓMO: Asignar la variable $x$, aplicar ecuaciones de ligadura, multiplicar las dimensiones, expandir algebraicamente y aislar $a, b, c$.
