semantic_id: MAT.ALG.FUNC_CUADR_MODELO.PLANTEO_FUNCION
resumen_inicial: 'El planteamiento de una función cuadrática traduce los datos e incógnitas de un enunciado verbal a una ecuación matemática explícita $f(x) = ax^2 + bx + c$.'
explicacion_simple: |
  Plantear una función cuadrática es como traducir un problema del idioma español al idioma de las matemáticas. Primero leemos atentamente la situación, asignamos una letra a la variable desconocida (como $x$ para el número de artículos o $t$ para el tiempo) y construimos la fórmula cuadrática uniendo los datos numéricos entregados en el texto.
explicacion_formal: |
  ### Definición formal
  El **planteamiento algebraico de un modelo cuadrático** es el proceso estandarizado de formulación simbólica que convierte un conjunto de condiciones verbales en una regla funcional explícita:
  $$f: D_{\text{contexto}} \subseteq \mathbb{R} \to \mathbb{R}, \quad f(x) = ax^2 + bx + c$$

  ### Desglose simbólico
  1. Identificación de variables: $x \in D_{\text{contexto}}$ (variable independiente) y $y = f(x)$ (variable dependiente).
  2. Asignación de coeficientes: Traducción de tasas, valores iniciales o constantes físicas a los parámetros $a, b, c$.
  3. Establecimiento del dominio práctico: $D_{\text{contexto}} = \{x \in \mathbb{R} \mid \text{condiciones del problema se cumplen}\}$.

  ### Síntesis didáctica
  Una correcta estrategia de planteamiento requiere definir de manera unívoca las unidades de medida de cada variable antes de realizar operaciones algebraicas, asegurando la consistencia dimensional de la ecuación.
definiciones_clave: |
  - **Planteamiento de la función**: Proceso de conversión de condiciones verbales a la estructura matemática $ax^2 + bx + c$.
  - **Variable independiente $x$**: Magnitud controlada o medida sobre la cual actúa el modelo.
  - **Variable dependiente $y$**: Resultado o magnitud acumulada por el efecto cuadrático.
propiedades_relaciones: |
  - **Consistencia de signos**: Situaciones con pérdidas o desaceleración por gravedad imponen coeficientes cuadráticos negativos ($a < 0$).
  - **Identificación de constante inicial**: En modelos temporales $f(t) = at^2 + bt + c$, la constante $c = f(0)$ representa el estado o altura inicial en el instante cero.
ejemplo_guiado:
  enunciado: 'Un comerciante vende $x$ poleras al día a un precio de $(50 - 2x)$ miles de pesos cada una. Si el costo fijo diario de mantener la tienda es de 10 miles de pesos, plantea la función de ganancia neta diaria $G(x)$ en función del número de poleras vendidas.'
  pasos:
    - 'Paso 1: Identificamos la variable independiente $x$ (número de poleras vendidas).'
    - 'Paso 2: Expresamos el ingreso bruto como el producto de la cantidad por el precio: $I(x) = x \cdot (50 - 2x) = 50x - 2x^2$.'
    - 'Paso 3: Restamos los costos fijos para obtener la ganancia neta: $G(x) = I(x) - 10 = -2x^2 + 50x - 10$.'
    - 'Paso 4: Concluimos que la función de ganancia neta planteada es $G(x) = -2x^2 + 50x - 10$, en miles de pesos.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Un objeto es lanzado verticalmente hacia arriba desde una plataforma a 15 metros de altura con una velocidad inicial de 20 m/s. Considerando la aceleración de gravedad como $-5t^2$, ¿cuál es la función de altura $h(t)$ correctamente planteada?'
    choices:
      - {text: '$h(t) = -5t^2 + 20t + 15$', is_correct: true}
      - {text: '$h(t) = 5t^2 + 20t - 15$', is_correct: false}
      - {text: '$h(t) = -5t^2 + 15t + 20$', is_correct: false}
      - {text: '$h(t) = 20t^2 - 5t + 15$', is_correct: false}
    explanation: 'La alternativa correcta es ''$h(t) = -5t^2 + 20t + 15$''. El término cuadrático es $-5t^2$, el término lineal es la velocidad inicial $+20t$, y la constante es la altura inicial $+15$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se cerca un terreno rectangular con 60 metros de malla usando un muro existente como uno de los lados, el largo es $(60 - 2x)$ y el ancho es $x$. ¿Cómo se plantea la función de área $A(x)$?'
    choices:
      - {text: '$A(x) = -2x^2 + 60x$', is_correct: true}
      - {text: '$A(x) = 2x^2 - 60x$', is_correct: false}
      - {text: '$A(x) = -x^2 + 60x$', is_correct: false}
      - {text: '$A(x) = 60x - 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$A(x) = -2x^2 + 60x$''. Multiplicamos ancho por largo: $A(x) = x(60 - 2x) = 60x - 2x^2 = -2x^2 + 60x$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer el problema y asignar una variable alfabética (como $x$ o $t$) a la magnitud de entrada.'
  - 'Paso 2: Traducir las condiciones del texto en términos algebraicos ($ax^2$, $bx$, $c$).'
  - 'Paso 3: Unir los términos respetando las operaciones (ingresos menos costos, suma de áreas, etc.) para consolidar la función $f(x) = ax^2 + bx + c$.'
errores_correccion: |
  - **Error 1:** Confundir el ingreso bruto (precio por cantidad) con la ganancia neta (ingreso menos costos). **Cómo corregirlo:** La ganancia neta exige restar todos los costos fijos y variables a la función de ingreso cuadrático.
  - **Error 2:** Asignar un signo positivo al término cuadrático de gravedad en problemas de proyectiles. **Cómo corregirlo:** La gravedad actúa hacia abajo oponiéndose al ascenso, por lo que el término de aceleración cuadrática debe llevar signo negativo (ej: $-5t^2$ o $-4.9t^2$).
ejemplos:
  - titulo: 'Planteamiento de función de ingresos'
    enunciado: 'Un cine vende entradas a $x$ pesos. Si la asistencia diaria es $N(x) = 1000 - 2x$, ¿cómo se plantea la función de ingresos diarios $I(x)$?'
    alternativas:
      - '$I(x) = -2x^2 + 1000x$'
      - '$I(x) = 2x^2 - 1000x$'
      - '$I(x) = 1000 - 2x^2$'
    respuesta: '$I(x) = -2x^2 + 1000x$'
    solucion_pasos:
      - '1. Ingreso = Precio $\cdot$ Asistencia $= x \cdot (1000 - 2x)$.'
      - '2. Distribuimos: $1000x - 2x^2 = -2x^2 + 1000x$.'
  - titulo: 'Planteamiento de función de área'
    enunciado: 'Si los lados de un rectángulo miden $(x + 3)$ y $(x - 1)$, ¿cuál es su función de área $A(x)$?'
    alternativas:
      - '$A(x) = x^2 + 2x - 3$'
      - '$A(x) = x^2 - 2x + 3$'
      - '$A(x) = x^2 + 4x - 3$'
    respuesta: '$A(x) = x^2 + 2x - 3$'
    solucion_pasos:
      - '1. Área = largo $\cdot$ ancho $= (x + 3)(x - 1)$.'
      - '2. Desarrollamos: $x^2 - x + 3x - 3 = x^2 + 2x - 3$.'
  - titulo: 'Constante inicial en planteamientos'
    enunciado: 'En la función de altura $h(t) = -5t^2 + 10t + 8$, ¿el valor $8$ representa la altura desde donde se lanzó el objeto?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al evaluar $t = 0$, la altura inicial es $h(0) = 8$ metros.'
  - titulo: 'Consistencia de unidades'
    enunciado: '¿Es necesario que todas las magnitudes monetarias en un planteamiento estén expresadas en la misma unidad (ej: miles de pesos)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Mezclar pesos individuales con miles de pesos altera los coeficientes del modelo.'
errores_frecuentes:
  - 'Al plantear la función de área de un rectángulo de lados $x$ y $x + 4$, se escribe $A(x) = 2x + 4$.'
  - 'En un problema de proyectiles, la velocidad inicial se coloca como el coeficiente del término $t^2$.'
  - 'La función de ingreso por vender $x$ objetos a precio fijo $p$ se plantea como una función cuadrática $I(x) = p x^2$.'
  - 'Restar un costo fijo de 50 a la función $I(x) = -x^2 + 20x$ resulta en $G(x) = -x^2 + 70x$.'
  - 'El tiempo $t$ en una función cuadrática de movimiento puede tomar valores imaginarios en la realidad.'
afirmaciones_verdaderas:
  - 'El planteamiento de una función cuadrática traduce las relaciones entre variables y datos verbales a una ecuación explícita $f(x) = ax^2 + bx + c$.'
  - 'En problemas de movimiento vertical libre, el coeficiente cuadrático es negativo debido a la aceleración de gravedad.'
al_terminar_debes_poder: 'Traducir enunciados y problemas verbales contextualizados planteando la función cuadrática correspondiente.'
