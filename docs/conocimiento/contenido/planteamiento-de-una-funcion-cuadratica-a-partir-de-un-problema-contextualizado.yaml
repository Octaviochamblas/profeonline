procedimiento:
- 'Paso 1: Define una variable $x$ para la cantidad que varía en el problema.'
- 'Paso 2: Expresa las demás cantidades relevantes del problema en función de $x$.'
- 'Paso 3: Combina las expresiones (generalmente mediante un producto) para obtener
  la regla completa $f(x)$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en planteamiento de una función cuadrática a partir
  de un problema contextualizado.
ejemplos:
- titulo: Planteamiento de una función de área
  enunciado: El largo de un rectángulo es el triple de su ancho $x$. Plantea el área
    en función de $x$.
  solucion_pasos:
  - El largo es $3x$.
  - $A(x)=x(3x)=3x^2$.
- titulo: Planteamiento de una función de ingreso
  enunciado: Un producto se vende a $p(x)=20-x$ pesos, donde $x$ es la cantidad de
    descuentos aplicados. Plantea el ingreso si se venden $x+10$ unidades.
  solucion_pasos:
  - El ingreso es precio por cantidad.
  - $I(x)=(20-x)(x+10)=-x^2+10x+200$.
- titulo: ¿Es necesario definir primero una variable antes de plantear la función?
  enunciado: ¿Es necesario definir primero una variable antes de plantear la función?
  respuesta: Sí
  solucion_pasos:
  - Sin una variable claramente definida, no es posible expresar las demás cantidades
    del problema en su función.
- titulo: ¿La función planteada debe simplificarse a su forma general?
  enunciado: ¿La función planteada debe simplificarse a su forma general?
  respuesta: Sí
  solucion_pasos:
  - Simplificar a la forma general facilita identificar coeficientes y aplicar métodos
    posteriores de análisis.
errores_frecuentes:
- Definir la variable de forma ambigua, sin precisar exactamente qué representa.
- Expresar incorrectamente una de las cantidades en función de la variable elegida.
- Omitir desarrollar y simplificar el producto planteado hasta la forma general.
- Declarar el planteamiento del área con el del perímetro u otra cantidad distinta.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  planteamiento de una función cuadrática a partir de un problema contextualizado.
