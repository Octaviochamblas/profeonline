semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_PAR_IMPAR
resumen_inicial: La distinción entre exponentes pares e impares en funciones potencia establece la simetría axial respecto al eje $Y$ ($f(-x) = f(x)$) con recorrido acotado para exponentes pares, y la simetría central respecto al origen $(0, 0)$ ($f(-x) = -f(x)$) con recorrido $\mathbb{R}$ para exponentes impares.
explicacion_simple: "![La distinción entre exponentes pares e impares en funciones potencia establece la simetría axial respecto al eje $Y$ ($f(-x) = f(x)$) con recorrido acotado para exponentes pares, y la simetría central respecto al origen $(0, 0)$ ($f(-x) = -f(x)$) con recorrido $\\mathbb{R}$ para exponentes impares](/static/img/nodos/distincion-entre-exponentes-pares-e-impares-en-funciones-potencia-intro.svg)\n\n\nLa **paridad de $n$** define el espejo de la función:\n\n- **Exponente PAR ($n = 2, 4, 6, 8...$): FUNCIÓN PAR**\n  - **Regla algebraica:** $(-x)^n = x^n$.\n  - **Simetría:** Es como un espejo con el **eje vertical $Y$**.\n  - Si doblas la hoja por el eje $Y$, el lado izquierdo calza perfecto sobre el derecho.\n  - **Recorrido:** Solo cubre un lado del eje: $[0, +\\infty[$ (si $a > 0$) o $]-\\infty, 0]$ (si $a < 0$).\n- **Exponente IMPAR ($n = 1, 3, 5, 7...$): FUNCIÓN IMPAR**\n  - **Regla algebraica:** $(-x)^n = -x^n$.\n  - **Simetría:** Es simétrica respecto al **punto origen\
  \ $(0, 0)$** (rotación de 180°).\n  - **Recorrido:** Cubre **absolutamente TODO $\\mathbb{R}$** (desde $-\\infty$ hasta $+\\infty$)."
explicacion_formal: "Sea $f(x) = a \\cdot x^n$ con $a \\in \\mathbb{R}^*$ y $n \\in \\mathbb{Z}^*$.\n\n**Teorema de Paridad Algebraica y Topológica**:\n1. **Caso $n \\in 2\\mathbb{Z}$ (Exponente Par)**:\n   $$f(-x) = a(-x)^n = a[(-1)^n x^n] = a(1)x^n = f(x)$$\n   - La gráfica $\\operatorname{Gr}(f)$ es invariante bajo la reflexión ortogonal respecto al eje de ordenadas $\\sigma_Y(x, y) = (-x, y)$.\n   - $\\operatorname{Rec}(f) = [0, +\\infty[$ (para $a > 0$) o $]-\\infty, 0]$ (para $a < 0$).\n2. **Caso $n \\in 2\\mathbb{Z} + 1$ (Exponente Impar)**:\n   $$f(-x) = a(-x)^n = a[(-1)^n x^n] = a(-1)x^n = -f(x)$$\n   - La gráfica $\\operatorname{Gr}(f)$ es invariante bajo la simetría central respecto al origen $\\sigma_O(x, y) = (-x, -y)$.\n   - $\\operatorname{Rec}(f) = \\mathbb{R}$."
definiciones_clave: '- **Función par**: Función que satisface $f(-x) = f(x)$ con simetría respecto al eje $Y$.

  - **Función impar**: Función que satisface $f(-x) = -f(x)$ con simetría central respecto a $(0, 0)$.'
propiedades_relaciones: '- **Monotonía y biyectividad**: Las funciones impares con $n > 0$ son biyecciones estrictamente monótonas en $\mathbb{R}$; las pares no son inyectivas en $\mathbb{R}$.

  - **Inversión de signos**: Para $n$ par, $f(x) = f(-x)$; para $n$ impar, $f(x)$ y $f(-x)$ tienen signos opuestos.'
ejemplo_guiado:
  enunciado: '![Ejemplo La distinción entre exponentes pares e impares en funciones potencia establece la simetría axial respecto al eje $Y$ ($f(-x) = f(x)$) con recorrido acotado para exponentes pares, y la simetría central respecto al origen $(0, 0)$ ($f(-x) = -f(x)$) con recorrido $\mathbb{R}$ para exponentes impares](/static/img/nodos/distincion-entre-exponentes-pares-e-impares-en-funciones-potencia-ejemplos.svg)



    Demuestra algebraicamente la paridad y determina el recorrido de:

    1) $f(x) = 3x^4$

    2) $g(x) = 2x^3$'
  pasos:
  - 'Paso 1: Demostrar paridad de $f(x) = 3x^4$:

    - Evaluar en $-x$: $f(-x) = 3(-x)^4 = 3x^4 = f(x)$.

    - Como $f(-x) = f(x)$, **es Función Par (Simetría Eje $Y$)**.

    - Recorrido: Como $a = 3 > 0$, **$\operatorname{Rec}(f) = [0, +\infty[$**.'
  - 'Paso 2: Demostrar paridad de $g(x) = 2x^3$:

    - Evaluar en $-x$: $g(-x) = 2(-x)^3 = 2(-x^3) = -2x^3 = -g(x)$.

    - Como $g(-x) = -g(x)$, **es Función Impar (Simetría Origen $(0, 0)$)**.

    - Recorrido: **$\operatorname{Rec}(g) = \mathbb{R} = ]-\infty, +\infty[$**.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $f(x) = -4x^6$, ¿cuál de las siguientes afirmaciones es correcta?
  choices:
  - text: Es una función par con simetría respecto al eje Y y recorrido ]-∞, 0]
    is_correct: true
  - text: Es una función impar con recorrido ℝ
    is_correct: false
  - text: Es una función par con recorrido [0, +∞[
    is_correct: false
  - text: No tiene simetría
    is_correct: false
  explanation: La alternativa correcta es 'Es una función par con simetría respecto al eje Y y recorrido ]-∞, 0]'. Al ser $n = 6$ par, $f(-x) = f(x)$, y como $a = -4 < 0$, su recorrido va hacia abajo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el punto (3, 54) pertenece a la función impar $f(x) = 2x^3$, ¿qué punto pertenece obligatoriamente a su gráfica?
  choices:
  - text: (-3, -54)
    is_correct: true
  - text: (-3, 54)
    is_correct: false
  - text: (3, -54)
    is_correct: false
  - text: (54, 3)
    is_correct: false
  explanation: La alternativa correcta es '(-3, -54)'. En las funciones impares $f(-x) = -f(x)$, por lo que $(x, y) \implies (-x, -y)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar si el exponente $n$ es divisible por 2 (par) o no (impar).'
- 'Paso 2: Evaluar algebraicamente $f(-x) = a(-x)^n$.'
- 'Paso 3: Si $f(-x) = f(x)$, declarar función par, simetría con el eje $Y$ y recorrido unilateral acotado.'
- 'Paso 4: Si $f(-x) = -f(x)$, declarar función impar, simetría central con el origen $(0, 0)$ y recorrido total $\mathbb{R}$.'
errores_correccion: '- **Error común:** Afirmar que las funciones con exponente par tienen recorrido $\mathbb{R}$.

  - **Cómo corregirlo:** Las potencias pares **nunca dan resultados de signos opuestos**: su recorrido está **acotado por cero** ($[0, +\infty[$ o $]-\infty, 0]$).'
ejemplos:
- titulo: 'Ejemplo 1: Paridad de grado 8'
  enunciado: ¿Qué simetría tiene la función $f(x) = 5x^8$?
  alternativas:
  - Simetría respecto al eje Y (función par)
  - Simetría respecto al origen (función impar)
  - Simetría respecto al eje X
  - Sin simetría
  respuesta: Simetría respecto al eje Y (función par)
  solucion_pasos:
  - 'Paso 1: $n = 8$ par $\implies f(-x) = f(x) \implies$ simetría eje Y.'
- titulo: 'Ejemplo 2: Paridad de grado 5'
  enunciado: ¿Qué simetría tiene $g(x) = -2x^5$?
  alternativas:
  - Simetría respecto al origen (función impar)
  - Simetría respecto al eje Y
  - Simetría respecto a la recta y = x
  - Sin simetría
  respuesta: Simetría respecto al origen (función impar)
  solucion_pasos:
  - 'Paso 1: $n = 5$ impar $\implies g(-x) = -g(x) \implies$ simetría origen.'
- titulo: 'Ejemplo 3: Punto simétrico par'
  enunciado: 'Si $(2, 32)$ está en $f(x) = 2x^4$, su punto simétrico en la gráfica es:'
  alternativas:
  - (-2, 32)
  - (-2, -32)
  - (2, -32)
  - (32, 2)
  respuesta: (-2, 32)
  solucion_pasos:
  - 'Paso 1: En funciones pares $(x, y) \leftrightarrow (-x, y) \implies (-2, 32)$.'
- titulo: 'Ejemplo 4: Recorrido de función impar'
  enunciado: ¿Cuál es el recorrido de $h(x) = 7x^3$?
  alternativas:
  - R (todos los reales)
  - '[0, +inf['
  - ']-inf, 0]'
  - '[7, +inf['
  respuesta: R (todos los reales)
  solucion_pasos:
  - 'Paso 1: Toda potencia positiva impar tiene recorrido $\mathbb{R}$.'
errores_frecuentes:
- Confundir la simetría par (eje Y) con la simetría impar (origen).
- Creer que el signo de a cambia la paridad de la función.
- Olvidar que (-x) elevado a exponente par da signo positivo.
afirmaciones_verdaderas:
- Las funciones potencia con exponente par son funciones pares simétricas respecto al eje Y.
- Las funciones potencia con exponente impar son funciones impares simétricas respecto al origen (0, 0).
al_terminar_debes_poder: '**QUÉ:** Distinguir y fundamentar la paridad par e impar en funciones potencia.


  **CÓMO:** Demostrando f(-x) = f(x) (simetría eje Y) o f(-x) = -f(x) (simetría origen) para definir recorridos.


