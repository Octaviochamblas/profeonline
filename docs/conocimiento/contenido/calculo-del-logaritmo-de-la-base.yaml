semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.LOGARITMO_BASE
resumen_inicial: El cálculo del logaritmo de la base establece la propiedad de identidad $\log_b(b) = 1$ para todo $b > 0, b \neq 1$, demostrando que cualquier número elevado al exponente unitario reproduce su propio valor ($b^1 = b$).
explicacion_simple: "![El cálculo del logaritmo de la base establece la propiedad de identidad $\\log_b(b) = 1$ para todo $b > 0, b \neq 1$, demostrando que cualquier número elevado al exponente unitario reproduce su propio valor ($b^1 = b$)](/static/img/nodos/calculo-del-logaritmo-de-la-base-intro.svg)\n\n\nCuando el **argumento es exactamente igual a la base**, el resultado siempre es **UNO**:\n\n$$\\log_b(b) = \\mathbf{1}$$\n\n- **¿Por qué?**\n  - Porque $b^1 = b$:\n    - $\\log_2(2) = 1$ (porque $2^1 = 2$).\n    - $\\log_{10}(10) = 1$ (porque $10^1 = 10$).\n    - $\\ln(e) = 1$ (porque $e^1 = e$).\n    - $\\log_{50}(50) = 1$ (porque $50^1 = 50$).\n- **En la gráfica:** Esto fija el punto clave **$(b, 1)$**, mostrando que a la distancia de su propia base la curva alcanza altura 1."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$. Por el axioma de elemento neutro para la exponenciación en $\mathbb{R}$:

  $$b^1 = b$$

  Aplicando la definición biunívoca del logaritmo:

  $$\log_b(b) = 1$$


  **Significado en análisis funcional**:

  Fija el punto de escala unitaria $P_1(b, 1)$ en la gráfica de la función trascendente $\log_b$. Además, en la fórmula general de cambio de base confirma que:

  $$\log_b(b) = \frac{\ln(b)}{\ln(b)} = 1$$'
definiciones_clave: '- **Logaritmo de la base**: Propiedad de identidad $\log_b(b) = 1$.

  - **Punto de escala unitaria**: Punto cartesiano $(b, 1)$ característico de la curva logarítmica.'
propiedades_relaciones: '- **Simplificación directa**: En cualquier expresión algebraica, un término $\log_b(b)$ se reemplaza inmediatamente por el escalar 1.

  - **Base decimal y natural**: $\log(10) = 1$ y $\ln(e) = 1$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo del logaritmo de la base establece la propiedad de identidad $\log_b(b) = 1$ para todo $b > 0, b \neq 1$, demostrando que cualquier número elevado al exponente unitario reproduce su propio valor ($b^1 = b$)](/static/img/nodos/calculo-del-logaritmo-de-la-base-ejemplos.svg)



    Calcula y simplifica las siguientes expresiones aplicando la propiedad del logaritmo de la base:

    1) $\log_7(7)$

    2) $\ln(e)$

    3) $E = 3\log_5(5) - 2\log(10)$'
  pasos:
  - 'Paso 1: Para $\log_7(7)$: Base y argumento coinciden $\implies \mathbf{1}$.'
  - 'Paso 2: Para $\ln(e)$: Logaritmo natural en base $e$ de $e \implies \mathbf{1}$.'
  - 'Paso 3: Para $E = 3\log_5(5) - 2\log(10)$:

    - Sustituir $\log_5(5) = 1$ y $\log(10) = 1$:

    - $E = 3(1) - 2(1) = 3 - 2 = \mathbf{1}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto vale $\log_{15}(15)$?
  choices:
  - text: 1 (porque 15¹ = 15)
    is_correct: true
  - text: '15'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: '225'
    is_correct: false
  explanation: La alternativa correcta es '1 (porque 15¹ = 15)'. Cuando la base y el argumento son iguales, el logaritmo vale 1.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor simplificado de $4\ln(e) + \log(10)$?
  choices:
  - text: 5 (4 · 1 + 1)
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '14'
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '5 (4 · 1 + 1)'. Como $\ln(e) = 1$ y $\log(10) = 1$, la expresión resulta $4(1) + 1 = 5$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comparar el valor de la base con el valor del argumento.'
- 'Paso 2: Si ambos números son idénticos ($b = a$), aplicar $\log_b(b) = 1$.'
- 'Paso 3: Multiplicar por los coeficientes exteriores si existen.'
- 'Paso 4: Realizar las operaciones aritméticas finales.'
errores_correccion: '- **Error común:** Escribir que $\log_b(b) = b$.

  - **Cómo corregirlo:** La pregunta es "¿A qué exponente elevo $b$ para dar $b$?", y la respuesta es **UNO ($b^1 = b$)**, por lo que $\log_b(b) = \mathbf{1}$.'
ejemplos:
- titulo: 'Ejemplo 1: Base entera'
  enunciado: 'Calcula $\log_6(6)$:'
  alternativas:
  - '1'
  - '6'
  - '0'
  - '36'
  respuesta: '1'
  solucion_pasos:
  - 'Paso 1: $\log_6(6) = 1$.'
- titulo: 'Ejemplo 2: Base decimal propia'
  enunciado: ¿Cuánto vale $\log_{0{,}3}(0{,}3)$?
  alternativas:
  - '1'
  - 0,3
  - '0'
  - '-1'
  respuesta: '1'
  solucion_pasos:
  - 'Paso 1: $\log_{0{,}3}(0{,}3) = 1$.'
- titulo: 'Ejemplo 3: Logaritmo natural'
  enunciado: 'Calcula el valor de $\ln(e)$:'
  alternativas:
  - '1'
  - e
  - '0'
  - 2,718
  respuesta: '1'
  solucion_pasos:
  - 'Paso 1: $\ln(e) = \log_e(e) = 1$.'
- titulo: 'Ejemplo 4: Expresión combinada'
  enunciado: 'Simplifica $A = 7\log_3(3) - 5\log_2(1)$:'
  alternativas:
  - '7'
  - '2'
  - '12'
  - '0'
  respuesta: '7'
  solucion_pasos:
  - 'Paso 1: $A = 7(1) - 5(0) = 7 - 0 = 7$.'
errores_frecuentes:
- Escribir b en lugar de 1 al evaluar log_b(b).
- Confundir log_b(b) = 1 con log_b(1) = 0.
- Olvidar que en base 10 implícita log(10) es igual a 1.
afirmaciones_verdaderas:
- El logaritmo de la base es idénticamente igual a 1 para toda base admisible.
- La igualdad log_b(b) = 1 se fundamenta en la identidad de exponente lineal b¹ = b.
al_terminar_debes_poder: '**QUÉ:** Calcular y aplicar la propiedad del logaritmo de la base.


  **CÓMO:** Utilizando la identidad log_b(b) = 1 para simplificar términos logarítmicos directos.


  ![Resumen El cálculo del logaritmo de la base establece la propiedad de identidad $\log_b(b) = 1$ para todo $b > 0, b \neq 1$, demostrando que cualquier número elevado al exponente unitario reproduce su propio valor ($b^1 = b$)](/static/img/nodos/calculo-del-logaritmo-de-la-base-resumen.svg)'
