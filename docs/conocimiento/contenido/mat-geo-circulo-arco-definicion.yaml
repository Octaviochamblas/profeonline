semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.ARCO_DEFINICION
resumen_inicial: 'Definición de arco de circunferencia: conceptos, teoremas, propiedades
  geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Al igual que un segmento de recta puede ser una parte de una recta
  completa, existe un concepto análogo para porciones de la circunferencia.
explicacion_formal: '![Arco de circunferencia](/static/img/geometria/circunferencia-circulo/circulo-arco-definicion.svg)


  ### Definición formal


  Dados dos puntos $A$ y $B$ de una circunferencia, el arco $\overset{\frown}{AB}$
  es la porción de la circunferencia comprendida entre esos dos puntos (existen en
  realidad dos arcos posibles entre ellos, el menor y el mayor, que juntos forman
  la circunferencia completa).


  ### Desarrollo didáctico


  Dos puntos cualesquiera de una circunferencia siempre determinan dos arcos: uno
  más corto y otro más largo (a menos que ambos puntos sean diametralmente opuestos,
  en cuyo caso ambos arcos son iguales, llamados semicircunferencias).'
definiciones_clave: '- **Definición de arco de circunferencia**: Elemento o propiedad
