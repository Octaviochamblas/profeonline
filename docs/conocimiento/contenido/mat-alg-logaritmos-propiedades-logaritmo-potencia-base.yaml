semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.LOGARITMO_POTENCIA_BASE
resumen_inicial: 'Cálculo del logaritmo de una potencia de la base: conceptos, asíntotas,
  propiedades e inversidad en Logaritmos y sus propiedades.'
explicacion_simple: Cuando el argumento de un logaritmo es la base elevada a un exponente,
  el resultado es directamente ese exponente, sin necesidad de cálculos adicionales.
explicacion_formal: '### Definición formal


  Para $b>0$, $b\neq1$ y $n\in\mathbb{R}$, se cumple $\log_b(b^n)=n$. Esta propiedad
  es consecuencia directa de que $\log_b(\cdot)$ y $b^{(\cdot)}$ son funciones inversas:
  al aplicar el logaritmo a una potencia de la misma base, ambas operaciones se cancelan
  y queda solo el exponente.


  ### Desarrollo didáctico


  $\log_2(2^5)=5$, porque el logaritmo "deshace" la potencia de igual base. Lo mismo
  ocurre con exponentes negativos o fraccionarios: $\log_3(3^{-2})=-2$ y $\log_5(5^{1/2})=1/2$.'
definiciones_clave: '- **Cálculo del logaritmo de una potencia de la base**: Concepto
  fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a cálculo del logaritmo de una potencia de la base.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de cálculo del
    logaritmo de una potencia de la base.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de cálculo del logaritmo de una
    potencia de la base.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
