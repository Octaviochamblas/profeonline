semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.LOGARITMO_POTENCIA_BASE
resumen_inicial: 'El logaritmo de una potencia cuya base coincide con la base del logaritmo es igual al exponente: $\log_b(b^k) = k$.'
explicacion_simple: |
  Cuando calculamos el logaritmo de una potencia que tiene la misma base que el subíndice del logaritmo, como en $\log_2(2^5)$, la operación del logaritmo y la potencia se cancelan mutuamente por ser operaciones inversas, dejando como resultado directamente el exponente $5$. Esta regla es la base de la cancelación directa entre logaritmos y potencias.
explicacion_formal: |
  ### Definición formal
  Para toda base $b \in \mathbb{R}^+ \setminus \{1\}$ y cualquier exponente real $k \in \mathbb{R}$, la **propiedad del logaritmo de la potencia de la base** establece la identidad fundamental:
  $$\log_b(b^k) = k$$
  demostrada analíticamente mediante la propiedad de inversión composicional entre la función logarítmica y la función exponencial $f^{-1}(f(k)) = k$:
  $$\log_b(b^k) = c \iff b^c = b^k \implies c = k$$

  ### Desglose simbólico
  - Cancelación directa: $\log_b(b^k) = k$.
  - Cancelación inversa dual: $b^{\log_b(k)} = k$ (para $k > 0$).
  - Casos particulares:
    - Base 10: $\log_{10}(10^k) = \log(10^k) = k$.
    - Base natural: $\ln(e^k) = k$.

  ### Síntesis didáctica
  Regla de la "simplificación inmediata": Si la base del logaritmo y la base de la potencia encerrada en el argumento son iguales, ambas bases y la palabra logaritmo desaparecen, quedando vivo únicamente el número del exponente.
definiciones_clave: |
  - **Propiedad $\log_b(b^k) = k$**: Identidad de cancelación donde la función logarítmica deshace la potencia de igual base.
  - **Composición de funciones inversas**: Operación $f^{-1}(f(x)) = x$ entre la función logarítmica y exponencial.
  - **Exponente extraído $k$**: Resultado directo de evaluar la potencia de la base en el logaritmo.
propiedades_relaciones: |
  - **Dualidad de cancelación**: La identidad dual $b^{\log_b(x)} = x$ se utiliza para despejar variables exponentes en ecuaciones exponenciales.
  - **Compatibilidad con exponentes negativos y fraccionarios**: La regla aplica para cualquier exponente $k \in \mathbb{R}$, ya sea entero positivo, negativo, racional o irracional.
ejemplo_guiado:
  enunciado: 'Simplifica las siguientes expresiones utilizando la propiedad de la potencia de la base: A) $\log_3(3^7)$, B) $\ln(e^{-4})$, C) $\log(10^{\sqrt{2}})$, D) $\log_5\left(\frac{1}{125}\right)$.'
  pasos:
    - 'Paso 1: Para $\log_3(3^7)$, al coincidir las bases, el resultado es el exponente: $7$.'
    - 'Paso 2: Para $\ln(e^{-4})$, como $\ln(x) = \log_e(x)$, las bases $e$ se cancelan dando $-4$.'
    - 'Paso 3: Para $\log(10^{\sqrt{2}})$, la base implícita es 10, cancelando la base y dando $\sqrt{2}$.'
    - 'Paso 4: Para $\log_5\left(\frac{1}{125}\right)$, reescribimos el argumento como $5^{-3} \implies \log_5(5^{-3}) = -3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el resultado de evaluar la expresión $\log_4(4^{15})$ aplicando la propiedad de cancelación de la potencia de la base?'
    choices:
      - {text: '$15$, porque el logaritmo y la potencia de igual base se cancelan mutuamente', is_correct: true}
      - {text: '$60$, multiplicando $4 \cdot 15 = 60$', is_correct: false}
      - {text: '$4$, porque la base es 4', is_correct: false}
      - {text: '$1$, porque el argumento es una potencia', is_correct: false}
    explanation: 'La alternativa correcta es ''$15$, porque el logaritmo y la potencia de igual base se cancelan mutuamente''. Por definición, $\log_b(b^k) = k$, dando 15.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al simplificar la expresión $J = \ln(e^5) + \log_{10}(10^{-2})$, ¿cuál es el valor numérico obtenido?'
    choices:
      - {text: '$3$', is_correct: true}
      - {text: '$7$', is_correct: false}
      - {text: '$-10$', is_correct: false}
      - {text: '$0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3$''. Calculamos $\ln(e^5) = 5$ y $\log_{10}(10^{-2}) = -2$. Sumando ambos resultados: $J = 5 + (-2) = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Expresar el argumento del logaritmo como una potencia que tenga exactamente la misma base $b$ que el logaritmo ($b^k$).'
  - 'Paso 2: Aplicar la identidad $\log_b(b^k) = k$ cancelando la estructura logarítmica y la base.'
  - 'Paso 3: Extraer el exponente $k$ como el resultado final simplificado.'
errores_correccion: |
  - **Error 1:** Elevar la base al exponente antes de resolver perdiendo el patrón (ej: en $\log_2(2^{10})$ calcular $2^{10} = 1024$ y luego buscar $\log_2(1024)$). **Cómo corregirlo:** No es necesario calcular $2^{10}$. La regla de cancelación entrega directamente el exponente $10$.
  - **Error 2:** Olvidar expresar las fracciones como exponentes negativos antes de cancelar (ej: en $\log_3(1/9)$ no ver la potencia de 3). **Cómo corregirlo:** Reescribir $\frac{1}{9} = \frac{1}{3^2} = 3^{-2}$ para obtener $\log_3(3^{-2}) = -2$.
ejemplos:
  - titulo: 'Cancelación en logaritmo natural'
    enunciado: '¿Cuánto vale $\ln(e^8)$?'
    alternativas:
      - '$8$'
      - '$e^8$'
      - '$1$'
    respuesta: '$8$'
    solucion_pasos:
      - '1. $\ln(e^8) = \log_e(e^8) = 8$.'
  - titulo: 'Cancelación en potencia fraccionaria'
    enunciado: '¿El logaritmo $\log_5(\sqrt[3]{5})$ es igual a $\frac{1}{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reescribimos $\sqrt[3]{5} = 5^{1/3} \implies \log_5(5^{1/3}) = \frac{1}{3}$.'
  - titulo: 'Cancelación dual exponencial'
    enunciado: '¿La expresión $10^{\log(7)}$ es igual a 7?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la propiedad dual $b^{\log_b(x)} = x$, $10^{\log_{10}(7)} = 7$.'
  - titulo: 'Cancelación con exponente negativo'
    enunciado: '¿El valor de $\log_2(0.125)$ es $-3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0.125 = \frac{1}{8} = 2^{-3} \implies \log_2(2^{-3}) = -3$.'
errores_frecuentes:
  - 'El resultado de $\log_3(3^4)$ se calcula multiplicando $3 \cdot 4 = 12$.'
  - 'Al simplificar $\ln(e^x)$, el resultado conserva la constante $e$ multiplicada por $x$.'
  - 'La expresión $b^{\log_b(x)}$ es igual a cero.'
  - 'Para calcular $\log_2(2^6)$ es obligatorio desarrollar primero el valor numérico $2^6 = 64$.'
  - 'La propiedad de cancelación $\log_b(b^k) = k$ solo aplica si el exponente $k$ es un entero positivo.'
afirmaciones_verdaderas:
  - 'El logaritmo de una potencia cuya base coincide con la base del logaritmo se cancela entregando directamente el exponente ($\log_b(b^k) = k$).'
  - 'La identidad dual $b^{\log_b(x)} = x$ (para $x > 0$) demuestra que la función exponencial y la función logarítmica son funciones inversas.'
al_terminar_debes_poder: 'Aplicar la propiedad de la potencia de la base $\log_b(b^k) = k$ para simplificar expresiones exponenciales y logarítmicas.'
