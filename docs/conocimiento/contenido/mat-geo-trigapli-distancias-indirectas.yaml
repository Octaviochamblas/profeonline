procedimiento:
- 'Paso 1: Identifica cuál distancia es inaccesible (no se puede medir directamente)
  y cuál sí es medible.'
- 'Paso 2: Mide (o usa como dato) el ángulo agudo relevante entre la distancia medible
  y la línea de mira o la hipotenusa.'
- 'Paso 3: Selecciona la razón trigonométrica adecuada según los lados involucrados
  y despeja la distancia inaccesible.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con resolución de problemas de distancias indirectas usando
  razones trigonométricas.
