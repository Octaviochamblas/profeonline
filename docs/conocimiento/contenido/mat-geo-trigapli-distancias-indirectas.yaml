semantic_id: MAT.GEO.TRIG_APLICACIONES.DISTANCIAS_INDIRECTAS
resumen_inicial: 'Resolución de problemas de distancias indirectas usando razones
  trigonométricas: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: Muchas veces no es posible medir directamente una altura o distancia
  (la altura de un cerro, el ancho de un río), pero sí se puede medir un ángulo y
  una distancia accesible; con esos datos se calcula la distancia inaccesible usando
  razones trigonométricas.
explicacion_formal: '![Distancias indirectas](/static/img/geometria/trigonometria/trigapli-distancias-indirectas.svg)


  ### Definición formal


  Dado un triángulo rectángulo en que un lado representa una distancia inaccesible,
  un ángulo agudo conocido y otro lado que sí es medible, la distancia inaccesible
  se obtiene despejándola de la razón trigonométrica que relaciona ambos lados con
  el ángulo.


  ### Desarrollo didáctico


  Por ejemplo, para medir el ancho de un río sin cruzarlo: se mide una distancia a
  lo largo de la orilla (cateto adyacente) y el ángulo hacia un árbol en la otra orilla
  (θ). El ancho del río (cateto opuesto, inaccesible) se calcula como ancho=distancia
  medible×tanθ.'
definiciones_clave: '- **Resolución de problemas de distancias indirectas usando razones
  trigonométricas**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
