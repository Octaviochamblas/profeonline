- titulo: ¿Se cumple siempre la propiedad principal de resolución de problemas de
    distancias indirectas usando razones trigonométricas en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede resolución de problemas de distancias indirectas usando razones trigonométricas
    asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en resolución de problemas de distancias
  indirectas usando razones trigonométricas.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en resolución
  de problemas de distancias indirectas usando razones trigonométricas.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en resolución de
  problemas de distancias indirectas usando razones trigonométricas.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de resolución
  de problemas de distancias indirectas usando razones trigonométricas.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
