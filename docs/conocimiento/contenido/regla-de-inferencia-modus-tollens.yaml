semantic_id: MAT.FUND.RAZONAMIENTO_LOGICO.MODUS_TOLLENS
resumen_inicial: 'Definición, estructura deductiva y validez formal de la regla de inferencia Modus Tollendo Tollens (negando el consecuente se niega el antecedente).'
explicacion_simple: |
  El **Modus Tollens** (nombre completo: *Modus Tollendo Tollens*, que significa "el método que niega negando") es una regla de deducción lógica que funciona al revés del Modus Ponens. Dice lo siguiente: si sabemos que una regla condicional es verdadera ("Si llueve, el piso está mojado") y comprobamos que la consecuencia NO ocurrió ("El piso NO está mojado"), **podemos concluir con total seguridad que la causa inicial tampoco ocurrió ("Por lo tanto, NO está lloviendo")**.
explicacion_formal: |
  ### Definición formal
  En el cálculo deductivo y los sistemas de deducción natural, el **Modus Tollendo Tollens (MT)** es una regla de inferencia válida cuya estructura secuencial formal es:
  $$\frac{p \to q, \quad \neg q}{\therefore \neg p}$$
  Su validez semántica se sustenta en que la fórmula implicativa correspondiente es una tautología estricta:
  $$\models ((p \to q) \land \neg q) \to \neg p$$

  ### Desglose simbólico
  - Premisa Mayor: $p \to q$ (regla condicional establecida).
  - Premisa Menor: $\neg q$ (negación fáctica del consecuente).
  - Conclusión necesaria: $\neg p$ (deducción irrebatible de la negación del antecedente).
  - Equivalencia con Modus Ponens: Corresponde a aplicar Modus Ponens sobre la forma contrarrecíproca: $\frac{\neg q \to \neg p, \quad \neg q}{\therefore \neg p}$.

  ### Síntesis didáctica
  El Modus Tollens es el fundamento lógico del método de reducción al absurdo y del falseamiento de hipótesis en el método científico.
definiciones_clave: |
  - **Modus Tollens (MT)**: Regla de inferencia que permite deducir $\neg p$ a partir de las premisas $p \to q$ y $\neg q$.
  - **Negación del consecuente**: Condición requerida en la premisa menor para activar válidamente la deducción del Modus Tollens.
  - **Principio de falsabilidad**: Capacidad de refutar una hipótesis inicial al comprobar la falsedad de una de sus predicciones necesarias.
propiedades_relaciones: |
  - **Preservación de la verdad**: Si el condicional es verdadero y el consecuente es falso, el antecedente no puede haber sido verdadero.
  - **Distinción con la falacia de negación del antecedente**: Conocer $p \to q$ y $\neg p$ NO permite deducir $\neg q$.
ejemplo_guiado:
  enunciado: 'Aplica la regla del Modus Tollens a las siguientes premisas: Premisa 1: "Si un cuadrilátero es un rectángulo, entonces sus diagonales son de igual longitud". Premisa 2: "El cuadrilátero $C$ no tiene diagonales de igual longitud".'
  pasos:
    - 'Paso 1: Identificar las variables proposicionales:
      - $p$: "El cuadrilátero $C$ es un rectángulo".
      - $q$: "Las diagonales del cuadrilátero $C$ son de igual longitud".'
    - 'Paso 2: Escribir la Premisa 1 en forma simbólica: $p \to q$.'
    - 'Paso 3: Escribir la Premisa 2 en forma simbólica: $\neg q$ (se niega el consecuente).'
    - 'Paso 4: Aplicar el esquema del Modus Tollens $\frac{p \to q, \quad \neg q}{\therefore \neg p}$.'
    - 'Paso 5: Enunciar la conclusión deducida: "Por lo tanto, el cuadrilátero $C$ no es un rectángulo" ($\neg p$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el esquema formal y la conclusión deducida mediante la regla del Modus Tollens?'
    choices:
      - {text: 'A partir de $p \to q$ y $\neg q$, se deduce válidamente $\neg p$', is_correct: true}
      - {text: 'A partir de $p \to q$ y $\neg p$, se deduce válidamente $\neg q$', is_correct: false}
      - {text: 'A partir de $p \to q$ y $p$, se deduce válidamente $\neg q$', is_correct: false}
      - {text: 'A partir de $p \land q$, se deduce válidamente $p \lor q$', is_correct: false}
    explanation: 'La alternativa correcta es ''A partir de $p \to q$ y $\neg q$, se deduce válidamente $\neg p$''. El Modus Tollens niega el consecuente para negar el antecedente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A qué regla de inferencia equivale el Modus Tollens cuando el condicional se transforma a su forma contrarrecíproca?'
    choices:
      - {text: 'Al Modus Ponens aplicado sobre $\neg q \to \neg p$', is_correct: true}
      - {text: 'A la Ley de Doble Negación', is_correct: false}
      - {text: 'A la Ley de De Morgan para la conjunción', is_correct: false}
      - {text: 'A la disyunción exclusiva', is_correct: false}
    explanation: 'La alternativa correcta es ''Al Modus Ponens aplicado sobre $\neg q \to \neg p$''. Al sustituir $p \to q$ por su contrarrecíproco, se afirma el antecedente $\neg q$ aplicando Modus Ponens.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar la premisa condicional mayor: $p \to q$.'
  - 'Paso 2: Localizar la premisa menor y verificar que corresponde a la negación estricta del consecuente: $\neg q$.'
  - 'Paso 3: Verificar que no se esté negando el antecedente (evitando la falacia de negación del antecedente).'
  - 'Paso 4: Emitir formalmente la conclusión necesaria: $\neg p$.'
errores_correccion: |
  - **Error 1:** Negar el antecedente $\neg p$ para intentar deducir $\neg q$. **Cómo corregirlo:** Si tenemos $p \to q$ y sabemos $\neg p$, no se puede concluir $\neg q$ (Falacia de Negación del Antecedente). El Modus Tollens exige negar el consecuente ($\neg q$).
  - **Error 2:** Creer que el Modus Tollens concluye una afirmación sin negar. **Cómo corregirlo:** El Modus Tollens concluye la negación de la hipótesis: si la hipótesis era $p$, concluye $\neg p$; si la hipótesis era $\neg p$, concluye $\neg(\neg p) \equiv p$.
ejemplos:
  - titulo: 'Deducción en teoría de números'
    enunciado: 'Premisas: "Si un número $n$ es divisible por 10, entonces termina en 0" y "El número $n$ no termina en 0". ¿Qué se concluye?'
    alternativas:
      - 'El número $n$ no es divisible por 10'
      - 'El número $n$ es divisible por 5'
      - 'No es posible deducir nada'
    respuesta: 'El número $n$ no es divisible por 10'
    solucion_pasos:
      - '1. Premisa 1: $p \to q$.'
      - '2. Premisa 2: $\neg q$.'
      - '3. Por Modus Tollens se concluye $\neg p$: "El número $n$ no es divisible por 10".'
  - titulo: 'Tautología del Modus Tollens'
    enunciado: '¿La fórmula $((p \to q) \land \neg q) \to \neg p$ es una tautología?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, su tabla de verdad produce el vector $[V, V, V, V]^T$.'
  - titulo: 'Inferencia con hipótesis negativa'
    enunciado: 'Dadas las premisas $\neg p \to q$ y $\neg q$, ¿se concluye válidamente $p$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por Modus Tollens se deduce $\neg(\neg p)$, que por doble negación equivale a $p$.'
  - titulo: 'Deducción indirecta'
    enunciado: '¿El Modus Tollens fundamenta la prueba por reducción al absurdo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al encontrar una consecuencia falsa o contradictoria se refuta la premisa de partida.'
errores_frecuentes:
  - 'La afirmación de que a partir de las premisas $p \to q$ y $\neg p$ se deduce válidamente $\neg q$ mediante Modus Tollens.'
  - 'La afirmación de que el Modus Tollens se aplica afirmando el consecuente de la implicación.'
  - 'La afirmación de que el Modus Tollens puede conducir a una conclusión inválida si las premisas son verdaderas.'
  - 'La afirmación de que la fórmula condicional del Modus Tollens contiene filas falsas en su tabla de verdad.'
  - 'La afirmación de que el Modus Tollens no es equivalente al Modus Ponens aplicado sobre el contrarrecíproco.'
afirmaciones_verdaderas:
  - 'La regla del Modus Tollens establece que a partir de la premisa condicional $p \to q$ y la negación del consecuente $\neg q$, se deduce válidamente la negación del antecedente $\neg p$.'
  - 'La validez deductiva del Modus Tollens se fundamenta en que la implicación $((p \to q) \land \neg q) \to \neg p$ es una tautología universal.'
al_terminar_debes_poder: |
  QUÉ: Conocer, justificar y aplicar la regla de inferencia deductiva Modus Tollens ($\frac{p \to q, \neg q}{\therefore \neg p}$).
  CÓMO: Identificar la negación del consecuente, aplicar la regla de negación del antecedente y distinguirla de la falacia de negación del antecedente.
