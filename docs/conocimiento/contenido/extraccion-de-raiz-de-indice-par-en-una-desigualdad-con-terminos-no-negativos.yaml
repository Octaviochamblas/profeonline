semantic_id: MAT.ALG.DESIG_PROPIEDADES.RAIZ_INDICE_PAR
resumen_inicial: Extraer raíz de índice par exige que ambos miembros sean no negativos
  y preserva el sentido de la desigualdad.
explicacion_simple: 'Para extraer una raíz cuadrada ($\sqrt{x}$) o de índice par a
  ambos lados de una desigualdad, debemos asegurar primero que ambas cantidades sean
  no negativas ($\ge 0$).

  Si $0 \le a < b$, al extraer la raíz cuadrada resulta $\sqrt{a} < \sqrt{b}$, manteniendo
  la relación de orden.'
explicacion_formal: 'Para constantes no negativas $a, b \in \mathbb{R}^+ \cup \{0\}$
  y un índice par $2k$ con $k \in \mathbb{N}$:


  $$0 \le a < b \iff \sqrt[2k]{a} < \sqrt[2k]{b}$$


  **Desglose de la fórmula:**

  - $a, b \ge 0$: Condición obligatoria de existencia en $\mathbb{R}$ para raíces
  de índice par.'
definiciones_clave: '- **Radicación de índice par en desigualdades**: Aplicación del
  operador $\sqrt[2k]{}$ sobre cantidades no negativas conservando el orden en $\mathbb{R}$.'
propiedades_relaciones: '- **Monotonía en reales positivos**: La función $f(x) = \sqrt{x}$
  es estrictamente creciente para $x \ge 0$.'
ejemplo_guiado:
  enunciado: Dada la desigualdad de números positivos $9 < 25$, extrae la raíz cuadrada
    en ambos miembros y comprueba la validez del resultado.
  pasos:
  - 'Paso 1: Verificar que ambos términos sean no negativos: $9 \ge 0$ y $25 \ge 0$.Paso
    2: Extraer raíz cuadrada en el primer miembro: $\sqrt{9} = 3$.Paso 3: Extraer
    raíz cuadrada en el segundo miembro: $\sqrt{25} = 5$.Paso 4: Comparar ambos resultados:
    $3 < 5$.Paso 5: Concluir que el sentido $<$ se conserva verdaderamente.'
checkpoints:
- placement: after_explicacion_formal
  question: Al extraer la raíz cuadrada a la desigualdad de números no negativos $9
    < 25$, ¿cuál es la relación resultante?
  choices:
  - text: $3 < 5$
    is_correct: true
  - text: $3 > 5$
    is_correct: false
  - text: $-3 < -5$
    is_correct: false
  - text: $3 = 5$
    is_correct: false
  explanation: La alternativa correcta es '$3 < 5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué restricción sobre los números $a$ y $b$ es obligatoria para poder
    extraer una raíz de índice par?
  choices:
  - text: Ambos números deben ser no negativos ($a \ge 0, b \ge 0$).
    is_correct: true
  - text: Ambos números deben ser impares negativos.
    is_correct: false
  - text: La suma de ambos debe dar cero.
    is_correct: false
  - text: No se exige ninguna restricción.
    is_correct: false
  explanation: La alternativa correcta es 'Ambos números deben ser no negativos ($a
    \ge 0, b \ge 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asegurarse de que ambos miembros de la desigualdad sean mayores o iguales
  a cero.'
- 'Paso 2: Extraer la raíz de índice par en ambos lados.'
- 'Paso 3: Mantener el mismo símbolo de desigualdad.'
errores_correccion: '- **Error común:** Intentar extraer raíz cuadrada a términos
  negativos en una desigualdad (como $\sqrt{-9} < \sqrt{-25}$).

  - **Cómo corregirlo:** Las raíces pares de números negativos NO EXISTEN en los números
  reales $\mathbb{R}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Invertir el sentido de la desigualdad al sumar o restar un número negativo.
- Olvidar invertir el sentido del símbolo al multiplicar o dividir por una cantidad
  negativa.
- Extraer raíz cuadrada a términos negativos en una desigualdad de números reales.
- Tomar recíprocos en números de distinto signo invirtiendo el símbolo incorrectamente.
- Mantener el mismo símbolo al elevar al cuadrado desigualdades formadas por números
  negativos.
afirmaciones_verdaderas:
- Sumar o restar una misma cantidad en ambos miembros conserva siempre el sentido
  de la desigualdad.
- Multiplicar o dividir ambos miembros por un escalar estrictamente negativo exige
  invertir la orientación del símbolo de la desigualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar rigurosamente las
  propiedades de las desigualdades al sumar, multiplicar, dividir y tomar potencias
  o raíces.
fuente: Texto escolar MINEDUC — Álgebra / Propiedades de Desigualdades
