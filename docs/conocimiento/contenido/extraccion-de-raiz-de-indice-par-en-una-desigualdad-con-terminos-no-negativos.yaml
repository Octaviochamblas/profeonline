semantic_id: MAT.ALG.DESIG_PROPIEDADES.RAIZ_INDICE_PAR
resumen_inicial: 'Extracción de raíz de índice par en una desigualdad con términos
  no negativos: relaciones de orden, intervalos y resolución en Propiedades de las
  desigualdades.'
explicacion_simple: Para aplicar raíces de índice par a una desigualdad, se debe asegurar
  que todos los términos sean no negativos. Bajo esta condición, la extracción de
  la raíz mantiene el sentido de la desigualdad.
explicacion_formal: '### Definición formal

  Si $0 \leq a < b$ y $n$ es un número natural par, entonces $\sqrt[n]{a} < \sqrt[n]{b}$.


  ### Desarrollo didáctico

  Las raíces de índice par (como la raíz cuadrada o cuarta) solo están definidas en
  el conjunto de los números reales para valores mayores o iguales a cero. En este
  dominio, la función $f(x) = \sqrt[n]{x}$ con $n$ par es estrictamente creciente.
  Esto significa que a un número mayor le corresponde una raíz mayor, manteniendo
  el orden original, siempre y cuando se garantice que los radicandos no sean negativos.'
definiciones_clave: '- **Extracción de raíz de índice par en una desigualdad con términos
  no negativos**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a extracción de raíz de índice par en una
  desigualdad con términos no negativos.'
