semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.AREA_DELTOIDE
resumen_inicial: 'Cálculo del área del deltoide mediante sus diagonales: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Gracias a la propiedad de perpendicularidad de sus diagonales,
  el deltoide tiene una fórmula de área muy similar a la del rombo.
explicacion_formal: '![Área de un deltoide: (d1×d2)/2](/static/img/geometria/poligonos-cuadrilateros/trapecios-deltoide-area.svg)


  ### Definición formal


  Si $d_1$ y $d_2$ son las diagonales (perpendiculares) de un deltoide, su área es
  $A=\frac{d_1\times d_2}{2}$. Esta fórmula es válida gracias a que las diagonales
  son perpendiculares, permitiendo dividir el deltoide en cuatro triángulos rectángulos.


  ### Desarrollo didáctico


  Un deltoide con diagonales de 16 cm y 10 cm tiene área $A=\frac{16\times10}{2}=\frac{160}{2}=80$
  cm². Esta misma fórmula aplica también al rombo, ya que es un caso particular de
  deltoide con la misma propiedad de diagonales perpendiculares.'
