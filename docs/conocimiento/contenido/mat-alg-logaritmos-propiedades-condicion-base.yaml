semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.CONDICION_BASE
resumen_inicial: 'Identificación de la condición de base positiva y distinta de uno
  en un logaritmo: conceptos, asíntotas, propiedades e inversidad en Logaritmos y
  sus propiedades.'
explicacion_simple: Al simplificar expresiones logarítmicas con literales, es fácil
  olvidar revisar si la base sigue siendo válida en cada paso del desarrollo algebraico.
explicacion_formal: '### Definición formal


  Las propiedades $\log_b(xy)=\log_b(x)+\log_b(y)$, $\log_b(x/y)=\log_b(x)-\log_b(y)$
  y $\log_b(x^n)=n\log_b(x)$ se enuncian bajo el supuesto de que $b>0$ y $b\neq1$.
  Si la base propuesta en un ejercicio no cumple estas condiciones, ninguna de las
  propiedades puede aplicarse.


  ### Desarrollo didáctico


  Antes de simplificar una expresión como $\log_5(xy)$, se verifica que $b=5$ cumpla
  $5>0$ y $5\neq1$. Solo entonces es válido reescribirla como $\log_5(x)+\log_5(y)$.
  Si en cambio se propusiera $\log_1(xy)$, ninguna propiedad sería aplicable, porque
  la base $1$ queda excluida desde la definición misma del logaritmo.'
definiciones_clave: '- **Identificación de la condición de base positiva y distinta
  de uno en un logaritmo**: Concepto fundamental en el estudio del crecimiento/decaimiento
  exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a identificación de la condición de base positiva y distinta de uno en
  un logaritmo.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de identificación
    de la condición de base positiva y distinta de uno en un logaritmo.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de identificación de la condición
    de base positiva y distinta de uno en un logaritmo.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
