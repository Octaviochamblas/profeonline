semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.CONDICION_BASE
resumen_inicial: 'La base $b$ de todo logaritmo $\log_b(a)$ debe cumplir estrictamente $b > 0$ y $b \neq 1$ para garantizar su existencia y unicidad en los números reales.'
explicacion_simple: |
  Para que un logaritmo exista y tenga una respuesta única en los números reales, su base $b$ debe cumplir dos reglas sagradas: ser positiva ($b > 0$) y no ser igual a 1 ($b \neq 1$). Si la base fuera negativa, al intentar calcular exponentes tendríamos problemas con raíces de números negativos. Y si la base fuera 1, elevar $1^c$ siempre daría 1, haciendo imposible obtener cualquier otro número o generando infinitas soluciones para $\log_1(1)$.
explicacion_formal: |
  ### Definición formal
  El conjunto de valores válidos para la **base de un logaritmo** $b \in \mathbb{R}$ es el dominio restringido $b \in ]0, 1[ \cup ]1, +\infty[$, sustentado analíticamente en dos imposibilidades algebraicas:
  1. **Justificación de $b > 0$**: Si $b \le 0$, la función exponencial asociada $b^c$ no está definida de manera continua en $\mathbb{R}$ (por ejemplo, para $b = -4$, la expresión $\log_{-4}(2) = c \implies (-4)^c = 2 \implies c = \frac{1}{2} \implies \sqrt{-4} \notin \mathbb{R}$).
  2. **Justificación de $b \neq 1$**: Si $b = 1$, la ecuación $\log_1(a) = c \iff 1^c = a$ no tiene solución para $a \neq 1$ ($1^c = 5$ es imposible), mientras que para $a = 1$ admite infinitas soluciones ($1^c = 1$ es cierto para todo $c \in \mathbb{R}$), violando la unicidad funcional.

  ### Desglose simbólico
  - $b \le 0 \implies$ No existencia de la función logarítmica real.
  - $b = 1 \implies$ Indeterminación / Imposibilidad de definición funcional.
  - $0 < b < 1 \implies$ Base logarítmica decreciente válida.
  - $b > 1 \implies$ Base logarítmica creciente válida.

  ### Síntesis didáctica
  Diferenciar restricciones de la base de las del argumento: La base $b$ tiene **dos** restricciones ($b > 0$ y $b \neq 1$). El argumento $a$ tiene **una** sola restricción ($a > 0$).
definiciones_clave: |
  - **Condición de base $b > 0 \land b \neq 1$**: Requisito algebraico de existencia del logaritmo real.
  - **Indeterminación de base 1**: Falta de unicidad producida por la constante $1^c = 1$.
  - **Dominio de la base**: Intervalo disjunto $]0, 1[ \cup ]1, +\infty[$.
propiedades_relaciones: |
  - **Dualidad de familias logarítmicas**: Si $b > 1$, la función $f(x) = \log_b(x)$ es estrictamente creciente. Si $0 < b < 1$, es estrictamente decreciente.
  - **Relación directa con la función exponencial**: Las restricciones de la base del logaritmo son idénticas a las restricciones de la base de la función exponencial.
ejemplo_guiado:
  enunciado: 'Evalúa si las siguientes expresiones representan bases logarítmicas válidas justificando en cada caso: A) $\log_{0.5}(8)$, B) $\log_{-2}(16)$, C) $\log_1(9)$, D) $\log_{x - 3}(10)$.'
  pasos:
    - 'Paso 1: Para $\log_{0.5}(8)$, la base es $b = 0.5$. Cumple $0 < 0.5 < 1$ y $0.5 \neq 1$. Es una base logarítmica decreciente válida.'
    - 'Paso 2: Para $\log_{-2}(16)$, la base es $b = -2 < 0$. Viola la condición $b > 0$. Expresión no válida en $\mathbb{R}$.'
    - 'Paso 3: Para $\log_1(9)$, la base es $b = 1$. Viola la condición $b \neq 1$ pues $1^c = 9$ no tiene solución. Expresión no válida.'
    - 'Paso 4: Para $\log_{x - 3}(10)$, la base es $b = x - 3$. Para ser válida requiere $x - 3 > 0 \implies x > 3$, y $x - 3 \neq 1 \implies x \neq 4$. Conjunto válido: $x \in ]3, 4[ \cup ]4, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la base $b$ de un logaritmo real no puede ser igual al número 1?'
    choices:
      - {text: 'Porque $1^c = 1$ para cualquier exponente $c$, lo que impide obtener argumentos distintos de 1 y genera infinitas respuestas para $\log_1(1)$', is_correct: true}
      - {text: 'Porque el número 1 no se puede multiplicar por ningún número', is_correct: false}
      - {text: 'Porque los logaritmos solo aceptan números pares como base', is_correct: false}
      - {text: 'Porque al elevar 1 a una potencia el resultado se vuelve negativo', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque $1^c = 1$ para cualquier exponente $c$, lo que impide obtener argumentos distintos de 1 y genera infinitas respuestas para $\log_1(1)$''. La base 1 elimina la inyectividad de la función.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para qué valores de la variable $x$ está bien definida la base del logaritmo $\log_{2x - 6}(100)$?'
    choices:
      - {text: 'Para todo $x > 3$ excepto $x = 3.5$', is_correct: true}
      - {text: 'Para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: 'Para todo $x > 6$', is_correct: false}
      - {text: 'Únicamente para $x = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''Para todo $x > 3$ excepto $x = 3.5$''. Exigimos $2x - 6 > 0 \implies x > 3$, y $2x - 6 \neq 1 \implies 2x \neq 7 \implies x \neq 3.5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la expresión que ocupa el lugar de la base $b$ en $\log_b(a)$.'
  - 'Paso 2: Plantear la primera inecuación de positivismo: $b > 0$.'
  - 'Paso 3: Plantear la inecuación de no unidad: $b \neq 1$.'
  - 'Paso 4: Resolver ambas condiciones y determinar el conjunto de validez para la base.'
errores_correccion: |
  - **Error 1:** Permitir la base $b = 1$ creyendo que $\log_1(1) = 1$. **Cómo corregirlo:** La base $b = 1$ está estrictamente excluida. La ecuación $1^c = 1$ es satisfecha por cualquier número $c$, rompiendo la unicidad funcional.
  - **Error 2:** Creer que las bases fraccionarias entre 0 y 1 (como $b = 0.2$) no son válidas. **Cómo corregirlo:** Toda fracción decimal estrictamente entre 0 y 1 es una base perfectamente válida que genera logaritmos decrecientes.
ejemplos:
  - titulo: 'Validación de base decimal'
    enunciado: '¿La base $b = 0.05$ es válida para un logaritmo?'
    alternativas:
      - 'Sí, porque cumple $0 < 0.05 < 1$'
      - 'No, debe ser mayor que 1'
      - 'No, debe ser un número entero'
    respuesta: 'Sí, porque cumple $0 < 0.05 < 1$'
    solucion_pasos:
      - '1. Verificamos $0.05 > 0$.'
      - '2. Verificamos $0.05 \neq 1$.'
      - '3. Es una base logarítmica válida.'
  - titulo: 'Rechazo de base negativa'
    enunciado: '¿Es válida la expresión $\log_{-5}(25)$ en los números reales?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La base $b = -5$ viola la condición $b > 0$, de modo que no está definida en $\mathbb{R}$.'
  - titulo: 'Base variable con restricción'
    enunciado: 'En $\log_{x - 1}(8)$, ¿el valor $x = 2$ es válido para la base?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Para $x = 2$, la base resulta $2 - 1 = 1$, violando la condición de que la base deba ser distinta de 1.'
  - titulo: 'Base irracional'
    enunciado: '¿El número de Euler $e \approx 2.718$ es una base logarítmica válida?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El número $e$ es positivo y distinto de 1, definiendo el logaritmo natural $\ln(x)$.'
errores_frecuentes:
  - 'La base de un logaritmo puede ser cualquier número entero negativo.'
  - 'El logaritmo en base 1 está bien definido y cumple $\log_1(1) = 1$.'
  - 'Las bases decimales entre 0 y 1 no se pueden utilizar en cálculos logarítmicos.'
  - 'La condición de la base $b > 0$ es suficiente sin requerir la exclusión de $b = 1$.'
  - 'La base de un logaritmo se vuelve nula cuando el argumento es igual a cero.'
afirmaciones_verdaderas:
  - 'La base $b$ de un logaritmo real debe cumplir de manera simultánea las condiciones $b > 0$ y $b \neq 1$.'
  - 'Las bases comprendidas en el intervalo $]0, 1[$ generan funciones logarítmicas decrecientes, mientras que las bases en $]1, +\infty[$ generan funciones crecientes.'
al_terminar_debes_poder: 'Identificar y argumentar las restricciones de existencia sobre la base $b > 0, b \neq 1$ en cualquier expresión logarítmica.'
