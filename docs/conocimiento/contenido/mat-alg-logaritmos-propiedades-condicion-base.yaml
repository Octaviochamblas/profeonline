  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    identificación de la condición de base positiva y distinta de uno en un logaritmo?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en logaritmos y sus
      propiedades
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en logaritmos y sus propiedades. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en identificación de la condición de base positiva y distinta de uno en un logaritmo?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la base $b$ de la expresión logarítmica antes de aplicar cualquier
  propiedad.'
- 'Paso 2: Verifica que $b>0$ y $b\neq1$.'
- 'Paso 3: Solo si la base es válida, aplica la propiedad algebraica correspondiente.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en identificación
  de la condición de base positiva y distinta de uno en un logaritmo.
ejemplos:
- titulo: Verificación previa a aplicar una propiedad
  enunciado: ¿Es válido aplicar $\log_7(xy)=\log_7(x)+\log_7(y)$?
  solucion_pasos:
  - Se revisa la base: $7>0$ y $7\neq1$.
  - Sí, es válido aplicar la propiedad del producto.
- titulo: Detección de una base inválida
  enunciado: ¿Es válido aplicar propiedades a $\log_1(x^n)$?
  solucion_pasos:
  - Se revisa la base: $b=1$ no cumple $b\neq1$.
  - No es válido; la expresión ni siquiera está definida como función logarítmica.
- titulo: ¿Las propiedades logarítmicas dependen de la condición de la base?
  enunciado: ¿La validez de las propiedades del logaritmo depende de que la base cumpla
    $b>0$ y $b\neq1$?
  respuesta: Sí
  solucion_pasos:
  - Todas las propiedades se enuncian bajo ese supuesto sobre la base.
- titulo: ¿Puede aplicarse una propiedad logarítmica con base negativa?
  enunciado: ¿Se puede aplicar la propiedad del cociente con una base negativa como
    $b=-2$?
  respuesta: 'No'
  solucion_pasos:
  - La base debe ser positiva; con $b=-2$ la expresión ni siquiera representa una
    función logarítmica válida.
errores_frecuentes:
- Aplicar propiedades logarítmicas sin verificar primero la condición de la base.
- Aceptar $b=1$ como base válida al simplificar expresiones algebraicas.
- Confundir la condición sobre la base con la condición sobre el argumento.
- Suponer que la condición de la base solo aplica al inicio y no en cada paso del
  desarrollo.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando identificación de la condición de base positiva y distinta de uno en un
  logaritmo.
