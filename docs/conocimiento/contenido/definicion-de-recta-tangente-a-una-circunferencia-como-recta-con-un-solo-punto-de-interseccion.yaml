semantic_id: MAT.GEO.CIRCULO_RECTAS.TANGENTE
resumen_inicial: Una recta tangente es aquella que toca a la circunferencia en exactamente un único punto de contacto, situándose a una distancia del centro igual al radio.
explicacion_simple: 'La palabra **tangente** viene del latín *tangere*, que significa ''tocar''. Una **recta tangente** es una línea que pasa rozando la circunferencia y la toca en **un único punto exacto** (llamado punto de tangencia $T$), sin llegar a meterse nunca en el interior del círculo.


  La condición matemática perfecta de una recta tangente es que la distancia desde el centro de la circunferencia hasta la recta es **exactamente igual a la medida del radio ($d = r$)**. Además, tiene una propiedad geométrica estelar: en ese punto de contacto, la recta forma un ángulo recto de **$90^\circ$ con el radio**.


  ![Definición de recta tangente](/static/img/nodos/definicion-de-recta-tangente-a-una-circunferencia-como-recta-con-un-solo-punto-de-interseccion-intro.svg)

  '
explicacion_formal: '### Definición geométrica conjuntista

  Sea $\mathcal{C}(O, r)$ una circunferencia en $\mathbb{R}^2$. Una recta coplanar $\mathcal{L}$ se define como **recta tangente** a $\mathcal{C}$ si y solo si su intersección consta de un singleton (un único punto de contacto):

  $$\mathcal{L} \text{ es tangente a } \mathcal{C} \iff |\mathcal{L} \cap \mathcal{C}| = 1 \iff \mathcal{L} \cap \mathcal{C} = \{T\}$$


  ### Criterio métrico de distancia al centro

  La distancia euclidiana perpendicular desde el centro $O$ a la recta tangente es estrictamente igual al radio de la circunferencia:

  $$d(O, \mathcal{L}) = r$$


  ### Criterio algebraico (Discriminante nulo)

  Al resolver el sistema entre la recta y la circunferencia en el plano cartesiano, la ecuación de segundo grado resultante posee una raíz real doble:

  $$\Delta = b^2 - 4ac = 0 \implies \text{Solución única } (x_T, y_T)$$


  > **Complemento didáctico:** El concepto de tangente es la base del cálculo diferencial (la derivada es la pendiente de la recta tangente). En la PAES, cada vez que veas una recta tangente, asóciala inmediatamente con $d = r$, intersección única ($\{T\}$) y perpendicularidad a $90^\circ$ con el radio.

  '
definiciones_clave: '- **Recta tangente**: Recta que toca a la circunferencia en un único punto sin penetrar en ella.

  - **Punto de tangencia ($T$)**: Punto único de contacto común a la recta y a la circunferencia.

  - **Condición de tangencia ($d = r$)**: Igualdad métrica que distingue a la tangente de la secante y la exterior.

  '
propiedades_relaciones: "- **Perpendicularidad ortogonal**: En el punto $T$, el radio $\\overline{OT}$ es perpendicular a la recta tangente ($\\overline{OT} \\perp \\mathcal{L}$). \n- **Semirrectas exteriores**: Salvo el punto $T$, todos los demás puntos $P \\in \\mathcal{L}$ ($P \\neq T$) son estrictamente exteriores ($d(P, O) > r$).\n- **Existencia y unicidad**: Por cada punto $T$ de la circunferencia pasa una única recta tangente.\n"
ejemplo_guiado:
  enunciado: '![Ejemplos de recta tangente](/static/img/nodos/definicion-de-recta-tangente-a-una-circunferencia-como-recta-con-un-solo-punto-de-interseccion-ejemplos.svg)


    Dada la circunferencia $x^2 + y^2 = 25$, determina si la recta horizontal $y = 5$ es tangente a ella y halla las coordenadas del punto de tangencia.'
  pasos:
  - 'Paso 1: Identificar centro y radio de la circunferencia: Centro en $O(0, 0)$ y radio $r = \sqrt{25} = 5\text{ cm}$.'
  - 'Paso 2: Calcular la distancia del centro $O(0, 0)$ a la recta $y = 5$: $d = |5 - 0| = 5\text{ cm}$.'
  - 'Paso 3: Evaluar tangencia: Como $d = 5 = r$, la recta es rigurosamente tangente.'
  - 'Paso 4: Hallar el punto de tangencia sustituyendo $y = 5$ en la circunferencia: $x^2 + 5^2 = 25 \implies x^2 + 25 = 25 \implies x^2 = 0 \implies x = 0$. El punto único es $T(0, 5)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos puntos en común tiene una recta tangente con la circunferencia a la que es tangente?
  choices:
  - text: Exactamente un único punto.
    is_correct: true
  - text: Dos puntos distintos.
    is_correct: false
  - text: Ningún punto.
    is_correct: false
  - text: Depende de la longitud del radio.
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente un único punto.' Por definición, una recta tangente toca a la circunferencia en un único punto llamado punto de tangencia.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué valor adquiere el discriminante Δ al resolver el sistema entre una recta tangente y una circunferencia?
  choices:
  - text: Δ = 0.
    is_correct: true
  - text: Δ > 0.
    is_correct: false
  - text: Δ < 0.
    is_correct: false
  - text: Δ = 1.
    is_correct: false
  explanation: La alternativa correcta es 'Δ = 0.' El discriminante igual a cero garantiza la existencia de una única solución real doble (el punto de contacto único).
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Calcular la distancia perpendicular $d$ desde el centro a la recta.

  2. Verificar la igualdad estricta $d = r$.

  3. En forma analítica, resolver el sistema y confirmar que el discriminante sea $\Delta = 0$.

  4. Identificar las coordenadas $(x_T, y_T)$ del punto único de contacto.

  '
errores_correccion: '- **Error común 1:** Creer que la tangente puede penetrar al círculo. **Corrección:** Solo toca el borde en $T$; todos los demás puntos de la recta están afuera del círculo.

  - **Error común 2:** Afirmar que por un punto de la circunferencia pasan múltiples tangentes. **Corrección:** Por cada punto de la circunferencia pasa UNA sola recta tangente.

  '
ejemplos:
- tipo: A
  titulo: Condición métrica de tangencia
  enunciado: Si una circunferencia tiene radio $8\text{ cm}$, ¿a qué distancia de su centro debe pasar una recta para ser tangente?
  alternativas:
  - text: A exactamente $8\text{ cm}$.
    is_correct: true
  - text: A más de $8\text{ cm}$.
    is_correct: false
  - text: A menos de $8\text{ cm}$.
    is_correct: false
  - text: A $16\text{ cm}$.
    is_correct: false
  explicacion: 'La condición de tangencia exige que la distancia al centro sea exactamente igual al radio: $d = r = 8\text{ cm}$.'
- tipo: B
  titulo: Unicidad de punto de tangencia
  enunciado: ¿Puede una recta tangente tener más de un punto de intersección con la circunferencia?
  respuesta: 'No'
  explicacion: No. Si tuviera más de un punto, sería una recta secante.
errores_frecuentes:
- '''Confundir la recta tangente con la secante creyendo que corta en dos puntos cercanos.'''
- '''Asumir que la distancia al centro es menor que el radio.'''
- '''Creer que el discriminante en una recta tangente es positivo en lugar de cero.'''
afirmaciones_verdaderas:
- '''Una recta tangente interseca a la circunferencia en un único punto común.'''
- '''La distancia desde el centro a la recta tangente es estrictamente igual al radio ($d = r$).'''
- '''El sistema algebraico entre una recta tangente y una circunferencia posee discriminante nulo ($\Delta = 0$).'''
al_terminar_debes_poder: '**QUÉ:** Definir rectas tangentes e identificar analíticamente la condición de contacto único.


  **CÓMO:** Verificando la igualdad métrica $d(O, \mathcal{L}) = r$ y el discriminante $\Delta = 0$.


