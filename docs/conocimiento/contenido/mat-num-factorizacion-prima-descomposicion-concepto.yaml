semantic_id: MAT.NUM.FACTORIZACION_PRIMA.DESCOMPOSICION_PRIMA_CONCEPTO
resumen_inicial: 'La descomposición prima expresa un número compuesto como producto
  exclusivo de factores primos elevados a sus potencias: $n = p_1^{e_1} \cdot p_2^{e_2}
  \dots p_k^{e_k}$.'
explicacion_simple: La descomposición prima es como desarmar un objeto compuesto hasta
  obtener sus componentes más simples e indivisibles. Consiste en escribir cualquier
  número entero como una multiplicación donde todos los factores que intervienen son
  números primos.
explicacion_formal: 'Para todo entero $n > 1$, su **Descomposición en Factores Primos**
  (o Canónica) se expresa de la forma:


  $$n = p_1^{e_1} \cdot p_2^{e_2} \cdot \ldots \cdot p_k^{e_k} = \prod_{i=1}^k p_i^{e_i}$$


  **Desglose de la fórmula:**

  - $p_1 < p_2 < \dots < p_k$: Primos distintos ordenados de menor a mayor.

  - $e_i \in \mathbb{N}$: Exponentes naturales que indican cuántas veces se repite
  cada primo como factor.

  - $\prod$: Notación del producto acumulado de los factores primos elevados a sus
  potencias.


  > **Complemento didáctico:** En $60 = 2^2 \cdot 3 \cdot 5$, el factor primo 2 se
  repite 2 veces, el 3 una vez y el 5 una vez.'
definiciones_clave: '- **Descomposición prima (canónica)**: Expresión de $n$ como
  multiplicación exclusiva de potencias de primos.

  - **Exponente de la potencia**: Frecuencia $e_i$ de repetición del factor primo
  $p_i$.'
propiedades_relaciones: '- **Existencia universal**: Todo compuesto se puede expresar
  como producto de primos.'
ejemplo_guiado:
  enunciado: Escriba la descomposición prima del número $60$ en forma de potencias
    de primos.
  pasos:
  - 'Paso 1: Descomponer 60 en productos: $60 = 6 \cdot 10$.'
  - 'Paso 2: Descomponer cada factor en primos: $6 = 2 \cdot 3$ y $10 = 2 \cdot 5$.'
  - 'Paso 3: Agrupar los factores primos iguales: $60 = 2 \cdot 2 \cdot 3 \cdot 5
    = 2^2 \cdot 3 \cdot 5$.'
  - 'Conclusión: La descomposición prima canónica de 60 es $2^2 \cdot 3 \cdot 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes expresiones representa la descomposición prima
    de 60?
  choices:
  - text: 2^2 · 3 · 5
    is_correct: true
  - text: 6 · 10
    is_correct: false
  - text: 4 · 15
    is_correct: false
  - text: 2 · 30
    is_correct: false
  explanation: La alternativa correcta es '2^2 · 3 · 5', pues todos sus factores son
    primos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la descomposición prima de 60 = 2^2 · 3 · 5, ¿cuántas veces se repite
    el primo 2?
  choices:
  - text: 2 veces (exponente 2)
    is_correct: true
  - text: 1 vez
    is_correct: false
  - text: 3 veces
    is_correct: false
  - text: 4 veces
    is_correct: false
  explanation: La alternativa correcta es '2 veces (exponente 2)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el número compuesto entre sus factores primos divisores.'
- 'Paso 2: Continuar dividiendo los cocientes por primos hasta obtener puros factores
  primos.'
- 'Paso 3: Escribir la multiplicación de primos agrupando repeticiones en notación
  de potencias.'
errores_correccion: '- **Error 1: Dejar números compuestos en la expresión de descomposición
  prima ($60 = 6 \cdot 10$).** **Cómo corregirlo:** Todos los factores deben ser estrictamente
  números PRIMOS.


  - **Error 2: Incluir al número 1 en la multiplicación ($60 = 1 \cdot 2^2 \cdot 3
  \cdot 5$).** **Cómo corregirlo:** El 1 no es primo y no debe formar parte de la
  descomposición prima.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Halle la descomposición prima del número 24.
  alternativas:
  - 2^3 · 3
  - 4 · 6
  - 2 · 12
  respuesta: 2^3 · 3
  solucion_pasos:
  - $24 = 8 \cdot 3 = 2^3 \cdot 3$.
- titulo: Ejemplo 2
  enunciado: ¿Es $3^2 \cdot 5$ la descomposición prima de 45?
  alternativas:
  - Sí, porque 3 y 5 son primos y 9 · 5 = 45
  - No, le falta el 1
  - No, 9 es compuesto
  respuesta: Sí, porque 3 y 5 son primos y 9 · 5 = 45
  solucion_pasos:
  - $3^2 \cdot 5 = 9 \cdot 5 = 45$. Ambas bases son primas.
- titulo: ¿Se pueden expresar todos los números compuestos como producto de primos?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de la Aritmética.
- titulo: ¿Es 2 · 18 la descomposición prima de 36?
  respuesta: 'No'
  solucion_pasos:
  - No, el 18 es un número compuesto. La correcta es $2^2 \cdot 3^2$.
errores_frecuentes:
- La descomposición prima de un número puede contener factores que sean compuestos
  como el 4 o el 6.
- El número 1 debe incluirse siempre en la descomposición prima como el primer factor.
- Sumar los factores primos de un número da como resultado el número compuesto original.
- Un número compuesto impar solo se puede descomponer en dos factores primos.
- La descomposición prima cambia dependiendo del número de cifras que tenga el entero.
afirmaciones_verdaderas:
- La descomposición prima expresa un número compuesto como producto exclusivo de potencias
  de números primos.
- Todos los factores que aparecen en la descomposición canónica deben ser números
  primos.
al_terminar_debes_poder: Al terminar serás capaz de descomponer cualquier compuesto
  como producto exclusivo de potencias de factores primos ($n = p_1^{e_1} \cdot p_2^{e_2}
  \dots p_k^{e_k}$).
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
