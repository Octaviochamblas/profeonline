semantic_id: MAT.NUM.FACTORIZACION_PRIMA.DESCOMPOSICION_PRIMA_CONCEPTO
resumen_inicial: "La descomposición en factores primos consiste en expresar un número compuesto como la multiplicación exclusiva de números primos."
explicacion_simple: |
  ¿Sabías que cada número entero tiene un "código secreto" único hecho de números primos
  multiplicados entre sí? Es como el ADN de los números. Por ejemplo, el código del 6 es
  $2\cdot3$, y el del 10 es $2\cdot5$. A este proceso de desarmar un número compuesto en
  sus piezas primas básicas lo llamamos descomposición en factores primos.
explicacion_formal: |
  Cualquier número entero compuesto mayor que $1$ puede expresarse como el producto de
  números primos: la **descomposición prima**. Si un factor se repite, se agrupa usando
  potencias. Por ejemplo, para $N=24$: dividiendo sucesivamente por primos,
  $24=2\cdot2\cdot2\cdot3$, que se agrupa como $24=2^3\cdot3$.
definiciones_clave: |
  **Descomposición prima**: forma de escribir un número compuesto como producto de sus
  factores primos, agrupando los repetidos con potencias.
propiedades_relaciones: |
  La descomposición prima es la base del cálculo del m.c.m. y el M.C.D., y también de la
  cantidad total de divisores de un número.
ejemplo_guiado:
  enunciado: "Descompón el número 20 en factores primos."
  pasos:
    - "$20\\div2=10$; $10\\div2=5$; $5\\div5=1$."
    - "Los factores usados son $2,2,5$."
    - "Conclusión: $20=2^2\\cdot5$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué se hace cuando un factor primo se repite en la descomposición?"
    choices:
      - {text: "Se agrupa usando una potencia", is_correct: true}
      - {text: "Se cuenta solo una vez", is_correct: false}
      - {text: "Se suma en vez de multiplicar", is_correct: false}
      - {text: "Se descarta", is_correct: false}
    explanation: "La correcta es Se agrupa usando una potencia: por ejemplo, $2\\cdot2\\cdot2=2^3$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es la descomposición prima de 45?"
    choices:
      - {text: "$3^2\\cdot5$", is_correct: true}
      - {text: "$3\\cdot5^2$", is_correct: false}
      - {text: "$9\\cdot5$", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es $3^2\\cdot5$: $45\\div3=15$, $15\\div3=5$, $5\\div5=1$, factores $3,3,5$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Divide el número compuesto por el menor número primo que lo divida de forma exacta (generalmente se empieza probando con el 2, luego el 3, 5, etc.).'
  - 'Paso 2: Escribe el cociente obtenido y repite el proceso de división con este nuevo número.'
  - 'Paso 3: Continúa dividiendo hasta que el cociente final sea 1.'
  - 'Paso 4: Expresa el número original como el producto de todos los factores primos utilizados, agrupando los repetidos en forma de potencias.'
errores_correccion: |
  Un error frecuente es dejar factores compuestos en la expresión final (como $4\cdot5$
  en vez de $2^2\cdot5$). Otro error es detener la división antes de llegar a un cociente
  igual a 1.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Descompón el número $18$ en sus factores primos.'
    alternativas:
      - "$2\\cdot3^2$"
      - "$2^2\\cdot3$"
      - "$3\\cdot6$"
    respuesta: "$2\\cdot3^2$"
    solucion_pasos:
      - 'Paso a: Dividimos $18$ por el menor primo posible, que es $2$: $18 \div 2 = 9$.'
      - 'Paso b: Ahora dividimos $9$. No es divisible por $2$, pero sí por el siguiente primo, $3$: $9 \div 3 = 3$.'
      - 'Paso c: Dividimos $3$ por el primo $3$: $3 \div 3 = 1$. Hemos llegado a $1$.'
      - 'Paso d: Multiplicamos los factores: $18 = 2 \cdot 3 \cdot 3 = 2 \cdot 3^2$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Descompón el número $50$ en sus factores primos.'
    alternativas:
      - "$2\\cdot5^2$"
      - "$2^2\\cdot5$"
      - "$5\\cdot10$"
    respuesta: "$2\\cdot5^2$"
    solucion_pasos:
      - 'Paso a: Dividimos $50$ por $2$: $50 \div 2 = 25$.'
      - 'Paso b: $25$ no es divisible por $2$ ni por $3$. Lo dividimos por el primo $5$: $25 \div 5 = 5$.'
      - 'Paso c: Dividimos $5$ por $5$: $5 \div 5 = 1$. Llegamos a $1$.'
      - 'Paso d: La descomposición es: $50 = 2 \cdot 5 \cdot 5 = 2 \cdot 5^2$.'
  - titulo: '¿Es $2^2 \cdot 3^2$ la descomposición prima correcta de $36$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Primero, verifiquemos que los factores sean números primos: $2$ y $3$ son primos.'
      - 'Segundo, calculemos el valor de la expresión: $2^2 \cdot 3^2 = 4 \cdot 9 = 36$.'
      - 'Como todos los factores son primos y el producto es exactamente $36$, la descomposición es correcta.'
  - titulo: '¿Es $2 \cdot 9$ una descomposición en factores primos de $18$?'
    respuesta: 'No'
    solucion_pasos:
      - 'En la expresión $2 \cdot 9$, el número $9$ no es un número primo (ya que $9 = 3^2$, por lo que es un número compuesto).'
      - 'Para ser una descomposición prima, todos los factores sin excepción deben ser números primos.'
      - 'La forma correcta sería $2 \cdot 3^2$.'
errores_frecuentes:
  - 'Dejar factores compuestos en la expresión final (como escribir $4 \cdot 5$ en lugar de $2^2 \cdot 5$).'
  - 'Sumar los factores primos en lugar de multiplicarlos (por ejemplo, escribir $2 + 2 + 3 = 7$ en vez de $2 \cdot 2 \cdot 3 = 12$).'
  - 'Confundir los exponentes con multiplicadores normales (por ejemplo, calcular $2^3$ como $2 \cdot 3 = 6$ en lugar de $2 \cdot 2 \cdot 2 = 8$).'
  - 'No escribir los factores en orden creciente, lo cual no es matemáticamente incorrecto pero dificulta la lectura y comparación.'
  - 'Detener la división antes de llegar a un cociente igual a 1.'
afirmaciones_verdaderas:
  - "La descomposición prima de 24 es $2^3\\cdot3$."
  - "Todos los factores de una descomposición prima deben ser números primos."
al_terminar_debes_poder: |
  Descomponer un número compuesto en sus factores primos, expresándolos en forma de
  potencias.
fuente: 'Teoría de Números'
estado: publicado
