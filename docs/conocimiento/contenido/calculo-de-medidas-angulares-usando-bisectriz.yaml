semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.BISECTRIZ_CALCULO
resumen_inicial: Las medidas angulares e incógnitas algebraicas con bisectrices se
  calculan igualando las dos mitades congruentes o aplicando que el total es el doble
  de cada mitad.
explicacion_simple: '![Cálculo con Bisectriz](/static/img/nodos/calculo-de-medidas-angulares-usando-bisectriz-intro.svg)


  Cuando un problema dice que una línea es una bisectriz, automáticamente sabes que
  los dos lados miden exactamente lo mismo. Puedes escribir una igualdad entre ambas
  partes para encontrar el valor de la incógnita x.'
explicacion_formal: '### Definición formal

  Si el rayo $\vec{OD}$ es la bisectriz del ángulo $\angle AOB$ con medida total $\theta$,
  las medidas de las partes bisecadas satisfacen la relación funcional lineal:


  $$\alpha_1 = \alpha_2 = \frac{\theta}{2} \iff \theta = 2 \alpha_1 = 2 \alpha_2$$


  ### Desglose simbólico y geométrico

  - $\theta$: Medida del ángulo total original.

  - $\alpha_1, \alpha_2$: Medidas de los dos sub-ángulos formados por la bisección.

  - Ecuaciones algebraicas: Permite igualar expresiones del tipo $ax + b = cx + d$
  para hallar variables incógnitas.


  ### Síntesis didáctica

  El cálculo con bisectrices reduce problemas geométricos complejos a simples ecuaciones
  de primer grado gracias a la igualdad de las dos mitades angulares.'
definiciones_clave: '- **Ecuación de bisectriz**: Igualdad $\alpha(x) = \beta(x)$
  entre las dos porciones congruentes.

  - **Cálculo del total**: Multiplicación de la mitad por dos: $\text{Total} = 2\alpha$. '
propiedades_relaciones: '- **Despeje algebraico**: Permite determinar incógnitas en
  polinomios lineales de primer grado.

  - **Ángulos complementarios y suplementarios**: Las bisectrices de dos ángulos de
  un par lineal siempre forman un ángulo recto de $90^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Cálculo con Bisectriz](/static/img/nodos/calculo-de-medidas-angulares-usando-bisectriz-ejemplos.svg)


    En el ángulo $\angle AOB$, $\vec{OP}$ es bisectriz. Si $\angle AOP = 4x - 12^\circ$
    y $\angle POB = 2x + 18^\circ$, encuentra el valor de $x$ y la medida del ángulo
    total $\angle AOB$.'
  pasos:
  - 'Paso 1: Por definición de bisectriz, igualar ambas mitades: $4x - 12^\circ =
    2x + 18^\circ$.'
  - 'Paso 2: Agrupar incógnitas y números: $4x - 2x = 18^\circ + 12^\circ$.'
  - 'Paso 3: Resolver: $2x = 30^\circ \implies x = 15^\circ$.'
  - 'Paso 4: Calcular una mitad: $4(15^\circ) - 12^\circ = 60^\circ - 12^\circ = 48^\circ$.'
  - 'Paso 5: Calcular el total multiplicando por 2: $\angle AOB = 2 \times 48^\circ
    = 96^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si un rayo es bisectriz y divide un ángulo en dos partes expresadas como
    A y B, ¿qué ecuación se debe plantear?
  choices:
  - text: A = B (igualar ambas mitades)
    is_correct: true
  - text: A + B = 180°
    is_correct: false
  - text: A + B = 90°
    is_correct: false
  - text: A × B = 360°
    is_correct: false
  explanation: Por ser bisectriz, ambas mitades son de igual medida, por lo que se
    plantea A = B (igualar ambas mitades).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la bisectriz divide un ángulo en dos partes de (2x + 10°) y 40°, ¿cuánto
    vale x?
  choices:
  - text: x = 15° (porque 2x + 10° = 40° → 2x = 30°)
    is_correct: true
  - text: x = 20°
    is_correct: false
  - text: x = 25°
    is_correct: false
  - text: x = 30°
    is_correct: false
  explanation: Planteando 2x + 10° = 40°, se obtiene 2x = 30°, luego x = 15° (porque
    2x + 10° = 40° → 2x = 30°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las expresiones de las dos mitades generadas por la bisectriz.'
- 'Paso 2: Formular la ecuación igualando ambas expresiones $\alpha_1 = \alpha_2$.'
- 'Paso 3: Despejar la variable incógnita $x$.'
- 'Paso 4: Sustituir para calcular la medida numérica de las mitades y el ángulo total.'
errores_correccion: Asegúrate de igualar las dos mitades entre sí y no sumarlas a
  180° a menos que sea un par lineal.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\vec{OP}$ es bisectriz y las mitades miden $3x$ y $45^\circ$, ¿cuánto
    vale $x$?
  alternativas:
  - $15^\circ$
  - $45^\circ$
  - $30^\circ$
  respuesta: $15^\circ$
  solucion_pasos:
  - $3x = 45^\circ \implies x = 15^\circ$.
- titulo: Ejemplo 2
  enunciado: Si una mitad mide $28^\circ$, ¿cuánto mide el ángulo completo?
  alternativas:
  - $56^\circ$
  - $14^\circ$
  - $90^\circ$
  respuesta: $56^\circ$
  solucion_pasos:
  - $\text{Total} = 2   imes 28^\circ = 56^\circ$.
- titulo: ¿Las bisectrices de dos ángulos adyacentes suplementarios forman un ángulo
    de 90°?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{\alpha}{2} + \frac{\beta}{2} = \frac{\alpha + \beta}{2} = \frac{180^\circ}{2}
    = 90^\circ$.
- titulo: ¿El cálculo de la incógnita cambia si el ángulo es obtuso?
  respuesta: 'No'
  solucion_pasos:
  - No, la propiedad de igualdad de mitades se aplica idénticamente para cualquier
    tipo de ángulo.
errores_frecuentes:
- Igualar la mitad a $180^\circ$ en lugar de igualar las dos mitades entre sí.
- Olvidar duplicar la medida de la mitad al calcular el ángulo total.
- Confundir la incógnita $x$ con la medida final del ángulo en grados.
- Cometer errores algebraicos al despejar signos negativos en las ecuaciones.
- Suponer medidas sin usar la propiedad de la bisectriz.
afirmaciones_verdaderas:
- Al existir una bisectriz, las dos expresiones algebraicas se igualan directamente.
- El ángulo total equivale exactamente al doble de cualquiera de las mitades.
al_terminar_debes_poder: '**QUÉ:** Resolver problemas geométricos y algebraicos aplicando
  ecuaciones con bisectrices.


  **CÓMO:** Igualando las expresiones de las mitades $\alpha(x) = \beta(x)$ y calculando
  las amplitudes resultantes.


  ![Resumen de Cálculo con Bisectriz](/static/img/nodos/calculo-de-medidas-angulares-usando-bisectriz-resumen.svg)'
