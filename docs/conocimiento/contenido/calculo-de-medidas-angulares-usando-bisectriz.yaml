semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.BISECTRIZ_CALCULO
resumen_inicial: La bisectriz es el rayo que divide un ángulo en dos partes exactamente
  iguales, una herramienta central en construcciones de simetría y en el incentro.
explicacion_simple: 'Imagina doblar un pedazo de papel en forma de ángulo por la mitad
  exacta para que los dos bordes calcen perfecto. La línea del doblez es la bisectriz:
  parte el ángulo en dos partes iguales.'
explicacion_formal: 'La **bisectriz** de un ángulo $\angle AOB$ es la semirrecta $\vec{OC}$
  con origen en el vértice $O$ que divide la región interior del ángulo en dos ángulos
  adyacentes congruentes: $m(\angle AOC) = m(\angle COB) = \frac{m(\angle AOB)}{2}$.'
definiciones_clave: '- **Cálculo de medidas angulares usando bisectriz**: Elemento
  o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en cálculo de medidas angulares usando bisectriz se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: La bisectriz de un ángulo de entrada en un canal de ventilación genera
    dos subángulos iguales a $2x + 5^\circ$. Si la abertura total del canal es de
    $70^\circ$, calcula $x$.
  pasos:
  - 'Paso 1: Igualar un subángulo a la mitad del total: $2x + 5 = \frac{70}{2} = 35$.'
  - 'Paso 2: Restar 5 y dividir entre 2: $2x = 30 \implies x = 15^\circ$.'
  - 'Paso 3: Verificar que ambos subángulos miden $35^\circ$, sumando $70^\circ$ en
    total.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de cálculo de medidas angulares
    usando bisectriz?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si cada subángulo generado por la bisectriz mide 35°, ¿cuánto mide el
    ángulo total del canal?
  choices:
  - text: 70°
    is_correct: true
  - text: 35°
    is_correct: false
  - text: 140°
    is_correct: false
  - text: 90°
    is_correct: false
  explanation: La alternativa correcta es '70°', calculada como $2 \cdot 35^\circ
    = 70^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en cálculo de medidas angulares usando bisectriz.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en cálculo de medidas
  angulares usando bisectriz sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 72^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 108°
  - 72°
  - 90°
  respuesta: 108°
  solucion_pasos:
  - Despejando $x = 180 - 72 = 108^\circ$.
- titulo: Ejemplo 2
  enunciado: En cálculo de medidas angulares usando bisectriz, si dos ángulos son
    suplementarios y uno mide 72°, ¿cuánto mide el otro?
  alternativas:
  - 108°
  - 18°
  - 360°
  respuesta: 108°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 72 = 108^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en cálculo de medidas
    angulares usando bisectriz?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en cálculo de medidas angulares usando
    bisectriz es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de cálculo de medidas angulares usando bisectriz.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
