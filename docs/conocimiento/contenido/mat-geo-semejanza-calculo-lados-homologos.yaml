semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.CALCULO_LADOS_HOMOLOGOS
resumen_inicial: 'Cálculo de lados homólogos usando semejanza de triángulos: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Con la semejanza de triángulos ya establecida (por cualquiera
  de sus criterios), el siguiente paso práctico es calcular longitudes desconocidas
  de lados homólogos.
explicacion_formal: '![Cálculo de lados homólogos por semejanza](/static/img/geometria/congruencia-semejanza/semejanza-calculo-lados-homologos.svg)


  ### Definición formal


  Si $\triangle ABC\sim\triangle A''B''C''$ con razón de semejanza $k=\frac{A''B''}{AB}$,
  entonces cualquier lado desconocido $X''$ correspondiente a $X$ se calcula como
  $X''=k\times X$.


  ### Desarrollo didáctico


  Dado un triángulo con lados 6, 8, 10 semejante a otro con un lado conocido de 15
  (correspondiente al lado 10), la razón es $k=\frac{15}{10}=1,5$, y los otros dos
  lados desconocidos son $6\times1,5=9$ y $8\times1,5=12$.'
