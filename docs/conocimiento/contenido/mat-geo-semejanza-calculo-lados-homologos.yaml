ejemplo_guiado:
  enunciado: Para analizar cálculo de lados homólogos usando semejanza de triángulos,
    considera un ángulo $\alpha = 129^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1274^\circ = 129^\circ$.
  pasos:
  - Identificar la propiedad de cálculo de lados homólogos usando semejanza de triángulos
    referida a $\alpha = 129^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1274 = 129 \implies x = 129 - 1274$.'
  - Concluir que la medida calculada para cálculo de lados homólogos usando semejanza
    de triángulos es $x = -1145^\circ$.
