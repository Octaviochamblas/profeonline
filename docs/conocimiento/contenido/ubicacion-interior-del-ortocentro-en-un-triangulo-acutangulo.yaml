semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_ACUTANGULO
resumen_inicial: En todo triángulo acutángulo (donde sus tres ángulos interiores miden
  menos de $90^\circ$), las tres alturas caen completamente dentro de la figura, lo
  que sitúa al ortocentro ($H$) estrictamente en el interior del triángulo.
explicacion_simple: '![Ortocentro en Acutángulo](/static/img/nodos/ubicacion-interior-del-ortocentro-en-un-triangulo-acutangulo-intro.svg)


  Cuando un triángulo tiene todos sus ángulos agudos (menores a $90^\circ$, como en
  un triángulo equilátero o acutángulo cualquiera):


  - **Alturas por dentro**: Las tres alturas se dibujan completamente por dentro de
  la figura.

  - **Ortocentro interior**: El punto de cruce $H$ queda encerrado en el **interior**
  del triángulo.

  - **División simétrica**: Desde $H$ se pueden trazar líneas hacia los 3 vértices
  dividiendo la superficie en 3 triángulos interiores.

  '
explicacion_formal: '### Teorema formal

  En todo triángulo acutángulo $\Delta ABC$, las tres alturas intersectan a los lados
  en puntos interiores de los segmentos, y el ortocentro $H$ se ubica estrictamente
  en el **interior** del triángulo:


  $$\max(\alpha, \beta, \gamma) < 90^\circ \implies H \in \operatorname{Int}(\Delta
  ABC)$$


  ### Desglose simbólico y geométrico

  - Los tres pies de las alturas $H_a, H_b, H_c$ están dentro de los segmentos $\overline{BC},
  \overline{AC}, \overline{AB}$.

  - Triángulo órtico $\Delta H_a H_b H_c$: Se forma en el interior y su incentro coincide
  exactamente con el ortocentro $H$.


  ### Síntesis didáctica

  En los triángulos acutángulos, las tres alturas se cruzan internamente antes de
  tocar los lados, confinando al ortocentro dentro de la superficie del polígono.'
definiciones_clave: '- **Triángulo acutángulo**: Triángulo cuyos tres ángulos interiores
  son estrictamente agudos ($< 90^\circ$).

  - **Ortocentro interior**: Propiedad por la cual el punto $H$ pertenece a la región
  interior del triángulo.

  - **Alturas interiores**: Segmentos de altura que no requieren prolongar los lados
  para intersectarlos.

  '
propiedades_relaciones: '- **Pertenencia interior**: $\alpha, \beta, \gamma < 90^\circ
  \iff H \in \text{Int}(\Delta ABC)$.

  - **Suma de áreas interiores**: $\text{Área}(\Delta ABC) = \text{Área}(\Delta HBC)
  + \text{Área}(\Delta HAC) + \text{Área}(\Delta HAB)$.

  - **Caso particular equilátero**: Si $\alpha = \beta = \gamma = 60^\circ$, el ortocentro
  $H$ coincide con el baricentro $G$, el incentro $I$ y el circuncentro $O$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ortocentro en Acutángulo](/static/img/nodos/ubicacion-interior-del-ortocentro-en-un-triangulo-acutangulo-ejemplos.svg)


    Un triángulo tiene ángulos interiores que miden $50^\circ$, $60^\circ$ y $70^\circ$.
    Determina el tipo de triángulo según sus ángulos y deduce la posición del ortocentro
    $H$ respecto al triángulo.

    '
  pasos:
  - 'Paso 1: Evaluar los ángulos dados: $50^\circ < 90^\circ$, $60^\circ < 90^\circ$
    y $70^\circ < 90^\circ$.'
  - 'Paso 2: Clasificar el triángulo: al tener sus tres ángulos menores que $90^\circ$,
    es un triángulo acutángulo.'
  - 'Paso 3: Analizar el trazado de las alturas: en un triángulo acutángulo, las tres
    alturas caen dentro de los lados opuestos.'
  - 'Paso 4: Aplicar el teorema de posición: el punto de concurrencia $H$ se ubica
    en el interior del triángulo.'
  - 'Paso 5: Concluir que el ortocentro $H$ está ubicado estrictamente en el interior
    del triángulo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica el ortocentro en un triángulo cuyos ángulos interiores
    miden 40°, 60° y 80°?
  choices:
  - text: En el interior del triángulo, porque es un triángulo acutángulo
    is_correct: true
  - text: En el exterior del triángulo
    is_correct: false
  - text: En el vértice del ángulo mayor
    is_correct: false
  - text: En el punto medio del lado más largo
    is_correct: false
  explanation: El ortocentro se ubica en el interior del triángulo, porque es un triángulo
    acutángulo al tener sus tres ángulos menores a $90^\circ$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el ortocentro de un triángulo se ubica en su región interior, ¿qué
    se puede asegurar con certeza sobre sus ángulos?
  choices:
  - text: Que los tres ángulos interiores son estrictamente agudos (menores a 90°)
    is_correct: true
  - text: Que tiene un ángulo recto
    is_correct: false
  - text: Que tiene un ángulo obtuso
    is_correct: false
  - text: Que sus tres ángulos son exactamente iguales a 60°
    is_correct: false
  explanation: Se asegura con certeza que los tres ángulos interiores son estrictamente
    agudos (menores a 90°), condición necesaria y suficiente para que $H$ sea interior.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o calcular los tres ángulos interiores del triángulo.'
- 'Paso 2: Verificar que cada uno de los tres ángulos sea estrictamente menor que
  $90^\circ$.'
- 'Paso 3: Trazar las tres alturas verificando que sus pies queden contenidos dentro
  de cada lado.'
- 'Paso 4: Marcar el ortocentro $H$ en el punto de intersección interior.'
errores_correccion: 'No asumas que el ortocentro es interior si no has verificado
  que los tres ángulos sean agudos: basta un ángulo de 90° o mayor para que el ortocentro
  cambie de posición.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo acutángulo con ángulos $45^\circ$, $65^\circ$ y $70^\circ$,
    ¿cuántas alturas caen dentro de la figura?
  alternativas:
  - $3\text{ alturas}$
  - $2\text{ alturas}$
  - $1\text{ altura}$
  respuesta: $3\text{ alturas}$
  solucion_pasos:
  - En todo triángulo acutángulo, las 3 alturas caen íntegramente en el interior.
- titulo: Ejemplo 2
  enunciado: En un triángulo equilátero de lado $12\text{ cm}$, ¿a qué distancia de
    la base se ubica el ortocentro $H$?
  alternativas:
  - $2\sqrt{3}\text{ cm}$ (un tercio de la altura total)
  - $6\sqrt{3}\text{ cm}$
  - $4\text{ cm}$
  respuesta: $2\sqrt{3}\text{ cm}$ (un tercio de la altura total)
  solucion_pasos:
  - La altura total es $h = \frac{12\sqrt{3}}{2} = 6\sqrt{3}\text{ cm}$.
  - Como $H$ coincide con el baricentro $G$, se ubica a $\frac{1}{3}h = \frac{6\sqrt{3}}{3}
    = 2\sqrt{3}\text{ cm}$ de la base.
- titulo: ¿El ortocentro de un triángulo acutángulo puede quedar sobre uno de sus
    lados?
  respuesta: 'No'
  solucion_pasos:
  - No, solo queda sobre un lado (en el vértice recto) en los triángulos rectángulos.
- titulo: ¿En el triángulo equilátero el ortocentro coincide con el baricentro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la simetría total del triángulo equilátero, los cuatro puntos notables
    coinciden en el mismo punto interior.
errores_frecuentes:
- Creer que el ortocentro siempre es el punto medio geométrico del triángulo.
- No comprobar los tres ángulos antes de clasificar el triángulo como acutángulo.
- Confundir el ortocentro interior con el circuncentro.
- Olvidar que en triángulos acutángulos las tres alturas son interiores.
- Asumir que si dos ángulos son agudos el tercero también lo es (la suma debe dar
  180°).
afirmaciones_verdaderas:
- El ortocentro de un triángulo se ubica en su interior si y solo si el triángulo
  es acutángulo.
- En un triángulo acutángulo las tres alturas cortan a los lados dentro de sus extremos.
al_terminar_debes_poder: '**QUÉ:** Caracterizar y justificar la ubicación interior
  del ortocentro en triángulos acutángulos.


  **CÓMO:** Verificando que los tres ángulos interiores sean agudos ($< 90^\circ$)
  y trazando las alturas interiores concurrentes.


  ![Resumen de Ortocentro Acutángulo](/static/img/nodos/ubicacion-interior-del-ortocentro-en-un-triangulo-acutangulo-resumen.svg)

  '
