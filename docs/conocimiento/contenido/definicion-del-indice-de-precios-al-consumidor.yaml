  QUÉ: Definir el IPC y calcular la tasa de inflación y el reajuste de valores monetarios nominales.
  CÓMO: Evaluar la variación relativa $\pi = \frac{\text{IPC}_t - \text{IPC}_{t-1}}{\text{IPC}_{t-1}} \cdot 100\%$ y aplicar el factor de indexación $(1 + \pi / 100)$ a sueldos, deudas o contratos en UF.
