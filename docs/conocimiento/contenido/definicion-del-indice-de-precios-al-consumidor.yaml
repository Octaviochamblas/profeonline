procedimiento:
- 'Paso 1: Identifica si el IPC del período fue positivo (inflación) o negativo (deflación).'
- 'Paso 2: Si el IPC es positivo, los precios subieron.'
- 'Paso 3: Si tu sueldo se mantuvo igual, tu capacidad de compra (poder adquisitivo)
  bajó en esa misma proporción.'
errores_correccion: Evita confundir los datos de entrada al operar con definición
  del índice de precios al consumidor.
ejemplos:
- titulo: Aumento de precios y sueldo congelado
  enunciado: Si el IPC del año fue de un 5% y tu sueldo no subió nada en todo el año,
    ¿eres más rico o más pobre?
  solucion_pasos:
  - Los productos son un 5% más caros.
  - Tu sueldo es el mismo en billetes, pero ahora compra menos cosas.
  - Por lo tanto, eres un 5% más 'pobre' en poder adquisitivo.
errores_frecuentes:
- Creer que si la inflación baja, los precios bajan (Falso. Si la inflación baja de
  8% a 4%, los precios SIGUEN SUBIENDO, pero más lento. Para que los precios bajen
  debe haber IPC negativo o Deflación).
- Pensar que el IPC mide solo el precio del pan y la bencina (Mide una canasta de
  cientos de productos).
afirmaciones_verdaderas:
- La propiedad de definición del índice de precios al consumidor preserva la consistencia
  lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren definición del
  índice de precios al consumidor.
