semantic_id: MAT.NUM.FINANZAS_PERSONALES.IPC_DEFINICION
resumen_inicial: 'Definición del Índice de Precios al Consumidor: concepto y propiedades
  fundamentales en Finanzas personales.'
explicacion_simple: Hace 10 años, con $10.000 llenabas el carro del supermercado.
  Hoy, con suerte compras un par de cosas. El dinero pierde valor invisiblemente.
  El culpable (o el termómetro de esto) es la inflación, medida a través del IPC.
explicacion_formal: 'El **Índice de Precios al Consumidor (IPC)** es el indicador
  oficial que mide la **inflación**.

  - El Instituto Nacional de Estadísticas (INE) arma una ''Canasta Básica'' representativa
  de lo que consume una familia chilena promedio (pan, transporte, vivienda, salud,
  educación).

  - Cada mes miden si esa misma canasta cuesta más o menos que el mes anterior.

  - **IPC Positivo (+0.4%):** Hubo inflación. El costo de vida subió.

  - **Poder Adquisitivo:** Si hay inflación, pero tu sueldo no sube, tu ''poder adquisitivo''
  (lo que puedes comprar con tu sueldo) disminuye.


  Por eso, la UF (Unidad de Fomento) se reajusta diariamente según la variación mensual
  del IPC. Los créditos, arriendos y planes de salud suelen estar en UF para proteger
  a los vendedores de la inflación.'
definiciones_clave: '- **Definición del Índice de Precios al Consumidor**: Elemento
  central dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a definición del índice de precios al consumidor.'
