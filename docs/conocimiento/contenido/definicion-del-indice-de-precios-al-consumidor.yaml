resumen_inicial: El Índice de Precios al Consumidor (IPC) es un indicador económico
  mensual elaborado por el INE que mide la variación porcentual promedio de los precios
  de una canasta representativa de bienes y servicios en Chile.
explicacion_simple: El IPC mide la inflación en Chile, es decir, qué tanto han subido
  o bajado los precios promedio de las cosas que consumen las familias. Si el IPC
  sube un 0,5% en un mes, significa que la canasta básica de productos se encareció
  en esa misma proporción.
explicacion_formal: 'El **Índice de Precios al Consumidor (IPC)** cuantifica la variación
  del costo de la canasta habitual mediante la fórmula de ponderación de Laspeyres:


  $$\text{Inflación Mensual } (\%) = \left( \frac{\text{IPC}_t - \text{IPC}_{t-1}}{\text{IPC}_{t-1}}
  \right) \cdot 100\%$$


  **Efecto sobre el poder adquisitivo:**

  - Un IPC positivo (inflación) reduce el valor real del dinero no ajustado.'
definiciones_clave: '- **IPC**: Indicador ponderado del INE que mide la variación
  porcentual de precios de la canasta familiar.'
propiedades_relaciones: '- **Medida de la inflación**: Variación porcentual $\Delta\%_{\text{IPC}}$
  del costo de la canasta.'
ejemplo_guiado:
  enunciado: Si el IPC pasó de $110$ puntos a $112,2$ puntos en un mes, calcule la
    inflación mensual.
  pasos:
  - 'Paso 1: Restar los puntos de IPC: $112,2 - 110 = 2,2$.'
  - 'Paso 2: Dividir entre el IPC inicial: $\frac{2,2}{110} = 0,02$.'
  - 'Paso 3: Convertir a porcentaje: $0,02 \cdot 100\% = 2\%$.'
  - 'Conclusión: La inflación mensual fue del $2\%$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué mide principalmente el Índice de Precios al Consumidor (IPC) elaborado
    por el INE?
  choices:
  - text: La variación porcentual promedio del costo de una canasta representativa
      de bienes y servicios
    is_correct: true
  - text: El valor del dólar en el mercado internacional
    is_correct: false
  - text: La tasa de desempleo nacional
    is_correct: false
  - text: El total de créditos otorgados por los bancos
    is_correct: false
  explanation: La alternativa correcta es 'La variación porcentual promedio del costo
    de una canasta representativa de bienes y servicios'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado donde el IPC subió de 110 a 112,2 puntos, ¿cuál fue
    la inflación mensual?
  choices:
  - text: 2%
    is_correct: true
  - text: 2,2%
    is_correct: false
  - text: 1,2%
    is_correct: false
  - text: 10%
    is_correct: false
  explanation: La alternativa correcta es '2%'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir el IPC y calcular la tasa
  de inflación mensual mediante la variación porcentual de su indicador.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.IPC_DEFINICION
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.IPC_DEFINICION.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
