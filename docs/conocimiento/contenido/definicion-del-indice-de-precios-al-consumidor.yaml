  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica si el IPC del período fue positivo (inflación) o negativo (deflación).'
- 'Paso 2: Si el IPC es positivo, los precios subieron.'
- 'Paso 3: Si tu sueldo se mantuvo igual, tu capacidad de compra (poder adquisitivo) bajó
  en esa misma proporción.'
errores_correccion: Evita confundir los datos de entrada al operar con definición del índice
  de precios al consumidor.
ejemplos:
- titulo: Aumento de precios y sueldo congelado
  enunciado: Si el IPC del año fue de un 5% y tu sueldo no subió nada en todo el año, ¿eres
    más rico o más pobre?
  solucion_pasos:
  - Los productos son un 5% más caros.
  - Tu sueldo es el mismo en billetes, pero ahora compra menos cosas.
  - Por lo tanto, eres un 5% más 'pobre' en poder adquisitivo.
- titulo: Ejemplo 2
  enunciado: Si el IPC anual es de 3% y tu sueldo sube un 3% ese mismo año, ¿tu poder adquisitivo
    cambia?
  alternativas:
  - No cambia
  - Aumenta
  - Disminuye
  respuesta: No cambia
  solucion_pasos:
  - El aumento del sueldo compensa exactamente la inflación.
- titulo: Ejemplo 3
  enunciado: ¿Qué institución calcula el IPC en Chile?
  alternativas:
  - El Instituto Nacional de Estadísticas (INE)
  - El Banco Central únicamente
  - Cada supermercado por separado
  respuesta: El Instituto Nacional de Estadísticas (INE)
  solucion_pasos:
  - El INE es el organismo oficial que mide el IPC.
- titulo: ¿Un IPC negativo indica que los precios en promedio bajaron, es decir hubo deflación?
  respuesta: Sí
  solucion_pasos:
  - Un IPC negativo corresponde a una deflación.
errores_frecuentes:
- Creer que si la inflación baja, los precios bajan (Falso. Si la inflación baja de 8% a 4%,
  los precios SIGUEN SUBIENDO, pero más lento. Para que los precios bajen debe haber IPC negativo
  o Deflación).
- Pensar que el IPC mide solo el precio del pan y la bencina (Mide una canasta de cientos
  de productos).
- Creer que si la inflación baja, los precios bajan, cuando en realidad los precios siguen
  subiendo, solo que más lento, mientras el IPC sea positivo.
- Pensar que el IPC mide solo el precio del pan y la bencina, cuando en realidad mide una
  canasta de cientos de productos.
- Confundir el IPC con la tasa de interés que ofrece un banco.
afirmaciones_verdaderas:
- La propiedad de definición del índice de precios al consumidor preserva la consistencia
  lógica.
- El IPC mide la variación de precios de una canasta representativa de cientos de productos,
  no solo de uno o dos artículos.
al_terminar_debes_poder: Resolver problemas aplicados que involucren definición del índice
  de precios al consumidor.
fuente: Currículum Nacional MINEDUC.
