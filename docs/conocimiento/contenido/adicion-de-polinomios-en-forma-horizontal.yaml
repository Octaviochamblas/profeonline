semantic_id: MAT.ALG.ADICION_POL.METODO_HORIZONTAL
resumen_inicial: 'La adición de polinomios en forma horizontal consiste en disponer las expresiones consecutivas unidas por signos más, suprimir paréntesis conservando los signos y reducir los términos semejantes.'
explicacion_simple: |
  Para sumar dos o más polinomios en **forma horizontal**:
  - **Paso 1: Escribir la suma** de los polinomios encerrados entre paréntesis y separados por signos $+$.
    - Ej: $(3x^2 + 5x - 2) + (2x^2 - 4x + 7)$.
  - **Paso 2: Suprimir los paréntesis** respetando que el signo $+$ antecedente mantiene intactos todos los signos de adentro.
    - Queda: $3x^2 + 5x - 2 + 2x^2 - 4x + 7$.
  - **Paso 3: Agrupar y reducir los términos semejantes** por clases de potencia:
    - Clase $x^2$: $3x^2 + 2x^2 = \mathbf{5x^2}$.
    - Clase $x$: $5x - 4x = \mathbf{+x}$.
    - Constantes: $-2 + 7 = \mathbf{+5}$.
  - **Resultado final**: **$5x^2 + x + 5$**.
explicacion_formal: |
  ### Definición formal
  Sean $P(x) = \sum_{i=0}^n a_i x^i$ y $Q(x) = \sum_{i=0}^m b_i x^i$ dos polinomios en $\mathbb{R}[x]$ de grados $n$ y $m$ respectivamente. La **adición polinómica horizontal** es el operador suma $P + Q: \mathbb{R}[x] \times \mathbb{R}[x] \to \mathbb{R}[x]$ que aplica la propiedad conmutativa y asociativa aditiva sobre los coeficientes correspondientes:

  $$(P + Q)(x) = \sum_{i=0}^{\max(n,m)} (a_i + b_i) x^i$$

  donde los coeficientes inexistentes se asumen nulos ($a_k = 0$ para $k > n$, $b_k = 0$ para $k > m$).

  ### Grado de la Suma Polinómica
  El grado de la suma de dos polinomios no nulos satisface la desigualdad de cota superior:

  $$\deg(P + Q) \le \max\big( \deg(P), \deg(Q) \big)$$

  ### Síntesis didáctica
  La disposición horizontal es el método estándar en álgebra lineal para sumar funciones polinómicas en una sola línea continua.
definiciones_clave: |
  - **Adición horizontal**: Método de suma continua donde los polinomios se escriben en línea y se reducen término a término.
  - **Operador suma de coeficientes ($(a_i + b_i)$)**: Consolidación aditiva de las constantes asociadas a la misma potencia $x^i$.
  - **Cota de grado ($\max(\deg(P), \deg(Q))$)**: Límite máximo del grado del polinomio resultante tras la suma.
propiedades_relaciones: |
  - **Conmutatividad de la suma polinómica**: $P(x) + Q(x) = Q(x) + P(x)$.
  - **Elemento neutro ($0$)**: $P(x) + 0 = P(x)$.
ejemplo_guiado:
  enunciado: 'Suma horizontalmente los polinomios $P(x) = 4x^3 - 2x^2 + 6$ y $Q(x) = x^3 + 5x^2 - 3x - 4$.'
  pasos:
    - 'Paso 1: Escribimos la adición continua entre paréntesis: $(4x^3 - 2x^2 + 6) + (x^3 + 5x^2 - 3x - 4)$.'
    - 'Paso 2: Suprimimos los paréntesis conservando los signos: $4x^3 - 2x^2 + 6 + x^3 + 5x^2 - 3x - 4$.'
    - 'Paso 3: Reducimos la Clase $x^3$: $4x^3 + 1x^3 = \mathbf{5x^3}$.'
    - 'Paso 4: Reducimos la Clase $x^2$: $-2x^2 + 5x^2 = \mathbf{+3x^2}$.'
    - 'Paso 5: Copiamos la Clase $x$: $\mathbf{-3x}$.'
    - 'Paso 6: Reducimos las Constantes: $+6 - 4 = \mathbf{+2}$.'
    - 'Conclusión: El polinomio suma es **$5x^3 + 3x^2 - 3x + 2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad matemática del cuerpo real $\mathbb{R}$ permite reagrupar libremente los términos semejantes al sumar dos polinomios en forma horizontal?'
    choices:
      - {text: 'Las propiedades asociativa y conmutativa de la adición', is_correct: true}
      - {text: 'La propiedad distributiva de la división', is_correct: false}
      - {text: 'La regla de los exponentes de la multiplicación', is_correct: false}
      - {text: 'La existencia del número pi', is_correct: false}
    explanation: 'La alternativa correcta es ''Las propiedades asociativa y conmutativa de la adición''. Asociatividad y conmutatividad aditiva.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de sumar horizontalmente $(5x - 3) + (2x + 7)$?'
    choices:
      - {text: 'El resultado es $7x + 4$, sumando $5x + 2x = 7x$ y $-3 + 7 = 4$', is_correct: true}
      - {text: 'El resultado es $10x - 21$', is_correct: false}
      - {text: 'El resultado es $7x - 4$', is_correct: false}
      - {text: 'El resultado es $3x + 10$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $7x + 4$, sumando $5x + 2x = 7x$ y $-3 + 7 = 4$''. Suma $5x+2x=7x$ y $-3+7=4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir cada polinomio dentro de paréntesis unidos por el signo más ($+$).'
  - 'Paso 2: Eliminar los paréntesis manteniendo intactos todos los signos de los coeficientes.'
  - 'Paso 3: Marcar o reagrupar contiguamente los monomios que compartan el mismo grado o factor literal.'
  - 'Paso 4: Sumar los coeficientes de cada clase de potencia y presentar el polinomio resultante ordenado.'
errores_correccion: |
  - **Error 1:** Multiplicar los polinomios en lugar de sumarlos (escribir $(x+2)+(x+3) = x^2 + 5x + 6$). **Cómo corregirlo:** Al sumar **SE OPERAN COEFICIENTES EN ADICIÓN ($x + x = 2x \implies 2x + 5$)**.
  - **Error 2:** Alterar los exponentes al sumar términos de igual grado (escribir $3x^2 + 4x^2 = 7x^4$). **Cómo corregirlo:** La adición **MANTIENE EL EXPONENTE INTRACTO ($3x^2 + 4x^2 = 7x^2$)**.
ejemplos:
  - titulo: 'Suma horizontal simple'
    enunciado: '¿Cuál es la suma de $(4a + 2b) + (3a - b)$?'
    alternativas:
      - '$7a + b$'
      - '$7a - b$'
      - '$12a - 2b$'
    respuesta: '$7a + b$'
    solucion_pasos:
      - '1. Supresión: $4a + 2b + 3a - b$.'
      - '2. Reducción: $7a + b$.'
  - titulo: 'Suma de cuadráticos'
    enunciado: '¿Cuál es la suma de $(x^2 - 5) + (2x^2 + 9)$?'
    alternativas:
      - '$3x^2 + 4$'
      - '$3x^4 + 4$'
      - '$2x^2 + 4$'
    respuesta: '$3x^2 + 4$'
    solucion_pasos:
      - '1. Supresión: $x^2 - 5 + 2x^2 + 9$.'
      - '2. Reducción: $3x^2 + 4$.'
  - titulo: 'Cota de grado'
    enunciado: 'Si se suman dos polinomios de grado 2, ¿puede la suma tener grado 2 o inferior?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el grado de la suma es menor o igual al máximo de los grados.'
  - titulo: 'Preservación de signos positivos'
    enunciado: 'En la suma horizontal $P(x) + Q(x)$, ¿salen los términos de $Q(x)$ con sus mismos signos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el signo $+1$ antecedente preserva todos los signos.'
errores_frecuentes:
  - 'Multiplicar los polinomios o sus términos en lugar de ejecutar la suma aditiva.'
  - 'Sumar los exponentes de las potencias al reducir monomios del mismo grado.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Cambiar erróneamente los signos del segundo polinomio al suprimir el paréntesis de suma.'
  - 'Los términos independientes o constantes son excluidos en el polinomio final.'
afirmaciones_verdaderas:
  - 'La adición de polinomios en forma horizontal se realiza uniendo los términos y reduciendo los monomios semejantes.'
  - 'El grado de la suma de dos polinomios jamás supera el grado máximo de los polinomios sumandos.'
