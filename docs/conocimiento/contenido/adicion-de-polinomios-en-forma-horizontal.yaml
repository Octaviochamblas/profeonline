semantic_id: MAT.ALG.ADICION_POL.METODO_HORIZONTAL
resumen_inicial: 'Adición de polinomios en forma horizontal: procedimiento y reglas
  en Adición de polinomios.'
explicacion_simple: La suma de polinomios es, en esencia, la extensión de la reducción
  de términos semejantes. El método horizontal permite hacerlo todo en una misma línea,
  que es la forma más natural cuando los polinomios son sencillos.
explicacion_formal: '### Definición formal


  En la adición, los paréntesis precedidos de $+$ se eliminan sin alterar los signos.


  ### Desarrollo didáctico


  Suma: $(3x^2 + 2x - 1) + (x^2 - 4x + 5)$.


  Paso 1: Eliminamos paréntesis (precedidos de $+$, sin cambio de signos):

  $3x^2 + 2x - 1 + x^2 - 4x + 5$.


  Paso 2: Agrupamos por familias:

  - Familia $x^2$: $3x^2 + x^2 = 4x^2$.

  - Familia $x$: $2x - 4x = -2x$.

  - Constantes: $-1 + 5 = 4$.


  Resultado: $4x^2 - 2x + 4$.'
definiciones_clave: '- **Adición de polinomios en forma horizontal**: Operación o
  propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a adición de polinomios en forma horizontal.'
ejemplo_guiado:
  enunciado: Aplica adición de polinomios en forma horizontal en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de adición de polinomios en
    forma horizontal.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
checkpoints:
