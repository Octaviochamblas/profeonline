resumen_inicial: La adición de polinomios en forma horizontal se efectúa escribiendo
  los polinomios en línea continua entre paréntesis, suprimiendo los signos de agrupación
  y reduciendo los términos semejantes.
explicacion_simple: Para sumar dos polinomios de manera horizontal, colocamos uno
  al lado del otro separados por un signo $+$. Luego quitamos los paréntesis (que
  no cambian ningún signo porque hay un $+$ adelante) y sumamos los términos que tengan
  las mismas letras.
explicacion_formal: 'Sean $P(x) = \sum_{k=0}^n a_k x^k$ y $Q(x) = \sum_{k=0}^m b_k
  x^k$. La **Adición Horizontal** define el polinomio suma $(P + Q)(x)$ como:


  $$(P + Q)(x) = P(x) + Q(x) = \sum_{k=0}^{\max(n,m)} (a_k + b_k) x^k$$


  > **Complemento didáctico:** La adición horizontal preserva la continuidad lineal
  de la expresión algebraica apoyándose en la conmutatividad aditiva.'
definiciones_clave: '- **Adición de polinomios**: Operación binaria que asigna a dos
  polinomios $P$ y $Q$ un nuevo polinomio suma $P+Q$.

  - **Método horizontal**: Disposición lineal continua de los sumandos.'
propiedades_relaciones: '- **Conmutatividad**: $P + Q = Q + P$.

  - **Grado de la suma**: $\text{gr}(P + Q) \le \max(\text{gr}(P), \text{gr}(Q))$.'
ejemplo_guiado:
  enunciado: Sume en forma horizontal los polinomios $P(x) = 3x^2 - 5x + 7$ y $Q(x)
    = 2x^2 + 8x - 4$.
  pasos:
  - 'Paso 1: Escribir la adición horizontal en línea: $(3x^2 - 5x + 7) + (2x^2 + 8x
    - 4)$.'
  - 'Paso 2: Suprimir paréntesis manteniendo todos los signos: $3x^2 - 5x + 7 + 2x^2
    + 8x - 4$.'
  - 'Paso 3: Agrupar términos semejantes de grado 2: $(3 + 2)x^2 = 5x^2$.'
  - 'Paso 4: Agrupar términos semejantes de grado 1: $(-5 + 8)x = 3x$.'
  - 'Paso 5: Agrupar términos independientes: $7 - 4 = 3$.'
  - 'Conclusión: El polinomio suma resultante es $5x^2 + 3x + 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste el método horizontal para la adición de polinomios?
  choices:
  - text: En disponer los polinomios en una línea continua, suprimir paréntesis y
      reducir los términos semejantes
    is_correct: true
  - text: En multiplicar todos los coeficientes del primer polinomio por el segundo
    is_correct: false
  - text: En restar los términos de menor grado obligatoriamente
    is_correct: false
  - text: En elevar al cuadrado cada sumando
    is_correct: false
  explanation: La alternativa correcta es 'En disponer los polinomios en una línea
    continua, suprimir paréntesis y reducir los términos semejantes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (3x^2 - 5x + 7) + (2x^2 + 8x - 4), ¿cuál fue
    el resultado obtenido?
  choices:
  - text: 5x^2 + 3x + 3
    is_correct: true
  - text: 5x^2 - 13x + 11
    is_correct: false
  - text: 6x^4 - 40x^2 - 28
    is_correct: false
  - text: x^2 + 3x + 3
    is_correct: false
  explanation: La alternativa correcta es '5x^2 + 3x + 3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los polinomios entre paréntesis unidos por el signo $+$.'
- 'Paso 2: Eliminar los paréntesis sin alterar ningún signo de los términos.'
- 'Paso 3: Agrupar los coeficientes de las partes literales idénticas y operar la
  suma.'
errores_correccion: '- **Error 1: Multiplicar las variables entre sí al sumar polinomios
  (decir $3x^2 + 2x^2 = 5x^4$).** **Cómo corregirlo:** Al sumar polinomios sólo se
  suman los coeficientes numéricos; la variable $x^2$ no cambia su exponente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule la suma de (4a - 3b) + (2a + 7b) en forma horizontal.
  alternativas:
  - 6a + 4b
  - 6a - 4b
  - 2a + 10b
  - 6a + 10b
  respuesta: 6a + 4b
  solucion_pasos:
  - 1. 4a + 2a = 6a.
  - 2. -3b + 7b = 4b.
  - '3. Resultado: 6a + 4b.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de sumar P(y) = y^3 - 4y + 2 y Q(y) = 2y^3 + y
    - 5?
  alternativas:
  - 3y^3 - 3y - 3
  - 3y^3 + 5y - 7
  - 3y^6 - 3y^2 - 3
  - y^3 - 3y - 3
  respuesta: 3y^3 - 3y - 3
  solucion_pasos:
  - '1. Grado 3: 1 + 2 = 3y^3.'
  - '2. Grado 1: -4 + 1 = -3y.'
  - '3. Constantes: 2 - 5 = -3. Resultado: 3y^3 - 3y - 3.'
- titulo: ¿Es la adición de polinomios una operación conmutativa (P + Q = Q + P)?
  respuesta: Sí
  solucion_pasos:
  - Sí, el orden de los polinomios no altera el polinomio suma resultante.
- titulo: ¿Cambian los signos del segundo polinomio al colocar un signo + de adición
    entre paréntesis?
  respuesta: 'No'
  solucion_pasos:
  - No, el signo + de adición mantiene inalterada la polaridad de los términos del
    segundo polinomio.
errores_frecuentes:
- Sumar o multiplicar los exponentes de las variables al reducir los términos semejantes
  de los polinomios.
- Cambiar el signo de los términos del segundo polinomio como si fuera una resta.
- Sumar coeficientes de términos que no tienen la misma parte literal.
- Omitir el signo $+$ entre las dos expresiones al plantear la adición horizontal.
- Declarar que el grado de la suma siempre aumenta respecto al grado de los sumandos.
afirmaciones_verdaderas:
- La adición horizontal exige agrupar y reducir términos con la misma parte literal.
- El grado del polinomio suma es menor o igual al máximo grado entre los polinomios
  sumados.
al_terminar_debes_poder: Al terminar serás capaz de efectuar la adición de polinomios
  en forma horizontal agrupando y reduciendo sus términos semejantes de manera continua.
