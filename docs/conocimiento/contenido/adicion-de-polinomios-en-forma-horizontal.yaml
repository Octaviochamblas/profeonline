  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribe los polinomios en una línea, conectados por el signo $+$.'
- 'Paso 2: Elimina los paréntesis (en suma, los signos no cambian).'
- 'Paso 3: Agrupa visualmente los términos semejantes (por familias).'
- 'Paso 4: Reduce cada familia y escribe el polinomio resultado.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en adición de polinomios en forma horizontal.
ejemplos:
- titulo: Suma horizontal directa
  enunciado: 'Suma: (5a - 3) + (2a + 7).'
  solucion_pasos:
  - 'Eliminamos paréntesis: 5a - 3 + 2a + 7.'
  - 'Familia a: 5a + 2a = 7a.'
  - 'Constantes: -3 + 7 = 4.'
  - 'Resultado: 7a + 4.'
- titulo: La ganancia del primer trimestre de una empresa es $G_1 = 5000k - 200$,
    y del segundo trimes
  enunciado: 'La ganancia del primer trimestre de una empresa es $G_1 = 5000k - 200$,
    y del segundo trimestre es $G_2 = 3000k + 800$. ¿Cuál es la ganancia semestral
    total? (v1)


    Opciones: A) $8000k + 600$ · B) $8000k - 600$ · C) $2000k + 600$ · D) $8000k +
    1000$'
  solucion_pasos:
  - 'Familia $k$: $5000+3000=8000k$. Constantes: $-200+800=600$. Total: $8000k+600$.'
  - 'Respuesta: $8000k + 600$'
- titulo: 'Respecto de «Adición de polinomios en forma horizontal»: ¿La siguiente
    formulación es correc'
  enunciado: 'Respecto de «Adición de polinomios en forma horizontal»: ¿La siguiente
    formulación es correcta? «En la **Adición Horizontal**, se colocan los polinomios
    uno al lado del otro entre paréntesis (si es necesario) y se eliminan los agrupadores»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En la **Adición Horizontal**,
    se colocan los polinomios uno al lado del otro entre paréntesis (si es necesario)
    y se eliminan los agrupadores.'
- titulo: 'Respecto de «Adición de polinomios en forma horizontal»: ¿La siguiente
    conclusión es correct'
  enunciado: 'Respecto de «Adición de polinomios en forma horizontal»: ¿La siguiente
    conclusión es correcta? «Cambiar signos al eliminar paréntesis precedidos de $+$
    (error que viene de confundir con la resta)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En la **Adición Horizontal**,
    se colocan los polinomios uno al lado del otro entre paréntesis (si es necesario)
    y se eliminan los agrupadores.'
errores_frecuentes:
- Cambiar signos al eliminar paréntesis precedidos de $+$ (error que viene de confundir
  con la resta).
- Olvidar agrupar todas las familias y dejar términos semejantes sin reducir.
- Cambiar todos los signos del segundo paréntesis.
- Multiplicar los coeficientes de los términos semejantes.
- Elevar los exponentes de cada término.
afirmaciones_verdaderas:
- La reducción en adición de polinomios en forma horizontal conserva los exponentes
  de la parte literal.
al_terminar_debes_ponder: Operar y reducir expresiones algebraicas utilizando adición
  de polinomios en forma horizontal.
fuente: Álgebra de Baldor.
