semantic_id: MAT.ALG.FUNCION_AFIN.TRASLACION_VERTICAL
resumen_inicial: La gráfica de una función afín $f(x) = mx + n$ es el resultado de trasladar verticalmente la recta lineal $f_0(x) = mx$ en $n$ unidades mediante el vector $\vec{v} = (0, n)$.
explicacion_simple: '![La gráfica de una función afín $f(x) = mx + n$ es el resultado de trasladar verticalmente la recta lineal $f_0(x) = mx$ en $n$ unidades mediante el vector $\vec{v} = (0, n)$](/static/img/nodos/interpretacion-de-la-funcion-afin-como-traslacion-vertical-de-la-funcion-lineal-intro.svg)



  Imagina la recta de la función lineal $y = mx$ que pasa por el centro $(0, 0)$:

  - Si le sumas un número positivo $+n$, la recta completa **se desplaza hacia arriba $n$ unidades**.

  - Si le restas un número $-n$, la recta completa **se desplaza hacia abajo $|n|$ unidades**.


  La inclinación no cambia en absoluto: ambas rectas son **exactamente paralelas** (tienen la misma pendiente $m$).'
explicacion_formal: 'Sea $f_0(x) = mx$ la función lineal canónica. La función afín $f(x) = mx + n$ se define geométricamente como la **traslación rígida vertical** de $\text{Graf}(f_0)$ según el vector de desplazamiento $\vec{v} = (0, n) \in \mathbb{R}^2$:

  $$\mathcal{T}_{\vec{v}}(\text{Graf}(f_0)) = \{(x, y + n) \in \mathbb{R}^2 \mid y = mx\} = \text{Graf}(f)$$


  **Propiedades de la transformación:**

  - **Paralelismo**: $\text{Pendiente}(\text{Graf}(f)) = \text{Pendiente}(\text{Graf}(f_0)) = m$.

  - **Distancia vertical constante**: Para cualquier valor de $x$, la distancia vertical entre ambas rectas es $|f(x) - f_0(x)| = |n|$.

  - **Isometría**: Preserva la longitud y la forma de la recta sin rotación.'
definiciones_clave: '- **Traslación vertical**: Transformación isométrica que desplaza todos los puntos de una curva en la dirección del eje $Y$.

  - **Vector de traslación $\vec{v} = (0, n)$**: Vector que cuantifica la magnitud y sentido del desplazamiento vertical.'
propiedades_relaciones: '- **Rectas paralelas**: Dos funciones afines con la misma pendiente $m$ son paralelas y se diferencian por una traslación vertical.

  - **Generalización funcional**: Para cualquier función $g(x)$, la gráfica de $g(x) + c$ es una traslación vertical de $g(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La gráfica de una función afín $f(x) = mx + n$ es el resultado de trasladar verticalmente la recta lineal $f_0(x) = mx$ en $n$ unidades mediante el vector $\vec{v} = (0, n)$](/static/img/nodos/interpretacion-de-la-funcion-afin-como-traslacion-vertical-de-la-funcion-lineal-ejemplos.svg)



    A partir de la función lineal $f_0(x) = 3x$, describe la transformación geométrica que genera a $f(x) = 3x - 5$ y comprueba el desplazamiento en los puntos $x = 0$ y $x = 2$.'
  pasos:
  - 'Paso 1: Identificar la pendiente común $m = 3$, lo que asegura que ambas rectas son paralelas.'
  - 'Paso 2: Identificar el vector de traslación: como $n = -5$, el vector es $\vec{v} = (0, -5)$ (traslación de 5 unidades hacia abajo).'
  - 'Paso 3: Evaluar en $x = 0$: $f_0(0) = 0 \to f(0) = -5$ (desplazamiento vertical de $-5$).'
  - 'Paso 4: Evaluar en $x = 2$: $f_0(2) = 6 \to f(2) = 1$ (desplazamiento vertical: $1 - 6 = -5$).'
  - 'Paso 5: Concluir que cada punto de $y = 3x$ se traslada 5 unidades verticalmente hacia abajo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué transformación geométrica se aplica a $y = 4x$ para obtener $y = 4x + 7$?
  choices:
  - text: Una traslación vertical de 7 unidades hacia arriba.
    is_correct: true
  - text: Una traslación horizontal de 7 unidades a la derecha.
    is_correct: false
  - text: Una rotación de 7 grados.
    is_correct: false
  - text: Una traslación vertical de 7 unidades hacia abajo.
    is_correct: false
  explanation: La alternativa correcta es 'Una traslación vertical de 7 unidades hacia arriba.'. Sumar $+7$ desplaza la curva según $\vec{v} = (0, 7)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo son entre sí las gráficas de $f(x) = -2x$ y $g(x) = -2x - 9$?
  choices:
  - text: Son rectas paralelas no coincidentes.
    is_correct: true
  - text: Son rectas perpendiculares.
    is_correct: false
  - text: Son la misma recta.
    is_correct: false
  - text: Se cortan en el origen.
    is_correct: false
  explanation: La alternativa correcta es 'Son rectas paralelas no coincidentes.'. Tienen igual pendiente ($m = -2$) y distinto coeficiente de posición.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función lineal base $f_0(x) = mx$.'
- 'Paso 2: Leer el coeficiente de posición $n$ de la función afín $f(x) = mx + n$.'
- 'Paso 3: Determinar el sentido del desplazamiento (arriba si $n > 0$, abajo si $n < 0$).'
- 'Paso 4: Trazar la nueva recta paralela a $f_0(x)$ pasando por el punto $(0, n)$.'
errores_correccion: '- **Error común:** Creer que sumar $n$ inclina la recta cambiando su ángulo.

  - **Cómo corregirlo:** La pendiente $m$ se mantiene idéntica, por lo que **la inclinación no cambia**; la recta se mueve rígidamente en vertical.'
ejemplos:
- titulo: 'Ejemplo 1: Vector de traslación'
  enunciado: ¿Cuál es el vector de traslación para pasar de $y = -5x$ a $y = -5x + 3$?
  alternativas:
  - (0, 3)
  - (3, 0)
  - (-5, 3)
  - (0, -5)
  respuesta: (0, 3)
  solucion_pasos:
  - 'Paso 1: El desplazamiento es puramente vertical en $n = 3$, luego $\vec{v} = (0, 3)$.'
- titulo: 'Ejemplo 2: Paralelismo por igual pendiente'
  enunciado: ¿Cuál de las siguientes rectas es paralela a $y = 3x - 1$?
  alternativas:
  - y = 3x + 8
  - y = -3x + 8
  - y = (1/3)x - 1
  - y = -x + 3
  respuesta: y = 3x + 8
  solucion_pasos:
  - 'Paso 1: Dos rectas son paralelas si tienen la misma pendiente $m = 3$.'
- titulo: 'Ejemplo 3: Distancia vertical'
  enunciado: ¿Cuál es la distancia vertical entre las rectas $y = 2x + 5$ e $y = 2x - 3$ para cualquier $x$?
  alternativas:
  - 8 unidades
  - 2 unidades
  - 5 unidades
  - 3 unidades
  respuesta: 8 unidades
  solucion_pasos:
  - 'Paso 1: $|5 - (-3)| = |5 + 3| = 8$ unidades.'
- titulo: 'Ejemplo 4: Identificación de fórmula trasladada'
  enunciado: Si la recta $y = -x$ se traslada 6 unidades hacia abajo, ¿cuál es su nueva ecuación?
  alternativas:
  - y = -x - 6
  - y = -x + 6
  - y = -(x - 6)
  - y = -6x
  respuesta: y = -x - 6
  solucion_pasos:
  - 'Paso 1: Trasladar hacia abajo 6 unidades resta $6$: $y = -x - 6$.'
errores_frecuentes:
- Confundir traslaciones verticales f(x)+n con traslaciones horizontales f(x+k).
- Pensar que la traslación modifica la pendiente de la recta.
- Invertir el sentido del desplazamiento en valores negativos de n.
afirmaciones_verdaderas:
- La gráfica de f(x) = mx + n es una traslación vertical de la recta f(x) = mx en n unidades.
- Dos rectas afines con la misma pendiente son paralelas entre sí.
al_terminar_debes_poder: '**QUÉ:** Interpretar la función afín como traslación vertical de la función lineal base.


  **CÓMO:** Aplicando el vector de traslación (0, n), conservando la pendiente m y verificando el paralelismo geométrico.


