semantic_id: MAT.ALG.FUNCION_AFIN.TRASLACION_VERTICAL
resumen_inicial: 'Interpretación de la función afín como traslación vertical de la
  función lineal: conceptos, representación y propiedades en Función afín.'
explicacion_simple: 'Toda función afín tiene una "hermana lineal" escondida: si le
  quitas el coeficiente de posición, queda exactamente la función lineal que comparte
  su misma pendiente.'
explicacion_formal: '### Definición formal


  Dadas $f(x)=mx+n$ y $g(x)=mx$, se cumple $f(x) = g(x) + n$ para todo $x$. Geométricamente,
  esto significa que cada punto $(x, g(x))$ de la recta lineal se traslada al punto
  $(x, g(x)+n)$ para obtener la recta afín, un desplazamiento vertical uniforme de
  magnitud $n$.


  ### Desarrollo didáctico


  Como la pendiente no cambia en esta traslación, ambas rectas ($f$ y $g$) son paralelas:
  solo cambia su posición vertical, nunca su inclinación.


  Si $g(x)=3x$ y $f(x)=3x+7$: cada punto de $g$ se traslada 7 unidades hacia arriba
  para obtener el punto correspondiente de $f$. Por ejemplo, $g(2)=6$ se traslada
  a $f(2)=13=6+7$.'
definiciones_clave: '- **Interpretación de la función afín como traslación vertical
  de la función lineal**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación de la función afín como
  traslación vertical de la función lineal.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a interpretación de
    la función afín como traslación vertical de la función lineal.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a interpretación de la función afín
    como traslación vertical de la función lineal.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
