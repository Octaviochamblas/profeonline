semantic_id: MAT.ALG.FUNCION_AFIN.TRASLACION_VERTICAL
resumen_inicial: La función afín $f(x) = mx + b$ se interpreta geométricamente como la traslación vertical de la función lineal $g(x) = mx$ en $|b|$ unidades.
explicacion_simple: |
  Imagina la recta de una **función lineal** $g(x) = mx$ que pasa por el centro $(0,0)$:

  - Si le sumas $b$ positivo ($f(x) = mx + b$), la recta entera se **desplaza hacia arriba** $b$ unidades.
  - Si le restas $b$ ($f(x) = mx - b$), la recta entera se **desplaza hacia abajo** $b$ unidades.
  - La inclinación (pendiente $m$) se mantiene idéntica, por lo que ambas rectas son **paralelas**.
explicacion_formal: |
  Sea $g(x) = mx$ una función lineal. La función afín $f(x) = mx + b$ se obtiene aplicando al gráfico $\text{Graf}(g)$ una **traslación rígida vertical** según el vector de traslación:

  $$\vec{v} = (0, b)$$

  **Formulación puntual de la traslación:**
  $$(x, g(x)) + (0, b) = (x, mx + b) = (x, f(x))$$

  **Propiedades geométricas del desplazamiento:**
  - Si $b > 0$: Traslación hacia arriba en $b$ unidades.
  - Si $b < 0$: Traslación hacia abajo en $|b|$ unidades.
  - Las rectas $\text{Graf}(g)$ y $\text{Graf}(f)$ son estrictamente paralelas ($\text{Graf}(g) \parallel \text{Graf}(f)$).
definiciones_clave: |
  - **Traslación vertical**: Transformación isométrica que desplaza rigidamente cada punto de una gráfica a lo largo del eje $Y$.
propiedades_relaciones: |
  - **Conservación de pendiente**: La traslación preserva intacta la pendiente $m$, por lo que la función lineal original y la afín desplazada son paralelas.
ejemplo_guiado:
  enunciado: "Describe cómo se obtiene la gráfica de la función afín $f(x) = 3x - 5$ a partir de la función lineal $g(x) = 3x$."
  pasos:
    - 'Paso 1: Identificar la función lineal base: $g(x) = 3x$ (pasa por el origen).'
    - 'Paso 2: Identificar el término de traslación: $b = -5$.'
    - 'Paso 3: Aplicar el vector de traslación $\vec{v} = (0, -5)$.'
    - 'Paso 4: Concluir que la gráfica de $f(x)$ es una recta paralela a $g(x)$ desplazada $5$ unidades verticalmente hacia abajo.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cómo se obtiene la gráfica de $f(x) = 3x - 5$ a partir de la recta de la función lineal $g(x) = 3x$?"
    choices:
      - {text: "Desplazando la recta de $g(x)$ 5 unidades hacia abajo de forma paralela.", is_correct: true}
      - {text: "Desplazando la recta de $g(x)$ 5 unidades hacia la derecha.", is_correct: false}
      - {text: "Rotando la recta de $g(x)$ 5 grados respecto al origen.", is_correct: false}
      - {text: "Desplazando la recta de $g(x)$ 3 unidades hacia arriba.", is_correct: false}
    explanation: "La alternativa correcta es 'Desplazando la recta de $g(x)$ 5 unidades hacia abajo de forma paralela.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué relación geométrica existe entre la recta de una función lineal $y = mx$ y cualquier función afín $y = mx + b$ de igual pendiente?"
    choices:
      - {text: "Son rectas estrictamente paralelas.", is_correct: true}
      - {text: "Son rectas perpendiculares.", is_correct: false}
      - {text: "Se intersectan en el punto $(0,0)$.", is_correct: false}
      - {text: "Son curvas secantes.", is_correct: false}
    explanation: "La alternativa correcta es 'Son rectas estrictamente paralelas.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la función lineal base $g(x) = mx$.'
  - 'Paso 2: Extraer el coeficiente de posición $b$ como la distancia de desplazamiento vertical.'
  - 'Paso 3: Aplicar el vector de traslación $(0, b)$ a cada punto de la recta lineal.'
  - 'Paso 4: Trazar la nueva recta paralela cruzando el eje $Y$ en $(0, b)$.'
errores_correccion: |
  - **Error común:** Creer que sumar $+ b$ desplaza la recta hacia la izquierda o derecha sobre el eje $X$.
  - **Cómo corregirlo:** La suma $+ b$ a la función completa $f(x) = mx + b$ produce un desplazamiento **VERTICAL** sobre el eje $Y$, no horizontal.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La función afín $f(x) = mx + b$ se obtiene trasladando horizontalmente la recta $g(x) = mx$ a lo largo del eje de las abscisas.'
  - 'Trasladar verticalmente una recta modifica el valor de su pendiente y su ángulo de inclinación.'
  - 'La recta afín $f(x) = 2x + 4$ es perpendicular a la recta lineal $g(x) = 2x$.'
  - 'Si el término independiente es $b = -3$, la gráfica de la función se desplaza 3 unidades hacia arriba.'
  - 'Una traslación vertical altera la forma geométrica de la recta transformándola en una parábola.'
afirmaciones_verdaderas:
  - 'La gráfica de la función afín $f(x) = mx + b$ es el resultado de aplicar una traslación vertical en $b$ unidades a la recta de la función lineal $g(x) = mx$.'
  - 'Dado que la traslación es una isometría que conserva la pendiente $m$, la recta afín es siempre paralela a la recta lineal base.'
al_terminar_debes_poder: |
  QUÉ: Interpretar la función afín como una traslación vertical rígida de la función lineal base.
  CÓMO: Identificar el vector de traslación $(0, b)$, verificar el paralelismo $m_1 = m_2$ y describir el desplazamiento arriba/abajo.
