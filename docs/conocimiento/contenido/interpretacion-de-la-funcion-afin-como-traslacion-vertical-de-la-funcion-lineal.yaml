    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en función afín. Es la condición de existencia
    y unicidad en interpretación de la función afín como traslación vertical de la
    función lineal.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
