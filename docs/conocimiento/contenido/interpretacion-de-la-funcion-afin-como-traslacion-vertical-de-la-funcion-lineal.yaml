semantic_id: MAT.ALG.FUNCION_AFIN.TRASLACION_VERTICAL
resumen_inicial: La función afín $f(x) = m x + n$ es la gráfica de la función lineal
  $g(x) = m x$ trasladada verticalmente $n$ unidades.
explicacion_simple: 'Geométricamente, la **función afín** $f(x) = m x + n$ y la **función
  lineal** $g(x) = m x$ son dos rectas paralelas (tienen la misma pendiente $m$):

  - Si $n > 0$, la gráfica de $f(x)$ se obtiene desplazando la recta lineal $n$ unidades
  **hacia arriba**.

  - Si $n < 0$, se desplaza $|n|$ unidades **hacia abajo**.'
explicacion_formal: 'Dada la función lineal $g(x) = m x$, la función afín $f(x) =
  m x + n$ es el resultado de la transformación rígida de **traslación vertical**
  descrita por el vector $\vec{v} = (0, n)$:


  $$f(x) = g(x) + n \implies G(f) = T_{(0, n)}(G(g))$$


  **Desglose de la fórmula:**

  - Preserva la pendiente y paralelismo de la recta original desplazando de forma
  uniforme todas las ordenadas en la magnitud $n$.'
definiciones_clave: '- **Traslación vertical**: Transformación isométrica que desplaza
  cada punto del plano paralelamente al eje $Y$.'
propiedades_relaciones: '- **Paralelismo por traslación**: La recta desplazada conserva
  la misma pendiente $m$ y por ende es paralela a la recta lineal de origen.'
ejemplo_guiado:
  enunciado: Describe la relación gráfica entre la función lineal $g(x) = 3x$ y la
    función afín $f(x) = 3x + 4$.
  pasos:
  - 'Paso 1: Observar que ambas funciones comparten la misma pendiente $m = 3 \implies$
    son rectas paralelas.Paso 2: Identificar el término constante de $f(x)$: $n =
    +4$.Paso 3: Concluir que la gráfica de $f(x)$ es la recta lineal $g(x) = 3x$ trasladada
    $4$ unidades hacia arriba.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se obtiene la gráfica de $f(x) = 3x + 4$ a partir de la recta lineal
    $g(x) = 3x$?
  choices:
  - text: Trasladando la recta $g(x) = 3x$ verticalmente 4 unidades hacia arriba.
    is_correct: true
  - text: Rotando la recta $g(x) = 3x$ en $90^\circ$.
    is_correct: false
  - text: Trasladando la recta 4 unidades hacia la izquierda.
    is_correct: false
  - text: Reflejando la recta respecto al eje X.
    is_correct: false
  explanation: La alternativa correcta es 'Trasladando la recta $g(x) = 3x$ verticalmente
    4 unidades hacia arriba.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué vector de traslación $\vec{v} = (v_x, v_y)$ transforma a $g(x) =
    3x$ en $f(x) = 3x - 7$?
  choices:
  - text: \vec{v} = (0, -7)
    is_correct: true
  - text: \vec{v} = (-7, 0)
    is_correct: false
  - text: \vec{v} = (3, -7)
    is_correct: false
  - text: \vec{v} = (0, 3)
    is_correct: false
  explanation: La alternativa correcta es '\vec{v} = (0, -7)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función lineal base $g(x) = m x$ tomando la misma pendiente.'
- 'Paso 2: Leer el coeficiente de posición $n$ como el desplazamiento vertical.'
- 'Paso 3: Aplicar el vector de traslación $(0, n)$ a la recta lineal.'
errores_correccion: '- **Error común:** Pensar que la función afín cambia la inclinación
  de la función lineal.

  - **Cómo corregirlo:** La traslación es un movimiento rígido: conserva la inclinación
  (pendiente) y solo cambia la altura de corte.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
