semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_NO_EXACTA
resumen_inicial: Una raíz no exacta es aquella cuyo radicando entero no es una potencia
  $n$-ésima perfecta, dando como resultado un número irracional con decimales infinitos
  no periódicos.
explicacion_simple: Una raíz no exacta es aquella que al calcularla no nos da un número
  entero perfecto, sino un número irracional con infinitos decimales sin patrón repetitivo,
  como $\sqrt{2} \approx 1,4142...$ o $\sqrt{3}$.
explicacion_formal: 'La expresión $\sqrt[n]{a}$ con $a \in \mathbb{Z}^+$ es una **Raíz
  No Exacta** si $a$ no es una potencia $n$-ésima perfecta:


  $$\sqrt[n]{a} \notin \mathbb{Z} \implies \sqrt[n]{a} \in \mathbb{I} = \mathbb{R}
  \setminus \mathbb{Q}$$


  **Caracterización decimal:**

  - Su valor numérico es un decimal infinito no periódico impredecible.'
definiciones_clave: '- **Raíz no exacta**: Expresión radical cuyo valor pertenece
  al conjunto irracional $\mathbb{I}$.'
propiedades_relaciones: '- **Pertenencia a I**: $\sqrt[n]{a} \in \mathbb{I}$ cuando
  el radicando no es potencia $n$-ésima perfecta.'
ejemplo_guiado:
  enunciado: Clasifique y acote entre dos enteros consecutivos la raíz no exacta $\sqrt{10}$.
  pasos:
  - 'Paso 1: Identificar los cuadrados perfectos más cercanos a $10$: $9 < 10 < 16$.'
  - 'Paso 2: Aplicar la raíz cuadrada a la desigualdad: $\sqrt{9} < \sqrt{10} < \sqrt{16}$.'
  - 'Paso 3: Calcular las raíces exactas de los extremos: $3 < \sqrt{10} < 4$.'
  - 'Conclusión: $\sqrt{10} \approx 3,162... \in \mathbb{I}$ es una raíz no exacta
    acotada entre $3$ y $4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué conjunto numérico pertenece el resultado de una raíz no exacta
    sobre un entero positivo?
  choices:
  - text: Al conjunto de los números irracionales I
    is_correct: true
  - text: Al conjunto de los números enteros Z
    is_correct: false
  - text: A los racionales finitos
    is_correct: false
  - text: Al conjunto de los enteros negativos
    is_correct: false
  explanation: La alternativa correcta es 'Al conjunto de los números irracionales
    I'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(10), ¿entre qué números enteros se encuentra
    acotada?
  choices:
  - text: Entre 3 y 4 (porque 9 < 10 < 16)
    is_correct: true
  - text: Entre 1 y 2
    is_correct: false
  - text: Entre 5 y 6
    is_correct: false
  - text: Entre 10 y 11
    is_correct: false
  explanation: La alternativa correcta es 'Entre 3 y 4 (porque 9 < 10 < 16)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que el radicando entero no sea una potencia $n$-ésima perfecta.'
- 'Paso 2: Acotar la raíz entre dos potencias perfectas consecutivas conocidas.'
- 'Paso 3: Clasificar la expresión como un número irracional $\in \mathbb{I}$.'
errores_correccion: '- **Error 1: Confundir una raíz no exacta con un decimal finito
  (decir que $\sqrt{2} = 1,41$).** **Cómo corregirlo:** $1,41$ es solo una aproximación
  por redondeo; la expresión exacta $\sqrt{2}$ es irracional e infinita.


  - **Error 2: Asumir que una raíz no exacta se puede simplificar hasta eliminar el
  símbolo radical.** **Cómo corregirlo:** Si no es potencia perfecta, la raíz conservará
  siempre el signo radical en su expresión exacta.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\sqrt{7}$ una raíz no exacta?
  alternativas:
  - Sí, 7 no es un cuadrado perfecto (sqrt(7) en I)
  - No, es exacta
  - Es igual a 3,5
  respuesta: Sí, 7 no es un cuadrado perfecto (sqrt(7) en I)
  solucion_pasos:
  - $\sqrt{7} \approx 2,6457... \in \mathbb{I}$.
- titulo: Ejemplo 2
  enunciado: Acote $\sqrt[3]{20}$ entre dos enteros.
  alternativas:
  - Entre 2 y 3 (porque 2^3=8 y 3^3=27)
  - Entre 3 y 4
  - Entre 1 y 2
  respuesta: Entre 2 y 3 (porque 2^3=8 y 3^3=27)
  solucion_pasos:
  - $8 < 20 < 27 \implies 2 < \sqrt[3]{20} < 3$.
- titulo: ¿Son todas las raíces no exactas números irracionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema de Irracionalidad de Radicals.
- titulo: ¿Se pueden acotar las raíces no exactas usando cuadrados perfectos?
  respuesta: Sí
  solucion_pasos:
  - Sí, mediante la propiedad de orden en los reales.
errores_frecuentes:
- Las raíces no exactas se transforman a fracciones dividiendo el radicando por 10.
- Una raíz no exacta como $\sqrt{3}$ equivale a un decimal finito de dos cifras.
- Acotar una raíz no exacta requiere promediar los extremos de la desigualdad.
- Las raíces no exactas pertenecen al conjunto de los números enteros negativos.
- Toda raíz cuadrada no exacta da como resultado un número entero par.
afirmaciones_verdaderas:
- La raíz $n$-ésima de un entero que no es potencia perfecta es un número irracional
  ($\, \in \mathbb{I}$).
- Toda raíz no exacta se puede acotar entre dos números enteros consecutivos evaluando
  potencias perfectas.
al_terminar_debes_poder: Al terminar serás capaz de identificar y acotar raíces no
  exactas $\sqrt[n]{a} \in \mathbb{I}$ entre enteros consecutivos, fundamentando su
  naturaleza irracional.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
