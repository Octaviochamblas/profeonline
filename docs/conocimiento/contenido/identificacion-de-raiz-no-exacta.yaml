semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_NO_EXACTA
resumen_inicial: Una raíz de un número entero es no exacta cuando su radicando no es una potencia
  perfecta respecto al índice, representando un número irracional ($\mathbb{I}$).
explicacion_simple: 'Cuando intentas calcular una raíz como $\sqrt{2}$ o $\sqrt{7}$, no existe
  ningún entero ni fracción que al multiplicarse por sí mismo dé exactamente $2$ o $7$.

  Estas son **raíces no exactas**: sus decimales son infinitos y no tienen período ($\sqrt{2}
  \approx 1{,}41421356...$). Pertenecen al conjunto de los números irracionales.'
explicacion_formal: Para $k \in \mathbb{Z}^+$ y $n \in \mathbb{N}, n \ge 2$, si $k$ no es
  de la forma $m^n$ para ningún $m \in \mathbb{Z}$, la raíz $\sqrt[n]{k}$ es un número irracional
  ($\sqrt[n]{k} \in \mathbb{I} = \mathbb{R} \setminus \mathbb{Q}$).
definiciones_clave: '- **Raíz no exacta / irracional**: Radical cuyo valor numérico posee
  una representación decimal infinita no periódica.'
propiedades_relaciones: '- **Acotación entre enteros**: Toda raíz cuadrada no exacta $\sqrt{k}$
  se puede acotar entre dos enteros consecutivos $a < \sqrt{k} < a+1$.'
ejemplo_guiado:
  enunciado: Determina si $\sqrt{12}$ es una raíz exacta o no exacta, y acótala entre dos
    enteros consecutivos.
  pasos:
  - Los cuadrados perfectos más cercanos a 12 son $9$ ($3^2$) y $16$ ($4^2$).
  - Como 12 no es cuadrado perfecto, $\sqrt{12}$ es una raíz no exacta (irracional).
  - Como $9 < 12 < 16$, aplicando raíz tenemos $3 < \sqrt{12} < 4$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué conjunto numérico pertenece el resultado de la raíz no exacta $\sqrt{5}$?
  choices:
  - text: Al conjunto de los números irracionales (I)
    is_correct: true
  - text: Al conjunto de los números enteros (Z)
    is_correct: false
  - text: Al conjunto de los números racionales (Q)
    is_correct: false
  - text: No es un número real
    is_correct: false
  explanation: 'La correcta es: Al conjunto de los números irracionales (I). Las raíces no
    exactas de enteros son números irracionales.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Entre qué dos números enteros consecutivos se ubica $\sqrt{20}$?
  choices:
  - text: Entre 4 y 5
    is_correct: true
  - text: Entre 2 y 3
    is_correct: false
  - text: Entre 5 y 6
    is_correct: false
  - text: Entre 19 y 21
    is_correct: false
  explanation: 'La correcta es: Entre 4 y 5. Puesto que $16 < 20 < 25 \implies \sqrt{16} <
    \sqrt{20} < \sqrt{25} \implies 4 < \sqrt{20} < 5$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar si el radicando es una potencia perfecta según el índice.'
- 'Paso 2: Si no lo es, declarar que la raíz es no exacta e irracional.'
- 'Paso 3: Para estimar su valor, buscar los dos cuadrados/cubos perfectos más cercanos por
  abajo y por arriba.'
errores_correccion: No asumas que porque la calculadora muestra 8 decimales la raíz se volvió
  racional. Las aproximaciones decimales no quitan la naturaleza irracional de una raíz no
  exacta.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\sqrt{3}$ una raíz exacta?
  alternativas:
  - No, es irracional
  - Sí, vale 1,5
  - Sí, es racional
  respuesta: No, es irracional
  solucion_pasos:
  - 3 no es cuadrado perfecto, luego $\sqrt{3}$ es no exacta e irracional.
- titulo: Ejemplo 2
  enunciado: ¿Es la raíz cuadrada de 30 una raíz exacta o no exacta?
  alternativas:
  - No exacta
  - Exacta, vale 5
  - Exacta, vale 6
  respuesta: No exacta
  solucion_pasos:
  - 30 no es un cuadrado perfecto.
- titulo: Ejemplo 3
  enunciado: ¿Entre qué enteros consecutivos se ubica la raíz cuadrada de 40?
  alternativas:
  - Entre 6 y 7
  - Entre 5 y 6
  - Entre 7 y 8
  respuesta: Entre 6 y 7
  solucion_pasos:
  - 36 < 40 < 49, entonces 6 < √40 < 7.
- titulo: ¿Es la raíz cúbica de 10 una raíz exacta?
  respuesta: 'No'
  solucion_pasos:
  - 10 no es un cubo perfecto, por lo tanto es no exacta e irracional.
errores_frecuentes:
- Confundir el valor aproximado decimal con el valor exacto de una raíz no exacta.
- Confundir un resultado decimal largo mostrado en la calculadora con un valor exacto.
- Pensar que una raíz no exacta no tiene ningún valor definido.
- Olvidar acotar la raíz no exacta entre los dos enteros consecutivos más cercanos.
- Creer que solo las raíces cuadradas pueden ser no exactas.
afirmaciones_verdaderas:
- Las raíces no exactas de enteros son números irracionales.
- Toda raíz no exacta de un número entero positivo es un número irracional.
al_terminar_debes_poder: Identificar raíces no exactas y acotar su valor entre enteros consecutivos.
fuente: Texto escolar MINEDUC.
estado: publicado
