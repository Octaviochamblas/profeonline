semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_NO_EXACTA
resumen_inicial: Una raíz no exacta es aquella cuyo radicando no es una potencia $n$-ésima perfecta, produciendo un número irracional ($\mathbb{I} = \mathbb{R} \setminus \mathbb{Q}$) con infinitas cifras decimales no periódicas.
explicacion_simple: '![Identificación de raíz no exacta](/static/img/nodos/identificacion-de-raiz-no-exacta-intro.svg)


  Cuando una raíz no da un número exacto (como $\sqrt{2}$, $\sqrt{3}$ o $\sqrt{5}$), su resultado es un **número irracional**. Esto significa que tiene infinitos decimales que no siguen ningún patrón periódico ($\sqrt{2} = 1,41421356\dots$) y es imposible escribirlo como una fracción. En la prueba PAES, estos números se dejan expresados con el símbolo de la raíz o se **acotan entre dos enteros consecutivos** (por ejemplo: como $4 < 7 < 9$, entonces $2 < \sqrt{7} < 3$).'
explicacion_formal: "Sea $a \\in \\mathbb{Q}^+$ y $n \\in \\mathbb{N}_{\\ge 2}$. Si $a$ no es la potencia $n$-ésima de ningún número racional, entonces:\n\n$$\\sqrt[n]{a} \\in \\mathbb{I} = \\mathbb{R} \\setminus \\mathbb{Q}$$\n\n**Propiedades de los radicales irracionales:**\n1. **Inconmensurabilidad y no periodicidad:** Su representación decimal contiene infinitas cifras decimales sin periodo ni anteperiodo.\n2. **Método de Acotación Entera Consecutiva:**\n   Para cualquier número natural $N$ que no sea cuadrado perfecto, existen enteros consecutivos $k, k+1 \\in \\mathbb{Z}$ tales que:\n   $$k^2 < N < (k+1)^2 \\implies k < \\sqrt{N} < k+1$$\n3. **Manejo algebraico exacto:** En álgebra y cálculo, $\\sqrt{2}, \\sqrt{3}, \\sqrt{5}$ son valores matemáticos exactos que no deben truncarse a menos que se solicite explícitamente una aproximación."
definiciones_clave: '- **Raíz no exacta**: Radical cuyo valor es un número irracional.

  - **Número irracional ($\mathbb{I}$)**: Número real que no puede escribirse como cociente de dos enteros.

  - **Acotación**: Encuadre de una raíz inexacta entre dos valores enteros conocidos.'
propiedades_relaciones: '- **Densidad**: Entre cualquier par de racionales existen infinitas raíces irracionales.

  - **Acotación rápida**: $9 < 10 < 16 \implies 3 < \sqrt{10} < 4$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de identificación de raíz no exacta](/static/img/nodos/identificacion-de-raiz-no-exacta-ejemplos.svg)


    Determine si las raíces $\sqrt{10}$, $\sqrt[3]{20}$ y $\sqrt{\frac{2}{5}}$ son no exactas (irracionales) y acote $\sqrt{10}$ entre dos enteros consecutivos.'
  pasos:
  - 'Paso 1: Analizar $\sqrt{10}$: $10$ no es cuadrado perfecto. Acotación: $3^2 = 9 < 10 < 16 = 4^2 \implies 3 < \sqrt{10} < 4$. Es irracional $\sqrt{10} \in \mathbb{I}$.'
  - 'Paso 2: Analizar $\sqrt[3]{20}$: $2^3 = 8 < 20 < 27 = 3^3 \implies 2 < \sqrt[3]{20} < 3$. Es irracional $\sqrt[3]{20} \in \mathbb{I}$.'
  - 'Paso 3: Analizar $\sqrt{\frac{2}{5}}$: Ni $2$ ni $5$ son cuadrados perfectos $\implies \sqrt{2/5} \in \mathbb{I}$.'
  - 'Conclusión: Todas son raíces no exactas (irracionales) y $3 < \sqrt{10} < 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Entre qué dos números enteros consecutivos se encuentra $\sqrt{30}$?
  choices:
  - text: Entre $5$ y $6$ (porque $5^2 = 25 < 30 < 36 = 6^2$)
    is_correct: true
  - text: Entre $4$ y $5$
    is_correct: false
  - text: Entre $6$ y $7$
    is_correct: false
  - text: Entre $14$ y $16$
    is_correct: false
  explanation: La alternativa correcta es 'Entre $5$ y $6$ (porque $5^2 = 25 < 30 < 36 = 6^2$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál de las siguientes afirmaciones sobre $\sqrt{2}$ es verdadera?
  choices:
  - text: Es un número irracional con infinitas cifras decimales no periódicas
    is_correct: true
  - text: Es un número racional finito igual a $1,41$
    is_correct: false
  - text: Es una fracción irreducible $7/5$
    is_correct: false
  - text: No existe en la recta real
    is_correct: false
  explanation: La alternativa correcta es 'Es un número irracional con infinitas cifras decimales no periódicas'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar si el radicando es una potencia enésima perfecta.'
- 'Paso 2: Si no lo es, clasificar el resultado como número irracional ($\mathbb{I}$).'
- 'Paso 3: Para acotar su valor, identificar las dos potencias enésimas perfectas más cercanas que encierran al radicando.'
errores_correccion: '- **Error 1: Truncar la raíz y tratarla como número racional exacto ($\sqrt{2} = 1,4$).** **Cómo corregirlo:** $1,4$ es solo una aproximación; el valor exacto es el símbolo $\sqrt{2}$.

  - **Error 2: Creer que las raíces irracionales no están en la recta numérica.** **Cómo corregirlo:** Todo irracional tiene una posición geométrica exacta en la recta real $\mathbb{R}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué conjunto numérico pertenece $\sqrt{7}$?
  alternativas:
  - Irracionales ($\mathbb{I}$)
  - Racionales ($\mathbb{Q}$)
  - Enteros ($\mathbb{Z}$)
  respuesta: Irracionales ($\mathbb{I}$)
  solucion_pasos:
  - 7 no es cuadrado perfecto $\implies \sqrt{7} \in \mathbb{I}$.
- titulo: Ejemplo 2
  enunciado: ¿Entre qué enteros se ubica $\sqrt{50}$?
  alternativas:
  - Entre $7$ y $8$
  - Entre $6$ y $7$
  - Entre $5$ y $6$
  respuesta: Entre $7$ y $8$
  solucion_pasos:
  - $49 < 50 < 64 \implies 7 < \sqrt{50} < 8$.
- titulo: ¿Es √3 un número con decimales infinitos no periódicos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{3} \approx 1,7320508... \in \mathbb{I}$, es un número irracional.
  alternativas:
  - texto: Sí, es un número irracional
    es_correcta: true
    retroalimentacion: ¡Correcto! Decimal infinito no periódico.
  - texto: No, es un decimal periódico
    es_correcta: false
    retroalimentacion: Incorrecto, ningún número irracional es periódico.
  - texto: No, se puede escribir como fracción
    es_correcta: false
    retroalimentacion: Incorrecto, no pertenece a $\mathbb{Q}$.
- titulo: ¿Es √16 una raíz no exacta?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{16} = 4 \in \mathbb{Z} \subset \mathbb{Q}$, es una raíz exacta.
  alternativas:
  - texto: No, es una raíz exacta (√16 = 4)
    es_correcta: true
    retroalimentacion: ¡Correcto! 16 es cuadrado perfecto.
  - texto: Sí, porque tiene raíz
    es_correcta: false
    retroalimentacion: Incorrecto, tener raíz entera la clasifica como exacta.
  - texto: Sí, es irracional
    es_correcta: false
    retroalimentacion: Incorrecto, 4 es un número entero racional.
errores_frecuentes:
- Confundir aproximaciones decimales con valores exactos.
- Creer que los números irracionales no se pueden ubicar en la recta real.
- Equivocar los cuadrados perfectos al acotar.
- Afirmar que $\sqrt{N}$ siempre es irracional (olvidar cuadrados perfectos).
- Olvidar que $\pi$ y raíces no exactas comparten la naturaleza irracional.
afirmaciones_verdaderas:
- Las raíces no exactas de números enteros positivos son números irracionales.
- Toda raíz no exacta se puede acotar estrictamente entre dos números enteros consecutivos.
- La expresión simbólica $\sqrt{a}$ es la representación matemática exacta del número irracional.
al_terminar_debes_poder: '![Síntesis de raíces no exactas](/static/img/nodos/identificacion-de-raiz-no-exacta-resumen.svg)


  QUÉ: Identificar, clasificar y acotar raíces no exactas en el conjunto de los números irracionales $\mathbb{I}$.


  CÓMO: Reconociendo la ausencia de potencias perfectas en el radicando, encuadrando el radical entre dos potencias consecutivas $k^n < N < (k+1)^n$ y manteniendo su representación simbólica exacta.'
