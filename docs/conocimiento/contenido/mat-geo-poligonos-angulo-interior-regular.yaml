semantic_id: MAT.GEO.POLIGONOS_METRICA.ANGULO_INTERIOR_REGULAR
resumen_inicial: 'Cálculo de la medida de cada ángulo interior en un polígono regular:
  conceptos, teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Combinando la fórmula de suma de ángulos interiores con la propiedad
  de congruencia de ángulos en polígonos regulares, se puede calcular directamente
  la medida de cada ángulo individual.
explicacion_formal: '![Ángulo interior de un polígono regular](/static/img/geometria/poligonos-cuadrilateros/poligonos-angulo-interior-regular.svg)


  ### Definición formal


  Como la suma de ángulos interiores es $180°(n-2)$ y todos los ángulos son congruentes
  (por ser regular), cada ángulo individual mide $\frac{180°(n-2)}{n}$.


  ### Desarrollo didáctico


  Un pentágono regular ($n=5$) tiene cada ángulo interior igual a $\frac{180°\times3}{5}=\frac{540°}{5}=108°$.
  Esta fórmula combina dos ideas ya estudiadas: la suma total de ángulos interiores,
  y su distribución uniforme entre los n ángulos del polígono regular.'
