procedimiento:
- 'Paso 1: Confirma que el trinomio empiece con $x^2$ (coeficiente 1).'
- 'Paso 2: Escribe dos pares de paréntesis iniciales: $(x \quad )(x \quad )$.'
- 'Paso 3: Busca todas las parejas de números que multiplicadas den el 3er término.'
- 'Paso 4: Selecciona la pareja que, al sumarse, dé exactamente el 2do término.'
- 'Paso 5: Pon los números encontrados en los paréntesis con sus signos correspondientes.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en reconocimiento del trinomio cuadrático mónico.
ejemplos:
- titulo: Factoriza $x^2 + 8x + 15$
  enunciado: Factoriza $x^2 + 8x + 15$.
  solucion_pasos:
  - 'Multiplicados: 15. Sumados: 8.'
  - 'Parejas de 15: (1, 15), (3, 5).'
  - La suma de 3 + 5 es 8.
  - 'Factorización: $(x + 3)(x + 5)$.'
- titulo: Si tienes $m^2 + 9m + 14$, ¿cuáles son los números?
  solucion_pasos:
  - 2 * 7 = 14. 2 + 7 = 9. Así que queda $(m+2)(m+7)$.
- titulo: 'Respecto de «Reconocimiento del trinomio cuadrático mónico»: ¿Describe
    adecuadamente el conc'
  enunciado: 'Respecto de «Reconocimiento del trinomio cuadrático mónico»: ¿Describe
    adecuadamente el concepto esta frase? «Un trinomio de forma $x^2 + px + q$ se
    factoriza en dos binomios $(x + a)(x + b)$, donde los números ''$a$'' y ''$b$''
    deben cumplir dos condiciones: multiplicados deben dar ''$q$'' (término independiente)
    y sumados deben dar ''$p$'' (coeficiente de $x$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un trinomio de forma $x^2 +
    px + q$ se factoriza en dos binomios $(x + a)(x + b)$, donde los números ''$a$''
    y ''$b$'' deben cumplir dos condiciones: multiplicados deben dar ''$q$'' (término
    independiente) y sumados deben dar ''$p$'' (coeficiente de $x$).'
- titulo: 'Respecto de «Reconocimiento del trinomio cuadrático mónico»: ¿Se puede
    aceptar esta afirmaci'
  enunciado: 'Respecto de «Reconocimiento del trinomio cuadrático mónico»: ¿Se puede
    aceptar esta afirmación? «Buscar números que sumados den el tercero y multiplicados
    den el segundo (invertir la regla)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un trinomio de forma $x^2 +
    px + q$ se factoriza en dos binomios $(x + a)(x + b)$, donde los números ''$a$''
    y ''$b$'' deben cumplir dos condiciones: multiplicados deben dar ''$q$'' (término
    independiente) y sumados deben dar ''$p$'' (coeficiente de $x$).'
errores_frecuentes:
- Buscar números que sumados den el tercero y multiplicados den el segundo (invertir
  la regla).
- Olvidar escribir la variable 'x' en los paréntesis finales y solo escribir los números.
- a*b = p y a+b = q.
- a+b = 0 y a*b = 1.
- a*b = q y a-b = p.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando reconocimiento del trinomio cuadrático mónico.
