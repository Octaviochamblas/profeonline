semantic_id: MAT.ALG.FACTOR_TRINOMIOS.RECONOCIMIENTO_SIMPLE
resumen_inicial: 'Reconocimiento del trinomio cuadrático mónico: concepto, método
  de descomposición y reglas en Factorización de trinomios cuadráticos.'
explicacion_simple: 'Bienvenido al juego de detectives de los números. Factorizar
  un trinomio simple es resolver un acertijo muy específico: buscar dos números que
  multiplicados den un valor y sumados den otro. Es un rompecabezas clásico del álgebra.'
explicacion_formal: '### Definición formal


  El producto da el término independiente (q) y la suma da el coeficiente central
  (p).


  ### Desarrollo didáctico


  Piensa en el trinomio $x^2 + 5x + 6$.

  No es un TCP (6 no tiene raíz exacta). ¿Cómo lo factorizamos?

  Recordemos que al multiplicar $(x + a)(x + b)$, el resultado es $x^2 + (a+b)x +
  ab$.

  Por lo tanto, necesitamos dos números que:

  - Sumados den 5 (término central).

  - Multiplicados den 6 (término independiente).


  Hagamos la lista de parejas que multiplicadas dan 6:

  - 1 y 6 (Suma = 7) Falso.

  - 2 y 3 (Suma = 5) Verdadero.


  Los números adecuado son el +2 y el +3.

  Construimos nuestros binomios colocando la raíz del primer término ($x$) acompañada
  de los números encontrados: $(x + 2)(x + 3)$.'
definiciones_clave: '- **Reconocimiento del trinomio cuadrático mónico**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en reconocimiento del trinomio cuadrático mónico.'
ejemplo_guiado:
