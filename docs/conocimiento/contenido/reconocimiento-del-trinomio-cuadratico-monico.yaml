resumen_inicial: El reconocimiento del trinomio cuadrático mónico identifica expresiones
  de 3 términos de la forma $x^2 + px + q$, caracterizadas por tener un coeficiente
  principal strictly igual a $1$.
explicacion_simple: Un trinomio es mónico cuando el término con $x^2$ está solo, es
  decir, tiene un coeficiente $1$ invisible (como $x^2 + 5x + 6$). No hay ningún número
  multiplicando al $x^2$ que sea distinto de $1$.
explicacion_formal: 'Sea $P(x) = a x^2 + b x + c$ un polinomio de segundo grado en
  $\mathbb{R}[x]$. El **Reconocimiento del Trinomio Cuadrático Mónico** exige la verificación
  del axioma de monisidad:


  $$a = 1 \implies P(x) = x^2 + px + q \quad \text{con } p, q \in \mathbb{R}$$


  **Desglose simbólico:**

  - $x^2$: Término cuadrático principal con coeficiente $a = 1$.

  - $px$: Término lineal con coeficiente $p = b/1$.

  - $q$: Término independiente constante con $q = c/1$.


  > **Complemento didáctico:** Simplifica la búsqueda de factores lineales directo
  al no requerir la división o amplificación por el coeficiente principal.'
definiciones_clave: '- **Trinomio mónico**: Polinomio de grado 2 cuyo coeficiente
  del término de mayor grado es 1.

  - **Término independiente**: Constante $q$ libre de la variable $x$.'
propiedades_relaciones: '- **Estructura cannónica**: Todo trinomio mónico con raíces
  $r_1, r_2$ se expresa como $(x - r_1)(x - r_2)$.'
ejemplo_guiado:
  enunciado: Determine si el polinomio $x^2 - 7x + 12$ es un trinomio cuadrático mónico.
  pasos:
  - 'Paso 1: Contar los términos del polinomio: Posee 3 términos ($x^2, -7x, 12$).'
  - 'Paso 2: Evaluar el coeficiente del término cuadrático $x^2$: El coeficiente es
    $1$.'
  - 'Paso 3: Identificar los parámetros $p$ y $q$: $p = -7$ y $q = 12$.'
  - 'Conclusión: El polinomio cumple con la forma exacta $x^2 + px + q$ por lo que
    es un trinomio cuadrático mónico.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición matemática indispensable para que un trinomio de
    segundo grado sea mónico?
  choices:
  - text: El coeficiente del término cuadrático $x^2$ debe ser igual a $1$
    is_correct: true
  - text: El término independiente debe ser igual a cero
    is_correct: false
  - text: El término lineal debe tener coeficiente $2$
    is_correct: false
  - text: El trinomio debe carecer de variable $x$
    is_correct: false
  explanation: La alternativa correcta es 'El coeficiente del término cuadrático $x^2$
    debe ser igual a $1$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el trinomio mónico $x^2 - 7x + 12$, ¿cuáles son los valores de los
    parámetros $p$ y $q$?
  choices:
  - text: $p = -7$ y $q = 12$
    is_correct: true
  - text: $p = 7$ y $q = -12$
    is_correct: false
  - text: $p = 1$ y $q = 12$
    is_correct: false
  - text: $p = -7x$ y $q = 12x$
    is_correct: false
  explanation: La alternativa correcta es '$p = -7$ y $q = 12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el polinomio tenga 3 términos ordenados por grado decreciente.'
- 'Paso 2: Comprobar que el coeficiente que acompaña a $x^2$ sea exactamente 1.'
- 'Paso 3: Identificar los valores numéricos de $p$ (coeficiente lineal) y $q$ (término
  independiente).'
errores_correccion: '- **Error 1: Clasificar el trinomio $3x^2 + 5x + 2$ como mónico.**
  **Cómo corregirlo:** Si el coeficiente de $x^2$ es distinto de 1 (en este caso 3),
  el trinomio es NO mónico o compuesto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es el trinomio $x^2 + 4x - 21$ cuadrático mónico?
  alternativas:
  - Sí, con $p = 4$ y $q = -21$
  - No, porque $q$ es negativo
  - No, porque tiene 3 términos
  respuesta: Sí, con $p = 4$ y $q = -21$
  solucion_pasos:
  - 1. Coeficiente de $x^2$ es 1.
  - 2. $p = 4, q = -21$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes expresiones representa un trinomio cuadrático
    mónico?
  alternativas:
  - $x^2 - 9x + 20$
  - $2x^2 + 5x + 3$
  - $5x + 10$
  respuesta: $x^2 - 9x + 20$
  solucion_pasos:
  - 1. $x^2 - 9x + 20$ tiene 3 términos y el coeficiente de $x^2$ es 1.
- titulo: En el polinomio $x^2 - x - 6$, ¿el coeficiente $p$ es igual a $-1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-x$ implica un coeficiente implícito de $-1$.
- titulo: ¿Un trinomio cuadrático con coeficiente principal igual a $4$ se considera
    mónico?
  respuesta: 'No'
  solucion_pasos:
  - No, requiere que el coeficiente principal sea 1.
errores_frecuentes:
- Declarar que un trinomio es mónico cuando su término independiente $q$ es igual
  a $1$.
- Declarar que la presencia del exponente $2$ convierte automáticamente a cualquier
  polinomio en mónico sin evaluar el coeficiente $a$.
- Declarar que el parámetro $p$ incluye a la variable $x$ en lugar de ser solo su
  coeficiente numérico.
- Declarar que los trinomios mónicos solo pueden tener términos positivos.
- Descartar la monisidad si el coeficiente lineal $p$ es cero.
afirmaciones_verdaderas:
- Un trinomio cuadrático mónico posee coeficiente $a = 1$ en el término $x^2$.
- Los parámetros $p$ y $q$ representan los coeficientes numéricos del término lineal
  e independiente respectivamente.
al_terminar_debes_poder: Al terminar serás capaz de identificar trinomios cuadráticos
  mónicos y extraer sus parámetros $p$ y $q$.
