semantic_id: MAT.ALG.FACTOR_TRINOMIOS.RECONOCIMIENTO_SIMPLE
resumen_inicial: El reconocimiento del trinomio cuadrático mónico consiste en identificar expresiones polinómicas de la forma
  $x^2 + px + q$ donde el coeficiente cuadrático es idénticamente 1 y los términos no forman un trinomio cuadrado perfecto.
explicacion_simple: "Un **trinomio cuadrático mónico** (ej: $x^2 + 5x + 6$):\n- **CARACTERÍSTICAS CLAVE**:\n  1. **Posee 3\
  \ términos**: Un término cuadrático ($x^2$), un término lineal ($px$) y un término constante ($q$).\n  2. **Coeficiente\
  \ principal igual a 1 (Mónico)**: El término $x^2$ está solo, no tiene un número multiplicándolo distinto de 1 (es $1x^2$).\n\
  \  3. **NO es un Trinomio Cuadrado Perfecto**: Si calculas el doble producto de las raíces de los extremos, ¡no coincide\
  \ con el término central! (En $x^2 + 5x + 6$, $\\sqrt{6}$ no es exacta y $2 \\cdot x \\cdot \\sqrt{6} \\neq 5x$).\n\n![Reconocimiento\
  \ del trinomio cuadrático mónico](/static/img/nodos/reconocimiento-del-trinomio-cuadratico-monico-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la función polinómica trinomial $P(x) \in \mathbb{R}[x]$. Se define como un **trinomio cuadrático mónico no perfecto**
  si adopta la forma canónica de segundo grado:


  $$P(x) = x^2 + px + q \quad \text{con } p, q \in \mathbb{R}$$


  donde satisface las restricciones estructurales:

  - **Condición mónica**: $\operatorname{coef}(x^2) = 1$.

  - **Condición no cuadrada perfecta**: $\Delta = p^2 - 4q \neq 0$ (el discriminante no es nulo).


  ### Síntesis didáctica

  Reconocer un trinomio mónico es el primer paso para aplicar el método de búsqueda de dos números $r$ y $s$ que sumen $p$
  y multipliquen $q$.

  '
definiciones_clave: '- **Trinomio mónico**: Polinomio de grado 2 cuyo coeficiente del término de mayor exponente $x^2$ es
  igual a 1.

  - **Término lineal ($px$)**: Componente de primer grado cuyo coeficiente $p$ representa la suma de los números buscados
  ($p = r + s$).

  - **Término independiente ($q$)**: Componente constante sin variable cuyo valor representa el producto de los números buscados
  ($q = r \cdot s$).

  '
propiedades_relaciones: '- **Forma general de factores**: Se factoriza en la forma $(x + r)(x + s)$ mediante la búsqueda del
  par numérico $(r, s)$.

  '
ejemplo_guiado:
  enunciado: Verifica si la expresión $x^2 - 7x + 12$ es un trinomio cuadrático mónico no perfecto.
  pasos:
  - 'Paso 1: Contamos el número de términos: Tiene 3 términos ($x^2$, $-7x$, $12$).'
  - 'Paso 2: Verificamos el coeficiente de $x^2$: Su coeficiente es $1$ (es $1x^2$).'
  - 'Paso 3: Evaluamos si es un TCP: - Raíz de $x^2 = x$. - Raíz de $12 = \sqrt{12} \approx 3.46$ (no entera). - Doble producto
    no coincide con $7x$.'
  - 'Conclusión: La expresión **es un trinomio cuadrático mónico no perfecto** de la forma $x^2 + px + q$ con $p = -7$ y $q
    = 12$.'
  imagen: /static/img/nodos/reconocimiento-del-trinomio-cuadratico-monico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condiciones caracterizan a un trinomio cuadrático mónico de la forma $x^2 + px + q$?
  choices:
  - text: Consta de 3 términos donde el coeficiente de $x^2$ es igual a 1, con un término lineal $px$ y uno constante $q$
    is_correct: true
  - text: Tiene 2 términos y el coeficiente de $x^2$ es 3
    is_correct: false
  - text: Es un trinomio cuadrado perfecto de la forma $(x+a)^2$
    is_correct: false
  - text: No contiene término constante $q$
    is_correct: false
  explanation: La alternativa correcta es 'Consta de 3 términos donde el coeficiente de $x^2$ es igual a 1, con un término
    lineal $px$ y uno constante $q$'. Coeficiente mónico 1 + forma $x^2 + px + q$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el trinomio mónico $x^2 + 8x + 15$, ¿cuáles son los valores de los parámetros $p$ y $q$?
  choices:
  - text: El parámetro lineal es $p = 8$ y el parámetro constante es $q = 15$
    is_correct: true
  - text: El parámetro es $p = 15$ y $q = 8$
    is_correct: false
  - text: El parámetro es $p = 1$ y $q = 8$
    is_correct: false
  - text: El parámetro es $p = 2$ y $q = 15$
    is_correct: false
  explanation: La alternativa correcta es 'El parámetro lineal es $p = 8$ y el parámetro constante es $q = 15$'. Identificación
    directa en $x^2 + px + q$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que la expresión tenga exactamente 3 términos.'
- 'Paso 2: Verificar que el coeficiente del término de segundo grado $x^2$ sea idénticamente 1.'
- 'Paso 3: Identificar el coeficiente del término de primer grado $p$ y el término constante $q$.'
- 'Paso 4: Descartar que se trate de un trinomio cuadrado perfecto.'
errores_correccion: '- **Error 1:** Tratar un trinomio no mónico (como $2x^2 + 5x + 3$) como si fuese mónico. **Cómo corregirlo:**
  Si el coeficiente de $x^2$ es distinto de 1, **NO ES MÓNICO Y SE DEBE USAR EL MÉTODO PARA TRINOMIOS DE LA FORMA $ax^2 +
  bx + c$**.

  - **Error 2:** Intercambiar el parámetro lineal $p$ con el parámetro constante $q$. **Cómo corregirlo:** El parámetro $p$
  **ES EL COEFICIENTES DE $x$, MIENTRAS QUE $q$ ES EL NÚMERO LIBRE SIN VARIABLE**.

  '
ejemplos:
- titulo: Coeficiente mónico
  enunciado: Para $x^2 - 5x + 6$, ¿es su coeficiente de $x^2$ igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, es $1x^2$.
- titulo: Identificación de p
  enunciado: En $x^2 + 9x + 20$, ¿es $p = 9$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el coeficiente lineal es 9.
- titulo: Identificación de q
  enunciado: En $x^2 - 4x - 12$, ¿es $q = -12$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la constante es -12.
- titulo: Trinomio no mónico
  enunciado: ¿Es $3x^2 + 7x + 2$ un trinomio mónico?
  respuesta: 'No'
  solucion_pasos:
  - No, su coeficiente principal es 3.
errores_frecuentes:
- Aplicar reglas de trinomios mónicos a trinomios cuyo coeficiente principal es distinto de 1.
- Intercambiar los roles de los coeficientes p y q al plantear las ecuaciones de búsqueda.
- Ignorar los signos negativos de p o q al identificar los parámetros.
- Intercambiar el trinomio mónico no perfecto con un trinomio cuadrado perfecto.
- Olvidar ordenar el polinomio de forma descendente antes de identificar p y q.
afirmaciones_verdaderas:
- Un trinomio cuadrático mónico es de la forma $x^2 + px + q$ con coeficiente principal 1.
- El coeficiente $p$ acompaña a la variable $x$ y el coeficiente $q$ es la constante independiente.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/reconocimiento-del-trinomio-cuadratico-monico-resumen.svg)


  QUÉ: Reconocer trinomios cuadráticos mónicos de la forma x² + px + q identificando sus coeficientes p y q.

  CÓMO: Verificar que el polinomio conste de 3 términos con coeficiente principal $\operatorname{coef}(x^2) = 1$ y discriminante
  $\Delta = p^2 - 4q \neq 0$, aislando el término lineal $p$ y el término constante $q$.

  '
