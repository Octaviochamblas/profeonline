semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.ABSORCION_INTERSECCION
resumen_inicial: 'Demostración lógica, propiedades y consecuencias de las leyes de absorción de la intersección: $A \cap (A \cup B) = A$ y anulación $A \cap \emptyset = \emptyset$.'
explicacion_simple: |
  La **propiedad de absorción de la intersección** se presenta en dos formas clave:
  1. **Absorción conjuntista**: Al intersectar un conjunto $A$ con la unión de $A$ y $B$, el resultado es simplemente el propio conjunto $A$: **$A \cap (A \cup B) = A$**. Esto ocurre porque todos los elementos de $A$ están contenidos dentro de la unión $A \cup B$, por lo que la parte común es el propio $A$.
  2. **Absorción nula (anulación)**: Al intersectar cualquier conjunto $A$ con el conjunto vacío $\emptyset$, el resultado es el conjunto vacío: **$A \cap \emptyset = \emptyset$** (el vacío absorbe y anula la intersección).
explicacion_formal: |
  ### Definición formal
  En la teoría de conjuntos y el retículo booleano $(\mathcal{P}(\mathcal{U}), \cup, \cap)$, las **leyes de absorción de la intersección** son:
  1. **Ley de absorción reticular**:
     $$\forall A, B \subseteq \mathcal{U}, \quad A \cap (A \cup B) = A$$
     Demostración formal: Como $A \subseteq (A \cup B)$, aplicando la propiedad general de intersección con inclusión $X \subseteq Y \implies X \cap Y = X$, se deduce inmediatamente que $A \cap (A \cup B) = A$.
  2. **Ley de anulación / absorción vacía**:
     $$\forall A \subseteq \mathcal{U}, \quad A \cap \emptyset = \emptyset$$
     Demostración: $x \in (A \cap \emptyset) \iff x \in A \land x \in \emptyset \iff x \in A \land F \iff F \iff x \in \emptyset$.

  ### Desglose simbólico
  - Tautologías lógicas subyacentes:
    - Absorción lógica: $P \land (P \lor Q) \equiv P$.
    - Dominación lógica conjuntiva: $P \land F \equiv F$.
  - Invarianza en diagramas de Venn: La intersección entre el círculo $A$ y la superficie total de $A \cup B$ coincide con el círculo $A$.

  ### Síntesis didáctica
  La absorción de la intersección colapsa estructuras complejas eliminando términos redundantes más amplios.
definiciones_clave: |
  - **Ley de absorción de la intersección**: Identidad $A \cap (A \cup B) = A$.
  - **Elemento absorbente (anulación)**: El conjunto $\emptyset$ que anula a cualquier conjunto bajo la intersección ($A \cap \emptyset = \emptyset$).
  - **Inclusión dominante**: Principio por el cual la intersección con un conjunto contenedor devuelve el conjunto contenido.
propiedades_relaciones: |
  - **Dualidad con la unión**: La ley dual de absorción para la unión es $A \cup (A \cap B) = A$ y $A \cup \mathcal{U} = \mathcal{U}$.
  - **Axioma de retículo**: Junto con la absorción de la unión, define la compatibilidad algebraica de las operaciones reticulares.
ejemplo_guiado:
  enunciado: 'Dados los conjuntos $A = \{a, b\}$ y $B = \{b, c, d\}$, demuestra por extensión que $A \cap (A \cup B) = A$.'
  pasos:
    - 'Paso 1: Calcular la unión del paréntesis $A \cup B$:
      - $A \cup B = \{a, b\} \cup \{b, c, d\} = \{a, b, c, d\}$.'
    - 'Paso 2: Plantear la intersección de $A$ con la unión calculada:
      - $A \cap (A \cup B) = \{a, b\} \cap \{a, b, c, d\}$.'
    - 'Paso 3: Extraer los elementos comunes a ambos conjuntos:
      - Elementos comunes: $\{a, b\}$.'
    - 'Paso 4: Comparar con el conjunto original: $\{a, b\} = A$.'
    - 'Paso 5: Concluir formalmente que $A \cap (A \cup B) = A$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A qué equivale directamente la expresión booleana $M \cap (M \cup N)$ por la ley de absorción?'
    choices:
      - {text: '$M$', is_correct: true}
      - {text: '$N$', is_correct: false}
      - {text: '$M \cup N$', is_correct: false}
      - {text: '$\emptyset$', is_correct: false}
    explanation: 'La alternativa correcta es ''$M$''. La ley de absorción de la intersección establece que $M \cap (M \cup N) = M$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de operar cualquier conjunto $A$ con el conjunto vacío mediante la intersección: $A \cap \emptyset$?'
    choices:
      - {text: '$\emptyset$ (el conjunto vacío absorbe y anula la intersección)', is_correct: true}
      - {text: '$A$', is_correct: false}
      - {text: '$\mathcal{U}$', is_correct: false}
      - {text: '$A^c$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\emptyset$ (el conjunto vacío absorbe y anula la intersección)''. El conjunto vacío es el absorbente de la intersección.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar en una expresión la estructura $A \cap (A \cup B)$ o $A \cap \emptyset$.'
  - 'Paso 2: Comprobar que el término exterior $A$ se repite dentro de la unión subordinada.'
  - 'Paso 3: Aplicar la ley lógica $P \land (P \lor Q) \equiv P$ para colapsar toda la expresión en $A$.'
  - 'Paso 4: Si se trata de $A \cap \emptyset$, aplicar la ley de dominación $P \land F \equiv F$ para colapsar en $\emptyset$.'
errores_correccion: |
  - **Error 1:** Desarrollar distributivamente $A \cap (A \cup B)$ como $(A \cap A) \cup (A \cap B) = A \cup (A \cap B)$ sin aplicar la absorción directa. **Cómo corregirlo:** La ley de absorción permite colapsar directamente la expresión en $A$ en un solo paso formal.
  - **Error 2:** Creer que $A \cap \emptyset = A$. **Cómo corregirlo:** En la intersección con el vacío el resultado es siempre $\emptyset$ (absorbente); el que da $A$ es la unión $A \cup \emptyset = A$ (neutro).
ejemplos:
  - titulo: 'Absorción con números primos'
    enunciado: 'Dado $A = \{2, 3\}$ y $B = \{5, 7\}$, ¿cuál es $A \cap (A \cup B)$?'
    alternativas:
      - '$\{2, 3\}$'
      - '$\emptyset$'
      - '$\{2, 3, 5, 7\}$'
    respuesta: '$\{2, 3\}$'
    solucion_pasos:
      - '1. Por la ley de absorción de la intersección, el resultado es $A = \{2, 3\}$.'
  - titulo: 'Absorción del vacío con el universo'
    enunciado: '¿Cuánto vale $\mathcal{U} \cap \emptyset$?'
    respuesta: '$\emptyset$'
    solucion_pasos:
      - 'El conjunto vacío anula la intersección con cualquier conjunto.'
  - titulo: 'Simplificación de bloque'
    enunciado: 'Simplifica $(X \cap Y) \cap ((X \cap Y) \cup Z)$.'
    respuesta: '$X \cap Y$'
    solucion_pasos:
      - 'Llamando $W = X \cap Y$, la expresión es $W \cap (W \cup Z) = W = X \cap Y$.'
  - titulo: 'Absorción con complementos'
    enunciado: '¿A qué es igual $A \cap (A \cup A^c)$?'
    respuesta: '$A$'
    solucion_pasos:
      - '$A \cap \mathcal{U} = A$.'
errores_frecuentes:
  - 'La afirmación de que $A \cap (A \cup B)$ es igual a la unión $A \cup B$.'
  - 'La afirmación de que la intersección de un conjunto con el conjunto vacío produce el conjunto $A$.'
  - 'La afirmación de que la ley de absorción de la intersección no es válida para conjuntos con infinitos elementos.'
  - 'La afirmación de que $A \cap (A \cup B)$ depende del orden de los elementos dentro de $B$.'
  - 'La afirmación de que la intersección $A \cap \emptyset$ produce el número cero escalar.'
afirmaciones_verdaderas:
  - 'La ley de absorción de la intersección establece que $A \cap (A \cup B) = A$ para cualquier par de conjuntos $A$ y $B$.'
  - 'El conjunto vacío $\emptyset$ es el elemento absorbente de la intersección, cumpliendo $A \cap \emptyset = \emptyset$ para todo $A \subseteq \mathcal{U}$.'
al_terminar_debes_poder: |
  QUÉ: Enunciar, demostrar y aplicar las leyes de absorción de la intersección ($A \cap (A \cup B) = A$ y $A \cap \emptyset = \emptyset$).
  CÓMO: Simplificar expresiones booleanas aplicando la tautología $P \land (P \lor Q) \equiv P$ y la anulación conjuntiva $P \land F \equiv F$.
