semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.POTENCIA
resumen_inicial: 'Aplicación de la propiedad del logaritmo de una potencia: conceptos,
  asíntotas, propiedades e inversidad en Logaritmos y sus propiedades.'
explicacion_simple: Cuando el argumento de un logaritmo está elevado a una potencia,
  ese exponente puede "bajarse" como factor multiplicando al logaritmo.
explicacion_formal: '### Definición formal


  Para $b>0$, $b\neq1$, $x>0$ y $n\in\mathbb{R}$, se cumple $\log_b(x^n)=n\cdot\log_b(x)$.
  Se demuestra definiendo $m=\log_b(x)$, de modo que $b^m=x$; elevando ambos lados
  a $n$: $x^n=(b^m)^n=b^{mn}$, y aplicando el logaritmo se obtiene $\log_b(x^n)=mn=n\cdot\log_b(x)$.


  ### Desarrollo didáctico


  $\log_2(8^2)=2\cdot\log_2(8)=2\cdot3=6$, lo mismo que calcular directamente $\log_2(64)=6$.
  La propiedad también funciona con exponentes fraccionarios: $\log_9(9^{1/2})=\frac{1}{2}\cdot\log_9(9)=\frac{1}{2}$.'
definiciones_clave: '- **Aplicación de la propiedad del logaritmo de una potencia**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a aplicación de la propiedad del logaritmo de una potencia.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de aplicación
    de la propiedad del logaritmo de una potencia.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de aplicación de la propiedad
    del logaritmo de una potencia.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    aplicación de la propiedad del logaritmo de una potencia?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en logaritmos y sus
      propiedades
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en logaritmos y sus propiedades. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en aplicación de la propiedad del logaritmo de una potencia?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el exponente del argumento dentro del logaritmo.'
- 'Paso 2: Traslada ese exponente como coeficiente que multiplica al logaritmo.'
- 'Paso 3: Simplifica el logaritmo resultante si corresponde.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en aplicación
  de la propiedad del logaritmo de una potencia.
ejemplos:
- titulo: Aplicación con exponente entero
  enunciado: Simplifica $\log_5(25^3)$.
  solucion_pasos:
  - Se traslada el exponente: $3\cdot\log_5(25)$.
  - Como $\log_5(25)=2$, el resultado es $3\cdot2=6$.
- titulo: Aplicación con exponente fraccionario
  enunciado: Simplifica $\log_4(4^{1/2})$.
  solucion_pasos:
  - Se traslada el exponente: $\frac{1}{2}\cdot\log_4(4)$.
  - Como $\log_4(4)=1$, el resultado es $\frac{1}{2}$.
- titulo: ¿La propiedad de la potencia funciona con exponentes negativos?
  enunciado: ¿Se cumple $\log_b(x^{-n})=-n\cdot\log_b(x)$?
  respuesta: Sí
  solucion_pasos:
  - La propiedad es válida para cualquier exponente real, incluidos los negativos.
- titulo: ¿Se puede aplicar esta propiedad si el argumento es negativo?
  enunciado: ¿Se puede aplicar $\log_b(x^n)=n\cdot\log_b(x)$ si $x<0$?
  respuesta: 'No'
  solucion_pasos:
  - Se exige $x>0$ para que $\log_b(x)$ esté definido en el lado derecho de la igualdad.
errores_frecuentes:
- Olvidar trasladar el exponente completo, incluido su signo, al aplicar la propiedad.
- Confundir $\log_b(x^n)$ con $(\log_b(x))^n$, que no son expresiones equivalentes.
- Aplicar la propiedad sin verificar que el argumento base $x$ sea positivo.
- No simplificar el logaritmo resultante cuando corresponde un valor numérico exacto.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando aplicación de la propiedad del logaritmo de una potencia.
