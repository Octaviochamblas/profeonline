semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.POTENCIA
resumen_inicial: 'El logaritmo de una potencia es igual al producto del exponente por el logaritmo de la base del argumento: $\log_b(x^n) = n \cdot \log_b(x)$.'
explicacion_simple: |
  La propiedad del logaritmo de una potencia es una de las más útiles en álgebra. Nos permite "bajar" cualquier exponente $n$ que esté atrapado dentro del argumento y colocarlo multiplicando libremente por delante del logaritmo. Por ejemplo, en lugar de calcular $\log_2(8^4)$ elevando $8^4 = 4096$, simplemente bajamos el $4$ y multiplicamos: $4 \cdot \log_2(8) = 4 \cdot 3 = 12$.
explicacion_formal: |
  ### Definición formal
  Para toda base $b \in \mathbb{R}^+ \setminus \{1\}$, cualquier argumento positivo $x \in \mathbb{R}^+$ y cualquier exponente real $n \in \mathbb{R}$, la **propiedad del logaritmo de una potencia** establece la identidad fundamental:
  $$\log_b(x^n) = n \cdot \log_b(x)$$

  ### Demostración formal
  Sea $u = \log_b(x) \implies x = b^u$.
  Elevando ambos miembros a la potencia $n$:
  $$x^n = (b^u)^n = b^{n \cdot u}$$
  Aplicando la definición de logaritmo a $x^n = b^{n \cdot u}$:
  $$\log_b(x^n) = n \cdot u = n \cdot \log_b(x) \quad \blacksquare$$

  ### Síntesis didáctica
  Aplicación a raíces (exponentes fraccionarios): Como una raíz $n$-ésima se expresa como potencia fraccionaria $\sqrt[n]{x} = x^{1/n}$, el logaritmo de una raíz extrae la fracción multiplicativa:
  $$\log_b(\sqrt[n]{x}) = \log_b\left(x^{1/n}\right) = \frac{1}{n} \cdot \log_b(x)$$
definiciones_clave: |
  - **Propiedad de la potencia $\log_b(x^n) = n \cdot \log_b(x)$**: Identidad que extrae el exponente interno $n$ como factor multiplicativo externo.
  - **Extracción de exponentes**: Proceso de liberar exponentes atados a variables dentro del argumento.
  - **Logaritmo de una raíz**: Aplicación $\log_b(\sqrt[n]{x}) = \frac{1}{n} \log_b(x)$ resultante de convertir el radical a exponente fraccionario.
propiedades_relaciones: |
  - **Extracción de potencias en ecuaciones exponenciales**: Al aplicar logaritmos a ambos lados de $a^x = b$, la propiedad permite bajar la incógnita: $x \cdot \ln(a) = \ln(b) \implies x = \frac{\ln(b)}{\ln(a)}$.
  - **Propiedad inversa de introducción de coeficiente**: Un factor multiplicativo $n \cdot \log_b(x)$ puede reingresarse como exponente del argumento: $\log_b(x^n)$.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad de la potencia en los siguientes ejercicios: A) Calcula $\log_3(9^5)$, B) Simplifica $\ln(\sqrt{e^3})$, C) Reintroduce el coeficiente en $3 \cdot \log_2(x)$.'
  pasos:
    - 'Paso 1: Para $\log_3(9^5)$, bajamos el exponente $5$: $5 \cdot \log_3(9) = 5 \cdot 2 = 10$.'
    - 'Paso 2: Para $\ln(\sqrt{e^3})$, escribimos el radical como potencia: $\ln(e^{3/2}) = \frac{3}{2} \cdot \ln(e) = \frac{3}{2} \cdot 1 = \frac{3}{2}$.'
    - 'Paso 3: Para $3 \cdot \log_2(x)$, introducimos el factor 3 como exponente de $x$: $\log_2(x^3)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del logaritmo $\log_5(25^4)$ obtenido al aplicar la propiedad de la potencia del argumento?'
    choices:
      - {text: '$8$, bajando el exponente $4 \cdot \log_5(25) = 4 \cdot 2 = 8$', is_correct: true}
      - {text: '$100$, elevando $25 \cdot 4 = 100$', is_correct: false}
      - {text: '$16$, calculando $4^2 = 16$', is_correct: false}
      - {text: '$2$, dividiendo $8 / 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$8$, bajando el exponente $4 \cdot \log_5(25) = 4 \cdot 2 = 8$''. La propiedad permite multiplicar el exponente 4 por el resultado del logaritmo base.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se sabe que $\log_b(x) = 1.2$, ¿cuál es el valor exacto de $\log_b(\sqrt[3]{x^2})$?'
    choices:
      - {text: '$0.8$, expresando el argumento como $x^{2/3}$ y multiplicando $\frac{2}{3} \cdot 1.2 = 0.8$', is_correct: true}
      - {text: '$3.6$, multiplicando $3 \cdot 1.2 = 3.6$', is_correct: false}
      - {text: '$2.4$, multiplicando $2 \cdot 1.2 = 2.4$', is_correct: false}
      - {text: '$0.4$, dividiendo $1.2 / 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$0.8$, expresando el argumento como $x^{2/3}$ y multiplicando $\frac{2}{3} \cdot 1.2 = 0.8$''. $\sqrt[3]{x^2} = x^{2/3} \implies \frac{2}{3} \log_b(x) = \frac{2}{3} \cdot 1.2 = 0.8$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el exponente $n$ que afecta al argumento completo dentro del logaritmo.'
  - 'Paso 2: Si el argumento es un radical $\sqrt[k]{x^m}$, convertirlo a exponente fraccionario $x^{m/k}$.'
  - 'Paso 3: Extraer el exponente $n$ multiplicándolo libremente por fuera del logaritmo: $n \cdot \log_b(x)$.'
  - 'Paso 4: Evaluar el logaritmo simplificado y multiplicar por el coeficiente $n$.'
errores_correccion: |
  - **Error 1:** Elevar todo el logaritmo al exponente en lugar de elevar solo el argumento (ej: confundir $\log_b(x^n)$ con $(\log_b(x))^n$). **Cómo corregirlo:** La propiedad $\log_b(x^n) = n \cdot \log_b(x)$ aplica únicamente cuando el exponente $n$ pertenece al argumento interno $x$, no a todo el logaritmo.
  - **Error 2:** Olvidar convertir los radicales a potencias fraccionarias. **Cómo corregirlo:** Para evaluar $\log_b(\sqrt{x})$, escribir siempre $x^{1/2}$ para aplicar la propiedad: $\frac{1}{2} \log_b(x)$.
ejemplos:
  - titulo: 'Extracción de exponente entero'
    enunciado: '¿A qué equivale $\log_2(2^{10})$ usando la propiedad de potencia?'
    alternativas:
      - '$10 \cdot \log_2(2) = 10$'
      - '$20$'
      - '$100$'
    respuesta: '$10 \cdot \log_2(2) = 10$'
    solucion_pasos:
      - '1. Bajamos el exponente: $10 \cdot \log_2(2)$.'
      - '2. Como $\log_2(2) = 1$, el resultado es $10 \cdot 1 = 10$.'
  - titulo: 'Logaritmo de una raíz cuadrada'
    enunciado: '¿La expresión $\log(\sqrt{x})$ equivale a $\frac{1}{2}\log(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Convertimos $\sqrt{x} = x^{1/2} \implies \log(x^{1/2}) = \frac{1}{2}\log(x)$.'
  - titulo: 'Reingreso de coeficiente'
    enunciado: '¿La expresión $4 \cdot \ln(x)$ es equivalente a $\ln(x^4)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Un coeficiente multiplicativo exterior reingresa como exponente del argumento: $\ln(x^4)$.'
  - titulo: 'Exponente negativo en argumento'
    enunciado: '¿El logaritmo $\log_b\left(\frac{1}{x^3}\right)$ equivale a $-3 \log_b(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reescribimos $\frac{1}{x^3} = x^{-3} \implies \log_b(x^{-3}) = -3 \log_b(x)$.'
errores_frecuentes:
  - 'La expresión $\log_b(x^n)$ equivale a elevar todo el logaritmo $(\log_b(x))^n$.'
  - 'El logaritmo de una raíz $\log_b(\sqrt[n]{x})$ es igual a sacar la raíz del logaritmo $\sqrt[n]{\log_b(x)}$.'
  - 'Al bajar el exponente en $\log_2(8^3)$, se obtiene $3 + \log_2(8)$ en lugar de multiplicarlo.'
  - 'La propiedad de la potencia permite bajar exponentes que afectan a la base del logaritmo.'
  - 'Multiplicar un logaritmo por un número $n \cdot \log_b(x)$ equivale a multiplicar el argumento por $n$.'
afirmaciones_verdaderas:
  - 'La propiedad del logaritmo de una potencia establece que $\log_b(x^n) = n \cdot \log_b(x)$ para todo argumento positivo y exponente real $n$.'
  - 'El logaritmo de un radical se simplifica convirtiendo la raíz en exponente fraccionario y extrayéndolo como factor multiplicativo ($\log_b(\sqrt[n]{x}) = \frac{1}{n}\log_b(x)$).'
al_terminar_debes_poder: 'Aplicar la propiedad del logaritmo de una potencia para despejar exponentes y simplificar radicales en expresiones logarítmicas.'
