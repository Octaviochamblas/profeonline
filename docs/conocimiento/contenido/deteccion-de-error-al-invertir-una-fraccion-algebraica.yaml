semantic_id: MAT.ALG.FRACCIONES_DIV.ERROR_RECIPROCO
resumen_inicial: Invertir la fracción incorrecta o alterar parcialmente sus signos al dividir conduce a resultados algebraicos erróneos.
explicacion_simple: |
  En la división de fracciones algebraicas ocurren con frecuencia dos procedimientos erróneos:

  1. Invertir la primera fracción (dividendo) en lugar de la segunda (divisor).

  2. Invertir solo los signos de los términos en vez de intercambiar de posición el numerador y el denominador.

  Detectar estos errores permite asegurar que la transformación a multiplicación sea matemáticamente válida.
explicacion_formal: |
  ### Definición formal
  Sean $F_1 = \frac{A}{B}$ y $F_2 = \frac{C}{D}$. Las **transformaciones erróneas comunes** violan las leyes de equivalencia:

  $$\text{Procedimiento erróneo 1: } \frac{A}{B} \div \frac{C}{D} \neq \frac{B}{A} \cdot \frac{C}{D} \quad \text{(Inversión del dividendo)}$$

  $$\text{Procedimiento erróneo 2: } \frac{A}{B} \div \frac{C}{D} \neq \frac{A}{B} \cdot \frac{-C}{-D} \quad \text{(Cambio de signos en lugar de recíproco)}$$

  ### Desglose de la fórmula
  - La regla de división exige de forma estricta: Mantener el dividendo $\frac{A}{B}$ e invertir la posición del divisor $\frac{C}{D} \implies \frac{D}{C}$.

  ### Síntesis didáctica
  Identificar la inversión indebida del dividendo o la alteración de signos evita fallas conceptuales en la transformación a producto.
definiciones_clave: |
  - **Error de inversión de dividendo**: Transformación errónea por invertir la primera fracción en vez de la segunda.
  - **Error de recíproco por signo**: Confusión al modificar los signos de los términos en lugar de permutar numerador y denominador.
propiedades_relaciones: |
  - **Asimetría de la división**: A diferencia de la multiplicación, la división de fracciones no es conmutativa ($F_1 \div F_2 \neq F_2 \div F_1$).
  - **Unicidad del recíproco**: El único recíproco multiplicativo de $\frac{C}{D}$ es $\frac{D}{C}$.
ejemplo_guiado:
  enunciado: 'Analiza la operación $\frac{x}{3} \div \frac{2}{y}$. Identifica el error en la propuesta $\frac{3}{x} \cdot \frac{2}{y} = \frac{6}{xy}$, corrige la transformación y evalúa la forma correcta para $x = 4, y = 6$.'
  pasos:
    - 'Paso 1: Identificar la falla: La propuesta invirtió el dividendo $\frac{x}{3} \implies \frac{3}{x}$, lo cual altera la equivalencia.'
    - 'Paso 2: Aplicar la regla correcta: Conservar el dividendo $\frac{x}{3}$ e invertir la segunda fracción $\frac{2}{y} \implies \frac{y}{2}$.'
    - 'Paso 3: Escribir el producto correcto: $\frac{x}{3} \cdot \frac{y}{2} = \frac{xy}{6}$.'
    - 'Paso 4: Evaluar la expresión correcta para $x = 4, y = 6$: $\frac{4 \cdot 6}{6} = \frac{24}{6} = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la transformación correcta para calcular $\frac{x}{3} \div \frac{2}{y}$?'
    choices:
      - {text: '$\frac{x}{3} \cdot \frac{y}{2} = \frac{xy}{6}$', is_correct: true}
      - {text: '$\frac{3}{x} \cdot \frac{2}{y} = \frac{6}{xy}$', is_correct: false}
      - {text: '$\frac{x}{3} \cdot \frac{-2}{-y} = \frac{-2x}{-3y}$', is_correct: false}
      - {text: '$\frac{3}{x} \cdot \frac{y}{2} = \frac{3y}{2x}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{x}{3} \cdot \frac{y}{2} = \frac{xy}{6}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar el resultado correcto $\frac{xy}{6}$ para $x = 4$ e $y = 6$, ¿cuál es el valor obtenido?'
    choices:
      - {text: '$4$', is_correct: true}
      - {text: '$\frac{1}{4}$', is_correct: false}
      - {text: '$24$', is_correct: false}
      - {text: '$6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar cuál fracción ocupa la posición de divisor (la segunda fracción tras el signo $\div$).'
  - 'Paso 2: Confirmar que la primera fracción NO haya sido modificada.'
  - 'Paso 3: Comprobar que la segunda fracción haya intercambiado verticalmente su numerador y denominador.'
  - 'Paso 4: Asegurar que no se hayan cambiado los signos de los términos en lugar de invertir sus posiciones.'
  - 'Paso 5: Efectuar el producto de forma horizontal.'
errores_correccion: |
  - **Error 1:** Invertir ambas fracciones antes de efectuar el producto. **Cómo corregirlo:** La primera fracción (dividendo) **DEBE PERMANECER INTACTA; SOLO SE INVIERTE LA SEGUNDA FRACCIÓN (DIVISOR)**.
  - **Error 2:** Alterar los signos de los términos en vez de permutar sus posiciones verticales. **Cómo corregirlo:** El recíproco **CONSERVA LOS SIGNOS DE LOS POLINOMIOS E INTERCAMBIA LA UBICACIÓN DE NUMERADOR Y DENOMINADOR**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Dada la división $\frac{a}{b} \div \frac{c}{d}$, ¿cuál es la transformación correcta a producto?'
    alternativas:
      - '$\frac{a}{b} \cdot \frac{d}{c}$'
      - '$\frac{b}{a} \cdot \frac{c}{d}$'
      - '$\frac{b}{a} \cdot \frac{d}{c}$'
    respuesta: '$\frac{a}{b} \cdot \frac{d}{c}$'
    solucion_pasos:
      - '1. El dividendo $\frac{a}{b}$ se mantiene igual.'
      - '2. El divisor $\frac{c}{d}$ se invierte a $\frac{d}{c}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En la expresión $\frac{x+1}{2} \div \frac{x-1}{3}$, ¿qué transformación es errónea?'
    alternativas:
      - '$\frac{2}{x+1} \cdot \frac{x-1}{3}$'
      - '$\frac{x+1}{2} \cdot \frac{3}{x-1}$'
      - '$\frac{3(x+1)}{2(x-1)}$'
    respuesta: '$\frac{2}{x+1} \cdot \frac{x-1}{3}$'
    solucion_pasos:
      - '1. Invertir la primera fracción en vez de la segunda es una transformación errónea.'
  - titulo: 'Constancia del dividendo'
    enunciado: '¿La primera fracción se mantiene exactamente igual al transformar una división en producto?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el dividendo no cambia de posición al aplicar la propiedad.'
  - titulo: 'Inversión por signo'
    enunciado: '¿Cambiar los signos de $\frac{x}{y}$ a $\frac{-x}{-y}$ equivale a hallar su inverso multiplicativo?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el recíproco exige permutar las posiciones del numerador y del denominador.'
errores_frecuentes:
  - 'Invertir la primera fracción en lugar de la segunda al transformar la división.'
  - 'Modificar los signos de los términos en lugar de permutar las posiciones de numerador y denominador.'
  - 'Invertir ambas fracciones de forma simultánea antes de multiplicar.'
  - 'Multiplicar en cruz habiendo invertido previamente la fracción divisor.'
  - 'Omitir las restricciones del dominio del dividendo al verificar la transformación.'
afirmaciones_verdaderas:
  - 'La primera fracción de una división se mantiene intacta y únicamente se invierte la segunda fracción.'
  - 'El inverso multiplicativo permuta la ubicación vertical del numerador y denominador sin alterar sus signos.'
al_terminar_debes_poder: |
  Detectar y corregir transformaciones erróneas en divisiones de fracciones algebraicas verificando que el dividendo permanezca intacto y solo se invierta el divisor.
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
