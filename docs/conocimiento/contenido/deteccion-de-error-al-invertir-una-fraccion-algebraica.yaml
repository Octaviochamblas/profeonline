semantic_id: MAT.ALG.FRACCIONES_DIV.ERROR_RECIPROCO
resumen_inicial: Invertir la fracción incorrecta o alterar parcialmente sus signos
  al dividir conduce a resultados algebraicos erróneos.
explicacion_simple: 'En la división de fracciones algebraicas ocurren con frecuencia
  dos errores típicos:

  1. Invertir la primera fracción (dividendo) en lugar de la segunda (divisor).

  2. Invertir solo los signos de los términos en vez de intercambiar de posición el
  numerador y el denominador.

  Detectar estos errores permite asegurar que la transformación a multiplicación sea
  matemáticamente correcta.'
explicacion_formal: 'Sean $F_1 = \frac{A}{B}$ y $F_2 = \frac{C}{D}$. Las **transformaciones
  erróneas comunes** violan las leyes de equivalencia:


  $$\text{Error 1: } \frac{A}{B} \div \frac{C}{D} \neq \frac{B}{A} \cdot \frac{C}{D}
  \quad \text{(Inversión del dividendo)}$$

  $$\text{Error 2: } \frac{A}{B} \div \frac{C}{D} \neq \frac{A}{B} \cdot \frac{-C}{-D}
  \quad \text{(Cambio de signos en lugar de recíproco)}$$


  **Desglose de la fórmula:**

  - La regla de división exige de forma estricta: Mantener dividendo $\frac{A}{B}$
  e invertir la posición de divisor $\frac{C}{D} \implies \frac{D}{C}$.'
definiciones_clave: '- **Error de inversión de dividendo**: Fallo por dar vuelta la
  primera fracción en vez de la segunda.

  - **Error de recíproco por signo**: Confusión de cambiar signos a los términos en
  lugar de permutar numerador y denominador.'
propiedades_relaciones: '- **Asimetría de la división**: A diferencia de la multiplicación,
  la división de fracciones NO es conmutativa ($F_1 \div F_2 \neq F_2 \div F_1$).

  - **Unicidad del recíproco**: El único recíproco multiplicativo de $\frac{C}{D}$
  es $\frac{D}{C}$.'
ejemplo_guiado:
  enunciado: Analiza la operación $\frac{x}{3} \div \frac{2}{y}$. Identifica el error
    en la propuesta $\frac{3}{x} \cdot \frac{2}{y} = \frac{6}{xy}$, corrige la transformación
    y evalúa la forma correcta para $x = 4, y = 6$.
  pasos:
  - 'Paso 1: Identificar el error: La propuesta invirtió la primera fracción $\frac{x}{3}
    \implies \frac{3}{x}$, lo cual es incorrecto.Paso 2: Aplicar la regla correcta:
    Conservar la primera fracción $\frac{x}{3}$ e invertir la segunda $\frac{2}{y}
    \implies \frac{y}{2}$.Paso 3: Escribir el producto correcto: $\frac{x}{3} \cdot
    \frac{y}{2} = \frac{xy}{6}$.Paso 4: Evaluar la expresión correcta para $x = 4,
    y = 6$: $\frac{4 \cdot 6}{6} = \frac{24}{6} = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la transformación correcta para calcular $\frac{x}{3} \div \frac{2}{y}$?
  choices:
  - text: $\frac{x}{3} \cdot \frac{y}{2} = \frac{xy}{6}$
    is_correct: true
  - text: $\frac{3}{x} \cdot \frac{2}{y} = \frac{6}{xy}$
    is_correct: false
  - text: $\frac{x}{3} \cdot \frac{-2}{-y} = \frac{-2x}{-3y}$
    is_correct: false
  - text: $\frac{3}{x} \cdot \frac{y}{2} = \frac{3y}{2x}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{x}{3} \cdot \frac{y}{2} = \frac{xy}{6}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar el resultado correcto $\frac{xy}{6}$ para $x = 4$ e $y = 6$,
    ¿cuál es el valor obtenido?
  choices:
  - text: $4$
    is_correct: true
  - text: $\frac{1}{4}$
    is_correct: false
  - text: $24$
    is_correct: false
  - text: $6$
    is_correct: false
  explanation: La alternativa correcta es '$4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar cuál fracción ocupa la posición de divisor (la segunda fracción
  tras el signo $\div$).'
- 'Paso 2: Confirmar que la primera fracción NO haya sido modificada.'
- 'Paso 3: Comprobar que la segunda fracción haya intercambiado verticalmente su numerador
  y denominador.'
- 'Paso 4: Asegurar que no se hayan cambiado los signos de los términos en lugar de
  invertir sus posiciones.'
- 'Paso 5: Efectuar el producto de forma horizontal.'
errores_correccion: '- **Error común:** Dar vuelta ambas fracciones antes de multiplicar.

  - **Cómo corregirlo:** En la división de fracciones, la primera fracción permanece
  intacta. SOLO se invierte la segunda fracción.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de división.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de división.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se invierte la segunda fracción al dividir?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla estándar.
- titulo: ¿La división de fracciones es conmutativa?
  respuesta: 'No'
  solucion_pasos:
  - No, el orden de las fracciones altera el resultado.
errores_frecuentes:
- Invertir la primera fracción en lugar de la segunda al dividir.
- Cambiar de signo los términos en vez de permutar numerador y denominador.
- Olvidar restringir del dominio los ceros del segundo numerador.
- Multiplicar en cruz las fracciones habiendo invertido previamente el divisor.
- Desarrollar productos de polinomios antes de factorizar.
afirmaciones_verdaderas:
- La división de fracciones algebraicas equivale a multiplicar la primera fracción
  por el inverso de la segunda.
- El dominio de una división de fracciones excluye los ceros del primer denominador,
  segundo denominador y segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver divisiones de fracciones
  algebraicas mediante la inversión del divisor y simplificación del cociente.
