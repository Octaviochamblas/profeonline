procedimiento:
- 'Paso 1: Detecta el signo $\div$. Es como un semáforo en rojo para tachar cruzado.'
- 'Paso 2: Inmediatamente invierte la fracción a la derecha y pon un $\cdot$.'
- 'Paso 3: Solo entonces, con luz verde ($\cdot$), busca qué tachar.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en detección de error al invertir una fracción algebraica.
ejemplos:
- titulo: A simple vista, ¿puedes tachar el 5 de $\frac{x}{5} \div \frac{y}{5}$
  enunciado: A simple vista, ¿puedes tachar el 5 de $\frac{x}{5} \div \frac{y}{5}$?
  solucion_pasos:
  - No.
  - Al invertir queda $\frac{x}{5} \cdot \frac{5}{y}$.
  - 'Ahí el 5 sí se tacha, pero como numerador y denominador. Resultado: $\frac{x}{y}$.'
- titulo: En una división, el 'numerador del divisor' se puede cancelar con el 'numerador
    del dividend
  enunciado: En una división, el 'numerador del divisor' se puede cancelar con el
    'numerador del dividendo'.
  solucion_pasos:
  - ¡Sí! Porque al invertir la segunda fracción, ese 'numerador del divisor' bajará
    al denominador, pudiendo entonces cancelar al numerador de la primera (dividendo).
  - 'Respuesta: Verdadero'
- titulo: 'Respecto de «Detección de error al invertir una fracción algebraica»: ¿La
    siguiente formulac'
  enunciado: 'Respecto de «Detección de error al invertir una fracción algebraica»:
    ¿La siguiente formulación es correcta? «REGLA DE ORO: Jamás simplifiques en diagonal
    (cruzado) a través de un signo de división ($\div$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: REGLA DE ORO: Jamás simplifiques
    en diagonal (cruzado) a través de un signo de división ($\div$).'
- titulo: 'Respecto de «Detección de error al invertir una fracción algebraica»: ¿La
    siguiente conclusi'
  enunciado: 'Respecto de «Detección de error al invertir una fracción algebraica»:
    ¿La siguiente conclusión es correcta? «Tachar cruzado sin haber transformado a
    multiplicación»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: REGLA DE ORO: Jamás simplifiques
    en diagonal (cruzado) a través de un signo de división ($\div$).'
errores_frecuentes:
- Tachar cruzado sin haber transformado a multiplicación.
- Voltear la primera fracción (A/B -> B/A).
- Porque la división no es asociativa.
- Porque los números negativos no lo permiten.
- Es correcto, se puede cancelar siempre.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
