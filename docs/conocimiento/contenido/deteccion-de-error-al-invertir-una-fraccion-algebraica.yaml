semantic_id: MAT.ALG.FRACCIONES_DIV.ERROR_RECIPROCO
resumen_inicial: 'Detección de error al invertir una fracción algebraica: concepto,
  reglas operativas y simplificación en División de fracciones algebraicas.'
explicacion_simple: En los nervios del examen, la regla 'Mantener, Cambiar, Voltear'
  se confunde. Al final, los estudiantes voltean lo que no deben o tachan en diagonal
  cuando aún hay un signo de división.
explicacion_formal: '### Definición formal


  El numerador del divisor es, en la práctica, parte del denominador global.


  ### Desarrollo didáctico


  El error más doloroso e imperdonable al dividir fracciones es confundirse de fracción
  y voltear la primera en lugar de la segunda.


  Ejemplo del horror:

  $\frac{x}{y} \div \frac{2}{3}$

  - Estudiante confundido: Voltea la primera $\rightarrow \frac{y}{x} \cdot \frac{2}{3}
  = \frac{2y}{3x}$.

  - Estudiante maestro: Voltea la SEGUNDA $\rightarrow \frac{x}{y} \cdot \frac{3}{2}
  = \frac{3x}{2y}$.


  ¿Ves la diferencia? El resultado es completamente distinto. La división no es conmutativa
  (dividir 10 entre 2 no es lo mismo que dividir 2 entre 10).


  **REGLA:** El signo de división SOLO afecta a la fracción que está a su INMEDIATA
  DERECHA. Esa es la única que tiene permiso para voltearse.'
