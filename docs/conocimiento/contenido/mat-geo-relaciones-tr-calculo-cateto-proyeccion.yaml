semantic_id: MAT.GEO.RELACIONES_TR.CALCULO_CATETO_PROYECCION
resumen_inicial: 'Cálculo de un cateto usando su proyección y la hipotenusa: conceptos,
  teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Con la relación b²=c·m ya establecida, es momento de aplicarla
  directamente para resolver ejercicios numéricos donde se conocen la hipotenusa y
  una proyección.
explicacion_formal: '![Cálculo de un cateto usando su proyección](/static/img/geometria/areas-pitagoras/relaciones-tr-calculo-cateto-proyeccion.svg)


  ### Definición formal


  Si la hipotenusa es $c=18$ y la proyección de un cateto es $m=8$, ese cateto es
  $b=\sqrt{18\times8}=\sqrt{144}=12$.


  ### Desarrollo didáctico


  Este cálculo es una aplicación numérica directa de la relación $b^2=c\cdot m$, útil
  cuando se conocen la hipotenusa completa y una de las dos proyecciones (no ambos
  catetos).'
definiciones_clave: '- **Cálculo de un cateto usando su proyección y la hipotenusa**:
  Elemento o propiedad fundamental en el estudio de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo de un cateto usando su proyección
  y la hipotenusa.'
