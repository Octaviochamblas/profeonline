semantic_id: MAT.GEO.NOTABLES_COINCIDENCIA.EQUILATERO_PUNTOS_NOTABLES
resumen_inicial: 'Coincidencia de ortocentro, incentro, circuncentro y baricentro
  en un triángulo equilátero: conceptos, teoremas, propiedades geométricas y cálculo
  en Elementos Secundarios del Triángulo.'
explicacion_simple: 'Como consecuencia directa de que las rectas notables coinciden
  en el triángulo equilátero, también coinciden los puntos donde esas rectas se cruzan:
  los cuatro puntos notables se reducen a uno solo.'
explicacion_formal: '![Puntos notables coincidentes en triángulo equilátero](/static/img/geometria/elementos-secundarios/notables-coincidencia-equilatero-puntos-notables.svg)


  ### Definición formal


  En un triángulo equilátero, dado que las alturas, bisectrices, simetrales y transversales
  de gravedad coinciden respectivamente en los mismos tres segmentos, sus puntos de
  intersección (ortocentro, incentro, circuncentro y baricentro) coinciden en un único
  punto, llamado centro del triángulo equilátero.


  ### Desarrollo didáctico


  Este punto único cumple, a la vez, todas las propiedades de los cuatro puntos notables:
  es equidistante de los vértices (como el circuncentro) y de los lados (como el incentro),
  y divide cada transversal de gravedad en razón 2:1 (como el baricentro).'
definiciones_clave: '- **Coincidencia de ortocentro, incentro, circuncentro y baricentro
  en un triángulo equilátero**: Elemento o propiedad fundamental en el estudio de
  elementos secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a coincidencia de ortocentro, incentro, circuncentro
  y baricentro en un triángulo equilátero.'
ejemplo_guiado:
  enunciado: En el estudio de coincidencia de ortocentro, incentro, circuncentro y
    baricentro en un triángulo equilátero, un triángulo posee ángulos interiores de
    medidas $102^\circ$, $4534^\circ$ y $\gamma$. Halla el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de coincidencia de ortocentro, incentro, circuncentro
    y baricentro en un triángulo equilátero y la suma de ángulos interiores.
  - 'Plantear la suma: $102^\circ + 4534^\circ + \gamma = 180^\circ \implies 4636^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4636^\circ = -4456^\circ$.
