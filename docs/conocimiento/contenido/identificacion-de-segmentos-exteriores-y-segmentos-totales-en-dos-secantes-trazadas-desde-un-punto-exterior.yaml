semantic_id: MAT.GEO.CIRCULO_TEOREMAS.SECANTES_SEGMENTOS
resumen_inicial: En dos secantes trazadas desde un punto exterior, es fundamental distinguir con precisión el segmento exterior (desde el punto hasta el primer corte) y el segmento total (desde el punto hasta el segundo corte).
explicacion_simple: 'Imagina que estás parado afuera de un campo circular en el punto $P$ y miras a través de una cerca en línea recta: tu mirada atraviesa la cerca en dos puntos: primero en la entrada más cercana ($A$) y luego en la salida del fondo ($B$).


  En esta línea secante existen tres distancias muy diferentes:

  1. **Segmento exterior ($PA$)**: La distancia desde ti hasta la entrada de la cerca.

  2. **Cuerda interior ($AB$)**: El trozo de camino que pasa por dentro del campo.

  3. **Segmento total ($PB$)**: ¡TODO el camino completo desde ti hasta la salida del fondo!


  El segmento total es la suma de ambos: **$\mathbf{PB = PA + AB}$**.


  ¡Esta es la trampa favorita de los exámenes! Muchos estudiantes toman por error la cuerda interior $AB$ creyendo que es el total. Recuerda siempre: **¡el segmento total va desde el punto exterior $P$ hasta el fondo $B$!**


  ![Segmentos de secantes exteriores](/static/img/nodos/identificacion-de-segmentos-exteriores-y-segmentos-totales-en-dos-secantes-trazadas-desde-un-punto-exterior-intro.svg)

  '
explicacion_formal: '### Estructura métrica de rectas secantes desde punto exterior

  Sea $P$ un punto exterior a una circunferencia $\mathcal{C}(O, r)$ ($d(P, O) > r$). Una recta secante que pasa por $P$ interseca a $\mathcal{C}$ en dos puntos distintos $A$ y $B$, donde $d(P, A) < d(P, B)$.


  Por ordenación euclidiana sobre la recta, los puntos satisfacen la relación $P - A - B$. Se definen rigurosamente:

  - **Segmento exterior**: El segmento $\overline{PA}$, de longitud $PA = d(P, A)$, contenido íntegramente en el exterior del círculo a excepción del punto $A \in \mathcal{C}$.

  - **Cuerda secante interior**: El segmento $\overline{AB}$, de longitud $AB = d(A, B)$, cuyos puntos interiores pertenecen a $\text{Int}(\mathcal{C})$.

  - **Segmento total**: El segmento $\overline{PB}$, de longitud:

  $$PB = PA + AB$$


  Si se traza una segunda secante por $P$ que corta en $C$ y $D$ con $d(P, C) < d(P, D)$, se define análogamente su segmento exterior $PC$ y su segmento total $PD = PC + CD$.


  > **Complemento didáctico:** Jamás uses la cuerda interior suelta en una fórmula de secantes. Cada vez que leas los datos de un problema, escribe al lado de inmediato: `Exterior = PA`, `Cuerda = AB`, y calcula al tiro `Total = PA + AB`. ¡Hacer esto te garantizará resolver cualquier ejercicio sin equivocarte!

  '
definiciones_clave: '- **Punto exterior ($P$)**: Vértice común fuera de la circunferencia de donde parten las secantes.

  - **Segmento exterior ($PA$)**: Tramo desde $P$ hasta el primer punto de intersección.

  - **Segmento total ($PB$)**: Longitud total desde $P$ hasta el segundo punto de corte ($PB = PA + AB$).

  '
propiedades_relaciones: '- **Relación aditiva fundamental**: $\text{Total} = \text{Exterior} + \text{Cuerda} \iff PB = PA + AB$.

  - **Despeje de cuerda interior**: $AB = PB - PA$.

  - **Desigualdad estricta**: $PB > PA$ y $PD > PC$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de identificación de segmentos secantes](/static/img/nodos/identificacion-de-segmentos-exteriores-y-segmentos-totales-en-dos-secantes-trazadas-desde-un-punto-exterior-ejemplos.svg)


    Desde un punto exterior $P$ se trazan dos secantes. En la primera secante, el segmento exterior mide $PA = 4\text{ cm}$ y la cuerda interior mide $AB = 8\text{ cm}$. En la segunda secante, el segmento total mide $PD = 16\text{ cm}$ y el segmento exterior mide $PC = 3\text{ cm}$. Halla el segmento total de la primera secante y la cuerda interior de la segunda.'
  pasos:
  - 'Paso 1: Calcular el segmento total de la primera secante sumando exterior y cuerda: $PB = PA + AB = 4 + 8 = 12\text{ cm}$.'
  - 'Paso 2: Identificar los datos de la segunda secante: $PC = 3\text{ cm}$ (exterior) y $PD = 16\text{ cm}$ (total).'
  - 'Paso 3: Calcular la cuerda interior de la segunda secante restando total menos exterior: $CD = PD - PC = 16 - 3 = 13\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si en una recta secante desde un punto exterior P el segmento exterior mide PA = 5 cm y la cuerda interior mide AB = 9 cm, ¿cuánto mide el segmento total PB?
  choices:
  - text: 14 cm.
    is_correct: true
  - text: 9 cm.
    is_correct: false
  - text: 45 cm.
    is_correct: false
  - text: 4 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''14 cm.'' El segmento total es la suma del segmento exterior más la cuerda interior: $PB = PA + AB = 5 + 9 = 14\text{ cm}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa la cuerda interior AB en relación con el segmento total PB?
  choices:
  - text: 'Es la diferencia entre el segmento total y el segmento exterior: AB = PB - PA.'
    is_correct: true
  - text: Es exactamente igual al segmento total PB.
    is_correct: false
  - text: Es el producto del exterior por el total.
    is_correct: false
  - text: Es la mitad del radio.
    is_correct: false
  explanation: 'La alternativa correcta es ''Es la diferencia entre el segmento total y el segmento exterior: AB = PB - PA.'' La cuerda interna es solo una porción del segmento total.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Ubicar el punto exterior $P$ y las rectas secantes trazadas.

  2. Identificar en cada secante el primer corte (punto cercano $A$) y el segundo corte (punto lejano $B$).

  3. Definir el segmento exterior como $PA$.

  4. Definir el segmento total como $PB = PA + AB$, sumando el exterior con la cuerda interior.

  '
errores_correccion: '- **Error común 1:** Confundir la cuerda interna $AB$ con el segmento total $PB$. **Corrección:** El segmento total parte de $P$ y llega hasta $B$ ($PB = PA + AB$).

  - **Error común 2:** Usar solo la cuerda interior en los teoremas métricos. **Corrección:** Los teoremas métricos emplean SIEMPRE el segmento total, nunca la cuerda interior aislada.

  '
ejemplos:
- tipo: A
  titulo: Cálculo de segmento total
  enunciado: Desde un punto exterior $P$, una secante corta a la circunferencia en $A$ y $B$. Si $PA = 6\text{ cm}$ y $AB = 10\text{ cm}$, ¿cuál es el valor del segmento total $PB$?
  alternativas:
  - text: $16\text{ cm}$.
    is_correct: true
  - text: $10\text{ cm}$.
    is_correct: false
  - text: $60\text{ cm}$.
    is_correct: false
  - text: $4\text{ cm}$.
    is_correct: false
  explicacion: $PB = PA + AB = 6 + 10 = 16\text{ cm}$.
- tipo: B
  titulo: Segmento total aditivo
  enunciado: ¿Es el segmento total de una secante igual a la suma del segmento exterior más la cuerda interior?
  respuesta: Sí
  explicacion: Sí. Por orden de puntos sobre la secante, $PB = PA + AB$ de manera estricta.
errores_frecuentes:
- '''Confundir la cuerda interna con el segmento total de la secante.'''
- '''Olvidar sumar el segmento exterior a la cuerda para obtener la longitud total.'''
- '''Multiplicar las dos partes en vez de sumarlas para hallar el segmento total.'''
afirmaciones_verdaderas:
- '''El segmento exterior mide la distancia desde el punto $P$ hasta el primer punto de intersección con la curva.'''
- '''El segmento total es la suma de la parte exterior y la cuerda interior ($PB = PA + AB$).'''
- '''El segmento total es estrictamente mayor que el segmento exterior ($PB > PA$).'''
al_terminar_debes_poder: '**QUÉ:** Identificar y calcular segmentos exteriores, cuerdas interiores y segmentos totales en secantes desde un punto exterior.


  **CÓMO:** Aplicando la relación $PB = PA + AB$ y $PD = PC + CD$.


