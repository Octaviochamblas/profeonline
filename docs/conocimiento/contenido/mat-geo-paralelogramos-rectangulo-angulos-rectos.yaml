semantic_id: MAT.GEO.PARALELOGRAMOS.RECTANGULO_ANGULOS_RECTOS
resumen_inicial: 'Propiedad de cuatro ángulos rectos en el rectángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Otro caso particular importante de paralelogramo es el rectángulo,
  caracterizado por una propiedad angular específica.
explicacion_formal: '![Cuatro ángulos rectos en el rectángulo](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-rectangulo-angulos-rectos.svg)


  ### Definición formal


  Un rectángulo es un paralelogramo con $\angle A=\angle B=\angle C=\angle D=90°$.
  A diferencia del cuadrado, el rectángulo no exige que sus cuatro lados sean iguales,
  solo que los lados opuestos lo sean (propiedad heredada de todo paralelogramo).


  ### Desarrollo didáctico


  Un rectángulo de 8 cm por 5 cm tiene sus cuatro ángulos de 90°, pero sus lados no
  son todos iguales (dos miden 8 cm y los otros dos 5 cm). Esto lo distingue del cuadrado,
  que además exige lados iguales.'
