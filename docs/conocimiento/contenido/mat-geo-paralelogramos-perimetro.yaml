semantic_id: MAT.GEO.PARALELOGRAMOS.PERIMETRO
resumen_inicial: 'Cálculo del perímetro de un paralelogramo: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Aprovechando la propiedad de lados opuestos congruentes, se puede
  calcular fácilmente el perímetro de cualquier paralelogramo con solo dos medidas.
explicacion_formal: '![Perímetro de un paralelogramo: 2(a+b)](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-perimetro.svg)


  ### Definición formal


  Si un paralelogramo tiene lados consecutivos $a$ y $b$, como los lados opuestos
  son congruentes, el perímetro es $P=a+b+a+b=2(a+b)$.


  ### Desarrollo didáctico


  Un paralelogramo con lados de 9 cm y 6 cm tiene perímetro $P=2(9+6)=2\times15=30$
  cm. Esta fórmula funciona para cualquier paralelogramo, sea cuadrado, rectángulo,
  rombo o romboide.'
