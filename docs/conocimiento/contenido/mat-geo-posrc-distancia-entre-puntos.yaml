semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.DISTANCIA_ENTRE_PUNTOS
resumen_inicial: 'Cálculo de la distancia entre dos puntos del plano cartesiano: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: La distancia entre dos puntos es la longitud del segmento que
  los une, y se calcula considerando ese segmento como la hipotenusa de un triángulo
  rectángulo formado por las diferencias de sus coordenadas.
explicacion_formal: '![Distancia entre dos puntos](/static/img/geometria/analitica/posrc-distancia-entre-puntos.svg)


  ### Definición formal


  La distancia $d$ entre $(x_1,y_1)$ y $(x_2,y_2)$ se obtiene aplicando el teorema
  de Pitágoras a los catetos $|x_2-x_1|$ y $|y_2-y_1|$: $d=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$.


  ### Desarrollo didáctico


  Para $A(-3,-2)$ y $B(3,3)$: $d=\sqrt{(3-(-3))^2+(3-(-2))^2}=\sqrt{36+25}=\sqrt{61}\approx7{,}81$.'
