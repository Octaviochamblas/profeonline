semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.COMPLEMENTARIOS_DEFINICION
resumen_inicial: Dos ángulos son complementarios si la suma de sus medidas es exactamente
  igual a 90° (π/2 rad).
explicacion_simple: '![Ángulos Complementarios](/static/img/nodos/definicion-de-angulos-complementarios-como-angulos-cuya-suma-es-90-intro.svg)


  Si tomas dos ángulos y al juntarlos encajan perfectamente formando una esquina recta
  de 90°, decimos que son complementarios. Por ejemplo, 30° y 60° son complementarios
  porque 30° + 60° = 90°.'
explicacion_formal: '### Definición formal

  Dos ángulos $\alpha$ y $\beta$ son **complementarios** si y solo si la suma algebraica
  de sus medidas angulares es igual a un ángulo recto ($90^\circ$ o $\frac{\pi}{2}
  \text{ rad}$):


  $$\alpha + \beta = 90^\circ \iff \alpha + \beta = \frac{\pi}{2} \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $\alpha, \beta > 0^\circ$: Medidas de dos ángulos agudos coplanares.

  - Independencia de posición: No requieren ser adyacentes ni compartir vértice o
  lado; la propiedad es estrictamente métrica.

  - Cofunciones trigonométricas: $\sin \alpha = \cos \beta$ y $\cos \alpha = \sin
  \beta$.


  ### Síntesis didáctica

  La complementariedad formaliza la partición de un ángulo recto en dos componentes
  angulares y sustenta la teoría de cofunciones en trigonometría.'
definiciones_clave: '- **Ángulos complementarios**: Pareja de ángulos cuya suma es
  $90^\circ$.

  - **Complemento**: La cantidad angular faltante para que un ángulo alcance los $90^\circ$. '
propiedades_relaciones: '- **Agudos obligatorios**: En la geometría euclidiana plana,
  cada uno de los dos ángulos complementarios es un ángulo agudo.

  - **Triángulos rectángulos**: Los dos ángulos no rectos de cualquier triángulo rectángulo
  son siempre complementarios entre sí. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos Complementarios](/static/img/nodos/definicion-de-angulos-complementarios-como-angulos-cuya-suma-es-90-ejemplos.svg)


    Dos ángulos $\alpha = 25^\circ$ y $\beta = 65^\circ$ están dibujados en diferentes
    partes de una página. Determina si son complementarios justificando con la suma
    de sus medidas.'
  pasos:
  - 'Paso 1: Sumar las medidas de ambos ángulos: $25^\circ + 65^\circ$.'
  - 'Paso 2: Calcular el resultado aritmético: $25^\circ + 65^\circ = 90^\circ$.'
  - 'Paso 3: Verificar que la suma es exactamente igual a $90^\circ$.'
  - 'Paso 4: Concluir que $\alpha$ y $\beta$ son complementarios, sin importar que
    estén dibujados por separado.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto deben sumar dos ángulos para ser considerados complementarios?
  choices:
  - text: Exactamente 90°
    is_correct: true
  - text: Exactamente 180°
    is_correct: false
  - text: Exactamente 360°
    is_correct: false
  - text: Menos de 90°
    is_correct: false
  explanation: Dos ángulos son complementarios si su suma es exactamente 90°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Es necesario que dos ángulos complementarios compartan un lado o vértice
    común?
  choices:
  - text: No, basta con que la suma de sus medidas sea 90°
    is_correct: true
  - text: Sí, obligatoriamente deben ser adyacentes
    is_correct: false
  - text: Sí, deben estar dentro del mismo triángulo
    is_correct: false
  - text: No, deben sumar 180°
    is_correct: false
  explanation: No es obligatorio que sean adyacentes; no, basta con que la suma de
    sus medidas sea 90°.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las medidas $\alpha$ y $\beta$ de ambos ángulos.'
- 'Paso 2: Sumar algebraicamente $\alpha + \beta$.'
- 'Paso 3: Si $\alpha + \beta = 90^\circ$, clasificar como ángulos complementarios.'
errores_correccion: No confundas complementarios (suman 90°) con suplementarios (suman
  180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes parejas de ángulos son complementarios?
  alternativas:
  - $35^\circ$ y $55^\circ$
  - $70^\circ$ y $110^\circ$
  - $45^\circ$ y $55^\circ$
  respuesta: $35^\circ$ y $55^\circ$
  solucion_pasos:
  - $35^\circ + 55^\circ = 90^\circ$, por lo tanto son complementarios.
- titulo: Ejemplo 2
  enunciado: Si dos ángulos complementarios son de igual medida, ¿cuánto mide cada
    uno?
  alternativas:
  - $45^\circ$
  - $90^\circ$
  - $30^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $x + x = 90^\circ \implies 2x = 90^\circ \implies x = 45^\circ$.
- titulo: ¿Los ángulos de 20° y 70° son complementarios?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque 20° + 70° = 90°.
- titulo: ¿Un ángulo obtuso puede tener complemento en geometría plana?
  respuesta: 'No'
  solucion_pasos:
  - No, porque los ángulos obtusos ya superan los 90°.
errores_frecuentes:
- Confundir ángulos complementarios ($90^\circ$) con suplementarios ($180^\circ$).
- Creer que para ser complementarios deben estar unidos en el mismo dibujo.
- Afirmar que un ángulo de $90^\circ$ tiene un ángulo complementario positivo.
- Sumar mal los minutos y grados en ángulos sexagesimales.
- Olvidar que los dos ángulos agudos de un triángulo rectángulo son complementarios.
afirmaciones_verdaderas:
- Dos ángulos son complementarios si su suma es $90^\circ$.
- Los ángulos agudos de un triángulo rectángulo son complementarios.
al_terminar_debes_poder: '**QUÉ:** Identificar, clasificar y verificar parejas de
  ángulos complementarios que suman $90^\circ$.


  **CÓMO:** Comprobando la igualdad $\alpha + \beta = 90^\circ$ y reconociendo su
  presencia en triángulos rectángulos y figuras ortogonales.


  ![Resumen de Ángulos Complementarios](/static/img/nodos/definicion-de-angulos-complementarios-como-angulos-cuya-suma-es-90-resumen.svg)'
