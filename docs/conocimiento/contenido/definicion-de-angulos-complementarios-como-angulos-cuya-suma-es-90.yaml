semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.COMPLEMENTARIOS_DEFINICION
resumen_inicial: Dos ángulos son complementarios si la suma de sus medidas es exactamente
  90°, una propiedad esencial en triángulos rectángulos y razones trigonométricas.
explicacion_simple: Imagina un ángulo recto de 90° dividido en dos partes por una
  línea. Las dos partes son complementarias porque al sumarlas forman la esquina de
  90°.
explicacion_formal: Dos ángulos $\alpha$ y $\beta$ son **complementarios** si la suma
  de sus medidas es igual a $90^\circ$ ($\alpha + \beta = 90^\circ$). El complemento
  de $\alpha$ se calcula como $\beta = 90^\circ - \alpha$.
definiciones_clave: '- **Definición de ángulos complementarios como ángulos cuya suma
  es 90°**: Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en definición de ángulos complementarios como ángulos cuya suma es 90° se mantiene
  invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: En un triángulo rectángulo, los dos ángulos agudos son complementarios.
    Si uno de ellos mide $32^\circ$, calcula la medida del otro ángulo agudo.
  pasos:
  - 'Paso 1: Aplicar la definición: dos ángulos son complementarios si su suma es
    $90^\circ$.'
  - 'Paso 2: Restar el ángulo conocido a $90^\circ$: $90^\circ - 32^\circ$.'
  - 'Paso 3: Concluir que el otro ángulo agudo mide $58^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de definición de ángulos complementarios
    como ángulos cuya suma es 90°?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo agudo de un triángulo rectángulo mide 32°, ¿cuánto mide el
    otro ángulo agudo?
  choices:
  - text: 58°
    is_correct: true
  - text: 148°
    is_correct: false
  - text: 68°
    is_correct: false
  - text: 48°
    is_correct: false
  explanation: La alternativa correcta es '58°', obtenida como $90^\circ - 32^\circ
    = 58^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en definición de ángulos complementarios como
  ángulos cuya suma es 90°.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en definición de ángulos
  complementarios como ángulos cuya suma es 90° sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 145^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 35°
  - 145°
  - 90°
  respuesta: 35°
  solucion_pasos:
  - Despejando $x = 180 - 145 = 35^\circ$.
- titulo: Ejemplo 2
  enunciado: En definición de ángulos complementarios como ángulos cuya suma es 90°,
    si dos ángulos son suplementarios y uno mide 145°, ¿cuánto mide el otro?
  alternativas:
  - 35°
  - 25°
  - 360°
  respuesta: 35°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 145 = 35^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en definición de
    ángulos complementarios como ángulos cuya suma es 90°?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en definición de ángulos complementarios
    como ángulos cuya suma es 90° es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de definición de ángulos complementarios como
  ángulos cuya suma es 90°.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
