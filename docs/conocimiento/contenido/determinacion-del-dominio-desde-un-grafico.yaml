semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DOMINIO_DESDE_GRAFICO
resumen_inicial: 'Determinación del dominio desde un gráfico: conceptos, representación
  y propiedades en Representación de funciones.'
explicacion_simple: La sombra que proyecta una curva sobre el suelo (el eje $x$) te
  dice exactamente qué valores de entrada tiene permitidos la función.
explicacion_formal: '### Definición formal


  Dado el gráfico $G_f = \{(x, f(x))\}$ de una función $f$, el dominio corresponde
  a la proyección ortogonal de $G_f$ sobre el eje $x$: $\text{Dom}(f) = \{x \in \mathbb{R}
  : \exists\, y,\ (x,y) \in G_f\}$.


  ### Desarrollo didáctico


  Visualmente, recorre la curva de izquierda a derecha y observa el rango de valores
  de $x$ que efectivamente cubre, prestando atención a extremos abiertos (huecos)
  o cerrados (puntos sólidos), y a posibles interrupciones.


  Si la curva comienza en $x=-3$ con un punto sólido y termina en $x=5$ con un punto
  abierto, el dominio es $[-3, 5[$.'
definiciones_clave: '- **Determinación del dominio desde un gráfico**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación del dominio desde un gráfico.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a determinación del
    dominio desde un gráfico.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a determinación del dominio desde
    un gráfico.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    determinación del dominio desde un gráfico?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en representación de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en representación de funciones. Es la condición
    de existencia y unicidad en determinación del dominio desde un gráfico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en determinación del dominio
    desde un gráfico, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observa el extremo izquierdo de la curva y determina si está incluido (punto
  sólido) o excluido (punto abierto).'
- 'Paso 2: Observa el extremo derecho de la curva con el mismo criterio.'
- 'Paso 3: Revisa si existen interrupciones o huecos en el medio de la curva.'
- 'Paso 4: Expresa el dominio como intervalo o unión de intervalos, según corresponda.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar determinación del dominio desde un gráfico.
ejemplos:
- titulo: Dominio con extremos cerrados
  enunciado: Una curva comienza en $(-4, 2)$ con punto sólido y termina en $(6, -1)$
    con punto sólido, sin interrupciones. Determina el dominio.
  solucion_pasos:
  - Ambos extremos están incluidos.
  - 'Dominio: $[-4, 6]$.'
- titulo: Dominio con una interrupción
  enunciado: Una curva cubre $x$ desde $-2$ hasta $8$, pero tiene un punto abierto
    en $x=3$. Determina el dominio.
  solucion_pasos:
  - Se excluye únicamente el valor $x=3$ del intervalo cubierto.
  - 'Dominio: $[-2, 8] - \{3\}$.'
- titulo: ¿Un punto abierto en el extremo de una curva indica que ese valor pertenece
    al dominio?
  enunciado: ¿Un punto abierto en el extremo de una curva indica que ese valor pertenece
    al dominio?
  respuesta: 'No'
  solucion_pasos:
  - Un punto abierto marca la exclusión explícita de ese valor del dominio.
- titulo: ¿El dominio se obtiene proyectando la curva sobre el eje vertical?
  enunciado: ¿El dominio se obtiene proyectando la curva sobre el eje vertical?
  respuesta: 'No'
  solucion_pasos:
  - El dominio se obtiene proyectando sobre el eje horizontal; la proyección vertical
    entrega el recorrido.
errores_frecuentes:
- Proyectar la curva sobre el eje vertical en vez del horizontal, confundiendo dominio
  con recorrido.
- Ignorar puntos abiertos o huecos, incluyendo valores excluidos en el dominio.
- No revisar interrupciones intermedias de la curva, asumiendo un intervalo continuo
  sin verificarlo.
- Confundir el extremo del gráfico dibujado con el verdadero límite del dominio, cuando
  la curva continúa fuera del recuadro visible.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando determinación
  del dominio desde un gráfico.
