semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DOMINIO_DESDE_GRAFICO
resumen_inicial: Determinar el dominio desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje horizontal $X$.
explicacion_simple: "![Determinar el dominio desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje horizontal $X$](/static/img/nodos/determinacion-del-dominio-desde-un-grafico-intro.svg)\n\n\nPara encontrar el dominio a partir de un gráfico:\n1. Miras la curva de **izquierda a derecha** sobre el **eje horizontal $X$**.\n2. Encuentras el valor de $x$ donde empieza la gráfica y el valor donde termina.\n3. Te fijas en los puntos de los extremos:\n   - Si tiene un **punto negro o relleno (•)**, el corchete se cierra hacia adentro (incluido).\n   - Si tiene un **punto blanco o hueco (○)**, el corchete se abre hacia afuera (excluido).\n   - Si tiene **flechas en los extremos**, significa que la función continúa hacia $-\\infty$ o $+\\infty$."
explicacion_formal: 'El **dominio** de una función visualizada en el plano cartesiano es la proyección ortogonal de $\text{Graf}(f)$ sobre el eje de abscisas:

  $$\text{Dom}(f) = \pi_X(\text{Graf}(f)) = \{x \in \mathbb{R} \mid \exists y \in \mathbb{R} \text{ tal que } (x, y) \in \text{Graf}(f)\}$$


  **Reglas de lectura de intervalos:**

  - **Extremo cerrado**: $\bullet \implies x \in [a, \dots$

  - **Extremo abierto**: $\circ \implies x \in ]a, \dots$

  - **Asíntota vertical en $x = c$**: La proyección se interrumpe en $c$, escribiéndose $\mathbb{R} \setminus \{c\}$ o $]-\infty, c[ \cup ]c, +\infty[$.'
definiciones_clave: '- **Proyección horizontal**: Sombra proyectada por la curva sobre el eje $X$.

  - **Extremo acotado**: Límite visual de la gráfica definido por puntos incluidos o excluidos.'
propiedades_relaciones: '- **Continuidad vs Discontinuidad**: Saltos o huecos en la curva reducen el dominio.

  - **Independencia de la altura**: La forma vertical de la curva no altera la lectura horizontal del dominio.'
ejemplo_guiado:
  enunciado: '![Ejemplo Determinar el dominio desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje horizontal $X$](/static/img/nodos/determinacion-del-dominio-desde-un-grafico-ejemplos.svg)



    Una función está graficada en el plano comenzando en el punto $(-4, -2)$ con círculo cerrado (•) y terminando en el punto $(5, 6)$ con círculo abierto (○), sin cortes intermedios. Determina su dominio.'
  pasos:
  - 'Paso 1: Identificar el extremo izquierdo sobre el eje X: $x = -4$.'
  - 'Paso 2: Identificar el tipo de punto en $x = -4$: círculo cerrado (•) $\implies$ corchete cerrado $[-4$.'
  - 'Paso 3: Identificar el extremo derecho sobre el eje X: $x = 5$.'
  - 'Paso 4: Identificar el tipo de punto en $x = 5$: círculo abierto (○) $\implies$ corchete abierto $5[$.'
  - 'Paso 5: Escribir el intervalo del dominio: $\text{Dom}(f) = [-4, 5[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una gráfica se extiende con flechas hacia ambos extremos sin interrupciones, ¿cuál es su dominio?
  choices:
  - text: Todos los números reales R
    is_correct: true
  - text: '[0, +inf['
    is_correct: false
  - text: '[-10, 10]'
    is_correct: false
  - text: R \ {0}
    is_correct: false
  explanation: La alternativa correcta es 'Todos los números reales R'. Las flechas indican extensión infinita en ambas direcciones.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una gráfica, el punto $(-2, 3)$ tiene círculo abierto y el punto $(4, 1)$ tiene círculo cerrado. ¿Cuál es el dominio?
  choices:
  - text: ']-2, 4]'
    is_correct: true
  - text: '[-2, 4['
    is_correct: false
  - text: '[3, 1]'
    is_correct: false
  - text: ']-2, 4['
    is_correct: false
  explanation: La alternativa correcta es ']-2, 4]'. Círculo abierto en -2 (excluido) y cerrado en 4 (incluido).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el extremo izquierdo de la gráfica y leer su abscisa $x_1$.'
- 'Paso 2: Determinar si $x_1$ está incluido (círculo cerrado) o excluido (círculo abierto).'
- 'Paso 3: Localizar el extremo derecho de la gráfica y leer su abscisa $x_2$, verificando su inclusión.'
- 'Paso 4: Revisar si existen cortes, huecos o asíntotas verticales intermedias para excluirlos del intervalo final.'
errores_correccion: '- **Error común:** Leer las coordenadas del eje $Y$ al buscar el dominio.

  - **Cómo corregirlo:** El **dominio** se lee **exclusivamente sobre el eje horizontal $X$**. El eje $Y$ se reserva para el recorrido.'
ejemplos:
- titulo: 'Ejemplo 1: Intervalo acotado cerrado'
  enunciado: Una curva continua va desde $(-3, 1)$ hasta $(2, 4)$ con ambos extremos cerrados. ¿Cuál es su dominio?
  alternativas:
  - '[-3, 2]'
  - '[1, 4]'
  - '[-3, 4]'
  - ']-3, 2['
  respuesta: '[-3, 2]'
  solucion_pasos:
  - 'Paso 1: Extremo izquierdo en $x = -3$ cerrado.'
  - 'Paso 2: Extremo derecho en $x = 2$ cerrado.'
  - 'Paso 3: $\text{Dom}(f) = [-3, 2]$.'
- titulo: 'Ejemplo 2: Con asíntota vertical'
  enunciado: Una función hipérbola cubre todo el plano horizontal excepto en la recta $x = 1$ donde hay una asíntota. ¿Cuál es su dominio?
  alternativas:
  - R \ {1}
  - R \ {0}
  - '[1, +inf['
  - ']-inf, 1['
  respuesta: R \ {1}
  solucion_pasos:
  - 'Paso 1: La curva existe para todo número real excepto en la asíntota $x = 1$.'
  - 'Paso 2: $\text{Dom}(f) = \mathbb{R} \setminus \{1\}$.'
- titulo: 'Ejemplo 3: Semirrecta'
  enunciado: Una curva parte en el origen $(0, 0)$ con punto cerrado y continúa indefinidamente hacia la derecha. ¿Cuál es su dominio?
  alternativas:
  - '[0, +inf['
  - ']0, +inf['
  - R
  - ']-inf, 0]'
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: Comienza en $x = 0$ incluido y se extiende a la derecha: $[0, +\infty[$.'
- titulo: 'Ejemplo 4: Hueco puntual'
  enunciado: Una recta continua cubre desde $x = -5$ hasta $x = 5$, pero tiene un punto blanco en $(2, 3)$. ¿Cuál es su dominio?
  alternativas:
  - '[-5, 5] \ {2}'
  - '[-5, 5] \ {3}'
  - ']-5, 5['
  - '[-5, 2['
  respuesta: '[-5, 5] \ {2}'
  solucion_pasos:
  - 'Paso 1: El intervalo $[-5, 5]$ se interrumpe en la abscisa del hueco: $x = 2$.'
  - 'Paso 2: $\text{Dom}(f) = [-5, 5] \setminus \{2\}$.'
errores_frecuentes:
- Confundir las coordenadas de ordenadas (Y) con las de abscisas (X).
- Cerrar corchetes en puntos huecos o abiertos.
- Olvidar excluir asíntotas verticales del dominio.
afirmaciones_verdaderas:
- El dominio gráfico de una función es la proyección de su curva sobre el eje horizontal X.
- Los puntos abiertos (○) representan preimágenes que no forman parte del dominio de la función.
al_terminar_debes_poder: '**QUÉ:** Determinar el dominio de funciones a partir de su representación gráfica.


  **CÓMO:** Proyectando la curva sobre el eje horizontal X e identificando extremos acotados, puntos abiertos y asíntotas.


  ![Resumen Determinar el dominio desde un gráfico consiste en identificar el intervalo de valores que la curva cubre a lo largo del eje horizontal $X$](/static/img/nodos/determinacion-del-dominio-desde-un-grafico-resumen.svg)'
