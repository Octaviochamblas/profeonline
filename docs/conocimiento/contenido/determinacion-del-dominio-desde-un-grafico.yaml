semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DOMINIO_DESDE_GRAFICO
resumen_inicial: Determinar el dominio desde un gráfico consiste en identificar la cobertura horizontal de la curva sobre el eje $X$.
explicacion_simple: |
  Para hallar el dominio desde un gráfico:

  1. Mira la gráfica de izquierda a derecha.
  2. Identifica dónde empieza la curva en el eje $X$ y dónde termina.
  3. Si la curva tiene un **punto relleno** ($\bullet$), ese número se **incluye** en el dominio ($[$).
  4. Si la curva tiene un **punto hueco** ($\circ$), ese número se **excluye** del dominio ($]$).
  5. Si tiene flechas, se extiende hacia $-\infty$ o $+\infty$.
explicacion_formal: |
  Sea $G_f$ la gráfica de una función $f$ en el plano cartesiano. El **dominio gráfico** es el conjunto de abscisas $x \in \mathbb{R}$ para las cuales existe un punto en la gráfica:

  $$\text{Dom}(f) = \{x \in \mathbb{R} \mid \exists y \in \mathbb{R}, \ (x, y) \in G_f\}$$

  **Desglose visual:**
  - Extremo izquierdo: Límite inferior $a$ del intervalo.
  - Extremo derecho: Límite superior $b$ del intervalo.
definiciones_clave: |
  - **Proyección horizontal**: Extensión visual de la curva proyectada perpendicularmente sobre el eje de las abscisas ($X$).
propiedades_relaciones: |
  - **Huecos interiores**: Un punto descolocado u hueco $(c, y_0)$ dentro de la curva requiere restar la abscisa $c$ del intervalo: $\text{Dom}(f) = [a, b] \setminus \{c\}$.
ejemplo_guiado:
  enunciado: "Una curva gráfica comienza en $x = -4$ con un punto relleno, avanza continuamente hasta $x = 3$ donde tiene un punto hueco. Determina su dominio."
  pasos:
    - 'Paso 1: Identificar el extremo izquierdo: $x = -4$ con punto relleno $\implies$ intervalo cerrado en $-4$ ($[-4$).'
    - 'Paso 2: Identificar el extremo derecho: $x = 3$ con punto hueco $\implies$ intervalo abierto en $3$ ($3[$).'
    - 'Paso 3: Unir las condiciones en un intervalo continuo: $[-4, 3[$.'
    - 'Paso 4: Concluir que el dominio es $\text{Dom}(f) = [-4, 3[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Una curva empieza en $x = -4$ (punto relleno) y termina en $x = 3$ (punto hueco). ¿Cuál es su dominio?"
    choices:
      - {text: "$[-4, 3[$", is_correct: true}
      - {text: "$]-4, 3]$", is_correct: false}
      - {text: "$[-4, 3]$", is_correct: false}
      - {text: "$]-4, 3[$", is_correct: false}
    explanation: "La alternativa correcta es '$[-4, 3[$'. Punto relleno indica cerrado $[-4$ y punto hueco indica abierto $3[$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si la gráfica se extiende infinitamente hacia la izquierda y derecha sin interrupciones, ¿cuál es su dominio?"
    choices:
      - {text: "Todo el conjunto de los números reales $\\mathbb{R}$ ($]-\\infty, +\\infty[$)", is_correct: true}
      - {text: "$[0, +\\infty[$", is_correct: false}
      - {text: "El conjunto vacío $\\emptyset$", is_correct: false}
      - {text: "Solo los enteros positivos", is_correct: false}
    explanation: "La alternativa correcta es 'Todo el conjunto de los números reales $\\mathbb{R}$ ($]-\\infty, +\\infty[$)'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Observar la gráfica en el plano cartesiano identificando el eje $X$.'
  - 'Paso 2: Determinar el punto más a la izquierda (límite inferior) y verificar si es abierto, cerrado o infinito.'
  - 'Paso 3: Determinar el punto más a la derecha (límite superior) y verificar su tipo de frontera.'
  - 'Paso 4: Expresar el dominio en notación de intervalo o conjunto.'
errores_correccion: |
  - **Error común:** Leer los valores en el eje vertical $Y$ en lugar del eje horizontal $X$ al determinar el dominio.
  - **Cómo corregirlo:** El DOMINIO siempre se mide y lee sobre el eje HORIZONTAL $X$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de representación de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de representación de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El dominio desde un gráfico se lee observando la proyección de la curva sobre el eje vertical de las ordenadas ($Y$).'
  - 'Los puntos finales abiertos o huecos sobre el gráfico se incluyen dentro del dominio con corchetes cerrados.'
  - 'Una asintota vertical en $x = a$ indica que el valor $x = a$ pertenece obligatoriamente al dominio de la función.'
  - 'El dominio de cualquier gráfica curva que se extienda continuamente es siempre el conjunto vacío.'
  - 'La presencia de un salto discontinuo en la gráfica impide definir el dominio en el resto del eje $X$.'
afirmaciones_verdaderas:
  - 'El dominio de una función representada gráficamente corresponde al conjunto de sombras o proyecciones de la curva sobre el eje horizontal $X$.'
  - 'Los puntos rellenados señalan inclusión en el dominio ($[\, ]$), mientras que los puntos abiertos señalan exclusión ($]\, [$).'
al_terminar_debes_poder: |
  QUÉ: Determinar el dominio de una función a partir de su representación gráfica.
  CÓMO: Proyectar la gráfica sobre el eje $X$, identificar los límites izquierdo y derecho, y expresar el intervalo considerando puntos abiertos y cerrados.
