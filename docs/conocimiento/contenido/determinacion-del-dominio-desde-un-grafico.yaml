semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DOMINIO_DESDE_GRAFICO
resumen_inicial: Determinar el dominio desde un gráfico consiste en leer la extensión
  horizontal que abarca la curva sobre el eje $X$.
explicacion_simple: 'Para hallar el **dominio desde una gráfica**:

  1. Miramos el gráfico de izquierda a derecha sobre el eje horizontal $X$.

  2. Ubicamos dónde empieza la curva a la izquierda (extremo inferior) y dónde termina
  a la derecha (extremo superior).

  3. Nos fijamos en las marcas: punto relleno ($\bullet$) significa corchete cerrado
  $[$, punto vacío ($\circ$) significa corchete abierto $]$, y si hay una flecha que
  sigue, se extiende a $\pm \infty$.'
explicacion_formal: 'Dada la gráfica $G(f) \subset \mathbb{R}^2$, el **dominio gráfico**
  es la proyección ortogonal sobre la primera coordenada:


  $$\operatorname{Dom}(f) = \pi_x(G(f)) = \{x \in \mathbb{R} \mid \exists y \in \mathbb{R}
  \text{ tal que } (x, y) \in G(f)\}$$


  **Desglose de la fórmula:**

  - Intervalo real obtenido al aplastar la curva verticalmente sobre el eje de abscisas
  $X$.'
definiciones_clave: '- **Dominio gráfico**: Extensión o ancho del trazo continuo de
  la función a lo largo del eje $X$.'
propiedades_relaciones: '- **Puntos de discontinuidad**: Los huecos o asíntotas verticales
  representan valores excluidos del dominio.'
ejemplo_guiado:
  enunciado: Un gráfico comienza en el punto $(-3, 1)$ con círculo relleno y termina
    en el punto $(5, 4)$ con círculo vacío. Determina su dominio.
  pasos:
  - 'Paso 1: Proyectar el extremo izquierdo sobre el eje $X$: inicia en $x = -3$ (relleno
    $\implies [-3$).Paso 2: Proyectar el extremo derecho sobre el eje $X$: termina
    en $x = 5$ (vacío $\implies 5[$).Paso 3: Unir la franja horizontal continua entre
    $-3$ y $5$.Paso 4: Escribir el dominio en notación de intervalo: $\operatorname{Dom}(f)
    = [-3, 5[$.'
checkpoints:
- placement: after_explicacion_formal
  question: A partir del gráfico que va desde $(-3, 1)$ relleno hasta $(5, 4)$ vacío,
    ¿cuál es su dominio $\operatorname{Dom}(f)$?
  choices:
  - text: $\operatorname{Dom}(f) = [-3, 5[$
    is_correct: true
  - text: $\operatorname{Dom}(f) = [1, 4[$
    is_correct: false
  - text: $\operatorname{Dom}(f) = ]-3, 5]$
    is_correct: false
  - text: $\operatorname{Dom}(f) = \mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es '$\operatorname{Dom}(f) = [-3, 5[$'. (Se
    lee en el eje X de -3 a 5).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Sobre qué eje de coordenadas se lee el dominio cuando observamos un gráfico?
  choices:
  - text: Sobre el eje horizontal $X$ (abscisas).
    is_correct: true
  - text: Sobre el eje vertical $Y$ (ordenadas).
    is_correct: false
  - text: En la pendiente de la curva.
    is_correct: false
  - text: En el área bajo la curva.
    is_correct: false
  explanation: La alternativa correcta es 'Sobre el eje horizontal $X$ (abscisas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el punto situado más a la izquierda del gráfico y leer su valor
  $x_1$ en el eje $X$.'
- 'Paso 2: Ubicar el punto situado más a la derecha y leer su valor $x_2$ en el eje
  $X$.'
- 'Paso 3: Identificar si los extremos contienen puntos rellenos o vacíos.'
- 'Paso 4: Escribir el intervalo del dominio $x_1 \le x < x_2$ o $[x_1, x_2[$.'
errores_correccion: '- **Error común:** Leer los valores del eje $Y$ para determinar
  el dominio.

  - **Cómo corregirlo:** El DOMINIO se lee SIEMPRE en el eje horizontal $X$ (de izquierda
  a derecha).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de representación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de representación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El criterio de la línea vertical sirve para identificar si un gráfico representa
    a una función?
  respuesta: Sí
  solucion_pasos:
  - Sí, si ninguna recta vertical corta al gráfico en más de un punto, es función.
- titulo: ¿El dominio de una función se lee sobre el eje horizontal X en su gráfica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio es el ancho continuo proyectado en el eje X.
errores_frecuentes:
- Invertir el orden de las componentes en los pares ordenados escribiendo $(y, x)$
  en vez de $(x, y)$.
- Trazar las flechas en un diagrama sagital en sentido contrario, del codominio al
  dominio.
- Confundir el criterio de la línea vertical (usado para probar funciones) con el
  de la línea horizontal (usado para inyectividad).
- Leer los valores del eje vertical $Y$ para determinar el dominio o los del eje $X$
  para hallar el recorrido.
- Usar la coordenada $x$ de un vértice en lugar de la coordenada $y$ para determinar
  el mínimo del recorrido en una gráfica.
afirmaciones_verdaderas:
- Una relación representada gráficamente es una función si y solo si cualquier línea
  vertical corta a su gráfico a lo sumo en un punto.
- El dominio se determina en el gráfico proyectando el trazo sobre el eje horizontal
  $X$, mientras que el recorrido se obtiene proyectándolo sobre el eje vertical $Y$.
al_terminar_debes_poder: Al finalizar este recurso podrás representar funciones mediante
  tablas, pares ordenados, diagramas sagitales y gráficos en el plano cartesiano,
  identificando dominio y recorrido.
