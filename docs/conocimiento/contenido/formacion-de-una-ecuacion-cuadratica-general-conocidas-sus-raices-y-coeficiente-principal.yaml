semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.CONSTRUCCION_GENERAL
resumen_inicial: 'Formación de una ecuación cuadrática general conocidas sus raíces
  y coeficiente principal: concepto, discriminante, soluciones y modelamiento en Propiedades
  de las raíces y relaciones de Vieta.'
explicacion_simple: Cuando además de las raíces se especifica el valor del coeficiente
  cuadrático, la ecuación mónica ya no es suficiente; hay que escalar toda la ecuación
  por ese coeficiente.
explicacion_formal: '### Definición formal


  Si $x_1$ y $x_2$ son las raíces deseadas y se especifica un coeficiente principal
  $a\neq0$, la ecuación cuadrática correspondiente es $a\,x^2-a(x_1+x_2)x+a(x_1x_2)=0$,
  obtenida al multiplicar la ecuación mónica $x^2-(x_1+x_2)x+x_1x_2=0$ por $a$.


  ### Desarrollo didáctico


  Construir esta ecuación es un proceso de dos etapas: primero se forma la ecuación
  mónica con las raíces dadas, y luego se multiplica toda la ecuación por el coeficiente
  principal deseado.


  Para raíces $x_1=2$, $x_2=-1$ y coeficiente $a=3$: la mónica es $x^2-x-2=0$; multiplicando
  por $3$: $3x^2-3x-6=0$.'
definiciones_clave: '- **Formación de una ecuación cuadrática general conocidas sus
  raíces y coeficiente principal**: Elemento o técnica fundamental en la resolución
  de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en formación
  de una ecuación cuadrática general conocidas sus raíces y coeficiente principal.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando formación de una
    ecuación cuadrática general conocidas sus raíces y coeficiente principal.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a formación de una ecuación
    cuadrática general conocidas sus raíces y coeficiente principal.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
