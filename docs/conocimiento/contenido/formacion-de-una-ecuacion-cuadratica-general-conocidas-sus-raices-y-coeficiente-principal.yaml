semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.CONSTRUCCION_GENERAL
resumen_inicial: La formación de una ecuación cuadrática general dadas sus raíces $x_1, x_2$ y un coeficiente principal $a$ aplica $a(x - x_1)(x - x_2) = 0$.
explicacion_simple: |
  Si te entregan dos soluciones (por ejemplo $x_1 = 2$ y $x_2 = -5$) y te piden **construir la ecuación cuadrática original con un coeficiente $a = 3$**:

  1. **Escribes la fórmula factorizada con el coeficiente $a$ fuera**:
     $$a(x - x_1)(x - x_2) = 0$$
  2. **Reemplazas las raíces**:
     $$3(x - 2)(x - (-5)) = 0 \implies 3(x - 2)(x + 5) = 0$$
  3. **Multiplicas los paréntesis primero**:
     $$(x - 2)(x + 5) = x^2 + 3x - 10$$
  4. **Ponderas todo por el coeficiente $a = 3$**:
     $$3(x^2 + 3x - 10) = 0 \implies 3x^2 + 9x - 30 = 0$$
explicacion_formal: |
  Sean $x_1, x_2 \in \mathbb{C}$ dos raíces conocidas y $a \in \mathbb{R} \setminus \{0\}$ el coeficiente cuadrático principal prefijado. Por el Teorema Fundamental del Álgebra, la **ecuación polinómica cuadrática general** viene dada por:

  $$a(x - x_1)(x - x_2) = 0$$

  **Forma canónica desarrollada:**
  $$a \left[ x^2 - (x_1 + x_2)x + (x_1 \cdot x_2) \right] = 0 \iff ax^2 - a(x_1 + x_2)x + a(x_1 \cdot x_2) = 0$$
  donde $b = -a(x_1 + x_2)$ y $c = a(x_1 \cdot x_2)$.
definiciones_clave: |
  - **Construcción de ecuación cuadrática general**: Proceso inverso de reconstrucción de $ax^2 + bx + c = 0$ a partir del conjunto solución $\{x_1, x_2\}$ y la escala cuadrática $a$.
propiedades_relaciones: |
  - **Equivalencia por escalar no nulo**: Cualquier múltiplo escalar $k \cdot P(x) = 0$ (con $k \neq 0$) posee exactamente el mismo conjunto solución $\{x_1, x_2\}$.
ejemplo_guiado:
  enunciado: 'Construye la ecuación cuadrática general con raíces $x_1 = 4$ y $x_2 = 1$ sabiendo que su coeficiente principal es $a = 2$.'
  pasos:
    - 'Paso 1: Calcular la suma $S = x_1 + x_2 = 4 + 1 = 5$.'
    - 'Paso 2: Calcular el producto $P = x_1 \cdot x_2 = 4 \cdot 1 = 4$.'
    - 'Paso 3: Plantear la ecuación mónica $(x^2 - Sx + P) = 0 \implies x^2 - 5x + 4 = 0$.'
    - 'Paso 4: Multiplicar toda la ecuación por el coeficiente $a = 2$: $2(x^2 - 5x + 4) = 0 \implies 2x^2 - 10x + 8 = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación cuadrática con coeficiente principal $a = 5$ y raíces $x_1 = 1$ y $x_2 = 3$?'
    choices:
      - {text: '$5x^2 - 20x + 15 = 0$', is_correct: true}
      - {text: '$x^2 - 4x + 3 = 0$', is_correct: false}
      - {text: '$5x^2 + 20x - 15 = 0$', is_correct: false}
      - {text: '$5x^2 - 4x + 3 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$5x^2 - 20x + 15 = 0$''. Como $(x-1)(x-3) = x^2-4x+3$, multiplicando por $5$ resulta $5x^2 - 20x + 15 = 0$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué ecuación cuadrática general tiene raíces $x_1 = -2$ y $x_2 = 2$ con coeficiente $a = 3$?'
    choices:
      - {text: '$3x^2 - 12 = 0$', is_correct: true}
      - {text: '$3x^2 + 12 = 0$', is_correct: false}
      - {text: '$x^2 - 4 = 0$', is_correct: false}
      - {text: '$3x^2 - 6x = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3x^2 - 12 = 0$''. Puesto que $(x+2)(x-2) = x^2-4$, ponderando por $3$ queda $3x^2 - 12 = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Calcular la suma $S = x_1 + x_2$ y el producto $P = x_1 \cdot x_2$ de las raíces dadas.'
  - 'Paso 2: Escribir la estructura mónica $x^2 - Sx + P = 0$.'
  - 'Paso 3: Multiplicar cada término de la estructura por el coeficiente principal dado $a$.'
  - 'Paso 4: Escribir la ecuación final desarrollada $ax^2 - aSx + aP = 0$.'
errores_correccion: |
  - **Error común:** Escribir $(x + x_1)(x + x_2) = 0$ con signos positivos en los paréntesis.
  - **Cómo corregirlo:** La factorización por raíces exige **RESTAR LAS RAÍCES** $(x - x_1)(x - x_2) = 0$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Reconstrucción con raíces de distinto signo.
    alternativas:
      - '$2x^2 + 2x - 24 = 0$'
      - '$x^2 + x - 12 = 0$'
      - '$2x^2 - 2x - 24 = 0$'
    respuesta: '$2x^2 + 2x - 24 = 0$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Reconstrucción con coeficiente fraccionario.
    alternativas:
      - '$x^2 - 6x + 5 = 0$'
      - '$x^2 + 6x + 5 = 0$'
      - '$2x^2 - 12x + 10 = 0$'
    respuesta: '$x^2 - 6x + 5 = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Construir la expresión utilizando la suma con signo positivo $(x + x_1)(x + x_2) = 0$.'
  - 'La falta de ponderación por el coeficiente principal $a$ entregando únicamente la ecuación mónica.'
  - 'La adición del coeficiente principal $a$ al trinomio en lugar de multiplicarlo por la totalidad de la expresión.'
  - 'El cambio erróneo del signo de la suma de raíces en la forma $x^2 + Sx + P = 0$.'
  - 'La creencia de que las raíces $x_1$ y $x_2$ deben ser enteras para poder reconstruir la ecuación cuadrática.'
afirmaciones_verdaderas:
  - 'La reconstrucción de una ecuación cuadrática conocida su escala $a$ y raíces $x_1, x_2$ responde a la fórmula $a[x^2 - (x_1+x_2)x + (x_1 \cdot x_2)] = 0$.'
  - 'Multiplicar toda una ecuación cuadrática por una constante real no nula $a \neq 0$ no altera las raíces $x_1$ y $x_2$ del conjunto solución.'
al_terminar_debes_poder: |
  QUÉ: Formar la ecuación cuadrática general $ax^2 + bx + c = 0$ conocidas sus soluciones $x_1, x_2$ y el coeficiente principal $a$.
  CÓMO: Calcular $S = x_1 + x_2$ y $P = x_1 \cdot x_2$, construir $a(x^2 - Sx + P) = 0$ y desarrollar los productos.
