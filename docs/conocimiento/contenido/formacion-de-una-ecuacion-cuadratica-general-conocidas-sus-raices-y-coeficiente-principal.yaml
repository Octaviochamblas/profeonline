semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.CONSTRUCCION_GENERAL
resumen_inicial: 'La formación de una ecuación cuadrática general con coeficiente principal $a \neq 0$ a partir de sus raíces conocidas consiste en ponderar la forma mónica por dicho escalar: $a(x^2 - Sx + P) = 0 \iff ax^2 - aSx + aP = 0$.'
explicacion_simple: "![La formación de una ecuación cuadrática general con coeficiente principal $a \\neq 0$ a partir de sus raíces conocidas consiste en ponderar la forma mónica por dicho escalar: $a(x^2 - Sx + P) = 0 \\iff ax^2 - aSx + aP = 0$](/static/img/nodos/formacion-de-una-ecuacion-cuadratica-general-conocidas-sus-raices-y-coeficiente-principal-intro.svg)\n\n\n¿Qué pasa si te dan las raíces (por ejemplo $x_1 = \\frac{1}{2}$ y $x_2 = 3$) pero te piden una ecuación con **coeficientes enteros** o con un coeficiente específico como **$a = 2$**?\n\n**El método en 2 pasos:**\n1. **Paso 1:** Construyes la ecuación mónica normal: $x^2 - Sx + P = 0$.\n2. **Paso 2:** Multiplicas **toda la ecuación por el número $a$**:\n   $$a \\cdot (x^2 - Sx + P) = 0 \\implies ax^2 - aSx + aP = 0$$\n- *Ejemplo:* Si $S = \\frac{7}{2}$ y $P = \\frac{3}{2}$, la mónica es $x^2 - \\frac{7}{2}x + \\frac{3}{2} = 0$.\n  - Multiplicas todo por $a = 2$ y queda una ecuación limpia con enteros: **$2x^2 - 7x + 3 = 0$**."
explicacion_formal: 'Sea el conjunto de ceros $\{x_1, x_2\} \subset \mathbb{C}$ y un coeficiente principal fijado $a \in \mathbb{R} \setminus \{0\}$. El polinomio cuadrático general está unívocamente determinado por la factorización de Gauss:

  $$P(x) = a(x - x_1)(x - x_2) = 0$$


  Sustituyendo los invariantes de Vieta $S = x_1 + x_2$ y $P = x_1 x_2$:

  $$P(x) = a\left(x^2 - Sx + P\right) = ax^2 - (aS)x + (aP) = 0$$


  **Propiedades algebraicas**:

  - **Eliminación canónica de denominadores**: Si $x_1, x_2 \in \mathbb{Q}$, se elige $a = \text{mcm}(\text{den}(S), \text{den}(P))$ para generar una ecuación primitiva con coeficientes enteros coprimos en $\mathbb{Z}$.

  - **Invarianza del conjunto de ceros**: $\forall a \neq 0$, $\mathcal{S}(a \cdot P) = \mathcal{S}(P)$.'
definiciones_clave: '- **Ecuación cuadrática general ponderada**: Ecuación $a(x^2 - Sx + P) = 0$ que respeta una escala o condición de primalidad entera.

  - **Polinomio cuadrático primitivo**: Polinomio con coeficientes enteros cuyo máximo común divisor global es 1.'
propiedades_relaciones: '- **Haz de polinomios con raíces fijas**: Familia uniparamétrica de curvas $y = a(x - x_1)(x - x_2)$ que comparten las mismas intersecciones con el eje $X$.

  - **Apertura de la parábola**: El parámetro $a$ controla el sentido de concavidad y la amplitud geométrica de las ramas.'
ejemplo_guiado:
  enunciado: '![Ejemplo La formación de una ecuación cuadrática general con coeficiente principal $a \neq 0$ a partir de sus raíces conocidas consiste en ponderar la forma mónica por dicho escalar: $a(x^2 - Sx + P) = 0 \iff ax^2 - aSx + aP = 0$](/static/img/nodos/formacion-de-una-ecuacion-cuadratica-general-conocidas-sus-raices-y-coeficiente-principal-ejemplos.svg)



    Determina la ecuación cuadrática con coeficientes enteros irreductibles cuyas raíces son $x_1 = \frac{2}{3}$ y $x_2 = -\frac{1}{4}$.'
  pasos:
  - 'Paso 1: Calcular la suma de las raíces:

    $S = \frac{2}{3} + \left(-\frac{1}{4}\right) = \frac{8 - 3}{12} = \frac{5}{12}$.'
  - 'Paso 2: Calcular el producto de las raíces:

    $P = \left(\frac{2}{3}\right)\left(-\frac{1}{4}\right) = -\frac{2}{12} = -\frac{1}{6} = -\frac{2}{12}$.'
  - 'Paso 3: Escribir la forma mónica: $x^2 - \frac{5}{12}x - \frac{2}{12} = 0$.'
  - 'Paso 4: Multiplicar por el MCM de los denominadores $a = 12$:

    $12\left(x^2 - \frac{5}{12}x - \frac{2}{12}\right) = 12(0) \implies 12x^2 - 5x - 2 = 0$.'
  - 'Paso 5: Concluir: La ecuación general con coeficientes enteros es $12x^2 - 5x - 2 = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si las raíces de una ecuación son 1 y -3, ¿cuál es la ecuación cuadrática que tiene coeficiente principal a = 4?
  choices:
  - text: 4x² + 8x - 12 = 0
    is_correct: true
  - text: 4x² - 8x - 12 = 0
    is_correct: false
  - text: x² + 2x - 3 = 0
    is_correct: false
  - text: 4x² + 2x - 3 = 0
    is_correct: false
  explanation: 'La alternativa correcta es ''4x² + 8x - 12 = 0''. La mónica es $x^2 + 2x - 3 = 0$. Multiplicando por 4: $4x^2 + 8x - 12 = 0$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué multiplicar toda la ecuación cuadrática por una constante no nula 'a' no altera sus soluciones?
  choices:
  - text: Porque por la propiedad uniforme de la igualdad, multiplicar por a ≠ 0 produce una ecuacion equivalente con el mismo conjunto solucion.
    is_correct: true
  - text: Porque el valor de a siempre es 1.
    is_correct: false
  - text: Porque a solo modifica la constante c.
    is_correct: false
  - text: Porque las soluciones se multiplican por a.
    is_correct: false
  explanation: La alternativa correcta es 'Porque por la propiedad uniforme de la igualdad, multiplicar por a ≠ 0 produce una ecuacion equivalente con el mismo conjunto solucion.'. Las raíces permanecen idénticas.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la suma $S$ y el producto $P$ de las raíces dadas.'
- 'Paso 2: Escribir la estructura cuadrática mónica $x^2 - Sx + P = 0$.'
- 'Paso 3: Determinar el valor de $a$ (el coeficiente pedido o el MCM de denominadores).'
- 'Paso 4: Distribuir el factor $a$ en todos los términos: $ax^2 - aSx + aP = 0$.'
errores_correccion: '- **Error común:** Multiplicar solo el término cuadrático por $a$ dejando los otros términos sin multiplicar ($ax^2 - Sx + P = 0$).

  - **Cómo corregirlo:** La constante $a$ se debe **distribuir sobre TODOS los términos**: $a \cdot x^2 - a \cdot Sx + a \cdot P = 0$.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente principal entero prescrito'
  enunciado: Forma la ecuación cuadrática con raíces $2$ y $5$, y coeficiente principal $a = 3$.
  alternativas:
  - 3x^2 - 21x + 30 = 0
  - 3x^2 - 7x + 10 = 0
  - x^2 - 7x + 10 = 0
  - 3x^2 + 21x + 30 = 0
  respuesta: 3x^2 - 21x + 30 = 0
  solucion_pasos:
  - 'Paso 1: $S = 7, P = 10 \implies 3(x^2 - 7x + 10) = 3x^2 - 21x + 30 = 0$.'
- titulo: 'Ejemplo 2: Raíz fraccionaria simple'
  enunciado: Forma una ecuación con coeficientes enteros para raíces $x_1 = 1/2$ y $x_2 = 4$.
  alternativas:
  - 2x^2 - 9x + 4 = 0
  - x^2 - 9/2x + 2 = 0
  - 2x^2 + 9x + 4 = 0
  - 2x^2 - 4x + 9 = 0
  respuesta: 2x^2 - 9x + 4 = 0
  solucion_pasos:
  - 'Paso 1: $S = 9/2, P = 2 \implies 2(x^2 - 9/2x + 2) = 2x^2 - 9x + 4 = 0$.'
- titulo: 'Ejemplo 3: Coeficiente principal negativo'
  enunciado: Forma la ecuación con raíces $-1$ y $3$, con $a = -2$.
  alternativas:
  - -2x^2 + 4x + 6 = 0
  - -2x^2 - 4x - 6 = 0
  - -2x^2 + 2x - 3 = 0
  - 2x^2 - 4x - 6 = 0
  respuesta: -2x^2 + 4x + 6 = 0
  solucion_pasos:
  - 'Paso 1: $S = 2, P = -3 \implies -2(x^2 - 2x - 3) = -2x^2 + 4x + 6 = 0$.'
- titulo: 'Ejemplo 4: Ambas raíces fraccionarias'
  enunciado: Determina la ecuación entera para raíces $-1/3$ y $2/5$.
  alternativas:
  - 15x^2 - x - 2 = 0
  - 15x^2 + x - 2 = 0
  - 15x^2 - x + 2 = 0
  - x^2 - 1/15x - 2/15 = 0
  respuesta: 15x^2 - x - 2 = 0
  solucion_pasos:
  - 'Paso 1: $S = 1/15, P = -2/15 \implies 15(x^2 - 1/15x - 2/15) = 15x^2 - x - 2 = 0$.'
errores_frecuentes:
- No distribuir el coeficiente principal a sobre todos los términos.
- Multiplicar por a solo el lado izquierdo sin igualar a cero.
- Elegir un multiplicador que no elimine todas las fracciones.
afirmaciones_verdaderas:
- La ecuación ax² - aSx + aP = 0 posee exactamente las mismas raíces que la ecuación mónica x² - Sx + P = 0.
- Multiplicar una ecuación cuadrática por una constante no nula preserva intacto su conjunto solución.
al_terminar_debes_poder: '**QUÉ:** Formar ecuaciones cuadráticas generales conocidas sus raíces y su coeficiente principal.


  **CÓMO:** Distribuyendo el coeficiente principal a sobre la forma mónica canónica a(x² - Sx + P) = 0.


