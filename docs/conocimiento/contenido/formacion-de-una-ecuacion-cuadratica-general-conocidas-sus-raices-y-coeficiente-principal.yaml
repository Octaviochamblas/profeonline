procedimiento:
- 'Paso 1: Calcula la suma y el producto de las raíces dadas.'
- 'Paso 2: Forma la ecuación mónica $x^2-(\text{suma})x+(\text{producto})=0$.'
- 'Paso 3: Multiplica toda la ecuación por el coeficiente principal $a$ especificado.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en formación de una ecuación cuadrática general conocidas sus raíces y coeficiente
  principal.
ejemplos:
- titulo: Construcción con coeficiente principal entero
  enunciado: Construye la ecuación cuadrática con raíces $1$ y $6$, y coeficiente
    principal $a=2$.
  solucion_pasos:
  - 'Mónica: suma $=7$, producto $=6$, dando $x^2-7x+6=0$.'
  - 'Multiplicando por $2$: $2x^2-14x+12=0$.'
- titulo: Construcción con raíz negativa y coeficiente principal negativo
  enunciado: Construye la ecuación cuadrática con raíces $-2$ y $3$, y coeficiente
    principal $a=-1$.
  solucion_pasos:
  - 'Mónica: suma $=1$, producto $=-6$, dando $x^2-x-6=0$.'
  - 'Multiplicando por $-1$: $-x^2+x+6=0$.'
- titulo: ¿La ecuación construida con un coeficiente principal distinto de 1 tiene
    las mismas raíces que la mónica?
  enunciado: ¿La ecuación construida con un coeficiente principal distinto de 1 tiene
    las mismas raíces que la mónica?
  respuesta: Sí
  solucion_pasos:
  - Multiplicar toda la ecuación por una constante distinta de cero no cambia su conjunto
    solución.
- titulo: ¿Existen infinitas ecuaciones cuadráticas distintas con las mismas dos raíces?
  enunciado: ¿Existen infinitas ecuaciones cuadráticas distintas con las mismas dos
    raíces?
  respuesta: Sí
  solucion_pasos:
  - Cada valor distinto del coeficiente principal $a$ genera una ecuación diferente
    (aunque equivalente en soluciones), por lo que hay infinitas posibilidades.
errores_frecuentes:
- Olvidar multiplicar todos los términos de la ecuación mónica por el coeficiente
  principal, multiplicando solo algunos.
- Confundir el coeficiente principal solicitado con uno de los valores de las raíces.
- Cometer errores de signo al multiplicar una ecuación con términos negativos por
  un coeficiente también negativo.
- Suponer incorrectamente que cambiar el coeficiente principal cambia las raíces de
  la ecuación.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando formación
  de una ecuación cuadrática general conocidas sus raíces y coeficiente principal.
