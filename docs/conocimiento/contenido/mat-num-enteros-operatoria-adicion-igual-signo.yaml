semantic_id: MAT.NUM.ENTEROS_OPERATORIA.ADICION_IGUAL_SIGNO
resumen_inicial: Para sumar enteros del mismo signo, se suman sus valores absolutos y se conserva el signo común.
explicacion_simple: 'Cuando sumamos dos números que tienen exactamente el mismo signo (ambos positivos o ambos negativos), sus magnitudes se acumulan en la misma dirección. Pensamos en acumular dos ganancias o dos deudas: la cantidad total crece y se mantiene la misma naturaleza del signo original.


  ![Adición de enteros con el mismo signo](/static/img/nodos/adicion-de-enteros-con-el-mismo-signo-intro.svg)'
explicacion_formal: 'Para dos enteros $a, b \in \mathbb{Z}$ tales que $\operatorname{sgn}(a) = \operatorname{sgn}(b)$, la **Regla de Adición de Igual Signo** se define como:


  $$a + b = \operatorname{sgn}(a) \cdot \left( |a| + |b| \right)$$


  **Desglose de la fórmula:**

  - $\operatorname{sgn}(a)$: Función signo que devuelve $+1$ si $a > 0$ o $-1$ si $a < 0$.

  - $|a| + |b|$: Suma aritmética de las distancias no negativas al origen.

  - $\operatorname{sgn}(a) \cdot (\dots)$: Garantiza que el resultado final conserve el signo común de los sumandos.


  > **Complemento didáctico:** Sumar dos números negativos como $(-3) + (-5)$ equivale a acumular deudas: se suman las magnitudes $3+5=8$ y se mantiene el signo negativo, dando $-8$.'
definiciones_clave: '- **Adición de igual signo**: Acumulación de valores absolutos bajo la conservación del signo común.

  - **Función signo**: Operador $\operatorname{sgn}(x)$ que extrae la polaridad positiva o negativa de un número.'
propiedades_relaciones: '- **Conservación de polaridad**: Positivo $+$ Positivo $=$ Positivo; Negativo $+$ Negativo $=$ Negativo.

  - **Clausura en $\mathbb{Z}$**: La suma de dos enteros cualesquiera genera siempre otro entero.'
ejemplo_guiado:
  enunciado: 'Calcule la suma de enteros negativos $(-12) + (-8)$ aplicando la regla de adición de igual signo.


    ![Ejemplo Adición de enteros con el mismo signo](/static/img/nodos/adicion-de-enteros-con-el-mismo-signo-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar que ambos sumandos tienen signo negativo.'
  - 'Paso 2: Sumar los valores absolutos de ambas cantidades: $|-12| + |-8| = 12 + 8 = 20$.'
  - 'Paso 3: Conservar el signo negativo común antecedente: $-(20) = -20$.'
  - 'Conclusión: $(-12) + (-8) = -20$.'
