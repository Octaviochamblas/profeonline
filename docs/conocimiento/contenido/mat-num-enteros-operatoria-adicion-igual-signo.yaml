semantic_id: MAT.NUM.ENTEROS_OPERATORIA.ADICION_IGUAL_SIGNO
resumen_inicial: "Para sumar dos enteros con el mismo signo, se suman sus valores absolutos y se conserva el signo común."
explicacion_simple: |
  Si pones $5 y luego $3 en una alcancía, tienes más dinero: sumaste dos positivos,
  $+5+3=+8$. Si debes $5 y pides prestados $3 más, tu deuda creció a $8: sumaste dos
  negativos, $-5+(-3)=-8$. Sumar con el mismo signo es juntar cosas del mismo tipo, ya
  sean monedas o deudas.
explicacion_formal: |
  Si $a, b \in \mathbb{Z}^+$: $a + b = +(|a| + |b|)$, y $(-a) + (-b) = -(|a| + |b|)$. En
  ambos casos se suman los valores absolutos y se conserva el signo común de los sumandos.
definiciones_clave: |
  **Valor absoluto**: la magnitud de un número sin su signo. **Signo común**: cuando ambos
  sumandos son positivos o ambos son negativos.
propiedades_relaciones: |
  El resultado de sumar dos enteros del mismo signo siempre tiene mayor valor absoluto que
  cualquiera de los sumandos por separado. Si ambos son positivos, el resultado es
  positivo; si ambos son negativos, el resultado es negativo.
ejemplo_guiado:
  enunciado: "Calcula $(-18) + (-7)$."
  pasos:
    - "Ambos sumandos son negativos: mismo signo."
    - "Se suman los valores absolutos: $18 + 7 = 25$."
    - "Se conserva el signo negativo: el resultado es $-25$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué signo tiene siempre el resultado de sumar dos enteros negativos?"
    choices:
      - {text: "Siempre positivo", is_correct: false}
      - {text: "Siempre negativo", is_correct: true}
      - {text: "Depende de cuál sea mayor", is_correct: false}
      - {text: "Siempre cero", is_correct: false}
    explanation: "La correcta es Siempre negativo: al sumar dos negativos se suman sus valores absolutos y se conserva el signo negativo."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-9) + (-14)$?"
    choices:
      - {text: "$-23$", is_correct: true}
      - {text: "$23$", is_correct: false}
      - {text: "$-5$", is_correct: false}
      - {text: "$5$", is_correct: false}
    explanation: "La correcta es $-23$: se suman los valores absolutos ($9+14=23$) y se conserva el signo negativo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el signo de los sumandos y verificar que sea el mismo."
  - "Paso 2: Calcular el valor absoluto de cada número (quitarles el signo)."
  - "Paso 3: Sumar los valores absolutos obtenidos."
  - "Paso 4: Escribir el resultado final con el signo que tenían los sumandos originales."
errores_correccion: |
  Un error frecuente es pensar que sumar dos negativos da positivo, confundiendo la regla
  de signos de la multiplicación con la de la adición. Otro error es restar los valores
  absolutos en vez de sumarlos cuando el signo es el mismo.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcular la suma de $-12$ y $-15$."
    alternativas:
      - "$-27$"
      - "$27$"
      - "$-3$"
    respuesta: "$-27$"
    solucion_pasos:
      - "Identificar los signos: ambos números son negativos ($-12$ y $-15$)."
      - "Calcular sus valores absolutos: $|-12| = 12$ y $|-15| = 15$."
      - "Sumar los valores absolutos: $12 + 15 = 27$."
      - "Mantener el signo común (negativo): el resultado es $-27$."
  - titulo: "Ejemplo 2"
    enunciado: 'En un termómetro, la temperatura desciende $5^{\circ}\text{C}$ en la mañana y luego otros $8^{\circ}\text{C}$ en la tarde. ¿Cuál es el cambio total de temperatura?'
    alternativas:
      - '$-13^{\circ}\text{C}$'
      - '$13^{\circ}\text{C}$'
      - '$-3^{\circ}\text{C}$'
    respuesta: '$-13^{\circ}\text{C}$'
    solucion_pasos:
      - "Representar los descensos como números negativos: $-5$ y $-8$."
      - "Sumar los cambios del mismo signo: $(-5) + (-8)$."
      - "Sumar los valores absolutos: $5 + 8 = 13$."
      - 'Mantener el signo negativo: el resultado es $-13^{\circ}\text{C}$ (un descenso de $13^{\circ}\text{C}$).'
  - titulo: "¿El resultado de $(-24) + (-36)$ es un número positivo?"
    respuesta: "No"
    solucion_pasos:
      - "Ambos números son negativos ($-24$ y $-36$)."
      - "La suma de dos números negativos siempre es un número negativo."
      - "Calculando: $-(24 + 36) = -60$, que es negativo."
  - titulo: "¿La suma de dos números enteros negativos tiene un valor absoluto mayor que el de cada sumando por separado?"
    respuesta: "Sí"
    solucion_pasos:
      - "Si sumamos $-a$ y $-b$ (con $a, b > 0$), el resultado es $-(a + b)$."
      - "El valor absoluto de la suma es $|-(a+b)| = a + b$."
      - "Como $a$ y $b$ son mayores que cero, la suma $a + b$ es estrictamente mayor que $a$ y mayor que $b$."
errores_frecuentes:
  - "Creer que la suma de dos números negativos da un resultado positivo porque 'menos por menos es más' (esta regla es para la multiplicación, no para la adición)."
  - "Restar los valores absolutos en lugar de sumarlos al tener el mismo signo."
  - "Olvidar escribir el signo negativo en el resultado de la suma de dos enteros negativos."
  - "Pensar que la suma de enteros positivos puede dar un número negativo."
  - "Creer que el valor absoluto de la suma de dos números del mismo signo es menor que la suma de sus valores absolutos."
afirmaciones_verdaderas:
  - "La suma de -4 y -6 es -10."
  - "Al sumar dos enteros positivos, el resultado siempre es positivo."
al_terminar_debes_poder: |
  Sumar dos enteros del mismo signo aplicando correctamente la suma de valores absolutos
  y la conservación del signo, sin confundir esta regla con la de la multiplicación.
fuente: "Enteros"
estado: publicado
