  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que ambos sumandos tengan exactamente el mismo signo.'
- 'Paso 2: Sumar las distancias no negativas (valores absolutos) de los dos números.'
- 'Paso 3: Asignar al resultado final el signo que compartían los sumandos originales.'
errores_correccion: '- **Error 1: Aplicar la regla de signos de la multiplicación a la suma de enteros.** Escribir $(-3) + (-5) = +8$ creyendo que ''menos por menos da más''. **Cómo corregirlo:** La regla de multiplicación no aplica en la adición; al sumar negativos se conserva el signo menos ($-8$).


  - **Error 2: Restar los números en lugar de sumarlos cuando ambos son negativos.** **Cómo corregirlo:** Al ser de igual signo, las magnitudes deben sumarse.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(-18) + (-7)$.
  alternativas:
  - '-25'
  - '25'
  - '-11'
  respuesta: '-25'
  solucion_pasos:
  - '$|-18| + |-7| = 18 + 7 = 25$. Conservando el signo: $-25$.'
- titulo: Ejemplo 2
  enunciado: Un buzo desciende 5 metros y luego desciende 8 metros más. ¿Cuál es su posición final respecto al nivel del mar?
  alternativas:
  - -13 metros
  - 13 metros
  - -3 metros
  respuesta: -13 metros
  solucion_pasos:
  - $(-5) + (-8) = -13$ metros.
- titulo: ¿La suma de dos números negativos da siempre como resultado un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, la adición de igual signo conserva la polaridad negativa.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
- titulo: ¿La suma (-4) + (-6) resulta en +10?
  respuesta: 'No'
  solucion_pasos:
  - No, $(-4) + (-6) = -10$.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
errores_frecuentes:
- La adición de dos números enteros negativos resulta siempre en un número entero positivo.
- Al sumar dos números enteros de igual signo se deben restar sus valores absolutos.
- La regla de los signos de la multiplicación aplica de igual manera en la adición de enteros.
- Sumar dos enteros negativos reduce la magnitud del resultado final haciéndolo más cercano al cero.
- El signo del resultado al sumar dos enteros negativos depende de cuál de los dos es mayor.
afirmaciones_verdaderas:
- Al sumar dos enteros del mismo signo, se suman sus valores absolutos y se conserva el signo común.
- La suma de dos números enteros negativos da como resultado otro entero negativo.
al_terminar_debes_poder: '**QUÉ:** Calcular la suma de dos o más números enteros con el mismo signo.


  **CÓMO:** Sumando sus valores absolutos $|a| + |b|$ y conservando el signo común de los sumandos: $(+a) + (+b) = +(a+b)$ o $(-a) + (-b) = -(a+b)$.


  ![Resumen Adición de enteros con el mismo signo](/static/img/nodos/adicion-de-enteros-con-el-mismo-signo-resumen.svg)'
