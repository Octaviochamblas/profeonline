semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.COMPLEMENTARIOS_TANGENTE
resumen_inicial: 'Relación entre tangente y cotangente de ángulos complementarios:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: De la misma forma que seno y coseno se intercambian entre ángulos
  complementarios, la tangente se relaciona con la cotangente del ángulo complementario,
  ya que ambas son cocientes de seno y coseno intercambiados.
explicacion_formal: '![Tangente y cotangente de ángulos complementarios](/static/img/geometria/trigonometria/trigid-complementarios-tangente.svg)


  ### Definición formal


  Como $\tan(90°-x)=\dfrac{\sin(90°-x)}{\cos(90°-x)}=\dfrac{\cos x}{\sin x}=\cot x$,
  se obtiene la identidad de complementariedad entre tangente y cotangente.


  ### Desarrollo didáctico


  En la figura, θ=40° y su complementario 90°-θ=50°. Se cumple que tan40°=cot50° y
  cot40°=tan50°, ya que ambas razones intercambian su papel al pasar de un ángulo
  a su complementario.'
definiciones_clave: '- **Relación entre tangente y cotangente de ángulos complementarios**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre tangente y cotangente de ángulos
  complementarios.'
ejemplo_guiado:
