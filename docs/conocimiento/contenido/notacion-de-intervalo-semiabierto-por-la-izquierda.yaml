  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar el límite no incluido ($a$) y el límite incluido ($b$).
- 'Escribir el intervalo con paréntesis en $a$ y corchete en $b$: $(a, b]$.'
- Dibujar la recta con un círculo vacío en $a$ y uno lleno en $b$.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en notación de intervalo semiabierto
  por la izquierda.
ejemplos:
- titulo: Análisis en un escenario práctico
  enunciado: Considera el contexto de MAT.ALG.INTERVALOS.SEMIABIERTO_IZQUIERDA. Determina
    las implicancias.
  solucion_pasos:
  - Establecer los límites.
  - Analizar el tipo de extremo.
  - Concluir.
- titulo: Evaluación de condición general
  enunciado: Dada la estructura del conjunto para MAT.ALG.INTERVALOS.SEMIABIERTO_IZQUIERDA,
    plantea la desigualdad.
  solucion_pasos:
  - Identificar la variable.
  - Aplicar la definición.
  - Escribir el intervalo.
- titulo: ¿Es cierto que todos los elementos de un conjunto finito pueden formar un
    intervalo denso?
  respuesta: 'No'
  solucion_pasos:
  - Recordar la definición de intervalo en $\mathbb{R}$.
  - Concluir que un conjunto finito no contiene todos los números reales entre dos
    puntos.
- titulo: ¿El uso de MAT.ALG.INTERVALOS.SEMIABIERTO_IZQUIERDA es adecuado para expresar
    desigualdades lineales simples?
  respuesta: Sí
  solucion_pasos:
  - Analizar el resultado de una desigualdad simple.
  - Verificar que su conjunto solución puede representarse como intervalo.
errores_frecuentes:
- El intervalo $(a, b]$ incluye al número $a$.
- Si $a=1$ y $b=5$, el intervalo semiabierto por izquierda es $[1, 5)$.
- Este intervalo incluye exactamente la mitad de los números entre $a$ y $b$.
- La longitud del intervalo semiabierto es distinta a la del cerrado.
- Se representa gráficamente con dos círculos vacíos.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  notación de intervalo semiabierto por la izquierda.
