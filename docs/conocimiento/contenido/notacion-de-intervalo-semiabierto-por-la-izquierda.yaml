semantic_id: MAT.ALG.INTERVALOS.SEMIABIERTO_IZQUIERDA
resumen_inicial: Un intervalo semiabierto por la izquierda excluye al extremo inferior $a$ e incluye al extremo superior $b$, denotado $]a, b]$.
explicacion_simple: '![Notación de intervalo semiabierto por la izquierda](/static/img/nodos/notacion-de-intervalo-semiabierto-por-la-izquierda-intro.svg)


  Un intervalo es **semiabierto por la izquierda** (o semicerrado por la derecha) cuando el límite de la izquierda NO se incluye, pero el límite de la derecha SÍ se incluye.

  Se escribe con notación $]a, b]$ y responde a la desigualdad $a < x \le b$.'
explicacion_formal: 'El **intervalo semiabierto por la izquierda** $]a, b]$ sobre $\mathbb{R}$ con $a < b$ se define como:


  $$]a, b] = (a, b] = \{x \in \mathbb{R} \mid a < x \le b\}$$


  **Desglose de la fórmula:**

  - $a \notin ]a, b]$ (extremo izquierdo excluido con corchete hacia afuera $]$).

  - $b \in ]a, b]$ (extremo derecho incluido con corchete hacia adentro $]$).'
definiciones_clave: '- **Intervalo semiabierto por la izquierda $]a, b]$**: Subconjunto real con extremo $a$ excluido y extremo $b$ incluido.'
propiedades_relaciones: '- **Asimetría de inclusión**: Combina una desigualdad estricta por la izquierda ($a < x$) con una no estricta por la derecha ($x \le b$).'
ejemplo_guiado:
  enunciado: '![Ejemplo Notación de intervalo semiabierto por la izquierda](/static/img/nodos/notacion-de-intervalo-semiabierto-por-la-izquierda-ejemplos.svg)


    Traduce la desigualdad $-2 < x \le 5$ a notación de intervalo y determina si $-2$ y $5$ pertenecen al intervalo.'
  pasos:
  - 'Paso 1: Identificar la desigualdad estricta a la izquierda ($-2 < x$) y no estricta a la derecha ($x \le 5$).Paso 2: Escribir la notación semiabierta por la izquierda: $]-2, 5]$.Paso 3: Evaluar $-2$: como el lado izquierdo es abierto, $-2 \notin ]-2, 5]$.Paso 4: Evaluar $5$: como el lado derecho es cerrado, $5 \in ]-2, 5]$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se representa en notación de intervalo el conjunto $\{x \in \mathbb{R} \mid -2 < x \le 5\}$?
  choices:
  - text: $]-2, 5]$
    is_correct: true
  - text: $[-2, 5[$
    is_correct: false
  - text: $[-2, 5]$
    is_correct: false
  - text: $]-2, 5[$
    is_correct: false
  explanation: La alternativa correcta es '$]-2, 5]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el intervalo $]-2, 5]$, ¿cuál de los extremos pertenece al conjunto?
  choices:
  - text: Solo el extremo derecho $5$.
    is_correct: true
  - text: Solo el extremo izquierdo $-2$.
    is_correct: false
  - text: Ambos extremos perteneces.
    is_correct: false
  - text: Ninguno de los extremos.
    is_correct: false
  explanation: La alternativa correcta es 'Solo el extremo derecho $5$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los extremos $a$ y $b$.'
- 'Paso 2: Poner corchete abierto por la izquierda $]$.'
- 'Paso 3: Poner corchete cerrado por la derecha $]$.'
- 'Paso 4: Escribir $]a, b]$.'
errores_correccion: '- **Error común:** Confundir qué lado es el abierto y cuál el cerrado.

  - **Cómo corregirlo:** La orientación del corchete en CADA BORDE determina si ese borde específico entra o no.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- El intervalo semiabierto por la izquierda $]3, 9]$ incluye al número $3$ dentro de su conjunto solución.
- La desigualdad que define al intervalo $]3, 9]$ se expresa con signos cerrados en ambos bordes $3 \le x \le 9$.
- En el intervalo $]3, 9]$, el extremo superior $x = 9$ queda excluido del conjunto.
- La notación $]3, 9]$ equivale exactamente al intervalo abierto $]3, 9[$.
- El corchete invertido en la izquierda $]$ de $]3, 9]$ indica inclusión del extremo inferior.
afirmaciones_verdaderas:
- El intervalo semiabierto por la izquierda $]a, b]$ excluye el extremo inferior $a$ e incluye el extremo superior $b$.
- La notación $]a, b]$ se corresponde con la desigualdad mixta $a < x \le b$.
al_terminar_debes_poder: '**QUÉ:** Expresar e interpretar intervalos semiabiertos por la izquierda $]a, b]$ o $(a, b]$.


  **CÓMO:** Combinando un corchete abierto en el límite inferior con un corchete cerrado en el límite superior ($a < x \le b$).


  ![Resumen Notación de intervalo semiabierto por la izquierda](/static/img/nodos/notacion-de-intervalo-semiabierto-por-la-izquierda-resumen.svg)'
