semantic_id: MAT.ALG.INTERVALOS.SEMIABIERTO_IZQUIERDA
resumen_inicial: 'Notación de intervalo semiabierto por la izquierda: relaciones de
  orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: Un intervalo semiabierto incluye uno de sus extremos y excluye
  el otro. Cuando es abierto por la izquierda, excluye el valor inicial.
explicacion_formal: '### Definición formal

  Un intervalo semiabierto por la izquierda se define como $(a, b] = \{ x \in \mathbb{R}
  \mid a < x \le b \}$.


  ### Desarrollo didáctico

  Al graficarlo, dibujamos un círculo hueco en el límite inferior y un círculo relleno
  en el límite superior.'
definiciones_clave: '- **Notación de intervalo semiabierto por la izquierda**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a notación de intervalo semiabierto por
  la izquierda.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de notación de intervalo
    semiabierto por la izquierda.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de notación de intervalo semiabierto por la
    izquierda, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
