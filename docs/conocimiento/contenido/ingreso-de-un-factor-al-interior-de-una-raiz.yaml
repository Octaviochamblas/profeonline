semantic_id: MAT.NUM.RAICES_PROPIEDADES.INGRESO_FACTOR_SUBRADICAL
resumen_inicial: 'El ingreso de un factor al interior de una raíz permite introducir un coeficiente positivo elevándolo al índice del radical: $a \cdot \sqrt[n]{b} = \sqrt[n]{a^n \cdot b}$ ($a > 0$).'
explicacion_simple: |
  Ingresar un número dentro de una raíz es el proceso inverso a sacarlo. Si tienes un número multiplicando por fuera de una raíz (como $3\sqrt{2}$) y quieres meterlo dentro del radical, debes "pagar el peaje" elevando ese número al índice de la raíz. Si la raíz es cuadrada, lo elevas al cuadrado ($3^2 = 9$) y lo multiplicas por lo que ya estaba adentro: $\sqrt{3^2 \cdot 2} = \sqrt{9 \cdot 2} = \sqrt{18}$.
explicacion_formal: |
  ### Definición formal
  La **propiedad de ingreso de un factor subradical** establece que para todo coeficiente $a \in \mathbb{R}^+$ y radicando $b \in \mathbb{R}^+$ (con $b \ge 0$ si el índice $n$ es par):
  $$a \cdot \sqrt[n]{b} = \sqrt[n]{a^n} \cdot \sqrt[n]{b} = \sqrt[n]{a^n \cdot b}$$

  ### Regla de conservación de signos para coeficientes negativos
  Si el coeficiente exterior es negativo ($a < 0$) y el índice $n$ es par:
  1. El signo negativo debe permanecer **fuera** del radical para preservar el valor real del número.
  2. Únicamente el valor absoluto o magnitud positiva $|a|$ se eleva al índice $n$ e ingresa al radicando.
  $$-a \cdot \sqrt[n]{b} = -\sqrt[n]{a^n \cdot b} \quad (a > 0)$$

  ### Síntesis didáctica
  - Coeficiente exterior $a$: Se eleva a la potencia del índice ($a^n$).
  - Operación subradical: Se multiplica la potencia resultante por el radicando preexistente ($a^n \cdot b$).
definiciones_clave: |
  - **Ingreso de factor**: Proceso de unificación que introduce coeficientes externos al interior de una sola expresión radical.
  - **Potencia de ingreso $a^n$**: Resultado de elevar el coeficiente exterior al grado o índice del radical receptor.
  - **Radicando unificado $a^n \cdot b$**: Producto resultante dentro del radical tras ingresar el factor.
propiedades_relaciones: |
  - **Comparación de radicales**: El ingreso de factores es la técnica fundamental para comparar el tamaño de radicales de distinto coeficiente (ej: saber cuál es mayor entre $3\sqrt{5}$ y $4\sqrt{3}$).
  - **Operación inversa**: Es exactamente la operación inversa de la extracción de factores subradicales.
ejemplo_guiado:
  enunciado: 'Ingresa el coeficiente exterior del número $N = 3\sqrt{5}$ al interior de la raíz cuadrada y calcula el radicando final unificado.'
  pasos:
    - 'Paso 1: Identificamos el coeficiente exterior $a = 3$, el radicando interno $b = 5$ y el índice implícito de la raíz cuadrada $n = 2$.'
    - 'Paso 2: Elevamos el coeficiente exterior al índice de la raíz: $a^n = 3^2 = 9$.'
    - 'Paso 3: Introducimos $9$ dentro del radical multiplicándolo por el radicando preexistente $5$: $N = \sqrt{9 \cdot 5}$.'
    - 'Paso 4: Realizamos la multiplicación interna: $N = \sqrt{45}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué procedimiento debe realizarse para ingresar un coeficiente positivo $a$ al interior de un radical de índice $n$ ($a \cdot \sqrt[n]{b}$)?'
    choices:
      - {text: 'Se eleva el factor al índice $n$ ($a^n$) y entra multiplicando al radicando $b$ ($\sqrt[n]{a^n \cdot b}$)', is_correct: true}
      - {text: 'Se entra el factor $a$ directamente multiplicando sin elevar a ninguna potencia', is_correct: false}
      - {text: 'Se multiplica el factor por el índice y se suma al radicando', is_correct: false}
      - {text: 'Se divide el radicando entre el factor $a$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se eleva el factor al índice $n$ ($a^n$) y entra multiplicando al radicando $b$ ($\sqrt[n]{a^n \cdot b}$)''. Para ingresar al radical de índice $n$, el factor debe elevarse a la potencia $a^n$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la expresión equivalente tras ingresar el coeficiente en la expresión $2\sqrt{7}$?'
    choices:
      - {text: '$\sqrt{28}$, pues $\sqrt{2^2 \cdot 7} = \sqrt{4 \cdot 7} = \sqrt{28}$', is_correct: true}
      - {text: '$\sqrt{14}$, multiplicando $2 \cdot 7$', is_correct: false}
      - {text: '$\sqrt{49}$, elevando 7 al cuadrado', is_correct: false}
      - {text: '$\sqrt{56}$, multiplicando por 8', is_correct: false}
    explanation: 'La alternativa correcta es ''$\sqrt{28}$, pues $\sqrt{2^2 \cdot 7} = \sqrt{4 \cdot 7} = \sqrt{28}$''. Elevamos $2^2 = 4$ y multiplicamos $4 \cdot 7 = 28$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente exterior $a$, el radicando $b$ y el índice del radical $n$.'
  - 'Paso 2: Elevar el coeficiente exterior a la potencia igual al índice del radical ($a^n$).'
  - 'Paso 3: Introducir la potencia $a^n$ dentro de la raíz multiplicándola por el radicando $b$.'
  - 'Paso 4: Resolver el producto interno $a^n \cdot b$ para obtener la raíz unificada final.'
errores_correccion: |
  - **Error 1:** Ingresar el factor multiplicándolo directamente sin elevarlo al índice (ej: escribir $3\sqrt{2} = \sqrt{3 \cdot 2} = \sqrt{6}$). **Cómo corregirlo:** Para ingresar a una raíz de índice $n$, el número debe **elevarse al índice**: $3^2 \cdot 2 = 9 \cdot 2 = 18 \implies \sqrt{18}$.
  - **Error 2:** Introducir un signo negativo dentro de una raíz de índice par (ej: $-2\sqrt{3} = \sqrt{(-2)^2 \cdot 3} = \sqrt{12}$). **Cómo corregirlo:** Para raíces de índice par, el signo negativo se **mantiene fuera** del radical: $-2\sqrt{3} = -\sqrt{2^2 \cdot 3} = -\sqrt{12}$.
ejemplos:
  - titulo: 'Ingreso en raíz cuadrada'
    enunciado: '¿El número $4\sqrt{3}$ equivale a la raíz unificada $\sqrt{48}$?'
    alternativas:
      - 'Sí, pues $\sqrt{4^2 \cdot 3} = \sqrt{16 \cdot 3} = \sqrt{48}$'
      - 'No, equivale a $\sqrt{12}$'
      - 'No, equivale a $\sqrt{36}$'
    respuesta: 'Sí, pues $\sqrt{4^2 \cdot 3} = \sqrt{16 \cdot 3} = \sqrt{48}$'
    solucion_pasos:
      - '1. Elevamos el coeficiente al cuadrado: $4^2 = 16$.'
      - '2. Multiplicamos subradicalmente: $\sqrt{16 \cdot 3} = \sqrt{48}$.'
  - titulo: 'Ingreso en raíz cúbica'
    enunciado: '¿Al ingresar el coeficiente en $2\sqrt[3]{5}$ resulta $\sqrt[3]{40}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Elevamos al cubo $2^3 = 8 \implies \sqrt[3]{8 \cdot 5} = \sqrt[3]{40}$.'
  - titulo: 'Comparación de radicales mediante ingreso'
    enunciado: 'Para saber si $3\sqrt{5}$ es mayor que $4\sqrt{3}$, ¿se ingresan los coeficientes obteniendo $\sqrt{45}$ y $\sqrt{48}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $3\sqrt{5} = \sqrt{45}$ y $4\sqrt{3} = \sqrt{48}$. Como $45 < 48$, se concluye que $3\sqrt{5} < 4\sqrt{3}$.'
  - titulo: 'Conservación del signo negativo exterior'
    enunciado: '¿La expresión $-5\sqrt{2}$ equivale a $-\sqrt{50}$ en los números reales?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El signo negativo queda fuera: $-\sqrt{5^2 \cdot 2} = -\sqrt{50}$.'
errores_frecuentes:
  - 'Ingresar un factor exterior $a$ a una raíz cuadrada multiplicando directamente $a \cdot b$ sin elevar $a$ al cuadrado.'
  - 'Ingresar el signo menos de un número negativo al interior de una raíz cuadrada real.'
  - 'Sumar el coeficiente exterior al radicando en lugar de multiplicarlo.'
  - 'Al ingresar un factor a una raíz cúbica, el factor exterior se eleva al cuadrado.'
  - 'El ingreso de un factor altera el valor numérico absoluto de la expresión.'
afirmaciones_verdaderas:
  - 'El ingreso de un factor al interior de una raíz requiere elevar el coeficiente exterior a la potencia del índice radical: $a \cdot \sqrt[n]{b} = \sqrt[n]{a^n \cdot b}$.'
  - 'El ingreso de factores es la técnica estándar para comparar magnitudes de expresiones radicales sin usar calculadora.'
al_terminar_debes_poder: 'Ingresar coeficientes exteriores al interior de un radical elevándolos al índice para unificar expresiones en una sola raíz.'
