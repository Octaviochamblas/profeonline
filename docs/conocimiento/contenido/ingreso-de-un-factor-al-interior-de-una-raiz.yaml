resumen_inicial: 'Para ingresar un factor positivo $a$ al interior de una raíz $\sqrt[n]{b}$,
  se eleva dicho factor al índice $n$ multiplicándolo por el radicando: $\sqrt[n]{a^n
  \cdot b}$ ($a > 0$).'
explicacion_simple: Si queremos meter un número de afuera adentro de una raíz, debemos
  elevar ese número al exponente que indique el índice de la raíz para que entre multiplicando.
explicacion_formal: 'Para todo $a > 0$, $b \ge 0$ e índice $n \ge 2$, el **Ingreso
  de Factores** satisface la identidad inversa:


  $$a \cdot \sqrt[n]{b} = \sqrt[n]{a^n} \cdot \sqrt[n]{b} = \sqrt[n]{a^n \cdot b}$$


  > **Complemento didáctico:** Permite comparar radicales de distinta apariencia o
  unificar expresiones para simplificar.'
definiciones_clave: '- **Ingreso de factores**: Operación $a \cdot \sqrt[n]{b} = \sqrt[n]{a^n
  \cdot b}$ que traslada coeficientes al interior del radical.'
propiedades_relaciones: '- **Elevación al índice**: Eleva el coeficiente externo al
  exponente $n$ al cruzar al interior.'
ejemplo_guiado:
  enunciado: Ingrese el coeficiente $3$ al interior de la raíz $3\sqrt{2}$.
  pasos:
  - 'Paso 1: Identificar el índice de la raíz, que es $2$.'
  - 'Paso 2: Elevar el coeficiente $3$ al índice $2$: $3^2 = 9$.'
  - 'Paso 3: Multiplicar la potencia por el radicando interno: $\sqrt{9 \cdot 2} =
    \sqrt{18}$.'
  - 'Conclusión: $3\sqrt{2} = \sqrt{18}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación se le debe aplicar a un factor externo a para ingresarlo
    a una raíz de índice n?
  choices:
  - text: Se eleva el factor al índice n (a^n) y entra multiplicando al radicando
      b
    is_correct: true
  - text: Se multiplica a por el índice n
    is_correct: false
  - text: Se suma a al radicando b
    is_correct: false
  - text: Se divide el radicando por a
    is_correct: false
  explanation: La alternativa correcta es 'Se eleva el factor al índice n (a^n) y
    entra multiplicando al radicando b'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3 · sqrt(2), ¿cuál fue la raíz única equivalente
    resultante?
  choices:
  - text: sqrt(18)
    is_correct: true
  - text: sqrt(6)
    is_correct: false
  - text: sqrt(12)
    is_correct: false
  - text: sqrt(36)
    is_correct: false
  explanation: La alternativa correcta es 'sqrt(18)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de ingresar coeficientes al interior
  de un radical $a \cdot \sqrt[n]{b} = \sqrt[n]{a^n \cdot b}$, unificando la expresión
  en una sola raíz.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.INGRESO_FACTOR_SUBRADICAL
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.INGRESO_FACTOR_SUBRADICAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
