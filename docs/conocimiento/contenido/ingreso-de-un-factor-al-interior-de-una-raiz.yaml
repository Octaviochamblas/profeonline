semantic_id: MAT.NUM.RAICES_PROPIEDADES.INGRESO_FACTOR_SUBRADICAL
resumen_inicial: Para ingresar un factor positivo que está fuera de una raíz hacia
  el interior del radical, se eleva dicho factor al índice de la raíz ($c \sqrt[n]{a}
  = \sqrt[n]{c^n \cdot a}$).
explicacion_simple: 'Para meter un número que está afuera dentro de una raíz, lo elevas
  al índice de la raíz:

  $$3\sqrt{2} = \sqrt{3^2 \cdot 2} = \sqrt{9 \cdot 2} = \sqrt{18}$$

  Esto permite comparar raíces o dejarlas escritas en una sola expresión.'
explicacion_formal: 'Para todo $c \ge 0$, $a \ge 0$ y $n \in \mathbb{N}, n \ge 2$,
  se cumple:

  $$c \sqrt[n]{a} = \sqrt[n]{c^n} \cdot \sqrt[n]{a} = \sqrt[n]{c^n \cdot a}$$'
definiciones_clave: '- **Ingreso al radical**: Operación inversa a la extracción de
  factores.'
propiedades_relaciones: '- **Requisito de signo**: Solo factores positivos se pueden
  ingresar directamente en raíces de índice par.'
ejemplo_guiado:
  enunciado: Ingresa el factor 5 a la raíz $\sqrt{3}$.
  pasos:
  - Identificar el factor exterior $c = 5$ y el índice de la raíz $n = 2$.
  - 'Elevar el factor al índice: $5^2 = 25$.'
  - 'Multiplicar el radicando original $3$ por el factor ingresado $25$: $25 \cdot
    3 = 75$.'
  - 'Escribir el radical único: $\sqrt{75}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale ingresar el factor 2 en la raíz $\sqrt{7}$?
  choices:
  - text: \sqrt{28}
    is_correct: true
  - text: \sqrt{14}
    is_correct: false
  - text: \sqrt{49}
    is_correct: false
  - text: \sqrt{56}
    is_correct: false
  explanation: 'La correcta es: \sqrt{28}. $2\sqrt{7} = \sqrt{2^2 \cdot 7} = \sqrt{4
    \cdot 7} = \sqrt{28}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Ingresa el factor 2 en la raíz cúbica $\sqrt[3]{5}$.
  choices:
  - text: \sqrt[3]{40}
    is_correct: true
  - text: \sqrt[3]{20}
    is_correct: false
  - text: \sqrt[3]{10}
    is_correct: false
  - text: \sqrt[3]{30}
    is_correct: false
  explanation: 'La correcta es: \sqrt[3]{40}. $2\sqrt[3]{5} = \sqrt[3]{2^3 \cdot 5}
    = \sqrt[3]{8 \cdot 5} = \sqrt[3]{40}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el factor exterior y el índice $n$ del radical.'
- 'Paso 2: Elevar el factor exterior al exponente $n$.'
- 'Paso 3: Multiplicar el resultado por el radicando original.'
- 'Paso 4: Escribir la expresión completa dentro de un único radical.'
errores_correccion: No multipliques el factor exterior por el radicando sin elevarlo.
  $3\sqrt{2} \neq \sqrt{6}$; es $\sqrt{3^2 \cdot 2} = \sqrt{18}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ingresa el factor 4 en $\sqrt{3}$.
  alternativas:
  - \sqrt{48}
  - \sqrt{12}
  - \sqrt{36}
  respuesta: \sqrt{48}
  solucion_pasos:
  - $4^2 \cdot 3 = 16 \cdot 3 = 48 \implies \sqrt{48}$.
errores_frecuentes:
- Ingresar el factor sin elevarlo al índice de la raíz.
afirmaciones_verdaderas:
- $c \sqrt[n]{a} = \sqrt[n]{c^n \cdot a}$ para $c \ge 0$.
al_terminar_debes_poder: Ingresar factores dentro de un radical elevándolos al índice
  correspondiente.
fuente: Texto escolar MINEDUC.
estado: publicado
