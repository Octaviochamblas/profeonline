semantic_id: MAT.NUM.RAICES_PROPIEDADES.INGRESO_FACTOR_SUBRADICAL
resumen_inicial: 'Para ingresar un factor exterior al interior de una raíz, se eleva dicho factor al índice $n$ del radical y se multiplica por el radicando existente: $k \cdot \sqrt[n]{c} = \sqrt[n]{k^n \cdot c}$.'
explicacion_simple: '![Ingreso de factores a una raíz](/static/img/nodos/ingreso-de-un-factor-al-interior-de-una-raiz-intro.svg)


  Introducir un número dentro de una raíz es la operación inversa de la extracción:

  - Para que un número pueda entrar bajo el techo del radical, debe **''pagar el peaje'' elevándose al índice de la raíz**.

  - Por ejemplo, para meter el $3$ dentro de $\sqrt{2}$, como es raíz cuadrada ($n=2$), entra como $3^2 = 9$:

  $$3\sqrt{2} = \sqrt{3^2 \cdot 2} = \sqrt{9 \cdot 2} = \sqrt{18}$$

  - **¿Para qué sirve?** ¡Es la mejor herramienta en la prueba PAES para **comparar qué raíz es mayor**! Si quieres saber si $3\sqrt{5}$ es mayor que $4\sqrt{3}$, los metes a la raíz: $3\sqrt{5} = \sqrt{45}$ y $4\sqrt{3} = \sqrt{48}$. Como $48 > 45$, entonces $4\sqrt{3} > 3\sqrt{5}$.'
explicacion_formal: "Sean $k, c \\in \\mathbb{R}^+$ y $n \\in \\mathbb{N}$ con $n \\ge 2$. La **Propiedad de Introducción Subradical** establece:\n\n$$k \\cdot \\sqrt[n]{c} = \\sqrt[n]{k^n} \\cdot \\sqrt[n]{c} = \\sqrt[n]{k^n \\cdot c}$$\n\n**Preservación del signo en coeficientes negativos ($k < 0$):**\n- **Para índice par ($n = 2j$):** El signo menos NO ingresa al radical (violaría la condición de existencia real):\n  $$-k \\sqrt{c} = -\\left(k \\sqrt{c}\\right) = -\\sqrt{k^2 \\cdot c}$$\n- **Para índice impar ($n = 2j+1$):** El signo negativo puede ingresar conservando la equivalencia:\n  $$-k \\sqrt[3]{c} = \\sqrt[3]{(-k)^3 \\cdot c} = \\sqrt[3]{-k^3 c}$$"
definiciones_clave: '- **Introducción subradical**: Transformación de un producto $k\sqrt[n]{c}$ en un radical puro $\sqrt[n]{k^n c}$.

  - **Radical puro / simple**: Expresión radical con coeficiente unitario $1$.

  - **Comparación de magnitudes**: Ordenamiento de números irracionales mediante la función monótona creciente $\sqrt[n]{x}$.'
propiedades_relaciones: '- **Monotonía estricta**: Para $x, y > 0$: $x < y \iff \sqrt[n]{x} < \sqrt[n]{y}$.

  - **Comparación rápida**: $2\sqrt{7} = \sqrt{28}$ vs $3\sqrt{3} = \sqrt{27} \implies 2\sqrt{7} > 3\sqrt{3}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de ingreso de factores](/static/img/nodos/ingreso-de-un-factor-al-interior-de-una-raiz-ejemplos.svg)


    Exprese como radical simple $5\sqrt{3}$, $3\sqrt[3]{2}$ y $2\sqrt[4]{3}$ introduciendo los coeficientes.'
  pasos:
  - 'Paso 1: Evaluar $5\sqrt{3}$: Índice $2$. Entra como $5^2 = 25 \implies \sqrt{25 \cdot 3} = \sqrt{75}$.'
  - 'Paso 2: Evaluar $3\sqrt[3]{2}$: Índice $3$. Entra como $3^3 = 27 \implies \sqrt[3]{27 \cdot 2} = \sqrt[3]{54}$.'
  - 'Paso 3: Evaluar $2\sqrt[4]{3}$: Índice $4$. Entra como $2^4 = 16 \implies \sqrt[4]{16 \cdot 3} = \sqrt[4]{48}$.'
  - 'Conclusión: Las formas como radical simple son $\sqrt{75}$, $\sqrt[3]{54}$ y $\sqrt[4]{48}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente a $4\sqrt{5}$ como radical simple?
  choices:
  - text: $\sqrt{80}$ (porque $4^2 \cdot 5 = 16 \cdot 5 = 80$)
    is_correct: true
  - text: $\sqrt{20}$
    is_correct: false
  - text: $\sqrt{40}$
    is_correct: false
  - text: $\sqrt{100}$
    is_correct: false
  explanation: La alternativa correcta es '$\sqrt{80}$ (porque $4^2 \cdot 5 = 16 \cdot 5 = 80$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Cuál número es mayor: $3\sqrt{5}$ o $4\sqrt{3}$?'
  choices:
  - text: $4\sqrt{3}$ (porque $4\sqrt{3} = \sqrt{48}$ y $3\sqrt{5} = \sqrt{45}$, y $48 > 45$)
    is_correct: true
  - text: $3\sqrt{5}$
    is_correct: false
  - text: Son exactamente iguales
    is_correct: false
  - text: No se pueden comparar sin calculadora
    is_correct: false
  explanation: La alternativa correcta es '$4\sqrt{3}$ (porque $4\sqrt{3} = \sqrt{48}$ y $3\sqrt{5} = \sqrt{45}$, y $48 > 45$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ de la raíz receptora.'
- 'Paso 2: Elevar el coeficiente exterior a la potencia $n$ ($k^n$).'
- 'Paso 3: Multiplicar $k^n$ por el radicando interior $c$ bajo el radical único $\sqrt[n]{k^n \cdot c}$.'
errores_correccion: '- **Error 1: Ingresar el factor sin elevarlo al índice ($3\sqrt{2} = \sqrt{3 \cdot 2} = \sqrt{6}$).** **Cómo corregirlo:** Debe entrar elevado al índice: $3^2 \cdot 2 = 18 \implies \sqrt{18}$.

  - **Error 2: Ingresar el signo menos dentro de una raíz cuadrada ($-3\sqrt{2} = \sqrt{(-3)^2 \cdot 2} = \sqrt{18}$).** **Cómo corregirlo:** El signo menos debe mantenerse afuera: $-\sqrt{18}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se escribe $2\sqrt{7}$ como radical simple?
  alternativas:
  - $\sqrt{28}$
  - $\sqrt{14}$
  - $\sqrt{56}$
  respuesta: $\sqrt{28}$
  solucion_pasos:
  - $\sqrt{2^2 \cdot 7} = \sqrt{4 \cdot 7} = \sqrt{28}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué radical equivale $2\sqrt[3]{5}$?
  alternativas:
  - $\sqrt[3]{40}$
  - $\sqrt[3]{20}$
  - $\sqrt[3]{10}$
  respuesta: $\sqrt[3]{40}$
  solucion_pasos:
  - $\sqrt[3]{2^3 \cdot 5} = \sqrt[3]{8 \cdot 5} = \sqrt[3]{40}$.
- titulo: ¿Es 6√2 igual a √72?
  respuesta: Sí
  solucion_pasos:
  - Sí, $6^2 \cdot 2 = 36 \cdot 2 = 72 \implies \sqrt{72}$.
  alternativas:
  - texto: Sí, 6² · 2 = 36 · 2 = 72
    es_correcta: true
    retroalimentacion: ¡Correcto! Elevado al cuadrado dentro de la raíz.
  - texto: No, es igual a √12
    es_correcta: false
    retroalimentacion: Incorrecto, olvidaste elevar 6 al cuadrado.
  - texto: No, es igual a √36
    es_correcta: false
    retroalimentacion: Incorrecto, falta multiplicar por el 2 existente.
- titulo: ¿Es -5√2 igual a √50?
  respuesta: 'No'
  solucion_pasos:
  - No, $-5\sqrt{2} = -\sqrt{50} < 0$, mientras que $\sqrt{50} > 0$.
  alternativas:
  - texto: No, el signo menos debe quedar afuera (-√50)
    es_correcta: true
    retroalimentacion: ¡Correcto! El signo negativo se preserva fuera de la raíz.
  - texto: Sí, el signo menos desaparece
    es_correcta: false
    retroalimentacion: Incorrecto, cambiaría el signo del número original.
  - texto: Sí, (-5)² da 25 positivo
    es_correcta: false
    retroalimentacion: Incorrecto, $-5\sqrt{2}$ es un número real negativo.
errores_frecuentes:
- Ingresar factores sin elevarlos a la potencia del índice.
- Eliminar signos negativos al ingresar factores en raíces de índice par.
- Elevar al cuadrado cuando el índice de la raíz es 3 u otro valor.
- Sumar el factor ingresado en vez de multiplicarlo por el radicando.
- Confundir coeficientes con exponentes.
afirmaciones_verdaderas:
- Para introducir un factor al radical se debe elevar dicho factor al índice de la raíz.
- El ingreso de factores permite comparar y ordenar números irracionales de forma exacta.
- En raíces con índice par, los signos negativos exteriores permanecen siempre fuera del radical.
al_terminar_debes_poder: '![Síntesis de ingreso de factores](/static/img/nodos/ingreso-de-un-factor-al-interior-de-una-raiz-resumen.svg)


  QUÉ: Introducir factores externos al interior de una raíz para formar radicales puros y comparar magnitudes.


  CÓMO: Elevando el factor exterior al índice $n$ de la raíz ($k^n$), multiplicándolo por el radicando existente bajo el radical único $\sqrt[n]{k^n \cdot c}$ y preservando los signos negativos exteriores.'
