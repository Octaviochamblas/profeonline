  question: Si la hipotenusa de un triángulo 45°-45°-90° mide 10 cm, ¿cuánto mide cada cateto?
  choices:
  - text: $5\sqrt{2}\text{ cm}$
    is_correct: true
  - text: $10\text{ cm}$
    is_correct: false
