semantic_id: MAT.GEO.TRIANGULOS_NOTABLES_METRICA.RELACION_LADOS_45_45_90
resumen_inicial: 'En el triángulo $45^\circ-45^\circ-90^\circ$, la hipotenusa es igual al cateto multiplicado por $\sqrt{2}$ ($c = k\sqrt{2}$) y cada cateto es $k = \frac{c\sqrt{2}}{2}$.'
explicacion_simple: |
  ![Razón de Lados en 45°-45°-90°: 1 : 1 : √2](/static/img/nodos/relacion-de-lados-en-el-triangulo-45-45-90-cateto-hipotenusa-2-intro.svg)

  Si conoces el cateto, multiplícalo por $\sqrt{2}$ para tener la hipotenusa. Si conoces la hipotenusa, divídela por $\sqrt{2}$ (o multiplícala por $\frac{\sqrt{2}}{2}$) para hallar los catetos.
explicacion_formal: |
  ### Teorema métrico formal
  En todo triángulo notable de ángulos $45^\circ-45^\circ-90^\circ$, la razón de proporcionalidad entre sus lados viene dada por la terna canónica:

  $$a : b : c = 1 : 1 : \sqrt{2}$$

  Formulación analítica directa e inversa:

  $$c = k\sqrt{2} \iff k = \frac{c\sqrt{2}}{2}$$

  ### Desglose simbólico y geométrico
  - $k$: Longitud de cualquiera de los dos catetos idénticos ($a = b = k$).
  - $c$: Longitud de la hipotenusa.
  - Racionalización del cateto: $k = \frac{c}{\sqrt{2}} \cdot \frac{\sqrt{2}}{\sqrt{2}} = \frac{c\sqrt{2}}{2}$.
  - Razón trigonométrica: $\sin 45^\circ = \frac{k}{k\sqrt{2}} = \frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2}$.

  ### Síntesis didáctica
  La relación $c = k\sqrt{2}$ permite resolver instantáneamente diagonales de cuadrados y problemas de navegación y estática sin cálculos iterativos.
definiciones_clave: |
  - **Triángulo notable**: Triángulo rectángulo con ángulos fijos cuyas proporciones entre lados son constantes conocidas.
  - **Triángulo 45°-45°-90°**: Rectángulo isósceles de lados proporcionales a $1 : 1 : \sqrt2$.
  - **Triángulo 30°-60°-90°**: Semi-equilátero de lados proporcionales a $1 : \sqrt3 : 2$.
  - **Factor de escala ($k$)**: Constante multiplicativa lineal que define las dimensiones reales de los lados.
propiedades_relaciones: |
  - **Proporción 45-45-90**: $a = k, \ b = k, \ c = k\sqrt2$.
  - **Proporción 30-60-90**: $a = k \ (30^\circ), \ b = k\sqrt3 \ (60^\circ), \ c = 2k \ (90^\circ)$.
  - **Invarianza angular**: Los ángulos permanecen constantes al cambiar el factor de escala $k$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Razón de Lados en 45°-45°-90°: 1 : 1 : √2](/static/img/nodos/relacion-de-lados-en-el-triangulo-45-45-90-cateto-hipotenusa-2-ejemplos.svg)

    Aplica la proporción del triángulo notable y el factor de escala $k$ para determinar las medidas lineales incógnitas.
  pasos:
  - 'Paso 1: Identificar el tipo de triángulo notable a partir de sus ángulos ($45^\circ-45^\circ-90^\circ$ o $30^\circ-60^\circ-90^\circ$).'
  - 'Paso 2: Escribir la terna proporcional base ($1 : 1 : \sqrt2$ o $1 : \sqrt3 : 2$).'
  - 'Paso 3: Igualar la medida conocida a su término homólogo para hallar el factor de escala $k$.'
  - 'Paso 4: Multiplicar los demás términos de la terna por $k$ y racionalizar si es necesario.'
  - 'Paso 5: Registrar los valores finales acompañados de su unidad métrica.'
