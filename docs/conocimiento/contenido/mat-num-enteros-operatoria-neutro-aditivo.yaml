semantic_id: MAT.NUM.ENTEROS_OPERATORIA.NEUTRO_ADITIVO
resumen_inicial: "El cero es el elemento neutro de la adición: sumado a cualquier entero, lo deja igual. $a+0=a$."
explicacion_simple: |
  Imagina un juego donde ganas o pierdes puntos. En un turno pierdes 5 puntos ($-5$); en
  el siguiente, la tarjeta dice "avanzas 0 puntos". ¿Cuántos puntos tienes? ¡Sigues con
  $-5$! Sumar cero a cualquier número entero es como no hacerle nada: el número queda
  exactamente igual. Por eso al cero se le llama elemento neutro de la adición.
explicacion_formal: |
  Existe $0 \in \mathbb{Z}$ tal que para todo $a \in \mathbb{Z}$: $a + 0 = 0 + a = a$. El
  cero es el único entero que cumple esta propiedad para la adición.
definiciones_clave: |
  **Elemento neutro**: el elemento que, al operarse con cualquier otro, lo deja sin
  cambios. En la adición de $\mathbb{Z}$, ese elemento es el cero.
propiedades_relaciones: |
  El cero es neutro por ambos lados en la adición ($a+0=0+a=a$), pero solo por la derecha
  en la sustracción ($a-0=a$, mientras que $0-a=-a\neq a$ en general).
ejemplo_guiado:
  enunciado: "Resuelve la expresión $(-58) + 0 + (+58)$."
  pasos:
    - "El cero no aporta nada: $(-58) + 0 = -58$."
    - "Queda: $(-58) + (+58)$."
    - "Son opuestos: el resultado es $0$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el elemento neutro de la adición en $\\mathbb{Z}$?"
    choices:
      - {text: "El $1$", is_correct: false}
      - {text: "El $0$", is_correct: true}
      - {text: "El $-1$", is_correct: false}
      - {text: "No existe", is_correct: false}
    explanation: "La correcta es El $0$: sumado a cualquier entero, lo deja sin cambios."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $0 + (-40) + 0$?"
    choices:
      - {text: "$-40$", is_correct: true}
      - {text: "$40$", is_correct: false}
      - {text: "$0$", is_correct: false}
      - {text: "No se puede calcular", is_correct: false}
    explanation: "La correcta es $-40$: los ceros no aportan nada, así que el resultado es el único sumando distinto de cero."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar si uno de los sumandos en una adición es el número cero ($0$)."
  - "Paso 2: Reconocer que el cero no aporta ningún valor a la suma."
  - "Paso 3: Escribir como resultado final el otro sumando sin realizar ninguna modificación matemática."
errores_correccion: |
  Un error frecuente es confundir la adición con la multiplicación y creer que sumar cero
  da cero (esa regla es de multiplicar por cero, no de sumar). Otro error es pensar que
  sumar cero a un negativo cambia su signo a positivo.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcular la suma de $-234$ y $0$."
    alternativas:
      - "$-234$"
      - "$0$"
      - "$234$"
    respuesta: "$-234$"
    solucion_pasos:
      - "Identificar los sumandos: $-234$ y $0$."
      - "Reconocer que el cero es el elemento neutro de la adición."
      - "El resultado es el sumando no nulo: $-234$."
  - titulo: "Ejemplo 2"
    enunciado: "Resolver la expresión $0 + (+99) + 0$."
    alternativas:
      - "$99$"
      - "$0$"
      - "$-99$"
    respuesta: "$99$"
    solucion_pasos:
      - "Aplicar la propiedad asociativa o resolver de izquierda a derecha: primero sumamos $0 + (+99)$."
      - "Como el cero es neutro, $0 + (+99) = +99$."
      - "Luego sumamos el cero restante: $(+99) + 0$."
      - "El resultado final es $+99$ (o $99$)."
  - titulo: "¿Es el cero el elemento neutro de la sustracción (resta) en todas sus formas?"
    respuesta: "No"
    solucion_pasos:
      - "El cero es neutro por la derecha en la resta: $a - 0 = a$."
      - "Sin embargo, no lo es por la izquierda: $0 - a = -a$ (el opuesto de $a$)."
      - "Por ejemplo, $0 - 5 = -5$, que no es igual a $5$. Por lo tanto, no es un neutro general de la sustracción."
  - titulo: "¿La suma de un número entero negativo y cero puede ser un número positivo?"
    respuesta: "No"
    solucion_pasos:
      - "Sea $a$ un número entero negativo ($a < 0$)."
      - "Al sumar $a + 0$, por la propiedad del elemento neutro, el resultado es exactamente $a$."
      - "Dado que $a$ es negativo, el resultado seguirá siendo negativo."
errores_frecuentes:
  - 'Creer que la suma de un número con cero es cero (confundiendo la adición con la multiplicación, donde $a \cdot 0 = 0$).'
  - "Pensar que al sumar cero a un número negativo, este cambia su signo a positivo."
  - "Creer que el cero es el elemento neutro de la multiplicación en lugar de la adición."
  - "Suponer que $0 - a$ es igual a $a$ en lugar de $-a$."
  - 'Creer que existen otros elementos neutros para la adición en $\mathbb{Z}$ además del cero.'
afirmaciones_verdaderas:
  - "Sumar 0 a cualquier entero no cambia su valor."
  - "El 0 es el elemento neutro de la adición."
al_terminar_debes_poder: |
  Reconocer el cero como elemento neutro de la adición y explicar por qué no cumple el
  mismo rol en la sustracción por la izquierda.
fuente: "Enteros"
estado: publicado
