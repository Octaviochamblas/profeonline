semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_DEFINICION
resumen_inicial: 'Estudio de la función lineal: conceptos, representación y propiedades
  en Función constante y función lineal.'
explicacion_simple: Cuando duplicar la entrada duplica exactamente la salida, y triplicarla
  la triplica, estás frente a una función lineal.
explicacion_formal: '### Definición formal


  Una función $f: \mathbb{R} \to \mathbb{R}$ se llama lineal si existe $m \in \mathbb{R}
  - \{0\}$ tal que $f(x) = mx$ para todo $x$. Se cumple la propiedad de proporcionalidad:
  $f(x_1 + x_2) = f(x_1) + f(x_2)$ y $f(kx) = k f(x)$ para todo escalar $k$.


  ### Desarrollo didáctico


  La característica esencial es que no hay término independiente: cuando $x=0$, siempre
  se obtiene $f(0)=0$, sin excepción.


  Si $f(x) = 5x$: al duplicar la entrada de $2$ a $4$, la salida pasa de $10$ a $20$,
  también duplicándose. Esta proporcionalidad directa es la firma distintiva de las
  funciones lineales.'
definiciones_clave: '- **Estudio de la función lineal**: Elemento central en el estudio
  de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a estudio de la función lineal.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a estudio de la función
    lineal.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a estudio de la función lineal.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
