semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_DEFINICION
resumen_inicial: La función lineal es una función polinómica de primer grado de la forma $f(x) = mx$ con $m \neq 0$, cuya gráfica pasa siempre por el origen $(0, 0)$.
explicacion_simple: '![La función lineal es una función polinómica de primer grado de la forma $f(x) = mx$ con $m \neq 0$, cuya gráfica pasa siempre por el origen $(0, 0)$](/static/img/nodos/estudio-de-la-funcion-lineal-intro.svg)



  Una **función lineal** es una relación de la forma $f(x) = mx$, donde:

  - $m$ es la **pendiente** (un número real distinto de cero).

  - No tiene término suelto sumando ni restando ($n = 0$).


  Por eso, cuando evalúas en $x = 0$, el resultado siempre es $f(0) = m \cdot 0 = 0$.


  Esto significa que la gráfica de toda función lineal **pasa obligatoriamente por el origen de coordenadas $(0, 0)$**.'
explicacion_formal: "Una **función lineal** real es una transformación homogénea $f: \\mathbb{R} \\to \\mathbb{R}$ definida por:\n$$f(x) = mx, \\quad m \\in \\mathbb{R} \\setminus \\{0\\}$$\n\n**Propiedades algebraicas:**\n- **Dominio y Recorrido**: $\\text{Dom}(f) = \\mathbb{R}$, $\\text{Rec}(f) = \\mathbb{R}$.\n- **Biyección**: Al ser $m \\neq 0$, es biyectiva (inyectiva y sobreyectiva).\n- **Homogeneidad aditiva y escalar**:\n  1. $f(x_1 + x_2) = m(x_1 + x_2) = mx_1 + mx_2 = f(x_1) + f(x_2)$\n  2. $f(kx) = m(kx) = k(mx) = kf(x)$\n- **Cero de la función**: Su único cero es $x = 0$."
definiciones_clave: '- **Función lineal**: Función de primer grado de proporcionalidad directa sin término constante ($y = mx$).

  - **Pendiente $m$**: Coeficiente multiplicativo que fija la inclinación y razón de cambio.'
propiedades_relaciones: '- **Paso por el origen**: El par ordenado $(0, 0)$ siempre satisface la ecuación.

  - **Distinción con función afín**: La función afín $f(x) = mx + n$ tiene $n \neq 0$ y no pasa por el origen.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función lineal es una función polinómica de primer grado de la forma $f(x) = mx$ con $m \neq 0$, cuya gráfica pasa siempre por el origen $(0, 0)$](/static/img/nodos/estudio-de-la-funcion-lineal-ejemplos.svg)



    Dada la función lineal $f(x) = -3x$, determina su pendiente, evalúa $f(4)$ y demuestra que $f(0) = 0$.'
  pasos:
  - 'Paso 1: Identificar la pendiente como el coeficiente de $x$: $m = -3$.'
  - 'Paso 2: Evaluar en $x = 4$: $f(4) = -3(4) = -12$.'
  - 'Paso 3: Evaluar en $x = 0$: $f(0) = -3(0) = 0$.'
  - 'Paso 4: Concluir que es una función lineal decreciente que pasa por $(0, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes expresiones algebraicas corresponde a una función lineal?
  choices:
  - text: f(x) = 5x
    is_correct: true
  - text: f(x) = 5x - 2
    is_correct: false
  - text: f(x) = 5
    is_correct: false
  - text: f(x) = x^2
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 5x'. Las funciones lineales tienen la forma $f(x) = mx$ sin término independiente.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $f$ es una función lineal y $f(3) = 12$, ¿cuál es el valor de su pendiente $m$?
  choices:
  - text: '4'
    is_correct: true
  - text: '36'
    is_correct: false
  - text: '9'
    is_correct: false
  - text: 1/4
    is_correct: false
  explanation: La alternativa correcta es '4'. $f(3) = m(3) = 12 \implies m = 4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la regla funcional tenga la forma $f(x) = mx$ con $m \neq 0$.'
- 'Paso 2: Identificar la pendiente $m$.'
- 'Paso 3: Confirmar que la función pasa por el origen comprobando que $f(0) = 0$.'
- 'Paso 4: Evaluar imágenes sustituyendo $x$ y multiplicando directamente por la pendiente $m$.'
errores_correccion: '- **Error común:** Llamar ''función lineal'' a cualquier recta, incluyendo $f(x) = 2x + 5$.

  - **Cómo corregirlo:** En matemática escolar y formal, $f(x) = mx + n$ con $n \neq 0$ se denomina **función afín**. La función **lineal** es exclusivamente la que pasa por el origen ($n = 0$).'
ejemplos:
- titulo: 'Ejemplo 1: Pendiente fraccionaria'
  enunciado: Si $f(x) = \frac{2}{5}x$, ¿cuál es el valor de $f(15)$?
  alternativas:
  - '6'
  - '30'
  - '10'
  - 2/75
  respuesta: '6'
  solucion_pasos:
  - 'Paso 1: $f(15) = \frac{2}{5} \cdot 15$.'
  - 'Paso 2: $2 \cdot 3 = 6$.'
- titulo: 'Ejemplo 2: Homogeneidad'
  enunciado: Si $f$ es lineal con $f(4) = 10$, ¿cuál es el valor de $f(8)$?
  alternativas:
  - '20'
  - '14'
  - '18'
  - '40'
  respuesta: '20'
  solucion_pasos:
  - 'Paso 1: Al duplicar la entrada ($8 = 2 \cdot 4$), la salida se duplica.'
  - 'Paso 2: $f(8) = 2 \cdot f(4) = 2(10) = 20$.'
- titulo: 'Ejemplo 3: Preimagen en función lineal'
  enunciado: En $f(x) = -4x$, ¿cuál es la preimagen de $28$?
  alternativas:
  - '-7'
  - '7'
  - '-112'
  - '112'
  respuesta: '-7'
  solucion_pasos:
  - 'Paso 1: $-4x = 28$.'
  - 'Paso 2: $x = \frac{28}{-4} = -7$.'
- titulo: 'Ejemplo 4: Identificación conceptual'
  enunciado: ¿Cuál de las siguientes relaciones pasa por el origen $(0, 0)$?
  alternativas:
  - f(x) = -x
  - f(x) = x + 1
  - f(x) = 2x - 3
  - f(x) = 4
  respuesta: f(x) = -x
  solucion_pasos:
  - 'Paso 1: $f(0) = -(0) = 0$. Pasa por $(0,0)$ y es una función lineal.'
errores_frecuentes:
- Confundir funciones lineales con funciones afines.
- Olvidar que la gráfica de toda función lineal debe contener el origen (0, 0).
- Pensar que una función lineal puede tener pendiente cero.
afirmaciones_verdaderas:
- Una función lineal f(x) = mx pasa obligatoriamente por el origen de coordenadas (0, 0).
- Toda función lineal cumple la propiedad de homogeneidad f(kx) = k·f(x).
al_terminar_debes_poder: '**QUÉ:** Analizar, evaluar y clasificar funciones lineales de primer grado.


  **CÓMO:** Aplicando la forma canónica f(x) = mx, reconociendo su paso obligatorio por el origen y sus propiedades de linealidad.


  ![Resumen La función lineal es una función polinómica de primer grado de la forma $f(x) = mx$ con $m \neq 0$, cuya gráfica pasa siempre por el origen $(0, 0)$](/static/img/nodos/estudio-de-la-funcion-lineal-resumen.svg)'
