semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_DEFINICION
resumen_inicial: La función lineal se expresa como $f(x) = m \cdot x$ (con $m \neq
  0$) y pasa obligatoriamente por el origen $(0, 0)$.
explicacion_simple: 'Una **función lineal** se caracteriza por tener la forma $f(x)
  = m \cdot x$ sin término independiente sumando o restando.

  - El número $m$ se llama **pendiente** (o constante de proporcionalidad).

  - Como no tiene término sumando, si evalúas $x = 0$, obtienes $f(0) = m(0) = 0$.

  Esto significa que su gráfica pasa **SIEMPRE por el centro u origen del plano $(0,0)$**.'
explicacion_formal: 'La **función lineal** $f: \mathbb{R} \to \mathbb{R}$ con pendiente
  $m \in \mathbb{R} \setminus \{0\}$ se define formalmente como:


  $$f(x) = m \cdot x$$


  **Desglose de la fórmula:**

  - $m = \frac{f(x)}{x}$: Constante de proporcionalidad directa para todo $x \neq
  0$.

  - $f(0) = 0$: Condición obligatoria de paso por el origen de coordenadas $(0, 0)$.'
definiciones_clave: '- **Función lineal ($f(x) = m x$)**: Relación funcional de proporcionalidad
  directa entre las variables $x$ e $y$.

  - **Pendiente ($m$)**: Coeficiente multiplicativo que indica la tasa de variación
  y la inclinación de la recta.'
propiedades_relaciones: '- **Paso por el origen**: $(0,0) \in G(f)$ obligatoriamente.'
ejemplo_guiado:
  enunciado: Dada la función lineal $f(x) = -3x$, halla su pendiente, evalúa $f(0)$
    y $f(2)$, y confirma su paso por el origen.
  pasos:
  - 'Paso 1: Identificar la pendiente: $m = -3$.Paso 2: Evaluar $f(0) = -3(0) = 0
    \implies$ confirma que pasa por $(0,0)$.Paso 3: Evaluar $f(2) = -3(2) = -6 \implies$
    pasa por el punto $(2, -6)$.Paso 4: Concluir que es una función lineal decreciente
    que cruza el origen.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué punto del plano cartesiano pertenece obligatoriamente a la gráfica
    de toda función lineal $f(x) = m x$?
  choices:
  - text: El origen de coordenadas $(0, 0)$.
    is_correct: true
  - text: El punto $(1, 0)$.
    is_correct: false
  - text: El punto $(0, 1)$.
    is_correct: false
  - text: El punto $(1, 1)$.
    is_correct: false
  explanation: La alternativa correcta es 'El origen de coordenadas $(0, 0)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dada la función lineal $f(x) = -3x$, ¿cuál es el valor numérico de su
    pendiente $m$?
  choices:
  - text: $m = -3$
    is_correct: true
  - text: $m = 3$
    is_correct: false
  - text: $m = 0$
    is_correct: false
  - text: $m = 1$
    is_correct: false
  explanation: La alternativa correcta es '$m = -3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la fórmula $f(x) = m x$ observando que no existe constante
  sumando.'
- 'Paso 2: Identificar la pendiente $m$ como el coeficiente que multiplica a la $x$.'
- 'Paso 3: Verificar que $f(0) = 0$ para confirmar que es lineal.'
errores_correccion: '- **Error común:** Llamar ''función lineal'' a cualquier recta
  (como $f(x) = 2x + 5$).

  - **Cómo corregirlo:** En el currículo chileno, si la recta tiene un número sumando
  ($f(x) = 2x + 5$), se llama **función afín**. La **función lineal** es SOLO la que
  NO tiene número sumando ($f(x) = m x$) y pasa por el origen.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
