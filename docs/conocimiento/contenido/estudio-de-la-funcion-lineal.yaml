procedimiento:
- 'Paso 1: Verifica que la fórmula tenga la forma $f(x) = mx$, sin término constante
  sumado.'
- 'Paso 2: Identifica el valor de $m$ (la pendiente).'
- 'Paso 3: Confirma que $f(0) = 0$, lo cual es característico de toda función lineal.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar estudio de la función lineal.
ejemplos:
- titulo: Identificación de función lineal
  enunciado: Determina si $f(x) = -3x$ es una función lineal.
  solucion_pasos:
  - Tiene la forma $mx$ con $m=-3$, sin término independiente.
  - Es una función lineal.
- titulo: Verificación de proporcionalidad
  enunciado: Si $f(x) = 4x$, verifica que $f(2+3) = f(2)+f(3)$.
  solucion_pasos:
  - $f(5) = 20$; $f(2)+f(3) = 8+12 = 20$.
  - Ambos coinciden, confirmando la propiedad de proporcionalidad.
- titulo: ¿$f(x) = 2x + 1$ es una función lineal?
  enunciado: ¿$f(x) = 2x + 1$ es una función lineal?
  respuesta: 'No'
  solucion_pasos:
  - Tiene un término independiente ($+1$), por lo que no cumple $f(0)=0$; es afín,
    no lineal.
- titulo: ¿Toda función lineal cumple $f(0)=0$?
  enunciado: ¿Toda función lineal cumple $f(0)=0$?
  respuesta: Sí
  solucion_pasos:
  - Al evaluar $f(x)=mx$ en $x=0$, se obtiene $m \cdot 0 = 0$ siempre.
errores_frecuentes:
- Confundir "función lineal" con cualquier función cuya gráfica sea una recta, incluyendo
  las afines con intercepto distinto de cero.
- Olvidar verificar que no exista término constante al clasificar una función como
  lineal.
- Creer que $m$ puede ser cero en una función lineal (en ese caso sería la función
  constante $f(x)=0$).
- Asumir que toda proporcionalidad implica necesariamente valores positivos.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando estudio
  de la función lineal.
