semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.LINEAL_DEFINICION
resumen_inicial: La función lineal se expresa mediante la fórmula $f(x) = mx$ ($m \neq 0$) y su gráfico es una recta que intersecta obligatoriamente al origen $(0, 0)$.
explicacion_simple: |
  Una **función lineal** es de la forma $f(x) = mx$:

  - El número $m$ es la pendiente.
  - **SIEMPRE pasa por el punto $(0, 0)$** (el origen del gráfico).
  - No tiene término independiente sumando (es decir, el término $+ b$ vale cero).

  Por ejemplo, en $f(x) = 3x$:
  - Para $x = 0 \implies y = 0$.
  - Para $x = 1 \implies y = 3$.
  - Para $x = 2 \implies y = 6$.
explicacion_formal: |
  Una función $f: \mathbb{R} \to \mathbb{R}$ se define como **función lineal** si su regla de correspondencia viene dada por:

  $$f(x) = mx \quad \text{con } m \in \mathbb{R} \setminus \{0\}$$

  **Propiedades principales:**
  - **Dominio**: $\text{Dom}(f) = \mathbb{R}$
  - **Recorrido**: $\text{Rec}(f) = \mathbb{R}$
  - **Pendiente**: $m$
  - **Punto de intersección**: $(0, 0)$
definiciones_clave: |
  - **Función lineal ($f(x) = mx$)**: Función de proporcionalidad cuyo gráfico es una recta no horizontal que atraviesa el origen de coordenadas.
propiedades_relaciones: |
  - **Crecimiento/Decrecimiento**:
    - Si $m > 0$, la función lineal es estrictamente creciente.
    - Si $m < 0$, la función lineal es strictly decreciente.
ejemplo_guiado:
  enunciado: "Analiza la función $f(x) = -4x$. Determina su pendiente, el punto por el que pasa obligatoriamente y su monotonía."
  pasos:
    - 'Paso 1: Identificar la pendiente: $m = -4$.'
    - 'Paso 2: Evaluar $f(0) = -4(0) = 0 \implies$ la gráfica pasa obligatoriamente por el origen $(0, 0)$.'
    - 'Paso 3: Analizar el signo de la pendiente: como $m = -4 < 0$, la función es estrictamente decreciente.'
    - 'Paso 4: Concluir que es una función lineal decreciente con pendiente $-4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué punto del plano cartesiano pertenece obligatoriamente a la gráfica de cualquier función lineal $f(x) = mx$?'
    choices:
      - {text: 'El origen de coordenadas $(0, 0)$', is_correct: true}
      - {text: 'El punto $(0, 1)$', is_correct: false}
      - {text: 'El punto $(1, 0)$', is_correct: false}
      - {text: 'El punto $(m, m)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El origen de coordenadas $(0, 0)$''. Para $x = 0 \implies f(0) = m(0) = 0$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dada la función lineal $f(x) = -4x$, ¿cuál es su monotonía?'
    choices:
      - {text: 'Es estrictamente decreciente', is_correct: true}
      - {text: 'Es estrictamente creciente', is_correct: false}
      - {text: 'Es constante', is_correct: false}
      - {text: 'No posee monotonía definida', is_correct: false}
    explanation: 'La alternativa correcta es ''Es estrictamente decreciente''. Como $m = -4 < 0$, la función desciende.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reconocer la forma algebraica $f(x) = mx$ comprobando que no tenga constante sumando.'
  - 'Paso 2: Extraer el coeficiente $m$ como la pendiente de la función.'
  - 'Paso 3: Marcar el punto fijo de origen $(0, 0)$ en el plano cartesiano.'
  - 'Paso 4: Evaluar un segundo punto $(1, m)$ y trazar la recta.'
errores_correccion: |
  - **Error común:** Confundir la función lineal $f(x) = mx$ con la función afín $f(x) = mx + b$.
  - **Cómo corregirlo:** La función LINEAL **NO tiene constante $+ b$** y pasa por $(0,0)$; la función AFÍN **SÍ tiene constante $+ b$** y no pasa por $(0,0)$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La función lineal $f(x) = mx$ incluye un término independiente constante $b \neq 0$ que desplaza la recta.'
  - 'La gráfica de cualquier función lineal $f(x) = mx$ no pasa por el origen de coordenadas $(0, 0)$.'
  - 'Si $m = 0$ en $f(x) = mx$, la función lineal se transforma en una recta vertical.'
  - 'El dominio de la función lineal $f(x) = 3x$ se restringe a los números enteros.'
  - 'La pendiente $m$ de una función lineal se calcula dividiendo la variable independiente entre la dependiente.'
afirmaciones_verdaderas:
  - 'Una función lineal es de la forma $f(x) = mx$ con $m \neq 0$, y su gráfica es siempre una recta que pasa por el origen $(0, 0)$.'
  - 'La constante $m$ representa la pendiente y la constante de proporcionalidad directa entre las variables.'
al_terminar_debes_poder: |
  QUÉ: Analizar y caracterizar la función lineal en sus formas simbólica y gráfica.
  CÓMO: Identificar la forma $f(x) = mx$, comprobar la intersección en $(0, 0)$ y utilizar la pendiente $m$ para determinar su comportamiento.
