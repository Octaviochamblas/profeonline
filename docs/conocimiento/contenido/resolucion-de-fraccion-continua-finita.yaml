semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.FRACCION_CONTINUA_FINITA
resumen_inicial: Una fracción continua finita se resuelve progresivamente desde el
  nivel más profundo (de abajo hacia arriba).
explicacion_simple: 'Una fracción continua finita es una torre de fracciones escalonadas
  una debajo de otra.

  Para resolverlas correctamente, la regla de oro es comenzar SIEMPRE desde abajo
  hacia arriba:

  1. Resolvemos la suma o resta del nivel más profundo.

  2. Invertimos la fracción resultante en ese nivel.

  3. Sumamos esa nueva expresión con el nivel superior y repetimos el proceso hasta
  llegar a la cima.'
explicacion_formal: 'Una **fracción continua finita** de orden $k$ se representa como:


  $$F(x) = a_0 + \frac{b_1}{a_1 + \frac{b_2}{a_2 + \frac{\dots}{a_{k-1} + \frac{b_k}{a_k}}}}$$


  **Algoritmo de resolución ascendente:**

  1. Iniciar en el nivel inferior $a_{k-1} + \frac{b_k}{a_k} = \frac{a_{k-1} a_k +
  b_k}{a_k}$.

  2. Invertir la fracción recíproca $\frac{b_k}{a_k} \implies \frac{b_k a_k}{\dots}$
  y sustituir progresivamente hacia arriba en $a_{k-2}, \dots, a_0$.'
definiciones_clave: '- **Fracción continua finita**: Estructura fraccionaria en cascada
  con un número finito de niveles inferiores.

  - **Resolución ascendente**: Proceso sistemático de simplificación desde el nivel
  más profundo hasta la fracción principal superior.'
propiedades_relaciones: '- **Recursividad**: Cada nivel $k$ es una fracción compleja
  de segundo nivel con respecto al nivel $k-1$.

  - **Dominio acumulado**: Requiere que la expresión de cada nivel parcial sea no
  nula para permitir su inversión.'
ejemplo_guiado:
  enunciado: Resuelve la fracción continua finita $F(x) = 1 + \frac{1}{1 + \frac{1}{x}}$,
    exprésala como una sola fracción irreducible y evalúa para $x = 4$.
  pasos:
  - 'Paso 1: Resolver el nivel inferior más profundo: $1 + \frac{1}{x} = \frac{x +
    1}{x}$.Paso 2: Invertir el resultado en el nivel medio: $\frac{1}{\frac{x + 1}{x}}
    = \frac{x}{x + 1}$.Paso 3: Sumar el nivel superior: $1 + \frac{x}{x + 1} = \frac{(x
    + 1) + x}{x + 1} = \frac{2x + 1}{x + 1}$ para $x \notin \{-1, 0\}$.Paso 4: Evaluar
    para $x = 4$: $\frac{2(4) + 1}{4 + 1} = \frac{8 + 1}{5} = \frac{9}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué orden se deben resolver los niveles de una fracción continua finita?
  choices:
  - text: Desde el nivel inferior más profundo hacia arriba (de abajo hacia arriba).
    is_correct: true
  - text: Desde el término superior principal hacia abajo.
    is_correct: false
  - text: Se resuelven todos los términos simultáneamente al azar.
    is_correct: false
  - text: Multiplicando solo los denominadores de los extremos.
    is_correct: false
  explanation: La alternativa correcta es 'Desde el nivel inferior más profundo hacia
    arriba (de abajo hacia arriba).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar $1 + \frac{1}{1 + \frac{1}{x}}$ y evaluar la expresión
    para $x = 4$, ¿cuál es el resultado?
  choices:
  - text: $\frac{9}{5}$
    is_correct: true
  - text: $\frac{5}{9}$
    is_correct: false
  - text: $\frac{8}{5}$
    is_correct: false
  - text: $\frac{9}{4}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{9}{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el nivel fraccionario situado en el fondo de la torre.'
- 'Paso 2: Sumar o restar las expresiones de ese nivel inferior.'
- 'Paso 3: Invertir el resultado de ese nivel convirtiéndolo en la fracción del nivel
  superior.'
- 'Paso 4: Repetir la suma e inversión avanzando hacia arriba nivel por nivel.'
- 'Paso 5: Escribir la fracción reducida final obtenida en la cima.'
errores_correccion: '- **Error común:** Intentar operar desde arriba o intentar distribuir
  términos del nivel superior hacia abajo.

  - **Cómo corregirlo:** La resolución de fracciones continuas es estrictamente DE
  ABAJO HACIA ARRIBA. No saltes ningún nivel.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración de fracción compleja.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de fracción compleja.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se aplica extremos y medios en fracciones complejas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla básica de simplificación.
- titulo: ¿Las fracciones continuas infinitas se resuelven con ecuaciones cuadráticas?
  respuesta: Sí
  solucion_pasos:
  - Sí, aprovechando su propiedad de auto-similitud.
errores_frecuentes:
- Confundir la barra principal de división con las barras secundarias.
- Invertir los medios y ponerlos en el numerador en la regla de extremos y medios.
- Multiplicar por el m.c.m. solo algunos términos omitiendo el denominador.
- Intentar resolver fracciones continuas finitas de arriba hacia abajo.
- Aceptar soluciones negativas al resolver fracciones continuas infinitas de términos
  positivos.
afirmaciones_verdaderas:
- Una fracción compleja se simplifica multiplicando extremos con extremos y medios
  con medios.
- Multiplicar numerador y denominador por el m.c.m. de las sub-fracciones elimina
  la complejidad en un solo paso.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, simplificar
  y resolver fracciones algebraicas complejas y continuas expresando el resultado
  en su forma más simple.
