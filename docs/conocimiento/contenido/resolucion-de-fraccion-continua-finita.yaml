errores_frecuentes:
- Tratar de aplicar extremos y medios sin haber condensado los escalones primero.
- Intentar resolver desde arriba hacia abajo.
- Para «El método más efectivo y seguro para resolver una fracción continua de múltiples
  niveles es:», la respuesta correcta es Multiplicar en cruz desde arriba.
- Para «El método más efectivo y seguro para resolver una fracción continua de múltiples
  niveles es:», la respuesta correcta es Cancelar los unos.
- Para «El método más efectivo y seguro para resolver una fracción continua de múltiples
  niveles es:», la respuesta correcta es Sumar todos los numeradores y todos los denominadores.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
