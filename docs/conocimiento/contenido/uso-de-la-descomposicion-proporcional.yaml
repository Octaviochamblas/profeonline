resumen_inicial: 'La descomposición proporcional permite transformar una proporción
  $\frac{a}{b} = \frac{c}{d}$ restando los denominadores a sus respectivos numeradores:
  $\frac{a-b}{b} = \frac{c-d}{d}$ o $\frac{a-b}{a} = \frac{c-d}{c}$.'
explicacion_simple: Descomponer una proporción significa restar el número de abajo
  al número de arriba en ambos lados. Al igual que en la composición, la nueva fracción
  resultante conserva la igualdad matemática entre ambos lados.
explicacion_formal: 'Para toda proporción $\frac{a}{b} = \frac{c}{d}$, la **Descomposición
  de Proporciones** establece las igualdades algebraicas válidas:


  $$\frac{a - b}{b} = \frac{c - d}{d} \quad \text{y} \quad \frac{a - b}{a} = \frac{c
  - d}{c}$$


  **Demostración:**

  Restando el entero $1$ a ambos lados de la ecuación original:

  $$\frac{a}{b} - 1 = \frac{c}{d} - 1 \implies \frac{a-b}{b} = \frac{c-d}{d}$$'
definiciones_clave: '- **Descomposición proporcional**: Propiedad $\frac{a-b}{b} =
  \frac{c-d}{d}$ derivada de restar 1 a la proporción.'
propiedades_relaciones: '- **Transformación por sustracción**: Resta el denominador
  al numerador conservando la equivalencia.'
ejemplo_guiado:
  enunciado: Aplique la descomposición a la proporción $\frac{7}{4} = \frac{21}{12}$
    y verifique la nueva igualdad.
  pasos:
  - 'Paso 1: Restar los denominadores a los numeradores: $\frac{7 - 4}{4} = \frac{21
    - 12}{12}$.'
  - 'Paso 2: Resolver las restas: $\frac{3}{4} = \frac{9}{12}$.'
  - 'Paso 3: Verificar equivalencia: $9 : 12 = 3 : 4 = 0,75$.'
  - 'Conclusión: La nueva proporción descompuesta $\frac{3}{4} = \frac{9}{12}$ es
    totalmente válida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué transformación caracteriza a la descomposición proporcional de a/b
    = c/d?
  choices:
  - text: Restar el denominador al numerador en ambos lados ((a-b)/b = (c-d)/d)
    is_correct: true
  - text: Sumar los numeradores entre sí
    is_correct: false
  - text: Dividir entre cero
    is_correct: false
  - text: Elevar todo al cuadrado
    is_correct: false
  explanation: La alternativa correcta es 'Restar el denominador al numerador en ambos
    lados ((a-b)/b = (c-d)/d)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 7/4 = 21/12, ¿cuál fue la proporción descompuesta
    resultante?
  choices:
  - text: 3/4 = 9/12
    is_correct: true
  - text: 11/4 = 33/12
    is_correct: false
  - text: 7/3 = 21/9
    is_correct: false
  - text: 1/4 = 1/12
    is_correct: false
  explanation: La alternativa correcta es '3/4 = 9/12'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de aplicar la descomposición proporcional
  $\frac{a-b}{b} = \frac{c-d}{d}$ para simplificar expresiones proporcionales compuestas.
semantic_id: MAT.NUM.PROPORCIONES.DESCOMPOSICION_PROPORCIONAL
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.DESCOMPOSICION_PROPORCIONAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
