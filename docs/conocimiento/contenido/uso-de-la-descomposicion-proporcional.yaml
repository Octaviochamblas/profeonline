semantic_id: MAT.NUM.PROPORCIONES.DESCOMPOSICION_PROPORCIONAL
resumen_inicial: La descomposición en proporciones establece que si $\frac{a}{b} = \frac{c}{d}$,
  entonces $\frac{a-b}{b} = \frac{c-d}{d}$ (con $a > b$ o trabajando en $\mathbb{R}$).
explicacion_simple: 'Si le restas a cada numerador su respectivo denominador en una proporción,
  la nueva igualdad también se mantiene:

  $$\frac{a}{b} = \frac{c}{d} \implies \frac{a-b}{b} = \frac{c-d}{d}$$

  Ejemplo: De $\frac{5}{2} = \frac{10}{4}$, restando denominadores arriba obtenemos $\frac{5-2}{2}
  = \frac{10-4}{4} \implies \frac{3}{2} = \frac{6}{4} = 1{,}5$.'
explicacion_formal: Dada la proporción $\frac{a}{b} = \frac{c}{d}$, restando 1 a ambos lados
  se obtiene $\frac{a}{b} - 1 = \frac{c}{d} - 1 \implies \frac{a-b}{b} = \frac{c-d}{d}$, propiedad
  llamada descomposición proporcional.
definiciones_clave: '- **Descomposición de proporciones**: Transformación por resta de antecedentes
  y consecuentes $\frac{a-b}{b} = \frac{c-d}{d}$.'
propiedades_relaciones: '- **Combinación con composición**: Al dividir composición entre descomposición
  resulta $\frac{a+b}{a-b} = \frac{c+d}{c-d}$.'
ejemplo_guiado:
  enunciado: Aplica descomposición a la proporción $\frac{7}{3} = \frac{14}{6}$.
  pasos:
  - 'Restar el denominador al numerador en ambos lados: $\frac{7-3}{3} = \frac{14-6}{6}$.'
  - 'Efectuar las restas: $\frac{4}{3} = \frac{8}{6}$.'
  - Verificar la igualdad simplificando $8/6 = 4/3$.
  - Concluir que la descomposición $\frac{4}{3} = \frac{8}{6}$ es correcta.
checkpoints:
- placement: after_explicacion_formal
  question: Si $\frac{a}{b} = \frac{c}{d}$, ¿cuál es la expresión equivalente por descomposición
    proporcional?
  choices:
  - text: (a - b) / b = (c - d) / d
    is_correct: true
  - text: (a + b) / b = (c - d) / d
    is_correct: false
  - text: a - c = b - d
    is_correct: false
  - text: a / c = d / b
    is_correct: false
  explanation: 'La correcta es: (a - b) / b = (c - d) / d. Propiedad de descomposición proporcional.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dada $\frac{9}{5} = \frac{18}{10}$, aplica la propiedad de descomposición.
  choices:
  - text: 4/5 = 8/10
    is_correct: true
  - text: 14/5 = 28/10
    is_correct: false
  - text: 9/4 = 18/8
    is_correct: false
  - text: 5/9 = 10/18
    is_correct: false
  explanation: 'La correcta es: 4/5 = 8/10. $(9-5)/5 = 4/5$ y $(18-10)/10 = 8/10$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la proporción $\frac{a}{b} = \frac{c}{d}$.'
- 'Paso 2: Restar a cada numerador su propio denominador.'
- 'Paso 3: Escribir la nueva proporción equivalente $\frac{a-b}{b} = \frac{c-d}{d}$.'
errores_correccion: Mantén el denominador correspondiente en cada fracción al restar.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\frac{8}{3} = \frac{16}{6}$, halla la descomposición.
  alternativas:
  - 5/3 = 10/6
  - 11/3 = 22/6
  respuesta: 5/3 = 10/6
  solucion_pasos:
  - $\frac{8-3}{3} = \frac{16-6}{6} \implies \frac{5}{3} = \frac{10}{6}$.
- titulo: Ejemplo 2
  enunciado: Si 9/4 = 18/8, ¿cuál es la descomposición?
  alternativas:
  - 5/4 = 10/8
  - 13/4 = 26/8
  - 9/5 = 18/10
  respuesta: 5/4 = 10/8
  solucion_pasos:
  - (9 menos 4) dividido entre 4 es 5/4, y (18 menos 8) dividido entre 8 es 10/8.
- titulo: ¿La propiedad de descomposición mantiene válida la proporción original?
  respuesta: Sí
  solucion_pasos:
  - El resultado sigue siendo una proporción verdadera.
- titulo: ¿La descomposición proporcional suma el denominador al numerador?
  respuesta: 'No'
  solucion_pasos:
  - La descomposición resta el denominador al numerador; sumar corresponde a la composición.
errores_frecuentes:
- Restar los denominadores invertidos.
- Restar los numeradores de ambas fracciones entre sí en vez de restar cada numerador con
  su propio denominador.
- Aplicar descomposición a razones que no forman una proporción válida.
- Confundir la propiedad de descomposición con la de composición, sumando en vez de restar.
- Invertir el orden de la resta, calculando el denominador menos el numerador.
afirmaciones_verdaderas:
- $\frac{a}{b} = \frac{c}{d} \implies \frac{a-b}{b} = \frac{c-d}{d}$.
- La propiedad de descomposición se puede verificar comprobando que el producto cruzado de
  la nueva proporción también se cumple.
al_terminar_debes_poder: Aplicar la propiedad de descomposición proporcional en la resolución
  de problemas.
fuente: Texto escolar MINEDUC.
estado: publicado
