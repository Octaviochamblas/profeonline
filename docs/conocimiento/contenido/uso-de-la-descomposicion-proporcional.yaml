semantic_id: MAT.NUM.PROPORCIONES.DESCOMPOSICION_PROPORCIONAL
resumen_inicial: 'La propiedad de la descomposición proporcional establece que si $\frac{a}{b} = \frac{c}{d}$, entonces se cumple la igualdad de las diferencias compuestas: $\frac{a-b}{b} = \frac{c-d}{d}$ y $\frac{a-b}{a} = \frac{c-d}{c}$.'
explicacion_simple: |
  Al igual que sumábamos el denominador al numerador, la descomposición proporcional permite restar el denominador al numerador en ambos lados de una proporción sin destruir la igualdad. Si sabes que $\frac{a}{b} = \frac{c}{d}$, restar 1 a ambos lados produce $\frac{a}{b} - 1 = \frac{c}{d} - 1 \implies \frac{a-b}{b} = \frac{c-d}{d}$. Por ejemplo, de $\frac{5}{2} = \frac{10}{4}$, descomponiendo obtenemos $\frac{5-2}{2} = \frac{10-4}{4} \implies \frac{3}{2} = \frac{6}{4}$, lo cual es completamente correcto ($1.5$).
explicacion_formal: |
  ### Definición formal
  Dada la proporción geométrica $\frac{a}{b} = \frac{c}{d}$ con $a, b, c, d \neq 0$:
  - La **descomposición por resta respecto al consecuente** establece:
    $$\frac{a - b}{b} = \frac{c - d}{d}$$
  - La **descomposición por resta respecto al antecedente** establece:
    $$\frac{a - b}{a} = \frac{c - d}{c}$$

  ### Demostración analítica
  Restando la unidad escalar ($1$) a ambos miembros de la ecuación original:
  $$\frac{a}{b} - 1 = \frac{c}{d} - 1 \implies \frac{a}{b} - \frac{b}{b} = \frac{c}{d} - \frac{d}{d} \implies \frac{a - b}{b} = \frac{c - d}{d}$$

  ### Aplicación en resolución de sistemas de diferencias
  Es fundamental para resolver problemas donde se conoce la diferencia de dos variables $x - y = D$ y su razón $\frac{x}{y} = \frac{m}{n}$:
  $$\frac{x - y}{y} = \frac{m - n}{n} \implies \frac{D}{y} = \frac{m - n}{n} \implies y = \frac{D \cdot n}{m - n}$$

  ### Síntesis didáctica
  - Operación: Restar el denominador al numerador en ambos lados de la proporción.
definiciones_clave: |
  - **Descomposición proporcional**: Propiedad que transforma una proporción restando los términos de cada razón.
  - **Diferencia de componentes $a - b$**: Término compuesto resultante de sustraer el consecuente del antecedente.
  - **Sistema de diferencias en razones**: Problema algebraico resuelto mediante la sustitución del dato $D = x - y$.
propiedades_relaciones: |
  - **Descomposición con el valor absoluto**: Si $a < b$, la diferencia $a - b$ resulta negativa; aplicando el módulo $|a - b|$ se preserva la magnitud de la diferencia.
  - **Combinación de Composición y Descomposición**: Dividiendo miembro a miembro la composición por la descomposición se obtiene la regla combinada: $\frac{a + b}{a - b} = \frac{c + d}{c - d}$.
ejemplo_guiado:
  enunciado: 'La razón entre dos números es $\frac{x}{y} = \frac{7}{4}$ y la diferencia entre ambos es $x - y = 15$. Halla el valor de $x$ e $y$ aplicando descomposición proporcional.'
  pasos:
    - 'Paso 1: Aplicamos la descomposición respecto al consecuente en la proporción inicial: $\frac{x - y}{y} = \frac{7 - 4}{4}$.'
    - 'Paso 2: Sustituimos el valor conocido de la diferencia $x - y = 15$: $\frac{15}{y} = \frac{3}{4}$.'
    - 'Paso 3: Aplicamos producto cruzado para despejar $y$: $3y = 15 \cdot 4 = 60 \implies y = \frac{60}{3} = 20$.'
    - 'Paso 4: Calculamos $x$ sumando la diferencia: $x = 20 + 15 = 35$. Verificación: $\frac{35}{20} = \frac{7}{4}$ y $35 - 20 = 15$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué igualdad se obtiene de la proporción $\frac{a}{b} = \frac{c}{d}$ al aplicar la descomposición proporcional respecto al consecuente?'
    choices:
      - {text: '$\frac{a - b}{b} = \frac{c - d}{d}$, restando el denominador al numerador en ambos lados', is_correct: true}
      - {text: '$\frac{a + b}{b} = \frac{c - d}{d}$, mezclando suma con resta', is_correct: false}
      - {text: '$a - b = c - d$, igualando directamente las restas', is_correct: false}
      - {text: '$\frac{a \cdot b}{b} = \frac{c \cdot d}{d}$, multiplicando los términos', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{a - b}{b} = \frac{c - d}{d}$, restando el denominador al numerador en ambos lados''. Se deduce restando 1 a ambos miembros.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $\frac{x}{y} = \frac{9}{5}$ y la diferencia es $x - y = 24$, ¿cuál es el valor de la variable $y$ por descomposición?'
    choices:
      - {text: '$30$, mediante el cálculo $\frac{24}{y} = \frac{9 - 5}{5} = \frac{4}{5} \implies 4y = 120 \implies y = 30$', is_correct: true}
      - {text: '$54$, que es la variable x', is_correct: false}
      - {text: '$12$, restando $24 - 12$', is_correct: false}
      - {text: '$20$, dividiendo $100 / 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$30$, mediante el cálculo $\frac{24}{y} = \frac{9 - 5}{5} = \frac{4}{5} \implies 4y = 120 \implies y = 30$''. Planteamos $\frac{24}{y} = \frac{4}{5} \implies y = 30$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la proporción inicial $\frac{a}{b} = \frac{c}{d}$.'
  - 'Paso 2: Restar el denominador al numerador en ambos miembros de la ecuación: $\frac{a - b}{b} = \frac{c - d}{d}$.'
  - 'Paso 3: Sustituir el valor numérico conocido de la diferencia $(a - b)$ en el numerador resultante.'
  - 'Paso 4: Aplicar el producto cruzado para despejar la incógnita deseada.'
errores_correccion: |
  - **Error 1:** Restar el denominador en el primer miembro pero sumarlo en el segundo miembro. **Cómo corregirlo:** La propiedad de descomposición exige **restar la misma cantidad en AMBOS lados** de la igualdad ($\frac{a-b}{b} = \frac{c-d}{d}$).
  - **Error 2:** Invertir la resta al sustraer ($b - a$ en lugar de $a - b$) alterando el signo del resultado. **Cómo corregirlo:** Sigue el orden estricto de **Numerador MENOS Denominador**: $a - b$.
ejemplos:
  - titulo: 'Descomposición en proporción numérica'
    enunciado: 'A partir de $\frac{8}{3} = \frac{16}{6}$, ¿la descomposición entrega la proporción válida $\frac{5}{3} = \frac{10}{6}$?'
    alternativas:
      - 'Sí, pues $(8-3)/3 = 5/3$ y $(16-6)/6 = 10/6$'
      - 'No, es falsa'
      - 'No, las restas dan distinto'
    respuesta: 'Sí, pues $(8-3)/3 = 5/3$ y $(16-6)/6 = 10/6$'
    solucion_pasos:
      - '1. Lado izquierdo: $(8-3)/3 = 5/3$.'
      - '2. Lado derecho: $(16-6)/6 = 10/6 = 5/3 \implies$ Válida.'
  - titulo: 'Despeje con diferencia de edades'
    enunciado: 'La razón de edades de dos personas es $\frac{5}{2}$ y su diferencia de edad es $12$ años. ¿La edad de la persona menor es $8$ años?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $12/y = 3/2 \implies 3y = 24 \implies y = 8$.'
  - titulo: 'Descomposición respecto al antecedente'
    enunciado: 'De $\frac{a}{b} = \frac{c}{d}$, ¿es válida la relación $\frac{a-b}{a} = \frac{c-d}{c}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la propiedad de descomposición respecto al antecedente.'
  - titulo: 'Regla combinada'
    enunciado: '¿Se cumple que $\frac{a+b}{a-b} = \frac{c+d}{c-d}$ para cualquier proporción verdadera $\frac{a}{b} = \frac{c}{d}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dividiendo la composición por la descomposición.'
errores_frecuentes:
  - 'Restar el denominador en el primer miembro pero sumarlo en el segundo miembro.'
  - 'Invertir el orden de la resta en los numeradores produciendo cambios involuntarios de signo.'
  - 'Igualar las diferencias numéricas directas $a - b = c - d$ omitiendo los denominadores.'
  - 'La descomposición proporcional consiste en simplificar el numerador y el denominador por un factor común.'
  - 'El resultado de la diferencia $a - b$ en la descomposición se considera siempre como un número positivo.'
afirmaciones_verdaderas:
  - 'La descomposición proporcional establece que si $\frac{a}{b} = \frac{c}{d}$, entonces se cumple $\frac{a-b}{b} = \frac{c-d}{d}$.'
  - 'La descomposición proporcional permite despejar directamente variables cuando se conoce la diferencia entre el antecedente y el consecuente.'
al_terminar_debes_poder: 'Aplicar la propiedad de descomposición proporcional $\frac{a-b}{b} = \frac{c-d}{d}$ para resolver ecuaciones y problemas basados en diferencias.'
