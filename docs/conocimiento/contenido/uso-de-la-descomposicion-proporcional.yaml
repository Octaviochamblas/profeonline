semantic_id: MAT.NUM.PROPORCIONES.DESCOMPOSICION_PROPORCIONAL
resumen_inicial: 'La descomposición de una proporción establece que al restar a cada antecedente su respectivo consecuente, la proporción se mantiene invariante: $\frac{a}{b} = \frac{c}{d} \implies \frac{a-b}{b} = \frac{c-d}{d}$ (o sobre $a$ y $c$).'
explicacion_simple: "![Descomposición proporcional](/static/img/nodos/uso-de-la-descomposicion-proporcional-intro.svg)\n\nLa **descomposición de una proporción** consiste en **restar el denominador al numerador** en ambos lados:\n$$\\frac{a}{b} = \\frac{c}{d} \\implies \\frac{a - b}{b} = \\frac{c - d}{d}$$\n- **¿Por qué funciona?** Porque equivale a restar $1$ a ambos miembros de la ecuación ($-1$).\n- **¿Para qué sirve?** Es la herramienta ideal cuando conocemos la **diferencia o resta de dos incógnitas**:\n  - Si sabemos que $\\frac{x}{y} = \\frac{7}{3}$ y que $x - y = 12$:\n  - Aplicamos descomposición: $\\frac{x - y}{y} = \\frac{7 - 3}{3} \\implies \\frac{12}{y} = \\frac{4}{3}$.\n  - Despejamos $y = \\frac{12 \\cdot 3}{4} = 9$, y por tanto $x = 9 + 12 = 21$."
explicacion_formal: '**Teorema de Descomposición de Proporciones:**

  Sea la proporción $\frac{a}{b} = \frac{c}{d}$ con $b, d \neq 0$. Entonces se verifican las siguientes identidades de descomposición:


  1. **Descomposición respecto a consecuentes:**

  $$\frac{a - b}{b} = \frac{c - d}{d}$$


  2. **Descomposición respecto a antecedentes ($a, c \neq 0$):**

  $$\frac{a - b}{a} = \frac{c - d}{c}$$


  **Demostración:**

  Restando $1$ a ambos miembros de la igualdad inicial:

  $$\frac{a}{b} - 1 = \frac{c}{d} - 1 \iff \frac{a - b}{b} = \frac{c - d}{d} \quad \blacksquare$$


  **Composición y Descomposición Simultánea:**

  Dividiendo ambas propiedades término a término se obtiene:

  $$\frac{a + b}{a - b} = \frac{c + d}{c - d} \quad (a \neq b, c \neq d)$$'
definiciones_clave: '- **Descomposición proporcional**: Transformación por sustracción de denominadores a numeradores.

  - **Diferencia de términos**: Estructura $a - b$ y $c - d$.

  - **Composición y descomposición simultánea**: Relación $\frac{a+b}{a-b} = \frac{c+d}{c-d}$.'
propiedades_relaciones: '- **Preservación de signo**: Si $a > b$, entonces $c > d$ y ambos numeradores resultan positivos.

  - **Desacoplamiento de diferencias**: Resuelve sistemas donde se da la diferencia entre dos variables.'
ejemplo_guiado:
  enunciado: '![Ejemplos de descomposición proporcional](/static/img/nodos/uso-de-la-descomposicion-proporcional-ejemplos.svg)


    Encuentre los valores de $x$ e $y$ sabiendo que $\frac{x}{y} = \frac{7}{3}$ y que $x - y = 12$, y verifique la descomposición en $\frac{10}{4} = \frac{15}{6}$.'
  pasos:
  - 'Paso 1: Para el sistema con $x-y=12$: Aplicar descomposición $\frac{x-y}{y} = \frac{7-3}{3}$.'
  - 'Paso 2: Sustituir la diferencia conocida: $\frac{12}{y} = \frac{4}{3}$.'
  - 'Paso 3: Despejar $y$: $y = \frac{12 \cdot 3}{4} = 9$.'
  - 'Paso 4: Calcular $x$: $x = y + 12 = 9 + 12 = 21$.'
  - 'Paso 5: Para la verificación: $\frac{10-4}{4} = \frac{6}{4} = 1,5$ y $\frac{15-6}{6} = \frac{9}{6} = 1,5$ (¡coinciden!).'
checkpoints:
- placement: after_explicacion_formal
  question: Si $\frac{a}{b} = \frac{c}{d}$, ¿cuál es la fórmula de la descomposición respecto a los consecuentes?
  choices:
  - text: $\frac{a-b}{b} = \frac{c-d}{d}$
    is_correct: true
  - text: $\frac{a+b}{b} = \frac{c+d}{d}$
    is_correct: false
  - text: $\frac{a-b}{a+b} = 1$
    is_correct: false
  - text: $\frac{a}{b-a} = \frac{c}{d-c}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{a-b}{b} = \frac{c-d}{d}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se verificó que x = 21 e y = 9 son correctos?
  choices:
  - text: Comprobando que $\frac{21}{9} = \frac{7}{3}$ y que $21 - 9 = 12$
    is_correct: true
  - text: Sumando 21 + 9 = 30
    is_correct: false
  - text: Multiplicando 21 x 9
    is_correct: false
  - text: Dividiendo 21 entre 12
    is_correct: false
  explanation: La alternativa correcta es 'Comprobando que $\frac{21}{9} = \frac{7}{3}$ y que $21 - 9 = 12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la proporción original $\frac{x}{y} = \frac{a}{b}$.'
- 'Paso 2: Aplicar la propiedad de descomposición restando denominadores a numeradores: $\frac{x-y}{y} = \frac{a-b}{b}$.'
- 'Paso 3: Sustituir la diferencia conocida $(x-y)$ y despejar la variable mediante producto cruzado.'
errores_correccion: '- **Error 1: Restar en orden inverso ($b - a$ en vez de $a - b$).** **Cómo corregirlo:** Si se resta numerador menos denominador en la izquierda ($x - y$), se DEBE restar en el mismo orden en la derecha ($a - b$).

  - **Error 2: Olvidar restar en ambos miembros.** **Cómo corregirlo:** La operación $-1$ aplica simultáneamente a ambos lados de la igualdad.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\frac{x}{y} = \frac{5}{2}$ y $x - y = 18$, ¿cuánto vale $x$?
  alternativas:
  - $30$
  - $12$
  - $24$
  respuesta: $30$
  solucion_pasos:
  - $\frac{x-y}{y} = \frac{5-2}{2} \implies \frac{18}{y} = \frac{3}{2} \implies y = 12$. Luego $x = 12 + 18 = 30$.
- titulo: Ejemplo 2
  enunciado: ¿Qué resulta al descomponer $\frac{8}{3} = \frac{16}{6}$ respecto a sus consecuentes?
  alternativas:
  - $\frac{5}{3} = \frac{10}{6}$
  - $\frac{11}{3} = \frac{22}{6}$
  - $\frac{8}{5} = \frac{16}{10}$
  respuesta: $\frac{5}{3} = \frac{10}{6}$
  solucion_pasos:
  - $\frac{8-3}{3} = \frac{5}{3}$ y $\frac{16-6}{6} = \frac{10}{6}$.
- titulo: ¿Es equivalente descomponer una proporción a restar 1 en ambos miembros?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{a}{b} - 1 = \frac{a-b}{b}$ y $\frac{c}{d} - 1 = \frac{c-d}{d}$.
  alternativas:
  - texto: Sí, restando 1 a ambos miembros se demuestra la propiedad
    es_correcta: true
    retroalimentacion: ¡Correcto! Demostración rigurosa.
  - texto: No, es multiplicar por -1
    es_correcta: false
    retroalimentacion: Incorrecto, multiplicar por -1 cambiaría los signos de todo el cociente.
  - texto: No, solo aplica para fracciones impropias
    es_correcta: false
    retroalimentacion: Incorrecto, es válido para cualquier par de números reales.
- titulo: ¿Permite la descomposición resolver problemas con diferencias conocidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la herramienta complementaria a la composición para resolver restas de incógnitas.
  alternativas:
  - texto: Sí, permite despejar incógnitas cuando se conoce su diferencia x - y
    es_correcta: true
    retroalimentacion: ¡Correcto! Desacoplamiento directo.
  - texto: No, solo sirve para números pares
    es_correcta: false
    retroalimentacion: Incorrecto, aplica a cualquier número real.
  - texto: No, siempre produce números negativos
    es_correcta: false
    retroalimentacion: Incorrecto, si $x > y$ la diferencia es estrictamente positiva.
errores_frecuentes:
- Invertir el orden de la resta en uno de los miembros.
- Restar en el lado izquierdo pero sumar en el derecho.
- Olvidar sumar la diferencia al valor despejado para hallar la segunda incógnita.
- Confundir los términos al aplicar la fórmula combinada.
afirmaciones_verdaderas:
- La descomposición de una proporción establece que $\frac{a-b}{b} = \frac{c-d}{d}$.
- Equivale algebraicamente a restar 1 en ambos miembros de la igualdad.
- Permite resolver sistemas proporcionales conociendo la diferencia de las variables.
al_terminar_debes_poder: '![Síntesis de descomposición proporcional](/static/img/nodos/uso-de-la-descomposicion-proporcional-resumen.svg)


  QUÉ: Aplicar la propiedad de descomposición de proporciones para resolver sistemas con diferencias conocidas.


  CÓMO: Transformando la proporción en $\frac{x-y}{y} = \frac{a-b}{b}$, sustituyendo la diferencia $x-y$ y despejando la incógnita mediante producto cruzado.'
