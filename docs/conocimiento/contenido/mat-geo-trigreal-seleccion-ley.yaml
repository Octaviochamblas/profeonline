procedimiento:
- 'Paso 1: Identifica qué datos conoces del triángulo (lados y ángulos).'
- 'Paso 2: Verifica si tienes un par lado-ángulo opuesto completo (o puedes obtenerlo
  calculando el tercer ángulo).'
- 'Paso 3: Si tienes ese par, usa la ley de senos; si no (LLL o LAL), usa la ley de
  cosenos.'
