semantic_id: MAT.GEO.TRIG_APLICA_REAL.SELECCION_LEY_SENOS_COSENOS
resumen_inicial: 'Selección entre ley de senos y ley de cosenos según los datos disponibles:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: 'No toda configuración de datos se resuelve de la misma forma:
  la ley de senos requiere un par lado-ángulo opuesto completo, mientras que la ley
  de cosenos se usa cuando se conocen los tres lados o dos lados con el ángulo comprendido.'
explicacion_formal: '![Selección entre ley de senos y ley de cosenos](/static/img/geometria/trigonometria/trigreal-seleccion-ley.svg)


  ### Definición formal


  Si los datos incluyen al menos un par lado-ángulo opuesto completo, se usa la ley
  de senos. Si los datos son los tres lados (LLL) o dos lados y el ángulo comprendido
  entre ellos (LAL), sin ningún par lado-ángulo opuesto completo, se usa la ley de
  cosenos.


  ### Desarrollo didáctico


  Por ejemplo, si se conocen dos ángulos y un lado (AAS o ASA), siempre existe un
  par lado-ángulo opuesto (ya que se puede calcular el tercer ángulo), por lo que
  se usa ley de senos. Si se conocen dos lados y el ángulo entre ellos (LAL), no hay
  ningún par completo, por lo que se debe usar ley de cosenos.'
definiciones_clave: '- **Selección entre ley de senos y ley de cosenos según los datos
