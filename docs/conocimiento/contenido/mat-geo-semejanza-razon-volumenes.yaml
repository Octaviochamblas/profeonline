semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.RAZON_VOLUMENES
resumen_inicial: 'Relación entre volúmenes de cuerpos semejantes como cubo de la razón
  de semejanza: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: Extendiendo la idea de la razón de áreas al espacio tridimensional,
  los volúmenes de cuerpos semejantes siguen un patrón similar, pero con una potencia
  distinta.
explicacion_formal: '![Razón entre volúmenes de cuerpos semejantes](/static/img/geometria/congruencia-semejanza/semejanza-razon-volumenes.svg)


  ### Definición formal


  Si dos cuerpos son semejantes con razón de semejanza $k$, entonces $\frac{V_2}{V_1}=k^3$,
  donde $V_1$ y $V_2$ son sus volúmenes respectivos.


  ### Desarrollo didáctico


  Esto ocurre porque el volumen depende del producto de tres longitudes, cada una
  escalada por $k$, por lo que el volumen total se multiplica por $k^3$. Por ejemplo,
  si un cubo se amplía al doble de tamaño ($k=2$), su volumen se multiplica por $2^3=8$,
  no solo por 2 o por 4.'
definiciones_clave: '- **Relación entre volúmenes de cuerpos semejantes como cubo
