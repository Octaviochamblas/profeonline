semantic_id: MAT.GEO.TRIANGULOS_METRICA.EXISTENCIA_TRIANGULO
resumen_inicial: El Teorema de la Desigualdad Triangular establece que la suma de
  las longitudes de dos lados cualesquiera de un triángulo debe ser estrictamente
  mayor que el tercer lado.
explicacion_simple: Si intentas construir un triángulo con tres palitos de 2 cm, 3
  cm y 10 cm, notarás que los dos más cortos no alcanzan a tocarse. Para que se cierre,
  dos lados sumados deben ser más largos que el tercero.
explicacion_formal: 'Para que tres segmentos $a, b, c$ formen un triángulo válido,
  deben satisfacer simultáneamente la **Desigualdad Triangular**:


  $$a + b > c, \quad a + c > b, \quad b + c > a$$


  De forma equivalente: $|a - b| < c < a + b$.'
definiciones_clave: '- **Desigualdad triangular**: Condición necesaria y suficiente
  para la existencia de un triángulo.

  - **Caso degenerado**: Cuando $a + b = c$, los tres puntos quedan colineales sobre
  una misma línea.'
propiedades_relaciones: '- **Criterio de existencia**: Si la suma de los dos lados
  menores supera al mayor, el triángulo existe.

  - **Rango del tercer lado**: Dado $a$ y $b$, el tercer lado $c$ debe cumplir $|a
  - b| < c < a + b$.'
ejemplo_guiado:
  enunciado: Se dispone de tres varillas metálicas de longitudes $a = 79\text{ cm}$,
    $b = 107\text{ cm}$ y $c = 191\text{ cm}$. Determina si es posible construir un
    triángulo con ellas aplicando la Desigualdad Triangular.
  pasos:
  - 'Paso 1: Sumar las dos varillas de menor longitud: $a + b = 79 + 107 = 186\text{
    cm}$.'
  - 'Paso 2: Comparar la suma con la tercera varilla $c = 191\text{ cm}$: $186 < 191$.'
  - 'Paso 3: Concluir que NO es posible construir el triángulo porque $a + b < c$,
    violando la Desigualdad Triangular.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplirse entre los lados de cualquier triángulo para
    que pueda existir?
  choices:
  - text: La suma de dos lados debe ser estrictamente mayor que el tercer lado
    is_correct: true
  - text: La suma de dos lados debe ser igual al tercer lado
    is_correct: false
  - text: El lado mayor debe ser igual al doble del menor
    is_correct: false
  - text: Los tres lados deben ser números pares
    is_correct: false
  explanation: La alternativa correcta es 'La suma de dos lados debe ser estrictamente
    mayor que el tercer lado'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos varillas miden 79 cm y 107 cm (suma 186 cm) y la tercera mide 191
    cm, ¿se puede formar un triángulo?
  choices:
  - text: No, porque la suma de las dos primeras es menor que la tercera
    is_correct: true
  - text: Sí, cualquier medida de varillas forma un triángulo
    is_correct: false
  - text: Sí, porque las varillas son metálicas
    is_correct: false
  - text: No, solo si miden 90 cm cada una
    is_correct: false
  explanation: La alternativa correcta es 'No, porque la suma de las dos primeras
    es menor que la tercera'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 86° y 63°, ¿cuánto mide
    el tercero?
  alternativas:
  - 31°
  - 149°
  - 90°
  respuesta: 31°
  solucion_pasos:
  - Despejar $x = 180 - (86 + 63) = 31^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 79 cm y 107 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 184 cm
  - 191 cm
  - 0 cm
  respuesta: 184 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 186 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de verificación de existencia de un triángulo a partir de tres medidas
  de lados resolviendo problemas geométricos con rigurosidad.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Propiedades de Triángulos.
estado: publicado
