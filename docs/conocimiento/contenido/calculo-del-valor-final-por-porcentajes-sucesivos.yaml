resumen_inicial: 'La aplicación de porcentajes sucesivos (aumentos o descuentos encadenados)
  sobre una cantidad inicial equivale a multiplicar consecutivamente los factores
  de cada variación: $V_f = V_i \cdot F_1 \cdot F_2 \dots F_n$.'
explicacion_simple: Cuando un producto recibe varios aumentos o descuentos seguidos
  (por ejemplo, un 10% de descuento y luego un 20% extra), NUNCA debemos sumar los
  porcentajes directamente. Se deben multiplicar los factores decimales de cada paso
  uno tras otro sobre la cantidad inicial.
explicacion_formal: 'Para un valor inicial $V_i$ expuesto a $n$ variaciones porcentuales
  sucesivas $P_1, P_2, \dots, P_n$, el **Valor Final Sucesivo $V_f$** se determina
  mediante el producto de factores:


  $$V_f = V_i \cdot \prod_{k=1}^n F_k = V_i \cdot \left(1 \pm \frac{P_1}{100}\right)
  \cdot \left(1 \pm \frac{P_2}{100}\right) \dots \left(1 \pm \frac{P_n}{100}\right)$$


  **Demostración de no aditividad:**

  - Dos descuentos del $20\%$ sucesivos rinden $F_{tot} = 0,80 \cdot 0,80 = 0,64 \implies$
  Descuento real del $36\%$ (NO del $40\%$).'
definiciones_clave: '- **Porcentajes sucesivos**: Multiplicación encadenada de factores
  $V_f = V_i \cdot F_1 \cdot F_2 \dots F_n$.'
propiedades_relaciones: '- **Independencia del orden (Conmutatividad)**: El orden
  de aplicación de los aumentos o descuentos no altera el valor final.'
ejemplo_guiado:
  enunciado: Una chaqueta de \$100.000 sufre un primer descuento del $20\%$ y luego
    un descuento adicional del $10\%$. Calcule el precio final y el porcentaje de
    descuento único equivalente.
  pasos:
  - 'Paso 1: Determinar los factores de cada descuento: $F_1 = 0,80$ y $F_2 = 0,90$.'
  - 'Paso 2: Calcular el factor total: $F_{tot} = 0,80 \cdot 0,90 = 0,72$.'
  - 'Paso 3: Multiplicar el precio inicial por el factor total: $V_f = 100.000 \cdot
    0,72 = 72.000$.'
  - 'Paso 4: Determinar el descuento equivalente: $1 - 0,72 = 0,28 \implies 28\%$.'
  - 'Conclusión: El precio final es \$72.000 y equivale a un descuento único del $28\%$
    (NO del $30\%$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el valor final Vf ante dos descuentos sucesivos del 20%
    y 10%?
  choices:
  - text: 'Multiplicando consecutivamente los factores: Vf = Vi · 0,80 · 0,90'
    is_correct: true
  - text: Restando el 30% directamente al valor inicial (Vf = Vi · 0,70)
    is_correct: false
  - text: Sumando los factores 0,80 + 0,90
    is_correct: false
  - text: Dividiendo entre 2
    is_correct: false
  explanation: 'La alternativa correcta es ''Multiplicando consecutivamente los factores:
    Vf = Vi · 0,80 · 0,90''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para la chaqueta de $100.000 con 20% y 10% sucesivos,
    ¿cuál fue el descuento único equivalente?
  choices:
  - text: 28%
    is_correct: true
  - text: 30%
    is_correct: false
  - text: 20%
    is_correct: false
  - text: 72%
    is_correct: false
  explanation: La alternativa correcta es '28%'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el valor final $V_f =
  V_i \cdot F_1 \cdot F_2 \dots F_n$ tras variaciones porcentuales sucesivas.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.PORCENTAJES_SUCESIVOS
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.PORCENTAJES_SUCESIVOS.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
