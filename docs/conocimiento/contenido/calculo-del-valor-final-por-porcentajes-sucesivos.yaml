semantic_id: MAT.NUM.VARIACION_PORCENTUAL.PORCENTAJES_SUCESIVOS
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: 'Las variaciones porcentuales sucesivas se calculan mediante la multiplicación
  encadenada de sus factores multiplicadores: $V_f = V_i \cdot (1 \pm p_1) \cdot (1
  \pm p_2) \cdot \dots \cdot (1 \pm p_k)$, ¡nunca sumando los porcentajes aritméticamente!'
explicacion_simple: 'Cuando se aplican dos o más variaciones seguidas a una cantidad,
  cada nueva variación actúa sobre el saldo acumulado del paso anterior, no sobre
  la cantidad original. Por eso, dos descuentos del $20\%$ y $10\%$ NO dan un $30\%$
  de descuento, sino que se multiplican sus factores: $0,80 \cdot 0,90 = 0,72$ (lo
  que equivale a un $28\%$ de descuento real).


  ![calculo-del-valor-final-por-porcentajes-sucesivos](/static/img/nodos/calculo-del-valor-final-por-porcentajes-sucesivos-intro.svg)

  '
explicacion_formal: 'Para un valor inicial $V_i$ sometido a una sucesión de $k$ variaciones
  porcentuales $p_1, p_2, \dots, p_k$ (positivas para aumentos, negativas para descuentos),
  el **Valor Final Encadenado** se define como:


  $$V_f = V_i \cdot \prod_{j=1}^k \left(1 \pm \frac{p_j}{100}\right) = V_i \cdot F_{\text{global}}$$


  Donde $F_{\text{global}} = F_1 \cdot F_2 \cdot \dots \cdot F_k$ es el **factor multiplicativo
  compuesto**. La variación porcentual neta global es $(F_{\text{global}} - 1) \cdot
  100\%$.'
definiciones_clave: '- **Variaciones sucesivas**: Modificaciones porcentuales encadenadas
  donde la base de cálculo cambia en cada etapa.

  - **Factor global**: Producto de todos los factores multiplicativos individuales.

  - **Variación neta equivalente**: Porcentaje único que produce el mismo efecto final
  que las variaciones sucesivas.'
propiedades_relaciones: '- **Conmutatividad**: El orden en que se apliquen las variaciones
  sucesivas no altera el resultado final, pues el producto de factores es conmutativo
  ($F_1 \cdot F_2 = F_2 \cdot F_1$).

  - **Efecto asimétrico de aumento y baja iguales**: Un aumento del $p\%$ seguido
  de una baja del $p\%$ siempre genera una pérdida neta: $(1 + p)(1 - p) = 1 - p^2
  < 1$.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/calculo-del-valor-final-por-porcentajes-sucesivos-resumen.svg)


  QUÉ: Calcular el valor final y la variación neta de porcentajes sucesivos. CÓMO:
  Multiplicando los factores individuales $F_{\text{global}} = \prod (1 \pm p_j)$
  y evaluando el valor final mediante $V_f = V_i \cdot F_{\text{global}}$.'
