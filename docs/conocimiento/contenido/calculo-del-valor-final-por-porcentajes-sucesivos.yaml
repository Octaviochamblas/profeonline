semantic_id: MAT.NUM.VARIACION_PORCENTUAL.PORCENTAJES_SUCESIVOS
resumen_inicial: 'Cálculo del valor final por porcentajes sucesivos: concepto y propiedades
  fundamentales en Variaciones porcentuales.'
explicacion_simple: 'Las vitrinas anuncian ''¡Liquidación! 50% + 20% extra con tarjeta''.
  ¿Significa eso un 70% de descuento? Lamento decepcionarte: el comercio jamás sumaría
  así los descuentos. Aprende a calcular el verdadero descuento.'
explicacion_formal: 'Cuando ocurren variaciones en cadena (un descuento tras otro,
  o un aumento seguido de una caída), **cada variación se aplica sobre el nuevo saldo**,
  no sobre el precio original.


  El método infalible es multiplicar el Valor Inicial por cada factor sucesivo:

  $$\text{Final} = \text{Inicial} \cdot \text{Factor}_1 \cdot \text{Factor}_2$$


  **Ejemplo del ''50% + 20% extra'':**

  - Primer factor (descuento 50%): pagas el $50\%$ ($0.50$).

  - Segundo factor (descuento 20%): pagas el $80\%$ ($0.80$).

  - Multiplicación conjunta: $0.50 \cdot 0.80 = 0.40$.

  Al final terminas pagando el $40\%$ del producto, lo que equivale a un **descuento
  real del $60\%$**, no del $70\%$.'
definiciones_clave: '- **Cálculo del valor final por porcentajes sucesivos**: Elemento
  central dentro del estudio de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del valor final por porcentajes sucesivos.'
