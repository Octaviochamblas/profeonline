procedimiento:
- 'Paso 1: Escribir el factor multiplicativo de cada variación individual ($1 + a_{\text{dec}}$
  para alzas, $1 - d_{\text{dec}}$ para descuentos).'
- 'Paso 2: Multiplicar todos los factores entre sí para obtener el factor compuesto
  global $F_{\text{global}}$.'
- 'Paso 3: Multiplicar el valor inicial por el factor global: $V_f = V_i \cdot F_{\text{global}}$.'
ejemplo_guiado:
  enunciado: Un artículo de $\$100.000$ sufre un descuento del $20\%$ y posteriormente
    un descuento adicional del $10\%$. ¿Cuál es el precio final y el descuento único
    equivalente?
  pasos:
  - 'Paso 1: Determinar los factores individuales: $F_1 = 1 - 0,20 = 0,80$ y $F_2
    = 1 - 0,10 = 0,90$.'
  - 'Paso 2: Calcular el factor global multiplicando: $F_{\text{global}} = 0,80 \cdot
    0,90 = 0,72$.'
  - 'Paso 3: Calcular el precio final: $V_f = 100.000 \cdot 0,72 = 72.000$.'
  - 'Paso 4: Hallar el descuento equivalente: $1 - 0,72 = 0,28 \implies 28\%$ de descuento
    real.'
  - 'Conclusión: El precio final es $\$72.000$, lo que equivale a un descuento único
    del $28\%$ (no del $30\%$).'
  imagen: /static/img/nodos/calculo-del-valor-final-por-porcentajes-sucesivos-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: 'Si una cantidad aumenta un $20\%$ y luego disminuye un $20\%$, el resultado
    final es:'
  choices:
  - text: Un $4\%$ menor que el valor original
    is_correct: true
  - text: Igual al valor original
    is_correct: false
  - text: Un $4\%$ mayor que el valor original
    is_correct: false
  - text: Un $20\%$ menor que el valor original
    is_correct: false
  explanation: El factor compuesto es $1,20 \cdot 0,80 = 0,96$, lo que representa
    un $4\%$ de pérdida neta ($1 - 0,96 = 0,04$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el factor global correspondiente a dos aumentos sucesivos del
    $10\%$ y $20\%$?
  choices:
  - text: $1,32$
    is_correct: true
  - text: $1,30$
    is_correct: false
  - text: $1,20$
    is_correct: false
  - text: $1,02$
    is_correct: false
  explanation: $F_{\text{global}} = 1,10 \cdot 1,20 = 1,32$ (equivalente a $+32\%$
    de aumento).
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Sumar aritméticamente los porcentajes (ej: pensar
  que $+10\%$ y $+20\%$ es $+30\%$).** **Cómo corregirlo:** La segunda variación opera
  sobre el valor ya incrementado, por lo que se multiplican los factores ($1,10 \cdot
  1,20 = 1,32 \implies +32\%$).

  - **Error 2: Creer que el orden de las variaciones altera el resultado.** **Cómo
  corregirlo:** El producto de números reales es conmutativo ($F_1 \cdot F_2 = F_2
  \cdot F_1$).'
ejemplos:
- titulo: Aumentos salariales escalonados
  enunciado: Un sueldo de $\$500.000$ aumenta un $10\%$ en enero y un $10\%$ adicional
    en julio. ¿Cuál es el sueldo final?
  alternativas:
  - $\$605.000$
  - $\$600.000$
  - $\$550.000$
  - $\$610.000$
  respuesta: $\$605.000$
  solucion_pasos:
  - 'Factor global: $1,10 \cdot 1,10 = 1,21$ (+21%).'
  - 'Multiplicar: $500.000 \cdot 1,21 = 605.000$ pesos.'
- titulo: Descuento en tienda por membresía
  enunciado: Un producto de $\$80.000$ tiene $25\%$ de liquidación y un $20\%$ adicional
    por pagar con tarjeta de la tienda. ¿Cuál es el precio final?
  alternativas:
  - $\$48.000$
  - $\$44.000$
  - $\$40.000$
  - $\$52.000$
  respuesta: $\$48.000$
  solucion_pasos:
  - 'Factor global: $(1 - 0,25) \cdot (1 - 0,20) = 0,75 \cdot 0,80 = 0,60$.'
  - 'Multiplicar: $80.000 \cdot 0,60 = 48.000$ pesos.'
- titulo: ¿El orden en que se aplican dos descuentos sucesivos altera el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, porque la multiplicación de factores decimales es conmutativa ($F_1 \cdot
    F_2 = F_2 \cdot F_1$).
- titulo: ¿Un aumento del 50% seguido de una disminución del 50% devuelve la cantidad
    a su valor inicial?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $1,50 \cdot 0,50 = 0,75$, dejando una pérdida neta del $25\%$.
errores_frecuentes:
- Sumar o restar algebraicamente los porcentajes sucesivos.
- Creer que un aumento del $x\%$ seguido de un descuento del $x\%$ deja la cantidad
  sin cambios.
- Calcular todas las variaciones respecto al valor inicial original en lugar del valor
  acumulado.
afirmaciones_verdaderas:
- Las variaciones sucesivas se calculan multiplicando los factores multiplicativos
  de cada etapa.
- El orden en que se apliquen dos o más variaciones porcentuales sucesivas no altera
  el valor final obtenido.
