procedimiento:
- 'Paso 1: Calcula el área de una base (A_base) según su forma poligonal.'
- 'Paso 2: Calcula el perímetro de la base (P_base) y multiplícalo por la altura del
  prisma (h) para obtener el área lateral.'
- 'Paso 3: Suma el doble del área de la base (las dos bases) más el área lateral para
  obtener el área total.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del área total de un prisma recto.
