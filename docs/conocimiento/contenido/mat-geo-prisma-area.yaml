semantic_id: MAT.GEO.POLIEDROS_PRISMAS.PRISMA_AREA
resumen_inicial: 'Cálculo del área total de un prisma recto: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'El área total de un prisma se obtiene ''desenvolviendo'' su superficie:
  las dos bases más el rectángulo (o rectángulos) que forman todas las caras laterales
  desplegadas.'
explicacion_formal: '![Área total de un prisma recto](/static/img/geometria/espacio-cuerpos/prisma-area.svg)


  ### Definición formal


  El área total de un prisma recto es la suma del área de sus dos bases congruentes
  más el área lateral (la suma de las áreas de todas sus caras laterales): $A_T=2A_{base}+P_{base}\times
  h$, ya que el área lateral total equivale al perímetro de la base multiplicado por
  la altura.


  ### Desarrollo didáctico


  Si un prisma tiene base rectangular de 6 cm por 4 cm (área 24 cm², perímetro 20
  cm) y altura 10 cm, su área total es $A_T=2\times24+20\times10=48+200=248$ cm².'
definiciones_clave: '- **Cálculo del área total de un prisma recto**: Elemento o propiedad
