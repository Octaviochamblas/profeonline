semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.CIRCULO_UNITARIO_DEF
resumen_inicial: 'El círculo unitario es la circunferencia de radio 1 centrada en el origen $(0,0)$ utilizada como base para definir las funciones trigonométricas.'
explicacion_simple: |
  Para estudiar la trigonometría sin depender del tamaño de un triángulo rectángulo, los matemáticos dibujan una circunferencia fija de radio igual a 1 sobre el plano cartesiano. Como su centro está exactamente en el punto $(0,0)$, cualquier punto $(x,y)$ ubicado sobre el borde del círculo cumple que la suma de los cuadrados de sus coordenadas siempre es igual a 1 ($x^2 + y^2 = 1$). Este círculo perfecto es la herramienta clave para definir el seno y el coseno de cualquier ángulo.
explicacion_formal: |
  ### Definición formal
  El **círculo unitario** (o circunferencia goniométrica) se define analíticamente en el plano cartesiano $\mathbb{R}^2$ como el conjunto de puntos que satisfacen la ecuación implícita:
  $$\mathcal{C} = \{(x,y) \in \mathbb{R}^2 : x^2 + y^2 = 1\}$$

  ### Desglose simbólico
  - $(0,0)$: Centro de la circunferencia en el origen del sistema cartesiano.
  - $r = 1$: Radio constante de la circunferencia.
  - $x^2 + y^2 = 1$: Relación algebraica derivada directamente del Teorema de Pitágoras $a^2 + b^2 = c^2$, donde la hipotenusa mide $1$.

  ### Síntesis didáctica
  El círculo unitario acota geométricamente todas las relaciones trigonométricas. Asegura que la distancia desde el origen a cualquier punto del borde sea exactamente 1 unidad, permitiendo extender los conceptos de seno y coseno más allá de los ángulos agudos ($0^\circ$ a $90^\circ$) hacia ángulos negativos o mayores a $360^\circ$.
definiciones_clave: |
  - **Círculo unitario**: Circunferencia de radio constante igual a $1$ centrada en el origen cartesiano $(0,0)$.
  - **Ecuación del círculo unitario**: Identidad algebraica $x^2 + y^2 = 1$ que cumplen todos sus puntos.
  - **Circunferencia goniométrica**: Nombre técnico alternativo asignado al círculo de radio $1$ usado para medir ángulos y razones trigonométricas.
propiedades_relaciones: |
  - **Relación con Pitágoras**: Toda coordenada $(x,y)$ sobre el círculo forma un triángulo rectángulo con catetos $|x|$ e $|y|$ e hipotenusa $1$.
  - **Identidad Fundamental**: Dado que $x = \cos \theta$ e $y = \sin \theta$, la ecuación del círculo unitario da origen a $\sin^2 \theta + \cos^2 \theta = 1$.
ejemplo_guiado:
  enunciado: 'Verifica analíticamente si el punto $P\left(\frac{3}{5}, \frac{4}{5}\right)$ pertenece a la circunferencia del círculo unitario.'
  pasos:
    - 'Paso 1: Identificar las coordenadas del punto: $x = \frac{3}{5}$ e $y = \frac{4}{5}$.'
    - 'Paso 2: Reemplazar $x$ e $y$ en la ecuación canónica del círculo unitario $x^2 + y^2 = 1$.'
    - 'Paso 3: Calcular las potencias cuadradas: $\left(\frac{3}{5}\right)^2 + \left(\frac{4}{5}\right)^2 = \frac{9}{25} + \frac{16}{25}$.'
    - 'Paso 4: Sumar las fracciones: $\frac{9 + 16}{25} = \frac{25}{25} = 1$. Como el resultado es igual a $1$, el punto $P$ pertenece al círculo unitario.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación cartesiana que define al círculo unitario centrado en el origen?'
    choices:
      - {text: '$x^2 + y^2 = 1$', is_correct: true}
      - {text: '$x + y = 1$', is_correct: false}
      - {text: '$x^2 - y^2 = 1$', is_correct: false}
      - {text: '$x^2 + y^2 = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2 + y^2 = 1$''. Es la ecuación canónica de una circunferencia de radio $r = 1$ centrada en $(0,0)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Pertenece el punto $Q\left(\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$ al círculo unitario?'
    choices:
      - {text: 'Sí, porque $\left(\frac{1}{2}\right)^2 + \left(\frac{\sqrt{3}}{2}\right)^2 = \frac{1}{4} + \frac{3}{4} = 1$', is_correct: true}
      - {text: 'No, porque la suma de sus coordenadas es mayor que 1', is_correct: false}
      - {text: 'No, porque contiene un número irracional $\sqrt{3}$', is_correct: false}
      - {text: 'Sí, porque su ordenada es mayor que su abscisa', is_correct: false}
    explanation: 'La alternativa correcta es ''Sí, porque $\left(\frac{1}{2}\right)^2 + \left(\frac{\sqrt{3}}{2}\right)^2 = \frac{1}{4} + \frac{3}{4} = 1$''. La suma de sus cuadrados es exactamente $1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar las coordenadas $(x, y)$ del punto a evaluar.'
  - 'Paso 2: Elevar al cuadrado la abscisa $x^2$ y la ordenada $y^2$.'
  - 'Paso 3: Sumar ambos valores cuadráticos $x^2 + y^2$.'
  - 'Paso 4: Concluir que el punto pertenece al círculo unitario si y solo si el resultado es igual a 1.'
errores_correccion: |
  - **Error 1:** Confundir el círculo unitario (la curva o borde $x^2 + y^2 = 1$) con el disco unitario (la región interior $x^2 + y^2 \le 1$). **Cómo corregirlo:** La superficie interior incluye puntos con radio menor a 1, mientras que el círculo unitario se refiere únicamente a la frontera donde la distancia al origen es exactamente 1.
  - **Error 2:** Creer que la suma de coordenadas $x + y = 1$ determina la pertenencia al círculo. **Cómo corregirlo:** La propiedad geométrica exige la suma de sus cuadrados $x^2 + y^2 = 1$, fundamentada en el Teorema de Pitágoras.
ejemplos:
  - titulo: 'Evaluación del punto sobre el eje horizontal'
    enunciado: '¿El punto $(1, 0)$ pertenece a la circunferencia del círculo unitario?'
    alternativas:
      - 'Sí, pues $1^2 + 0^2 = 1$'
      - 'No, pues la ordenada es nula'
      - 'No, pues falta una componente negativa'
    respuesta: 'Sí, pues $1^2 + 0^2 = 1$'
    solucion_pasos:
      - '1. Sustituimos $x = 1$ e $y = 0$ en $x^2 + y^2$.'
      - '2. $1^2 + 0^2 = 1 + 0 = 1$.'
      - '3. El punto $(1, 0)$ pertenece al círculo unitario.'
  - titulo: 'Evaluación de punto fuera de la circunferencia'
    enunciado: '¿El punto $(1, 1)$ se ubica sobre el borde del círculo unitario?'
    alternativas:
      - 'No, pues $1^2 + 1^2 = 2 \neq 1$'
      - 'Sí, pues ambas coordenadas valen 1'
      - 'Sí, pues su distancia al centro es 1'
    respuesta: 'No, pues $1^2 + 1^2 = 2 \neq 1$'
    solucion_pasos:
      - '1. Calculamos la suma de cuadrados: $1^2 + 1^2 = 2$.'
      - '2. Como $2 \neq 1$, el punto $(1,1)$ no está sobre el círculo unitario.'
  - titulo: 'Verificación del punto inferior en el eje Y'
    enunciado: '¿Es $(0, -1)$ un punto perteneciente al círculo unitario?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, porque $0^2 + (-1)^2 = 0 + 1 = 1$.'
  - titulo: 'Verificación de un punto en el tercer cuadrante'
    enunciado: '¿El punto $\left(-\frac{\sqrt{2}}{2}, -\frac{\sqrt{2}}{2}\right)$ pertenece al círculo unitario?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\left(-\frac{\sqrt{2}}{2}\right)^2 + \left(-\frac{\sqrt{2}}{2}\right)^2 = \frac{2}{4} + \frac{2}{4} = 1$.'
errores_frecuentes:
  - 'La afirmación de que el círculo unitario posee un radio variable según la magnitud del ángulo.'
  - 'La afirmación de que el punto de coordenadas $(1, 1)$ pertenece al borde del círculo unitario.'
  - 'La afirmación de que la condición de pertenencia al círculo unitario se expresa como la suma simple $x + y = 1$.'
  - 'La afirmación de que un punto con coordenadas negativas $(-x, -y)$ no puede pertenecer al círculo unitario.'
  - 'La afirmación de que el círculo unitario corresponde a una elipse centrada fuera del plano cartesiano.'
afirmaciones_verdaderas:
  - 'El círculo unitario es la circunferencia de radio constante $r = 1$ centrada en el origen cartesiano $(0,0)$.'
  - 'Todo punto $(x,y)$ perteneciente al círculo unitario satisface estrictamente la igualdad algebraica $x^2 + y^2 = 1$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y verificar puntos pertenecientes al círculo unitario en el plano cartesiano.
  CÓMO: Comprobar la igualdad $x^2 + y^2 = 1$ mediante la suma de los cuadrados de las coordenadas del punto.
