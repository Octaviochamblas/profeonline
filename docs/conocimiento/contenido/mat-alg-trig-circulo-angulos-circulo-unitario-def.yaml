semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.CIRCULO_UNITARIO_DEF
resumen_inicial: 'Definición del círculo unitario como circunferencia de radio uno:
  círculo unitario, amplitud, período y transformaciones de Círculo unitario y sistemas
  de medida.'
explicacion_simple: Para estudiar el seno y el coseno de cualquier ángulo, conviene
  fijar un círculo de referencia simple, con radio exactamente igual a $1$.
explicacion_formal: '### Definición formal


  El círculo unitario es el conjunto $\{(x,y)\in\mathbb{R}^2 : x^2+y^2=1\}$, es decir,
  la circunferencia de radio $1$ centrada en el origen $(0,0)$. Sirve como marco de
  referencia estándar para definir las funciones trigonométricas de cualquier ángulo.


  ### Desarrollo didáctico


  El punto $(1,0)$ pertenece al círculo unitario porque $1^2+0^2=1$. El punto $(0,1)$
  también pertenece, porque $0^2+1^2=1$. En cambio, $(1,1)$ no pertenece, porque $1^2+1^2=2\neq1$.'
definiciones_clave: '- **Definición del círculo unitario como circunferencia de radio
  uno**: Función periódica fundamentada en las coordenadas del círculo unitario o
  relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a definición del círculo unitario como circunferencia de radio uno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    definición del círculo unitario como circunferencia de radio uno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de definición del círculo unitario como circunferencia
    de radio uno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
