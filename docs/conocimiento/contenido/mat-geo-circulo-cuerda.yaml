semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CUERDA
resumen_inicial: 'Identificación de la cuerda como segmento cuyos extremos pertenecen
  a la circunferencia: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: Además del radio (que conecta el centro con un punto de la curva),
  existe otro segmento importante que conecta directamente dos puntos de la circunferencia
  entre sí.
explicacion_formal: '![Cuerda: segmento entre dos puntos de la circunferencia](/static/img/geometria/circunferencia-circulo/circulo-cuerda.svg)


  ### Definición formal


  Una cuerda es el segmento $\overline{AB}$, donde $A$ y $B$ son dos puntos distintos
  de la circunferencia. A diferencia del radio, ninguno de sus extremos es necesariamente
  el centro.


  ### Desarrollo didáctico


  Existen infinitas cuerdas posibles en una circunferencia, de distintas longitudes
  según qué tan separados estén sus dos puntos extremos; la cuerda más larga posible
  es aquella que sí pasa por el centro, llamada diámetro (un caso particular de cuerda).'
definiciones_clave: '- **Identificación de la cuerda como segmento cuyos extremos
  pertenecen a la circunferencia**: Elemento o propiedad fundamental en el estudio
  de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
