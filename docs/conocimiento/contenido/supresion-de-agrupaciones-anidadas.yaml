semantic_id: MAT.ALG.AGRUPACION.SUPRESION_ANIDADA
resumen_inicial: 'Supresión de agrupaciones anidadas: procedimiento y reglas en Signos
  de agrupación.'
explicacion_simple: 'Imagina unas muñecas rusas: hay que abrir la más pequeña de adentro
  primero para llegar a la de afuera. Los signos de agrupación anidados funcionan
  igual: el proceso es secuencial, de lo más interior a lo más exterior.'
explicacion_formal: '### Definición formal


  Eliminamos el paréntesis con signo $-$: $-(c-d) = -c+d$. Dentro del corchete queda
  $b - c + d$.


  ### Desarrollo didáctico


  Simplifica: $\{5a - [3a - (2a + 1)]\}$.


  Paso 1 — Eliminamos el paréntesis (precedido de $-$, invertimos):

  $\{5a - [3a - 2a - 1]\}$.


  Paso 2 — Reducimos lo que quedó en el corchete:

  $\{5a - [a - 1]\}$.


  Paso 3 — Eliminamos el corchete (precedido de $-$, invertimos):

  $\{5a - a + 1\}$.


  Paso 4 — Eliminamos la llave (precedida de nada o $+$, sin cambio):

  $5a - a + 1 = 4a + 1$.'
definiciones_clave: '- **Supresión de agrupaciones anidadas**: Operación o propiedad
  fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a supresión de agrupaciones anidadas.'
ejemplo_guiado:
  enunciado: Aplica supresión de agrupaciones anidadas en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de supresión de agrupaciones
    anidadas.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
