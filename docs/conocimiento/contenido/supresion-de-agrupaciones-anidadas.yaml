resumen_inicial: La supresión de agrupaciones anidadas simplifica expresiones complejas
  eliminando adecuadamente los bloques de agrupación.
explicacion_simple: Al trabajar con supresión de agrupaciones anidadas, resolvemos
  primero los signos de agrupación más internos y avanzamos hacia afuera cambiando
  o manteniendo signos según corresponda.
explicacion_formal: 'Dada una estructura anidada o con vínculo, la **Supresión de
  agrupaciones anidadas** aplica la regla distributiva progresiva:


  $$\text{"la expresión 10 - [4 + (2x - 3)]"} \implies 9 - 2x$$


  > **Complemento didáctico:** La resolución rigurosa en niveles respeta el orden
  de alcance de los operadores de agrupación.'
definiciones_clave: '- **Supresión de agrupaciones anidadas**: Proceso ordenado de
  eliminación de símbolos de agrupación.'
propiedades_relaciones: '- **Regla de alcance**: Los signos exteriores afectan a la
  totalidad del subárbol de expresiones interiores.'
ejemplo_guiado:
  enunciado: 'Aplique la supresión de agrupaciones anidadas a: ''la expresión 10 -
    [4 + (2x - 3)]''.'
  pasos:
  - 'Paso 1: Identificar el signo de agrupación más interno.'
  - 'Paso 2: Suprimir respetando el signo que lo antecede.'
  - 'Paso 3: Reducir y suprimir los signos de agrupación exteriores.'
  - 'Conclusión: El resultado final es 9 - 2x.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar supresión de agrupaciones anidadas en
    'la expresión 10 - [4 + (2x - 3)]'?
  choices:
  - text: 9 - 2x
    is_correct: true
  - text: 15 - 2x
    is_correct: false
  - text: 3 + 2x
    is_correct: false
  - text: 9 + 2x
    is_correct: false
  explanation: La alternativa correcta es '9 - 2x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la expresión 10 - [4 + (2x - 3)]', ¿qué expresión
    reducida se obtuvo?
  choices:
  - text: 9 - 2x
    is_correct: true
  - text: 15 - 2x
    is_correct: false
  - text: 3 + 2x
    is_correct: false
  - text: 9 + 2x
    is_correct: false
  explanation: La alternativa correcta es '9 - 2x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Eliminar el nivel más interno de agrupación.'
- 'Paso 2: Cambiar o mantener signos según el signo precedente.'
- 'Paso 3: Continuar hacia los niveles exteriores y reducir.'
errores_correccion: '- **Error 1: Omitir la inversión de signos en niveles internos
  durante supresión de agrupaciones anidadas.** **Cómo corregirlo:** Verificar el
  signo de cada nivel al suprimir el bloque correspondiente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de supresión de agrupaciones anidadas en 'la expresión
    10 - [4 + (2x - 3)]'?
  alternativas:
  - 9 - 2x
  - 15 - 2x
  - 3 + 2x
  - 9 + 2x
  respuesta: 9 - 2x
  solucion_pasos:
  - 1. Eliminar paréntesis de adentro hacia afuera.
  - 2. Obtener 9 - 2x.
- titulo: Ejemplo 2
  enunciado: Al simplificar 'la expresión 10 - [4 + (2x - 3)]' por supresión de agrupaciones
    anidadas, ¿qué resultado se obtiene?
  alternativas:
  - 9 - 2x
  - 15 - 2x
  - 3 + 2x
  - 9 + 2x
  respuesta: 9 - 2x
  solucion_pasos:
  - 1. Aplicar las reglas de supresión de signos.
  - 2. Concluir 9 - 2x.
- titulo: ¿Es la simplificación de 'la expresión 10 - [4 + (2x - 3)]' igual a 9 -
    2x?
  respuesta: Sí
  solucion_pasos:
  - Sí, suprimiendo los signos en orden da 9 - 2x.
- titulo: ¿Da la supresión en 'la expresión 10 - [4 + (2x - 3)]' un valor igual a
    15 - 2x?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 9 - 2x.
errores_frecuentes:
- Omitir cambiar los signos interiores al suprimir bloques en supresión de agrupaciones
  anidadas.
- Resolver de afuera hacia adentro alterando la prioridad en supresión de agrupaciones
  anidadas.
- Multiplicar coeficientes en lugar de distribuir signos negativos.
- Declarar la barra de vínculo con una operación de división.
- Declarar que los corchetes anulan los signos negativos anteriores.
afirmaciones_verdaderas:
- La supresión de agrupaciones anidadas exige eliminar primero los niveles internos
  antes que los externos.
- Un signo menos exterior distribuye la inversión de signo a todos los elementos del
  bloque agrupado.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la supresión de agrupaciones
  anidadas suprimiendo signos de agrupación ordenadamente de adentro hacia afuera.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Signos de Agrupación.
