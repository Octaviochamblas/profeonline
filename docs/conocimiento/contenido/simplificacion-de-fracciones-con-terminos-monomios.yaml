semantic_id: MAT.ALG.FRACCIONES_BASE.SIMPLIFICACION_MONOMIOS
resumen_inicial: Simplificar una fracción de monomios consiste en dividir sus coeficientes
  por el M.C.D. numérico y restar los exponentes de las variables iguales.
explicacion_simple: 'Para simplificar una fracción formada por monomios en el numerador
  y denominador:

  1. Simplificamos los números como una fracción común (dividiendo arriba y abajo
  por su divisor más grande).

  2. Para las letras iguales, aplicamos la regla de cociente de potencias de igual
  base: restamos los exponentes.

  3. Colocamos la variable simplificada en la posición (numerador o denominador) donde
  estaba el exponente mayor.'
explicacion_formal: 'Dada una fracción de monomios $\frac{a \cdot x^m y^p}{b \cdot
  x^n y^q}$ con $b \neq 0, x \neq 0, y \neq 0$, su **forma irreducible** se calcula
  mediante:


  $$\frac{a \cdot x^m y^p}{b \cdot x^n y^q} = \frac{\operatorname{gcd}(a,b)^{-1} \cdot
  a}{\operatorname{gcd}(a,b)^{-1} \cdot b} \cdot x^{m-n} y^{p-q}$$


  **Desglose de la fórmula:**

  - $\operatorname{gcd}(a,b)$: M.C.D. numérico utilizado para reducir la constante
  $\frac{a}{b}$.

  - $x^{m-n}$: Aplicación de la propiedad de potencias $\frac{x^m}{x^n} = x^{m-n}$.
  Si $m < n$, se expresa convencionalmente como $\frac{1}{x^{n-m}}$ con exponente
  positivo en el denominador.'
definiciones_clave: '- **Simplificación de monomios**: Reducción de la fracción monomia
  dividiendo coeficientes y restando exponentes de variables comunes.

  - **Fracción monomia irreducible**: Fracción donde coeficientes son primos entre
  sí y cada variable figura en una sola posición.'
propiedades_relaciones: '- **Exponente positivo**: Si $m > n$, la variable queda en
  el numerador $x^{m-n}$; si $n > m$, queda en el denominador $\frac{1}{x^{n-m}}$.

  - **Cancelación total**: Si $m = n$, $x^{m-m} = x^0 = 1$ y la variable se elimina
  por completo.'
ejemplo_guiado:
  enunciado: Simplifica al máximo la fracción de monomios $\frac{12x^5y^2}{18x^2y^4}$
    y evalúa el resultado irreducible para $x = 3$ e $y = 2$.
  pasos:
  - 'Paso 1: Simplificar los coeficientes $\frac{12}{18}$. El M.C.D. de $12$ y $18$
    es $6$, luego $\frac{12 \div 6}{18 \div 6} = \frac{2}{3}$.Paso 2: Simplificar
    la variable $x$: $\frac{x^5}{x^2} = x^{5-2} = x^3$ en el numerador.Paso 3: Simplificar
    la variable $y$: $\frac{y^2}{y^4} = \frac{1}{y^{4-2}} = \frac{1}{y^2}$ en el denominador.Paso
    4: Unir los términos: la fracción irreducible es $\frac{2x^3}{3y^2}$.Paso 5: Evaluar
    para $x = 3, y = 2$: $\frac{2(3)^3}{3(2)^2} = \frac{2(27)}{3(4)} = \frac{54}{12}
    = \frac{9}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma irreducible de la fracción de monomios $\frac{12x^5y^2}{18x^2y^4}$?
  choices:
  - text: $\frac{2x^3}{3y^2}$
    is_correct: true
  - text: $\frac{2x^7}{3y^6}$
    is_correct: false
  - text: $\frac{6x^3}{y^2}$
    is_correct: false
  - text: $\frac{2x^3y^2}{3}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{2x^3}{3y^2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la expresión simplificada $\frac{2x^3}{3y^2}$ para $x = 3$
    e $y = 2$, ¿cuál es el valor obtenido?
  choices:
  - text: $\frac{9}{2}$
    is_correct: true
  - text: $\frac{27}{4}$
    is_correct: false
  - text: $9$
    is_correct: false
  - text: $\frac{9}{4}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{9}{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir los coeficientes del numerador y denominador entre su M.C.D. numérico.'
- 'Paso 2: Para cada variable común, comparar los exponentes del numerador ($m$) y
  denominador ($n$).'
- 'Paso 3: Si $m > n$, escribir $x^{m-n}$ en el numerador. Si $n > m$, escribir $x^{n-m}$
  en el denominador.'
- 'Paso 4: Conservar intactas las variables no comunes en su posición original.'
- 'Paso 5: Multiplicar coeficientes reducidos y variables simplificadas.'
errores_correccion: '- **Error común:** Sumar los exponentes de las variables al simplificar
  una fracción en lugar de restarlos.

  - **Cómo corregirlo:** La división de potencias de igual base exige RESTAR los exponentes
  ($x^m / x^n = x^{m-n}$).'
