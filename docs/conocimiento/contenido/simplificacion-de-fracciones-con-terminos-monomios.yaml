semantic_id: MAT.ALG.FRACCIONES_BASE.SIMPLIFICACION_MONOMIOS
resumen_inicial: 'La simplificación de fracciones con términos monomios consiste en dividir el numerador y el denominador entre su M.C.D. monómico cancelando coeficientes numéricos y restando exponentes de variables comunes.'
explicacion_simple: |
  Para **simplificar una fracción formada por monomios** (ej: $\frac{12x^5y^3}{18x^2y^7}$):
  - **PROCEDIMIENTO EN 2 PASOS**:
    1. **Simplifica los coeficientes numéricos** dividiéndolos entre su M.C.D.:
       - $\operatorname{MCD}(12, 18) = 6 \implies \frac{12 \div 6}{18 \div 6} = \mathbf{\frac{2}{3}}$.
    2. **Aplica las propiedades de las potencias a las letras ($x^a \div x^b = x^{a-b}$)**:
       - Para $x$: $x^{5-2} = \mathbf{x^3}$ (queda en el **numerador** porque el exponente mayor estaba arriba).
       - Para $y$: $y^{7-3} = \mathbf{y^4}$ (queda en el **denominador** porque el exponente mayor estaba abajo).
    3. **Ensambla el resultado final**:
       $$\mathbf{\frac{2x^3}{3y^4}}$$
explicacion_formal: |
  ### Definición formal
  Sean $M_1 = a \prod x_j^{e_{1,j}}$ y $M_2 = b \prod x_j^{e_{2,j}}$ dos monomios en $\mathbb{Z}[x_1, \dots, x_n]$. Sea $D = \operatorname{MCD}(M_1, M_2)$ su Máximo Común Divisor monómico. La **simplificación irreductible** de la fracción racional $\frac{M_1}{M_2}$ se define mediante la cancelación exacta:

  $$\frac{M_1}{M_2} = \frac{M_1 / D}{M_2 / D} = \frac{a / \operatorname{MCD}(|a|,|b|)}{b / \operatorname{MCD}(|a|,|b|)} \cdot \prod_{j=1}^n x_j^{e_{1,j} - e_{2,j}}$$

  ### Ubicación Canónica de Exponentes Positivos
  Para evitar exponentes negativos ($x_j^{-k}$), la ley de potencias se aplica situando la variable en la posición del exponente dominante:

  $$x_j^{e_{1,j} - e_{2,j}} = \begin{cases} x_j^{e_{1,j} - e_{2,j}} & \text{en el numerador si } e_{1,j} > e_{2,j} \\ \frac{1}{x_j^{e_{2,j} - e_{1,j}}} & \text{en el denominador si } e_{2,j} > e_{1,j} \end{cases}$$

  ### Síntesis didáctica
  Simplificar monomios reduce los números a su fracción irreductible y resta los exponentes de cada variable colocándola donde estaba su potencia más alta.
definiciones_clave: |
  - **Simplificación monómica**: Reducción de una fracción de monomios dividiendo por su M.C.D. común.
  - **Restas de exponentes ($x^{a-b}$)**: Aplicación del cociente de potencias de igual base para eliminar variables redundantes.
  - **Fracción monómica irreductible**: Expresión final donde los coeficientes son coprimos y cada variable aparece una sola vez con exponente positivo.
propiedades_relaciones: |
  - **Preservación del valor racional**: Dividir numerador y denominador entre la misma cantidad no nula preserva de forma exacta el valor de la fracción.
ejemplo_guiado:
  enunciado: 'Simplifica la fracción con términos monomios $\frac{-24a^4b^2c^5}{36a^7b^2c^3}$.'
  pasos:
    - 'Paso 1: Simplificamos los coeficientes numéricos $\frac{-24}{36}$:
       - $\operatorname{MCD}(24, 36) = 12$.
       - Coeficiente simplificado: $\frac{-24 \div 12}{36 \div 12} = \mathbf{-\frac{2}{3}}$.'
    - 'Paso 2: Simplificamos las variables aplicando cociente de potencias:
       - Para $a$: el mayor exponente está en el denominador ($7 > 4$). Restamos $7 - 4 = 3 \implies \mathbf{a^3 \text{ abajo}}$.
       - Para $b$: exponentes iguales ($2 = 2$). Se cancelan exactamente: $\frac{b^2}{b^2} = 1$.
       - Para $c$: el mayor exponente está en el numerador ($5 > 3$). Restamos $5 - 3 = 2 \implies \mathbf{c^2 \text{ arriba}}$.'
    - 'Paso 3: Unimos la parte numérica y las variables resultantes:
       $-\frac{2c^2}{3a^3}$.'
    - 'Conclusión: La fracción simplificada irreductible es **$-\frac{2c^2}{3a^3}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al simplificar la fracción monómica $\frac{15x^2y^6}{25x^5y^2}$, ¿cuál es la expresión equivalente final?'
    choices:
      - {text: 'La expresión es $\frac{3y^4}{5x^3}$, dividiendo $15/25 = 3/5$, $y^{6-2}=y^4$ arriba y $x^{5-2}=x^3$ abajo', is_correct: true}
      - {text: 'La expresión es $\frac{3x^3y^4}{5}$', is_correct: false}
      - {text: 'La expresión es $\frac{15y^4}{25x^3}$', is_correct: false}
      - {text: 'La expresión es $\frac{3}{5x^3y^4}$', is_correct: false}
    explanation: 'La alternativa correcta es ''La expresión es $\frac{3y^4}{5x^3}$, dividiendo $15/25 = 3/5$, $y^{6-2}=y^4$ arriba y $x^{5-2}=x^3$ abajo''. Coeficientes $15/25=3/5$, $y^{6-2}=y^4$ en el numerador y $x^{5-2}=x^3$ en el denominador.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con una variable cuando su exponente en el numerador es exactamente igual a su exponente en el denominador (ej: $\frac{x^3}{x^3}$)?'
    choices:
      - {text: 'La variable se simplifica por completo resultando en 1 ($x^{3-3} = x^0 = 1$), desapareciendo de la expresión final', is_correct: true}
      - {text: 'Queda $x^1$', is_correct: false}
      - {text: 'Se convierte en 0', is_correct: false}
      - {text: 'Permanece en el denominador', is_correct: false}
    explanation: 'La alternativa correcta es ''La variable se simplifica por completo resultando en 1 ($x^{3-3} = x^0 = 1$), desapareciendo de la expresión final''. Propiedad $x^n / x^n = 1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Simplificar la fracción numérica formada por los coeficientes dividiendo numerador y denominador por su M.C.D.'
  - 'Paso 2: Comparar los exponentes de cada variable común en el numerador y el denominador.'
  - 'Paso 3: Restar los exponentes y colocar la variable resultante con la diferencia de potencia en la posición (numerador o denominador) donde figuraba el mayor exponente.'
  - 'Paso 4: Conservar en su posición original a las variables que aparezcan en una sola parte de la fracción.'
errores_correccion: |
  - **Error 1:** Sumar los exponentes de las variables en lugar de restarlos al simplificar un cociente. **Cómo corregirlo:** En la división de potencias de igual base **LOS EXPONENTES SE RESTAN ($x^a \div x^b = x^{a-b}$)**.
  - **Error 2:** Colocar la variable resultante en el numerador cuando el mayor exponente estaba en el denominador (escribir $\frac{x^2}{x^5} = x^3$). **Cómo corregirlo:** La variable con el exponente restado **DEBE QUEDAR EN EL DENOMINADOR SI ALLÍ ESTABA EL MAYOR EXPONENTE ($\frac{x^2}{x^5} = \frac{1}{x^3}$)**.
ejemplos:
  - titulo: 'Simplificación de números'
    enunciado: 'Para $\frac{6x}{9x}$, ¿es el resultado $\frac{2}{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, las $x$ se cancelan y $6/9 = 2/3$.'
  - titulo: 'Variable en denominador'
    enunciado: 'Para $\frac{x^2}{x^6}$, ¿es el resultado $\frac{1}{x^4}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $6-2=4$ en el denominador.'
  - titulo: 'Variables múltiples'
    enunciado: 'Para $\frac{4a^3b}{2ab^2}$, ¿es el resultado $\frac{2a^2}{b}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $4/2=2$, $a^{3-1}=a^2$ arriba, $b^{2-1}=b$ abajo.'
  - titulo: 'Cancelación total de variable'
    enunciado: 'En $\frac{5x^2y}{10x^2}$, ¿da $\frac{y}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $x^2$ se cancela y $5/10 = 1/2$.'
errores_frecuentes:
  - 'Sumar los exponentes de las variables en lugar de restarlos al simplificar una fracción monómica.'
  - 'Ubicar la variable resultante en el numerador a pesar de que el mayor exponente estaba en el denominador.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'La reducción de la fracción de los coeficientes numéricos a su forma irreductible no es ejecutada.'
  - 'Declarar que la cancelación de una variable deja 0 en lugar de 1.'
afirmaciones_verdaderas:
  - 'La simplificación de fracciones monómicas exige dividir los coeficientes entre su M.C.D. y restar los exponentes de variables iguales.'
  - 'Toda variable simplificada permanece en la ubicación de la fracción donde se encontraba la potencia de mayor exponente.'
