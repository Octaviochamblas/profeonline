semantic_id: MAT.GEO.ROTACION_PLANO.SENTIDO_HORARIO
resumen_inicial: 'Sentido horario de rotación asociado a ángulos negativos: conceptos,
  teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: Cuando algo gira 'como las manecillas del reloj', en matemáticas
  se representa con un ángulo negativo.
explicacion_formal: '![Sentido horario de rotación](/static/img/geometria/isometrias/rotacion-sentido-horario.svg)


  ### Definición formal


  Por convención matemática, una rotación en sentido horario se expresa con un ángulo
  $\theta<0$. Por ejemplo, una rotación de 90° en sentido horario se expresa como
  $\theta=-90°$.


  ### Desarrollo didáctico


  En la figura, la flecha curva sigue la misma dirección que las manecillas de un
  reloj, indicando una rotación en sentido horario, representada con un ángulo negativo
  (por ejemplo, $-70°$).'
definiciones_clave: '- **Sentido horario de rotación asociado a ángulos negativos**:
  Elemento o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a sentido horario de rotación asociado a ángulos
  negativos.'
