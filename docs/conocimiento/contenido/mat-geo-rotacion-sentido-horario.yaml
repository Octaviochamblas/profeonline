procedimiento:
- 'Paso 1: Observa si el giro sigue la misma dirección que las manecillas de un reloj.'
- 'Paso 2: Si es así, reconoce que se trata de una rotación en sentido horario.'
- 'Paso 3: Expresa el ángulo de esa rotación con signo negativo, según la convención
  matemática.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
