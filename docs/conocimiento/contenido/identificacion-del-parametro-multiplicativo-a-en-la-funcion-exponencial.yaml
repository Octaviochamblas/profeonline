semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.PARAMETRO_ESCALA
resumen_inicial: La identificación del parámetro multiplicativo $a$ en la función $f(x) = a \cdot b^x$ determina la escala vertical de la curva y fija el intercepto exacto con el eje $Y$ en el punto $(0, a)$, ya que $f(0) = a \cdot b^0 = a$.
explicacion_simple: "![La identificación del parámetro multiplicativo $a$ en la función $f(x) = a \\cdot b^x$ determina la escala vertical de la curva y fija el intercepto exacto con el eje $Y$ en el punto $(0, a)$, ya que $f(0) = a \\cdot b^0 = a$](/static/img/nodos/identificacion-del-parametro-multiplicativo-a-en-la-funcion-exponencial-intro.svg)\n\n\nEl coeficiente $a$ que multiplica por fuera a la potencia tiene dos funciones clave:\n\n1. **Fija el corte con el eje vertical $Y$:**\n   - Si tienes $f(x) = 5 \\cdot 2^x \\implies$ la gráfica corta al eje $Y$ en el punto **$(0, 5)$**.\n   - Si tienes $f(x) = 2^x$ (sin número adelante) $\\implies a = 1$, por lo que corta en **$(0, 1)$**.\n2. **Estira o refleja la curva verticalmente:**\n   - Si $|a|$ es grande, la curva sube con mayor altura.\n   - Si $a < 0$ (negativo), la curva se da vuelta y queda boca abajo bajo el eje $X$."
explicacion_formal: 'Dada la familia funcional $f(x) = a \cdot b^x$, el operador de evaluación en el origen define la aplicación biyectiva $\Upsilon: \mathcal{F}_{\text{exp}} \to \mathbb{R}^*$:

  $$\Upsilon(f) = f(0) = a \cdot b^0 = a \cdot 1 = a$$


  **Efectos geométricos del parámetro $a$**:

  1. **Traslación del punto pivote**: El punto fundamental $(0, 1)$ de la función base $b^x$ se desplaza a $(0, a)$.

  2. **Dilatación vertical**: Para todo $x \in \mathbb{R}$, la ordenada se amplifica por el factor escalar $|a|$.

  3. **Reflexión sobre el eje $X$**: Si $\operatorname{sgn}(a) = -1$, la gráfica es la imagen especular de $|a| b^x$ respecto a la recta $Y = 0$.'
definiciones_clave: '- **Punto pivote canónico**: Intercepto $(0, a)$ por donde pasa obligatoriamente la curva $y = a \cdot b^x$.

  - **Amplitud vertical**: Factor $|a|$ que escala las distancias ortogonales hacia la asíntota horizontal.'
propiedades_relaciones: '- **Invarianza de la asíntota**: El parámetro $a \neq 0$ no desplaza la asíntota horizontal, la cual permanece en la recta $y = 0$.

  - **Modificación del recorrido**: Si $a > 0 \implies \text{Rec}(f) = ]0, +\infty[$; si $a < 0 \implies \text{Rec}(f) = ]-\infty, 0[$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación del parámetro multiplicativo $a$ en la función $f(x) = a \cdot b^x$ determina la escala vertical de la curva y fija el intercepto exacto con el eje $Y$ en el punto $(0, a)$, ya que $f(0) = a \cdot b^0 = a$](/static/img/nodos/identificacion-del-parametro-multiplicativo-a-en-la-funcion-exponencial-ejemplos.svg)



    Para la función $f(x) = -4 \cdot 3^x$, extrae el valor del parámetro $a$, halla el intercepto con el eje Y y describe la orientación de la curva en el plano cartesiano.'
  pasos:
  - 'Paso 1: Identificar el coeficiente multiplicativo exterior: $a = -4$.

    - Como no está agrupado con el exponente, es el factor de escala.'
  - 'Paso 2: Calcular el intercepto con el eje $Y$ evaluando $f(0)$:

    $f(0) = -4 \cdot 3^0 = -4 \cdot 1 = -4$.

    - Punto de corte con el eje $Y$: $(0, -4)$.'
  - 'Paso 3: Describir la orientación:

    - Como $a = -4 < 0$, la gráfica está **reflejada bajo el eje X**, situándose enteramente en el semiplano inferior con recorrido $]-\infty, 0[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una función exponencial pasa por el punto (0, 12), ¿cuál es el valor del parámetro a?
  choices:
  - text: a = 12
    is_correct: true
  - text: a = 0
    is_correct: false
  - text: a = 1
    is_correct: false
  - text: No se puede saber sin la base
    is_correct: false
  explanation: La alternativa correcta es 'a = 12'. Como $f(0) = a \cdot b^0 = a$, el corte con el eje Y es directamente el valor de $a = 12$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de a en la función básica f(x) = 6ˣ?
  choices:
  - text: a = 1 (porque 6ˣ = 1 · 6ˣ)
    is_correct: true
  - text: a = 6
    is_correct: false
  - text: a = 0
    is_correct: false
  - text: No tiene parámetro a
    is_correct: false
  explanation: La alternativa correcta es 'a = 1 (porque 6ˣ = 1 · 6ˣ)'. Cuando no hay número explícito multiplicando, el coeficiente neutro es $a = 1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión $f(x) = a \cdot b^x$.'
- 'Paso 2: Reconocer el número que multiplica a la base como el parámetro $a$.'
- 'Paso 3: Formular el intercepto con el eje $Y$ como $(0, a)$.'
- 'Paso 4: Analizar el signo de $a$ para determinar si la gráfica se ubica sobre o bajo el eje $X$.'
errores_correccion: '- **Error común:** Afirmar que $a = 0$ en $f(x) = 5^x$.

  - **Cómo corregirlo:** Si fuera $a = 0$, la función sería $0 \cdot 5^x = 0$ (constante). El coeficiente implícito es **$a = 1$** ($1 \cdot 5^x$).'
ejemplos:
- titulo: 'Ejemplo 1: Parámetro entero positivo'
  enunciado: En $f(x) = 9 \cdot 2^x$, ¿cuál es el intercepto con el eje Y?
  alternativas:
  - (0, 9)
  - (0, 18)
  - (0, 2)
  - (0, 1)
  respuesta: (0, 9)
  solucion_pasos:
  - 'Paso 1: $f(0) = 9 \cdot 1 = 9 \implies (0, 9)$.'
- titulo: 'Ejemplo 2: Parámetro fraccionario'
  enunciado: En $g(x) = \frac{3}{5} \cdot 4^x$, ¿cuánto vale $a$?
  alternativas:
  - 3/5
  - '4'
  - 12/5
  - '1'
  respuesta: 3/5
  solucion_pasos:
  - 'Paso 1: $a = 3/5$.'
- titulo: 'Ejemplo 3: Parámetro negativo'
  enunciado: ¿Qué efecto tiene $a = -2$ en $h(x) = -2 \cdot 3^x$?
  alternativas:
  - Corta al eje Y en (0, -2) y refleja la curva bajo el eje X
  - Hace que la base sea negativa
  - Convierte la función en logaritmo
  - Hace que corte al eje X
  respuesta: Corta al eje Y en (0, -2) y refleja la curva bajo el eje X
  solucion_pasos:
  - 'Paso 1: $a = -2 < 0 \implies$ corte en $(0, -2)$ con valores en $\mathbb{R}^-$.'
- titulo: 'Ejemplo 4: Identificación desde gráfica'
  enunciado: Si una gráfica exponencial corta al eje Y en $(0, 25)$, ¿cuál es su parámetro a?
  alternativas:
  - '25'
  - '5'
  - '0'
  - 1/25
  respuesta: '25'
  solucion_pasos:
  - 'Paso 1: El corte con el eje $Y$ es siempre $(0, a) \implies a = 25$.'
errores_frecuentes:
- Confundir el parámetro a con la base b de la potencia.
- Asignar a = 0 cuando no hay coeficiente explícito en lugar de a = 1.
- Olvidar el signo negativo al extraer a de expresiones como -bˣ.
afirmaciones_verdaderas:
- El parámetro multiplicativo a define la posición exacta del corte con el eje Y en (0, a).
- El signo de a determina si la curva exponencial se ubica en el semiplano superior o inferior.
al_terminar_debes_poder: '**QUÉ:** Identificar y caracterizar el parámetro multiplicativo a en f(x) = a · bˣ.


  **CÓMO:** Evaluando f(0) = a para fijar el intercepto con el eje Y y la orientación de la curva.


