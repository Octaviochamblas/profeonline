semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.PARAMETRO_ESCALA
resumen_inicial: La identificación del parámetro $a$ establece la escala vertical, la posición del corte con el eje Y y la orientación de la gráfica.
explicacion_simple: |
  En la función $f(x) = a \cdot b^x$, el parámetro **$a$ actúa como la escala o la "altura de partida"** de la función:

  - **Corte con el eje Y**: Al evaluar $x = 0$, $f(0) = a \cdot b^0 = a \cdot 1 = a$. Por lo tanto, el gráfico siempre corta al eje Y en **$(0, a)$**.
  - **Efecto del signo de $a$**:
    - **Si $a > 0$**: La curva está sobre el eje X (ordenadas positivas).
    - **Si $a < 0$**: La curva se invierte hacia abajo del eje X (ordenadas negativas).
explicacion_formal: |
  Sea el operador de escala afín $f(x) = a \cdot b^x$ con $a \in \mathbb{R} \setminus \{0\}$ y $b \in \mathbb{R}^+ \setminus \{1\}$. El **parámetro multiplicativo $a$** representa el coeficiente de estiramiento u orientación vertical:

  **Propiedades algebraicas de $a$:**
  1. **Ordenada al origen:** $f(0) = a \implies G(f) \cap \text{Eje } Y = \{(0, a)\}$.
  2. **Orientación y Recorrido:**
     - Si $a > 0 \implies \text{Rec}(f) = ]0, +\infty[$ (Curva en el semiplano superior $y > 0$).
     - Si $a < 0 \implies \text{Rec}(f) = ]-\infty, 0[$ (Curva en el semiplano inferior $y < 0$).
  3. **Escalamiento de la tasa:** Modifica las amplitudes sin alterar la posición de la asíntota horizontal $y = 0$.
definiciones_clave: |
  - **Parámetro multiplicativo $a$**: Factor constante exterior a la potencia que define la ordenada al origen y la escala vertical de la función exponencial.
propiedades_relaciones: |
  - **Reflexión respecto al eje X**: Cambiar el signo del parámetro de $+a$ a $-a$ transforma la función en su reflejada respecto del eje X $g(x) = -f(x)$.
ejemplo_guiado:
  enunciado: 'Compara la gráfica de $f(x) = 3 \cdot 2^x$ con la de $g(x) = -3 \cdot 2^x$ e indica sus intersecciones con el eje Y.'
  pasos:
    - 'Paso 1: Identificar el parámetro $a$ de $f(x)$: $a = 3$. Su corte con Y es $(0, 3)$ y la gráfica se ubica arriba del eje X.'
    - 'Paso 2: Identificar el parámetro $a$ de $g(x)$: $a = -3$. Su corte con Y es $(0, -3)$ y la gráfica se ubica abajo del eje X.'
    - 'Paso 3: Observar que ambas conservan la misma base $b = 2$.'
    - 'Paso 4: Concluir que $g(x)$ es la reflexión vertical respecto al eje X de la función $f(x)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si en una función exponencial $f(x) = a \cdot b^x$ el parámetro $a = -10$, ¿en qué punto la gráfica intercepta al eje Y?'
    choices:
      - {text: 'En el punto cartesiano $(0, -10)$', is_correct: true}
      - {text: 'En el punto cartesiano $(0, 10)$.', is_correct: false}
      - {text: 'En el punto cartesiano $(-10, 0)$.', is_correct: false}
      - {text: 'No intercepta al eje Y.', is_correct: false}
    explanation: 'La alternativa correcta es ''En el punto cartesiano $(0, -10)$''. $f(0) = -10 \cdot b^0 = -10 \cdot 1 = -10$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué sucede con el recorrido de la función $f(x) = a \cdot 5^x$ si el parámetro multiplicativo $a$ es negativo ($a < 0$)?'
    choices:
      - {text: 'El recorrido pasa a ser todo el intervalo negativo $]-\infty, 0[$', is_correct: true}
      - {text: 'El recorrido se mantiene en $]0, +\infty[$.', is_correct: false}
      - {text: 'El recorrido pasa a ser todos los reales $\mathbb{R}$.', is_correct: false}
      - {text: 'El recorrido se vuelve un conjunto discreto.', is_correct: false}
    explanation: 'La alternativa correcta es ''El recorrido pasa a ser todo el intervalo negativo $]-\infty, 0[$''. Al ser $a < 0$, las ordenadas son negativas.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Localizar el coeficiente numérico $a$ que multiplica externamente a la potencia $b^x$.'
  - 'Paso 2: Evaluar la función en $x = 0$ para confirmar que $f(0) = a$.'
  - 'Paso 3: Analizar el signo de $a$ para determinar si las imágenes se ubican sobre o debajo del eje X.'
  - 'Paso 4: Registrar las coordenadas $(0, a)$ como el intercepto exacto con el eje Y.'
errores_correccion: |
  - **Error común:** Confundir el parámetro multiplicativo $a$ con la base de la potencia $b$.
  - **Cómo corregirlo:** La base $b$ **TIENE EL EXPONENTE $x$** ($b^x$); el parámetro $a$ está suelto multiplicando a la potencia.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Identificación de escala positiva.
    alternativas:
      - 'a = 12, corte Y en (0, 12), recorrido ]0, +\infty['
      - 'a = 2, corte Y en (0, 2)'
      - 'corte Y en (12, 0)'
    respuesta: 'a = 12, corte Y en (0, 12), recorrido ]0, +\infty['
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Identificación de escala negativa.
    alternativas:
      - 'a = -0.5, corte Y en (0, -0.5), recorrido ]-\infty, 0['
      - 'a = 0.5, corte Y en (0, 0.5)'
      - 'corte Y en (-0.5, 0)'
    respuesta: 'a = -0.5, corte Y en (0, -0.5), recorrido ]-\infty, 0['
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 7 \cdot 3^x$, la afirmación de que el punto de corte con el eje Y se ubica en $(0, 3)$.'
  - 'La afirmación de que un parámetro $a$ negativo genera una base $b$ negativa.'
  - 'La afirmación de que variar el valor de $a$ desplaza horizontalmente la asíntota de la función.'
  - 'Equiparar la constante multiplicativa $a$ con el término independiente de desplazamiento vertical.'
  - 'La consideración de que cuando $a = 1$, el parámetro de escala no existe en la función.'
afirmaciones_verdaderas:
  - 'El parámetro multiplicativo $a$ determina la ordenada al origen de la función exponencial general $f(x) = a \cdot b^x$ en el punto $(0, a)$.'
  - 'Un parámetro $a < 0$ invierte la gráfica de la función exponencial hacia el semiplano inferior, fijando su recorrido en $]-\infty, 0[$.'
al_terminar_debes_poder: |
  QUÉ: Identificar e interpretar el parámetro multiplicativo $a$ en la función exponencial $f(x) = a \cdot b^x$.
  CÓMO: Isolar el coeficiente exterior, calcular el corte con Y en $(0, a)$ y determinar el intervalo del recorrido según el signo de $a$.
