resumen_inicial: La uso de la propiedad asociativa en multiplicación algebraica aplica
  rigurosamente las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con uso de la propiedad asociativa en multiplicación
  algebraica, multiplicamos los coeficientes numéricos, aplicamos la regla de signos
  y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Uso de la propiedad asociativa
  en multiplicación algebraica** viene dada por:


  $$\text{"el producto [(2a) · (3b)] · (4c) = (2a) · [(3b) · (4c)]"} \implies 24abc$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Uso de la propiedad asociativa en multiplicación algebraica**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule uso de la propiedad asociativa en multiplicación algebraica
    para: ''el producto [(2a) · (3b)] · (4c) = (2a) · [(3b) · (4c)]''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 24abc.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar uso de la propiedad asociativa en multiplicación
    algebraica a 'el producto [(2a) · (3b)] · (4c) = (2a) · [(3b) · (4c)]'?
  choices:
  - text: 24abc
    is_correct: true
  - text: 9abc
    is_correct: false
  - text: 24a^3b^3c^3
    is_correct: false
  - text: 12abc
    is_correct: false
  explanation: La alternativa correcta es '24abc'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto [(2a) · (3b)] · (4c) = (2a) · [(3b)
    · (4c)]', ¿qué expresión resultante se obtuvo?
  choices:
  - text: 24abc
    is_correct: true
  - text: 9abc
    is_correct: false
  - text: 24a^3b^3c^3
    is_correct: false
  - text: 12abc
    is_correct: false
  explanation: La alternativa correcta es '24abc'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante uso de la propiedad asociativa en multiplicación algebraica.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de uso de la propiedad asociativa en multiplicación
    algebraica en 'el producto [(2a) · (3b)] · (4c) = (2a) · [(3b) · (4c)]'?
  alternativas:
  - 24abc
  - 9abc
  - 24a^3b^3c^3
  - 12abc
  respuesta: 24abc
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 24abc.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto [(2a) · (3b)] · (4c) = (2a) · [(3b) · (4c)]'
    por uso de la propiedad asociativa en multiplicación algebraica, ¿qué expresión
    resulta?
  alternativas:
  - 24abc
  - 9abc
  - 24a^3b^3c^3
  - 12abc
  respuesta: 24abc
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 24abc.
- titulo: ¿Es la multiplicación en 'el producto [(2a) · (3b)] · (4c) = (2a) · [(3b)
    · (4c)]' equivalente a 24abc?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 24abc.
- titulo: ¿Da el producto de 'el producto [(2a) · (3b)] · (4c) = (2a) · [(3b) · (4c)]'
    un resultado igual a 9abc?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 24abc.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar uso de la propiedad
  asociativa en multiplicación algebraica.
- Omitir distribuir el monomio o término sobre todos los sumandos en uso de la propiedad
  asociativa en multiplicación algebraica.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La uso de la propiedad asociativa en multiplicación algebraica requiere sumar los
  exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la uso de la propiedad
  asociativa en multiplicación algebraica aplicando distributividad, ley de signos
  y suma de exponentes.
