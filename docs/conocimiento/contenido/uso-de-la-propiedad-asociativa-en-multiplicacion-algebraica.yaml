semantic_id: MAT.ALG.LEYES_MULTIPLICACION.PROPIEDAD_ASOCIATIVA
resumen_inicial: 'Uso de la propiedad asociativa en multiplicación algebraica: leyes,
  procedimiento y aplicación en Leyes fundamentales de la multiplicación algebraica.'
explicacion_simple: Cuando intervienen tres o más factores, los paréntesis indican
  qué producto se calcula primero. La propiedad asociativa permite cambiar esa agrupación
  sin alterar el resultado.
explicacion_formal: '### Definición formal


  Para todo $a, b, c$ pertenecientes al conjunto de expresiones algebraicas, se cumple
  $(a \cdot b) \cdot c = a \cdot (b \cdot c)$: el resultado de un producto de tres
  o más factores no depende de cómo se agrupen mediante paréntesis, sino solo del
  orden en que aparecen los factores.


  ### Desarrollo didáctico


  Agrupar los monomios $5 \cdot 2x$ da $10x$, un multiplicador muy fácil de distribuir
  luego en $(x-1)$.


  La forma correcta es agrupar: $[3(x+2)](x-4)$ o $3[(x+2)(x-4)]$. Multiplicar ambos
  implica insertar el factor dos veces.


  Se asocian los dos binomios juntos para resolver el producto notable primero.'
definiciones_clave: '- **Uso de la propiedad asociativa en multiplicación algebraica**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a uso de la propiedad asociativa en multiplicación
  algebraica.'
ejemplo_guiado:
