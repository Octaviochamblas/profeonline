procedimiento:
- Agrupar los monomios $5 \cdot 2x$ da $10x$, un multiplicador muy fácil de distribuir
  luego en $(x-1)$.
- 'La forma correcta es agrupar: $[3(x+2)](x-4)$ o $3[(x+2)(x-4)]$. Multiplicar ambos
