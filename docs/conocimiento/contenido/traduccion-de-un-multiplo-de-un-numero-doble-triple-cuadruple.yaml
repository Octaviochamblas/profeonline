errores_frecuentes:
- Escribir $x^2$ (x al cuadrado) para expresar 'el doble'. El doble es una multiplicación
  ($2x$), no una potencia.
- Escribir $x2$ violando la regla del coeficiente a la izquierda.
- Traducirla como $2+x$.
- Traducirla usando el número $3$.
- Traducirla como una fracción, $\frac{x}{2}$.
afirmaciones_verdaderas:
