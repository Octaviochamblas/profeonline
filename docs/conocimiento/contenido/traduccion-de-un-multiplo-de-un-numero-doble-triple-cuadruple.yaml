semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.MULTIPLO_NUMERO
resumen_inicial: 'La traducción de un múltiplo de un número consiste en expresar simbólicamente la multiplicación de una variable o cantidad por un factor entero constante (doble, triple, cuádruple, quíntuple, etc.).'
explicacion_simple: |
  Un **múltiplo de un número** expresa la repetición de esa cantidad varias veces mediante una **multiplicación**:
  - En álgebra, para escribir la multiplicación de un número por una letra, **simplemente colocas el número pegado delante de la letra** (sin necesidad de escribir el punto de multiplicar):
    - **El doble** de un número $x \implies \mathbf{2x}$ (multiplicar por 2).
    - **El triple** de un número $x \implies \mathbf{3x}$ (multiplicar por 3).
    - **El cuádruple** de un número $x \implies \mathbf{4x}$ (multiplicar por 4).
    - **El quíntuple** de un número $x \implies \mathbf{5x}$ (multiplicar por 5).
    - **Un múltiplo cualquiera $k$** de un número $x \implies \mathbf{kx}$.
  - **¡Atención!** No confundas multiplicadores como "el doble" ($2x$) o "el triple" ($3x$) con exponentes como "al cuadrado" ($x^2$) o "al cubo" ($x^3$).
explicacion_formal: |
  ### Definición formal
  La traducción de un **múltiplo escalar** mapea una cantidad variable $x \in \mathbb{R}$ y un coeficiente constante multiplicativo $k \in \mathbb{Z}^+$ en el producto escalar directo $M_k(x) \in \mathbb{R}[x]$:

  $$M_k(x) = k \cdot x = kx$$

  ### Tabla de Correspondencia Numérica de Múltiplos

  $$\begin{array}{|c|c|c|}
  \hline
  \text{\textbf{Término verbal}} & \text{\textbf{Factor escalar ($k$)}} & \text{\textbf{Expresión algebraica}} \\
  \hline
  \text{El doble de } x & 2 & 2x \\
  \text{El triple de } x & 3 & 3x \\
  \text{El cuádruple de } x & 4 & 4x \\
  \text{El quíntuple de } x & 5 & 5x \\
  \text{El séptuple de } x & 7 & 7x \\
  \text{El décuple de } x & 10 & 10x \\
  \text{Un número par general} & 2 & 2n \quad (n \in \mathbb{Z}) \\
  \hline
  \end{array}$$

  ### Síntesis didáctica
  Los múltiplos escalares representan relaciones de proporcionalidad directa lineal $y = kx$ y son la base de los coeficientes numéricos en polinomios.
definiciones_clave: |
  - **Múltiplo de una cantidad**: Expresión $kx$ que resulta de multiplicar la variable $x$ por un entero constante $k$.
  - **Factor de proporcionalidad ($k$)**: Cifra numérica constante que indica cuántas veces se repite la variable.
  - **Representación de número par ($2n$)**: Expresión canónica para denotar a cualquier número entero divisible por $2$.
propiedades_relaciones: |
  - **Conmutatividad multiplicativa**: La expresión $kx$ es idéntica a $x \cdot k$, pero por convención tipográfica algebraica el coeficiente numérico $k$ se escribe siempre en primer lugar.
  - **Distributividad sobre sumas compuestas**: El múltiplo de una suma compuesta exige paréntesis: "el triple de $x+y$" $\implies 3(x+y) = 3x + 3y$.
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "La suma entre el cuádruple de un número $a$ y el quíntuple del triple de un número $b$".'
  pasos:
    - 'Paso 1: Traducimos "El cuádruple de un número $a$": Multiplicar por $4 \implies 4a$.'
    - 'Paso 2: Traducimos "El triple de un número $b$": Multiplicar por $3 \implies 3b$.'
    - 'Paso 3: Traducimos "El quíntuple del triple de $b$": Multiplicar por $5$ el resultado anterior $\implies 5(3b) = 15b$.'
    - 'Paso 4: Unimos con la suma: $4a + 15b$.'
    - 'Conclusión: La expresión traducida y simplificada es **$4a + 15b$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se representa algebraicamente el enunciado "El séptuple de una cantidad $n$"?'
    choices:
      - {text: 'Se representa multiplicando la variable por 7: $7n$', is_correct: true}
      - {text: 'Se representa elevando la variable a 7: $n^7$', is_correct: false}
      - {text: 'Se representa dividiendo la variable entre 7: $\frac{n}{7}$', is_correct: false}
      - {text: 'Se representa sumando 7 a la variable: $n + 7$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se representa multiplicando la variable por 7: $7n$''. Séptuple equivale a multiplicar por 7.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la diferencia fundamental entre "El triple de un número $x$" y "Un número $x$ al cubo"?'
    choices:
      - {text: '"El triple" multiplica la variable por 3 ($3x$), mientras que "al cubo" eleva la variable al exponente 3 ($x^3$)', is_correct: true}
      - {text: 'Ambas expresiones son exactamente iguales', is_correct: false}
      - {text: '"El triple" divide por 3 y "al cubo" suma 3', is_correct: false}
      - {text: '"El triple" es para números pares y "al cubo" es para números impares', is_correct: false}
    explanation: 'La alternativa correcta es ''"El triple" multiplica la variable por 3 ($3x$), mientras que "al cubo" eleva la variable al exponente 3 ($x^3$)''. Multiplicador vs Exponente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer el término prefijo que indica la repetición ("doble", "triple", "cuádruple", "quíntuple").'
  - 'Paso 2: Asociar dicho prefijo a su número entero correspondiente ($2, 3, 4, 5$).'
  - 'Paso 3: Escribir el coeficiente numérico inmediatamente delante de la letra variable.'
  - 'Paso 4: Si el múltiplo afecta a una suma o resta compuesta, colocar paréntesis tras el coeficiente numérico.'
errores_correccion: |
  - **Error 1:** Escribir la potencia al cubo $x^3$ al traducir "el triple de $x$". **Cómo corregirlo:** "El triple" **multiplica por 3 ($3x$)**; "al cubo" eleva a la potencia 3 ($x^3$).
  - **Error 2:** Colocar la letra antes del número (escribir $x2$ o $x3$). **Cómo corregirlo:** Por convención formal algebraica, **el número coeficiente va SIEMPRE delante de la letra ($2x, 3x$)**.
ejemplos:
  - titulo: 'Traducción de doble y triple'
    enunciado: '¿Cuál es la traducción de "La suma del doble de $a$ y el triple de $b$"?'
    alternativas:
      - '$2a + 3b$'
      - '$a^2 + b^3$'
      - '$6ab$'
    respuesta: '$2a + 3b$'
    solucion_pasos:
      - '1. Doble de $a \to 2a$.'
      - '2. Triple de $b \to 3b$.'
      - '3. Suma: $2a + 3b$.'
  - titulo: 'Número par canónico'
    enunciado: '¿Representa la expresión $2n$ a cualquier número par para $n \in \mathbb{Z}$?'
    alternativas:
      - 'Sí, todo múltiplo de 2 es un número par'
      - 'No, sólo representa números impares'
      - 'No, representa una fracción'
    respuesta: 'Sí, todo múltiplo de 2 es un número par'
    solucion_pasos:
      - '1. Todo número multiplicado por 2 resulta divisible por 2.'
      - '2. $2n$ es la forma canónica de un número par.'
  - titulo: 'Múltiplo de una resta'
    enunciado: 'La frase "El cuádruple de la diferencia entre $x$ y $1$", ¿se traduce como $4(x - 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, "el cuádruple" multiplica a toda la diferencia entre paréntesis: $4(x - 1)$.'
  - titulo: 'Quíntuple de una cantidad'
    enunciado: '¿Es la traducción del quíntuple de $y$ igual a $5y$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, quíntuple indica multiplicación por 5.'
errores_frecuentes:
  - 'Escribir una potencia x^3 al traducir la frase el triple de un número.'
  - 'Escribir la variable antes del número coeficiente como x2 en lugar de 2x.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Representar el quíntuple de un número como la división de la cantidad por cinco.'
  - 'Los paréntesis no son colocados al aplicar un cuádruple sobre la suma de dos variables.'
afirmaciones_verdaderas:
  - 'La traducción de un múltiplo de una cantidad multiplica a la variable por un factor entero constante.'
  - 'Por convención algebraica formal, el coeficiente numérico se escribe inmediatamente a la izquierda de la variable.'
al_terminar_debes_poder: 'Traducir múltiplos de cantidades al lenguaje algebraico multiplicando la variable por su coeficiente escalar correspondiente.'
