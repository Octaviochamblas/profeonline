semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.MULTIPLO_NUMERO
resumen_inicial: 'Traducción de un múltiplo de un número (doble, triple, cuádruple,
  …): traducción, reglas y aplicación práctica en Lenguaje algebraico: operaciones
  y múltiplos.'
explicacion_simple: No es lo mismo decir 'tengo dos amigos' que 'tengo el doble de
  amigos que tú'. Los múltiplos escalan cantidades desconocidas como si usáramos una
  fotocopiadora matemática.
explicacion_formal: '### Definición formal


  El ''doble'' es multiplicar por 2 ($2x$). Elevar al cuadrado ($x^2$) es multiplicar
  el número por sí mismo, un concepto totalmente distinto.


  ### Desarrollo didáctico


  Palabras clave y su traducción directa:

  - El doble de un número: $2x$

  - El triple de una cantidad: $3a$

  - El cuádruple de la ganancia: $4G$

  - Cinco veces un valor: $5v$


  *La regla de oro:* El coeficiente (el número fijo) siempre, siempre, va antes de
  la letra. Escribir $x2$ en vez de $2x$ es un error de sintaxis gravísimo en álgebra
  formal.'
definiciones_clave: '- **Traducción de un múltiplo de un número (doble, triple, cuádruple,
  …)**: Herramienta clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de un múltiplo de un número (doble, triple, cuádruple,
  …).'
