procedimiento:
- 'Paso 1: Identifica la palabra que indica multiplicidad (doble, triple, veces).'
- 'Paso 2: Conviértela a su número correspondiente (2, 3, etc). Escríbelo primero.'
- 'Paso 3: Identifica de quién estamos calculando ese múltiplo y asigna una variable.'
- 'Paso 4: Escribe la variable inmediatamente a la derecha del número.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  traducción de un múltiplo de un número (doble, triple, cuádruple, …).
ejemplos:
- titulo: Clonando variables
  enunciado: 'Traduce algebraicamente: ''Siete veces la edad del capitán''.'
  solucion_pasos:
  - 'La expresión ''Siete veces'' nos da la constante multiplicadora: 7.'
  - 'La ''edad del capitán'' es el objeto a multiplicar: C.'
  - 'Se escribe constante seguida de variable: 7C.'
- titulo: En una fábrica, la meta de producción de este mes exige fabricar 'el cuádruple
    de lo fabrica
  enunciado: 'En una fábrica, la meta de producción de este mes exige fabricar ''el
    cuádruple de lo fabricado el mes anterior''. Si la producción del mes anterior
    está guardada en la variable $P$, ¿cómo debe escribirse el algoritmo que define
    la meta actual? (v1)


    Opciones: A) $Meta = 4P$ · B) $Meta = P^4$ · C) $Meta = P / 4$ · D) $Meta = 4
    + P$'
  solucion_pasos:
  - El cuádruple significa multiplicar por cuatro. Se escribe el coeficiente 4 seguido
    de la variable P.
  - 'Respuesta: $Meta = 4P$'
