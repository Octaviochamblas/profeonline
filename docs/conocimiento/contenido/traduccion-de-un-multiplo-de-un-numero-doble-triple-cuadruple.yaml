resumen_inicial: La traducción de un múltiplo de un número en lenguaje algebraico
  vincula enunciados verbales con expresiones matemáticas precisas.
explicacion_simple: Para expresar un múltiplo de un número, identificamos las letras
  que representan los números y usamos el símbolo matemático adecuado.
explicacion_formal: 'Sea $x, y \in \mathbb{R}$. La **Traducción de Un múltiplo de
  un número** establece la asignación:


  $$\text{"el cuádruple de un número x"} \implies 4x$$


  > **Complemento didáctico:** Esta traducción permite formalizar algebraicamente
  enunciados verbales en el dominio real.'
definiciones_clave: '- **Un múltiplo de un número**: Representación simbólica en lenguaje
  algebraico.'
propiedades_relaciones: '- **Coherencia operacional**: 4x conserva el significado
  semántico del enunciado.'
ejemplo_guiado:
  enunciado: 'Traduzca a lenguaje algebraico: ''el cuádruple de un número x''.'
  pasos:
  - 'Paso 1: Identificar las cantidades y variables.'
  - 'Paso 2: Aplicar la operación correspondiente.'
  - 'Conclusión: La expresión exacta es 4x.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación algebraica de 'el cuádruple de un número x'?
  choices:
  - text: 4x
    is_correct: true
  - text: x + 4
    is_correct: false
  - text: x^4
    is_correct: false
  - text: x / 4
    is_correct: false
  explanation: La alternativa correcta es '4x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el cuádruple de un número x', ¿cuál fue la
    expresión obtenida?
  choices:
  - text: 4x
    is_correct: true
  - text: x + 4
    is_correct: false
  - text: x^4
    is_correct: false
  - text: x / 4
    is_correct: false
  explanation: La alternativa correcta es '4x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado identificando variables.'
- 'Paso 2: Escribir los operadores correspondientes.'
- 'Paso 3: Verificar el resultado.'
errores_correccion: '- **Error 1: Invertir términos al traducir un múltiplo de un
  número.** **Cómo corregirlo:** Mantener el orden sintáctico adecuado de los operandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'el cuádruple de un número x'?
  alternativas:
  - 4x
  - x + 4
  - x^4
  - x / 4
  respuesta: 4x
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo 4x.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de un múltiplo
    de un número 'el cuádruple de un número x'?
  alternativas:
  - 4x
  - x + 4
  - x^4
  - x / 4
  respuesta: 4x
  solucion_pasos:
  - 1. Revisar la operación principal.
  - 2. Confirmar que la opción correcta es 4x.
- titulo: ¿Representa 4x el enunciado 'el cuádruple de un número x'?
  respuesta: Sí
  solucion_pasos:
  - Sí, coincide exactamente con el enunciado verbal.
- titulo: ¿Es la suma directa equivalente a 4x?
  respuesta: 'No'
  solucion_pasos:
  - No, cada operador matemático tiene un significado único.
errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de un múltiplo de un número.
- Multiplicar en lugar de dividir o restar según corresponda en un múltiplo de un
  número.
- Representar la adición de términos mediante la elevación a exponentes en un múltiplo
  de un número.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de un múltiplo de
  un número.
afirmaciones_verdaderas:
- La expresión 4x representa la traducción fiel de un múltiplo de un número.
- Las variables permiten modelar cualquier caso en un múltiplo de un número.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre un múltiplo
  de un número construyendo la expresión algebraica 4x de manera correcta.
