procedimiento:
- 'Paso 1: Identifica los puntos accesibles (donde se puede medir) y el punto inaccesible.'
- 'Paso 2: Mide la distancia entre los puntos accesibles y los ángulos hacia el punto
  inaccesible desde cada uno.'
- 'Paso 3: Aplica la ley de senos (o cosenos, según los datos) para calcular la distancia
  inaccesible buscada.'
