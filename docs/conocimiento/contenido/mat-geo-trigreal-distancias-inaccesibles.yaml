semantic_id: MAT.GEO.TRIG_APLICA_REAL.DISTANCIAS_INACCESIBLES
resumen_inicial: 'Determinación de distancias inaccesibles mediante resolución de
  triángulos oblicuángulos: conceptos, teoremas, propiedades geométricas y cálculo
  en Trigonometría Ampliada.'
explicacion_simple: A diferencia de los problemas de distancias indirectas con triángulo
  rectángulo, aquí el triángulo formado no tiene ángulo recto, por lo que se necesitan
  las leyes de senos o cosenos para resolverlo.
explicacion_formal: '![Distancias inaccesibles con triángulos oblicuángulos](/static/img/geometria/trigonometria/trigreal-distancias-inaccesibles.svg)


  ### Definición formal


  Dados dos puntos accesibles y uno inaccesible, se forma un triángulo con esos tres
  puntos. Midiendo la distancia entre los puntos accesibles y los ángulos hacia el
  punto inaccesible desde cada uno de ellos, se puede calcular la distancia inaccesible
  mediante la ley de senos.


  ### Desarrollo didáctico


  Por ejemplo, para medir la distancia a una isla desde dos puntos de la costa: se
  mide la distancia entre esos dos puntos (c) y los ángulos hacia la isla desde cada
  uno (A y B). Con estos datos (ASA), se calcula el ángulo restante y luego, mediante
  la ley de senos, la distancia desde cualquiera de los puntos hasta la isla.'
