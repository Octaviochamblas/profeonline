semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.PIE_ALTURA
resumen_inicial: El pie de la altura en un triángulo es el punto de intersección perpendicular
  entre la altura y la recta que contiene al lado opuesto. En este punto se forman
  dos ángulos rectos ($90^\circ$), descomponiendo el triángulo en dos triángulos rectángulos
  adyacentes.
explicacion_simple: '![Pie de la Altura](/static/img/nodos/identificacion-del-pie-de-la-altura-en-un-triangulo-intro.svg)


  El **pie de la altura** (comúnmente llamado $H_a$ o $D$) es el punto exacto donde
  la línea de la altura "toca" o choca con la base:


  - **Punto de $90^\circ$**: En el pie de la altura siempre se forma una escuadra
  perfecta de $90^\circ$.

  - **Divide en dos triángulos rectángulos**: Al caer sobre la base, crea dos triángulos
  rectángulos ($\Delta AH_aB$ y $\Delta AH_aC$).

  - **Ubicación**: En triángulos acutángulos cae dentro del lado; en triángulos obtusángulos
  cae afuera, sobre la prolongación de la base.

  '
explicacion_formal: '### Definición formal

  El **pie de la altura** correspondiente al vértice $A$ en un triángulo $\Delta ABC$
  es el punto geométrico $H_a$ donde la recta que contiene a la altura intersecta
  perpendicularmente a la recta soporte del lado opuesto:


  $$\{H_a\} = \overleftrightarrow{h_a} \cap \overleftrightarrow{BC} \quad \text{tal
  que} \quad \overleftrightarrow{AH_a} \perp \overleftrightarrow{BC}$$


  ### Desglose simbólico y geométrico

  - $H_a \in \overline{BC}$ en triángulos acutángulos (interior al segmento).

  - $H_a = C$ en triángulos rectángulos con ángulo recto en $C$ (coincide con el vértice
  recto).

  - $H_a \notin \overline{BC}$ en triángulos obtusángulos (yace sobre la prolongación
  exterior del lado).


  ### Síntesis didáctica

  Identificar el pie de la altura sobre la recta soporte permite construir triángulos
  rectángulos auxiliares para calcular distancias y proyecciones ortogonales.'
definiciones_clave: '- **Pie de la altura ($H_a$)**: Punto donde la recta de la altura
  corta perpendicularmente a la recta del lado opuesto.

  - **Proyección ortogonal**: Posición geométrica obtenida al trazar una perpendicular
  desde un punto a una recta.

  - **Segmentos basales**: Los dos segmentos $BH_a$ y $H_aC$ en que queda dividida
  la base por el pie de la altura.

  '
propiedades_relaciones: '- **Diferencia de cuadrados**: $c^2 - b^2 = BH_a^2 - H_aC^2$.

  - **Coincidencia en isósceles**: En el triángulo isósceles con $\overline{AB} =
  \overline{AC}$, el pie $H_a$ coincide exactamente con el punto medio de $\overline{BC}$
  ($BH_a = H_aC = a/2$).

  - **Ángulos adyacentes suplementarios y rectos**: $\angle AH_aB = \angle AH_aC =
  90^\circ$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Pie de la Altura](/static/img/nodos/identificacion-del-pie-de-la-altura-en-un-triangulo-ejemplos.svg)


    En un triángulo $ABC$, la altura $\overline{AH_a}$ mide $12\text{ cm}$ y divide
    a la base $\overline{BC}$ en dos segmentos $BH_a = 9\text{ cm}$ y $H_aC = 5\text{
    cm}$. Calcula la longitud de los lados $\overline{AB}$ y $\overline{AC}$.

    '
  pasos:
  - 'Paso 1: Identificar que el pie $H_a$ genera dos triángulos rectángulos: $\Delta
    ABH_a$ a la izquierda y $\Delta ACH_a$ a la derecha.'
  - 'Paso 2: Aplicar el Teorema de Pitágoras en $\Delta ABH_a$: $AB^2 = h_a^2 + BH_a^2
    = 12^2 + 9^2 = 144 + 81 = 225$.'
  - 'Paso 3: Extraer la raíz cuadrada para hallar $AB$: $AB = \sqrt{225} = 15\text{
    cm}$.'
  - 'Paso 4: Aplicar el Teorema de Pitágoras en $\Delta ACH_a$: $AC^2 = h_a^2 + H_aC^2
    = 12^2 + 5^2 = 144 + 25 = 169 \implies AC = \sqrt{169} = 13\text{ cm}$.'
  - 'Paso 5: Concluir que los lados miden $AB = 15\text{ cm}$ y $AC = 13\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué tipo de triángulos se forman siempre a ambos lados del pie de una
    altura interior?
  choices:
  - text: Dos triángulos rectángulos que comparten la altura como cateto común
    is_correct: true
  - text: Dos triángulos equiláteros idénticos
    is_correct: false
  - text: Dos triángulos obtusángulos
    is_correct: false
  - text: Dos triángulos con lados siempre de igual longitud
    is_correct: false
  explanation: Se forman dos triángulos rectángulos que comparten la altura como cateto
    común, gracias al ángulo recto de $90^\circ$ formado en el pie de la altura.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo isósceles de lados 10 cm, 10 cm y base 12 cm, ¿a qué distancia
    de los extremos de la base se ubica el pie de la altura principal?
  choices:
  - text: A $6\text{ cm}$ de cada extremo, porque coincide con el punto medio de la
      base
    is_correct: true
  - text: A $5\text{ cm}$ de un extremo y $7\text{ cm}$ del otro
    is_correct: false
  - text: A $4\text{ cm}$ de cada extremo
    is_correct: false
  - text: A $12\text{ cm}$ de la base
    is_correct: false
  explanation: El pie de la altura se ubica a $6\text{ cm}$ de cada extremo, porque
    coincide con el punto medio de la base en el triángulo isósceles ($12/2 = 6\text{
    cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el vértice emisor y trazar la recta perpendicular hacia el lado
  opuesto.'
- 'Paso 2: Identificar el punto de corte perpendicular $H_a$ (pie de la altura).'
- 'Paso 3: Marcar los dos ángulos rectos de $90^\circ$ adyacentes en $H_a$.'
- 'Paso 4: Separar los dos triángulos rectángulos resultantes para aplicar relaciones
  métricas o trigonométricas.'
errores_correccion: No asumas que el pie de la altura divide a la base en partes iguales
  a menos que el triángulo sea isósceles respecto a esa base o equilátero.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo $ABC$ la altura $h_a = 8\text{ cm}$, el lado $c =
    10\text{ cm}$ y el lado $b = 17\text{ cm}$, ¿cuánto mide la base $a = \overline{BC}$
    si el pie $H_a$ está entre $B$ y $C$?
  alternativas:
  - $21\text{ cm}$
  - $15\text{ cm}$
  - $18\text{ cm}$
  respuesta: $21\text{ cm}$
  solucion_pasos:
  - 'En $\Delta ABH_a$: $BH_a = \sqrt{10^2 - 8^2} = \sqrt{36} = 6\text{ cm}$.'
  - 'En $\Delta ACH_a$: $H_aC = \sqrt{17^2 - 8^2} = \sqrt{225} = 15\text{ cm}$.'
  - Base total $a = BH_a + H_aC = 6 + 15 = 21\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la altura $h_a$ de un triángulo isósceles de lados $13\text{
    cm}$, $13\text{ cm}$ y base $10\text{ cm}$?
  alternativas:
  - $12\text{ cm}$
  - $10\text{ cm}$
  - $8\text{ cm}$
  respuesta: $12\text{ cm}$
  solucion_pasos:
  - El pie divide la base en dos segmentos de $\frac{10}{2} = 5\text{ cm}$.
  - 'Por Pitágoras: $h_a = \sqrt{13^2 - 5^2} = \sqrt{169 - 25} = \sqrt{144} = 12\text{
    cm}$.'
- titulo: ¿El pie de la altura puede coincidir con un vértice del triángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, en los triángulos rectángulos el pie de las alturas trazadas desde los vértices
    agudos coincide con el vértice del ángulo recto.
- titulo: ¿El pie de la altura siempre divide al lado opuesto en dos segmentos de
    igual medida?
  respuesta: 'No'
  solucion_pasos:
  - No, solo en el triángulo isósceles (desde el vértice principal) y en el equilátero.
    En el escaleno los segmentos son desiguales.
errores_frecuentes:
- Confundir el pie de la altura con el punto medio de la base en triángulos escalenos.
- Creer que el pie de la altura nunca puede caer fuera del triángulo.
- Olvidar que en el pie de la altura convergen dos ángulos suplementarios de $90^\circ$.
- Restar erróneamente los segmentos basales al calcular la base total en un acutángulo.
- No verificar la perpendicularidad al medir la distancia desde el vértice.
afirmaciones_verdaderas:
- El pie de la altura es la proyección ortogonal del vértice sobre la recta soporte
  del lado opuesto.
- En un triángulo isósceles, el pie de la altura sobre la base coincide con el punto
  medio de la misma.
al_terminar_debes_poder: '**QUÉ:** Identificar, ubicar y utilizar el pie de la altura
  en la resolución métrica de triángulos.


  **CÓMO:** Reconociendo el punto de intersección perpendicular ($90^\circ$) y aplicando
  el Teorema de Pitágoras en los dos triángulos rectángulos adyacentes.


  ![Resumen de Pie de la Altura](/static/img/nodos/identificacion-del-pie-de-la-altura-en-un-triangulo-resumen.svg)

  '
