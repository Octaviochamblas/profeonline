semantic_id: MAT.GEO.PARALELOGRAMOS.AREA_BASE_ALTURA
resumen_inicial: 'Cálculo del área de un paralelogramo mediante base por altura: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Así como el triángulo tiene una fórmula de área basada en base
  y altura, el paralelogramo tiene una fórmula análoga, incluso más directa.
explicacion_formal: '![Área de un paralelogramo: base por altura](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-area-base-altura.svg)


  ### Definición formal


  Si $b$ es la base de un paralelogramo y $h$ es la altura correspondiente (perpendicular
  a la base, hasta el lado opuesto), el área es $A=b\times h$.


  ### Desarrollo didáctico


  Un paralelogramo con base 10 cm y altura 6 cm tiene área $A=10\times6=60$ cm². A
  diferencia del triángulo (que divide entre 2), el paralelogramo no requiere esa
  división, ya que puede pensarse como el doble de un triángulo con la misma base
  y altura.'
