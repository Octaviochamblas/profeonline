resumen_inicial: El cambio aditivo añade una cantidad fija fija $\Delta y = d$ por
  unidad de tiempo, mientras que el cambio multiplicativo escala el valor por un factor
  $r = (1 + p)$, produciendo tasas de crecimiento porcentual constante.
explicacion_simple: Un cambio aditivo significa sumar siempre el mismo monto de dinero
  (por ejemplo, guardar \$5.000 fijos cada mes). Un cambio multiplicativo significa
  aumentar según un porcentaje (por ejemplo, que tus ahorros crezcan un 10% todos
  los años).
explicacion_formal: 'Para un sistema discreto, la **Diferenciación entre Cambio Aditivo
  y Multiplicativo** contrasta las dinámicas de variación:


  $$\text{Cambio Aditivo: } y_{n+1} = y_n + c \implies y_n = y_0 + c \cdot n$$

  $$\text{Cambio Multiplicativo: } y_{n+1} = y_n \cdot k \implies y_n = y_0 \cdot
  k^n$$


  **Tasa de variación:**

  - En el cambio aditivo la tasa absoluta es constante ($\Delta y = c$).

  - En el cambio multiplicativo la tasa relativa o porcentaje es constante ($\frac{\Delta
  y}{y} = k - 1$).'
definiciones_clave: '- **Cambio aditivo**: Incremento por adición constante $\Delta
  y = c$.'
propiedades_relaciones: '- **Cambio multiplicativo**: Incremento por factor escalar
  $\frac{y_{n+1}}{y_n} = k$ (variación porcentual constante).'
ejemplo_guiado:
  enunciado: Un fondo $A$ aumenta \$10.000 al mes y un fondo $B$ aumenta un $10\%$
    al mes. Si ambos parten con \$100.000, calcule el valor al mes 3.
  pasos:
  - 'Paso 1: Fondo $A$ (cambio aditivo): $A_3 = 100.000 + 2 \cdot 10.000 = 120.000$.'
  - 'Paso 2: Fondo $B$ (cambio multiplicativo): $B_3 = 100.000 \cdot 1,10^2 = 100.000
    \cdot 1,21 = 121.000$.'
  - 'Conclusión: Fondo $A = \$120.000 (aditivo) y Fondo $B = \$121.000 (multiplicativo).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué distingue a la tasa de variación en un cambio multiplicativo frente
    a un cambio aditivo?
  choices:
  - text: El cambio multiplicativo mantiene constante la tasa relativa o porcentaje,
      mientras que el aditivo mantiene constante la cantidad absoluta
    is_correct: true
  - text: El cambio aditivo crece más rápido en el largo plazo
    is_correct: false
  - text: Ambos cambios usan la misma fórmula de suma
    is_correct: false
  - text: El cambio multiplicativo suma ceros al final
    is_correct: false
  explanation: La alternativa correcta es 'El cambio multiplicativo mantiene constante
    la tasa relativa o porcentaje, mientras que el aditivo mantiene constante la cantidad
    absoluta'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $100.000 al mes 3, ¿cuál fue el valor del fondo
    B de cambio multiplicativo (10%)?
  choices:
  - text: 121.000 $
    is_correct: true
  - text: 120.000 $
    is_correct: false
  - text: 110.000 $
    is_correct: false
  - text: 130.000 $
    is_correct: false
  explanation: La alternativa correcta es '121.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de diferenciar cambios aditivos de
  multiplicativos evaluando la tasa absoluta constante frente a la tasa porcentual
  constante.
semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.CAMBIO_ADITIVO_MULTIPLICATIVO
procedimiento:
- 'Paso 1: Analizar la dinámica de cambio de la sucesión (aditiva vs multiplicativa).'
- 'Paso 2: Formular las ecuaciones de P.A. ($a_n = a_1 + (n-1)d$) o P.G. ($b_n = b_1
  \cdot r^{n-1}$) según corresponda.'
- 'Paso 3: Resolver numéricamente los parámetros despejados o interpolados y verificar
  la consistencia.'
errores_correccion: '- **Error 1: Dividir entre $m$ en lugar de $(m+1)$ al calcular
  la diferencia o razón de interpolación.** **Cómo corregirlo:** Para insertar $m$
  medios intermedios, la distancia se divide en $(m+1)$ intervalos.


  - **Error 2: Usar un modelo aritmético para un problema con crecimiento de tasa
  porcentual constante.** **Cómo corregirlo:** Las tasas de variación porcentual constante
  DEBEN modelarse obligatoriamente con progresiones geométricas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROGRESIONES_COMPARACION.CAMBIO_ADITIVO_MULTIPLICATIVO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del modelo de progresiones.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia o razón de interpolación.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por interpolación.
- titulo: ¿Dividen m medios de interpolación el intervalo en m + 1 partes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $m$ términos intermedios generan $m+1$ saltos.
- titulo: ¿Supera el modelo geométrico al aritmético en el largo plazo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la dominancia del crecimiento exponencial sobre el lineal.
errores_frecuentes:
- Dividir el intervalo entre m en lugar de (m + 1) al calcular la diferencia de interpolación
  de m medios.
- Modelar un incremento porcentual constante utilizando una progresión aritmética
  de suma fija.
- Declarar la razón multiplicativa r con la diferencia aditiva d al formular el término
  general.
- Declarar que la interpolación de medios geométricos exige que los extremos tengan
  signos opuestos.
- Restar los extremos en lugar de dividirlos al calcular la razón de interpolación
  geométrica.
afirmaciones_verdaderas:
- La progresión aritmética modela cambios aditivos constantes y la geométrica modela
  cambios multiplicativos constantes.
- Para interpolar $m$ medios entre $A$ y $B$, se divide el intervalo entre $(m+1)$
  saltos.
