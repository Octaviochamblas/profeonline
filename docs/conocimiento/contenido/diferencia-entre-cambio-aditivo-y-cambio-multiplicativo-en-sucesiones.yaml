semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.CAMBIO_ADITIVO_MULTIPLICATIVO
resumen_inicial: 'La diferencia entre cambio aditivo y cambio multiplicativo distingue entre variaciones de magnitud fija constante ($\Delta Y = d$, dependiente solo del paso) y variaciones de tasa porcentual relativa ($\Delta Y = a_n(r-1)$, proporcional a la magnitud presente).'
explicacion_simple: |
  Comprender la diferencia entre cambio aditivo y multiplicativo es clave para finanzas y ciencias:
  - **Cambio Aditivo (+ fijo)**:
    - Si ahorras $\$10.000$ todos los meses en una alcancía:
      - Mes 1: $\$10.000$, Mes 2: $\$20.000$, Mes 3: $\$30.000$, Mes 4: $\$40.000$
      - El incremento es siempre el mismo: **+$\$10.000$ fijos**.
  - **Cambio Multiplicativo ($\cdot$ porcentaje)**:
    - Si inviertes $\$10.000$ ganando un $10\%$ mensual ($r = 1,10$):
      - Mes 1: $\$10.000$
      - Mes 2: $\$11.000$ (ganaste $\$1.000$)
      - Mes 3: $\$12.100$ (ganaste $\$1.100$)
      - Mes 4: $\$13.310$ (ganaste $\$1.210$)
      - El dinero ganado **aumenta cada mes** porque el $10\%$ se calcula sobre el saldo acumulado.

  ![Diferencia entre cambio aditivo y cambio multiplicativo](/static/img/nodos/diferencia-entre-cambio-aditivo-y-cambio-multiplicativo-en-sucesiones-intro.svg)
explicacion_formal: |
  ### Definición y Formalización de las Tasas de Cambio
  Sea $Y(t)$ el estado de una magnitud en la etapa discreta $t \in \mathbb{N}_0$:
  1. **Modelo de Cambio Aditivo Puro (PA)**:
     $$\Delta Y(t) = Y(t+1) - Y(t) = d = \text{constante} \quad [\text{Unidad de } Y]$$
     $$Y(t) = Y_0 + d \cdot t$$
     La tasa de variación absoluta es estrictamente independiente del estado actual $Y(t)$.
  2. **Modelo de Cambio Multiplicativo Puro (PG)**:
     $$\frac{Y(t+1)}{Y(t)} = r = \text{constante} \quad [\text{Adimensional}]$$
     $$\Delta Y(t) = Y(t+1) - Y(t) = Y(t)(r - 1) = i \cdot Y(t)$$
     $$Y(t) = Y_0 \cdot r^t = Y_0 \cdot (1 + i)^t$$
     El incremento absoluto $\Delta Y(t)$ es directamente proporcional al estado $Y(t)$.

  ### Comparación de Derivadas Discretas
  - En el cambio aditivo, la razón de cambio es uniforme (función lineal de derivada constante).
  - En el cambio multiplicativo, la razón de cambio es una función convexa acelerada (propia de la función exponencial $\frac{d}{dt}e^{kt} = k e^{kt}$).

  ### Síntesis didáctica
  - Aditivo: $\Delta Y = d$ (Independiente del saldo).
  - Multiplicativo: $\Delta Y = Y(t) \cdot i$ (Proporcional al saldo acumulado).
definiciones_clave: |
  - **Tasa de cambio absoluta**: Incremento medido en unidades directas de la magnitud ($\Delta Y = d$).
  - **Tasa de cambio relativa ($i$)**: Proporción $i = \frac{\Delta Y}{Y}$ respecto al valor de referencia previo.
  - **Efecto multiplicativo compuesto**: Crecimiento donde cada incremento genera base para futuros incrementos.
propiedades_relaciones: |
  - **Unidades dimensionales**: La diferencia $d$ posee unidades físicas ($[\text{pesos}], [\text{metros}]$); la razón $r$ es un número puro adimensional.
  - **Interés simple vs compuesto**: El interés simple es la manifestación económica del cambio aditivo; el interés compuesto es la del cambio multiplicativo.
ejemplo_guiado:
  enunciado: 'Un trabajador recibe dos opciones de aumento salarial sobre su sueldo base de $\$500.000$: Opción A: Aumento fijo de $\$30.000$ cada año. Opción B: Aumento porcentual del $5\%$ cada año. Determina el sueldo al cabo de 3 años en ambas opciones y cuál resulta más conveniente.'
  imagen: '/static/img/nodos/diferencia-entre-cambio-aditivo-y-cambio-multiplicativo-en-sucesiones-ejemplos.svg'
  pasos:
    - 'Paso 1: Para la Opción A (cambio aditivo): $S_3 = \$500.000 + 3 \cdot (\$30.000) = \$500.000 + \$90.000 = **\$590.000$**.'
    - 'Paso 2: Para la Opción B (cambio multiplicativo): $r = 1 + 0,05 = 1,05$.'
    - 'Paso 3: Calculamos: $S_3 = \$500.000 \cdot (1,05)^3 = \$500.000 \cdot 1,157625 = **\$578.812,50$**.'
    - 'Paso 4: Comparación: Al año 3 la Opción A paga más ($\$590.000 > \$578.812,50$).'
    - 'Paso 5: Sin embargo, debido al crecimiento acelerado de la PG, en el largo plazo (a partir del año 8) la Opción B superará ampliamente a la Opción A.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué en un cambio multiplicativo con tasa positiva los incrementos absolutos $(\Delta Y)$ crecen con el tiempo?'
    choices:
      - {text: 'Porque el porcentaje se aplica sobre una base acumulada cada vez más grande en cada período', is_correct: true}
      - {text: 'Porque la tasa porcentual se duplica automáticamente en cada año', is_correct: false}
      - {text: 'Porque la fórmula suma una constante adicional oculta', is_correct: false}
      - {text: 'Porque la variable de tiempo se multiplica por cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el porcentaje se aplica sobre una base acumulada cada vez más grande en cada período''. El incremento $\Delta Y(t) = i \cdot Y(t)$ crece a medida que $Y(t)$ aumenta.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una magnitud cambia según la regla $Y(t+1) = Y(t) + 400$, ¿qué tipo de cambio describe?'
    choices:
      - {text: 'Cambio aditivo puro (progresión aritmética con $d = 400$)', is_correct: true}
      - {text: 'Cambio multiplicativo puro (progresión geométrica con $r = 400$)', is_correct: false}
      - {text: 'Crecimiento porcentual continuo', is_correct: false}
      - {text: 'Decaimiento exponencial', is_correct: false}
    explanation: 'La alternativa correcta es ''Cambio aditivo puro (progresión aritmética con $d = 400$)''. La variación es una suma constante de 400 unidades.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar en el contexto si la variación periódica es un monto fijo en unidades o un porcentaje relativo.'
  - 'Paso 2: Si es un monto fijo, establecer el modelo aditivo $Y(t) = Y_0 + d \cdot t$.'
  - 'Paso 3: Si es un porcentaje relativo, establecer el modelo multiplicativo $Y(t) = Y_0 \cdot (1 \pm p/100)^t$.'
  - 'Paso 4: Evaluar para los períodos requeridos y analizar las diferencias de comportamiento.'
errores_correccion: |
  - **Error 1:** Tratar un incremento del $10\%$ como una suma constante fija de dinero. **Cómo corregirlo:** Un porcentaje **genera montos crecientes** en cada paso ($10\%$ sobre el saldo acumulado), no una suma fija.
  - **Error 2:** Asumir que la opción con mayor incremento en el año 1 será siempre la ganadora a largo plazo. **Cómo corregirlo:** El modelo multiplicativo **tarda en despegar pero eventualmente supera** a cualquier modelo aditivo.
ejemplos:
  - titulo: 'Identificación de cambio aditivo'
    enunciado: 'Un tanque de agua pierde $15\text{ litros}$ cada minuto. ¿Qué tipo de cambio representa?'
    alternativas:
      - 'Cambio aditivo constante ($d = -15\text{ L}$)'
      - 'Cambio multiplicativo ($r = 15$)'
      - 'Cambio exponencial decreciente'
    respuesta: 'Cambio aditivo constante ($d = -15\text{ L}$)'
    solucion_pasos:
      - '1. La pérdida es una cantidad fija constante en litros por minuto.'
  - titulo: 'Identificación de cambio multiplicativo'
    enunciado: 'Un precio se incrementa en un $8\%$ debido a la inflación cada mes. ¿Qué tipo de cambio representa?'
    alternativas:
      - 'Cambio multiplicativo ($r = 1,08$)'
      - 'Cambio aditivo ($d = 8$)'
      - 'Cambio lineal'
    respuesta: 'Cambio multiplicativo ($r = 1,08$)'
    solucion_pasos:
      - '1. Las tasas porcentuales periódicas corresponden a cambios multiplicativos.'
  - titulo: 'Adimensionalidad de la razón'
    enunciado: '¿La tasa de cambio relativo $r = \frac{Y(t+1)}{Y(t)}$ es una cantidad adimensional?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Las unidades de la magnitud se simplifican en la división.'
  - titulo: 'Superación exponencial'
    enunciado: '¿Una inversión al $20\%$ anual multiplicativo superará eventualmente a un bono que suma $\$1.000.000$ fijo anual?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. El crecimiento geométrico supera asintóticamente a cualquier adición fija.'
errores_frecuentes:
  - 'Modelar los aumentos porcentuales periódicos sumando un valor fijo igual al primer aumento.'
  - 'Considerar que el cambio aditivo y el cambio multiplicativo son idénticos si el primer incremento coincide.'
  - 'Asignar unidades de medida físicas a la tasa de variación relativa porcentual.'
  - 'Afirmar que un cambio aditivo con pendiente grande siempre supera a un cambio multiplicativo.'
  - 'Confundir el porcentaje de incremento periódico con la diferencia en dinero del período.'
afirmaciones_verdaderas:
  - 'En el cambio aditivo el incremento por período es constante ($\Delta Y = d$), mientras que en el multiplicativo el incremento escala con la magnitud acumulada ($\Delta Y = i \cdot Y(t)$).'
  - 'Todo cambio porcentual compuesto periódico corresponde estrictamente a un modelo de cambio multiplicativo discreto.'
