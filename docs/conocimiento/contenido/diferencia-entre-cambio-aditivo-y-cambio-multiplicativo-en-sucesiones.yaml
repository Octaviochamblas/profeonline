procedimiento:
- 'Paso 1: Busca la palabra que describe cómo ocurre el cambio en el tiempo.'
- 'Paso 2: Si el cambio se expresa en unidades directas (metros, pesos, litros), el modelo
  es Aditivo (P.A.).'
- 'Paso 3: Si el cambio se expresa en multiplicadores (''el doble'') o porcentajes (''15%''),
  el modelo es Multiplicativo (P.G.).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en diferencia entre cambio aditivo y cambio multiplicativo en sucesiones.
ejemplos:
- titulo: Contrato A vs Contrato B
  enunciado: 'Contrato A: Sueldo inicial 1 millón, sube $50.000 cada año. Contrato B: Sueldo
    inicial 1 millón, sube 5% cada año. Clasifícalos.'
  solucion_pasos:
  - 'Contrato A: Sube una cantidad en pesos directos (50.000). Es un cambio Aditivo (Progresión
    Aritmética).'
  - 'Contrato B: Sube en base a un porcentaje (5%). Es un cambio Multiplicativo (Progresión
    Geométrica).'
  - Al principio son parecidos, pero a largo plazo el Contrato B ganará por goleada exponencial.
- titulo: Ejemplo 1
  enunciado: ¿Cuál situación describe un cambio aditivo?
  alternativas:
  - Un sueldo que sube 30.000 pesos cada mes
  - Una inversión que crece un 5 por ciento cada mes
  - Una población que se duplica cada año
  respuesta: Un sueldo que sube 30.000 pesos cada mes
  solucion_pasos:
  - La cantidad que se suma es siempre fija, independiente del monto acumulado.
- titulo: Ejemplo 2
  enunciado: ¿Cuál situación describe un cambio multiplicativo?
  alternativas:
  - Una deuda que aumenta un 12 por ciento de interés cada mes
  - Un ahorro que suma 5.000 pesos cada semana
  - Una distancia que aumenta 2 kilómetros cada día
  respuesta: Una deuda que aumenta un 12 por ciento de interés cada mes
  solucion_pasos:
  - El interés se calcula sobre el saldo actual, que cambia cada mes.
- titulo: ¿El interés compuesto es un ejemplo de cambio multiplicativo?
  respuesta: Sí
  solucion_pasos:
  - Cada periodo el interés se calcula sobre el nuevo saldo acumulado, no sobre el monto original.
- titulo: ¿El interés simple es un ejemplo de cambio multiplicativo?
  respuesta: 'No'
  solucion_pasos:
  - El interés simple suma siempre la misma cantidad fija en cada periodo, por lo tanto es
    un cambio aditivo.
errores_frecuentes:
- 'Confundir un porcentaje fijo con un cambio aditivo (Ej: ''Si sube 10% cada año, es una
  suma constante''. No, porque ese 10% se calcula sobre montos cada vez más grandes, es multiplicativo).'
- Asumir que si la cantidad restada es muy grande, debe ser exponencial.
- Confundir un porcentaje fijo con un cambio aditivo, pensando que 'sube 10 por ciento' es
  sumar siempre la misma cantidad.
- Asumir que un cambio es multiplicativo solo porque los números involucrados son grandes.
- No identificar la palabra clave del enunciado, como 'cada vez', 'por ciento' o 'cantidad
  fija', que indica el tipo de cambio.
afirmaciones_verdaderas:
- La formulación de diferencia entre cambio aditivo y cambio multiplicativo en sucesiones
  mantiene la regularidad de la sucesión.
- Un cambio aditivo se representa gráficamente con una línea recta, mientras que un cambio
  multiplicativo se representa con una curva exponencial.
