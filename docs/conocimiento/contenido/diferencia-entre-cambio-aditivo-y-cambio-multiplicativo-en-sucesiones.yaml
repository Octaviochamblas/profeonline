semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.CAMBIO_ADITIVO_MULTIPLICATIVO
resumen_inicial: 'La diferencia entre cambio aditivo y multiplicativo contrapone el incremento por magnitudes absolutas fijas ($+d$) frente al incremento por proporciones o escalas relativas fijas ($\cdot r$).'
explicacion_simple: |
  Comprender la diferencia entre cambio aditivo y cambio multiplicativo es clave para resolver problemas de la vida cotidiana:
  - **Cambio Aditivo**: Aumentas o disminuyes **la misma cantidad absoluta** en cada paso.
    - Ejemplo: Guardar $\$5.000$ fijos en una alcancía cada mes.
    - Paso 1: $\$5.000$, Paso 2: $\$10.000$, Paso 3: $\$15.000$, Paso 4: $\$20.000$.
  - **Cambio Multiplicativo**: Aumentas o disminuyes en un **porcentaje o proporción fija** sobre el saldo anterior.
    - Ejemplo: Ganar el $10\%$ de interés sobre el dinero acumulado.
    - Paso 1: $\$100.000$, Paso 2: $\$110.000$, Paso 3: $\$121.000$, Paso 4: $\$133.100$.
  - En el cambio aditivo la ganancia es **constante**; en el multiplicativo la ganancia es **creciente** (interés sobre interés).
explicacion_formal: |
  ### Definición formal

  1. **Modelo de Cambio Aditivo (P.A.)**:
     $$a_{n+1} = a_n + d \implies \Delta a_n = a_{n+1} - a_n = d \quad (\text{Tasa de cambio absoluta constante})$$
     - Solución explícita: $a_n = a_1 + (n - 1)d$.
     - Gráfica: Puntos alineados sobre una función afín/lineal $y = dx + (a_1 - d)$.

  2. **Modelo de Cambio Multiplicativo (P.G.)**:
     $$b_{n+1} = b_n \cdot r \implies \frac{b_{n+1}}{b_n} = r \implies \Delta b_n = b_n(r - 1) \quad (\text{Tasa de cambio relativa/porcentual constante})$$
     - Solución explícita: $b_n = b_1 \cdot r^{n-1}$.
     - Gráfica: Puntos ubicados sobre una curva exponencial $y = \left(\frac{b_1}{r}\right) \cdot r^x$.

  ### Comparación de derivadas / incrementos finitos
  - En el modelo aditivo, el incremento interetapa $\Delta a_n$ es constante ($d$).
  - En el modelo multiplicativo, el incremento interetapa $\Delta b_n$ es proporcional al nivel alcanzado ($b_n \cdot (r - 1)$).

  ### Síntesis didáctica
  - Aditivo $\implies$ Suma $d$ fijo $\implies$ Variación absoluta constante.
  - Multiplicativo $\implies$ Producto $r$ fijo $\implies$ Variación porcentual/relativa constante.
definiciones_clave: |
  - **Variación absoluta ($\Delta a$)**: Diferencia numérica directa entre dos estados consecutivos ($a_{n+1} - a_n$).
  - **Variación relativa ($\frac{\Delta b}{b}$)**: Proporción o porcentaje de cambio respecto del estado de origen.
  - **Interés simple vs Interés compuesto**: Ejemplos clásicos de cambio aditivo (interés sobre capital inicial) y multiplicativo (interés sobre saldo acumulado).
propiedades_relaciones: |
  - **Efecto bola de nieve**: En el cambio multiplicativo con $r > 1$, la diferencia absoluta $\Delta b_n$ crece en cada paso, produciendo una aceleración exponencial.
  - **Invarianza de escala**: El cambio aditivo depende de las unidades absolutas de medida; el cambio multiplicativo es un número adimensional (escalar).
ejemplo_guiado:
  enunciado: 'Un empleado puede elegir entre dos opciones de aumento de sueldo anual partiendo de un sueldo inicial de $\$600.000$: Opción A) Aumento aditivo de $\$40.000$ al año. Opción B) Aumento multiplicativo del $5\%$ al año ($r = 1,05$). Compara el sueldo en el año 4 ($n=4$) para ambas opciones.'
  pasos:
    - 'Paso 1: Evaluamos la Opción A (Aditiva): $a_n = 600.000 + (n - 1) \cdot 40.000$. Para $n=4$: $a_4 = 600.000 + 3 \cdot 40.000 = 600.000 + 120.000 = \$720.000$.'
    - 'Paso 2: Evaluamos la Opción B (Multiplicativa): $b_n = 600.000 \cdot (1,05)^{n-1}$. Para $n=4$: $b_4 = 600.000 \cdot (1,05)^3$.'
    - 'Paso 3: Calculamos la potencia: $(1,05)^3 = 1,157625$.'
    - 'Paso 4: Multiplicamos: $b_4 = 600.000 \cdot 1,157625 = \$694.575$. En el año 4 la **Opción A entrega $\$720.000$** y la **Opción B entrega $\$694.575$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de variación caracteriza formalmente a un proceso de cambio multiplicativo en comparación con uno aditivo?'
    choices:
      - {text: 'El cambio multiplicativo mantiene constante la variación relativa o porcentaje de cambio sobre la cantidad acumulada', is_correct: true}
      - {text: 'El cambio multiplicativo mantiene constante la diferencia numérica absoluta entre términos', is_correct: false}
      - {text: 'El cambio aditivo crece más rápido que el multiplicativo para cualquier número de pasos', is_correct: false}
      - {text: 'Ambos cambios son exactamente idénticos en todas sus propiedades', is_correct: false}
    explanation: 'La alternativa correcta es ''El cambio multiplicativo mantiene constante la variación relativa o porcentaje de cambio sobre la cantidad acumulada''. Variación relativa constante.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una población de 100 aves aumenta en 20 aves cada año (aditivo), ¿cuántas aves hay al cabo de 3 años ($n=4$)?'
    choices:
      - {text: '$a_4 = 160$ aves, calculando $100 + 3 \cdot 20 = 160$', is_correct: true}
      - {text: '$a_4 = 800$ aves, multiplicando $100 \cdot 8$', is_correct: false}
      - {text: '$a_4 = 120$ aves, sumando sólo 1 año', is_correct: false}
      - {text: '$a_4 = 200$ aves, duplicando la población', is_correct: false}
    explanation: 'La alternativa correcta es ''$a_4 = 160$ aves, calculando $100 + 3 \cdot 20 = 160$''. $100 + 60 = 160$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el estado inicial $a_1$ o $b_1$.'
  - 'Paso 2: Determinar la naturaleza de la tasa de cambio dada en el problema (monto fijo $+d \implies$ aditivo, tasa o porcentaje $\cdot r \implies$ multiplicativo).'
  - 'Paso 3: Construir el modelo correspondiente ($a_1 + (n-1)d$ o $b_1 \cdot r^{n-1}$).'
  - 'Paso 4: Sustituir la etapa $n$ requerida y calcular la cifra solicitada para realizar la comparación.'
errores_correccion: |
  - **Error 1:** Interpretar un aumento porcentual constante como si fuera un monto de dinero fijo. **Cómo corregirlo:** El aumento porcentual es **MULTIPLICATIVO ($1 + P/100$)**, por lo que el monto ganado **crece en cada período**.
  - **Error 2:** Creer que el cambio aditivo siempre es superior en las primeras etapas. **Cómo corregirlo:** Depende de los valores de $d$ y $r$; se debe **evaluar explícitamente ambas ecuaciones** para comparar.
ejemplos:
  - titulo: 'Ahorro aditivo vs multiplicativo'
    enunciado: 'Para $\$1.000$ iniciales a 3 años: Opción A ($+\$200$/año) vs Opción B ($+20\%$/año). ¿Cuál es el saldo final de la Opción B al año 4?'
    alternativas:
      - 'Opción B: $\$1.000 \cdot 1,20^3 = \$1.728$'
      - 'Opción B: $\$1.600$'
      - 'Opción B: $\$2.000$'
    respuesta: 'Opción B: $\$1.000 \cdot 1,20^3 = \$1.728$'
    solucion_pasos:
      - '1. Opción A: $1.000 + 3(200) = \$1.600$.'
      - '2. Opción B: $1.000 \cdot 1,20^3 = 1.000 \cdot 1,728 = \$1.728$. B es mayor.'
  - titulo: 'Pérdida aditiva vs multiplicativa'
    enunciado: 'Si una masa de 100 g pierde 10 g por minuto (aditivo), ¿a los 5 minutos quedan $100 - 5(10) = 50$ g?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $100 - 50 = 50$ g.'
  - titulo: 'Bacterias con cambio multiplicativo'
    enunciado: 'Un cultivo se triplica cada hora. ¿Su cambio es multiplicativo con $r = 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Multiplica por 3 en cada etapa.'
  - titulo: 'Tarifa telefónica aditiva'
    enunciado: 'Una tarifa de $\$5.000$ base más $\$50$ por minuto consumido, ¿representa un modelo de cambio aditivo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Agrega un monto constante $d = \$50$ por cada minuto.'
errores_frecuentes:
  - 'La razón multiplicativa r equivale numéricamente a la diferencia aditiva d al formular el término general.'
  - 'Un cambio aditivo produce incrementos numéricos crecientes en cada período de tiempo.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El interés simple (aditivo) y el interés compuesto (multiplicativo) producen rendimientos numéricos idénticos.'
  - 'Las tasas de cambio multiplicativas se pueden sumar linealmente entre períodos.'
afirmaciones_verdaderas:
  - 'El cambio aditivo se caracteriza por una diferencia absoluta constante ($a_{n+1} - a_n = d$), mientras que el multiplicativo presenta un cociente constante ($\frac{b_{n+1}}{b_n} = r$).'
  - 'En un proceso de cambio multiplicativo con $r > 1$, la cantidad de incremento por período aumenta de forma acelerada.'
al_terminar_debes_poder: 'Diferenciar entre cambio aditivo y multiplicativo analizando si la variación es una suma constante o un factor proporcional.'
