semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.CAMBIO_ADITIVO_MULTIPLICATIVO
resumen_inicial: 'Diferencia entre cambio aditivo y cambio multiplicativo en sucesiones: concepto
  y desarrollo dentro de Comparación y modelamiento con progresiones.'
explicacion_simple: '¿Tu sueldo crece de la misma manera que una infección viral? Afortunadamente
  no (o lamentablemente, dependiendo cómo lo mires). El universo matemático tiene dos engranajes
  principales: el que suma y el que multiplica.'
explicacion_formal: 'Lee atentamente los enunciados. Tienes que ser un detective de palabras
  clave:


  **Señales de Cambio Aditivo (Usa Progresión Aritmética):**

  - ''Aumenta en 5 litros por minuto''

  - ''Suma $\$500$ cada día''

  - ''Pierde 3 puntos por cada error''

  - Características: La gráfica de este crecimiento es una línea recta (Función Lineal).


  **Señales de Cambio Multiplicativo (Usa Progresión Geométrica):**

  - ''Aumenta un $5\%$ mensual'' (Porcentajes = Siempre P.G.)

  - ''Se duplica, se triplica, se reduce a la mitad''

  - ''Por cada hora, crece a un factor de 1.5''

  - Características: La gráfica es una curva que despega violentamente o cae en picada (Función
  Exponencial).'
definiciones_clave: '- **Diferencia entre cambio aditivo y cambio multiplicativo en sucesiones**:
  Concepto fundamental dentro del estudio de Comparación y modelamiento con progresiones.'
propiedades_relaciones: '- **Propiedades de Diferencia entre cambio aditivo y cambio multiplicativo
  en sucesiones**: Relaciones de cambio y fórmulas estructurales de comparación y modelamiento
  con progresiones.'
ejemplo_guiado:
  enunciado: Un estanque pierde 8 litros de agua cada hora por una fuga. Otro estanque pierde
    un 8 por ciento de su volumen actual cada hora. Clasifica ambos cambios.
  pasos:
  - 'En el primer estanque, la pérdida es siempre la misma cantidad fija, 8 litros, sin importar
    cuánta agua quede: es un cambio aditivo.'
  - En el segundo estanque, la pérdida depende del volumen actual, un 8 por ciento de lo que
    hay en ese momento, por lo tanto es un cambio multiplicativo.
  - Concluyo que el primer estanque se modela con una progresión aritmética, y el segundo
    con una progresión geométrica.
