procedimiento:
- Resolver la inecuación lineal si aún no está despejada para obtener una forma comparativa
  como $x > a$ o $x \leq a$.
- Dibujar una recta numérica y marcar el número límite $a$.
- Determinar si el círculo sobre $a$ debe ir relleno para desigualdades no estrictas
  o vacío para desigualdades estrictas.
- Trazar una flecha desde $a$ hacia la derecha para valores mayores, o hacia la izquierda
  para valores menores.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en expresión del conjunto solución
  en la recta numérica.
ejemplos:
- titulo: Representación gráfica de x mayor o igual a 3
  enunciado: Representa en la recta numérica la inecuación $x \geq 3$.
  solucion_pasos:
  - La desigualdad es $x \geq 3$.
  - Trazamos la recta numérica y ubicamos el número $3$.
  - Como el símbolo es $\geq$, incluimos el límite dibujando un círculo relleno en
    el $3$.
  - Trazamos una flecha hacia la derecha indicando todos los valores mayores que $3$.
- titulo: Representación gráfica de x menor que -2
  enunciado: Grafica el conjunto solución de la inecuación $x < -2$ en la recta numérica.
  solucion_pasos:
  - Tenemos la inecuación $x < -2$.
  - Dibujamos la recta y marcamos el valor límite $-2$.
  - Como el símbolo es $<$, el círculo sobre el $-2$ debe ir vacío.
  - Dibujamos la flecha hacia la izquierda porque los valores son menores que $-2$.
- titulo: ¿Círculo relleno o vacío?
  respuesta: Verdadero
  solucion_pasos:
  - La inecuación es $x \leq 5$.
  - El símbolo $\leq$ indica menor o igual, por lo tanto, el $5$ es parte de la solución.
  - Se representa con un círculo relleno en $x=5$ y una flecha a la izquierda. Efectivamente,
    la representación lleva círculo relleno.
- titulo: ¿Dirección hacia la izquierda para mayores?
  respuesta: Falso
  solucion_pasos:
  - La inecuación es $x > 4$.
  - El símbolo indica mayor que.
  - Los valores mayores que un número están a la derecha de ese número en la recta
    numérica.
  - Por lo tanto, la flecha debe apuntar hacia la derecha, no hacia la izquierda.
errores_frecuentes:
- Usar un círculo relleno cuando la desigualdad es estricta.
- Trazar la flecha hacia la izquierda cuando la variable es mayor al límite.
- Trazar la flecha hacia la derecha cuando la variable es menor al límite.
- Graficar el intervalo opuesto olvidando invertir el símbolo de desigualdad al dividir
  por un negativo previamente.
- Asumir que el círculo vacío incluye el número marcado en la solución.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  expresión del conjunto solución en la recta numérica.
