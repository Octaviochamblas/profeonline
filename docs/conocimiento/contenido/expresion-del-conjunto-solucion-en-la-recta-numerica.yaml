semantic_id: MAT.ALG.INECUACIONES_LINEALES.EXPRESION_RECTA
resumen_inicial: 'Expresión del conjunto solución en la recta numérica: relaciones
  de orden, intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: La representación gráfica en la recta numérica permite visualizar
  el conjunto solución de una inecuación lineal, interpretando correctamente el uso
  de intervalos abiertos y cerrados.
explicacion_formal: '### Definición formal

  Dada una inecuación en una variable $x$, su representación gráfica en la recta real
  es un intervalo que describe el conjunto solución. Sea $a \\in \\mathbb{R}$ un valor
  límite:

  - $x > a$: Semirrecta abierta a la derecha de $a$. En $a$ se utiliza un círculo
  sin rellenar.

  - $x \\geq a$: Semirrecta cerrada a la derecha de $a$. En $a$ se utiliza un círculo
  relleno.

  - $x < a$: Semirrecta abierta a la izquierda de $a$. En $a$ se utiliza un círculo
  sin rellenar.

  - $x \\leq a$: Semirrecta cerrada a la izquierda de $a$. En $a$ se utiliza un círculo
  relleno.


  ### Desarrollo didáctico

  Al resolver una inecuación, el resultado final es un conjunto infinito de valores.
  Para comprender mejor cuáles son estos valores, los dibujamos sobre una recta numérica.


  El primer paso es ubicar el número límite en la recta. Luego, observamos el símbolo
  de la desigualdad:

  - Si usamos mayor que ($>$) o mayor o igual que ($\\geq$), trazamos una flecha que
  va desde el número hacia la derecha.

  - Si usamos menor que ($<$) o menor o igual que ($\\leq$), trazamos una flecha que
  va desde el número hacia la izquierda.


  Finalmente, debemos indicar si el número límite forma parte de la solución o no
  mediante un pequeño círculo sobre el número:

  - Lo dibujamos vacío para $>$ y $<$, indicando que el límite no se incluye.

  - Lo dibujamos relleno para $\\geq$ y $\\leq$, indicando que el límite sí se incluye.'
definiciones_clave: '- **Expresión del conjunto solución en la recta numérica**: Concepto
