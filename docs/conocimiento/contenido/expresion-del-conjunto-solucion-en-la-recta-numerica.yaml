semantic_id: MAT.ALG.INECUACIONES_LINEALES.EXPRESION_RECTA
resumen_inicial: Representar el conjunto solución en la recta numérica exige trazar
  el número frontera y sombrear la región de valores permitidos.
explicacion_simple: 'Para graficar la solución de una inecuación en la recta real:

  1. Dibujamos la recta numérica y marcamos el número frontera $c$.

  2. Si es $>$ o $\ge$, sombreamos la recta hacia la **derecha** ($+\infty$).

  3. Si es $<$ o $\le$, sombreamos la recta hacia la **izquierda** ($-\infty$).

  4. Si incluye el igual ($\le, \ge$), pintamos el punto relleno ($\bullet$). Si es
  estricto ($<, >$), dejamos el círculo transparente ($\circ$).'
explicacion_formal: 'La **representación isomórfica de la solución inecuacional**
  proyecta:


  $$x \ge c \implies \text{Punto } \bullet \text{ en } c \text{ y rayado de la franja
  } [c, +\infty[$$

  $$x < c \implies \text{Punto } \circ \text{ en } c \text{ y rayado de la franja
  } ]-\infty, c[$$'
definiciones_clave: '- **Gráfica de solución inecuacional**: Visualización continua
  sobre la recta numérica del subconjunto solución.'
propiedades_relaciones: '- **Consistencia gráfica**: El sentido del rayado coincide
  con la dirección señalada por la flecha del símbolo ($>$ hacia la derecha, $<$ hacia
  la izquierda).'
ejemplo_guiado:
  enunciado: Describe la gráfica en la recta numérica para las soluciones $x \ge 2$
    y $x < -1$.
  pasos:
  - 'Paso 1: Para $x \ge 2$: ubicar el $2$, dibujar punto relleno ($\bullet$) y sombrear
    hacia la derecha.Paso 2: Para $x < -1$: ubicar el $-1$, dibujar círculo vacío
    ($\circ$) y sombrear hacia la izquierda.Paso 3: Concluir que las gráficas representan
    $[2, +\infty[$ y $]-\infty, -1[$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: En la gráfica de la solución $x \ge 2$, ¿hacia qué dirección se debe sombrear
    la recta numérica?
  choices:
  - text: Hacia la derecha, en dirección al $+\infty$.
    is_correct: true
  - text: Hacia la izquierda, en dirección al $-\infty$.
    is_correct: false
  - text: Únicamente sobre el número 0.
    is_correct: false
  - text: No se sombrea nada.
    is_correct: false
  explanation: La alternativa correcta es 'Hacia la derecha, en dirección al $+\infty$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la solución $x < -1$, ¿qué marcador se debe colocar en el número
    $-1$?
  choices:
  - text: Un círculo transparente sin rellenar ($\circ$).
    is_correct: true
  - text: Un punto totalmente relleno ($\bullet$).
    is_correct: false
  - text: Una cruz roja.
    is_correct: false
  - text: Un corchete cerrado.
    is_correct: false
  explanation: La alternativa correcta es 'Un círculo transparente sin rellenar ($\circ$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar el eje horizontal real.'
- 'Paso 2: Ubicar el número límite.'
- 'Paso 3: Marcar punto relleno ($\bullet$) para $\le, \ge$ o punto vacío ($\circ$)
  para $<, >$.'
- 'Paso 4: Trazar el rayado hacia la derecha para $>$ o hacia la izquierda para $<$.'
errores_correccion: '- **Error común:** Sombrear hacia la izquierda en una desigualdad
  de mayor que ($x > 2$).

  - **Cómo corregirlo:** El símbolo $>$ apunta hacia la derecha, por lo que el rayado
  DEBE ir hacia la derecha.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Olvidar invertir el sentido del símbolo de desigualdad al dividir o multiplicar
  por un coeficiente negativo.
- Confundir la solución de una inecuación con una solución puntual única propia de
  una ecuación.
- Multiplicar por el m.c.m. los términos fraccionarios pero omitir los términos enteros
  independientes.
- Poner corchete cerrado en las cotas infinitas $+\infty$ ó $-\infty$.
- Confundir una inecuación sin solución ($S = \emptyset$) con una que tiene solución
  real total ($S = \mathbb{R}$).
afirmaciones_verdaderas:
- Una inecuación lineal de primer grado es una desigualdad algebraica cuya solución
  se expresa comúnmente como un intervalo real.
- Si las variables se cancelan por completo y resulta una constante numérica verdadera,
  el conjunto solución abarca a todos los números reales ($S = \mathbb{R}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver analíticamente
  cualquier inecuación lineal, expresando su conjunto solución en notación de intervalo
  y gráfica.
fuente: Texto escolar MINEDUC — Álgebra / Inecuaciones Lineales
