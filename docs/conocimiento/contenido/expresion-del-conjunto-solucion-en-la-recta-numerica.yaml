semantic_id: MAT.ALG.INECUACIONES_LINEALES.EXPRESION_RECTA
resumen_inicial: Representar el conjunto solución en la recta numérica exige trazar el número frontera y sombrear la región de valores permitidos.
explicacion_simple: '![Expresión del conjunto solución en la recta numérica](/static/img/nodos/expresion-del-conjunto-solucion-en-la-recta-numerica-intro.svg)


  Para graficar la solución de una inecuación en la recta real:

  1. Dibujamos la recta numérica y marcamos el número frontera $c$.

  2. Si es $>$ o $\ge$, sombreamos la recta hacia la **derecha** ($+\infty$).

  3. Si es $<$ o $\le$, sombreamos la recta hacia la **izquierda** ($-\infty$).

  4. Si incluye el igual ($\le, \ge$), pintamos el punto relleno ($\bullet$). Si es estricto ($<, >$), dejamos el círculo transparente ($\circ$).'
explicacion_formal: 'La **representación isomórfica de la solución inecuacional** proyecta:


  $$x \ge c \implies \text{Punto } \bullet \text{ en } c \text{ y rayado de la franja } [c, +\infty[$$

  $$x < c \implies \text{Punto } \circ \text{ en } c \text{ y rayado de la franja } ]-\infty, c[$$'
definiciones_clave: '- **Gráfica de solución inecuacional**: Visualización continua sobre la recta numérica del subconjunto solución.'
propiedades_relaciones: '- **Consistencia gráfica**: El sentido del rayado coincide con la dirección señalada por la flecha del símbolo ($>$ hacia la derecha, $<$ hacia la izquierda).'
ejemplo_guiado:
  enunciado: '![Ejemplo Expresión del conjunto solución en la recta numérica](/static/img/nodos/expresion-del-conjunto-solucion-en-la-recta-numerica-ejemplos.svg)


    Describe la gráfica en la recta numérica para las soluciones $x \ge 2$ y $x < -1$.'
  pasos:
  - 'Paso 1: Para $x \ge 2$: ubicar el $2$, dibujar punto relleno ($\bullet$) y sombrear hacia la derecha.Paso 2: Para $x < -1$: ubicar el $-1$, dibujar círculo vacío ($\circ$) y sombrear hacia la izquierda.Paso 3: Concluir que las gráficas representan $[2, +\infty[$ y $]-\infty, -1[$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: En la gráfica de la solución $x \ge 2$, ¿hacia qué dirección se debe sombrear la recta numérica?
  choices:
  - text: Hacia la derecha, en dirección al $+\infty$.
    is_correct: true
  - text: Hacia la izquierda, en dirección al $-\infty$.
    is_correct: false
  - text: Únicamente sobre el número 0.
    is_correct: false
  - text: No se sombrea nada.
    is_correct: false
  explanation: La alternativa correcta es 'Hacia la derecha, en dirección al $+\infty$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la solución $x < -1$, ¿qué marcador se debe colocar en el número $-1$?
  choices:
  - text: Un círculo transparente sin rellenar ($\circ$).
    is_correct: true
  - text: Un punto totalmente relleno ($\bullet$).
    is_correct: false
  - text: Una cruz roja.
    is_correct: false
  - text: Un corchete cerrado.
    is_correct: false
  explanation: La alternativa correcta es 'Un círculo transparente sin rellenar ($\circ$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar el eje horizontal real.'
- 'Paso 2: Ubicar el número límite.'
- 'Paso 3: Marcar punto relleno ($\bullet$) para $\le, \ge$ o punto vacío ($\circ$) para $<, >$.'
- 'Paso 4: Trazar el rayado hacia la derecha para $>$ o hacia la izquierda para $<$.'
errores_correccion: '- **Error común:** Sombrear hacia la izquierda en una desigualdad de mayor que ($x > 2$).

  - **Cómo corregirlo:** El símbolo $>$ apunta hacia la derecha, por lo que el rayado DEBE ir hacia la derecha.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- En la gráfica de la solución $x \ge 2$, el extremo $2$ se dibuja con un círculo vacante sin rellenar.
- Representar el conjunto solución de $x < -1$ en la recta real exige sombrear la región a la derecha de $-1$.
- Una solución de inecuación gráfica se representa únicamente marcando los valores enteros de la recta.
- La gráfica de la desigualdad estricta $x > 4$ utiliza un punto relleno cerrado sobre el valor $4$.
- Al graficar soluciones con infinitos ($-\infty$ o $+\infty$), la línea sombreada termina en un punto cerrado fijo.
afirmaciones_verdaderas:
- En la recta numérica, una solución con operador estricto ($<, >$) se representa con círculo abierto y no estricto ($\le, \ge$) con punto relleno.
- La región sombreada con su flecha direccional indica la totalidad continua de soluciones reales.
al_terminar_debes_poder: '**QUÉ:** Graficar el conjunto solución de una inecuación lineal en la recta real.


  **CÓMO:** Trazando una semirrecta sombreada continua desde el valor frontera, empleando círculo relleno ($\bullet$) o vacío ($\circ$).


  ![Resumen Expresión del conjunto solución en la recta numérica](/static/img/nodos/expresion-del-conjunto-solucion-en-la-recta-numerica-resumen.svg)'
