semantic_id: MAT.GEO.CARTESIANO_BASE.CUADRANTES
resumen_inicial: 'Identificación de los cuatro cuadrantes del plano cartesiano: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Los dos ejes del plano cartesiano lo dividen en 4 regiones, llamadas
  cuadrantes, numeradas de la I a la IV siguiendo el sentido contrario a las manecillas
  del reloj.
explicacion_formal: '![Cuadrantes del plano cartesiano](/static/img/geometria/cartesiano-vectores/cartesiano-cuadrantes.svg)


  ### Definición formal


  El eje de las abscisas y el eje de las ordenadas dividen al plano cartesiano en
  cuatro regiones llamadas cuadrantes, numeradas con números romanos en sentido antihorario:
  I (superior derecho), II (superior izquierdo), III (inferior izquierdo) y IV (inferior
  derecho).


  ### Desarrollo didáctico


  En la figura, cada cuadrante está identificado con su número romano correspondiente.
  Esta numeración es una convención universal en matemáticas, siempre en sentido antihorario
  comenzando por el cuadrante superior derecho.'
definiciones_clave: '- **Identificación de los cuatro cuadrantes del plano cartesiano**:
