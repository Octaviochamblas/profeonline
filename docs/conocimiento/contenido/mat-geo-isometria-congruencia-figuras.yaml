procedimiento:
- 'Paso 1: Identifica las dos figuras que se quiere comparar (preimagen e imagen).'
- 'Paso 2: Verifica si existe una isometría (traslación, simetría o rotación) que
  transforme una en la otra.'
- 'Paso 3: Si tal isometría existe, concluye que ambas figuras son congruentes.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con relación entre isometría y congruencia de figuras.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de relación entre isometría y congruencia de figuras
    para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando relación entre isometría y congruencia de figuras.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de relación entre isometría y congruencia
    de figuras y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de relación entre isometría y congruencia de figuras.
- titulo: ¿Se cumple siempre la propiedad principal de relación entre isometría y
    congruencia de figuras en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede relación entre isometría y congruencia de figuras asumir un valor
    negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en relación entre isometría y congruencia
  de figuras.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en relación entre
  isometría y congruencia de figuras.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en relación entre
  isometría y congruencia de figuras.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de relación
  entre isometría y congruencia de figuras.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
