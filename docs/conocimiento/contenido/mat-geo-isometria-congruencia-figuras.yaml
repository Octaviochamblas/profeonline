semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.CONGRUENCIA_FIGURAS
resumen_inicial: 'Relación entre isometría y congruencia de figuras: conceptos, teoremas,
  propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: Si dos figuras son congruentes, siempre existe una forma de 'moverlas'
  (trasladar, reflejar o rotar) una hasta hacerla coincidir exactamente con la otra.
explicacion_formal: '![Relación entre isometría y congruencia](/static/img/geometria/isometrias/isometria-congruencia-figuras.svg)


  ### Definición formal


  Dos figuras $F$ y $F''$ son congruentes si y solo si existe una isometría que transforma
  $F$ en $F''$. Esta es una relación de equivalencia: toda isometría preserva la congruencia,
  y toda congruencia puede explicarse mediante alguna isometría.


  ### Desarrollo didáctico


  En la figura, el triángulo $ABC$ y su imagen $A''B''C''$ son congruentes ($ABC\cong
  A''B''C''$): tienen lados y ángulos correspondientes iguales, y existe una traslación
  que transforma uno en el otro.'
definiciones_clave: '- **Relación entre isometría y congruencia de figuras**: Elemento
  o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre isometría y congruencia de
  figuras.'
ejemplo_guiado:
  enunciado: En la aplicación de relación entre isometría y congruencia de figuras,
    se establece una razón $k = 2.0$ entre dos figuras homólogas de longitud original
    $L = 35\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de relación entre isometría y congruencia de figuras.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 2.0 \cdot 35$.'
  - Concluir que la medida obtenida en relación entre isometría y congruencia de figuras
    es $L' = 70.0\text{ cm}$.
