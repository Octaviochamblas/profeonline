semantic_id: MAT.GEO.RECTA_RELACIONES.PUNTOS_COLINEALES
resumen_inicial: 'Determinación de la colinealidad de tres puntos en el plano: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Tres puntos son colineales si, al unirlos, forman una única línea
  recta; esto se puede verificar comparando las pendientes entre distintos pares de
  esos puntos.
explicacion_formal: '![Colinealidad de tres puntos](/static/img/geometria/analitica/rectarel-puntos-colineales.svg)


  ### Definición formal


  Sean $A(x_1,y_1)$, $B(x_2,y_2)$ y $C(x_3,y_3)$. Son colineales si $\dfrac{y_2-y_1}{x_2-x_1}=\dfrac{y_3-y_2}{x_3-x_2}$.


  ### Desarrollo didáctico


  Para los puntos $A(-2,-2)$, $B(1,1)$ y $C(3,3)$: la pendiente entre $A$ y $B$ es
  $\dfrac{1-(-2)}{1-(-2)}=1$, y entre $B$ y $C$ es $\dfrac{3-1}{3-1}=1$. Como ambas
  pendientes son iguales, los tres puntos son colineales.'
