procedimiento:
- 'Paso 1: Sustituye la ecuación de la recta en la de la circunferencia para obtener
  una ecuación cuadrática.'
- 'Paso 2: Calcula el discriminante Δ=B²-4AC de esa ecuación cuadrática.'
- 'Paso 3: Interpreta el signo de Δ: positivo (secante), cero (tangente), negativo
  (exterior).'
