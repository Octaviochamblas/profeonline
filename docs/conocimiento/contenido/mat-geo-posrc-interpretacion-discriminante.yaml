- titulo: ¿Se cumple siempre la propiedad principal de interpretación del discriminante
    del sistema recta-circunferencia en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede interpretación del discriminante del sistema recta-circunferencia
    asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en interpretación del discriminante
  del sistema recta-circunferencia.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en interpretación
  del discriminante del sistema recta-circunferencia.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en interpretación
  del discriminante del sistema recta-circunferencia.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de interpretación
  del discriminante del sistema recta-circunferencia.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
