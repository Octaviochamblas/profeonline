semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.INTERPRETACION_DISCRIMINANTE
resumen_inicial: 'Interpretación del discriminante del sistema recta-circunferencia:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Al igual que en cualquier ecuación cuadrática, el discriminante
  anticipa cuántas soluciones reales existen, lo que en este contexto se traduce directamente
  en el tipo de posición relativa entre la recta y la circunferencia.
explicacion_formal: '![Interpretación del discriminante recta-circunferencia](/static/img/geometria/analitica/posrc-interpretacion-discriminante.svg)


  ### Definición formal


  El discriminante $\Delta=B^2-4AC$ de la ecuación cuadrática obtenida al sustituir
  la recta en la circunferencia determina el número de soluciones reales: dos si $\Delta>0$
  (secante), una si $\Delta=0$ (tangente), ninguna si $\Delta<0$ (exterior).


  ### Desarrollo didáctico


  En la figura, las rectas $y=2$, $y=4$ e $y=6$ se relacionan con la circunferencia
  $x^2+y^2=16$ (radio 4) de tres formas distintas: la primera es secante (discriminante
  positivo), la segunda es tangente (discriminante cero, ya que toca justo en el punto
  más alto), y la tercera es exterior (discriminante negativo).'
definiciones_clave: '- **Interpretación del discriminante del sistema recta-circunferencia**:
